---
# 02-postgres.yml — PostgreSQL, PgBouncer, roles, schemas on the data node
# The two roles carry their own tags, so --tags postgres / --tags pgbouncer run them separately.
- name: Configure PostgreSQL
  hosts: data
  become: true
  roles:
    - role: postgres
      tags: [postgres]
    - role: pgbouncer
      tags: [pgbouncer]
