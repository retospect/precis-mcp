---
# 19-pgpass.yml — Drop ~deploy/.pgpass + .psqlrc + PG* env defaults on all
# cluster nodes so bare `psql` lands on the data node/cluster as agent_rw.

- name: Distribute pgpass + psqlrc + PG env defaults
  hosts:
    - gateway
    - scheduler
    - data
    - inference
    - serving
    # compute hosts outside `serving` (a GB10 that only runs science lanes)
    # need the same agent_rw DSN for their heartbeat + compute lane.
    - compute
  become: true
  roles:
    - pgpass
  tags: [pgpass]
