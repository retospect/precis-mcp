# 35-precis-worker-sandbox.yml — the sandbox_run claimant lane on
# agent_sandbox_lane (agent_sandbox_hosts plus installed units; see HOST
# SELECTION below; agent-workspace-containers slice 1).
#
# WHY A DEDICATED UNIT. The job_claude_docker pass lives in the collapsed
# `--profile all` worker (20b) — which runs only on gateway+scheduler. The
# chosen sandbox host (castor; decisions Reto 2026-09-06) is a `serving`
# node: its system worker is heartbeat-only (20c, no queue claims) and its
# compute lane is `--only job_ssh_node` (43). Without this unit, an enabled
# sandbox host has NOTHING running the pass. Same lane shape as 43: one
# narrow `--only` worker, short idle, detached podman children.
#
# SECURITY SHAPE (matches sandbox_run's design): this unit's process holds
# the worker DSN and resolves CLAUDE_CODE_OAUTH_TOKEN from the DB vault at
# launch time (secrets.py; no token in this unit's env file). The gateway
# host is hard-excluded from agent_sandbox_hosts by the job_type itself.
#
# HOME=/home/deploy is load-bearing: the executor launches rootless podman
# as this unit's user, and podman resolves `code-task:latest` from
# $HOME-anchored container storage — the SAME storage playbooks/
# 34-code-task-image.yml builds into (podman as deploy). A diverging HOME
# (43 uses /var/lib/precis for MACE-cache reasons) would make the built
# image invisible to the worker.

# HOST SELECTION (gr485861). The lane runs on `agent_sandbox_lane`: every
# declared agent_sandbox_hosts member, plus any Linux host that already has
# precis-worker-sandbox.service installed. The declared group was emptied
# 2026-09-10 (lane dark; playbooks 34/35 went red against an unprovisioned
# host), but the unit stayed installed and enabled on the former member
# and came back with the host — so the play ran nowhere while the unit ran
# stale code. An
# installed unit proves the host was provisioned for the lane, so refreshing
# it cannot hit the unprovisioned-host failure; a host without the unit is
# never selected. The submit allowlist (PRECIS_SANDBOX_HOSTS) still comes
# from the declared group alone, so adopting an installed unit keeps it
# fresh without opening the lane to new submissions. Set
# `agent_sandbox_adopt_installed: false` to select the declared group only
# (redeploy's step-2f sweep then still bounces the orphan).
- name: Select the sandbox lane hosts (declared group + installed units)
  # :gateway — per-host isolation anchor (r36, gr488897), same as the lane
  # play below: every linux host failing the probe at once would otherwise
  # end the whole run. The anchor leaves in the first pre_task.
  hosts: linux:agent_sandbox_hosts:gateway
  gather_facts: false
  become: true
  pre_tasks:
    - name: "Isolation anchor: the gateway only keeps this play's batch alive"
      ansible.builtin.meta: end_host
      when: >-
        inventory_hostname not in
        ((groups['linux'] | default([])) + (groups['agent_sandbox_hosts'] | default([])))
  tasks:
    - name: Probe for an installed precis-worker-sandbox unit
      when:
        - os_family == "linux"
        - agent_sandbox_adopt_installed | default(true) | bool
      ansible.builtin.command:
        argv:
          - systemctl
          - list-unit-files
          - --no-legend
          - precis-worker-sandbox.service
      register: _sb_unit_probe
      changed_when: false
      failed_when: false
      ignore_unreachable: true

    - name: Join the sandbox lane group
      when: >-
        inventory_hostname in (groups['agent_sandbox_hosts'] | default([]))
        or 'precis-worker-sandbox.service' in (_sb_unit_probe.stdout | default(''))
      ansible.builtin.group_by:
        key: agent_sandbox_lane

- name: Deploy the sandbox_run worker lane (agent_sandbox_lane)
  # :gateway — the gateway joins only as the per-host isolation anchor
  # (gr488897 below): it leaves in the first pre_task. agent_sandbox_lane
  # membership is decided by the selection play above, so an adopted host
  # (installed unit, not in the declared group) stays in this batch.
  hosts: agent_sandbox_lane:gateway
  become: true
  # Per-host isolation (r36, gr488897): ansible ends the WHOLE playbook when
  # every host in one play's batch fails (playbook_executor: len(batch) ==
  # failed). This play's hosts can all fail together, and in r36 that stopped
  # the run before play 38 ever migrated. The gateway joins as an anchor and
  # leaves in its first pre_task, so the batch always has a survivor: a failed
  # or unreachable lane host is dropped for the rest of the run and named in
  # the PLAY RECAP, while every other host's plays still run.
  pre_tasks:
    - name: "Isolation anchor: the gateway only keeps this play's batch alive"
      ansible.builtin.meta: end_host
      when: inventory_hostname not in (groups['agent_sandbox_lane'] | default([]))
    - name: "host-lanes: this host's lanes fit its memory (roles/hardening budget)"
      ansible.builtin.import_role:
        name: hardening
        tasks_from: memory_budget
  vars:
    _sb_venv: /opt/precis/venv
    _sb_build_check_script: /opt/precis/bin/assert-unit-build.py
    _sb_dsn: "postgresql://agent_rw@{{ hostvars[postgres_host]['ansible_host'] }}:{{ pgbouncer_port }}/precis_prod"
  tasks:
    # Rootless podman needs /run/user/<uid> (XDG_RUNTIME_DIR), which
    # systemd only provisions for lingering users when nobody is logged
    # in. Without linger, a reboot leaves the lane broken until the next
    # interactive ssh login recreates it ("RunRoot not writable", seen
    # castor 2026-09-10, gr333244 thread).
    - name: enable linger for the sandbox lane user (rootless podman RunRoot)
      ansible.builtin.command: loginctl enable-linger deploy
      args:
        creates: /var/lib/systemd/linger/deploy

    - name: render + load the sandbox worker lane unit
      ansible.builtin.import_role:
        name: service_unit
      vars:
        service_unit_name: worker-sandbox
        service_unit_run_as: deploy
        service_unit_working_dir: /tmp
        service_unit_schedule:
          mode: keepalive
        # Restart-storm breaker, same bounds as the compute lane (43).
        service_unit_start_limit_interval_sec: 600
        service_unit_start_limit_burst: 8
        # 60s drain before SIGKILL — sandbox containers are detached
        # (conmon-owned) and survive a worker bounce; the next pass
        # re-adopts them by container name (claude_docker's poll).
        service_unit_timeout_stop_sec: 60
        # KillMode=process: the detached podman/conmon children must
        # survive this unit's restart (same reasoning as 43's NEB runs) —
        # reaping is by container name, never by this cgroup.
        service_unit_kill_mode: process
        # --only job_claude_docker: exactly one pass (poll + claim +
        # launch). --batch-size 1: one NEW launch per tick;
        # PRECIS_SANDBOX_CONCURRENCY (executor-side, default 2) caps
        # total in-flight regardless. Short idle so a freed slot refills
        # in seconds.
        service_unit_exec: >-
          {{ _sb_venv }}/bin/precis worker --only job_claude_docker
          --batch-size 1
          --idle-seconds {{ precis_worker_sandbox_idle_seconds | default(5) }}
        # PRECIS_ROOT (gr333438, ops half): same mount-namespace path every
        # node resolves via the fleet-wide `nas_root` (group_vars/all,
        # autofs-mounted on `hosts: all` — 05-autofs.yml, so this host
        # already carries it), mirrors roles/asa_bot's
        # `precis_root: "{{ nas_root }}/precis_root"` default without
        # depending on that role (not imported by this play — role defaults
        # only load when the role itself runs, same caveat 20d's own header
        # documents for its local-constant workaround). Sandbox jobs on this
        # lane read/write workspace files under PRECIS_ROOT
        # (utils/workspace.py); unset left them dark. NOTE: this comment
        # must stay OUTSIDE the `service_unit_env` folded scalar below — a
        # `#` inside a YAML block scalar lands IN the Jinja string, not as a
        # YAML comment (see 20b's own `_l_b_base_env` header for the same
        # trap).
        service_unit_env: >-
          {{ precis_shared_env | combine(precis_identity_env | default({})) | combine({
               'HOME': '/home/deploy',
               'PATH': _sb_venv + '/bin:/usr/local/bin:/usr/bin:/bin',
               'PGPASSFILE': '/home/deploy/.pgpass',
               'PRECIS_DATABASE_URL': _sb_dsn,
               'PRECIS_PROCESS': 'precis-worker-sandbox',
               'PRECIS_SOURCE': 'precis-worker-sandbox',
               'PRECIS_NODE': inventory_hostname,
               'PRECIS_SANDBOX_HOSTS': (groups['agent_sandbox_hosts'] | default([])) | join(','),
               'PRECIS_ROOT': nas_root ~ '/precis_root',
             }) }}

    # Code-refresh bounce — the ONLY restart this unit gets on a redeploy.
    # service_unit above restarts on a UNIT-FILE change only, and
    # redeploy-precis.yml's step-2 "Bounce all precis daemons" play targets
    # gateway/scheduler/inference — never this group — so a venv refresh
    # alone left the lane running pre-deploy code indefinitely (gr485861:
    # the unit ran pre-r35 code until a manual restart; the same gap
    # play 43's site.yml-path task covers for the compute lane). Fires
    # whenever a deploy did NOT prove this host's venvs static:
    # `precis_deploy_changed` is unset on this group either way (the
    # pre-flight play never targets agent_sandbox_lane), and a
    # defined-true must still bounce because no other play will. Only a
    # defined-false (a redeploy that found no managed venv moving) skips.
    # A host that left agent_sandbox_hosts but kept the unit is adopted by
    # the selection play above, so it is bounced here too.
    - name: Bounce the sandbox lane on a code refresh (no step-2 coverage — gr485861)
      when:
        - os_family == "linux"
        - precis_deploy_changed | default(true) | bool
      ansible.builtin.systemd:
        name: precis-worker-sandbox
        state: restarted
        daemon_reload: true
      failed_when: false
      register: _sb_bounce

    # gr479965 pattern, same script as the compute lane (play 43): a
    # `changed` restart proves only that systemd restarted the unit, not that
    # the new process runs the build this deploy installed. The check reads
    # the venv the unit's ExecStart names, compares its direct_url.json sha
    # with the deployed ref, and fails if the main process started before
    # that install.
    - name: "gr485861: render the post-bounce build check"
      when: os_family == "linux"
      ansible.builtin.copy:
        src: assert-unit-build.py
        dest: "{{ _sb_build_check_script }}"
        mode: "0755"
        owner: root
        group: root

    # Runs whenever the bounce ran (`is not skipped`, so a failed restart
    # hidden by the bounce's failed_when: false is caught here). The lane
    # has no ExecStartPre gate, so 20 x 15s is ample for `activating`.
    - name: "gr485861: assert the bounced sandbox lane runs the deployed build"
      when:
        - os_family == "linux"
        - _sb_bounce is not skipped
      ansible.builtin.command:
        argv:
          - python3
          - "{{ _sb_build_check_script }}"
          - precis-worker-sandbox
          - "{{ precis_worker_git_ref | default('') }}"
      register: _sb_build_check
      retries: 20
      delay: 15
      until: (_sb_build_check.rc | default(1)) == 0
      changed_when: false
