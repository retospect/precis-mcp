---
# 01-nfs.yml — NFS server on the data node, mounts on others
- name: Configure NFS server
  hosts: nfs_servers
  become: true
  roles:
    - nfs_server
  tags: [nfs, nfs_server]

- name: Mount NFS on clients
  hosts: nfs_clients
  become: true
  roles:
    - nfs_client
  tags: [nfs, nfs_client]

# The NAS backup share, DB node only (roles/nfs_client/tasks/dbbackup.yml);
# a no-op until the overlay names the share.
- name: Mount the NAS backup share on the DB node
  hosts: data
  become: true
  tasks:
    - name: Mount dbbackup
      ansible.builtin.include_role:
        name: nfs_client
        tasks_from: dbbackup
  tags: [nfs, nfs_client, dbbackup]
