---
# Retired 2026-10-16: the serving node runs SGLang (roles/sglang, 49a-sglang.yml); kept for the day a fixed vLLM image is pullable.
# 49-vllm.yml — vLLM as a permanent managed service on the vllm_serving host(s).
# See roles/vllm/README.md and me695305. The group
# normally holds ONE GB10 host, exclusive to this service. Not part of site.yml.
#
#   ansible-playbook playbooks/49-vllm.yml

- name: Run vLLM on the dedicated serving host
  hosts: vllm_serving
  become: false
  pre_tasks:
    - name: "host-lanes: this host's lanes fit its memory (roles/hardening budget)"
      ansible.builtin.import_role:
        name: hardening
        tasks_from: memory_budget
  roles:
    - vllm
  tags: [vllm]
