---
# Install Claude Code (the `claude` CLI) on the mac hosts that run it —
# the gateway (asa/planner spawns) and the scheduler-group worker node
# (in-proc claude -p ticks: gripe_triage, chase LLM verdicts, …). On a
# host whose host_vars set `claude_run_user` the role additionally creates
# the dedicated NON-ADMIN run user + PRECIS_CLAUDE_BIN wrapper and fails
# the deploy if that user is in `admin` or holds any sudo grant (Reto
# ruling 2026-10-26). See roles/claude_code/defaults/main.yml for the
# knobs; the post-install `claude login` is interactive and can't be
# automated.
- name: Install Claude Code on the mac claude hosts
  hosts:
    - gateway
    - scheduler
  roles:
    - claude_code
  tags: [claude-code, claude]
