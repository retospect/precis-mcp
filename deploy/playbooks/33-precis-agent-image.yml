---
# 33-precis-agent-image.yml — (Re)build the `precis-agent` container image
# (docker/Dockerfile `agent` target) whenever its baked precis-mcp code has
# drifted from the deploy's pinned sha (gr210220).
#
# ROOT CAUSE: the image was ONLY EVER built by hand (`docker build --target
# agent -t precis-agent:latest -f docker/Dockerfile .` — see the comment
# above the `agent` stage in docker/Dockerfile). No task in
# redeploy-precis.yml or any role built/pulled it; every deploy reinstalls
# the three venvs from the pinned sha, but the image sat baked at
# 2026-07-18 — pre-migration-0149 code — while the DB moved on. Every
# containerized dream/doctor tick and the plan_tick fix lane
# (workers/executors/agent_container.py) ran that stale wheel against a
# schema it didn't recognize and died with UndefinedColumn on every
# DB-backed verb — the root of the ~70-duplicate outage-gripe family
# (gr281493 canonical). This play closes that gap the same way
# 45-tts.yml (image-baked render engine) and 32-asa-code-refresh.yml
# (sha-pinned code refresh) already close it for their own artifacts.
#
# HOST SCOPE: the §13 container executor runs wherever PRECIS_AGENT_CONTAINER
# is set — today that's the `inference` group unconditionally
# (precis-worker-agent.service.j2's containerized structural/deep_review/
# diagram passes) and the `gateway` group behind `precis_agent_container_enabled`
# (20b-precis-worker-collapsed.yml; currently false pending the dream_agent
# containerization call — see 20b's header §L-b step 3). That's exactly
# `groups['gateway'] + groups['inference']`, the SAME union 20b itself gates
# the container env on — targeting it here too keeps the gateway's image
# warm for whenever that flag flips, at no cost while it's off (this play's
# own docker/colima probe below no-ops cleanly on any OTHER host, so listing
# just these two is a scope choice, not a correctness requirement).
#
# STALENESS PROBE (mirrors 32-asa-code-refresh.yml's sha preflight): the
# Dockerfile itself is untouched — `docker build --label
# org.precis.sha=<sha>` stamps the built commit as an OCI label at build
# time, read back next run via `docker image inspect -f
# '{{index .Config.Labels "org.precis.sha"}}'`. A missing label (every image
# built before this playbook existed, including the stale 2026-07-18 one, or
# no image at all) reads as stale → one guaranteed rebuild on first rollout,
# then converged like every other managed artifact. SAME → skipped;
# `-e precis_force_agent_image_build=true` overrides.
#
# BUILDX PREFLIGHT (gr303169, 2026-09-03 first real run): the Dockerfile
# requires BuildKit (`# syntax=docker/dockerfile:1.7`, `RUN --mount` in 6+
# places) — `DOCKER_BUILDKIT=0` is not an option. Homebrew's `docker` formula
# ships the CLI only; buildx is the separate `docker-buildx` formula (Docker
# Desktop bundles it, which is how the original 2026-07-18 image was built —
# this cluster runs the homebrew CLI, not Desktop). A host that passes the
# docker/colima probe but lacks buildx used to discover that only AFTER the
# multi-hour build-context transfer below, so the probe right after the
# runtime check fails the host immediately, before any transfer. macOS/
# homebrew hosts also get a self-heal install (brew install docker-buildx +
# symlink into ~/.docker/cli-plugins/) so the play converges on its own
# rather than needing a human to run the fix by hand; Linux hosts (docker-ce)
# typically bundle buildx already, so no install task runs there — the
# preflight still guards them in case that ever isn't true.
#
# BUILD SOURCE (gr302869, same first run): the build context is a
# `git archive` of the pinned sha, cut on THIS controller checkout and
# shipped as ONE tarball — mirrors roles/tts's `tts_src_dir` copy technique
# (`copy`, not `synchronize`: the controller's ssh-agent is flaky and
# synchronize spawns a fresh rsync ssh that fails agent auth — same
# reasoning as roles/tts/tasks/main.yml) for the transfer mechanism, but NOT
# for the payload: the original whole-tree `ansible.builtin.copy` (no
# excludes) file-by-file copied the ENTIRE controller checkout — `.git` plus
# every worktree under `.claude/worktrees/` — over ansible ssh, which took
# 2h11m on the first real run. `git archive <ref>` emits tracked files only
# (respects `.gitattributes` export-ignore, never touches `.git`/worktrees/
# caches) as one tar, so the transfer is back to the ~55 MB the old task
# comment already claimed. docker/Dockerfile's `agent` target (via `serve` →
# `builder-lite`) does `COPY . /build/precis-mcp/` then a LOCAL path
# `uv pip install` against the untarred context — unlike precis-tts's
# git+https `--build-arg` install, a git clone-by-sha on the build host would
# be redundant work the archive already does for free. Standalone runs (no
# `precis_target_sha` pinned) archive `main`.
#
# BUILD DIR (gr302869 pt.2 — concurrent-deploy race): the remote build dir is
# now SHA-named (`<base>/<sha>/`, `<base>/main/` standalone) instead of one
# shared path — two concurrent deploys writing the same `_agent_build_dir`
# used to race their (interleaving) copies. A sha-scoped dir isolates
# concurrent deploys of DIFFERENT shas and makes a re-run of the SAME sha
# resume/overwrite cleanly. Old sha dirs are swept after a successful build
# (keep-latest only) so the build host doesn't accumulate one dir per deploy
# forever.
#
# NO-OP GUARD: every task below is gated on a `docker/colima version` probe
# — a host with neither (no container executor lane wired up) is a clean
# no-op, same shape as 32's `/opt/asa/venv` stat guard. A real build failure
# still reddens the deploy (`failed_when` honest on the build task itself).
#
# DAEMON-SIDE REGISTRY PREFLIGHT (gr307314, 2026-09-04): a build died in ~10s
# unable to resolve/pull the BuildKit syntax frontend (`docker/dockerfile:1.7`)
# — colima/lima's VM-side DNS forwarder had a dead recycled AWS IP cached for
# registry-1.docker.io (TLS cert for a wrong domain, e.g. *.ezcld.net), while
# the HOST's own resolver was healthy the whole time. The buildx preflight
# above only checks the CLI plugin is present — nothing exercised daemon-side
# registry reachability before the (expensive) build-context transfer. A new
# pre-pull task below `docker pull`s the syntax frontend + base image THROUGH
# the daemon right after the buildx preflight, so a poisoned VM resolver fails
# fast with a diagnostic message instead of burning the context transfer; it
# doubles as a warm pull cache for the build task that follows.
#
# MIRROR FALLBACK (gr307314 comments 4-6, 2026-09-04): two further Hub outage
# modes hit the same day — an upstream routing blackhole to a slice of AWS
# us-east-1, then upstream DNS rotation serving a MIX of live and blackholed
# IPs (docker dials a dead one and times out while curl in the same VM lands
# lucky; colima restart does NOT help). mirror.gcr.io (Google's pull-through
# Hub cache) stayed reachable throughout both. The pre-pull now falls back to
# mirror.gcr.io refs when the canonical pulls fail, and the build task rides
# the same fallback via --build-arg BUILDKIT_SYNTAX (frontend ref override)
# + PYTHON_IMAGE (FROM base name; docker/Dockerfile parameterizes it, digest
# pin unchanged so the substitution is byte-identical). The assert only
# reddens when BOTH registries are unreachable, and its message discriminates
# the VM-resolver mode (colima restart helps) from the upstream-rotation mode
# (it doesn't — wait + spaced re-runs).
#
# Standalone runs:
#   ansible-playbook playbooks/33-precis-agent-image.yml -e precis_target_sha=<sha>
#   ansible-playbook playbooks/33-precis-agent-image.yml -e precis_force_agent_image_build=true

- name: "(Re)build the precis-agent image where the container executor lane runs"
  hosts: gateway:inference
  vars:
    _agent_image: "{{ precis_agent_image | default('precis-agent:latest') }}"
    _agent_image_ref: "{{ precis_target_sha | default('main') }}"
    # Same docker CLI the container executor itself dials — colima's docker
    # on the macOS gateway (precis_worker_agent_container_bin), system
    # docker on the Linux inference node (precis-worker-agent.service.j2).
    _agent_container_bin: >-
      {{ 'docker' if os_family == 'linux'
         else (precis_worker_agent_container_bin | default('/opt/homebrew/bin/docker')) }}
    # deploy owns both the colima VM/socket (gateway) and /usr/bin/docker
    # (inference — precis-worker-agent.service.j2's "no socket fight" note);
    # building as any other user would hit a permission-denied docker socket.
    _agent_build_user: deploy
    # SHA-scoped (gr302869 pt.2) — see the BUILD DIR header note above.
    _agent_build_base_dir: >-
      {{ '/tmp/precis-agent-build' if os_family == 'linux'
         else '/Users/deploy/.cache/precis-agent-build' }}
    _agent_build_dir: "{{ _agent_build_base_dir }}/{{ _agent_image_ref }}"
    # Apple Silicon layout — same assumption the docker default above makes.
    _agent_homebrew_prefix: /opt/homebrew
    _agent_homebrew_bin: "{{ _agent_homebrew_prefix }}/bin/brew"
    # ONE tarball, cut on the controller — see BUILD SOURCE above.
    _agent_archive_tar: "/tmp/precis-agent-build-context-{{ _agent_image_ref }}.tar"
  tasks:
    - name: Probe the container runtime (docker/colima) — absence is a clean no-op
      ansible.builtin.command: "{{ _agent_container_bin }} version --format '{{ '{{' }}.Server.Version{{ '}}' }}'"
      register: agent_runtime
      become: true
      become_user: "{{ _agent_build_user }}"
      changed_when: false
      failed_when: false

    - name: Report skip when no container runtime is present
      when: agent_runtime.rc != 0
      ansible.builtin.debug:
        msg: >-
          {{ inventory_hostname }}: no docker/colima runtime reachable at
          {{ _agent_container_bin }} (rc={{ agent_runtime.rc }}) — skipping
          the precis-agent image build (no container executor lane on this host).

    # ── buildx (gr303169) — fail fast, BEFORE any build-context transfer ──
    - name: "Ensure docker-buildx is installed + linked as a CLI plugin (macOS/homebrew self-heal)"
      when:
        - agent_runtime.rc == 0
        - os_family == "darwin"
      become: true
      become_user: "{{ _agent_build_user }}"
      environment:
        HOME: "/Users/{{ _agent_build_user }}"
      block:
        - name: Check whether the docker-buildx formula is already installed
          ansible.builtin.stat:
            path: "{{ _agent_homebrew_prefix }}/opt/docker-buildx"
          register: agent_buildx_formula

        - name: brew install docker-buildx (only when the formula is missing)
          when: not (agent_buildx_formula.stat.exists | default(false))
          ansible.builtin.command: "{{ _agent_homebrew_bin }} install docker-buildx"
          changed_when: true

        - name: Resolve the docker-buildx homebrew prefix
          ansible.builtin.command: "{{ _agent_homebrew_bin }} --prefix docker-buildx"
          register: agent_buildx_prefix
          changed_when: false

        - name: Ensure ~/.docker/cli-plugins exists
          ansible.builtin.file:
            path: "/Users/{{ _agent_build_user }}/.docker/cli-plugins"
            state: directory
            mode: "0755"

        - name: Symlink docker-buildx into the docker CLI plugins dir (idempotent — no churn on re-run)
          ansible.builtin.file:
            src: "{{ agent_buildx_prefix.stdout | trim }}/bin/docker-buildx"
            dest: "/Users/{{ _agent_build_user }}/.docker/cli-plugins/docker-buildx"
            state: link
            force: true

    - name: "Preflight: docker buildx must be reachable (gr303169 — fail fast, before the context transfer)"
      when: agent_runtime.rc == 0
      ansible.builtin.command: "{{ _agent_container_bin }} buildx version"
      environment:
        DOCKER_BUILDKIT: "1"
      register: agent_buildx_probe
      become: true
      become_user: "{{ _agent_build_user }}"
      changed_when: false
      failed_when: false

    - name: "Fail this host if buildx is still unreachable (self-heal above should have fixed macOS)"
      when: agent_runtime.rc == 0
      ansible.builtin.assert:
        that: agent_buildx_probe.rc == 0
        quiet: true
        fail_msg: >-
          {{ inventory_hostname }}: `{{ _agent_container_bin }} buildx version` failed
          (rc={{ agent_buildx_probe.rc }}) — the precis-agent image's Dockerfile requires
          BuildKit (`# syntax=docker/dockerfile:1.7`, `RUN --mount`), so
          DOCKER_BUILDKIT=0 is not an option. Fix: `brew install docker-buildx` then
          `ln -sfn "$(brew --prefix docker-buildx)/bin/docker-buildx"
          ~/.docker/cli-plugins/docker-buildx` (Docker Desktop bundles buildx already;
          a homebrew-CLI-only docker install does not). On macOS this play's own
          self-heal task should have done this automatically — a red here means that
          install itself failed (check its output above).

    # ── daemon-side registry pre-pull (gr307314) — fail fast, BEFORE the
    # build-context transfer, on the SAME kind of daemon-side-only failure
    # the buildx preflight above can't see (buildx presence != registry
    # reachability through the daemon's own resolver).
    - name: "Resolve the images the agent build needs (BuildKit syntax frontend + FROM base), from the controller's docker/Dockerfile"
      when: agent_runtime.rc == 0
      ansible.builtin.set_fact:
        _agent_pull_refs: >-
          {{
            [
              (lookup('file', playbook_dir + '/../../docker/Dockerfile').splitlines()[0]
                | regex_replace('^# syntax=', '')),
              (lookup('file', playbook_dir + '/../../docker/Dockerfile')
                | regex_search('ARG PYTHON_IMAGE=(\S+)', '\1'))[0] ~ '@' ~
                (lookup('file', playbook_dir + '/../../docker/Dockerfile')
                  | regex_search('ARG PYTHON_DIGEST=(\S+)', '\1'))[0]
            ] | unique
          }}

    # mirror.gcr.io equivalents (gr307314 comments 4-6): Google's pull-through
    # Hub cache stayed reachable through both 09-04 outage modes. Digest pins
    # are registry-independent (same manifest bytes), so a mirror pull is
    # byte-identical. Hub-official images gain the implicit `library/` prefix.
    - name: "Compute mirror.gcr.io fallback refs for the same images"
      when: agent_runtime.rc == 0
      ansible.builtin.set_fact:
        _agent_mirror_refs: >-
          {{ _agent_pull_refs
             | map('regex_replace', '^([^/]+)$', 'library/\1')
             | map('regex_replace', '^', 'mirror.gcr.io/')
             | list }}

    - name: "Preflight: pre-pull build images through the docker daemon, mirror fallback (gr307314 — warm cache + daemon-side registry reachability check)"
      when: agent_runtime.rc == 0
      ansible.builtin.shell: |
        set -uo pipefail
        canonical_ok=1
        {% for ref in _agent_pull_refs %}
        {{ _agent_container_bin }} pull {{ ref }} || canonical_ok=0
        {% endfor %}
        if [ "$canonical_ok" = "1" ]; then
          echo "PULL_SOURCE=canonical"
          exit 0
        fi
        echo "canonical registry unreachable — falling back to mirror.gcr.io" >&2
        {% for ref in _agent_mirror_refs %}
        {{ _agent_container_bin }} pull {{ ref }} || exit 1
        {% endfor %}
        echo "PULL_SOURCE=mirror"
      args:
        executable: /bin/bash
      register: agent_pull_probe
      become: true
      become_user: "{{ _agent_build_user }}"
      changed_when: >-
        'Downloaded newer image' in (agent_pull_probe.stdout | default(''))
        or 'Pulled' in (agent_pull_probe.stdout | default(''))
      retries: 3
      delay: 30
      until: agent_pull_probe.rc == 0
      failed_when: false

    - name: "Fail this host if BOTH the canonical registry and the mirror are unreachable through the daemon (gr307314)"
      when: agent_runtime.rc == 0
      ansible.builtin.assert:
        that: agent_pull_probe.rc == 0
        quiet: true
        fail_msg: >-
          {{ inventory_hostname }}: `{{ _agent_container_bin }} pull` failed after 3
          attempts (rc={{ agent_pull_probe.rc }}) for {{ _agent_pull_refs | join(', ') }}
          AND their mirror.gcr.io fallbacks — gr307314. Two known Hub failure modes
          would each have been rescued by the mirror, so a red here means broader
          registry unreachability. Discriminate from the HOST shell with
          `curl -m 8 https://registry-1.docker.io/v2/` (healthy = HTTP 401):
          (a) host curl healthy but daemon pulls dead = VM-side resolver trouble —
          a stale /etc/hosts pin inside the colima VM or a poisoned lima forwarder
          cache (`colima restart` helps ONLY this mode); (b) host curl also
          timing out, or intermittent = upstream DNS rotation serving a mix of
          live and blackholed IPs — no local remedy; wait and re-run this play
          spaced (back-to-back retries lose). Details + probe recipes: gr307314.

    - name: "Record whether the build must use the mirror refs (canonical registry was unreachable)"
      when: agent_runtime.rc == 0
      ansible.builtin.set_fact:
        _agent_pull_via_mirror: >-
          {{ 'PULL_SOURCE=mirror' in (agent_pull_probe.stdout | default('')) }}

    - name: Read the resident precis-agent image's baked sha (OCI label)
      when: agent_runtime.rc == 0
      ansible.builtin.shell: |
        set -uo pipefail
        {{ _agent_container_bin }} image inspect {{ _agent_image }} \
          -f '{{ "{{" }}index .Config.Labels "org.precis.sha"{{ "}}" }}' 2>/dev/null || true
      args:
        executable: /bin/bash
      register: agent_label_probe
      become: true
      become_user: "{{ _agent_build_user }}"
      changed_when: false

    - name: Decide whether the precis-agent image is stale (gate the rebuild)
      when: agent_runtime.rc == 0
      ansible.builtin.set_fact:
        agent_image_stale: >-
          {{ (agent_label_probe.stdout | default('') | trim)
             not in [_agent_image_ref] }}

    - name: "(Re)build the precis-agent image on the pinned sha"
      when:
        - agent_runtime.rc == 0
        - (agent_image_stale | default(true) | bool) or (precis_force_agent_image_build | default(false) | bool)
      become: true
      become_user: "{{ _agent_build_user }}"
      block:
        - name: Ensure the (sha-scoped) build context dir on the host
          ansible.builtin.file:
            path: "{{ _agent_build_dir }}"
            state: directory
            mode: "0755"

        - name: "Build the git-archive build-context tarball (controller; tracked files only, gr302869)"
          # git archive — NOT the old whole-tree `copy` — so `.git` and every
          # worktree under `.claude/worktrees/` never leave the controller.
          # Cut from the pinned sha (or `main` on a standalone run), matching
          # `_agent_image_ref`/the OCI label exactly.
          delegate_to: localhost
          become: false
          vars:
            # ansible.cfg's remote_tmp is a CLUSTER path owned by the remote
            # user — on the controller it can be owned by a different local
            # user, which makes a localhost-delegated task UNREACHABLE at
            # tmpdir creation. Same override redeploy-precis.yml's 0b2 uses.
            ansible_remote_tmp: "~/.ansible/tmp"
          ansible.builtin.command:
            cmd: "git archive --format=tar -o {{ _agent_archive_tar }} {{ _agent_image_ref }}"
            chdir: "{{ playbook_dir }}/../.."
          register: agent_archive_build
          changed_when: true

        - name: Copy the build-context tarball to the host (ONE file — ansible's own ssh, not synchronize)
          # copy (not synchronize) rides ansible's own ssh — mirrors
          # roles/tts's tts_src_dir copy (the controller's ssh-agent is
          # flaky and synchronize spawns a fresh rsync ssh that fails agent
          # auth). Now a single git-archive tarball instead of the whole
          # checkout (gr302869): the old whole-repo `copy` had no excludes
          # and recursively file-by-file copied the ENTIRE controller
          # checkout — .git plus ~28 worktrees under .claude/worktrees/ —
          # gigabytes over ansible ssh, 2h11m on the first real run.
          ansible.builtin.copy:
            src: "{{ _agent_archive_tar }}"
            dest: "{{ _agent_build_dir }}/build-context.tar"
            mode: preserve

        - name: Untar the build context on the host
          # Plain `tar -xf`, not the unarchive module: unarchive requires
          # GNU tar on the target and macOS ships only BSD tar, so it
          # falls back to /usr/bin/unzip and dies on a .tar (seen on the
          # first real run of this play).
          ansible.builtin.command:
            cmd: "tar -xf build-context.tar"
            chdir: "{{ _agent_build_dir }}"
          changed_when: true

        - name: Remove the tarball on the host (keep the build dir lean)
          ansible.builtin.file:
            path: "{{ _agent_build_dir }}/build-context.tar"
            state: absent

        - name: docker build --target agent (BuildKit; label stamps the built sha)
          # When the pre-pull fell back to mirror.gcr.io, point the build's two
          # registry fetches there too: BUILDKIT_SYNTAX overrides the
          # `# syntax=` frontend ref, PYTHON_IMAGE the FROM base name (digest
          # pin unchanged — same bytes, different registry). gr307314.
          ansible.builtin.command:
            cmd: >-
              {{ _agent_container_bin }} build
              --target agent
              -t {{ _agent_image }}
              --label org.precis.sha={{ _agent_image_ref }}
              {% if _agent_pull_via_mirror | default(false) | bool %}
              --build-arg BUILDKIT_SYNTAX={{ _agent_mirror_refs[0] }}
              --build-arg PYTHON_IMAGE={{ _agent_mirror_refs[1] | regex_replace('@.*$', '') }}
              {% endif %}
              -f docker/Dockerfile
              .
            chdir: "{{ _agent_build_dir }}"
          environment:
            DOCKER_BUILDKIT: "1"
          register: agent_build
          # retries=3/delay=30 (was 2/10, gr307314): back-to-back retries hit
          # the SAME poisoned daemon-side DNS cache entry every time — only a
          # wider spacing gives a stale/expired record a chance to clear.
          retries: 3
          delay: 30
          until: agent_build.rc == 0
          changed_when: >-
            'Successfully' in (agent_build.stdout + agent_build.stderr)
            or 'naming to' in (agent_build.stdout + agent_build.stderr)
          failed_when: agent_build.rc != 0

        - name: Clean up old precis-agent build dirs (gr302869 pt.2 — keep only the current sha)
          ansible.builtin.shell: |
            set -uo pipefail
            find "{{ _agent_build_base_dir }}" -mindepth 1 -maxdepth 1 -type d \
              ! -name "{{ _agent_image_ref }}" -exec rm -rf {} +
          args:
            executable: /bin/bash
          changed_when: false
          failed_when: false

        - name: Remove the controller-side tarball
          delegate_to: localhost
          become: false
          vars:
            ansible_remote_tmp: "~/.ansible/tmp"
          ansible.builtin.file:
            path: "{{ _agent_archive_tar }}"
            state: absent

    - name: Assert the precis-agent image is present
      when: agent_runtime.rc == 0
      ansible.builtin.command: "{{ _agent_container_bin }} image inspect {{ _agent_image }}"
      become: true
      become_user: "{{ _agent_build_user }}"
      register: agent_img
      changed_when: false
      failed_when: agent_img.rc != 0
      # Fails when the image is absent: (re)build with
      # -e precis_force_agent_image_build=true, or by hand per the `agent`
      # stage's comment in docker/Dockerfile.

    - name: Report precis-agent image outcome
      when: agent_runtime.rc == 0
      ansible.builtin.debug:
        msg: >-
          {{ inventory_hostname }}: precis-agent image
          {{ 'rebuilt' if ((agent_image_stale | default(true) | bool)
                           or (precis_force_agent_image_build | default(false) | bool))
             else 'unchanged (already pinned to ' ~ _agent_image_ref ~ ')' }}
