---
# 20-precis-worker.yml — Fan out the precis-mcp derived-artifact worker
# (`precis worker`) across every cluster node. Each daemon claims batches
# from the shared postgres queues (chunk_embeddings + chunk_summaries) on
# the data node; row-level locking arbitrates. Adding/removing nodes scales
# throughput linearly with no coordinator.
#
# Run order: requires postgres (02), ssh_tunnels (17) — workers connect
# via the local pgbouncer tunnel — and the mcps role's deploy user.
#
# Documented standalone entry point (the redeploy-precis.yml rollback path —
# see that playbook's step-1 comment), and roles/precis_worker's install
# task passes `--constraints /opt/precis/constraints.txt` — self-import the
# export/copy play here so a fresh/rollback run doesn't hard-fail on a
# missing constraints file.
- name: "Export uv.lock -> constraints file, copy to every host (standalone-safe self-import)"
  ansible.builtin.import_playbook: 03-precis-constraints.yml

- name: Deploy precis-mcp workers on all cluster nodes
  hosts:
    - gateway
    - scheduler
    # `data` (the DB node) is intentionally excluded: it hosts prod postgres on
    # a memory-constrained box, and a co-located worker + bge-m3 embedder
    # starved the DB into swap. The derived queues are pool-consumed
    # cluster-wide, so scheduler + inference absorb its share with no
    # throughput loss.
    - inference
  become: true
  roles:
    - precis_worker
  # ``precis-worker`` per the precis-* naming convention;
  # ``precis`` matches the family umbrella so ``--tags precis``
  # runs every precis-* play at once.
  tags: [precis-worker, precis]
