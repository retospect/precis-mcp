---
# 43-precis-worker-compute.yml — the dedicated GPU/compute worker lane.
#
# WHY THIS EXISTS. The one collapsed `precis worker --profile all` unit per
# host (20b) runs a SINGLE-THREADED serial round-robin over its handlers
# (workers/runner.py `run_loop`: `for handler in handlers: ...`). A slow
# pass (a Semantic-Scholar fetch, an embed batch) blocks the whole rotation,
# so `job_ssh_node` — the submit/poll executor that drives every node-pinned
# detached GPU job (autocatpath_seed, precis-dft's gpaw_relax) — only gets a
# turn once per multi-minute rotation. The GPU then sits idle between seeds
# not because it is busy but because the one worker thread is elsewhere, so a
# backlog of autocatpath seeds drains at ~1 seed per rotation instead of ~1
# per compute-completion (gr192371 / the q164903 drain).
#
# WHAT THIS IS. A second, tiny worker on the GPU node running ONLY
# `--only job_ssh_node`, polling every few seconds. It shares NOTHING with
# the collapsed worker except the postgres queue: `FOR UPDATE SKIP LOCKED`
# arbitrates claims (zero double-claim), and the `gpu` resource_slot
# (capacity=1, reserved at claim via meta.requires — the 47671907 fix) still
# serializes concurrent GPU compute, so this adds NO crash risk (catpath vs
# catpath vs dft stay one-at-a-time). The only cross-effect is the unlocked
# step-0 poll of in-flight jobs, shared with the collapsed worker's rare
# poll: both call the job_type's `poll` (a status check + idempotent
# terminalize) — no double GPU launch (submit is claim-path only, row-
# locked), worst case a duplicate cosmetic run_log/job_summary chunk in the
# narrow window both catch the same "done" tick. The fast lane almost always
# wins and terminalizes first, dropping the row out of the other's
# STATUS:running poll selection.
#
# WHY A SEPARATE UNIT, NOT A KNOB. The serial rotation has no per-pass
# priority; the only way to stop a slow pass starving job_ssh_node is a
# second scheduling lane. This mirrors the pre-collapse precedent (the
# cluster ran a second `--profile agent` worker alongside the system one,
# arbitrated the same way) — the collapse folded the PROFILES onto one unit,
# but a compute lane is a THROUGHPUT concern, orthogonal to profile.
#
# SCOPE / DEPENDENCIES. `inference` group only (the GPU node; topology.yml
# precis_capabilities.autocatpath / .dft both resolve to it). This playbook does
# NOT provision — it deliberately rides 20b's work and MUST run after it:
#   * the worker venv (/opt/precis/venv) is created + kept current by 20b
#     (running this standalone on an unprovisioned node crash-loops the unit
#     until 20b runs — acceptable for a satellite lane);
#   * the feature env drop-ins /etc/precis/autocatpath.env + /etc/precis/dft.env
#     are rendered by roles/autocatpath + roles/dft — the SAME files the
#     collapsed worker sources via its precis-worker.service.d/ drop-ins, so
#     the lane's PRECIS_NODE / PRECIS_AUTOCATPATH_* / PRECIS_DFT_* are
#     identical to the main worker's by construction, sourced here via
#     service_unit_env_files (NOT duplicated).
# Not importing roles/precis_worker is deliberate: doing so would (a) re-run
# its full provisioning (venv install + the `precis service seed` DB loop) a
# second time on the GPU node every deploy — 20b already did it back-to-back — and
# (b) fire that role's install handler, which is hardwired to bounce
# `precis-worker.service`, not this lane's unit.
#
# Run order: imported by BOTH site.yml and redeploy-precis.yml right after
# 20b. On redeploy the step-2 bounce play force-restarts
# precis-worker-compute.service with the rest (its `precis-*.service` glob),
# so it never runs stale code after a venv refresh; site.yml has no such
# blanket bounce, so the final task below covers that path (see its comment).
#
# VENV-READINESS RACE (gr199339). This playbook rides 20b's venv (see SCOPE /
# DEPENDENCIES above) but the two aren't atomic: a deploy can (re)start this
# unit while /opt/precis/venv still holds the PRIOR precis-mcp build. If that
# prior build's `precis worker --only` argparse `choices=` predates a pass
# name this playbook's ExecStart hard-codes (e.g. job_ssh_node landed after
# the installed build), argparse rejects it — a hard exit 2, every single
# start, crash-looping the unit (observed ~45 restarts). The lane itself is
# healthy; this is pure deploy-ordering — 20b's `uv pip install` finishing
# a few seconds after this play starts the unit. Fixed two ways, combined:
#   1. an ExecStartPre gate (below) that polls the INSTALLED venv's own
#      argparse choices and only lets ExecStart run once `job_ssh_node` is
#      actually present — self-checks the real failure surface instead of
#      guessing at a fixed sleep;
#   2. StartLimitIntervalSec/Burst (service_unit's systemd-only knobs) so
#      any OTHER residual crash-loop cause degrades to a bounded number of
#      attempts and a clearly "failed" unit, instead of restarting forever
#      (systemd's own default IntervalSec=10s is shorter than this unit's
#      RestartSec=30s throttle, so it never actually trips — the previous
#      45-restart storm ran with no limiter effectively active).

- name: Deploy the dedicated GPU/compute worker lane (job_ssh_node only)
  hosts: inference
  become: true
  vars:
    # Kept in sync with roles/precis_worker/defaults/main.yml — this playbook
    # deliberately does not import that role (see header), so its defaults are
    # not in scope. Both are cluster-stable constants (the DSN expression is
    # the same one every precis-* worker template builds).
    _compute_venv: /opt/precis/venv
    _compute_dsn: "postgresql://agent_rw@{{ hostvars[postgres_host]['ansible_host'] }}:{{ pgbouncer_port }}/precis_prod"
    # gr199339 gate window: 40 attempts * 15s = 10 minutes. TimeoutStartSec
    # below is set past this (see comment there) so the poll's own bound
    # decides the outcome, not systemd's start timeout racing it.
    _compute_gate_script: /opt/precis/bin/wait-for-job-ssh-node.sh
    _compute_gate_max_attempts: 40
    _compute_gate_interval_sec: 15
  tasks:
    - name: "gr199339: ensure the gate script's directory exists"
      # /opt/precis itself is created by roles/precis_worker/tasks/provision.yml
      # (20b, this playbook's dependency — see SCOPE header above); this is
      # just the one subdirectory under it, harmless if 20b hasn't run yet
      # since the copy task right after this one is what actually needs it.
      ansible.builtin.file:
        path: "{{ _compute_gate_script | dirname }}"
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: "gr199339: render the venv-readiness ExecStartPre gate script"
      # A dedicated script file, not an inline ExecStartPre shell one-liner —
      # systemd's Exec= line is tokenized by systemd's own parser, not POSIX
      # shell, so nesting a `python -c "<multi-statement script>"` there is a
      # quoting trap. A file sidesteps it entirely and is plain to read/test.
      # Checks the INSTALLED venv's actual `precis worker --only` argparse
      # choices (the literal failure surface below) rather than some proxy —
      # see src/precis/cli/worker.py `add_parser`'s `--only` choices=.
      ansible.builtin.copy:
        dest: "{{ _compute_gate_script }}"
        mode: "0755"
        owner: root
        group: root
        content: |
          #!/bin/sh
          # Managed by ansible (deploy/playbooks/43-precis-worker-compute.yml)
          # — `ansible_managed` is template-module-only; copy:content leaves
          # it undefined, which hard-fails the task.
          # wait-for-job-ssh-node.sh — ExecStartPre gate for
          # precis-worker-compute.service (gr199339): blocks ExecStart until
          # the installed venv's `precis worker --only` argparse choices
          # include job_ssh_node, so a deploy that (re)starts this unit
          # against a stale pre-job_ssh_node build waits for 20b's venv
          # refresh instead of crash-looping on argparse's exit 2.
          set -eu

          venv="{{ _compute_venv }}"
          max_attempts={{ _compute_gate_max_attempts }}
          interval={{ _compute_gate_interval_sec }}
          attempt=0

          # One-liner (semicolon-joined simple statements), deliberately —
          # a multi-line `python -c "..."` body inside a shell double-quoted
          # string comes out through this YAML block with this task's own
          # indentation baked in as leading whitespace on every line, which
          # Python then rejects as an IndentationError (top-level statements
          # must start at column 0). A single logical line sidesteps it.
          check="import argparse, sys; from precis.cli import worker as w; p = argparse.ArgumentParser(); s = p.add_subparsers(); w.add_parser(s); a = next(x for x in s.choices['worker']._actions if x.dest == 'only'); sys.exit(0 if 'job_ssh_node' in (a.choices or ()) else 1)"

          while true; do
            if "$venv/bin/python" -c "$check"; then
              exit 0
            fi
            attempt=$((attempt + 1))
            if [ "$attempt" -ge "$max_attempts" ]; then
              echo "wait-for-job-ssh-node: $venv still lacks the job_ssh_node pass after $((max_attempts * interval))s, giving up" >&2
              exit 1
            fi
            sleep "$interval"
          done

    - name: render + load the compute worker lane unit
      ansible.builtin.import_role:
        name: service_unit
      vars:
        service_unit_name: worker-compute
        service_unit_run_as: deploy
        service_unit_working_dir: /tmp
        service_unit_schedule:
          mode: keepalive
        # gr199339: block ExecStart until the installed venv's argparse
        # choices actually accept `--only job_ssh_node` (script rendered
        # above). TimeoutStartSec covers ExecStartPre too, so it must clear
        # the gate's own 40*15s=600s bound with room to spare, or systemd's
        # start-timeout would race the gate's own "giving up" exit and win
        # first on a slow node.
        service_unit_exec_start_pre:
          - "{{ _compute_gate_script }}"
        service_unit_timeout_start_sec: 660
        # Belt-and-braces restart-storm breaker for any OTHER residual start
        # failure (the gate above only covers the ONE known argparse-choices
        # race). service_unit_throttle_seconds stays at the role default
        # (30s, i.e. RestartSec=30) — with these bounds, 8 failed starts
        # 30s apart (240s) trips well inside a 600s window, so a genuine
        # crash loop degrades to systemd marking the unit "failed" after
        # ~8 attempts instead of the unbounded ~45-restart storm gr199339
        # observed (the previous default IntervalSec=10s < RestartSec=30s
        # meant the burst window always reset before it could ever trip).
        service_unit_start_limit_interval_sec: 600
        service_unit_start_limit_burst: 8
        # 60s drain before SIGKILL (spine slice 2) — the lane's ssh_node
        # jobs are detached and survive a worker bounce; this just gives
        # the claim/batch loop time to exit cleanly on SIGTERM.
        service_unit_timeout_stop_sec: 60
        # KillMode=process (not the systemd default control-group): detached
        # autocatpath seed children (start_new_session, re-adopted via
        # meta.compute_handle on the next claim) must survive this unit's
        # restart. Under the cgroup default, a bounce SIGKILLed the whole
        # cgroup and destroyed 10-15-min NEB runs on every deploy. Do NOT
        # copy this onto the collapsed worker lane — its agent containers
        # want group teardown.
        service_unit_kill_mode: process
        # --only job_ssh_node: this lane runs exactly one pass, the submit/poll
        # executor. --batch-size 1: one NEW claim per tick (the gpu slot
        # capacity=1 caps concurrent compute regardless); the step-0 poll of
        # ALL in-flight handles runs every tick independent of batch-size.
        # A short idle so a freed gpu slot is re-filled within seconds, not
        # once per collapsed-worker rotation — the whole point of the lane.
        service_unit_exec: >-
          {{ _compute_venv }}/bin/precis worker --only job_ssh_node
          --batch-size 1
          --idle-seconds {{ precis_worker_compute_idle_seconds | default(5) }}
        # The feature env (PRECIS_NODE, PRECIS_AUTOCATPATH_ENABLED /
        # _ROUTE_NODE, PRECIS_DFT_*) comes from these drop-ins — the exact
        # files roles/autocatpath + roles/dft render and the collapsed worker
        # already sources, so no duplication / no drift. `-` (in the template)
        # keeps them optional: absent → the lane starts with no PRECIS_NODE and
        # simply claims nothing (safe no-op) rather than failing to boot.
        service_unit_env_files:
          - /etc/precis/autocatpath.env
          - /etc/precis/dft.env
        # Core daemon env. PRECIS_PROCESS / PRECIS_SOURCE are distinct from the
        # collapsed worker's `precis-worker` so this lane's worker_logs rows are
        # separately observable. HOME=/var/lib/precis is load-bearing: the
        # detached MACE child inherits it and finds the pre-warmed
        # $HOME/.cache/mace weights (roles/autocatpath pre-seed). PGPASSFILE
        # points at the pgpass role's file directly (this unit's HOME diverges
        # from /home/deploy — §L gr171431). precis_shared_env for API-key
        # parity with every other precis-* unit; precis_identity_env combined
        # right after it so vault-sourced identity/contact values win over
        # the overlay's plaintext precis_shared_env (gr204873), before the
        # explicit overrides below.
        service_unit_env: >-
          {{ precis_shared_env | combine(precis_identity_env | default({})) | combine({
               'HOME': '/var/lib/precis',
               'PATH': _compute_venv + '/bin:/usr/local/bin:/usr/bin:/bin',
               'PGPASSFILE': '/home/deploy/.pgpass',
               'PRECIS_DATABASE_URL': _compute_dsn,
               'PRECIS_PROCESS': 'precis-worker-compute',
               'PRECIS_SOURCE': 'precis-worker-compute',
               'PRECIS_STRUCTURE_PREFLIGHT': '1',
             }) }}

    # Code-refresh bounce for the site.yml path ONLY. On redeploy, the step-2
    # bounce play restarts every precis-*.service (glob) gated on
    # `precis_deploy_changed`, which is set_fact'd in an early play and so is
    # already defined here — this task then SKIPS, avoiding a double restart.
    # site.yml never sets that fact, so `is not defined` is true there and this
    # restarts the lane to pick up a venv code refresh 20b installed (the
    # service_unit render above only restarts on a UNIT-FILE change, blind to a
    # code-only refresh — the staleness bug class the collapsed worker avoids
    # via its install-notify handler, which this lane deliberately doesn't
    # share; see header).
    - name: Bounce the compute lane on a code refresh (site.yml path)
      ansible.builtin.systemd:
        name: precis-worker-compute
        state: restarted
        daemon_reload: true
      when: precis_deploy_changed is not defined
      failed_when: false
  # `precis` family tag so `--tags precis` fans this out with the other
  # precis-* plays; `precis-worker-compute` for a targeted refresh.
  tags: [precis-worker-compute, precis]
