# 34-code-task-image.yml — (Re)build the `code-task` sandbox image on the
# agent_sandbox_hosts group (agent-workspace-containers slice 1; decisions
# Reto 2026-09-06: castor first, minimal python+uv+git image).
#
# The sandbox_run executor (workers/executors/claude_docker.py) launches
# rootless-podman containers as `deploy` from `code-task:latest` — an image
# that, until this play, existed only as a Dockerfile stage nothing built
# (the same never-built gap 33-precis-agent-image.yml closed for
# `precis-agent`, gr210220). Unlike 33 there is no build-context transfer
# problem: the `code-task` stage COPYs nothing from the repo ("rent the
# toolchain, own nothing" — see the stage header in docker/Dockerfile), so
# the whole context is the Dockerfile itself, shipped as one file.
#
# STALENESS PROBE: keyed on the **Dockerfile content hash** (label
# `org.precis.dockerfile-sha`), NOT the moving git sha — the Dockerfile
# is this build's ONLY input, so a git-sha key would re-trigger the
# (long, egress-dependent) build on every main-moving deploy for no
# content change. Missing image / missing label / different hash →
# rebuild; SAME → skipped. `-e precis_force_code_task_build=true`
# overrides. `org.precis.sha` is still stamped as provenance only.
# The build is wrapped in `timeout` — a sandbox host whose container
# egress silently blackholes a download host (castor's first run hung
# 40 min inside `curl deb.nodesource.com`; the UniFi-DPI TLS-block
# family) must fail the play boundedly, never wedge the deploy. When
# egress is blocked, build the image on the controller (full egress,
# same arm64) and hand-carry it:
#   docker build --target code-task -t code-task:latest \
#     --label "org.precis.dockerfile-sha=$(shasum -a 256 docker/Dockerfile | awk '{print $1}')" \
#     -f docker/Dockerfile docker/
#   docker save code-task:latest | gzip | ssh <host> 'gunzip | podman load'
# — the probe then converges on the label and skips.
#
# BUILDER: podman as `deploy` — the SAME user+runtime the executor launches
# with (precis-worker.service.j2 User=deploy; launch is deliberately
# podman-only), so the built image lands in exactly the storage the worker
# resolves `code-task:latest` from. The gateway host must never appear in
# agent_sandbox_hosts (the job_type hard-excludes it at submit anyway).
#
# Standalone runs:
#   ansible-playbook playbooks/34-code-task-image.yml
#   ansible-playbook playbooks/34-code-task-image.yml -e precis_force_code_task_build=true

- name: "(Re)build the code-task sandbox image on agent_sandbox_hosts"
  hosts: agent_sandbox_hosts
  vars:
    _ct_image_ref: "{{ precis_target_sha | default('main') }}"
    _ct_build_user: deploy
    _ct_build_base_dir: /tmp/precis-code-task-build
    _ct_build_dir: "{{ _ct_build_base_dir }}/{{ _ct_image_ref }}"
  tasks:
    - name: Resolve the sha to stamp (controller checkout)
      ansible.builtin.command:
        cmd: git rev-parse {{ _ct_image_ref }}
        chdir: "{{ playbook_dir }}/../.."
      delegate_to: localhost
      become: false
      run_once: true
      register: _ct_sha_probe
      changed_when: false

    - name: Ensure rootless podman is present (Linux sandbox host)
      ansible.builtin.apt:
        name: [podman, uidmap, slirp4netns]
        state: present
      become: true
      when: (os_family | default('linux')) == 'linux'

    # Rootless podman needs subordinate uid/gid ranges for the build
    # user or every layer unpack dies with "insufficient UIDs or GIDs
    # available in user namespace" (castor's first run — the system
    # `deploy` user predates any container use, so no range was ever
    # allocated). Base 655360 sits far above adduser's sequential
    # 100000+65536 allocations, so it can't collide with ranges the OS
    # hands to ordinary users. `podman system migrate` makes a running
    # podman notice the new ranges.
    - name: Ensure subordinate uid/gid ranges for the rootless build user
      ansible.builtin.lineinfile:
        path: "{{ item }}"
        line: "{{ _ct_build_user }}:655360:65536"
        regexp: "^{{ _ct_build_user }}:"
        create: true
        owner: root
        mode: "0644"
      become: true
      loop: [/etc/subuid, /etc/subgid]
      register: _ct_subids
      when: (os_family | default('linux')) == 'linux'

    - name: Apply the new subordinate ranges (podman system migrate)
      ansible.builtin.command:
        cmd: podman system migrate
      become: true
      become_user: "{{ _ct_build_user }}"
      when: _ct_subids is changed

    - name: Read the pinned python base digest off the Dockerfile
      ansible.builtin.shell:
        cmd: awk -F= '/^ARG PYTHON_DIGEST=/{print $2}' "{{ playbook_dir }}/../../docker/Dockerfile"
      delegate_to: localhost
      become: false
      run_once: true
      register: _ct_digest_probe
      changed_when: false

    - name: Hash the Dockerfile (the build's only input — the staleness key)
      ansible.builtin.shell:
        cmd: shasum -a 256 "{{ playbook_dir }}/../../docker/Dockerfile" | awk '{print $1}'
      delegate_to: localhost
      become: false
      run_once: true
      register: _ct_df_hash
      changed_when: false

    - name: Read the resident image's stamped Dockerfile hash (staleness probe)
      ansible.builtin.command:
        cmd: >-
          podman image inspect
          -f {% raw %}'{{ index .Config.Labels "org.precis.dockerfile-sha" }}'{% endraw %}
          code-task:latest
      become: true
      become_user: "{{ _ct_build_user }}"
      register: _ct_label
      failed_when: false
      changed_when: false

    - name: Decide staleness
      ansible.builtin.set_fact:
        _ct_stale: >-
          {{ (precis_force_code_task_build | default(false) | bool)
             or (_ct_label.rc != 0)
             or ((_ct_label.stdout | trim | replace("'", '')) != (_ct_df_hash.stdout | trim)) }}

    - name: Stage the build dir (Dockerfile-only context)
      ansible.builtin.file:
        path: "{{ _ct_build_dir }}"
        state: directory
        owner: "{{ _ct_build_user }}"
        mode: "0755"
      become: true
      when: _ct_stale | bool

    - name: Ship docker/Dockerfile (the only context the code-task stage needs)
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../../docker/Dockerfile"
        dest: "{{ _ct_build_dir }}/Dockerfile"
        owner: "{{ _ct_build_user }}"
        mode: "0644"
      become: true
      when: _ct_stale | bool

    # Docker Hub TLS is blocked/flaky from some cluster hosts (the same
    # outage family 33-precis-agent-image.yml's MIRROR FALLBACK note
    # documents — first real castor run died on `TLS handshake timeout`
    # to registry-1.docker.io). Pre-pull the pinned base; fall back to
    # mirror.gcr.io (Google's pull-through Hub cache). The digest pin is
    # unchanged either way, so the substitution is byte-identical; the
    # build below FROMs whichever name actually landed in storage via
    # --build-arg PYTHON_IMAGE (docker/Dockerfile parameterizes it).
    - name: Pre-pull the pinned python base (canonical registry)
      ansible.builtin.command:
        cmd: podman pull docker.io/library/python@{{ _ct_digest_probe.stdout | trim }}
      become: true
      become_user: "{{ _ct_build_user }}"
      register: _ct_pull
      failed_when: false
      changed_when: false
      when: _ct_stale | bool

    - name: Fall back to mirror.gcr.io for the base (Hub unreachable from this host)
      ansible.builtin.command:
        cmd: podman pull mirror.gcr.io/library/python@{{ _ct_digest_probe.stdout | trim }}
      become: true
      become_user: "{{ _ct_build_user }}"
      when: (_ct_stale | bool) and (_ct_pull.rc | default(0)) != 0

    - name: Pick the base image name the build will FROM
      ansible.builtin.set_fact:
        _ct_python_image: >-
          {{ 'mirror.gcr.io/library/python'
             if ((_ct_pull.rc | default(0)) != 0)
             else 'docker.io/library/python' }}
      when: _ct_stale | bool

    - name: Build code-task:<sha> + code-task:latest (podman, bounded, as the executor's user)
      ansible.builtin.command:
        cmd: >-
          timeout {{ precis_code_task_build_timeout_sec | default(3600) }}
          podman build --target code-task
          --build-arg PYTHON_IMAGE={{ _ct_python_image | trim }}
          -t code-task:{{ _ct_sha_probe.stdout | trim }}
          -t code-task:latest
          --label org.precis.dockerfile-sha={{ _ct_df_hash.stdout | trim }}
          --label org.precis.sha={{ _ct_sha_probe.stdout | trim }}
          -f {{ _ct_build_dir }}/Dockerfile
          {{ _ct_build_dir }}
      become: true
      become_user: "{{ _ct_build_user }}"
      when: _ct_stale | bool
      register: _ct_build

    - name: Sweep the build dir (converged; the image is the artifact)
      ansible.builtin.file:
        path: "{{ _ct_build_base_dir }}"
        state: absent
      become: true
      when: _ct_stale | bool
