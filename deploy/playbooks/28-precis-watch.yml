---
# 28-precis-watch.yml — multi-node inbox watcher.
# Replaces the legacy `extract_watch` role / 27-extract-watch.yml: same
# daemon shape (a `com.precis.watch` LaunchDaemon / precis-watch.service),
# but the watcher is `precis ingest --watch` (v8; legacy CLI name `precis
# watch`) writing into precis_prod, not
# acatome-extract writing into the non-existent `cluster` db.
#
# Run order: precis_worker (20) must run first — it provisions
# /opt/precis/venv which precis_watch reuses.

- name: Deploy precis-mcp inbox watcher
  # Multiple watchers are correctness-safe: precis_add takes a Postgres
  # advisory lock keyed on pdf_sha256 before invoking Marker, and the
  # file-move path tolerates FileNotFoundError as "another host won the
  # race". Each node ~adds a Marker's worth of capacity at the cost of
  # some duplicated NFS chatter + a persistent surya/torch residency.
  #
  # Two 32G nodes are deliberately EXCLUDED — scheduler and data. Each
  # co-hosts the embedder service + a system worker (and `data` is the prod
  # Postgres host besides), so the watcher's persistent surya/torch
  # residency + Marker peak spikes tip them into swap thrash on 32G:
  # scheduler hit ~93% swap (2026-07-24); data — the DB host — was pulled
  # out (2026-07-24, gripe 51406) since it was holding ~435M of surya OCR
  # models resident + a polling core mostly to LOSE the advisory-lock race
  # to better-placed hosts. The advisory-lock design means the remaining
  # watchers — gateway + inference (the GPU node with ample RAM) — still
  # cover the inbox: we lose Marker parallelism, not correctness. To re-add
  # a host, flip its `precis_watch_enabled` host_var to true.
  #
  # scheduler + data are in the hosts list so their exclusion is ENFORCED:
  # `precis_watch_enabled: false` (host_vars) makes the role tear the
  # daemon down there on every deploy, instead of relying on the one-off
  # plist-move + hosts-list omission.
  hosts:
    - gateway
    - inference
    - scheduler
    - data
  become: true
  roles:
    - precis_watch
  tags: [precis_watch]
