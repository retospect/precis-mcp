---
# ═══════════════════════════════════════════════════════════════════════════
# EXAMPLE cluster topology — the SINGLE source of truth for
# "which precis capability runs on which node".
#
# Each key is a capability; the value is the list of nodes that run it. Roles
# and playbooks gate on membership, e.g.:
#
#     when: inventory_hostname in precis_capabilities.autocatpath
#
# To move a capability to a different box: edit ONE line here and re-run that
# capability's playbook. No role edits. Node names below are placeholders —
# use your real inventory hostnames in `deploy/inventory/`.
#
# This map is a FLOOR, not a cage (design §15c): it declares intent; the worker
# still discovers what is actually installed and gates live via
# `service_config.prio`. Drift between declared and discovered surfaces on
# /factory (design §15d).
# ═══════════════════════════════════════════════════════════════════════════

precis_capabilities:
  # --- always-on, every node ------------------------------------------------
  # serve-embeddings on 127.0.0.1:8181 — one model load per host, shared by
  # that host's worker/web/MCP (RemoteEmbedder clients).
  embedder:        [node-gateway, node-worker, node-data, node-gpu]
  # precis worker --profile=system: chunk-level + SQL ref-level passes.
  worker_system:   [node-gateway, node-worker, node-data, node-gpu]
  # heartbeat-ONLY worker (`--only heartbeat`, playbook 20c) on LLM-serving
  # nodes: /status visibility, no queue claims. Gated by the `serving`
  # inventory group; recorded here so the what-runs-where table stays whole.
  # worker_heartbeat: [node-serve-a, node-serve-b]

  # --- singletons (gateway host) -------------------------------------------
  # The MCP / web host: serves the tool surface and runs DB migrations on deploy.
  web_mcp:         [node-gateway]
  # precis worker --profile=agent — needs the host's ~/.claude OAuth:
  # plan_tick, structural/deep reviewers, quota_check, job_claude_inproc.
  worker_agent:    [node-gateway]
  llm_summarize:   [node-gateway]
  oa_fetch:        [node-gateway]
  # precis worker --only openalex_snapshot (playbook 20f): the OpenAlex
  # works-dump cites refresh. Singleton on the data node — most local disk
  # and a wired uplink; a 675 GB full read must not multiply across every
  # worker_system host. Ships EMPTY on purpose: naming a host here is the
  # first-pass go switch (the lane also needs
  # `precis_worker_oasnap_enabled: true`), and the first tick starts the
  # ~675 GB works-dump transfer — enabling it needs Reto's go.
  openalex_snapshot: []
  # precis worker --only chunk_keywords --dedicated (playbook 20g): the
  # dedicated chunk-keyword drain lane(s), `precis_worker_kwdrain_lanes`
  # units per listed host. Ships EMPTY like openalex_snapshot — naming
  # hosts here names WHERE the lanes may run (the lane also needs
  # `precis_worker_kwdrain_enabled: true`). Multi-host is supported and
  # sharded globally: the host's position in THIS list times
  # lanes-per-host plus the lane index is its shard index, so the list
  # order IS the shard assignment (reshuffling it just moves which host
  # owns which shard — harmless either way).
  chunk_keywords_drain: []

  # --- GPU / compute node ---------------------------------------------------
  dft:             [node-gpu]
  autocatpath:         [node-gpu]
  autocatpath_mace:    [node-gpu]
  autocatpath_plugin:  [node-gateway, node-gpu]
  chem_route:      [node-gpu]
  chem_plugin:     [node-gateway]
  bio_fold:        [node-gpu]
  bio_plugin:      [node-gateway]
  tts_render:      [node-gpu]
