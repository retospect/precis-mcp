---
# Identity/contact env routed through the vault (gr204873).
# Values here OVERRIDE the operator overlay's plaintext `precis_shared_env`
# entries wherever a vault_* var is set; an empty/unset vault var drops out
# of the dict entirely so the overlay's plaintext value (if any) still wins —
# zero-breakage migration. Consumers combine:
#   precis_shared_env | combine(precis_identity_env | default({}))
precis_identity_env_raw:
  # contact.* identity strings (unpaywall/crossref mailto, EDGAR UA) moved to
  # DB-resident `precis.settings` rows 2026-08-22 — no env templating; the
  # settings layer resolves DB → env → compiled default fleet-wide.
  SEMANTIC_SCHOLAR_API_KEY: "{{ vault_semantic_scholar_api_key | default('') }}"
  # AnkiWeb credentials are per web user now (precis.anki.creds, set on
  # /account) — no deployment-wide login belongs here.
  # Inbound citer chase (td489406; flipped 2026-10-24). A live env gate read
  # by inbound_chase_enabled() in the chase pass AND in PaperHandler (every
  # MCP/web process), so it rides this dict: every consumer (collapsed worker,
  # split/drain/agent units, precis-web) already merges it. Kill switch:
  # `precis_inbound_chase: false` (value drops out) or the var set to 0.
  # The DB row (`precis service prio inbound_chase N`) is the second gate.
  PRECIS_INBOUND_CHASE_ENABLED: "{{ '1' if (precis_inbound_chase | default(true)) else '' }}"
  # Signed-upload staging dir (gr517423 MF1) — read live by the paper
  # mint/attach doors (handlers/paper.py), the paper_pull worker's
  # staged-attach os.replace, and the precis_web upload route, i.e.
  # every process class, so it rides this dict rather than the web's
  # plist alone. A SIBLING of the inbox on the same share: inside the
  # inbox the out-of-repo acatome-extract watcher would fold a staged
  # PDF; a different filesystem would break the rename. The dirname is
  # taken AFTER stripping trailing slashes — "/x/inbox/" | dirname is
  # "/x/inbox", which would nest staging INSIDE the watched tree.
  PRECIS_UPLOAD_STAGING: "{{ papers_inbox_path | regex_replace('/+$','') | dirname }}/precis-upload-staging"
precis_identity_env: "{{ precis_identity_env_raw | dict2items | rejectattr('value', 'equalto', '') | list | items2dict }}"

# Fleet-wide trailing-24h LLM spend ceiling (PRECIS_DAILY_COST_CEILING).
# Templates fall back to 50.0 when unset; raised 2026-08-17 (steady spend
# ran ~$60/day and the tripped ceiling paused discretionary dispatch).
# Zero-LLM compute mints are ceiling-exempt in code (workers/dispatch.py).
# Raised 2026-11-01 (Reto): the sum is claude -p *nominal* list-price
# dollars, mostly subscription calls never billed; one 2-hour taproot:dedup
# burst ($160 nominal) blacked out gripe_triage/structural for a day. Interim
# until the ceiling sums billed dollars only (gr549279).
precis_daily_cost_ceiling: 300.0

# Is this fleet's `claude -p` login API-billed? (PRECIS_CLAUDE_P_BILLED,
# gr549279). false = OAuth subscription: transport claude_p rows log
# billed_usd=0 (cost_usd keeps the nominal list-price figure) so the
# daily ceiling counts real dollars only. Set true on a host whose claude
# login bills per call — the json envelope cannot say how it was paid.
precis_claude_p_billed: false

# Planner spend caps (PRECIS_MAX_TODO_USD / PRECIS_MAX_TREE_USD). Templates
# fall back to 5.0 / 10.0 when unset; raised 2026-09-09 after the organoid
# survey (td301714/td311100) hit both while still producing usable Related
# Work. The per-todo cap is per *todo*, so a wide fan-out multiplies it — the
# tree cap is the real backstop and must stay well above it.
precis_max_todo_usd: 10.0
precis_max_tree_usd: 30.0

# Operator hold: job_types the claim path skips (PRECIS_SUSPENDED_JOB_TYPES;
# queued jobs wait in place, quest ticks stop minting new autocatpath trees).
# Held 2026-08-17 → 2026-08-21 (autocatpath compute). Release check, then and
# now: the GPU node must be version-coherent, because the idem-key version
# token derives the engine actually running — an incoherent node lets a
# re-dispatch dedup onto a stale-engine job. Since 01fb9e6a that coherence is
# structural rather than hand-held: constraints no longer pin the engine, the
# autocatpath role installs the wheelhouse wheel, and no
# PRECIS_AUTOCATPATH_VERSION override is present anywhere.
# To suspend again: list job_types comma-separated and redeploy.
precis_suspended_job_types: ""

# SINGLE SOURCE for the autocatpath version and floor: the catalyst extra's floor (pyproject `catalyst =
# ["autocatpath>=X"]`; tests/test_deploy_wheelhouse_floor.py fails on drift).
# The wheelhouse floor check in precis_worker/provision.yml +
# precis_web/install.yml refuses the install when no wheel at this version
# sits in the wheelhouse (gr489600). The one place a pin bump edits besides
# pyproject.toml/uv.lock.
autocatpath_min_version: "0.47.0"

# Verify-tier autocatpath seed wall (PRECIS_AUTOCATPATH_VERIFY_WALL_SECONDS): 24 h, the code clamp ceiling (gr493237, Reto 2026-10-17). 20 verify successes ran 4.6-8.9 h, but that tail is censored: 7 solo seeds died at the old 9 h bound and one solo seed was still running at 14.1 h when OOM-killed; three 3-way-contended seeds died at the 19 h bound (al480803 history). Omit to fall back to max(PRECIS_AUTOCATPATH_WALL_SECONDS, 86400).
precis_autocatpath_verify_wall_seconds: 86400

# Per-step ceiling for the autocatpath_kinetics child (PRECIS_AUTOCATPATH_KINETICS_SECONDS): the sweep gets 3x this, the job wall 5x + 300 s. 6000 s = ~5 h sweep budget; q164903 kinetics sweeps died at 2700 s (3 x the 900 default). Reto 2026-11-01. Rendered into EVERY ssh_node-claiming lane (20b, 20g, 43) so the lease and the child budget agree; tests/test_deploy_kinetics_budget.py.
precis_autocatpath_kinetics_seconds: 6000

# Pin autocatpath seed children (taskset -c) to half the cores (0-4, 10-14), leaving 5-9 and 15-19 for co-tenants; omit to run unpinned. The dispatcher stamps it on every seed; a node lacking those CPUs runs the seed unpinned (the runner checks its own affinity).
precis_autocatpath_seed_cpuset: "0-4,10-14"
# Concurrent autocatpath seeds per GPU host (PRECIS_GPU_COUNT, see roles/autocatpath env template). Set per host in the overlay host_vars, not here.
# Measured (GB10, 20 cores, 121 GiB unified memory): one seed = ~2.2 cores, 3.6 GiB RSS (peak ~4.1), 2.8 GiB GPU, 16-37% GPU util. The cpuset above gives
# all seeds ONE shared 10-core half (~3 seeds at 75% load); N>3 also needs this widened (e.g. "0-19") on the hosts that run N seeds.
# precis_autocatpath_gpu_slots: 6

# Local-disk home for scripts that root (or a root cron) runs: config_pull,
# api_monitors. Never under shared_mount: one `deploy` uid serves the whole
# fleet, so on NFS any node's deploy could rewrite a script root runs on
# another (cluster-fileserver-move ruling 8). Override per host in host_vars.
ops_script_dir: /usr/local/libexec/precis-ops
# The monitoring node reads the NAS restic success marker into its Linux
# node_exporter textfile collector (the NAS itself has no exporter).
nas_restic_textfile_dir: /var/lib/prometheus/node-exporter
