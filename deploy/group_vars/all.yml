---
# Identity/contact env routed through the vault (gr204873).
# Values here OVERRIDE the operator overlay's plaintext `precis_shared_env`
# entries wherever a vault_* var is set; an empty/unset vault var drops out
# of the dict entirely so the overlay's plaintext value (if any) still wins —
# zero-breakage migration. Consumers combine:
#   precis_shared_env | combine(precis_identity_env | default({}))
precis_identity_env_raw:
  UNPAYWALL_EMAIL: "{{ vault_unpaywall_email | default('') }}"
  CROSSREF_MAILTO: "{{ vault_crossref_mailto | default(vault_unpaywall_email | default('')) }}"
  SEMANTIC_SCHOLAR_API_KEY: "{{ vault_semantic_scholar_api_key | default('') }}"
  PRECIS_ANKI_USER: "{{ vault_anki_user | default('') }}"
  PRECIS_EDGAR_USER_AGENT: "{{ vault_edgar_user_agent | default('') }}"
precis_identity_env: "{{ precis_identity_env_raw | dict2items | rejectattr('value', 'equalto', '') | list | items2dict }}"

# Fleet-wide trailing-24h LLM spend ceiling (PRECIS_DAILY_COST_CEILING).
# Templates fall back to 50.0 when unset; raised 2026-08-17 (steady spend
# ran ~$60/day and the tripped ceiling paused discretionary dispatch).
# Zero-LLM compute mints are ceiling-exempt in code (workers/dispatch.py).
precis_daily_cost_ceiling: 100.0

# Operator hold: job_types the claim path skips (PRECIS_SUSPENDED_JOB_TYPES;
# queued jobs wait in place, quest ticks stop minting new autocatpath trees).
# Held 2026-08-17 → 2026-08-21 (autocatpath compute). Released on operator
# request after confirming the GPU node is coherent: engine 0.13.0 installed,
# constraints.txt pins the same, and NO PRECIS_AUTOCATPATH_VERSION override is
# present — so the idem-key version token derives the version actually running
# and re-dispatches cannot dedup onto a stale-engine job. (0.13.0 is the newest
# catpath *release*; the 0.14.1 referenced by the pin-bump backlog item is
# unreleased, so that bump is not a prerequisite here.)
# To suspend again: list job_types comma-separated and redeploy.
precis_suspended_job_types: ""
