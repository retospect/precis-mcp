---
# redeploy-precis.yml — Pull fresh precis-mcp from GitHub and bounce every
# precis daemon so all nodes run the new HEAD.
#
# Usage:
#   ansible-playbook redeploy-precis.yml                       # deploy main
#   ansible-playbook redeploy-precis.yml \
#     -e precis_worker_git_ref=some-branch \
#     -e precis_web_git_ref=some-branch                        # deploy a branch
#
# How precis-mcp ships (see CLAUDE.md for the full map):
#   precis-mcp is `uv pip install`-ed from
#   git+https://github.com/retospect/precis-mcp@<ref> into three venvs.
#   `--refresh-package precis-mcp` forces uv to re-resolve the branch HEAD,
#   so re-running these plays pulls whatever was last pushed:
#
#     /opt/precis/venv          ← 20-precis-worker   (worker, watch, heartbeat, dream)
#     /opt/mcps/venv            ← 38-precis-web       (web, worker-agent, watch-poll, cron-tick)
#     /opt/precis/embedder-venv ← 19a-precis-embedder (embedder)
#
# This playbook does seven things:
#   0. Pin the target: resolve the deploy ref (default `main`) to ONE commit
#      sha *once* at play start and freeze every install/compare against it.
#      Without this the install, the pre-flight, and the convergence assert
#      each re-sampled `main` independently, so a commit landing mid-deploy
#      (the autonomous fixer, a sibling /go) made the assert compare an
#      already-installed sha to a NEWER HEAD and false-fail. See step 0 play.
#   0b. Pre-flight: per host, decides whether this deploy will move ANY managed
#      venv (installed sha vs the pinned sha). Sets `precis_deploy_changed` to
#      gate BOTH the venv installs in step 1 AND the restart in step 2 — a
#      redundant same-sha redeploy skips the per-venv uv resolves and the
#      bounce entirely (gr51351: stops the worker-restart storm from a burst
#      of /go deploys, and coalesces overlapping runs). Fail-safe: hosts the
#      pre-flight doesn't cover (serving) and standalone role runs see the
#      fact undefined and install as before; `-e precis_force_install=true`
#      forces every install regardless (e.g. an extras/topology change with
#      no new sha — the pre-flight only compares shas).
#   0c. Export the local checkout's uv.lock as a `--constraints` file and copy
#      it to every host, BEFORE any install runs. Every `precis-mcp … @ git+…`
#      install (below and in every venv role) is a fresh dependency resolve —
#      without a constraints file it can silently pick a newer, untested dep
#      version than what the ship gate locked (2026-07-30: `mcp 2.0.0` broke
#      `precis serve` cluster-wide on an all-green gate week). See
#      playbooks/03-precis-constraints.yml for the full rationale.
#   1. Re-runs those three install plays → the PINNED commit lands in every
#      venv. Each install task is gated on 0b (skipped when the host's venvs
#      are already on the pinned sha), and drops `--refresh-package` when the
#      ref is a frozen sha — uv's cached checkout/build of an immutable sha is
#      correct by construction, so only moving-branch installs pay a re-fetch.
#   2. Restarts every com.precis.* LaunchDaemon (macOS) and the precis-*
#      units (Linux/the GPU node) — including daemons that share a venv and saw no
#      install change of their own — so nothing keeps running stale in-memory
#      code. GATED on step 0b: skipped on a host where nothing moved.
#   3. Removes the vestigial /opt/mcps venv off non-gateway hosts (precis_web
#      only belongs on the gateway) so an orphaned relic can't drift and
#      masquerade as a failed deploy in a spot-check.
#   4. ASSERTS convergence: every managed venv's INSTALLED commit
#      (direct_url.json) must equal the PINNED sha, or the redeploy fails
#      loudly. This is the proof the deploy actually landed everywhere — the
#      uv checkout cache's .git/HEAD lags and cannot be trusted for it.

# ── 0. Pin the deploy target to ONE commit (kills the mid-deploy race) ──
# The install roles install `@{{ precis_*_git_ref }}` and the pre-flight (0b)
# + convergence assert (4) compared the installed sha to `git ls-remote <ref>`.
# When the ref is a moving branch (`main`), each of those three re-sampled it
# independently — so a commit landing between install and assert (the out-of-cluster
# fixer shipping mid-deploy, or a sibling /go) left the venvs correctly on the
# sha they installed while the assert compared against a NEWER HEAD → a spurious
# "DEPLOY DID NOT CONVERGE" on a perfectly good, uniform cluster (observed twice
# on 2026-07-06/07). Fix: resolve the ref to a concrete commit ONCE here and pin
# every downstream install + comparison to that frozen sha, so a `main` that
# advances under an in-flight deploy can't false-fail it (this deploy simply
# lands the pinned commit; the next deploy picks up the newer one). An explicit
# `-e precis_worker_git_ref=<branch>` still wins (extra-vars > set_fact); the
# pin only overrides the role *defaults*. A caller MAY also pass an
# already-resolved 40-char sha (`-e precis_worker_git_ref=<sha>`) — canary
# two-phase deploys (scripts/deploy) pre-resolve the sha client-side so both
# phases install the identical commit — in which case this play uses it
# directly and skips the ls-remote (which only matches ref names, never a
# bare sha).
- name: "Pin the deploy target to a single commit sha (freeze a moving ref)"
  hosts:
    - gateway
    - scheduler
    - data
    - inference
  become: false
  vars:
    # `git ls-remote <ref>` only matches ref NAMES, never a bare sha — so a
    # caller that already resolved the ref to a commit (scripts/deploy's
    # canary path pre-resolves client-side so both phases install the
    # identical commit) must skip ls-remote entirely rather than have it
    # come back empty and trip the "did not resolve" assert.
    precis_worker_git_ref_is_sha: "{{ (precis_worker_git_ref | default('main')) is match('^[0-9a-f]{40}$') }}"
  tasks:
    - name: Resolve the deploy ref to one commit (once, shared to all hosts)
      # run_once → a single ls-remote; its result is broadcast to every host in
      # the play, so all hosts pin the SAME sha even if main moves a beat later.
      # Skipped when precis_worker_git_ref is already a 40-char sha (see vars).
      ansible.builtin.shell: |
        set -uo pipefail
        git ls-remote https://github.com/retospect/precis-mcp \
          "{{ precis_worker_git_ref | default('main') }}" | awk 'NR==1{print $1}'
      args:
        executable: /bin/bash
      register: precis_target_ls
      run_once: true
      changed_when: false
      when: not precis_worker_git_ref_is_sha

    - name: Refuse to deploy if the ref did not resolve to a commit
      ansible.builtin.assert:
        that:
          - precis_target_ls.stdout | length == 40
        fail_msg: >-
          could not resolve '{{ precis_worker_git_ref | default('main') }}' to a
          commit via git ls-remote (got '{{ precis_target_ls.stdout }}') — refusing
          to deploy an unpinned/unresolvable ref.
        quiet: true
      run_once: true
      when: not precis_worker_git_ref_is_sha

    - name: Resolve the pin target (already-a-sha passthrough, or the ls-remote result)
      # When precis_worker_git_ref already IS a 40-char sha (canary
      # passthrough), use it directly instead of the (skipped) ls-remote's
      # registered result.
      ansible.builtin.set_fact:
        precis_target_sha: "{{ precis_worker_git_ref if precis_worker_git_ref_is_sha else precis_target_ls.stdout }}"

    - name: Pin every managed venv's install ref + the compare target to that sha
      # set_fact beats the role defaults (precis_*_git_ref: main) so the install
      # roles install `@<sha>`; it does NOT beat an explicit `-e` (extra-vars),
      # so a deliberate branch deploy is untouched. precis_target_sha is the
      # single source of truth the pre-flight (0b) and the assert (4) compare to.
      ansible.builtin.set_fact:
        precis_worker_git_ref: "{{ precis_target_sha }}"
        precis_embedder_git_ref: "{{ precis_target_sha }}"
        precis_web_git_ref: "{{ precis_target_sha }}"

    - name: Report the pinned target
      ansible.builtin.debug:
        msg: "deploy target pinned to {{ precis_target_sha }}"
      run_once: true

# ── 0a2. Purge retired Claude credential files (the vault is the only store) ──
# `utils/claude_oauth.ensure_oauth_token` used to read a per-user
# ~/.claude_oauth_token BEFORE the vault. That put a live, long-lived
# credential in plaintext under every service account's home on every node —
# a 2026-08-07 sweep found five copies across two machines, one of them on a
# host that runs no agent at all — and, sitting ahead of the vault, it silently
# shadowed rotation: rotate the vault and every host with a stale file kept
# presenting the old token until someone deleted it by hand.
#
# The code now resolves env → vault → ~/.secrets/pw/<NAME>, so these files are
# dead weight. Sweeping them on EVERY deploy (not once, by hand) is the point:
# a file re-created by a well-meaning debugging session is gone again next
# deploy, so the fleet cannot silently drift back to two stores.
#
# Scope is a hard-coded list of SERVICE-account paths, deliberately not a
# find(1) over all homes: a human's own ~/.claude/.credentials.json is their
# interactive login and is none of this playbook's business. Paths for both
# /Users (darwin) and /home (linux) are listed unconditionally — `state:
# absent` on a nonexistent path is a clean no-op, which is cheaper and far
# less brittle than branching on os_family.
- name: "Purge retired per-user Claude credential files"
  hosts:
    - gateway
    - scheduler
    - data
    - inference
  become: true
  tags: [credentials, purge-claude-creds]
  vars:
    precis_retired_credential_paths:
      - /Users/deploy/.claude_oauth_token
      - /Users/hermes/.claude_oauth_token
      - /Users/hermes/.claude/.credentials.json
      - /home/deploy/.claude_oauth_token
      - /home/hermes/.claude_oauth_token
      - /home/atomsim/.claude/.credentials.json
  tasks:
    - name: Remove retired token files + dead service-account keychains
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop: "{{ precis_retired_credential_paths }}"
      register: precis_cred_purge

    - name: Report anything that was still lying around
      when: precis_cred_purge.changed
      ansible.builtin.debug:
        msg: >-
          purged retired Claude credentials:
          {{ precis_cred_purge.results
             | selectattr('changed') | map(attribute='item') | list | join(', ') }}

# ── 0b. Decide whether this deploy actually changes anything (gate the bounce) ──
# gr51351: the bounce play (step 2) used to restart EVERY precis daemon on
# EVERY run — even a redundant same-sha redeploy — so a burst of back-to-back
# /go deploys caused a worker-restart STORM (the GPU node hit 9× in 1h on 2026-07-06,
# tripping the nursery worker-restart critical alert; each mid-job kill orphans
# in-flight work, swept + re-run at the 1h clock).
#
# Fix: snapshot each managed venv's INSTALLED sha *before* the reinstall and
# compare it to the ref HEAD we're about to deploy. Per host, set a
# `precis_deploy_changed` fact — true iff some managed venv will actually move.
# The venv install tasks (precis_worker/precis_embedder/precis_web roles, the
# asa refresh via its own asa_deploy_changed twin) AND step 2's restart actions
# are gated on it, so:
#   * a redundant same-sha deploy is a true no-op (no restart, no storm), and
#   * an overlapping second /go that finds every venv already on the target sha
#     does not re-bounce — the "skip if venv already on target sha" coalescing
#     the gripe asks for (gr51351 fix #2), covering the observed sequential
#     back-to-back case without a separate lock.
# A real code change still bounces exactly as before. Defaults to bouncing if
# the pre-flight can't run (MISSING venv, network hiccup on git ls-remote), so
# the safe direction is "restart", never "silently skip a real update".
- name: "Pre-flight: will this deploy move any managed venv? (gate the restart)"
  hosts:
    - gateway
    - scheduler
    - data
    - inference
  become: true
  vars:
    # Same venv → ref mapping as the convergence assert (step 4). /opt/mcps
    # only exists on the gateway (precis_web); NEITHER the worker venv
    # (/opt/precis/venv) NOR the embedder venv is installed on the data node
    # (20b + 19a exclude it — it runs no precis daemon), so both are gated out
    # there. An empty map on the data node → no move detected → no bounce.
    _precis_venv_refs: >-
      {{ ({}
           | combine(
               {'/opt/precis/venv': precis_worker_git_ref | default('main')}
               if inventory_hostname not in groups['data'] else {}
             )
           | combine(
               {'/opt/precis/embedder-venv': precis_embedder_git_ref | default(precis_worker_git_ref | default('main'))}
               if inventory_hostname not in groups['data'] else {}
             )
           | combine(
               {'/opt/mcps/venv': precis_web_git_ref | default('main')}
               if inventory_hostname in groups['gateway'] else {}
             )
         ) }}
  tasks:
    - name: Compare each managed venv's installed sha to the pinned target
      # Reads pip's direct_url.json (the sha actually built into the venv, not
      # the lagging uv checkout cache) and diffs it against the PINNED sha from
      # step 0 — not a fresh ls-remote, so a main that moves mid-deploy can't
      # skew this decision. Emits SAME (already on target → no move) or DIFF
      # (will move, or the venv is MISSING). Never fails: a MISSING venv emits
      # DIFF so the gate errs toward bouncing.
      ansible.builtin.shell: |
        set -uo pipefail
        venv="{{ item.key }}"; expected="{{ precis_target_sha }}"
        f=$(ls $venv/lib/python*/site-packages/precis_mcp-*.dist-info/direct_url.json 2>/dev/null | head -1)
        installed=$([ -n "$f" ] && python3 -c "import json;print(json.load(open('$f'))['vcs_info']['commit_id'])" || echo MISSING)
        [ -n "$expected" ] && [ "$installed" = "$expected" ] && echo SAME || echo DIFF
      args:
        executable: /bin/bash
      loop: "{{ _precis_venv_refs | dict2items }}"
      loop_control:
        label: "{{ inventory_hostname }}:{{ item.key }}"
      register: precis_preflight
      changed_when: false
      failed_when: false

    - name: Set the deploy-changed gate (true if ANY managed venv will move)
      ansible.builtin.set_fact:
        precis_deploy_changed: >-
          {{ precis_preflight.results
             | map(attribute='stdout') | map('trim')
             | select('equalto', 'DIFF') | list | length > 0 }}

    - name: Report the deploy-change decision
      ansible.builtin.debug:
        msg: >-
          {{ inventory_hostname }}: deploy_changed={{ precis_deploy_changed }}
          ({{ precis_preflight.results | map(attribute='stdout') | map('trim') | list }})

# ── 0c. Export uv.lock as a constraints file, land it on every host ──
# Must run before ANY of the install plays below — every one of them passes
# `--constraints /opt/precis/constraints.txt` to its `uv pip install`.
- name: "Export uv.lock -> constraints file, copy to every host (gate against fresh-resolve drift)"
  ansible.builtin.import_playbook: playbooks/03-precis-constraints.yml

# ── 1. Reinstall from GitHub HEAD ──
# Order matters: the embedder goes FIRST. The system worker calls the
# embedder at boot (`_build_handlers` → `EmbedHandler` → GET /model) and
# *crashes* — not retries — if the listener is refusing connections, so
# launchd crash-loops it. Installing/health-checking the embedder before
# the worker (and web) plays guarantees a live listener is already up
# when those plays restart their daemons. See the gated bounce play below
# for the same invariant at restart time.
- name: "Refresh /opt/precis/embedder-venv (embedder) — FIRST, dependents need it"
  ansible.builtin.import_playbook: playbooks/19a-precis-embedder.yml

# gr196677: re-assert ~deploy/.pgpass (+ hermes's) every deploy — the mcp.json
# DSN is password-free (§L gr171431), so every plan_tick spawn stands or falls
# on this file; provisioned only by the standalone 19-pgpass.yml it silently
# drifted. Idempotent; the template module writes atomically (tmp + rename).
# Must precede 20b: the collapsed worker's provision step now asserts the file.
- name: "Re-assert ~/.pgpass on all nodes  (plan_tick / asa DB credential)"
  ansible.builtin.import_playbook: playbooks/19-pgpass.yml

# gr191008: re-assert worker-log rotation every deploy. The copy-truncate
# rotator (script + root cron) + /shared/logs newsyslog config were provisioned
# ONLY by the standalone 15-logrotate.yml under site.yml — which hadn't run
# since the fix shipped (fcb38c57, 2026-08-04), so the rotator was never
# installed on any node and /var/log/precis-worker.log grew unbounded (~1 GB on
# the data node, ~600 MB on an agent node, observed 2026-08-07). Same
# silent-drift class as 19-pgpass above; idempotent, so re-asserting here is
# free on a converged node.
- name: "Re-assert worker-log rotation      (gr191008 — copy-truncate cron)"
  ansible.builtin.import_playbook: playbooks/15-logrotate.yml

# ── restart-once sudoers grant (self-healing-spine Layer 2, slice 3) ──
# The condition registry's ONE whitelisted cross-host heal: a healthy host
# may bounce a provably-wedged worker (dead handler in a live rotation —
# gr204385 sat 4 days because no agent path could do this). The grant is
# scoped to EXACTLY one command per platform — nothing else runs as root.
# The code side (workers/conditions.py::_restart_worker_cmd) must stay
# byte-aligned with these lines. Re-asserted every deploy (same
# silent-drift reasoning as 19-pgpass / 15-logrotate above). The heal arm
# itself stays dark until PRECIS_RESTART_ONCE_ENABLED=1 on the workers —
# this grant also unblocks a manual/cluster-admin bounce in the meantime.
- name: "Provision restart-once sudoers grant (deploy → one worker bounce)"
  hosts:
    - gateway
    - scheduler
    - inference
    - serving
  become: true
  tags: [restart-once, precis]
  tasks:
    - name: Grant deploy the one vetted worker-restart command
      ansible.builtin.copy:
        dest: /etc/sudoers.d/precis-restart-once
        mode: "0440"
        owner: root
        validate: "visudo -cf %s"
        content: |
          # Managed by ansible (redeploy-precis.yml) — self-healing-spine
          # slice 3 restart-once. Exactly one command; do not widen.
          {% if os_family == 'darwin' %}
          deploy ALL=(root) NOPASSWD: /bin/launchctl kickstart -k system/com.precis.worker
          {% else %}
          deploy ALL=(root) NOPASSWD: /usr/bin/systemctl restart precis-worker
          {% endif %}

# §L-b (2026-08-04): the COLLAPSED worker playbook replaced
# 20-precis-worker.yml here — one `precis worker --profile all` unit per
# host (same com.precis.worker / precis-worker.service label, rendered via
# roles/service_unit). 20 stays on disk as the documented rollback
# (re-running it restores a split system-profile unit on one host).
- name: "Refresh /opt/precis/venv          (collapsed worker, --profile all)"
  ansible.builtin.import_playbook: playbooks/20b-precis-worker-collapsed.yml

- name: "Refresh serving-host heartbeat    (heartbeat-only worker, no queue claims)"
  ansible.builtin.import_playbook: playbooks/20c-precis-heartbeat-serving.yml

# Dedicated GPU/compute worker lane on the GPU node — a second tiny
# `--only job_ssh_node` worker so node-pinned detached GPU jobs (autocatpath
# seeds, dft gpaw_relax) drain at compute-completion speed instead of once
# per the collapsed worker's serial rotation. Must follow 20b (reuses its
# /opt/precis/venv + the autocatpath/dft env drops). The step-2 bounce play
# force-restarts precis-worker-compute.service with the rest (its
# `precis-*.service` glob), so it never runs stale code after this refresh.
- name: "Compute worker lane            (inference, job_ssh_node only)"
  ansible.builtin.import_playbook: playbooks/43-precis-worker-compute.yml

# precis-tts render image (topology: precis_capabilities.tts_render, i.e. the
# GPU node) — the render engine is BAKED into the image, not a venv, so a venv
# refresh alone leaves audio rendering on stale code (bit us 2026-08-10: the
# kokoro 510-phoneme fix shipped but episodes kept failing until a manual
# 45-tts.yml run). Rebuilding here, pinned to the deploy sha, keeps the image
# in lockstep with the venvs. Cheap when nothing moved: the Dockerfile keeps
# everything sha-independent (deps, dicts, models) in layers ABOVE the pinned
# install, so a rebuild at a new sha re-runs one pip install and a same-sha
# redeploy is a full cache hit.
- name: "Rebuild precis-tts render image  (sha-pinned; layer-cached)"
  ansible.builtin.import_playbook: playbooks/45-tts.yml
  vars:
    tts_precis_ref: "{{ precis_target_sha | default('main') }}"

# §L: the standalone heartbeat timer (role `precis_heartbeat`, playbook
# 40-precis-heartbeat.yml) is RETIRED — heartbeat is a per-host `heartbeat`
# worker pass since §A (workers/heartbeat.py), and retire-thin-timers.yml
# boots the old launchd/systemd timers out. Do not re-add the import: a
# re-rendered com.precis.heartbeat.plist would resurrect the timer with an
# inline agent_rw password (gr171431). The host-var overrides it used to
# carry ride the worker plists now.

# External embedder health-kicker (gripe 51394 pt2) — probes /readyz and
# restarts a wedged-but-alive embedder that KeepAlive/Restart=always would
# never catch (those only fire on process exit).
- name: "Re-render the embedder watchdog plist (all nodes — kicks a wedged embedder)"
  ansible.builtin.import_playbook: playbooks/41-precis-embedder-watchdog.yml

- name: "Refresh /opt/mcps/venv            (web; agent passes ride the collapsed worker since §L-b)"
  ansible.builtin.import_playbook: playbooks/38-precis-web.yml

# §L-b (2026-08-04): 37-precis-worker-agent.yml is RETIRED from this flow —
# the split agent unit's passes + env now ride the collapsed worker above
# (20b carries the full agent env union, verified per-host; the
# precis_worker_agent role's PROVISIONING half still runs, included from 20b
# with tasks_from: provision). retire-split-agents.yml boots the old
# com.precis.worker-agent / precis-worker-agent.service out per host in the
# cutover window. Do not re-add the 37 import: it would re-render a second,
# competing agent daemon alongside the collapsed unit.

# ── 2. Force-bounce every precis daemon so fresh code is in memory ──
# THE one restart per deploy (spine slice 2, gr51351 part 3): the
# install-notify handlers in precis_worker / precis_embedder / precis_web
# skip when `precis_deploy_changed` is defined-and-true (this playbook's
# pre-flight sets it), so a code deploy restarts each unit exactly ONCE —
# here. Known, accepted exception: a deploy that also changes a
# service_unit-rendered UNIT FILE double-bounces the collapsed worker
# (roles/service_unit reloads on unit change unconditionally — that reload
# is what makes launchd env changes take, so it stays).
# `data` (the DB node) is deliberately NOT bounced (excluded 2026-08-11): it
# runs NO precis daemon (worker 20b, embedder 19a, watchdog 41 all exclude it
# — DB node, RAM pressure). This play `find`s and bootstraps *any* leftover
# `com.precis.*.plist`, which used to RESURRECT orphaned worker/embedder/
# watchdog plists on the DB node every deploy (undoing the manual disable —
# the whack-a-mole). Excluding it here is the durable fix; it also skips the
# ~4 min embedder-/healthz wait this play would otherwise burn on a node with
# no embedder. Do not re-add `data` unless the DB node is meant to run a
# precis daemon.
- name: "Bounce all precis daemons"
  hosts:
    - gateway
    - scheduler
    - inference
  become: true
  vars:
    # Bound on the drain wait below (30s * N) — ops can pass
    # `-e precis_drain_retries=<n>` to shorten it for an urgent deploy.
    precis_drain_retries: 60
  tasks:
    # ── Drain before bounce ──
    # Touch the drain flag file BEFORE anything is restarted so the worker
    # (precis.workers.runner.run_loop) stops claiming new work, then wait
    # for whatever it already claimed to finish — long jobs (quest_tick
    # coordinator slices, detached autocatpath seed children) used to get
    # SIGKILLed mid-run by the restarts below (systemd's TimeoutStopSec=60
    # / launchd's kickstart -k don't wait for application-level work to
    # drain, only the process to exit). Gated the same as the restarts
    # (nothing to drain for if nothing's about to bounce) and always
    # removed at the end of this play, even on the no-change path.
    - name: Touch worker drain file (pause new claims before bounce)
      when: precis_deploy_changed | default(true) | bool
      ansible.builtin.file:
        path: /opt/precis/worker.drain
        state: touch
        mode: "0644"

    # Delegated to the DB node: refs kind='job' carry lease/state in meta
    # + STATUS: tags (STATUS:running via ref_tags/tags), not a column —
    # see precis.workers.executors._common's claim query for the same
    # shape. Bounded wait (retries * delay, default 30 min) — a stuck
    # job must never block a deploy forever; failed_when: false + the
    # debug task below make the timeout visible instead of silently
    # racing the restart.
    - name: Wait for in-flight long jobs leased to this host to finish
      when: precis_deploy_changed | default(true) | bool
      delegate_to: "{{ groups['data'][0] }}"
      become: true
      # Same os-split as roles/postgres's pg_user — resolved against the
      # DELEGATED host's vars (a bare os_family here would read this
      # play's host, not the DB node).
      become_user: >-
        {{ 'deploy' if hostvars[groups['data'][0]]['os_family'] | default('linux') == 'darwin'
           else 'postgres' }}
      ansible.builtin.shell: >-
        psql -d precis_prod -tAc "SELECT count(*) FROM refs r
          JOIN ref_tags rt ON rt.ref_id = r.ref_id
          JOIN tags t ON t.tag_id = rt.tag_id
          WHERE r.kind = 'job'
            AND r.deleted_at IS NULL
            AND t.namespace = 'STATUS' AND t.value = 'running'
            AND r.meta->>'lease_host' = '{{ inventory_hostname | regex_replace('\\..*$', '') }}'
            AND r.meta->>'job_type' IN ('quest_tick','autocatpath_seed','autocatpath_aggregate','struct_relax','taproot_backfill')"
      register: precis_drain_wait
      changed_when: false
      failed_when: false
      until: (precis_drain_wait.stdout | default('') | trim) == '0'
      retries: "{{ precis_drain_retries }}"
      delay: 30

    - name: Report drain outcome
      when: precis_deploy_changed | default(true) | bool
      ansible.builtin.debug:
        msg: >-
          {{ inventory_hostname }}: drain
          {{ 'complete' if (precis_drain_wait.stdout | default('') | trim) == '0' else 'timed out (proceeding anyway)' }}
          — running long jobs leased here: {{ precis_drain_wait.stdout | default('?') | trim }}

    # ── Embedder FIRST, with a health gate ──
    # The system worker (and anything else that embeds at boot) crashes
    # rather than retries if the embedder listener is refusing
    # connections, so launchd crash-loops it. Restart the embedder on its
    # own and block until /healthz is 200 before bouncing any dependent
    # daemon. `bootstrap` also re-loads it if a prior run left it
    # *unloaded* — `kickstart` alone can't restart a service that isn't
    # loaded (the failure mode that crash-looped the gateway's worker).
    - name: Ensure embedder is loaded (macOS) — no-op if already loaded
      when: os_family == "darwin"
      ansible.builtin.command:
        cmd: launchctl bootstrap system /Library/LaunchDaemons/com.precis.embedder.plist
      changed_when: false
      failed_when: false

    - name: Restart embedder (macOS)
      when:
        - os_family == "darwin"
        - precis_deploy_changed | default(true) | bool
      ansible.builtin.command:
        cmd: launchctl kickstart -k system/com.precis.embedder
      changed_when: true
      failed_when: false

    - name: Wait for embedder /healthz before bouncing dependents (macOS)
      when:
        - os_family == "darwin"
        - precis_deploy_changed | default(true) | bool
      ansible.builtin.uri:
        url: >-
          http://{{ precis_embedder_host | default('127.0.0.1') }}:{{
          precis_embedder_port | default(8181) }}/healthz
        status_code: 200
      register: precis_embedder_gate
      retries: 80
      delay: 3
      until: precis_embedder_gate.status == 200
      # Don't abort the whole redeploy if it's still warming — the worker
      # self-heals once the listener binds. The gate's job is to give it
      # those ~4 minutes (80×3s) BEFORE we bounce the worker, not to be a
      # tripwire. Widened from 40 after a cold bge-m3 warm exceeded 2 min on
      # a slower Mac and left the worker bouncing against a not-yet-bound
      # listener (2026-07-04).
      failed_when: false

    - name: Find precis LaunchDaemons except embedder (macOS)
      when: os_family == "darwin"
      ansible.builtin.find:
        paths: /Library/LaunchDaemons
        patterns: "com.precis.*.plist"
        excludes: "com.precis.embedder.plist"
      register: precis_plists

    # gr162132: `kickstart -k` (next task) CANNOT load a daemon that was
    # booted out of launchd. A dep-heavy deploy can trip jetsam and get the
    # worker (and other precis daemons) fully evicted; the kickstart then
    # silently no-ops and `failed_when: false` masks a dead worker as a green
    # deploy — a cluster-wide fetch_oa/dispatch/nursery outage on 2026-07-24
    # (every macOS node in the sweep left dark). Mirror the embedder handling
    # above: `bootstrap` (load-if-unloaded) each remaining daemon FIRST — and
    # unconditionally (not gated on precis_deploy_changed) so a no-op deploy
    # still recovers a previously booted-out daemon — so the kickstart that
    # follows restarts a guaranteed-loaded service.
    - name: Bootstrap each remaining precis LaunchDaemon (macOS) — no-op if loaded
      when: os_family == "darwin"
      ansible.builtin.command:
        cmd: launchctl bootstrap system {{ item.path }}
      loop: "{{ precis_plists.files }}"
      loop_control:
        label: "{{ item.path | basename }}"
      changed_when: false
      failed_when: false

    # `kickstart -k` restarts the process but from the ALREADY-LOADED (in-memory)
    # plist definition — a changed `<EnvironmentVariables>` on disk is IGNORED
    # until a full bootout+bootstrap. That silently benched env-gated features
    # whose plist env changed on deploy: PRECIS_QUEST_LOOP_ENABLED (the whole
    # autonomous quest loop, dark ~4 days) and a per-host summarizer-model
    # binding, both 2026-07-30 — the deploy reported "changed" but the running
    # daemon kept the old env. Reload = bootout (unload) then bootstrap (load fresh from the
    # on-disk plist, picking up the new env). bootout's process teardown is
    # ASYNC — it returns before launchd finishes unloading — so we must POLL
    # until the label is actually gone before re-bootstrapping. A fixed
    # `sleep 3` raced a slow teardown (~28s observed): the late unload reaped
    # the freshly-bootstrapped daemon and, because bootout DEREGISTERS the label
    # (KeepAlive can't respawn a label that's gone), left the system worker dead
    # on a green deploy — a multi-day outage (gr176223). Same poll-until-gone
    # guard as tasks/reload_launchd.yml — but this flat loop spans persistent AND
    # periodic daemons, so it can't pid-assert the way that task does; it relies
    # on the poll plus the unconditional "Bootstrap … no-op if loaded" above /
    # next-deploy self-heal. Deeper per-daemon verification: audit gripe 176337.
    - name: Reload each remaining precis LaunchDaemon (macOS) — bootout+bootstrap so plist env changes take
      when:
        - os_family == "darwin"
        - precis_deploy_changed | default(true) | bool
      ansible.builtin.shell: |
        unit="{{ item.path | basename | regex_replace('\.plist$', '') }}"
        launchctl bootout "system/${unit}" 2>/dev/null || true
        # wait up to ~60s for the async teardown to fully complete
        i=0
        while launchctl print "system/${unit}" >/dev/null 2>&1 && [ "$i" -lt 120 ]; do
          sleep 0.5; i=$((i + 1))
        done
        [ "$i" -ge 120 ] && echo "${unit}: still tearing down after 60s, bootstrapping anyway" >&2
        launchctl bootstrap system "{{ item.path }}"
      loop: "{{ precis_plists.files }}"
      loop_control:
        label: "{{ item.path | basename }}"
      changed_when: true
      failed_when: false

    # Linux/the GPU node: same invariant — embedder first + health gate, then
    # every OTHER precis-*.service. (the GPU node also runs precis-watch, the
    # inbox ingester; bouncing only the worker left the watcher on stale
    # code, so we still restart all the rest — just not before the
    # embedder is up.)
    - name: Restart embedder first (Linux/the GPU node)
      when:
        - os_family == "linux"
        - precis_deploy_changed | default(true) | bool
      ansible.builtin.systemd:
        name: precis-embedder
        state: restarted
      failed_when: false

    - name: Wait for embedder /healthz before bouncing dependents (Linux/the GPU node)
      when:
        - os_family == "linux"
        - precis_deploy_changed | default(true) | bool
      ansible.builtin.uri:
        url: >-
          http://{{ precis_embedder_host | default('127.0.0.1') }}:{{
          precis_embedder_port | default(8181) }}/healthz
        status_code: 200
      register: precis_embedder_gate_linux
      retries: 80
      delay: 3
      until: precis_embedder_gate_linux.status == 200
      failed_when: false

    - name: Find precis systemd units except embedder (Linux/the GPU node)
      when: os_family == "linux"
      ansible.builtin.shell: >-
        set -o pipefail;
        systemctl list-units --type=service --all --no-legend 'precis-*.service'
        | awk '{print $1}' | grep -vx 'precis-embedder.service'
      args:
        executable: /bin/bash
      register: precis_units
      changed_when: false
      failed_when: false

    - name: Restart each remaining precis systemd unit (Linux/the GPU node)
      when:
        - os_family == "linux"
        - precis_deploy_changed | default(true) | bool
      ansible.builtin.systemd:
        name: "{{ item }}"
        state: restarted
        # Pick up unit-file changes too (e.g. TimeoutStopSec) — this play is
        # the ONE restart per deploy (spine slice 2: the install-notify
        # handlers in precis_worker/precis_embedder/precis_web skip under
        # redeploy), so it must also refresh systemd's view of the unit.
        daemon_reload: true
      loop: "{{ precis_units.stdout_lines | select | list }}"
      failed_when: false

    - name: Report bounced units (Linux/the GPU node)
      when: os_family == "linux"
      ansible.builtin.debug:
        msg: >-
          {{ inventory_hostname }}:
          {{ 'bounced' if (precis_deploy_changed | default(true) | bool)
             else 'skipped bounce (no venv changed)' }}
          {{ precis_units.stdout_lines | select | list }}

    - name: Report bounced daemons (macOS)
      when: os_family == "darwin"
      ansible.builtin.debug:
        msg: >-
          {{ inventory_hostname }}:
          {{ 'bounced' if (precis_deploy_changed | default(true) | bool)
             else 'skipped bounce (no venv changed)' }}
          {{ precis_plists.files | map(attribute='path') | map('basename') | list }}

    # Unconditional (the touch above is gated on precis_deploy_changed, this
    # isn't) — a no-change deploy still must not leave the flag file behind
    # from an earlier run, or every claim on this host stays paused forever.
    - name: Remove worker drain file (resume claims)
      ansible.builtin.file:
        path: /opt/precis/worker.drain
        state: absent

# ── 2b. Refresh the asa bridges (shared /opt/asa venv + com.asa.* daemons) ──
# asa_bot/asa_slack live outside the three precis venvs this playbook manages,
# so a precis fix affecting them used to ship+deploy green yet never reach the
# Discord/Slack bridge until a manual 31-/48- role run (2026-07-26 incident).
# This code-only refresh installs the same PINNED sha into /opt/asa and bounces
# com.asa.* — no grimoire-sourced config, so it runs on any deploy controller.
# No-op on a cluster without asa installed. See the playbook header for detail.
- name: "Refresh asa bridges (code + daemon bounce)"
  ansible.builtin.import_playbook: playbooks/32-asa-code-refresh.yml

# ── 3. Remove the vestigial /opt/mcps/venv relic off hosts that never run it ──
# `precis_web` — the only role that installs the gateway's /opt/mcps/venv —
# targets the `gateway` group (the gateway) ONLY. `data`/`inference` hosts may
# carry an /opt/mcps/venv relic from an earlier topology; nothing loads it
# (their daemons run off /opt/precis/venv), so it drifts a release behind and
# is a diagnostic trap (a stale direct_url.json sha reads like a failed deploy
# when it is just a relic). Remove that ONE venv so the convergence check below
# asserts cleanly. Idempotent (no-op if absent).
#
# NB: `scheduler` (the scheduler node) is DELIBERATELY EXCLUDED — it legitimately owns
# /opt/mcps/venv (roles/mcps + daily_briefing) AND /opt/mcps/extract
# (extract_watch), neither of which this playbook re-creates. Targeting it here
# wiped both on every /go (introduced by db84485 2026-07-04; fixed 2026-07-13).
# And we scope the removal to /opt/mcps/venv, NEVER the whole /opt/mcps tree, so
# it can't collateral-damage extract/, quest/, bin/.
#
# The `data` (DB node) also carries an /opt/precis/venv WORKER relic: the worker
# was taken off that node 2026-08-11 (RAM-starved prod DB), so its /opt/precis/venv
# is now unmanaged, drifts a release behind, and is the same stale-sha diagnostic
# trap. Remove it — but ONLY on `data`. `inference` still runs a live worker off
# /opt/precis/venv (20b installs there), so the removal is `data`-scoped via `when`.
- name: "Remove vestigial precis venvs off non-owning hosts"
  hosts:
    - data
    - inference
  become: true
  tasks:
    - name: Absent /opt/mcps/venv (the gateway-only precis_web relic)
      ansible.builtin.file:
        path: /opt/mcps/venv
        state: absent
    - name: Absent /opt/precis/venv on the DB node (worker taken off it 2026-08-11; relic on a stale sha)
      ansible.builtin.file:
        path: /opt/precis/venv
        state: absent
      when: inventory_hostname in groups['data']

# ── 4. Prove convergence: every MANAGED precis venv runs the deployed sha ──
# Deploy is only done when every venv a role installs is actually ON the ref
# it was told to deploy. Without this, a silently-skipped install (uv thought
# it was satisfied, or an install task's changed_when missed the update) leaves
# a daemon on stale in-memory code with no signal — and the uv checkout cache's
# `.git/HEAD` lags the installed wheel, so a manual spot-check there is
# actively misleading. This play reads each managed venv's installed commit_id
# (from pip's direct_url.json — the authoritative record of what's INSTALLED,
# not what's cached) and asserts it equals the current HEAD of that venv's ref.
# A mismatch fails the redeploy loudly instead of leaving a quiet laggard.
- name: "Verify every managed precis venv is on the deployed commit"
  hosts:
    - gateway
    - scheduler
    - data
    - inference
  become: true
  vars:
    # venv → the git ref its role deploys. /opt/mcps only exists on the gateway
    # (precis_web); NEITHER the worker venv (/opt/precis/venv) NOR the embedder
    # venv is installed on the data node (20b + 19a exclude it — it runs no
    # precis daemon), so both are gated out there (empty map → nothing to
    # assert on that host).
    _precis_venv_refs: >-
      {{ ({}
           | combine(
               {'/opt/precis/venv': precis_worker_git_ref | default('main')}
               if inventory_hostname not in groups['data'] else {}
             )
           | combine(
               {'/opt/precis/embedder-venv': precis_embedder_git_ref | default(precis_worker_git_ref | default('main'))}
               if inventory_hostname not in groups['data'] else {}
             )
           | combine(
               {'/opt/mcps/venv': precis_web_git_ref | default('main')}
               if inventory_hostname in groups['gateway'] else {}
             )
         ) }}
  tasks:
    - name: Read installed commit_id vs the pinned target for each managed venv
      # direct_url.json carries {"vcs_info": {"commit_id": "<sha>"}} for a
      # git-installed dist — the sha actually built into the venv. Compare it
      # to the PINNED sha from step 0 (NOT a fresh ls-remote), so a commit
      # landing on main mid-deploy can't make this false-fail. Emits
      # "<installed> <expected>" for the assert below; MISSING if the venv
      # has no precis dist at all.
      ansible.builtin.shell: |
        set -uo pipefail
        venv="{{ item.key }}"; expected="{{ precis_target_sha }}"
        f=$(ls $venv/lib/python*/site-packages/precis_mcp-*.dist-info/direct_url.json 2>/dev/null | head -1)
        installed=$([ -n "$f" ] && python3 -c "import json;print(json.load(open('$f'))['vcs_info']['commit_id'])" || echo MISSING)
        echo "$installed $expected"
      args:
        executable: /bin/bash
      loop: "{{ _precis_venv_refs | dict2items }}"
      loop_control:
        label: "{{ inventory_hostname }}:{{ item.key }}"
      register: precis_convergence
      changed_when: false

    - name: Assert each managed venv matches its deployed ref
      ansible.builtin.assert:
        that:
          - item.stdout.split()[0] == item.stdout.split()[1]
        fail_msg: >-
          {{ inventory_hostname }}: {{ item.item.key }} is on
          {{ item.stdout.split()[0][:10] }} but the pinned deploy target is
          {{ item.stdout.split()[1][:10] }} — DEPLOY DID NOT CONVERGE. The
          target is frozen for this run, so this means the install was genuinely
          skipped/failed on this venv (re-run), not a main that moved under it.
        success_msg: >-
          {{ inventory_hostname }}: {{ item.item.key }} @
          {{ item.stdout.split()[0][:10] }} ✓ (pinned {{ item.stdout.split()[1][:10] }})
        quiet: true
      loop: "{{ precis_convergence.results }}"
      loop_control:
        label: "{{ inventory_hostname }}:{{ item.item.key }}"
