---
# Re-apply the private autocatpath wheelhouse (see defaults/main.yml).
#
# Shared by TWO callers: roles/autocatpath/tasks/main.yml (playbook 44) and
# roles/precis_worker/tasks/provision.yml (redeploy-precis.yml), which
# include_role's this file right after its constraints-pinned
# `precis-mcp[...,catalyst]` install — that `--upgrade` reverts the engine to
# the pin on every redeploy, so without this re-apply a private wheel install
# is silently wiped by the next deploy (the 0.14-era void-run trap).
# A host with an empty wheelhouse skips cleanly. The same wheelhouse carries
# the linux-aarch64 tblite wheel for the xtb relax rung (bottom of this file).

- name: Ensure the autocatpath wheelhouse
  ansible.builtin.file:
    path: "{{ autocatpath_wheelhouse }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  become: true

- name: Find private autocatpath wheels in the wheelhouse
  ansible.builtin.find:
    paths: "{{ autocatpath_wheelhouse }}"
    patterns: "autocatpath-*.whl"
  register: autocatpath_wheelhouse_wheels
  become: true

- name: Install the newest wheelhouse wheel over the constraints pin
  when: autocatpath_wheelhouse_wheels.files | length > 0
  vars:
    # Lexicographic newest — fine while the wheelhouse holds one stopgap
    # wheel at a time; clean out old wheels rather than relying on this sort.
    autocatpath_wheel_newest: >-
      {{ (autocatpath_wheelhouse_wheels.files | map(attribute='path') | sort | last) }}
  ansible.builtin.shell: |
    {{ autocatpath_uv_bin }} pip install --python {{ autocatpath_worker_venv }}/bin/python \
      '{{ autocatpath_wheel_newest }}'
  become: true
  register: autocatpath_wheel_install
  changed_when: >-
    'Installed' in (autocatpath_wheel_install.stdout + autocatpath_wheel_install.stderr)
    or 'Updated' in (autocatpath_wheel_install.stdout + autocatpath_wheel_install.stderr)
  notify: restart precis-worker (autocatpath)

# ── tblite: the xtb relax rung's backend (see defaults: tblite_wheel) ──────
# Same re-apply story: the wheel lives in the wheelhouse so a redeploy keeps
# it. Constraints/overrides ride along so tblite's own deps (cffi, numpy)
# resolve at the locked versions instead of drifting the venv; the lock's
# tblite pin is marker-skipped on linux-aarch64, so it binds nothing here.
- name: Find tblite wheels in the wheelhouse
  when: os_family == "linux"
  ansible.builtin.find:
    paths: "{{ autocatpath_wheelhouse }}"
    patterns: "tblite-*.whl"
  register: tblite_wheelhouse_wheels
  become: true

- name: Refuse a compute host with no tblite wheel (xtb jobs pin here)
  when:
    - os_family == "linux"
    - tblite_required | bool
    - tblite_wheelhouse_wheels.files | length == 0
  ansible.builtin.fail:
    msg: >-
      No tblite-*.whl in {{ autocatpath_wheelhouse }}: struct_relax pins
      fidelity='xtb' jobs to this host and each would fail as infra. Build it
      with scripts/build-tblite-wheel and push it with
      -e tblite_wheel=<path> (playbook 44).

- name: Install the newest tblite wheel into the worker venv
  when:
    - os_family == "linux"
    - tblite_wheelhouse_wheels.files | length > 0
  vars:
    tblite_wheel_newest: >-
      {{ (tblite_wheelhouse_wheels.files | map(attribute='path') | sort | last) }}
  ansible.builtin.shell: |
    {{ autocatpath_uv_bin }} pip install --python {{ autocatpath_worker_venv }}/bin/python \
      --constraints /opt/precis/constraints.txt \
      --overrides /opt/precis/overrides.txt \
      '{{ tblite_wheel_newest }}'
  become: true
  register: tblite_wheel_install
  changed_when: >-
    'Installed' in (tblite_wheel_install.stdout + tblite_wheel_install.stderr)
    or 'Updated' in (tblite_wheel_install.stdout + tblite_wheel_install.stderr)
  notify: restart precis-worker (autocatpath)

# The rung's exact calculator (precis.structure.relax._xtb_calculator) on
# water: a clean import over a broken OpenBLAS/libgfortran bundle would only
# surface on the first real job otherwise. GFN2 water is about -5.07 Eh.
- name: Verify GFN2-xTB runs in the worker venv (tblite single point on water)
  when:
    - os_family == "linux"
    - tblite_wheelhouse_wheels.files | length > 0
  ansible.builtin.command:
    cmd: >-
      {{ autocatpath_worker_venv }}/bin/python -c "from ase.build import molecule;
      from tblite.ase import TBLite; w = molecule('H2O');
      w.calc = TBLite(method='GFN2-xTB', electronic_temperature=1000.0, verbosity=0);
      e = w.get_potential_energy() / 27.211386;
      assert -5.2 < e < -5.0, e; print(f'GFN2 water {e:.6f} Eh')"
  become: true
  changed_when: false
