---
# autocatpath — make the GPU node run precis-mcp `autocatpath_explore` jobs.
#
# The precis-mcp worker (deployed by roles/precis_worker) claims a autocatpath job —
# only on THIS node, per the target_node claim gate — and runs the autocatpath
# pipeline (relax + NEB) locally via the installed backend, sinking the
# reaction-network result into the `pathway` ref.
#
# The `pathway` glue ships in-tree with precis-mcp (src/precis_pathway, like
# precis_bio); the heavy engine is the PURE `autocatpath` PyPI package pulled by
# the precis-mcp `[catalyst-gpu]` extra (autocatpath[mace]). So this role just
# adds that extra to the worker venv precis_worker manages, then wires
# PRECIS_AUTOCATPATH_ENABLED / PRECIS_NODE via a systemd drop-in (never touching
# the precis_worker unit template). Linux / compute node only — the macOS MCP
# host gets the kind SURFACE via roles/precis_web (the [catalyst] extra). See
# roles/autocatpath/README.md and ADR 0069.

- name: autocatpath targets the Linux compute node only
  ansible.builtin.assert:
    that: os_family == "linux"
    fail_msg: >-
      The autocatpath role installs the compute backend on the Linux GPU node
      (the GPU node). The macOS gateway needs only the KIND SURFACE (precis-mcp[catalyst]
      in the web venv + PRECIS_AUTOCATPATH_ENABLED) — wire that via roles/precis_web,
      not here. See roles/autocatpath/README.md.

- name: Install precis-mcp[{{ autocatpath_extras }}] (pulls the autocatpath engine) into the precis worker venv
  ansible.builtin.shell: |
    {{ autocatpath_uv_bin }} pip install --python {{ autocatpath_worker_venv }}/bin/python --upgrade \
      --refresh-package autocatpath \
      --constraints /opt/precis/constraints.txt \
      'precis-mcp[{{ autocatpath_extras }}] @ git+https://github.com/retospect/precis-mcp@{{ precis_worker_git_ref | default("main") }}'
  become: true
  register: autocatpath_install
  changed_when: >-
    'Installed' in (autocatpath_install.stdout + autocatpath_install.stderr)
    or 'Updated' in (autocatpath_install.stdout + autocatpath_install.stderr)
  notify: restart precis-worker (autocatpath)

# triton's CUDA-kernel JIT (the cuequivariance MACE path below) compiles a C
# shim that includes Python.h at RUN time — without the dev headers every
# MACE single-point dies with "fatal error: Python.h: No such file or
# directory" and the seed job fails 100% deterministically (gr246592;
# first exercised by autocatpath 0.17's ledger/poison pre-relax steps).
- name: Install Python dev headers for triton's runtime CUDA JIT (ML-backend node only)
  when: inventory_hostname in (precis_capabilities.autocatpath_mace | default([]))
  ansible.builtin.apt:
    name: python3.12-dev
    state: present
  become: true

# cuequivariance GPU accel for MACE. Without it, MACE prints "Cuequivariance
# acceleration will be disabled." and runs its equivariant tensor-products on a
# slow fallback — on the GB10 (Grace-Blackwell, aarch64, torch cu130) that made a
# single seed's relax+NEB take 2.5-3.7 h and blow its ssh_node wall deadline
# (0 results). The accel wheels exist for this platform
# (cuequivariance-ops-torch-cu13, aarch64), turning the per-eval cost down toward
# the minutes-scale seed_job.py assumes. NOT foldable into a precis-mcp extra: the
# ops wheel is CUDA-13 + aarch64 specific, so it stays a node-scoped install gated
# to the ML-backend host, not a portable extra. (A cu12 MACE node would instead
# need cuequivariance-ops-torch-cu12.) A running seed is a fresh subprocess, so the
# next seed launched after this install picks the accel up — no worker bounce
# needed for it to take effect, though the shared handler fires anyway.
- name: Install cuequivariance GPU accel for MACE into the worker venv (ML-backend node only)
  when: inventory_hostname in (precis_capabilities.autocatpath_mace | default([]))
  ansible.builtin.shell: |
    {{ autocatpath_uv_bin }} pip install --python {{ autocatpath_worker_venv }}/bin/python \
      --constraints /opt/precis/constraints.txt \
      'cuequivariance-torch==0.11.1' 'cuequivariance-ops-torch-cu13==0.11.1'
  become: true
  register: autocatpath_cueq_install
  changed_when: >-
    'Installed' in (autocatpath_cueq_install.stdout + autocatpath_cueq_install.stderr)
    or 'Updated' in (autocatpath_cueq_install.stdout + autocatpath_cueq_install.stderr)
  notify: restart precis-worker (autocatpath)

- name: Verify cuequivariance GPU accel imports in the worker venv (ML-backend node only)
  when: inventory_hostname in (precis_capabilities.autocatpath_mace | default([]))
  ansible.builtin.command:
    cmd: "{{ autocatpath_worker_venv }}/bin/python -c 'import cuequivariance_torch; print(cuequivariance_torch.__version__)'"
  become: true
  changed_when: false

# ── private-wheel override (see defaults/main.yml) ─────────────────────────
# Runs AFTER both constraints-pinned installs above so the wheel's version is
# what the venv ends on; deps resolve unconstrained (the engine's runtime deps
# are the stable scientific stack, already present from the pinned install).
- name: Ensure the autocatpath wheelhouse
  ansible.builtin.file:
    path: "{{ autocatpath_wheelhouse }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  become: true

- name: Push the controller-side autocatpath wheel into the wheelhouse
  when: autocatpath_wheel | length > 0
  ansible.builtin.copy:
    src: "{{ autocatpath_wheel }}"
    dest: "{{ autocatpath_wheelhouse }}/"
    owner: root
    group: root
    mode: "0644"
  become: true

# find + install shared with roles/precis_worker's redeploy re-apply.
- name: Apply the wheelhouse (find + install newest)
  ansible.builtin.include_tasks: wheelhouse.yml

# Pre-seed the MACE-MP-0 weights into the worker's cache. autocatpath's NEB gives
# each image its own calculator, so the FIRST mace job loads the model N times
# concurrently — and on a cold cache they race to download it and fail
# ("Model download failed"). Warming it once here, as the worker user with the
# worker unit's HOME (so the cache lands where the daemon looks — mace uses
# $HOME/.cache/mace, not HF_HOME), removes the race.
- name: Pre-seed the MACE model into the worker cache
  when: inventory_hostname in (precis_capabilities.autocatpath_mace | default([]))
  become: true
  become_user: "{{ autocatpath_worker_user }}"
  environment:
    HOME: "{{ autocatpath_worker_home }}"
  ansible.builtin.command:
    cmd: >-
      {{ autocatpath_worker_venv }}/bin/python -c "from mace.calculators import
      mace_mp; mace_mp(model='medium', device='cpu')"
  register: autocatpath_mace_warm
  changed_when: "'Cached MACE model' in (autocatpath_mace_warm.stdout + autocatpath_mace_warm.stderr)"

# ── worker env (systemd drop-in — leaves the precis_worker unit untouched) ──
- name: Ensure the precis env dir
  ansible.builtin.file:
    path: /etc/precis
    state: directory
    owner: root
    group: root
    mode: "0755"
  become: true

- name: Drop the worker autocatpath env file
  ansible.builtin.template:
    src: autocatpath.env.j2
    dest: /etc/precis/autocatpath.env
    owner: root
    group: root
    mode: "0644"
  become: true
  notify: restart precis-worker (autocatpath)

- name: Ensure the precis-worker systemd drop-in dir
  ansible.builtin.file:
    path: /etc/systemd/system/precis-worker.service.d
    state: directory
    owner: root
    group: root
    mode: "0755"
  become: true

- name: Drop the precis-worker autocatpath env drop-in (EnvironmentFile)
  ansible.builtin.template:
    src: precis-worker-autocatpath.conf.j2
    # 20- sorts after dft's 10- ; both set PRECIS_NODE to the same value.
    dest: /etc/systemd/system/precis-worker.service.d/20-autocatpath.conf
    owner: root
    group: root
    mode: "0644"
  become: true
  notify: restart precis-worker (autocatpath)

- name: Verify the bundled pathway plugin + engine import in the worker venv
  ansible.builtin.command:
    cmd: "{{ autocatpath_worker_venv }}/bin/python -c 'import precis_pathway.handler, autocatpath; print(autocatpath.__version__)'"
  become: true
  changed_when: false
