---
# autocatpath role defaults — add the reaction-pathway compute stack
# (precis-mcp[catalyst-gpu] → autocatpath[mace]) to the precis worker venv on the
# GPU node and wire the worker env so it runs `autocatpath_explore` jobs pinned here.
#
# Mirrors roles/dft, but the engine IS a Python package (goes in the venv), whereas
# precis-dft lives in a container image. Everything gates on the single topology
# map (inventory/group_vars/all/topology.yml): this role runs where
# `inventory_hostname in precis_capabilities.autocatpath`.

# The precis worker venv this installs into (same one roles/precis_worker manages).
autocatpath_worker_venv: "{{ precis_worker_venv | default('/opt/precis/venv') }}"

# uv, per OS — same expression roles/precis_worker uses.
autocatpath_uv_bin: "{{ '/opt/homebrew/bin/uv' if os_family == 'darwin' else '/root/.local/bin/uv' }}"

# The node this role targets / autocatpath_explore jobs pin themselves to. Must match
# inventory_hostname so the target_node claim gate lets THIS node's worker run it.
autocatpath_node: "{{ inventory_hostname }}"

# The worker runs as this user.
autocatpath_worker_user: deploy

# The precis-worker unit's HOME (Environment=HOME in precis-worker.service).
# MACE caches its model under $HOME/.cache/mace, so the pre-seed must use this
# same HOME or the daemon won't find the warmed weights.
autocatpath_worker_home: /var/lib/precis

# ── private-wheel override (pre-PyPI engine releases) ──────────────────────
# Host-side wheelhouse: any `autocatpath-*.whl` sitting here (newest by name
# wins) is installed OVER the constraints-pinned engine after the extras
# install, every run — so an unpublished engine release can serve fleet-wide
# without touching the PyPI pin, and SURVIVES redeploys (the wheel lives on
# the host; the constraints pin would otherwise silently revert it, the exact
# wipe that voided the 0.14 re-scores). Once the version is on PyPI and the
# precis pin bump ships, DELETE the wheel(s) from every host — a lingering
# wheel pins the venv to its exact version over any newer published pin.
autocatpath_wheelhouse: /opt/precis/wheels
# Optional controller-side wheel to push into the wheelhouse this run:
#   ansible-playbook playbooks/44-autocatpath.yml \
#     -e autocatpath_wheel=$HOME/catpath/dist/autocatpath-0.18.0-py3-none-any.whl
autocatpath_wheel: ""

# The precis-mcp extra to install, derived from the topology in ONE expression:
# 'catalyst-gpu' (→ autocatpath[mace], the torch/MACE backend) on autocatpath_mace
# nodes; else 'catalyst' (→ pure autocatpath, EMT-only, dependency-light). Exactly
# one ML backend per env — autocatpath's mace/chgnet/… extras conflict — so the
# GPU node takes catalyst-gpu and nothing else. Single expression on purpose (a
# folded-scalar intermediate mis-rendered on fresh nodes before).
autocatpath_extras: >-
  {{ 'catalyst-gpu' if inventory_hostname in (precis_capabilities.autocatpath_mace | default([])) else 'catalyst' }}
