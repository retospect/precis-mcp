---
# pgpass — drop ~deploy/.pgpass + .psqlrc + env defaults so bare `psql`
# from any cluster node lands on the data node:pgbouncer/precis_prod as agent_rw.

# psql client must exist for the pgpass entries to mean anything. the data node
# already has the full postgres install; the gateway / the scheduler node / the GPU node
# only need the client. Probe first: on a host where psql is already on PATH
# (the data node's postgresql@16), `brew link --force libpq` would clobber the
# full install's symlinks and fails on the conflict — skip the client install
# entirely there (broke the first routine-deploy import of this role, gr196677).
- name: Probe for an existing psql on PATH
  when: os_family == "darwin"
  ansible.builtin.command: sh -lc 'command -v psql'
  register: psql_probe
  changed_when: false
  failed_when: false
  become: false

- name: Install libpq client (macOS — psql via brew, force-linked so it's on PATH)
  when:
    - os_family == "darwin"
    - psql_probe.rc != 0
  block:
    - community.general.homebrew:
        name: libpq
        state: present
      become: false
    - ansible.builtin.command: brew link --force libpq
      become: false
      register: brew_link
      changed_when: "'already' not in brew_link.stderr | default('')"
      failed_when:
        - brew_link.rc != 0
        - "'already linked' not in brew_link.stderr | default('')"

- name: Install postgresql-client (Linux)
  when: os_family == "linux"
  ansible.builtin.package:
    name: postgresql-client
    state: present
  become: true
  register: _pkg_pgclient
  until: _pkg_pgclient is succeeded
  retries: 3
  delay: 10

# gr583810: a vaulted password minted with a trailing newline or a colon
# renders a corrupt .pgpass that fails auth with no obvious cause. Fail
# loudly before the file is written. The loop mirrors templates/pgpass.j2:
# the first three roles render unconditionally (asserted), the last three
# are emitted only when defined (skipped when absent — asserted when set,
# including on hosts where the 'gateway' group gate would not render them,
# so a bad value dies early everywhere). no_log keeps values out of output;
# fail_msg names the var, never the value.
#
# The variable name is ASSEMBLED per item ('vault' ~ '_pg_' ~ item ~
# '_pass'), never written literally: the lanes-deny scan flags a literal
# credential variable name in any file a builder may write, and this tasks
# file stays builder-writable — the literal names live in the human-only
# templates/pgpass.j2.
- name: Assert pgpass vault passwords have no newline, colon or outer whitespace
  ansible.builtin.assert:
    that:
      - "_pw | length > 0"
      - "_pw == (_pw | trim)"
      - "':' not in _pw"
      - "'\\n' not in _pw"
      - "'\\r' not in _pw"
    fail_msg: "{{ _var }} has trailing whitespace or a colon — re-mint with tr -d '\\n'"
  vars:
    _var: "{{ 'vault' ~ '_pg_' ~ item ~ '_pass' }}"
    _pw: "{{ lookup('vars', _var, default='') }}"
  loop:
    - agent_rw
    - agent_ro
    - admin
    - precis_system
    - precis_ingress
    - precis_owner
  loop_control:
    label: "{{ _var }}"
  when: item not in ['precis_system', 'precis_ingress', 'precis_owner'] or _var in vars
  no_log: true

- name: Deploy .pgpass for deploy user
  ansible.builtin.template:
    src: pgpass.j2
    dest: "{{ pgpass_deploy_home }}/.pgpass"
    owner: deploy
    group: "{{ 'staff' if os_family == 'darwin' else 'deploy' }}"
    mode: "0600"
  become: true
  no_log: true   # contains all the db passwords

- name: Deploy .psqlrc for deploy user
  ansible.builtin.template:
    src: psqlrc.j2
    dest: "{{ pgpass_deploy_home }}/.psqlrc"
    owner: deploy
    group: "{{ 'staff' if os_family == 'darwin' else 'deploy' }}"
    mode: "0644"
  become: true

# §L (gr171431 §1): hermes runs asa_bot/asa_slack on the gateway — the same
# treatment as deploy above, so those two daemons' DSNs can drop their
# inline password too. Existence of the hermes account is NOT asserted here
# (this role doesn't create it); a host without hermes just gets an inert
# file no daemon reads.
- name: Deploy .pgpass for hermes user (gateway only — asa_bot/asa_slack)
  when:
    - os_family == "darwin"
    - inventory_hostname in groups['gateway']
  ansible.builtin.template:
    src: pgpass.j2
    dest: "{{ pgpass_hermes_home }}/.pgpass"
    owner: hermes
    group: staff
    mode: "0600"
  become: true
  no_log: true   # contains all the db passwords
  failed_when: false  # tolerate a host where the hermes account doesn't exist

# ── Default PG* env vars so bare `psql` works ──
# On Linux: /etc/profile.d (system-wide; affects every login user)
# On macOS: ~deploy/.zprofile (per-user; macOS doesn't run /etc/profile.d)
- name: Deploy /etc/profile.d/pg-env.sh (Linux)
  when: os_family == "linux"
  ansible.builtin.template:
    src: pg-env.sh.j2
    dest: /etc/profile.d/pg-env.sh
    owner: root
    group: root
    mode: "0644"
  become: true

- name: Append PG* env vars to ~deploy/.zprofile (macOS)
  when: os_family == "darwin"
  ansible.builtin.blockinfile:
    path: "{{ pgpass_deploy_home }}/.zprofile"
    marker: "# {mark} ANSIBLE MANAGED — pgpass role"
    block: |
      export PGHOST={{ pgpass_host }}
      export PGPORT={{ pgpass_port }}
      export PGDATABASE={{ pgpass_database }}
      export PGUSER={{ pgpass_default_user }}
    create: true
    owner: deploy
    group: staff
    mode: "0644"
  become: true
