---
# Defaults for the vllm role: one vLLM container, one model, one GB10 host,
# run as a permanent systemd service (docs/backlog/vllm-per-node-serving.md
# Slice 1). Targets the inventory group `vllm_serving` (see
# playbooks/49-vllm.yml). Defaults are the Slice 0 measured gpt-oss 120B
# MXFP4 setup. The model is not final: switching is the one variable block
# shown under "Models" in README.md.

# ── Container ──
vllm_container_cmd: docker
vllm_image: "vllm/vllm-openai:v0.20.1"
# Container + systemd unit name (unit is <vllm_service_name>.service).
vllm_service_name: vllm
# Docker Hub is flaky from the LAN (TLS timeouts). A pre-pulled / docker-load'ed
# image satisfies the role with no registry call; otherwise the pull is bounded.
vllm_pull_retries: 6
vllm_pull_delay: 20
vllm_pull_timeout: 900          # seconds per pull attempt (hard cap)
# A unit that must not coexist with this one on the same port: stopped and
# disabled when present (the sglang role's unit). Empty string = no check.
vllm_supersedes_service: sglang

# ── Endpoint ──
# Matches llamacpp (llama-swap binds 0.0.0.0): LAN-reachable. Set to the
# host's LAN address in group_vars to narrow it.
vllm_bind_addr: "0.0.0.0"
vllm_port: 8000

# ── Model (gpt-oss 120B MXFP4 defaults) ──
# Host directory holding the weights (HF format); mounted read-only at /model.
vllm_model_dir: /srv/models/gpt-oss-120b
# Name clients send as `model`.
vllm_served_model_name: gpt-oss-120b
# Extra names the same model answers to. precis routes by its llm card name
# (`openai/gpt-oss-120b`, resource_slots `llm:openai/gpt-oss-120b`); a call
# with that name 404s unless it is served under it too (seen 2026-10-12).
vllm_served_model_aliases:
  - openai/gpt-oss-120b
# --tool-call-parser value. gpt-oss: openai. Nemotron 3 Super: qwen3_xml.
vllm_tool_call_parser: openai
# gpt-oss loads the harmony tokenizer vocab from the internet at startup and
# the container cannot reach it: stage o200k_base.tiktoken and
# cl100k_base.tiktoken in this host dir; it is mounted at /tiktoken with
# TIKTOKEN_ENCODINGS_BASE set. Empty string = no mount (non-gpt-oss models).
vllm_tiktoken_dir: /srv/models/tiktoken
# Extra flags appended verbatim (list), e.g. ["--trust-remote-code"].
vllm_extra_args: []
# Container environment (`-e K=V` each). Default is the GB10 (SM121) MXFP4
# workaround: the stock image's Marlin MoE kernel has a shared-memory race on
# SM121 that yields flat logits for the first token (token 0 `!`, nondeterministic
# at temperature 0; vllm-project/vllm#37030, NVIDIA forum "SM121 4 bugs causing
# ! output"). Measured on castor 2026-10-13 at 16384/0.70 before this env.
vllm_env:
  VLLM_MARLIN_USE_ATOMIC_ADD: "1"

# ── Sizing (Slice 0 measured; local-compute-15 ruling) ──
# GB10 memory is unified: this fraction of the WHOLE box goes to vLLM. At 0.80
# on a 121 GiB castor the engine held 98 GiB, the host had 1 GiB free and was
# swapping, and generation was garbage from the first token (2026-10-12, see
# docs/backlog/claude-code-on-local-serving.md). 0.70 (85 GiB to vLLM, ~36 GiB
# left) still wedged castor twice on 2026-10-15 with the MACE and compute lanes
# and docker builds beside it (Reto: 0.7 -> 0.6). 0.60 gives vLLM ~73 GiB and
# leaves ~48 GiB; gpt-oss-120b MXFP4 weights take ~61 GiB of the 73, so the KV
# cache shrinks to roughly half the 0.70 pool. Check vLLM's "Maximum
# concurrency" startup line against vllm_max_num_seqs after a redeploy.
vllm_gpu_memory_utilization: 0.60
# 16384 is the only window measured sound on castor with this image: 65536 and
# 131072 produced empty replies, stray token-0 `!` and nondeterministic output at
# temperature 0 (2026-10-12). Claude Code turns (scripts/claude-local) need more;
# that is the window experiment in docs/backlog/claude-code-on-local-serving.md.
vllm_max_model_len: 16384
# Server sized for 64 streams; a separate feedback controller holds ~32.
vllm_max_num_seqs: 64

# ── Health wait ──
# Model load measured 505-861 s, then ~45 s engine init; a cold image pull adds
# more. Two runs outran the old 900 s cap (924 s, 1230 s). Bounded: retries*delay.
vllm_health_retries: 150
vllm_health_delay: 10
