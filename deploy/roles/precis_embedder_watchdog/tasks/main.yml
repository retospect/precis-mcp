---
# precis_embedder_watchdog — external health-kicker for precis_embedder
# (gripe 51394 pt2). A single POSIX-sh probe script is templated onto
# every host and fired on a timer by launchd (macOS) / systemd (Linux);
# after precis_embedder_watchdog_fail_threshold consecutive /readyz
# failures it restarts the embedder daemon.
#
# Coexists with precis_embedder on every host. Runs as root (unlike
# precis_heartbeat/precis_embedder, which run as `deploy`) — the restart
# command needs root to kickstart/restart a system-domain daemon.

- name: Ensure /opt/precis/bin exists (probe script destination)
  ansible.builtin.file:
    path: /opt/precis/bin
    state: directory
    mode: "0755"
  become: true

- name: Render precis-embedder-watchdog probe script
  ansible.builtin.template:
    src: precis-embedder-watchdog.sh.j2
    dest: "{{ precis_embedder_watchdog_script }}"
    mode: "0755"
    owner: root
  become: true
  notify:
    - restart precis embedder watchdog (macos)
    - restart precis embedder watchdog (linux)

# ── macOS: launchd ─────────────────────────────────────────────────

- name: Ensure precis-embedder-watchdog log file is writable
  when: os_family == "darwin"
  ansible.builtin.file:
    path: /var/log/precis-embedder-watchdog.log
    state: touch
    mode: "0664"
    owner: deploy
    group: staff
    modification_time: preserve
    access_time: preserve
  become: true

- name: Ensure precis-embedder-watchdog LaunchDaemon plist
  when: os_family == "darwin"
  ansible.builtin.template:
    src: precis-embedder-watchdog.plist.j2
    dest: /Library/LaunchDaemons/com.precis.embedder-watchdog.plist
    mode: "0644"
    owner: root
    group: wheel
  become: true
  notify: restart precis embedder watchdog (macos)

# §L (gr176337): this used to be an unconditional raw bootout→bootstrap
# pair (the exact racy pattern gr176223 fixed everywhere else), firing on
# EVERY run regardless of whether the plist actually changed. The plist
# template task above already `notify`s "restart precis embedder watchdog
# (macos)" — which routes through the shared poll-until-gone
# `tasks/reload_launchd.yml` (see handlers/main.yml) — so the real
# reload-with-new-env only needs to happen there. This step is now just
# the idempotent "load if not already loaded" no-op, mirroring the fixed
# precis_worker pattern (gripe #48481).
- name: Load precis-embedder-watchdog LaunchDaemon (macOS — idempotent)
  when: os_family == "darwin"
  ansible.builtin.command: >
    launchctl load -w /Library/LaunchDaemons/com.precis.embedder-watchdog.plist
  become: true
  changed_when: false
  failed_when: false

# ── Linux: systemd timer ───────────────────────────────────────────

- name: Render precis-embedder-watchdog systemd service (Linux)
  when: os_family == "linux"
  ansible.builtin.template:
    src: precis-embedder-watchdog.service.j2
    dest: /etc/systemd/system/precis-embedder-watchdog.service
    mode: "0644"
  become: true
  notify: restart precis embedder watchdog (linux)

- name: Render precis-embedder-watchdog systemd timer (Linux)
  when: os_family == "linux"
  ansible.builtin.template:
    src: precis-embedder-watchdog.timer.j2
    dest: /etc/systemd/system/precis-embedder-watchdog.timer
    mode: "0644"
  become: true
  notify: restart precis embedder watchdog (linux)

- name: Enable + start precis-embedder-watchdog timer (Linux)
  when: os_family == "linux"
  ansible.builtin.systemd:
    name: precis-embedder-watchdog.timer
    state: started
    enabled: true
    daemon_reload: true
  become: true
