---
# Backup strategy: pg_dump → /shared/backups/postgres, B2 offsite
# Optional: USB rsync if backup_usb_mount is defined in host_vars
# Runs on the data node (internal SSD at /opt/nfs)
#
# `shared_mount` on the DB node must resolve to a HOST-LOCAL path. It aliases
# to the same directory as the cluster NFS path there, so both spellings
# "work" — but routing nightly ~21 GB dumps through the host's own NFS client
# puts the lockd layer in the backup write path, and that layer is what hangs
# (`ls` times out at 60 s on the compute nodes — see
# docs/runbooks/backup-restore-drill.md). Check the overlay's value before a
# run: host-local path, not the NFS alias.

- name: Set postgres runtime user
  ansible.builtin.set_fact:
    pg_user: "{{ 'deploy' if os_family == 'darwin' else 'postgres' }}"

- name: Ensure zstd is installed (macOS — for the NAS-archive step in pg_backup.sh)
  when: os_family == "darwin"
  community.general.homebrew:
    name: zstd
    state: present
  become: false

- name: Ensure zstd is installed (Linux)
  when: os_family == "linux"
  ansible.builtin.package:
    name: zstd
    state: present
  become: true

- name: Ensure backup directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ pg_user }}"
    mode: "0750"
  become: true
  loop:
    - "{{ shared_mount }}/backups/postgres"
    - "{{ shared_mount }}/backups/configs"
    - "{{ shared_mount }}/scripts"
    - "{{ shared_mount }}/logs"

- name: Ensure NAS backup destination exists
  ansible.builtin.file:
    path: "{{ nas_root }}/backups/postgres"
    state: directory
    owner: "{{ pg_user }}"
    mode: "0755"
  become: true

- name: Deploy pg_dump backup script
  ansible.builtin.template:
    src: pg_backup.sh.j2
    dest: "{{ shared_mount }}/scripts/pg_backup.sh"
    mode: "0750"
    owner: "{{ pg_user }}"
  become: true

- name: Deploy USB rsync backup script
  when: backup_usb_mount is defined
  ansible.builtin.template:
    src: usb_backup.sh.j2
    dest: "{{ shared_mount }}/scripts/usb_backup.sh"
    mode: "0750"
  become: true

- name: Deploy restore test script
  ansible.builtin.template:
    src: restore_test.sh.j2
    dest: "{{ shared_mount }}/scripts/restore_test.sh"
    mode: "0750"
    owner: "{{ pg_user }}"
  become: true

# 03:30, not earlier: the DB node's daily-update-reboot root cron drains
# Postgres and reboots at 03:00 UTC. Running the dump 30 min after gives the
# DB time to come back and lets the backup grow toward a ~23 h budget before
# the next reboot, instead of the old 02:00 slot's hard 60-min ceiling.
# The slot and the deploy no-go window it implies are both in
# defaults/main.yml — change them there, together.
- name: Schedule nightly pg_dump via cron
  ansible.builtin.cron:
    name: "pg_dump nightly backup"
    minute: "{{ pg_backup_cron_minute }}"
    hour: "{{ pg_backup_cron_hour }}"
    job: "{{ shared_mount }}/scripts/pg_backup.sh >> {{ shared_mount }}/logs/backup-pg.log 2>&1"
    user: "{{ pg_user }}"
  become: true

- name: Schedule weekly USB rsync
  when: backup_usb_mount is defined
  ansible.builtin.cron:
    name: "weekly USB rsync backup"
    minute: "0"
    hour: "5"
    weekday: "0"
    job: "{{ shared_mount }}/scripts/usb_backup.sh >> {{ shared_mount }}/logs/backup-usb.log 2>&1"
  become: true

- name: Schedule weekly restore test
  ansible.builtin.cron:
    name: "weekly restore test"
    minute: "0"
    hour: "6"
    weekday: "1"
    job: "{{ shared_mount }}/scripts/restore_test.sh >> {{ shared_mount }}/logs/backup-tests.log 2>&1"
    user: "{{ pg_user }}"
  become: true

# ── Backblaze B2 offsite backup ──
- name: Ensure uv is installed (macOS)
  when: os_family == "darwin"
  community.general.homebrew:
    name: uv
    state: present
  become: false

- name: Set uv binary path
  ansible.builtin.set_fact:
    uv_bin: "{{ '/opt/homebrew/bin/uv' if os_family == 'darwin' else '/root/.local/bin/uv' }}"

- name: Create B2 CLI venv with uv
  ansible.builtin.command:
    cmd: "{{ uv_bin }} venv /opt/b2"
    creates: /opt/b2/bin/python
  become: true

- name: Install Backblaze B2 CLI with uv
  ansible.builtin.shell: |
    {{ uv_bin }} pip install --python /opt/b2/bin/python 'b2[full]>=4,<5'
  become: true
  register: b2_install
  changed_when: "'Installed' in b2_install.stdout"

- name: Symlink b2 binary into PATH
  ansible.builtin.file:
    src: /opt/b2/bin/b2
    dest: /usr/local/bin/b2
    state: link
    force: true
  become: true

- name: Deploy B2 sync script
  ansible.builtin.template:
    src: b2_sync.sh.j2
    dest: "{{ shared_mount }}/scripts/b2_sync.sh"
    mode: "0750"
  become: true

- name: Schedule nightly B2 offsite sync (after the 03:30 pg_dump, ~40 min runtime)
  ansible.builtin.cron:
    name: "nightly b2 offsite sync"
    minute: "30"
    hour: "4"
    job: "{{ shared_mount }}/scripts/b2_sync.sh >> {{ shared_mount }}/logs/backup-b2.log 2>&1"
  become: true

# ── Restore-drill pull access ──
# Lets the drill host stage a dump over the cluster's own network instead of an
# operator relaying 21 GB from outside it (65 min of a measured 3 h recovery —
# docs/runbooks/backup-restore-drill.md). Both tasks are inert until the
# overlay defines the two vars, so this ships dark.
#
# The key reads whole production dumps, so it is scoped three ways: a dedicated
# keypair (revocable without touching operator access), `from=` plus `restrict`,
# and a forced command that is not a shell. Direction is deliberate — the drill
# host PULLS. A push would need drill work running on the prod DB node.
- name: Deploy restore-drill pull wrapper (forced command for the drill key)
  when: drill_pull_pubkey is defined
  ansible.builtin.template:
    src: drill_pull.sh.j2
    dest: "{{ shared_mount }}/scripts/drill_pull.sh"
    mode: "0750"
    owner: "{{ pg_user }}"
  become: true

# drill_pull_from carries the drill host's address and MUST come from the
# gitignored overlay — a literal here would leak a node address from a public
# repo and redden tests/test_deploy_tree_no_secrets.py.
- name: Authorise the restore-drill pull key (read-only, forced command)
  when:
    - drill_pull_pubkey is defined
    - drill_pull_from is defined
  ansible.posix.authorized_key:
    user: "{{ pg_user }}"
    key: "{{ drill_pull_pubkey }}"
    comment: "restore-drill pull (read-only)"
    key_options: 'restrict,from="{{ drill_pull_from }}",command="{{ shared_mount }}/scripts/drill_pull.sh"'
    state: present
    exclusive: false
  become: true
