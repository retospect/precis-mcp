---
# backups role defaults. Overridable via host_vars or group_vars.
#
# The nightly pg_dump schedules and the deploy no-go windows they imply live
# HERE, together, so a schedule change moves both. scripts/deploy reads every
# `<X>_window_start_utc`/`<X>_window_end_utc` pair from this file
# (scripts/lib/backup-window.sh, a line-oriented awk read: keep them as plain
# `key: "HH:MM"` lines) — each pair sits next to the `pg_<X>_cron_*` slot it
# mirrors — and refuses a deploy that carries a pending migration while ANY
# window is open:
# the dump holds ACCESS SHARE on every table for its whole run, and a
# migration's ALTER TABLE (ACCESS EXCLUSIVE) waits behind it for ~48 min
# (2026-09-08: a /go at 03:22 UTC hung 17+ min with a silent log). See
# docs/runbooks/migration-deploy-window.md.
#
# The nightly 03:00 UTC macOS reboot (daily-update-reboot root cron) is
# optional per host (hardening_macos_nightly_reboot; off by default). The
# 03:30 dump time stays as-is either way. It starts 30 min after that slot and runs ~48 min (03:30 → ~04:18 UTC, very stable), so
# the window closes at 04:20 UTC. tests/test_deploy_backup_window.py asserts
# the cron slot falls inside the window.
pg_backup_cron_hour: "3"
pg_backup_cron_minute: "30"
backup_window_start_utc: "03:00"
backup_window_end_utc: "04:20"

# Nightly B2 offsite sync. Off: the offsite copy is a full NAS-disk copy
# (td461209, Reto 2026-10-11). Set true in the overlay to re-enable.
b2_sync_enabled: false

# Incremental leg (backup-incremental phase 1): uncompressed fixed-dir
# pg_dump rsynced to the dbbackup share for the NAS restic leg. Nightly at
# 21:45 UTC — outside the 03:00–04:20 window and clear of the optional
# 03:00 reboot. pg_backup_dir_enabled=false removes the cron entry; the
# script stays deployed either way.
pg_backup_dir_enabled: true
pg_backup_dir_cron_hour: "21"
pg_backup_dir_cron_minute: "45"
# Its deploy no-go window (gr513885): the dump runs ~60–90 min from the 21:45
# slot holding ACCESS SHARE like the early-morning leg; the rsync after it
# holds no DB locks. 15 min of lead before the slot, 15 of slack after the
# worst-case end.
backup_dir_window_start_utc: "21:30"
backup_dir_window_end_utc: "23:30"
# The DB node's mount of the dbbackup share. Mirrors the nfs_client role's
# default — an overlay override lands on both, keep the two in step.
dbbackup_mount: /mnt/dbbackup
