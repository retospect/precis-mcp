---
# precis_builder_host — turn a Linux or macOS host into a builder: a
# `precis worker --only job_ssh_node` claimant that runs run_slice /
# land_slice jobs (gr676054). Linux renders a systemd unit, macOS a
# launchd LaunchDaemon — both through the service_unit role.
#
# What the role does NOT do: install the lane CLIs (agent_clis is the one
# door, driven by scripts/agent-cli-update), lay ~/.pgpass (19-pgpass),
# or install colima on a Mac (precis_worker_agent's provision half).
# Those are playbook/coordinator steps — see
# me691785.

# The account the worker unit, the lane CLIs, the checkout and the tunnel run
# as. `deploy` (the default) is the gateway's account and is provisioned by
# 00-users. Any other name (the dedicated least-privilege builder user,
# `coder`) is created by this role: no password, no sudo, no groups beyond
# its own, home 0700, its own ~/.pgpass, rootless docker (Linux) or its own
# colima (macOS) instead of the root-equivalent docker group.
precis_builder_user: deploy
# The user's home, per OS family — clone parent, ssh-key dir, pgpass.
precis_builder_home: "{{ ('/Users/' if os_family == 'darwin' else '/home/') ~ precis_builder_user }}"

# Create the account and wire its docker/pgpass (everything above). Off for
# deploy: 00-users and 19-pgpass own that account.
precis_builder_manage_user: "{{ precis_builder_user != 'deploy' }}"

# Postgres roles whose ~/.pgpass lines the builder user gets: only the one the
# worker's DSN logs in as (agent_rw until the db-own cutover, then
# precis_system) — never the admin / read-only / owner lines deploy holds.
precis_builder_pg_roles:
  - "{{ 'precis_system' if ((precis_db_own_cutover_done | default(false)) in [true, 'true', 'True', 'yes', 1, '1']) else 'agent_rw' }}"

# Linux: docker for this user is rootless docker (its own daemon, socket under
# /run/user/<uid>), not the docker group. Only for a managed non-deploy user.
precis_builder_rootless_docker: "{{ precis_builder_manage_user | bool and os_family == 'linux' }}"
# Subordinate id range size handed to the user for rootless docker.
precis_builder_subid_count: 65536

# The checkout slices build in (PRECIS_SLICE_ROOT): a primary clone of the
# public repo this worker keeps at origin/main — run_slice worktrees hang
# off it. Parameterised like the gateway's (precis_fix_repo_dir), never a
# literal home.
precis_fix_repo_dir: "{{ precis_builder_home }}/precis-fix-repo"

# The lander's coverage map directory (PRECIS_COVERAGE_DB_DIR): land_slice runs
# `scripts/ship --checked` as this account, and scripts/impacted-tests reads
# <dir>/.coverage; without a map it falls back to its static, wider selection.
# The role copies the controller's nightly map here for a managed user on macOS
# (the copy tasks of precis_worker's coverage_map, as 20g does for deploy's
# directory); a Linux builder has none and keeps the static selection.
precis_builder_coverage_db_dir: "{{ precis_builder_home }}/.cache/precis/coverage-db"

# The venv the worker unit execs — provisioned by precis_worker/provision
# (imported ahead of this role in 20i); the name mirrors that role's
# default so an override lands on both.
precis_builder_venv: "{{ precis_worker_venv | default('/opt/precis/venv') }}"

# Worker DSN — same expression as precis_worker_dsn (agent_rw pre-cutover,
# precis_system after); password resolution rides ~deploy/.pgpass (§L).
precis_builder_dsn: "postgresql://{{ 'precis_system' if ((precis_db_own_cutover_done | default(false)) in [true, 'true', 'True', 'yes', 1, '1']) else 'agent_rw' }}@{{ hostvars[postgres_host]['ansible_host'] }}:{{ pgbouncer_port }}/precis_prod"

# The host serving the slice session MCP (mcp-http). Its Caddy proxy
# binds 127.0.0.1 only, so every OTHER builder host reaches it through a
# persistent ssh -L: the checkout's .mcp.json (127.0.0.1:8765) then
# resolves identically everywhere and the bearer surface stays loopback.
# Inventory name. Required when inventory_hostname is not itself the MCP
# host; the tunnel tasks skip on the server host.
precis_builder_mcp_host: ""

# Loopback ports both ends — the tunnel binds 127.0.0.1 only.
precis_builder_mcp_port: 8765

# Dedicated tunnel identity (like ssh_tunnels' tunnel_ed25519): the pubkey
# lands in the MCP host's deploy authorized_keys via delegate_to.
precis_builder_tunnel_key: "{{ precis_builder_home }}/.ssh/precis_builder_tunnel_ed25519"

# The fleet identity a MANAGED (non-deploy) builder user advertises and
# claims under (gr695674): <host>-<user>, e.g. <builder-host>-coder. The
# placement gate reads resource_slots[host] rows the heartbeat pass
# writes, and the
# claim's default_host / lease_host / executor-cap key all derive from the
# same name — so the builder must NOT share the deploy unit's <host> rows:
# its probes see a different home, two heartbeat passes under one name
# would retract each other's tokens every cycle, and deploy-run lanes
# would place against lane bins they cannot exec. The builder unit instead
# runs `heartbeat` itself under this name (PRECIS_HOST_NAME), and
# PRECIS_NODE pins to it likewise so a minted land_slice routes back to
# the worktree's host. <host> is the heartbeat's own base — an overlay
# PRECIS_HOST_NAME when set, else the inventory name. The per-host cap key
# follows it: claim.executor_cap.ssh_node.<host>-<user>. Only rendered
# when precis_builder_manage_user — a `deploy` builder rides the host's
# own heartbeat, whose probes already see the same home.
precis_builder_slots_host: "{{ ((precis_shared_env | default({})).PRECIS_HOST_NAME | default(inventory_hostname)) ~ '-' ~ precis_builder_user }}"

# Slice worker unit knobs. --batch-size bounds NEW claims per tick, not
# concurrency — the running pool is `claim.executor_cap.ssh_node[.<host>]`
# (code default 8; the coordinator sets per-host values through the
# claim-setting door, see the spec's coordinator steps).
precis_builder_idle_seconds: 5
precis_builder_batch_size: 4

# Per-slice bounds (gr762463; the code is
# src/precis/workers/job_types/_slice_limits.py). A build session's shell
# tool starts its commands in process groups of their own, so the session's
# group never held them: one builder's pytest-xdist experiment in /tmp forked
# 5604 processes, 1040 orphaned to pid 1, and starved the host until sshd died.
#
# Every one of these is off in code: only this role turns them on, for the
# builder worker unit. Other lanes that run run_slice (the deploy-user
# compute lane of play 43, the gateway's slices lane of 20g) keep their old
# launch: they have no lingering user manager, and a scope there would take
# the session out of their unit's MemoryMax.
#
# Linux: each session runs in a transient `systemd-run --user --scope` with
# these limits; every descendant, orphans included, stays in it, and the
# run's end, timeout or cancel stops the whole scope. That needs the builder
# account's user manager to linger: a managed user has lingering on
# (docker_rootless.yml). Before each launch the worker checks lingering and
# runs a probe scope with the same limits (cached 10 min); when either
# fails it launches with the process group only and logs why. A session
# that dies of systemd-run's own bus error drops the cached probe and is
# parked as a host failure, not counted against the task.
#
# auto | off. off launches without a scope. auto on Linux; macOS has no
# cgroups and gets RLIMIT_NPROC instead (below).
precis_builder_slice_scope: "{{ 'auto' if os_family == 'linux' else 'off' }}"
# The scope's TasksMax: processes AND threads of one slice (a python with
# numpy holds one thread per core). 0 or off drops the limit.
precis_builder_slice_tasks_max: 2048
# The scope's MemoryMax (MemorySwapMax=0 comes with it): a systemd size
# (16G) or a percentage of host RAM. A scope leaves the worker unit's
# cgroup, so slice memory is NOT counted against the unit's MemoryMax or
# the host memory budget (worker_limits / precis_lane_memory). The 25%
# default only stops one runaway slice from taking more than a quarter of
# the host, whatever the slice concurrency (the executor cap, up to 8 per
# host). Partition per host instead: set it to RAM / <concurrent slices>,
# minus what the host's other services need. off drops the limit.
precis_builder_slice_memory_max: "25%"
# RLIMIT_NPROC (soft and hard) for a session launched without a scope. It
# counts every process of the builder account (the worker, colima, every
# slice), so it must leave room for the host's concurrent slices. On by
# default only for a managed macOS builder user (its own account); empty
# sets none: Linux counts threads against it across the whole account, and
# a deploy-account builder shares that count with every deploy service.
precis_builder_slice_nproc: "{{ 2048 if (os_family == 'darwin' and (precis_builder_manage_user | bool)) else '' }}"

# A second repository's clone on this host, as a dict of repo name -> absolute
# clone path (PRECIS_SLICE_REPOS, run_slice.slice_root_for); NO default. Set it
# in the overlay for the host and run_slice / land_slice for that repo place
# here (the heartbeat probe advertises repo_checkout_<name>); unset or empty the
# key is omitted from the unit and the host takes no second-repo slice. The
# clone is the operator's to place, as on the gateway (20g's precis_slice_repos,
# docs/runbooks/dark-factory-arming.md): an https origin without credentials,
# readable by the builder user (a path under its home, for instance). A
# gateway that is also a builder host sets both: the two units are separate
# accounts with separate clones.
#   precis_builder_slice_repos:
#     <repo>: /Users/coder/<repo>

# macOS: the builder user's colima VM size, passed to `colima start` by the
# builder-colima unit. Empty (the default) passes no flag, so the VM takes
# colima's own defaults, or the size of an existing profile: the same as deploy's
# VM, which this tree does not size either (precis_worker_agent's provision half
# only keeps `colima start` alive). CPUs, GiB of memory, GiB of disk. Applies at
# the next `colima start` from stopped; a running VM keeps its size until
# `colima stop` (every container in it stops: the builder's slice gates), and
# colima can grow a disk but not shrink it.
precis_builder_colima_cpu: ""
precis_builder_colima_memory: ""
precis_builder_colima_disk: ""
# The flags those sizes render into `colima start`: integers only (anything
# else, or 0, drops the flag), so the plist never embeds free text.
precis_builder_colima_start_flags: >-
  {{ (' --cpu ' ~ (precis_builder_colima_cpu | int(0))) if ((precis_builder_colima_cpu | int(0)) > 0) else ''
  }}{{ (' --memory ' ~ (precis_builder_colima_memory | int(0))) if ((precis_builder_colima_memory | int(0)) > 0) else ''
  }}{{ (' --disk ' ~ (precis_builder_colima_disk | int(0))) if ((precis_builder_colima_disk | int(0)) > 0) else '' }}

# The images the gate needs on the builder's docker (gr701559). The heartbeat
# advertises `gate_image` only when both exist; gate_images.yml loads the
# missing ones from precis_builder_gate_image_source (an inventory host that
# holds them, ssh-reachable from this one; empty = report only).
precis_builder_gate_images:
  - precis-mcp:premodels
  - precis-dev
precis_builder_gate_image_source: ""
