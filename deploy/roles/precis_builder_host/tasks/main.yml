---
# precis_builder_host — builder-lane surface on a Linux or macOS host
# (gr676054): the fix-repo checkout, docker, the slice-MCP ssh tunnel and
# the `precis worker --only job_ssh_node` unit. Provisioning order:
# 19-pgpass and the precis_worker venv (provision tasks) land BEFORE this
# role — the playbook assembles that order; the lane CLIs come after via
# scripts/agent-cli-update, not here.

# ── the builder account ──────────────────────────────────────────────
# A non-deploy builder user (`coder`) is created here, gets its own
# ~/.pgpass (only the DB login the worker uses), and runs everything below.
# deploy needs none of it (00-users + 19-pgpass).

- name: Builder user account
  when: precis_builder_manage_user | bool
  ansible.builtin.import_tasks: user.yml

- name: Builder user's own .pgpass (the worker's DB login only)
  when: precis_builder_manage_user | bool
  ansible.builtin.import_role:
    name: pgpass
    tasks_from: user
  vars:
    pgpass_user: "{{ precis_builder_user }}"
    pgpass_user_home: "{{ precis_builder_home }}"
    pgpass_user_roles: "{{ precis_builder_pg_roles }}"

# ── fix-repo checkout (PRECIS_SLICE_ROOT) ────────────────────────────
# Slices build in worktrees of this clone; the worker's heartbeat probes
# `repo_checkout` as <this path>/.git — without it the host never
# advertises and run_slice/land_slice stay unschedulable (gr570787).

- name: Ensure the slice checkout parent is owned by the builder user
  ansible.builtin.file:
    path: "{{ precis_fix_repo_dir | dirname }}"
    state: directory
    owner: "{{ precis_builder_user }}"
    # The managed user's home stays private; a deploy checkout keeps 0755.
    mode: "{{ '0700' if ((precis_fix_repo_dir | dirname) == precis_builder_home and (precis_builder_manage_user | bool)) else '0755' }}"
  become: true

- name: Clone/refresh the slice checkout (public repo, deploy-owned)
  ansible.builtin.git:
    repo: https://github.com/retospect/precis-mcp
    dest: "{{ precis_fix_repo_dir }}"
    version: main
    update: true
    force: true
  become: true
  become_user: "{{ precis_builder_user }}"
  environment:
    HOME: "{{ precis_builder_home }}"

# ── the lander's coverage map ────────────────────────────────────────
# land_slice runs scripts/ship --checked as this account; its test selection
# reads $PRECIS_COVERAGE_DB_DIR/.coverage. 20g copies the controller's nightly
# map to deploy's directory; a managed builder reads its own, so it gets its
# own copy (best-effort: no map on the controller, nothing copied, the
# selection stays static). The copy tasks are macOS-only, like 20g's.

- name: Coverage map for the builder's lander (best-effort)
  when: precis_builder_manage_user | bool
  ansible.builtin.import_role:
    name: precis_worker
    tasks_from: coverage_map
  vars:
    precis_coverage_db_dir: "{{ precis_builder_coverage_db_dir }}"
    precis_coverage_db_owner: "{{ precis_builder_user }}"
    precis_coverage_db_group: "{{ precis_builder_user }}"
    precis_coverage_db_make_parents: true

# ── docker for `scripts/test` inside slices ──────────────────────────
# deploy on Linux gets the distro daemon + compose v2 plugin and a
# docker-group membership (the socket's group mode is the whole grant —
# run_slice passes its parent into codex's writable roots). An existing
# daemon (docker-ce, snap) is left alone: this only fills a gap. A managed
# non-deploy user is NEVER put in the docker group (root-equivalent): it
# gets rootless docker (docker_rootless.yml) and DOCKER_HOST points at its
# own socket. macOS: deploy's colima is precis_worker_agent's provisioning;
# a managed user gets its own colima VM (colima.yml).

- name: Rootless docker for the builder user (Linux)
  when: precis_builder_rootless_docker | bool
  ansible.builtin.import_tasks: docker_rootless.yml

- name: The builder user's own colima VM (macOS)
  when:
    - os_family == "darwin"
    - precis_builder_manage_user | bool
  ansible.builtin.import_tasks: colima.yml

- name: Check for an existing docker daemon (Linux, system docker)
  when:
    - os_family == "linux"
    - not (precis_builder_rootless_docker | bool)
  ansible.builtin.command: docker --version
  register: _builder_docker_probe
  changed_when: false
  failed_when: false

- name: Install docker + compose v2 (Linux, only when absent)
  when:
    - os_family == "linux"
    - not (precis_builder_rootless_docker | bool)
    - _builder_docker_probe.rc != 0
  ansible.builtin.apt:
    name:
      - docker.io
      - docker-compose-v2
    state: present
    lock_timeout: 120
  become: true
  register: _builder_docker_apt
  until: _builder_docker_apt is succeeded
  retries: 3
  delay: 10

- name: Put the deploy user in the docker group (Linux, deploy only)
  when:
    - os_family == "linux"
    - not (precis_builder_manage_user | bool)
  ansible.builtin.user:
    name: "{{ precis_builder_user }}"
    groups: docker
    append: true
  become: true

- name: Gate images on the builder's docker (gr701559)
  ansible.builtin.import_tasks: gate_images.yml

# ── bwrap sandbox (Ubuntu 24.04 AppArmor userns restriction) ─────────
# codex sandboxes every session with bwrap, which needs an unprivileged
# user namespace. Ubuntu 24.04 sets kernel.apparmor_restrict_unprivileged_
# userns=1, so bwrap dies with "setting up uid map: Permission denied"
# for every non-root user and the lane fails each slice in seconds. Ubuntu's
# documented fix: an unconfined profile that only grants `userns`, attached
# to the bwrap binaries by path (files/precis-bwrap). Skipped when the
# sysctl is absent or 0 and on macOS; the verify runs bwrap as the builder
# user and fails the play, so a lane that cannot sandbox never comes up
# silently.

- name: Probe the AppArmor unprivileged-userns restriction (Linux)
  when: os_family == "linux"
  ansible.builtin.command: sysctl -n kernel.apparmor_restrict_unprivileged_userns
  register: _builder_userns_probe
  changed_when: false
  failed_when: false

- name: Install the bwrap AppArmor profile (userns restricted)
  when:
    - os_family == "linux"
    - (_builder_userns_probe.stdout | default('') | trim) == "1"
  ansible.builtin.copy:
    src: precis-bwrap
    dest: /etc/apparmor.d/precis-bwrap
    owner: root
    group: root
    mode: "0644"
  become: true
  register: _builder_bwrap_profile

- name: Load the bwrap AppArmor profile
  when:
    - os_family == "linux"
    - (_builder_userns_probe.stdout | default('') | trim) == "1"
    - _builder_bwrap_profile is changed
  ansible.builtin.command: apparmor_parser -r /etc/apparmor.d/precis-bwrap
  become: true
  changed_when: true

- name: Verify the builder user can run bwrap with a new net namespace
  when:
    - os_family == "linux"
    - (_builder_userns_probe.stdout | default('') | trim) == "1"
  ansible.builtin.command: /usr/bin/bwrap --unshare-net --dev-bind / / true
  args:
    chdir: /tmp
  become: true
  become_user: "{{ precis_builder_user }}"
  changed_when: false

# ── slice-MCP ssh tunnel ─────────────────────────────────────────────
# mcp-http's Caddy publishes 127.0.0.1:<port> only, so a remote builder
# cannot name the server in .mcp.json without also changing the bind —
# the tunnel keeps the checkout's .mcp.json byte-identical on every host
# and the bearer surface loopback-only. Skipped on the MCP host itself.

- name: Builder MCP tunnel (remote hosts only)
  when: inventory_hostname != precis_builder_mcp_host
  block:
    - name: The tunnel needs its destination
      ansible.builtin.fail:
        msg: >-
          precis_builder_mcp_host is unset — name the inventory host that
          serves mcp-http (the loopback Caddy on
          127.0.0.1:{{ precis_builder_mcp_port }}). On that host itself
          set it to the same name: the tunnel then skips.
      when: (precis_builder_mcp_host | default('')) | length == 0

    - name: Ensure the builder user's .ssh directory
      ansible.builtin.file:
        path: "{{ precis_builder_home }}/.ssh"
        state: directory
        owner: "{{ precis_builder_user }}"
        mode: "0700"
      become: true

    - name: Generate the builder tunnel key
      ansible.builtin.command:
        cmd: >-
          ssh-keygen -t ed25519
          -f {{ precis_builder_tunnel_key }} -N ""
          -C "precis-builder-tunnel@{{ inventory_hostname }}"
        creates: "{{ precis_builder_tunnel_key }}"
      become: true
      become_user: "{{ precis_builder_user }}"

    - name: Read the tunnel public key
      ansible.builtin.slurp:
        src: "{{ precis_builder_tunnel_key }}.pub"
      register: _builder_tunnel_pubkey
      become: true

    # The key is the builder user's own and is confined to the one
    # forward: no shell (command), no pty/agent/X11 (restrict), only the
    # MCP loopback port (permitopen) — it is a login on the MCP host's
    # deploy account, so it must not be a general one.
    - name: Authorize the key on the MCP host's deploy account (tunnel only)
      ansible.posix.authorized_key:
        user: deploy
        key: "{{ _builder_tunnel_pubkey.content | b64decode }}"
        key_options: 'restrict,port-forwarding,permitopen="127.0.0.1:{{ precis_builder_mcp_port }}",command="/bin/false"'
        comment: "precis-builder-tunnel from {{ inventory_hostname }}"
        state: present
      delegate_to: "{{ precis_builder_mcp_host }}"
      become: true

    - name: Accept the MCP host's host key (the builder user's known_hosts)
      ansible.builtin.shell: |
        ssh-keyscan -t ed25519 {{ hostvars[precis_builder_mcp_host]['lan_ip'] | default(hostvars[precis_builder_mcp_host]['ansible_host'], true) }} >> {{ precis_builder_home }}/.ssh/known_hosts 2>/dev/null
        sort -u {{ precis_builder_home }}/.ssh/known_hosts -o {{ precis_builder_home }}/.ssh/known_hosts
      become: true
      become_user: "{{ precis_builder_user }}"
      changed_when: false

    - name: render + load the MCP tunnel keepalive unit
      ansible.builtin.import_role:
        name: service_unit
      vars:
        service_unit_name: builder-mcp-tunnel
        service_unit_run_as: "{{ precis_builder_user }}"
        service_unit_working_dir: /tmp
        service_unit_schedule:
          mode: keepalive
        service_unit_throttle_seconds: 10
        service_unit_exec: >-
          /usr/bin/ssh -N -T
          -o ExitOnForwardFailure=yes
          -o ServerAliveInterval=30
          -o ServerAliveCountMax=3
          -o StrictHostKeyChecking=accept-new
          -i {{ precis_builder_tunnel_key }}
          -L 127.0.0.1:{{ precis_builder_mcp_port }}:127.0.0.1:{{ precis_builder_mcp_port }}
          deploy@{{ hostvars[precis_builder_mcp_host]['lan_ip'] | default(hostvars[precis_builder_mcp_host]['ansible_host'], true) }}

# ── the slice worker unit ────────────────────────────────────────────
# `--only job_ssh_node`, deliberately NO plan_tick: one ticker stays on
# the gateway. A second job_ssh_node claimant on the same host is safe —
# FOR UPDATE SKIP LOCKED arbitrates, and the executor pool counts by
# lease_host so `claim.executor_cap.ssh_node.<heartbeat host>` bounds
# this host's slice+compute total.
#
# A managed (non-deploy) builder user adds `--only heartbeat` and its own
# identity (gr695674): it cannot ride the deploy unit's <host>
# resource_slots rows — its probes see a different home, so two
# heartbeat passes under one name would flap every row each pass
# (retract-on-absent) and deploy-run lanes would place against lane
# binaries they cannot exec. PRECIS_HOST_NAME = precis_builder_slots_host
# (<host>-<user>) makes the heartbeat's resource_slots key, the claim's
# default_host/lease_host and the per-host cap key all land on the same
# name; PRECIS_NODE = the same name keeps the claim-gate's target_node
# match and _pin_to_submitting_node consistent, so a minted land_slice
# routes back to the host that holds the worktree. A `deploy` builder
# stays on the host's own heartbeat — same user, same home.

- name: render + load the builder worker unit
  ansible.builtin.import_role:
    name: service_unit
  vars:
    service_unit_name: worker-builder
    service_unit_run_as: "{{ precis_builder_user }}"
    # /tmp avoids the getcwd() EPERM trap on an NFS-mounted cwd (as 20b).
    service_unit_working_dir: /tmp
    service_unit_process_type: Interactive
    service_unit_schedule:
      mode: keepalive
    service_unit_timeout_stop_sec: 60
    # KillMode=process (systemd only, ignored on darwin): run_slice's
    # lane sessions are detached (start_new_session, re-adopted by
    # handle on the next claim) and must outlive a unit bounce — under
    # the control-group default a bounce SIGKILLed every in-flight
    # slice. Same shape as 43's compute lane.
    service_unit_kill_mode: process
    service_unit_exec: >-
      {{ precis_builder_venv }}/bin/precis worker
      --only job_ssh_node{{ ' --only heartbeat' if (precis_builder_manage_user | bool) else '' }}
      --batch-size {{ precis_builder_batch_size }}
      --idle-seconds {{ precis_builder_idle_seconds }}
    # Env parity with 20g's slices lane for every job_type this worker
    # can win — it shares the ssh_node queue with the compute lane.
    # PRECIS_SLICE_REPOS (a second repo's clone, run_slice.slice_root_for)
    # renders from precis_builder_slice_repos, a dict of name -> absolute path
    # with no default: this account's clone is not deploy's, so 20g's
    # precis_slice_repos must not leak across (defaults/main.yml).
    # DOCKER_HOST: darwin = the user's colima socket; Linux rootless
    # (managed non-deploy user) = /run/user/<uid>/docker.sock, with
    # XDG_RUNTIME_DIR beside it; Linux deploy = unset, the default
    # /var/run/docker.sock applies and run_slice's writable-roots fallback
    # grants it (gr676054). run_slice passes DOCKER_HOST on to the session
    # and --add-dir's the socket's parent for codex. PATH ends in
    # /usr/sbin:/sbin, where macOS keeps lsof for the slice index.lock
    # judge (gr684320). No '#' comments inside the >- expression — it is
    # Jinja, not YAML.
    service_unit_env: >-
      {{ precis_shared_env
         | combine(precis_identity_env | default({}))
         | combine({
             'HOME': precis_builder_home,
             'PATH': precis_builder_venv + '/bin:'
               + precis_builder_home + '/.local/bin:'
               + ('/opt/homebrew/bin:/Library/TeX/texbin:' if os_family == 'darwin' else '')
               + '/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin',
             'PGPASSFILE': precis_builder_home + '/.pgpass',
             'PRECIS_DEVIN_BIN': precis_builder_home + '/.local/bin/devin',
             'PRECIS_DATABASE_URL': precis_builder_dsn,
             'PRECIS_PROCESS': 'precis-worker-builder',
             'PRECIS_SOURCE': 'precis-worker-builder',
             'PRECIS_COVERAGE_DB_DIR': precis_builder_coverage_db_dir,
             'PRECIS_MAX_TICKS': (precis_max_ticks | default(25)) | string,
             'PRECIS_MAX_TODO_USD': (precis_max_todo_usd | default(5.0)) | string,
             'PRECIS_MAX_TREE_USD': (precis_max_tree_usd | default(10.0)) | string,
             'PRECIS_DAILY_COST_CEILING': (precis_daily_cost_ceiling | default(50.0)) | string,
             'PRECIS_CLAUDE_P_BILLED': ('1' if (precis_claude_p_billed | default(false)) else '0'),
             'PRECIS_SUSPENDED_JOB_TYPES': precis_suspended_job_types | default(''),
             'PRECIS_SLICE_ROOT': precis_fix_repo_dir,
             'PRECIS_AUTOCATPATH_KINETICS_SECONDS': precis_autocatpath_kinetics_seconds | string,
             'PRECIS_EMBEDDER': precis_worker_agent_embedder | default('remote'),
             'PRECIS_EMBEDDER_URL': precis_worker_agent_embedder_url
               | default('http://127.0.0.1:' ~ (embedder_port | default(8181))),
             'PRECIS_SLICE_SCOPE': precis_builder_slice_scope | string,
             'PRECIS_SLICE_TASKS_MAX': precis_builder_slice_tasks_max | string,
             'PRECIS_SLICE_MEMORY_MAX': precis_builder_slice_memory_max | string,
           })
         | combine(
             {'PRECIS_SLICE_NPROC': precis_builder_slice_nproc | string}
             if ((precis_builder_slice_nproc | default('') | string) | length > 0) else {}
           )
         | combine({'DOCKER_HOST': 'unix://' + precis_builder_home + '/.colima/docker.sock'}
             if os_family == 'darwin' else {})
         | combine({'DOCKER_HOST': _builder_docker_host,
                    'XDG_RUNTIME_DIR': '/run/user/' ~ _builder_uid}
             if (precis_builder_rootless_docker | bool) else {})
         | combine(
             {'PRECIS_DFT_NODE': ((precis_capabilities | default({})).dft | first)}
             if (((precis_capabilities | default({})).dft | default([])) | length > 0) else {}
           )
         | combine(
             {'PRECIS_CLAUDE_BIN': claude_run_wrapper | default('/opt/precis/bin/claude-run-user')}
             if ((claude_run_user | default('')) | length > 0) else {}
           )
         | combine(
             {'PRECIS_MCP_SLICE_TOKEN_DIR': precis_mcp_slice_token_dir}
             if ((precis_mcp_slice_token_dir | default('')) | length > 0) else {}
           )
         | combine(
             {'PRECIS_SLICE_REPOS': precis_builder_slice_repos | to_json}
             if ((precis_builder_slice_repos | default({})) | length > 0) else {}
           )
         | combine(
             {'PRECIS_HOST_NAME': precis_builder_slots_host,
              'PRECIS_NODE': precis_builder_slots_host}
             if (precis_builder_manage_user | bool) else {}
           ) }}

# Code-refresh bounce (mirrors 43). `precis_deploy_changed` is set only
# on the hosts redeploy's pre-flight targets, never on builder_hosts, so
# this fires on every redeploy (20i is imported there) as well as on the
# site.yml path — it is the unit's one restart per deploy, which is why
# the orphan sweep lists `precis-worker-builder` as OWNED and leaves it
# alone. A builder host that is also an inference host has the fact
# defined and gets the step-2 glob bounce instead.
- name: Bounce the builder lane on a code refresh (Linux)
  when:
    - os_family == "linux"
    - precis_deploy_changed is not defined
  ansible.builtin.systemd:
    name: precis-worker-builder
    state: restarted
    daemon_reload: true
  become: true
  changed_when: true
  failed_when: false

- name: Bounce the builder lane on a code refresh (macOS)
  when:
    - os_family == "darwin"
    - precis_deploy_changed is not defined
  ansible.builtin.command: launchctl kickstart -k system/com.precis.worker-builder
  become: true
  changed_when: true
  failed_when: false
