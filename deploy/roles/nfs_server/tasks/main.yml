---
# NFS server setup on the data node

- name: Ensure NFS export directory exists
  ansible.builtin.file:
    path: "{{ nfs_export_path }}/shared"
    state: directory
    mode: "0755"
  become: true

- name: Configure /etc/exports (macOS)
  ansible.builtin.lineinfile:
    path: /etc/exports
    line: '{{ nfs_export_path }}/shared -network {{ lan_subnet.split("/")[0] }} -mask 255.255.255.0 -alldirs -maproot=root'
    regexp: "{{ nfs_export_path }}/shared"
    create: true
    mode: "0644"
  become: true
  notify: reload nfs exports

- name: Ensure nfsd is running (macOS)
  ansible.builtin.command: nfsd start
  become: true
  changed_when: false
  failed_when: false

- name: Check nfsd status
  ansible.builtin.command: nfsd status
  become: true
  changed_when: false
  register: nfsd_status
  failed_when: "'not running' in nfsd_status.stdout"

- name: Create shared directory layout
  ansible.builtin.file:
    path: "{{ nfs_export_path }}/shared/{{ item }}"
    state: directory
    mode: "0755"
  become: true
  loop: "{{ shared_dirs }}"

- name: Set pgboss home ownership
  ansible.builtin.file:
    path: "{{ nfs_export_path }}/shared/home/pgboss"
    owner: 802
    group: staff
  become: true

- name: Create NFS canary file
  ansible.builtin.file:
    path: "{{ nfs_export_path }}/shared/.nfs-canary"
    state: touch
    mode: "0644"
  become: true
  changed_when: false

# macOS has no kernel bind-mount (no `mount -o bind`); loop the export back
# to itself over NFS via the server's own lan_ip so shared_mount resolves to
# the same content on the server as on every client (cluster-mount-namespace
# spec, gr194012 — "bind mount verified" acceptance criterion). The export's
# -network clause already admits the server's own lan_ip since it's inside
# lan_subnet, so no separate exports entry is needed.
- name: Provision /mnt namespace root (macOS sealed root)
  ansible.builtin.include_tasks: "{{ role_path }}/../../tasks/darwin_synthetic_mnt.yml"
  when: os_family == "darwin" and shared_mount is match('^/mnt(/|$)')

- name: Ensure shared_mount exists for server-side parity
  ansible.builtin.file:
    path: "{{ shared_mount }}"
    state: directory
    mode: "0755"
  become: true

- name: Loop back own NFS export onto shared_mount
  ansible.posix.mount:
    path: "{{ shared_mount }}"
    src: "{{ lan_ip }}:{{ nfs_export_path }}/shared"
    fstype: nfs
    opts: hard,intr,nosuid,nodev,noatime
    state: mounted
  become: true

- name: Verify server-side NFS canary
  ansible.builtin.stat:
    path: "{{ shared_mount }}/.nfs-canary"
  register: nfs_server_canary

- name: Fail if server-side loopback mount not working
  ansible.builtin.fail:
    msg: "NFS canary file not found at {{ shared_mount }}/.nfs-canary — loopback mount may have failed"
  when: not nfs_server_canary.stat.exists

- name: Symlink legacy shared_mount path (nfs_server host)
  ansible.builtin.include_tasks: "{{ role_path }}/../../tasks/legacy_mount_symlink.yml"
  vars:
    legacy_path: /opt/shared
    canonical_path: "{{ shared_mount }}"
  # legacy != canonical: with a stale overlay (shared_mount still the legacy
  # path) the transition task would unmount the live share and self-symlink.
  when: legacy_path != canonical_path
