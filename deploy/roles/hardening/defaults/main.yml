---
# hardening role defaults.
#
# ── Linux OOM lockout guard (the shared compute node) ──────────────────────
# On a single shared compute node, heavy MACE/NEB + llama + PDF-ingest load has
# repeatedly thrashed the box into swap, starving sshd so it stops answering
# banner-exchange while the host still pings — with no remote recovery path.
# Two layers defend it:
#   1. sshd is made un-killable by the kernel OOM killer (OOMScoreAdjust=-1000,
#      always applied on Linux) so we can always get in to recover.
#   2. earlyoom kills the memory hog early — before swap-thrash locks us out.
# See docs/runbooks/oom-lockout-hardening.md.

# earlyoom thresholds + targeting. `-m 10,5` SIGTERMs the biggest --prefer
# match when free memory drops below 10% (SIGKILL below 5%); `-s 10,5` does the
# same on free swap. `--avoid` matches are never touched — sshd and the
# network/tunnel daemons stay up so the box is always reachable. `--prefer`
# biases the kill toward the compute hogs (the precis worker restarts via
# systemd Restart=always, so culling it is the recoverable sacrifice).
# Regexes match the (15-char-truncated) process comm, anchored.
#
# NB: NOT shell-quoted. earlyoom.service runs `ExecStart=/usr/bin/earlyoom
# $EARLYOOM_ARGS` with no shell, so systemd only word-splits on whitespace and
# passes any quotes verbatim — wrapping a regex in quotes would make earlyoom
# match a literal leading quote char. The regexes contain no whitespace, so
# they stand alone as single arguments unquoted.
earlyoom_args: >-
  -r 3600 -m 10,5 -s 10,5
  --avoid ^(sshd|systemd|systemd-.*|dbus-daemon|tailscaled|autossh|cron)$
  --prefer ^(python[0-9.]*|precis|llama-server|llama-swap|ollama|marker.*)$

# Optional HARD memory ceiling on the compute worker (precis-worker.service).
# Empty = off (the drop-in is not written). An over-tight cap OOM-kills
# legitimate NEB runs, so this stays off until a value is measured on the box —
# e.g. "96G". The sshd backstop + earlyoom already carry the lockout guarantee;
# this is a belt-and-suspenders cap, not required.
linux_compute_memory_max: ""

# ── Per-unit memory guards (Linux only; all default off) ──────────────────
# Rendered as /etc/systemd/system/<unit>.d/50-memory-guard.conf; only set
# values produce a directive, so empty = unchanged. Applied with
# daemon-reload, never a restart: cgroup limits on a running unit take effect
# on reload. (A legacy memory.conf from linux_compute_memory_max sorts after
# 50-memory-guard.conf and wins for precis-worker.)
# Applied by playbooks/10-hardening.yml (tag: hardening).
#
# Workers: top-level values apply to every unit in precis_worker_memory_units;
# precis_worker_memory_overrides replaces values per unit, e.g.
#   precis_worker_memory_overrides:
#     precis-worker-sandbox: {memory_high: 8G, memory_max: 12G}
precis_worker_memory_high: ""
precis_worker_memory_max: ""
precis_worker_memory_swap_max: ""
precis_worker_memory_units:
  - precis-worker
  - precis-worker-compute
  - precis-worker-sandbox
precis_worker_memory_overrides: {}

# ── Lane caps + per-host memory budget (host-lanes, Reto 2026-10-15) ──────
# The LLM host wedged twice on 2026-10-15: vLLM at 0.70 (~85 GiB) plus a 56G compute
# lane, a 24G sandbox lane and a 24G heartbeat worker summed far past its
# 121 GiB. Each lane's cap now comes from the inventory GROUP that places the
# lane, and templates/memory-budget.json.j2 sums what a host carries:
#   unit MemoryMax of every placed lane + its container reserve
#   + host_memory_guard_units + the LLM's share + OS reserve + extra reserve
# which must stay <= host_memory_total. tasks/memory_budget.yml fails the play
# on a host over budget; tests/test_deploy_memory_budget.py checks every
# lane-group combination from these defaults.
#
# A lane is placed when the host is in any of `groups` and none of
# `not_groups`. Precedence per unit: precis_worker_memory_overrides[unit] >
# the placed lane's caps > the top-level precis_worker_memory_* values.
# `container_reserve` counts docker containers the lane starts outside its
# own cgroup.
precis_lane_memory:
  # Heartbeat-only precis-worker (20c). Measured RSS ~110 MiB.
  # An inference host runs 20b's collapsed worker under the same unit name.
  - lane: heartbeat
    unit: precis-worker
    groups: [serving, compute]
    not_groups: [inference]
    memory_high: 3G
    memory_max: 4G
  # 20b's collapsed worker on a Linux inference host: no lane cap, so the
  # top-level precis_worker_memory_* values apply, and an unset MemoryMax
  # fails the budget as uncapped.
  - lane: collapsed
    unit: precis-worker
    groups: [inference]
  # job_ssh_node lane (43): autocatpath seeds run inside this cgroup (LLM host
  # peak 20.6 GiB with 5 seeds at ~3.5 GiB, 2026-10-15). The GPU container
  # (fold, gpaw dft) runs under docker, one at a time per host (resource slot
  # gpu=1): its reserve must cover alphafold_mem_limit.
  - lane: compute
    unit: precis-worker-compute
    groups: [compute, inference]
    memory_high: 40G
    memory_max: 48G
    container_reserve: 40G
  # job_claude_docker lane (35): the worker is small (~120 MiB); each job is
  # one docker container capped by PRECIS_SANDBOX_MEMORY (default 8g, batch 1).
  # agent_sandbox_lane (gr485861): play 35's selection play also places the
  # lane on any Linux host where the unit is already installed — count it
  # there too, or an adopted host's budget never sees the lane.
  - lane: sandbox
    unit: precis-worker-sandbox
    groups: [agent_sandbox_hosts, agent_sandbox_lane]
    memory_high: 1536M
    memory_max: 2G
    container_reserve: 8G

# GB10 unified memory as the OS reports it (free -g: 121).
host_memory_total: 121G
host_memory_os_reserve: 10G
# Per host: memory held by non-precis services (monitoring, n8n, ...).
host_memory_extra_reserve: 0G
# LLM serving groups and the fraction of host_memory_total each reserves.
# An inventory value wins; else the serving role's own default, which
# tasks/memory_budget.yml loads under a private name; else 1.0 (whole box,
# fails the budget rather than guessing low).
host_llm_lanes:
  - group: vllm_serving
    fraction: >-
      {{ vllm_gpu_memory_utilization
         | default((_hardening_vllm_defaults | default({})).vllm_gpu_memory_utilization | default(1.0)) }}
  - group: sglang_serving
    fraction: >-
      {{ sglang_mem_fraction_static
         | default((_hardening_sglang_defaults | default({})).sglang_mem_fraction_static | default(1.0)) }}
# Group pairs no host may join together: an LLM host runs no science lanes.
host_lane_exclusive_groups:
  - [vllm_serving, compute]
  - [sglang_serving, compute]
  - [vllm_serving, inference]
  - [sglang_serving, inference]
# Fail the play when a host is over budget. Off only for a measured,
# reviewed exception.
host_memory_budget_enforce: true

# Existing units NOT managed by ansible (hand-made): we only add the drop-in,
# never template the unit. systemd reads the limits on daemon-reload; we do
# not restart, so a unit not yet running them picks them up on its next start.
#   host_memory_guard_units:
#     - {name: example-server.service, memory_high: 96G, memory_max: 104G}
host_memory_guard_units: []

# ── memsnap: journal memory snapshot timer (Linux, opt-in) ────────────────
# Logs top-15 RSS processes + MemoryCurrent of precis-* and guard units under
# identifier `memsnap` (`journalctl -t memsnap`; needs a persistent journal).
memsnap_enabled: false
memsnap_interval_min: 10
