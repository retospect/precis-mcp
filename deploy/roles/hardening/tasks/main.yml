---
# SSH hardening + sudoers + power management + CLT + deploy key cleanup

# ── macOS Command Line Tools (prerequisite for Homebrew, git, etc.) ──
- name: Check if CLT is installed (macOS)
  when: os_family == "darwin"
  ansible.builtin.stat:
    path: /Library/Developer/CommandLineTools/usr/bin/git
  register: clt_check
  tags: [hardening, security]

- name: Install Command Line Tools (macOS)
  when:
    - os_family == "darwin"
    - not (clt_check.stat.exists | default(false))
  block:
    - name: Create CLT install-on-demand trigger
      ansible.builtin.file:
        path: /tmp/.com.apple.dt.CommandLineTools.installondemand.in-progress
        state: touch
        mode: "0644"
      become: true

    - name: Find CLT package in software update catalog
      ansible.builtin.shell: >
        softwareupdate --list 2>&1
        | grep -o '.*Command Line Tools.*'
        | head -1
        | sed 's/^[* ]*//'
      register: clt_package
      changed_when: false
      become: true

    - name: Install CLT via softwareupdate
      ansible.builtin.command: >
        softwareupdate --install "{{ clt_package.stdout | trim }}" --agree-to-license
      become: true
      when: clt_package.stdout | trim | length > 0

    - name: Clean up CLT trigger file
      ansible.builtin.file:
        path: /tmp/.com.apple.dt.CommandLineTools.installondemand.in-progress
        state: absent
      become: true
  tags: [hardening, security]

# ── macOS power management (headless server mode) ──
- name: Auto-restart after power failure (macOS)
  when: os_family == "darwin"
  ansible.builtin.command: pmset -a autorestart 1
  become: true
  changed_when: false
  tags: [hardening, security]

- name: Enable Wake on LAN (macOS)
  when: os_family == "darwin"
  ansible.builtin.command: pmset -a womp 1
  become: true
  changed_when: false
  tags: [hardening, security]

- name: Prevent sleep (macOS)
  when: os_family == "darwin"
  ansible.builtin.command: pmset -a sleep 0 disksleep 0 displaysleep 5
  become: true
  changed_when: false
  tags: [hardening, security]

- name: Disable auto-login (macOS)
  when: os_family == "darwin"
  ansible.builtin.command: defaults delete /Library/Preferences/com.apple.loginwindow autoLoginUser
  become: true
  changed_when: false
  failed_when: false
  tags: [hardening, security]

- name: Mute startup chime (macOS)
  when: os_family == "darwin"
  ansible.builtin.command: nvram StartupMute=%01
  become: true
  changed_when: false
  tags: [hardening, security]

# ── Ethernet: disable Energy-Efficient Ethernet (EEE) ──
# EEE throttles the NIC during idle and doesn't always restore cleanly,
# causing link flapping. Force manual 1000baseT full-duplex instead.
- name: Disable EEE — set Ethernet to manual 1000baseT full-duplex (macOS)
  when: os_family == "darwin"
  ansible.builtin.command: networksetup -setMedia 'Ethernet' 1000baseT full-duplex
  become: true
  changed_when: false
  failed_when: false
  tags: [hardening, security]

- name: Disable Wi-Fi (macOS — headless servers use Ethernet only)
  when: os_family == "darwin"
  ansible.builtin.command: networksetup -setairportpower en1 off
  become: true
  changed_when: false
  failed_when: false
  tags: [hardening, security]

# ── Daily 3 AM update + reboot ──
- name: Ensure /usr/local/bin exists (macOS)
  when: os_family == "darwin"
  ansible.builtin.file:
    path: /usr/local/bin
    state: directory
    mode: "0755"
  become: true
  tags: [hardening, security]

- name: Deploy daily update-and-reboot script (macOS)
  when: os_family == "darwin"
  ansible.builtin.copy:
    dest: /usr/local/bin/daily-update-reboot.sh
    mode: "0755"
    content: |
      #!/bin/bash
      # Managed by Ansible — do not edit
      logger -t daily-update "Starting macOS software update"
      /usr/sbin/softwareupdate --install --all --agree-to-license 2>&1 | logger -t daily-update

      # Tailscale is installed via Homebrew with `state: present` (never
      # `latest` — see deploy/roles/tailscale/tasks/main.yml), so nothing else
      # upgrades it and the fleet drifts (gr273966). Upgrade it here, as the
      # brew-owning deploy user; `|| true` so a brew hiccup never blocks the
      # reboot. The reboot below restarts tailscaled, picking up the new
      # binary — no separate kickstart needed.
      logger -t daily-update "Upgrading Tailscale via Homebrew"
      sudo -u deploy /opt/homebrew/bin/brew upgrade tailscale 2>&1 | logger -t daily-update || true

      # Gracefully drain Postgres before the reboot. Otherwise `shutdown`
      # SIGTERMs the postmaster into a "smart" shutdown that blocks on
      # pgbouncer's held connections; it gets SIGKILLed mid-shutdown and leaves
      # a stale postmaster.pid. If that PID is reused after the reboot (it was —
      # by the embedder), Postgres refuses to start and the whole factory goes
      # dark. No-op on hosts without the DB.
      if launchctl print system/com.postgresql >/dev/null 2>&1; then
        logger -t daily-update "Draining Postgres (fast shutdown)"
        # Unload the daemon first so KeepAlive can't relaunch it mid-drain.
        launchctl bootout system/com.postgresql 2>/dev/null
        # bootout sends SIGTERM (smart); escalate to a fast shutdown so lingering
        # clients are disconnected and the postmaster exits promptly, cleanly
        # removing its own pid file.
        sudo -u deploy /opt/homebrew/opt/postgresql@17/bin/pg_ctl \
          -D /opt/homebrew/var/postgresql@17 stop -m fast -w -t 60 2>&1 \
          | logger -t daily-update
        for i in $(seq 1 30); do
          pgrep -f "postgresql@17/bin/postgres" >/dev/null || break
          sleep 1
        done
        logger -t daily-update "Postgres drained"
      fi

      logger -t daily-update "Rebooting"
      /sbin/shutdown -r now
  become: true
  tags: [hardening, security, reboot_script]

# On a host with hardening_macos_nightly_reboot off, tailscale is upgraded in
# the planned maintenance window instead (the default: reboot off fleet-wide).
- name: Schedule daily 3 AM update + reboot (macOS)
  when: os_family == "darwin"
  ansible.builtin.cron:
    name: "daily 3am update and reboot"
    state: "{{ 'present' if hardening_macos_nightly_reboot | bool else 'absent' }}"
    minute: "0"
    hour: "3"
    job: "/usr/local/bin/daily-update-reboot.sh"
    user: root
  become: true
  tags: [hardening, security]

# ── Weekly OS update with a guarded reboot (Linux; gr491172) ──
# Replaces the old daily `apt-get upgrade && shutdown -r now` root cron, which
# rebooted mid-compute. The guard script reboots only when the marker exists,
# host-busy reads 0 and no service_config reserve is set; else it defers to
# scripts/host-ops/os-update. A systemd timer, not cron: OnCalendar pins UTC
# whatever the host timezone. Schedule: hardening_os_update_oncalendar.
- name: Remove the old daily update + reboot cron (Linux)
  tags: [hardening, security, os-update-weekly]
  when: os_family == "linux"
  ansible.builtin.cron:
    name: "daily 3am update and reboot"
    user: root
    state: absent
  become: true

- name: Install host-busy + os-update-weekly guard (Linux)
  tags: [hardening, security, os-update-weekly]
  when: os_family == "linux"
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "/usr/local/sbin/{{ item }}"
    mode: "0755"
  loop: [host-busy, os-update-weekly]
  become: true

- name: Render os-update-weekly service + timer (Linux)
  tags: [hardening, security, os-update-weekly]
  when: os_family == "linux"
  ansible.builtin.template:
    src: "os-update-weekly.{{ item }}.j2"
    dest: "/etc/systemd/system/os-update-weekly.{{ item }}"
    mode: "0644"
  loop: [service, timer]
  become: true

- name: Enable or disable the os-update-weekly timer (Linux)
  tags: [hardening, security, os-update-weekly]
  when: os_family == "linux"
  ansible.builtin.systemd:
    name: os-update-weekly.timer
    enabled: "{{ hardening_os_update_weekly | bool }}"
    state: "{{ 'started' if hardening_os_update_weekly | bool else 'stopped' }}"
    daemon_reload: true
  become: true

# Retire the old nightly-reboot.timer (the removed nightly_reboot role, gripe
# 50907): inference hosts take the weekly guarded path above instead (gr491172).
- name: Look for the retired nightly-reboot timer (Linux)
  tags: [hardening, security, os-update-weekly]
  when: os_family == "linux"
  ansible.builtin.stat:
    path: /etc/systemd/system/nightly-reboot.timer
  register: nightly_reboot_timer

- name: Stop and disable the retired nightly-reboot timer (Linux)
  tags: [hardening, security, os-update-weekly]
  when:
    - os_family == "linux"
    - nightly_reboot_timer.stat.exists | default(false)
  ansible.builtin.systemd:
    name: nightly-reboot.timer
    state: stopped
    enabled: false
  become: true
  failed_when: false

- name: Remove the retired nightly-reboot units (Linux)
  tags: [hardening, security, os-update-weekly]
  when: os_family == "linux"
  ansible.builtin.file:
    path: "/etc/systemd/system/nightly-reboot.{{ item }}"
    state: absent
  loop: [timer, service]
  become: true
  register: nightly_reboot_removed

- name: Reload systemd after retiring nightly-reboot (Linux)
  tags: [hardening, security, os-update-weekly]
  when:
    - os_family == "linux"
    - nightly_reboot_removed is changed
  ansible.builtin.systemd:
    daemon_reload: true
  become: true

- name: Configure sshd (macOS)
  tags: [hardening, security, sshd]
  when: os_family == "darwin"
  ansible.builtin.template:
    src: sshd_config.j2
    dest: /etc/ssh/sshd_config
    mode: "0600"
    validate: "/usr/sbin/sshd -t -f %s"
  become: true
  notify: restart sshd macos

- name: Configure sshd (Linux)
  tags: [hardening, security, sshd]
  when: os_family == "linux"
  ansible.builtin.template:
    src: sshd_config.j2
    dest: /etc/ssh/sshd_config
    mode: "0600"
    validate: "/usr/sbin/sshd -t -f %s"
  become: true
  notify: restart sshd linux

# ── Linux OOM lockout guard (the shared compute node) ──────────────────────
# Heavy MACE/NEB + llama + PDF-ingest load has repeatedly thrashed the box into
# swap, starving sshd until it stops answering banner-exchange while the host
# still pings — with no remote recovery path. Layer 1 (always on): make sshd
# un-killable by the kernel OOM killer. Layer 2: earlyoom kills the memory hog
# early, before thrash locks us out. See docs/runbooks/oom-lockout-hardening.md.
- name: Ensure ssh.service drop-in dir (Linux)
  tags: [hardening, security, oom-guard]
  when: os_family == "linux"
  ansible.builtin.file:
    path: /etc/systemd/system/ssh.service.d
    state: directory
    mode: "0755"
  become: true

- name: OOM-protect sshd — OOMScoreAdjust drop-in (Linux)
  tags: [hardening, security, oom-guard]
  when: os_family == "linux"
  ansible.builtin.template:
    src: ssh-oom.conf.j2
    dest: /etc/systemd/system/ssh.service.d/oom.conf
    mode: "0644"
  become: true
  notify: reload systemd and restart sshd linux

- name: Install earlyoom (Linux)
  tags: [hardening, security, oom-guard]
  when: os_family == "linux"
  ansible.builtin.apt:
    name: earlyoom
    state: present
    update_cache: true
    cache_valid_time: 43200
    lock_timeout: 120
  become: true
  register: _apt_earlyoom
  until: _apt_earlyoom is succeeded
  retries: 3
  delay: 10

- name: Configure earlyoom (Linux)
  tags: [hardening, security, oom-guard]
  when: os_family == "linux"
  ansible.builtin.template:
    src: earlyoom.default.j2
    dest: /etc/default/earlyoom
    mode: "0644"
  become: true
  notify: restart earlyoom

- name: Enable + start earlyoom (Linux)
  tags: [hardening, security, oom-guard]
  when: os_family == "linux"
  ansible.builtin.systemd:
    name: earlyoom
    enabled: true
    state: started
  become: true

# Optional hard memory ceiling on the compute worker (off unless
# linux_compute_memory_max is set — an over-tight cap OOM-kills real NEB runs).
- name: Ensure precis-worker.service drop-in dir (Linux, opt-in cap)
  when:
    - os_family == "linux"
    - linux_compute_memory_max | default("") | length > 0
  ansible.builtin.file:
    path: /etc/systemd/system/precis-worker.service.d
    state: directory
    mode: "0755"
  become: true
  tags: [hardening, security]

- name: Cap compute worker memory — MemoryMax drop-in (Linux, opt-in)
  when:
    - os_family == "linux"
    - linux_compute_memory_max | default("") | length > 0
  ansible.builtin.template:
    src: precis-worker-memory.conf.j2
    dest: /etc/systemd/system/precis-worker.service.d/memory.conf
    mode: "0644"
  become: true
  notify: reload systemd and restart precis-worker linux
  tags: [hardening, security]

# ── Per-unit memory guards + memsnap (Linux, opt-in; see defaults) ─────────
# Tag oom-guard selects just the OOM pieces (sshd OOMScoreAdjust, earlyoom,
# memory guards, memsnap) for a host that must not get the full role.
# cgroup MemoryHigh/Max: an mmapped model's page cache is charged to its unit,
# so the unit thrashes itself instead of starving sshd. daemon-reload only.
# The per-unit values come from the host's memory plan (memory_budget.yml):
# override > placed lane cap > top-level precis_worker_memory_*. The same
# plan's budget assert runs first, so an over-budget host writes nothing.
- name: Plan + budget-check this host's lane memory (Linux)
  tags: [hardening, security, oom-guard]
  ansible.builtin.include_tasks:
    file: memory_budget.yml
    apply:
      tags: [hardening, security, oom-guard]

- name: Ensure precis worker memory-guard drop-in dirs (Linux)
  tags: [hardening, security, oom-guard]
  when:
    - os_family == "linux"
    - unit_cfg.memory_high | string | length > 0 or unit_cfg.memory_max | string | length > 0 or unit_cfg.memory_swap_max | string | length > 0
  ansible.builtin.file:
    path: "/etc/systemd/system/{{ unit_cfg.name }}.d"
    state: directory
    mode: "0755"
  become: true
  loop: "{{ host_memory_plan.units | default([]) }}"
  loop_control:
    loop_var: unit_cfg
    label: "{{ unit_cfg.name }}"

- name: Memory-guard drop-in for precis worker units (Linux)
  tags: [hardening, security, oom-guard]
  when:
    - os_family == "linux"
    - unit_cfg.memory_high | string | length > 0 or unit_cfg.memory_max | string | length > 0 or unit_cfg.memory_swap_max | string | length > 0
  ansible.builtin.template:
    src: memory-guard.conf.j2
    dest: "/etc/systemd/system/{{ unit_cfg.name }}.d/50-memory-guard.conf"
    mode: "0644"
  become: true
  loop: "{{ host_memory_plan.units | default([]) }}"
  loop_control:
    loop_var: unit_cfg
    label: "{{ unit_cfg.name }}"
  notify: reload systemd (hardening)

- name: Ensure memory-guard drop-in dirs for hand-managed units (Linux)
  tags: [hardening, security, oom-guard]
  when: os_family == "linux"
  ansible.builtin.file:
    path: "/etc/systemd/system/{{ unit_cfg.name }}.d"
    state: directory
    mode: "0755"
  become: true
  loop: "{{ host_memory_guard_units }}"
  loop_control:
    loop_var: unit_cfg

- name: Memory-guard drop-in for hand-managed units, no restart (Linux)
  tags: [hardening, security, oom-guard]
  when: os_family == "linux"
  ansible.builtin.template:
    src: memory-guard.conf.j2
    dest: "/etc/systemd/system/{{ unit_cfg.name }}.d/50-memory-guard.conf"
    mode: "0644"
  become: true
  loop: "{{ host_memory_guard_units }}"
  loop_control:
    loop_var: unit_cfg
  notify: reload systemd (hardening)

- name: memsnap journal snapshot script + timer (Linux, opt-in)
  tags: [hardening, security, oom-guard]
  when:
    - os_family == "linux"
    - memsnap_enabled | bool
  become: true
  block:
    - name: Install memsnap script
      ansible.builtin.template:
        src: memsnap.sh.j2
        dest: /usr/local/sbin/memsnap.sh
        mode: "0755"
      vars:
        memsnap_guard_unit_names: "{{ host_memory_guard_units | map(attribute='name') | list }}"

    - name: Install memsnap service
      ansible.builtin.template:
        src: memsnap.service.j2
        dest: /etc/systemd/system/memsnap.service
        mode: "0644"

    - name: Install memsnap timer
      ansible.builtin.template:
        src: memsnap.timer.j2
        dest: /etc/systemd/system/memsnap.timer
        mode: "0644"

    - name: Enable + start memsnap timer
      ansible.builtin.systemd:
        name: memsnap.timer
        enabled: true
        state: started
        daemon_reload: true

# ── DGX Dashboard privileged helper (Linux; gr489996) ──
# dgx-dashboard-admin.service is the root D-Bus helper behind the dashboard's
# update and reboot buttons. Its `apt update` runs hang in CLOSE-WAIT and hold
# the apt lists lock for days. The package ships the unit as a real file in
# /etc/systemd/system, so masking fails ("File ... already exists") — a
# ConditionPathExists drop-in does the job instead: a false condition skips
# D-Bus activation and Restart=always, and it survives package upgrades.
# Stopping the unit also ends any hung apt child in its cgroup; the dashboard
# UI and telemetry (dgx-dashboard.service) keep running, and OS updates
# belong to os-update.
- name: Read systemd units (DGX dashboard check)
  tags: [hardening, security, dgx-dashboard]
  when: os_family == "linux"
  ansible.builtin.service_facts:

- name: Ensure dgx-dashboard-admin.service drop-in dir (Linux)
  tags: [hardening, security, dgx-dashboard]
  when:
    - os_family == "linux"
    - "'dgx-dashboard-admin.service' in ansible_facts.services"
  ansible.builtin.file:
    path: /etc/systemd/system/dgx-dashboard-admin.service.d
    state: directory
    mode: "0755"
  become: true

- name: Gate dgx-dashboard-admin on an enable flag (Linux)
  tags: [hardening, security, dgx-dashboard]
  when:
    - os_family == "linux"
    - "'dgx-dashboard-admin.service' in ansible_facts.services"
  ansible.builtin.copy:
    dest: /etc/systemd/system/dgx-dashboard-admin.service.d/50-precis-disabled.conf
    mode: "0644"
    content: |
      [Unit]
      ConditionPathExists=/etc/precis/dgx-dashboard-admin.enable
  become: true

- name: Stop and disable dgx-dashboard-admin (Linux)
  tags: [hardening, security, dgx-dashboard]
  when:
    - os_family == "linux"
    - "'dgx-dashboard-admin.service' in ansible_facts.services"
  ansible.builtin.systemd:
    name: dgx-dashboard-admin.service
    state: stopped
    enabled: false
    daemon_reload: true
  become: true

# ── Stale Caddy apt source (Linux; gr506049) ──
# The GB10 sparks once had Caddy installed from the Cloudsmith apt repo; the
# deb is gone but /etc/apt/sources.list.d/caddy-stable.list and its keyring
# remain, so every apt run warns about the dead source. Remove both only
# where the `caddy` package is NOT installed — a host actually serving Caddy
# from that deb keeps its source for updates. `file state: absent` on both
# paths is idempotent; the cache refresh runs once, on change only.
- name: Gather installed-package facts (Linux, stale apt sources)
  tags: [hardening, security, apt-sources]
  when: os_family == "linux"
  ansible.builtin.package_facts:
    manager: auto

- name: Remove the stale Caddy apt source + keyring (Linux)
  tags: [hardening, security, apt-sources]
  when:
    - os_family == "linux"
    - "'caddy' not in ansible_facts.packages"
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/apt/sources.list.d/caddy-stable.list
    - /usr/share/keyrings/caddy-stable-archive-keyring.gpg
  become: true
  register: caddy_apt_source_removed

- name: Refresh the apt cache after removing the stale Caddy source (Linux)
  tags: [hardening, security, apt-sources]
  when:
    - os_family == "linux"
    - "'caddy' not in ansible_facts.packages"
    - caddy_apt_source_removed is changed
    - not ansible_check_mode
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 43200
    lock_timeout: 120
  become: true
  register: _apt_caddy_refresh
  until: _apt_caddy_refresh is succeeded
  retries: 3
  delay: 10

# ── Grafana apt source on the legacy trusted.gpg keyring (Linux; gr508877) ──
# A node running a hand-managed apt grafana (`deb https://packages.grafana.com/
# oss/deb stable main`) can keep its key in /etc/apt/trusted.gpg, so every apt
# run warns "Key is stored in legacy trusted.gpg keyring". Export the Grafana Labs
# key (B53AE77BADB630A683046005963FA27710458545, matching the published
# https://apt.grafana.com/gpg.key) into a dedicated keyring, pin the source
# with signed-by=, then drop the legacy copy. Gated on the source file being
# present AND missing signed-by, so a converged or differently-managed host is
# untouched. The legacy key is deleted only after the new keyring verifies.
- name: Stat the grafana apt source (Linux)
  tags: [hardening, security, apt-sources]
  when: os_family == "linux"
  ansible.builtin.stat:
    path: /etc/apt/sources.list.d/grafana.list
  register: grafana_apt_source

- name: Check whether the grafana source already pins signed-by (Linux)
  tags: [hardening, security, apt-sources]
  when:
    - os_family == "linux"
    - grafana_apt_source.stat.exists
  ansible.builtin.command: grep -l signed-by /etc/apt/sources.list.d/grafana.list
  changed_when: false
  failed_when: false
  register: grafana_source_signed

- name: Check whether the grafana key sits in legacy trusted.gpg (Linux)
  tags: [hardening, security, apt-sources]
  when:
    - os_family == "linux"
    - grafana_apt_source.stat.exists
    - grafana_source_signed.rc | default(1) != 0
  ansible.builtin.command: >
    gpg --no-default-keyring --keyring /etc/apt/trusted.gpg
    --list-keys B53AE77BADB630A683046005963FA27710458545
  changed_when: false
  failed_when: false
  register: grafana_key_in_trusted

- name: Check whether a dedicated grafana keyring already holds the key (Linux)
  tags: [hardening, security, apt-sources]
  when:
    - os_family == "linux"
    - grafana_apt_source.stat.exists
    - grafana_source_signed.rc | default(1) != 0
  ansible.builtin.command: >
    gpg --no-default-keyring --keyring /etc/apt/keyrings/grafana.gpg
    --list-keys B53AE77BADB630A683046005963FA27710458545
  changed_when: false
  failed_when: false
  register: grafana_key_in_keyring

- name: Ensure /etc/apt/keyrings exists (Linux)
  tags: [hardening, security, apt-sources]
  when:
    - os_family == "linux"
    - grafana_apt_source.stat.exists
    - grafana_source_signed.rc | default(1) != 0
    - grafana_key_in_keyring.rc | default(1) != 0
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"
  become: true

- name: Export the grafana key into a dedicated keyring (Linux)
  tags: [hardening, security, apt-sources]
  when:
    - os_family == "linux"
    - grafana_apt_source.stat.exists
    - grafana_source_signed.rc | default(1) != 0
    - grafana_key_in_trusted.rc | default(1) == 0
    - grafana_key_in_keyring.rc | default(1) != 0
  ansible.builtin.command: >
    gpg --batch --yes --output /etc/apt/keyrings/grafana.gpg
    --no-default-keyring --keyring /etc/apt/trusted.gpg
    --export B53AE77BADB630A683046005963FA27710458545
  become: true
  register: grafana_keyring_exported

- name: Fetch grafana's published key when trusted.gpg had none (Linux)
  tags: [hardening, security, apt-sources]
  when:
    - os_family == "linux"
    - grafana_apt_source.stat.exists
    - grafana_source_signed.rc | default(1) != 0
    - grafana_key_in_trusted.rc | default(1) != 0
    - grafana_key_in_keyring.rc | default(1) != 0
  ansible.builtin.get_url:
    url: https://apt.grafana.com/gpg.key
    dest: /tmp/grafana-apt.key
    mode: "0644"
    timeout: 30
  become: true

- name: Dearmor the fetched grafana key into the dedicated keyring (Linux)
  tags: [hardening, security, apt-sources]
  when:
    - os_family == "linux"
    - grafana_apt_source.stat.exists
    - grafana_source_signed.rc | default(1) != 0
    - grafana_key_in_trusted.rc | default(1) != 0
    - grafana_key_in_keyring.rc | default(1) != 0
    - not ansible_check_mode
  ansible.builtin.command: >
    gpg --batch --yes --output /etc/apt/keyrings/grafana.gpg
    --dearmor /tmp/grafana-apt.key
  become: true
  register: grafana_keyring_fetched

- name: Verify the dedicated grafana keyring holds the key (Linux)
  tags: [hardening, security, apt-sources]
  when:
    - os_family == "linux"
    - grafana_apt_source.stat.exists
    - grafana_source_signed.rc | default(1) != 0
    - not ansible_check_mode
  ansible.builtin.command: >
    gpg --no-default-keyring --keyring /etc/apt/keyrings/grafana.gpg
    --list-keys B53AE77BADB630A683046005963FA27710458545
  register: grafana_keyring_ready
  changed_when: false

- name: Permissions on the dedicated grafana keyring (Linux)
  tags: [hardening, security, apt-sources]
  when:
    - os_family == "linux"
    - grafana_apt_source.stat.exists
    - grafana_source_signed.rc | default(1) != 0
    - grafana_keyring_ready.rc | default(1) == 0
  ansible.builtin.file:
    path: /etc/apt/keyrings/grafana.gpg
    owner: root
    group: root
    mode: "0644"
  become: true

- name: Pin the grafana apt source to the dedicated keyring (Linux)
  tags: [hardening, security, apt-sources]
  when:
    - os_family == "linux"
    - grafana_apt_source.stat.exists
    - grafana_source_signed.rc | default(1) != 0
    - grafana_keyring_ready.rc | default(1) == 0
  ansible.builtin.lineinfile:
    path: /etc/apt/sources.list.d/grafana.list
    regexp: '^deb\s+(https://packages\.grafana\.com/\S+\s+.*)$'
    line: 'deb [signed-by=/etc/apt/keyrings/grafana.gpg] \1'
    backrefs: true
  become: true
  register: grafana_apt_source_rewritten

- name: Drop the grafana key from legacy trusted.gpg (Linux)
  tags: [hardening, security, apt-sources]
  when:
    - os_family == "linux"
    - grafana_apt_source.stat.exists
    - grafana_source_signed.rc | default(1) != 0
    - grafana_keyring_ready.rc | default(1) == 0
    - grafana_key_in_trusted.rc | default(1) == 0
  ansible.builtin.command: >
    gpg --batch --yes --no-default-keyring --keyring /etc/apt/trusted.gpg
    --delete-key B53AE77BADB630A683046005963FA27710458545
  become: true
  register: grafana_trusted_key_removed

- name: Refresh the apt cache after the grafana keyring move (Linux)
  tags: [hardening, security, apt-sources]
  when:
    - os_family == "linux"
    - grafana_apt_source.stat.exists
    - grafana_source_signed.rc | default(1) != 0
    - not ansible_check_mode
    - >-
      (grafana_keyring_exported | default({})) is changed
      or (grafana_keyring_fetched | default({})) is changed
      or (grafana_apt_source_rewritten | default({})) is changed
      or (grafana_trusted_key_removed | default({})) is changed
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 43200
    lock_timeout: 120
  become: true
  register: _apt_grafana_refresh
  until: _apt_grafana_refresh is succeeded
  retries: 3
  delay: 10

- name: Deploy sudoers drop-in for deploy user
  ansible.builtin.template:
    src: sudoers_deploy.j2
    dest: /etc/sudoers.d/deploy
    mode: "0440"
    validate: "visudo -cf %s"
  become: true
  tags: [hardening, security]

- name: Remove deploy user SSH authorized_keys (post-setup)
  ansible.builtin.file:
    path: "~deploy/.ssh/authorized_keys"
    state: absent
  become: true
  when: remove_deploy_key | default(false) | bool
  tags: [hardening, security, remove_deploy_key]

- name: Lock deploy user (post-setup)
  when: lock_deploy_user | default(false) | bool
  block:
    - name: Lock deploy user (macOS)
      when: os_family == "darwin"
      ansible.builtin.command: dscl . -create /Users/deploy UserShell /usr/bin/false
      become: true

    - name: Lock deploy user (Linux)
      when: os_family == "linux"
      ansible.builtin.user:
        name: deploy
        shell: /usr/sbin/nologin
      become: true
  tags: [hardening, security, lock_deploy]
