---
# precis_worker_agent role defaults.

# The agent profile runs on the gateway; /opt/mcps/venv is the shared venv
# the (now-retired) precis_dream / precis_cron_tick / precis_anki_sync
# LaunchDaemons used too — §A folds their cadences INTO this daemon (the
# `dream_agent` / `anki_sync` scheduler cadences, host-pinned to the
# gateway), so staying on the same shared venv is what lets `anki`
# (installed below) and the dream env resolve here. /opt/precis/venv is the
# worker-host venv on the data node — not present on gateway hosts. A single
# `ansible-playbook --tags mcps` refresh updates every consumer at once.
precis_worker_agent_venv: /opt/mcps/venv
# §L (gr171431 §1): password-free — this daemon runs as `deploy` (UserName
# below); ~deploy/.pgpass (pgpass role) already supplies the password.
precis_worker_agent_dsn: "postgresql://agent_rw@{{ hostvars[postgres_host]['ansible_host'] }}:{{ pgbouncer_port }}/precis_prod"
precis_worker_agent_batch_size: 2
precis_worker_agent_idle_seconds: 60

# Load-average ceiling above which heavy passes self-skip.
# Default null = let the worker auto-scale (os.cpu_count() * 1.5).
# Override to an absolute number (e.g. "12.0") to fix the ceiling.
precis_worker_agent_load_ceiling: ""

# Path to the agent's MCP config (so review passes can read the
# tree via precis tool calls). Factory Phase-2 slice 2B: the agent
# worker now runs as `deploy` (was hermes) so it can reach deploy's
# colima docker socket for the container executor — so this points at
# deploy's ~/.claude/mcp.json, provisioned by this role from the shared
# asa_bot claude_mcp.json.j2 template.
precis_worker_agent_mcp_config: /Users/deploy/.claude/mcp.json

# Container executor (Factory Phase-2 §13). The image + colima live on
# the gateway (Track 1). PRECIS_CONTAINER_BIN points at the homebrew docker
# CLI that talks to deploy's colima VM. PRECIS_AGENT_CONTAINER stays OFF
# in slice 2B (run-as flip only, behaviour-preserving) — flipped to "1"
# in slice 2C once plan_tick is verified green under the new run-as user.
precis_worker_agent_container_bin: /opt/homebrew/bin/docker
precis_agent_image: "precis-agent:latest"

# §A: the operator-SOUL copy is retired — the dreamer persona is packaged
# (precis/data/prompts/dream-persona.md) and the plist no longer sets
# PRECIS_DREAM_SOUL_PATH. Set that var by hand on a host that genuinely
# wants a site-specific dreamer persona; nothing here provisions one.

# Embedder plumbing (gr185401): same values/reasoning as the precis_worker
# role's precis_worker_embedder* — the agent profile's embedder consumers
# (taproot chase verify, anything through load_config()) read the ENV, and
# without these the config default "mock"/an in-process bge-m3 (no torch in
# this venv) is what they get. RemoteEmbedder is a pure-HTTP client; the
# port comes from inventory all.vars.embedder_port so the daemon and the
# precis_embedder service can never drift apart.
precis_worker_agent_embedder: remote
precis_worker_agent_embedder_url: "http://127.0.0.1:{{ embedder_port | default(8181) }}"
