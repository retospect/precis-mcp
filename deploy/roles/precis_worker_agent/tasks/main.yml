---
# precis_worker_agent — long-running LaunchDaemon running
# `precis worker --profile=agent` as hermes on the gateway. Slice-5
# consolidation: replaces precis_schedule + precis_nursery +
# precis_structural + precis_deep_review.

- name: Ensure mactex-no-gui (for latexmk + biber, used by the compile guard)
  when: os_family == "darwin"
  community.general.homebrew_cask:
    name: mactex-no-gui
    state: present
  become: false
  ignore_errors: true  # large download; tolerate intermittent network
  tags:
    - mactex
    - precis-worker-agent

- name: Ensure /var/log/precis-worker-agent.log
  when: os_family == "darwin"
  ansible.builtin.file:
    path: /var/log/precis-worker-agent.log
    state: touch
    # Owner/mode must let ``deploy`` (the UserName in the plist, slice 2B;
    # was hermes) write to stdout/stderr. With ``root:wheel 0644`` (the
    # launchd default) bash can't open the log for write and the daemon
    # exits 78 (EX_CONFIG) before logging anything — the failure mode is
    # silent because there's no log to write the error into.
    mode: "0664"
    owner: deploy
    group: admin
    modification_time: preserve
    access_time: preserve
  become: true

# Factory Phase-2 slice 2B: the agent worker runs as ``deploy`` and its
# in-proc planner (job_claude_inproc → claude -p --mcp-config) reads deploy's
# own ~/.claude/mcp.json. hermes's is managed by the asa_bot role; render
# deploy's copy from the SAME shared template so the DSN/keys stay
# vault-sourced (never hand-copied). deploy already has a working ~/.claude
# (OAuth + sessions from precis-web's claude -p), only mcp.json was missing.
- name: Ensure /Users/deploy/.claude exists (agent worker run-as = deploy)
  when: os_family == "darwin"
  ansible.builtin.file:
    path: /Users/deploy/.claude
    state: directory
    owner: deploy
    group: admin
    mode: "0700"
  become: true

- name: Render deploy's Claude Code mcp.json (in-proc planner MCP config)
  when: os_family == "darwin"
  ansible.builtin.template:
    src: "{{ role_path }}/../asa_bot/templates/claude_mcp.json.j2"
    dest: /Users/deploy/.claude/mcp.json
    owner: deploy
    group: admin
    mode: "0600"
  become: true

# Factory Phase-2 slice 2B3: keep deploy's colima VM alive (reboot + crash
# persistence) so the §13 container executor always has a docker socket.
# Without this, a reboot leaves colima down and containerized passes fail
# silently. Prereq for flipping precis_agent_container_enabled=true.
- name: Ensure /var/log/precis-colima.log (deploy-writable)
  when: os_family == "darwin"
  ansible.builtin.file:
    path: /var/log/precis-colima.log
    state: touch
    mode: "0664"
    owner: deploy
    group: admin
    modification_time: preserve
    access_time: preserve
  become: true

- name: Ensure colima autostart LaunchDaemon
  when: os_family == "darwin"
  ansible.builtin.template:
    src: com.precis.colima.plist.j2
    dest: /Library/LaunchDaemons/com.precis.colima.plist
    mode: "0644"
    owner: root
    group: wheel
  become: true
  notify: reload colima daemon

- name: Load colima autostart LaunchDaemon
  when: os_family == "darwin"
  ansible.builtin.command: >
    launchctl bootstrap system /Library/LaunchDaemons/com.precis.colima.plist
  become: true
  changed_when: false
  failed_when: false

# §A: dream_agent's `dream_agent` scheduler cadence is host-pinned to the
# gateway (this daemon's host) and reads its soul from a deploy-readable
# path — hermes's own ~/.asa/SOUL.md isn't readable by `deploy`. Copy it
# in place of the retired precis_dream role's file-install task.
# fail-soft: an absent operator SOUL is a normal state on a fresh cluster
# (dream_agent's own eligible() gate degrades to a silent skip, same as
# dream-pass.sh's old missing-SOUL check), not a deploy failure.
- name: Ensure /opt/asa/etc exists (dream_agent's deploy-readable SOUL path)
  when:
    - os_family == "darwin"
    - inventory_hostname in groups['gateway']
  ansible.builtin.file:
    path: /opt/asa/etc
    state: directory
    owner: deploy
    group: staff
    mode: "0755"
  become: true

- name: Copy the operator SOUL to a deploy-readable path (dream_agent, §A)
  when:
    - os_family == "darwin"
    - inventory_hostname in groups['gateway']
  ansible.builtin.copy:
    src: /Users/hermes/.asa/SOUL.md
    dest: "{{ precis_dream_soul_path | default('/opt/asa/etc/SOUL.md') }}"
    mode: "0644"
    owner: deploy
    group: staff
    remote_src: true
  become: true
  register: _dream_soul_copy
  failed_when: false
  notify: restart precis-worker-agent

- name: Warn if the operator SOUL is missing (dream_agent degrades to a no-op)
  when:
    - os_family == "darwin"
    - inventory_hostname in groups['gateway']
    - _dream_soul_copy is failed
  ansible.builtin.debug:
    msg: >-
      /Users/hermes/.asa/SOUL.md not found on {{ inventory_hostname }} —
      dream_agent's eligible() gate will skip the `dream_agent` cadence
      (PRECIS_DREAM_SOUL_PATH points at a missing file) until it exists.

# §A: anki_sync's cadence runs from this daemon's process now (the retired
# precis_anki_sync role used to provision these on its own). Same venv
# (precis_worker_agent_venv == the old role's /opt/mcps/venv), same mirror
# dir shape — including the recursive ownership self-heal (a stray
# root-owned mirror.anki2 from a manual run crash-looped the old daemon for
# 8 days, gripe-documented in the retired role).
- name: Install the anki pylib into the agent-worker venv (anki_sync, §A)
  when:
    - os_family == "darwin"
    - inventory_hostname in groups['precis_anki_sync']
  vars:
    uv_bin: "{{ '/opt/homebrew/bin/uv' if os_family == 'darwin' else '/root/.local/bin/uv' }}"
  ansible.builtin.command: >
    {{ uv_bin }} pip install --python {{ precis_worker_agent_venv }}/bin/python --upgrade anki
  become: true
  register: anki_pip
  changed_when: "'Installed' in anki_pip.stdout or 'Downloaded' in anki_pip.stdout"

- name: Ensure the .anki2 mirror directory (deploy-owned, stable; anki_sync, §A)
  when:
    - os_family == "darwin"
    - inventory_hostname in groups['precis_anki_sync']
  ansible.builtin.file:
    path: "{{ anki_mirror_dir | default('/opt/mcps/anki-mirror') }}"
    state: directory
    owner: deploy
    group: staff
    mode: "0700"
    recurse: true
  become: true

# §L control cutover: mirror this host's live PRECIS_QUEST_LOOP_ENABLED
# state into a service_config row BEFORE this deploy's plist render, so a
# console operator's later `service prio` override survives every
# subsequent redeploy (INSERT ... ON CONFLICT DO NOTHING via
# `precis service seed` — never the UPSERTing `service prio`). Unlike the
# system-worker flags (precis_worker role), the plist env itself is NOT
# stripped: PRECIS_QUEST_LOOP_ENABLED is also read directly by
# `precis quest run` and quest/loop.py|allocator.py's own default_on
# fallback, independent of the worker pass's registration — retiring it
# entirely is a wider quest-subsystem call this task doesn't make. The
# worker pass's own gate already stopped reading it (cli/worker.py's
# `_profile_default_on`), so this seed is what gives an operator a live,
# no-redeploy switch for that one pass specifically.
- name: "§L seed: quest_loop_reconcile (mirrors PRECIS_QUEST_LOOP_ENABLED)"
  when: precis_quest_loop_enabled | default(false) | bool
  ansible.builtin.command: >-
    {{ precis_worker_agent_venv }}/bin/precis service seed {{ inventory_hostname }}
    quest_loop_reconcile 5 --actor deploy-seed --database-url {{ precis_worker_agent_dsn }}
  become: true
  become_user: deploy
  environment:
    HOME: "{{ '/Users/deploy' if os_family == 'darwin' else '/home/deploy' }}"
  register: precis_seed_quest_loop
  changed_when: "'seeded' in (precis_seed_quest_loop.stdout | default(''))"
  failed_when: false

- name: Ensure precis-worker-agent LaunchDaemon plist
  when: os_family == "darwin"
  ansible.builtin.template:
    src: precis-worker-agent.plist.j2
    dest: /Library/LaunchDaemons/com.precis.worker-agent.plist
    mode: "0644"
    owner: root
    group: wheel
  become: true
  notify: restart precis-worker-agent

- name: Load precis-worker-agent LaunchDaemon
  when: os_family == "darwin"
  ansible.builtin.command: >
    launchctl load -w /Library/LaunchDaemons/com.precis.worker-agent.plist
  become: true
  changed_when: false
  failed_when: false

# ── Linux/systemd (the GPU node) — factory Phase-2 slice 2: containerized review
# worker. Same role, os_family branch; reuses /opt/precis/venv (the system
# worker's) since the agent profile is the same precis binary. ──
- name: Ensure /var/log/precis-worker-agent.log (Linux, deploy-writable)
  when: os_family == "linux"
  ansible.builtin.file:
    path: /var/log/precis-worker-agent.log
    state: touch
    mode: "0664"
    owner: deploy
    group: deploy
    modification_time: preserve
    access_time: preserve
  become: true

- name: Ensure precis-worker-agent systemd unit (Linux)
  when: os_family == "linux"
  ansible.builtin.template:
    src: precis-worker-agent.service.j2
    dest: /etc/systemd/system/precis-worker-agent.service
    mode: "0644"
    owner: root
    group: root
  become: true
  notify: restart precis-worker-agent (linux)

- name: Enable + start precis-worker-agent (Linux)
  when: os_family == "linux"
  ansible.builtin.systemd:
    name: precis-worker-agent
    enabled: true
    state: started
    daemon_reload: true
  become: true
