---
# precis_worker_agent — long-running LaunchDaemon running
# `precis worker --profile=agent` as hermes on the gateway. Slice-5
# consolidation: replaces precis_schedule + precis_nursery +
# precis_structural + precis_deep_review.
#
# §L-a role split: the task list is unchanged, just moved into two files so
# 20b (the collapsed-worker playbook) can reuse the provisioning half
# (colima sidecar, SOUL copy, mcp.json render, anki install, the
# quest_loop_reconcile seed) without also getting this role's OWN unit
# render — 20b renders its single collapsed unit through the `service_unit`
# role instead. provision.yml's tasks all precede units.yml's here, exactly
# as they did as one file (the ONE reordering — the darwin
# /var/log/precis-worker-agent.log touch used to run 2nd, now runs after
# provision.yml's block) has no behavioural effect: every task in both
# files is an idempotent, independent side effect (a distinct file/dir/log/
# service_config row) — none of them reads output that a later-in-the-
# original-order task produces, so playbook 37's end state (and every
# `notify`/handler firing) is unchanged.

- ansible.builtin.import_tasks: provision.yml
- ansible.builtin.import_tasks: units.yml
