---
# db_exporters — postgres_exporter (:9187) and pgbouncer_exporter (:9127) on
# the DB node (postgres_host). Both run as precis service units
# (service_unit role). The monitoring role scrapes them only when
# monitoring_db_exporters is true; flip it after both targets answer.
#
# The DSNs are NOT in the repo. They live in the (gitignored) ansible vault as
# the two vars below; Ansible resolves them on the control side and renders
# them into a 0600 env file (owned by db_exporters_run_as) on the DB node, which each launcher reads at
# start. The DB node has no precis CLI and gets none (the data group stays
# free of worker lanes), so nothing here uses the CLI. A rotation is: change
# the vault var, re-run 18a (the changed env file restarts both units).
db_exporters_run_as: deploy # owns the 0600 env file, so it can read it; no root needed
db_exporters_bin_dir: /usr/local/bin

# Vault var names holding the two DSNs (see
# inventory.example/group_vars/all/vault.yml.example). The postgres DSN is a
# libpq URL; the pgbouncer one connects to database `pgbouncer` on the
# pgbouncer port as a `stats_users` member.
db_exporters_pg_dsn_var: vault_pg_exporter_dsn
db_exporters_pgbouncer_dsn_var: vault_pgbouncer_exporter_dsn

# Env file the launchers read (owner db_exporters_run_as, mode 0600).
db_exporters_env_dir: /etc/precis
db_exporters_env_file: "{{ db_exporters_env_dir }}/db-exporters.env"

# Login the DSNs use (documentation only; the role never reads it).
# OPEN (Reto): pgbouncer.ini.j2 already lists prometheus_reader in stats_users
# and the example vault names vault_pg_prometheus_pass, but nothing in this
# tree creates the Postgres role; it needs pg_monitor.
db_exporters_login: prometheus_reader

# Bind address for both exporters. Empty = all interfaces (the monitoring
# host scrapes hostvars[postgres_host].ansible_host). OPEN (Reto): tailnet only?
db_exporters_listen_host: ""
db_exporters_pg_port: 9187
db_exporters_pgbouncer_port: 9127

# Pinned upstream release tarballs (homebrew-core has no formula for either;
# the DB node is macOS). Bump version and checksums together.
db_exporters_release_url: https://github.com/prometheus-community
db_exporters_pg_version: "0.20.1"
db_exporters_pgbouncer_version: "0.12.1"
db_exporters_checksums:
  postgres_exporter:
    darwin-arm64: "sha256:4dd2b9e7ac658556dd2cb143ac472a87ff540ffc2b482d5311ff0ef47b11413c"
    linux-amd64: "sha256:89d4f7e7920cad48fdc3133f789556ef5253c330a9f5fdace3bdb6344c0a8b5a"
    linux-arm64: "sha256:d5d86fb98bb1f26b088d1a6fda07fd6b6f035cb5d40492f75ec3bfebb5ddfe9d"
  pgbouncer_exporter:
    darwin-arm64: "sha256:9eca132c7668066eef013310bb6df2bff00d0b73b8b40fb48be7f147ca9e1785"
    linux-amd64: "sha256:fa391b513d3a3f03843a6e0d64e711fda1f057dc43133db5c1b130ba38767857"
    linux-arm64: "sha256:0abb808ae8e251126c854ebdce382993876df629b34c0401816d3818db92c700"
