---
# PgBouncer on the data node — connection pooler in front of Postgres

- name: Keep the DB node's operational paths off the NAS share
  ansible.builtin.include_tasks: "{{ role_path }}/../../tasks/assert_host_local_root.yml"

- name: Install PgBouncer (macOS)
  when: os_family == "darwin"
  community.general.homebrew:
    name: pgbouncer
    state: present
  become: false

- name: Stop default brew pgbouncer service
  when: os_family == "darwin"
  ansible.builtin.shell: |
    /opt/homebrew/bin/brew services stop pgbouncer 2>/dev/null || true
    pkill -f 'pgbouncer.*/opt/homebrew/etc' 2>/dev/null || true
  become: true
  environment:
    HOME: /Users/deploy
    USER: deploy
  changed_when: false

- name: Symlink pgbouncer binary
  ansible.builtin.file:
    src: /opt/homebrew/bin/pgbouncer
    dest: /usr/local/bin/pgbouncer
    state: link
    force: true
  become: true
  when: os_family == "darwin"

- name: Ensure PgBouncer config directory
  ansible.builtin.file:
    path: /usr/local/etc/pgbouncer
    state: directory
    owner: pgboss
    mode: "0755"
  become: true

- name: Deploy pgbouncer.ini
  ansible.builtin.template:
    src: pgbouncer.ini.j2
    dest: /usr/local/etc/pgbouncer/pgbouncer.ini
    mode: "0640"
    owner: pgboss
  become: true
  notify: restart pgbouncer

# Refuse, never silently drop (gr678654 want 1, gr680328 want 3). On
# 2026-11-14 a deploy from an overlay that had lost precis_system/precis_owner
# from postgres_roles re-rendered this userlist without them and every unit
# logging in as precis_system lost DB auth for four hours. The variable name
# is ASSEMBLED per item ('vault_' ~ password_var), never written literally —
# the lanes-deny scan flags literal credential variable names, and `_var in
# vars` tests presence without resolving the secret, so the message stays
# visible (no no_log needed).
- name: Refuse to render userlist.txt while a role in postgres_roles has no password var
  ansible.builtin.assert:
    that:
      - "_var in vars"
    fail_msg: >-
      postgres_roles names {{ item.name }} but {{ _var }} is undefined — the
      render would drop the role from pgbouncer and every unit logging in as
      {{ item.name }} would lose DB auth (2026-11-14, gr678654). Define it in
      the overlay vault (ansible-vault encrypt_string, tr -d '\n' first —
      gr583810) or remove the role from postgres_roles.
  vars:
    _var: "{{ 'vault_' ~ item.password_var }}"
  loop: "{{ postgres_roles | default([]) }}"
  loop_control:
    label: "{{ item.name }}"
  tags: [roles]

- name: Refuse to render userlist.txt while the db-own roles are missing from postgres_roles
  ansible.builtin.assert:
    that:
      - "'precis_system' in _role_names"
      - "'precis_ingress' in _role_names"
      - "'precis_owner' in _role_names"
    fail_msg: >-
      precis_db_own_cutover_done is true but postgres_roles ({{ _role_names | join(', ') }})
      lacks one of precis_system / precis_ingress / precis_owner — the units
      whose DSN uses the missing role would lose DB auth (2026-11-14,
      gr678654). Add { name: <role>, password_var: pg_<role>_pass } with its
      vault password to the overlay.
  vars:
    _role_names: "{{ postgres_roles | default([]) | map(attribute='name') | list }}"
  when: precis_db_own_cutover_done | default(false) | bool
  tags: [roles]

- name: Deploy userlist.txt
  ansible.builtin.template:
    src: userlist.txt.j2
    dest: /usr/local/etc/pgbouncer/userlist.txt
    mode: "0600"
    owner: pgboss
  become: true
  no_log: true
  # A SIGHUP reload re-reads the auth file without dropping pooled
  # connections — a restart would, and is also why --tags roles must not
  # reach the restart handler (gr583700).
  notify: reload pgbouncer
  tags: [roles]

- name: Ensure PgBouncer runtime directories
  ansible.builtin.file:
    path: /opt/homebrew/var/run/pgbouncer
    state: directory
    owner: pgboss
    group: staff
    mode: "0755"
  become: true

# The log dir is roles/backups' (deploy, 0750, group staff on macOS), so
# pgboss can reach it but not create in it. A fresh host_local_root
# therefore needs both logfiles pre-created as pgboss, or pgbouncer cannot
# open them and does not start. Creating the dir here (no owner or mode)
# only covers a run before the backups role; times are preserved.
- name: Ensure PgBouncer log directory
  ansible.builtin.file:
    path: "{{ host_local_root | default(shared_mount) }}/logs"
    state: directory
  become: true

- name: Ensure PgBouncer log files (pgboss-owned)
  ansible.builtin.file:
    path: "{{ host_local_root | default(shared_mount) }}/logs/{{ item }}"
    state: touch
    owner: pgboss
    group: staff
    mode: "0644"
    access_time: preserve
    modification_time: preserve
  loop:
    - pgbouncer.log
    - pgbouncer-error.log
  become: true

- name: Deploy PgBouncer launchd plist (macOS)
  when: os_family == "darwin"
  ansible.builtin.template:
    src: pgbouncer.plist.j2
    dest: /Library/LaunchDaemons/com.pgbouncer.plist
    mode: "0644"
  become: true
  notify: restart pgbouncer

- name: Unload old PgBouncer plist
  when: os_family == "darwin"
  ansible.builtin.shell: launchctl unload /Library/LaunchDaemons/com.pgbouncer.plist 2>/dev/null || true
  become: true
  changed_when: false

- name: Load PgBouncer plist
  when: os_family == "darwin"
  ansible.builtin.command: launchctl load -w /Library/LaunchDaemons/com.pgbouncer.plist
  become: true
  changed_when: false
  failed_when: false

- name: Wait for PgBouncer to listen
  ansible.builtin.wait_for:
    port: "{{ pgbouncer_listen_port }}"
    host: 127.0.0.1
    timeout: 15
  tags: [roles]
