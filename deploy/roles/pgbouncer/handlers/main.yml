---
- name: restart pgbouncer
  when: os_family == "darwin"
  ansible.builtin.command: launchctl kickstart -k system/com.pgbouncer
  become: true
  failed_when: false

# SIGHUP re-reads pgbouncer.ini and userlist.txt without dropping pooled
# connections — the only handler the `roles` tag may fire (gr583700).
- name: reload pgbouncer
  when: os_family == "darwin"
  ansible.builtin.command: launchctl kill SIGHUP system/com.pgbouncer
  become: true
  failed_when: false
  tags: [roles]
