---
# precis_watch — runs `precis watch` against papers_inbox_path.
# Single instance only (race on inbox dir if multiple watchers). Throughput
# scales via the precis_worker pool, not via watcher copies.
#
# Assumes precis_worker role has already provisioned /opt/precis/venv
# with precis-mcp[paper]. We don't reinstall it here.
#
# `precis_watch_enabled: false` (host_vars) actively tears the watcher
# down — daemon unloaded, plist/unit removed — so exclusion of a host
# (e.g. the scheduler/data nodes, both 32G) is enforced on every deploy
# rather than relying on a one-off plist-move + hosts-list omission.

# ── Teardown (precis_watch_enabled: false) ──
- name: Unload precis-watch LaunchDaemon (macOS — disabled host)
  when: os_family == "darwin" and not (precis_watch_enabled | bool)
  ansible.builtin.command: launchctl bootout system/com.precis.watch
  become: true
  register: watch_bootout
  changed_when: watch_bootout.rc == 0
  failed_when: false

- name: Remove precis-watch plist (macOS — disabled host)
  when: os_family == "darwin" and not (precis_watch_enabled | bool)
  ansible.builtin.file:
    path: /Library/LaunchDaemons/com.precis.watch.plist
    state: absent
  become: true

- name: Stop + disable precis-watch (Linux — disabled host)
  when: os_family == "linux" and not (precis_watch_enabled | bool)
  ansible.builtin.systemd:
    name: precis-watch
    enabled: false
    state: stopped
  become: true
  failed_when: false

- name: Remove precis-watch systemd unit (Linux — disabled host)
  when: os_family == "linux" and not (precis_watch_enabled | bool)
  ansible.builtin.file:
    path: /etc/systemd/system/precis-watch.service
    state: absent
  become: true

- name: End play for disabled host
  when: not (precis_watch_enabled | bool)
  ansible.builtin.meta: end_host

# ── Install (precis_watch_enabled: true) ──
- name: Verify /opt/precis/venv exists (precis_worker should have created it)
  ansible.builtin.stat:
    path: "{{ precis_watch_venv }}/bin/precis"
  register: precis_bin
  become: true

- name: Fail early if precis venv is missing
  ansible.builtin.fail:
    msg: "{{ precis_watch_venv }}/bin/precis not found. Run playbooks/20-precis-worker.yml on this host first."
  when: not precis_bin.stat.exists

- name: Pre-create precis-watch log file (macOS — launchd can't if it's not the root user)
  when: os_family == "darwin"
  ansible.builtin.file:
    path: /var/log/precis-watch.log
    state: touch
    owner: deploy
    group: wheel
    mode: "0644"
  become: true
  changed_when: false

- name: Render precis-watch LaunchDaemon (macOS)
  when: os_family == "darwin"
  ansible.builtin.template:
    src: precis-watch.plist.j2
    dest: /Library/LaunchDaemons/com.precis.watch.plist
    mode: "0644"
  become: true
  notify: reload precis watch (macos)

# §L (gr176337): this used to be an unconditional raw bootout→bootstrap
# pair (the exact racy pattern gr176223 fixed everywhere else), firing on
# EVERY run regardless of whether the plist actually changed. The plist
# template task above already `notify`s "reload precis watch (macos)" —
# which routes through the shared poll-until-gone `tasks/reload_launchd.yml`
# (see handlers/main.yml) — so the real reload-with-new-env only needs to
# happen there. This step is now just the idempotent "load if not already
# loaded" no-op, mirroring the fixed precis_worker pattern (gripe #48481).
- name: Load precis-watch LaunchDaemon (macOS — idempotent)
  when: os_family == "darwin"
  ansible.builtin.command: >
    launchctl load -w /Library/LaunchDaemons/com.precis.watch.plist
  become: true
  changed_when: false
  failed_when: false

# ── Linux (systemd) — GPU node ──
- name: Render precis-watch systemd unit (Linux)
  when: os_family == "linux"
  ansible.builtin.template:
    src: precis-watch.service.j2
    dest: /etc/systemd/system/precis-watch.service
    mode: "0644"
  become: true
  notify: reload precis watch (linux)

- name: Enable + start precis-watch (Linux)
  when: os_family == "linux"
  ansible.builtin.systemd:
    name: precis-watch
    daemon_reload: true
    enabled: true
    state: started
  become: true
