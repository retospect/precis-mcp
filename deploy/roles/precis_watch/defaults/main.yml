---
# precis_watch — runs `precis watch` on the NAS inbox, single instance.
# Reuses the /opt/precis/venv from the precis_worker role (already has
# precis-mcp[paper] installed).

# Enforced exclusion switch: false actively unloads the daemon and removes
# the plist/unit on that host (tasks/main.yml teardown block), so a host
# pulled from the watcher set can't drift back in via a stale plist.
precis_watch_enabled: true

precis_watch_venv: /opt/precis/venv

# Same DSN as precis_worker — both pull/push to precis_prod via pgbouncer.
# §L (gr171431 §1): password-free, same as precis_worker_dsn — this daemon
# also runs as `deploy` (UserName below), so ~deploy/.pgpass (pgpass role)
# supplies the password. The fallback only matters if precis_worker's role
# genuinely never ran on this host (not the assumed case — see the header).
precis_watch_dsn: "{{ precis_worker_dsn | default('postgresql://agent_rw@' + hostvars[postgres_host]['ansible_host'] + ':' + (pgbouncer_port | string) + '/precis_prod') }}"

# Watch knobs
precis_watch_dir: "{{ papers_inbox_path }}"     # nas_root/papers/inbox — same path every node
precis_watch_corpus: "{{ papers_corpus_path }}" # nas_root/papers/corpus
precis_watch_debounce: 3
precis_watch_user: auto-watch

# Subprocess batching — leak isolation. Marker has a slow memory leak;
# running each PDF in its own subprocess is the proven workaround.
# Concurrency 3 = up to 3 parallel Marker subprocesses per watcher; with
# 2 watchers (gateway + a worker node) that's 6 concurrent Markers cluster-
# wide. Each Marker is ~3 GB RAM resident; 6 × 3 = ~18 GB peak across both
# nodes, well within headroom (M2 Ultra: ~96 GB free, M2 Pro: ~30 GB).
precis_watch_subprocess_batch: 3
precis_watch_subprocess_concurrency: 3
