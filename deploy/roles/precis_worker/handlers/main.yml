---
- name: reload precis worker (macos)
  # Reload via the SHARED safe launchd task (was a bespoke copy of the
  # bootout→sleep 1→bootstrap→kickstart cycle). That fixed `sleep 1` raced
  # launchd's ASYNCHRONOUS bootout: a late-completing teardown deregistered
  # the label and reaped the freshly-bootstrapped worker while the deploy
  # stayed green — a multi-day silent outage (gr176223). The shared task now
  # polls until the label is actually gone before bootstrapping and settle-
  # re-asserts a stable pid. Migrating here also ends the per-role drift the
  # shared task exists to prevent (gr48490); it still retries the transient
  # gr48481 "Load failed: 5" and fails loudly if the daemon never comes up.
  ansible.builtin.include_tasks: "{{ role_path }}/../../tasks/reload_launchd.yml"
  vars:
    reload_unit: com.precis.worker
    reload_persistent: true
  # OS-guarded: the code-install task notifies BOTH handlers (it has no
  # os_family guard), so each must skip on the other family.
  when: os_family == "darwin"

- name: reload precis worker (linux)
  ansible.builtin.systemd:
    name: precis-worker
    daemon_reload: true
    state: restarted
  become: true
  when: os_family == "linux"
