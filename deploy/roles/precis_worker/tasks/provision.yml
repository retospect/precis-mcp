---
# precis_worker provisioning HALF (§L-b split, mirrors precis_worker_agent's):
# venv + deps + dirs + shared facts + the §L service_config seed — everything
# that is NOT the split-unit render. 20b imports ONLY this half; the full
# main.yml (provision + units) is what playbook 20 keeps using as the
# documented per-host rollback.
# precis_worker — runs `precis worker` as a daemon on every cluster node.
# Pulls work from the postgres queue via the local SSH tunnel.

# precis-mcp[paper] pulls in marker-pdf → pillow==10.4.0, which refuses to
# build against Python 3.14 (no 3.14 wheels yet, src build fails on macOS
# 26 toolchain). Pin to Python 3.12 — same trick the extract_watch role
# uses for the same reason.
- name: Ensure uv is installed (macOS)
  when: os_family == "darwin"
  community.general.homebrew:
    name: uv
    state: present
  become: false

- name: Ensure Homebrew python@3.12 (macOS — pillow/marker-pdf don't build on 3.14)
  when: os_family == "darwin"
  community.general.homebrew:
    name: python@3.12
    state: present
  become: false

- name: Resolve venv python interpreter (macOS — symlink to Homebrew python3.12)
  ansible.builtin.set_fact:
    precis_brew_python: /opt/homebrew/opt/python@3.12/bin/python3.12
  when: os_family == "darwin"

- name: Resolve uv binary path
  ansible.builtin.set_fact:
    precis_uv_bin: "{{ '/opt/homebrew/bin/uv' if os_family == 'darwin' else '/root/.local/bin/uv' }}"

- name: Create venv parent dir
  ansible.builtin.file:
    path: /opt/precis
    state: directory
    mode: "0755"
  become: true

- name: Create precis worker venv (macOS — symlink to Homebrew python so FDA grant survives ansible re-runs)
  when: os_family == "darwin"
  ansible.builtin.command:
    cmd: "{{ precis_brew_python }} -m venv --symlinks {{ precis_worker_venv }}"
    creates: "{{ precis_worker_venv }}/bin/python3"
  become: true

- name: Create precis worker venv (Linux — uv)
  when: os_family == "linux"
  ansible.builtin.command:
    cmd: "{{ precis_uv_bin }} venv {{ precis_worker_venv }}"
    creates: "{{ precis_worker_venv }}/bin/python"
  become: true

- name: Install precis-mcp[paper] into worker venv
  # Installing from git+https because the worker subcommand only lives in
  # the v7/v8 line — PyPI is still at 6.0.0 as of 2026-05-31. Point at a
  # branch ref (configurable via precis_worker_git_ref) so a single commit
  # to that branch redeploys the workers on the next ansible run.
  #
  # ``--refresh-package precis-mcp`` forces uv to ignore its cached
  # resolution of ``main`` and re-fetch the current HEAD. Without it,
  # uv pins the first SHA it ever resolved for the branch and a fresh
  # push doesn't deploy until someone manually clears the cache. Only
  # needed for a MOVING ref: redeploy-precis.yml step 0 pins every ref
  # to a frozen 40-char sha, an immutable target where uv's cached
  # checkout/build is exactly right — so the flag is dropped there and
  # kept only for a branch-name install (standalone role run, explicit
  # -e branch deploy), where the stale-pin problem actually exists.
  #
  # Skipped when this host's pre-flight (redeploy-precis.yml step 0b)
  # proved no managed venv moves this deploy (`precis_deploy_changed`
  # false) — a redundant same-sha redeploy stops paying a full uv
  # resolve per venv. Fail-safe direction: an undefined fact (standalone
  # run, serving hosts, site.yml) defaults to installing. Escape hatch:
  # `-e precis_force_install=true` installs regardless (e.g. after an
  # out-of-band venv edit, or an extras/topology change with no new sha
  # — the preflight only compares shas, so extras added to a host group
  # land on the next code deploy unless forced).
  #
  # NOTE: mermaid (mermaidx, pure wheels) is a core dep now — the
  # diagram_propose tick's render/validate (ADR 0057) works on every worker
  # without an extra. See pyproject's "Deterministic, pure-code, no-API tool
  # deps" note. Likewise the former `patent`/`external` extras were promoted
  # to core 2026-08-16, so only `paper` (marker/torch) remains here.
  #
  # ``catalyst`` (autocatpath_plugin hosts only) pulls the light pure
  # autocatpath engine so PathwayHandler imports — the plist sets
  # PRECIS_AUTOCATPATH_ENABLED, but without the module the handler
  # InitErrors on every pathway dispatch (seen on the agent worker 2026-08-09).
  vars:
    _precis_worker_ref_is_sha: "{{ (precis_worker_git_ref | default('main')) is match('^[0-9a-f]{40}$') }}"
  when: >-
    (precis_deploy_changed | default(true) | bool)
    or (precis_force_install | default(false) | bool)
  ansible.builtin.shell: |
    {{ precis_uv_bin }} pip install --python {{ precis_worker_venv }}/bin/python --upgrade \
      {{ '' if _precis_worker_ref_is_sha | bool else '--refresh-package precis-mcp' }} \
      --constraints /opt/precis/constraints.txt \
      'precis-mcp[paper{% if inventory_hostname in (precis_capabilities.autocatpath_plugin | default([])) %},catalyst{% endif %}] @ git+https://github.com/retospect/precis-mcp@{{ precis_worker_git_ref }}'
  become: true
  register: precis_install
  # uv prints its "Installed/Updated N package(s)" summary to STDERR, so
  # a stdout-only match misses a real code-only refresh and the reload
  # handler is skipped — the daemon keeps running stale in-memory code.
  # Check both streams (cf. the llamacpp role, which already does).
  changed_when: >-
    'Installed' in (precis_install.stdout + precis_install.stderr)
    or 'Updated' in (precis_install.stdout + precis_install.stderr)
  # A code-only refresh MUST restart the daemon, else it keeps running
  # the old in-memory code with a fresh venv on disk (seen 2026-07-01:
  # a struct_relax redeploy updated the venv but the Linux worker stayed
  # up 2 days on stale code — only a later role's restart saved it). The
  # unit/plist render tasks below also notify these, so an unchanged unit
  # + changed code now still restarts. Both handlers are OS-guarded, so
  # notifying both from this OS-agnostic task runs only the matching one.
  notify:
    - reload precis worker (macos)
    - reload precis worker (linux)

# ── §L control cutover: seed service_config from TODAY's live plist flag
# state, BEFORE the plist/unit below is re-rendered without the ENABLE
# flags — so the very first cutover deploy is behaviour-preserving. Uses
# `precis service seed` (INSERT ... ON CONFLICT DO NOTHING via the
# freshly-installed venv above), never `service prio` — a console operator
# override set after this first ran must survive every later redeploy.
# Idempotent: harmless to re-run forever. See workers/service_config.py's
# seed_service_prio + workers/registry.py's ServiceSpec.enable_env (the
# service names below mirror those specs 1:1).
- name: "§L seed: mirror the retiring PRECIS_*_ENABLED flags into service_config"
  ansible.builtin.command: >-
    {{ precis_worker_venv }}/bin/precis service seed {{ inventory_hostname }}
    {{ item.service }} 5 --actor deploy-seed --database-url {{ precis_worker_dsn }}
  loop:
    - service: llm_summarize
      enabled: "{{ precis_worker_summarize_llm | default(false) | bool }}"
    - service: classify
      enabled: "{{ precis_worker_classify | default(false) | bool }}"
    - service: llm_reconcile
      enabled: "{{ precis_worker_llm_reconcile | default(false) | bool }}"
    # (paper_rank is deliberately NOT seeded: it post-dates the §L cutover, so
    # there is no retiring env flag to mirror — its one gate is the console
    # service_config row, set from the web Status → Services tab or
    # `precis service prio`.)
    - service: job_claude_docker
      enabled: >-
        {{ (inventory_hostname in (groups['agent_sandbox_hosts'] | default([]))) }}
    # cast_audio narrates the daily reading-brief cast (now the combined
    # news→personal morning episode). Its enable flag lives in the tts role's
    # tts.env (PRECIS_CAST_AUDIO_ENABLED), invisible to this precis_worker seed
    # loop — so the original §L seed missed it and the pass silently went dark
    # on the TTS host after §L retired the env gate. Seed it on the TTS host so
    # a redeploy re-asserts it. (briefing_audio — the standalone news-only
    # episode — is deliberately NOT seeded: it stays default-OFF = retired,
    # superseded by the combined episode.)
    - service: cast_audio
      enabled: >-
        {{ (inventory_hostname in (precis_capabilities.tts_render | default([]))) }}
  loop_control:
    label: "{{ item.service }} (was-enabled={{ item.enabled }})"
  when: item.enabled | bool
  become: true
  become_user: deploy
  environment:
    HOME: "{{ '/Users/deploy' if os_family == 'darwin' else '/home/deploy' }}"
  register: precis_seed_result
  changed_when: "'seeded' in (precis_seed_result.stdout | default(''))"
  failed_when: false  # a transient DB hiccup here shouldn't fail the whole deploy

- name: Ensure HF model cache dir
  ansible.builtin.file:
    path: "{{ precis_worker_hf_home }}"
    state: directory
    owner: deploy
    mode: "0755"
  become: true

# Marker tries to create a `static/` directory at the site-packages root the
# first time it processes a PDF, but the venv is root-owned so deploy can't
# write there → silent fallback to fitz (cruder layout extraction). Pre-create
# as deploy-owned.
- name: Ensure marker static dir is deploy-writable (macOS)
  when: os_family == "darwin"
  ansible.builtin.file:
    path: "{{ precis_worker_venv }}/lib/python3.12/site-packages/static"
    state: directory
    owner: deploy
    group: staff
    mode: "0755"
  become: true

- name: Ensure marker static dir is deploy-writable (Linux)
  when: os_family == "linux"
  ansible.builtin.file:
    path: "{{ precis_worker_venv }}/lib/python3.12/site-packages/static"
    state: directory
    owner: deploy
    group: deploy
    mode: "0755"
  become: true

# Marker uses exiftool when present to pull PDF metadata cleanly. Without it,
# every ingest logs "exiftool not found in PATH" and falls back to fitz-only
# metadata, which can lose page-level title/author/DOI hints.
- name: Ensure exiftool is installed (macOS)
  when: os_family == "darwin"
  community.general.homebrew:
    name: exiftool
    state: present
  become: false

- name: Ensure exiftool is installed (Linux)
  when: os_family == "linux"
  ansible.builtin.package:
    name: libimage-exiftool-perl
    state: present
  become: true

# launchd hits EX_CONFIG (78) when StandardOutPath can't be created. /var/log
# on modern macOS only allows root writes, so a deploy-owned daemon can't
# create the file itself — pre-create with deploy ownership.

# ── anki_sync cadence deps (ported from the retired precis_worker_agent role) ──
#
# `anki` is NOT a precis-mcp extra — it's a standalone pylib installed straight
# into a venv, so it is bound to whichever interpreter the install names.
#
# That is the whole bug, and it is subtler than a missing task. 20b DOES import
# precis_worker_agent's provisioning half, and that half's anki task DID keep
# running — but it installs into `precis_worker_agent_venv` (/opt/mcps/venv),
# the RETIRED agent daemon's venv. Since the gateway collapsed onto this role's
# `--profile all` worker (com.precis.worker-agent.plist.bak-20260723), the live
# process runs from `precis_worker_venv` (/opt/precis/venv). Verified on
# the gateway 2026-08-07: anki importable in /opt/mcps/venv, absent in
# /opt/precis/venv. The pylib was on the box the entire time, just never on the
# path the running interpreter searched.
#
# And the failure is silent by construction: `_anki_sync_eligible()`
# (workers/scheduler.py) gates on PRECIS_ANKI_ENABLED **and**
# `find_spec("anki")`, and an ineligible host short-circuits BEFORE
# `claim_scheduler_lease` — nothing errors, nothing logs, the lease just stops
# advancing. PRECIS_ANKI_ENABLED=1 stayed set throughout, which is exactly what
# made the host look configured. anki_sync last fired 2026-08-04; the watchdog
# did raise `[cadence] anki_sync stale` and auto-file gripe 193428, and it still
# sat ~3 days.
#
# Installing from THIS half binds the pylib to the venv the collapsed worker
# actually runs, and survives the agent role being deleted outright.
- name: Install the anki pylib into the worker venv (anki_sync cadence)
  when:
    - os_family == "darwin"
    - inventory_hostname in groups.get('precis_anki_sync', [])
  vars:
    uv_bin: "{{ '/opt/homebrew/bin/uv' if os_family == 'darwin' else '/root/.local/bin/uv' }}"
  ansible.builtin.command: >
    {{ uv_bin }} pip install --python {{ precis_worker_venv }}/bin/python --upgrade anki
  become: true
  register: anki_pip
  changed_when: "'Installed' in anki_pip.stdout or 'Downloaded' in anki_pip.stdout"

# Recursive ownership self-heal: a stray root-owned mirror.anki2 from a manual
# run crash-looped the old daemon for 8 days (gripe-documented in the retired
# precis_anki_sync role). Keep the recurse.
- name: Ensure the .anki2 mirror directory (deploy-owned, stable)
  when:
    - os_family == "darwin"
    - inventory_hostname in groups.get('precis_anki_sync', [])
  ansible.builtin.file:
    path: "{{ anki_mirror_dir | default('/opt/mcps/anki-mirror') }}"
    state: directory
    owner: deploy
    group: staff
    mode: "0700"
    recurse: true
  become: true
