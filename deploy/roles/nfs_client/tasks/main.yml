---
# NFS client mount on all non-server nodes, at the uniform /mnt/cluster
# role-named path (shared_mount — cluster-mount-namespace spec, gr194012).
# Mount options:
#   hard    — retry indefinitely if server goes down (default, but explicit)
#   intr    — allow interrupt on hung operations
#   nosuid  — ignore setuid/setgid bits from remote content
#   nodev   — ignore device files from remote content
#   noatime — hot share, skip access-time updates
#   _netdev (Linux) — network filesystem, order after network.target
#   x-systemd.automount (Linux) — mount on first access, not at boot.
#     _netdev alone races link-up: network.target can be reached before the
#     LAN interface has an address, and a failed boot mount never retries
#     ("mount.nfs: Network is unreachable" → mount unit failed, seen on a
#     linux client in the 2026-08-15 reboot test). The automount unit defers the real mount to
#     first access, when the network is long up — same lazy semantics the
#     NAS gets from autofs.
#
# Server choice (cluster-fileserver-move): cluster_share_on_nas (defaults/)
# is the cutover flag. Off, every task below renders exactly the pre-move
# source and options. On, the source is the NAS's `cluster` share by the
# name the /etc/hosts line pins, and the old server's line is replaced.

- name: Refuse a cutover the overlay cannot describe
  when: cluster_share_on_nas | bool
  ansible.builtin.assert:
    that:
      - nas_lan_name | default('') | length > 0
      - nas_lan_ip | default('') | length > 0
      - nas_cluster_export | default('') | length > 0
    fail_msg: >-
      cluster_share_on_nas needs nas_lan_name, nas_lan_ip and
      nas_cluster_export in the overlay (inventory.example/hosts.example.yml).
    quiet: true

- name: Pick the cluster share's source and options
  ansible.builtin.set_fact:
    nfs_client_src: >-
      {{ (nas_lan_name ~ ':' ~ nas_cluster_export) if (cluster_share_on_nas | bool)
         else (hostvars[nfs_server]['lan_ip'] ~ ':' ~ nfs_export_path ~ '/shared') }}
    nfs_client_opts_darwin: >-
      {{ nas_mount_opts_darwin if (cluster_share_on_nas | bool)
         else 'hard,intr,nosuid,nodev,noatime' }}
    nfs_client_opts_linux: >-
      {{ nas_mount_opts_linux if (cluster_share_on_nas | bool)
         else 'hard,intr,nosuid,nodev,noatime,_netdev,x-systemd.automount,x-systemd.mount-timeout=30' }}

- name: Pin the NAS in /etc/hosts (cutover)
  ansible.builtin.include_tasks: "{{ role_path }}/../../tasks/nas_hosts_entry.yml"
  when: cluster_share_on_nas | bool

- name: Provision /mnt namespace root (macOS sealed root)
  ansible.builtin.include_tasks: "{{ role_path }}/../../tasks/darwin_synthetic_mnt.yml"
  when: os_family == "darwin" and shared_mount is match('^/mnt(/|$)')

- name: Ensure mount point exists
  ansible.builtin.file:
    path: "{{ shared_mount }}"
    state: directory
    mode: "0755"
  become: true

# macOS mount(8) does not consult /etc/fstab, so ansible.posix.mount's
# state=mounted fails there ("unknown special file or file system"). Static
# NFS mounts on darwin go through autofs: an fstab entry picked up by the
# default `/-  -static` auto_master map, applied with `automount -c` — the
# same idiom autofs_client uses for the NAS, and how /opt/shared was always
# actually mounted. Keyed on the src, so a shared_mount change rewrites the
# old entry instead of leaving a second, stale static mount.
# Server change: drop any line already mounting shared_mount from a DIFFERENT
# source, else two static entries claim one mount point. The negative
# lookahead spares the current source line (idempotent re-runs).
- name: Remove stale fstab entries for shared_mount from another server (macOS)
  when: os_family == "darwin"
  ansible.builtin.lineinfile:
    path: /etc/fstab
    regexp: '^(?!{{ (nfs_client_src ~ " ") | regex_escape }})\S+ {{ shared_mount | regex_escape }} nfs '
    state: absent
  become: true

- name: Add shared NFS entry to /etc/fstab (macOS)
  when: os_family == "darwin"
  ansible.builtin.lineinfile:
    path: /etc/fstab
    regexp: "^{{ nfs_client_src | regex_escape }} "
    line: "{{ nfs_client_src }} {{ shared_mount }} nfs {{ nfs_client_opts_darwin }} 0 0"
    state: present
    create: true
    mode: "0644"
  become: true

# automount -c does not drop a static mount that is already up, so at
# cutover the old server's share stays mounted until it is unmounted. Plain
# umount, no -f: with the share's users stopped first (Phase 3 step 8) it
# succeeds; with one still busy it fails and the play stops there.
# `mount -t nfs` reads the mount table and never touches the share.
- name: List NFS mounts (macOS, cutover)
  when: os_family == "darwin" and cluster_share_on_nas | bool
  ansible.builtin.command: /sbin/mount -t nfs
  register: nfs_client_darwin_mounts
  changed_when: false
  check_mode: false

- name: Find a share at shared_mount from another source (macOS, cutover)
  when: os_family == "darwin" and cluster_share_on_nas | bool
  ansible.builtin.set_fact:
    nfs_client_stale_mounts: >-
      {{ nfs_client_darwin_mounts.stdout_lines
         | select('search', ' on ' ~ (shared_mount | regex_escape) ~ ' [(]')
         | reject('match', (nfs_client_src | regex_escape) ~ ' on ')
         | list }}

- name: Unmount the old server's share (macOS, cutover)
  when:
    - os_family == "darwin" and cluster_share_on_nas | bool
    - nfs_client_stale_mounts | length > 0
  ansible.builtin.command: /sbin/umount {{ shared_mount }}
  become: true
  changed_when: true

- name: Apply autofs static map (macOS)
  ansible.builtin.command: /usr/sbin/automount -c
  become: true
  when: os_family == "darwin"
  changed_when: false

- name: Mount NFS share (Linux)
  when: os_family == "linux" and not (cluster_share_on_nas | bool)
  ansible.posix.mount:
    path: "{{ shared_mount }}"
    src: "{{ nfs_client_src }}"
    fstype: nfs
    opts: "{{ nfs_client_opts_linux }}"
    state: mounted
  become: true

# Cutover on Linux writes fstab only (keyed on the path, so the old server's
# line is replaced, not duplicated). A node still holding the old share,
# often with processes stuck in D state on it, clears it only by the reboot
# Phase 3 step 7 schedules; until then the canary below is skipped, since a
# stat would hang on that mount. A node with nothing mounted there starts
# the automount now. findmnt reads the mount table and never touches the
# share.
- name: Point fstab at the NAS (Linux, cutover)
  when: os_family == "linux" and cluster_share_on_nas | bool
  ansible.posix.mount:
    path: "{{ shared_mount }}"
    src: "{{ nfs_client_src }}"
    fstype: nfs
    opts: "{{ nfs_client_opts_linux }}"
    state: present
  become: true

- name: List mounts at shared_mount (Linux, cutover)
  when: os_family == "linux" and cluster_share_on_nas | bool
  ansible.builtin.command: findmnt -n -l -o SOURCE,FSTYPE --mountpoint {{ shared_mount }}
  register: nfs_client_linux_mounts
  changed_when: false
  failed_when: nfs_client_linux_mounts.rc not in [0, 1]
  check_mode: false

- name: Decide whether the old share still holds the mount point (Linux, cutover)
  when: os_family == "linux" and cluster_share_on_nas | bool
  ansible.builtin.set_fact:
    nfs_client_reboot_pending: >-
      {{ nfs_client_linux_mounts.stdout_lines
         | map('split')
         | selectattr('1', 'match', 'nfs')
         | map('first')
         | reject('equalto', nfs_client_src)
         | list | length > 0 }}

- name: Name the share's automount unit (Linux, cutover)
  when:
    - os_family == "linux" and cluster_share_on_nas | bool
    - not (nfs_client_reboot_pending | bool)
  ansible.builtin.command: systemd-escape -p --suffix=automount {{ shared_mount }}
  register: nfs_client_automount_unit
  changed_when: false
  check_mode: false

- name: Start the share's automount (Linux, cutover)
  when:
    - os_family == "linux" and cluster_share_on_nas | bool
    - not (nfs_client_reboot_pending | bool)
  ansible.builtin.systemd:
    name: "{{ nfs_client_automount_unit.stdout }}"
    state: started
    daemon_reload: true
  become: true

- name: Report the reboot the cutover still needs (Linux)
  when:
    - os_family == "linux" and cluster_share_on_nas | bool
    - nfs_client_reboot_pending | bool
  ansible.builtin.debug:
    msg: >-
      fstab now mounts {{ nfs_client_src }} at {{ shared_mount }}, but the old
      share is still mounted there. Reboot this node to finish the cutover
      (cluster-fileserver-move Phase 3 step 7).

- name: Verify NFS canary
  when: not (nfs_client_reboot_pending | default(false) | bool)
  ansible.builtin.stat:
    path: "{{ shared_mount }}/.nfs-canary"
  register: nfs_canary

- name: Fail if NFS not working
  ansible.builtin.fail:
    msg: "NFS canary file not found at {{ shared_mount }}/.nfs-canary — NFS mount may have failed"
  when:
    - not (nfs_client_reboot_pending | default(false) | bool)
    - not nfs_canary.stat.exists

# ── nfs-keepalive (Linux): hold the transport open against the server ──
# The NFS server's macOS 26.4 nfsd never FINs a client-closed transport; a
# Linux client that idle-drops (sunrpc ~5 min) ends up in FIN-WAIT-2 and the
# hard mount hangs every access in D-state (gr489397). A 60 s statfs keeps
# the transport busy under the idle timeout, so it never closes and the
# missing FIN never matters.
#
# The interim fix was a TRANSIENT systemd-run unit of the same name — every
# reboot cleared it, and a client re-wedged in exactly that gap (gr489397).
# Unit names collide, so stop (tolerating "not loaded") and reset-failed
# BEFORE the file-backed units land, else the loaded transient copy shadows
# them.
- name: Stop any transient nfs-keepalive units (Linux)
  ansible.builtin.command: systemctl stop nfs-keepalive.timer nfs-keepalive.service
  become: true
  when: os_family == "linux"
  register: nfs_keepalive_stop
  changed_when: false
  failed_when:
    - nfs_keepalive_stop.rc != 0
    - '"not loaded" not in nfs_keepalive_stop.stderr'

- name: Clear failed nfs-keepalive units (Linux)
  ansible.builtin.command: systemctl reset-failed nfs-keepalive.timer nfs-keepalive.service
  become: true
  when: os_family == "linux"
  register: nfs_keepalive_reset
  changed_when: false
  failed_when:
    - nfs_keepalive_reset.rc != 0
    - '"not loaded" not in nfs_keepalive_reset.stderr'

- name: Reload systemd after clearing transient nfs-keepalive (Linux)
  ansible.builtin.systemd:
    daemon_reload: true
  become: true
  when: os_family == "linux"

- name: Install nfs-keepalive service + timer (Linux)
  ansible.builtin.template:
    src: "nfs-keepalive.{{ item }}.j2"
    dest: "/etc/systemd/system/nfs-keepalive.{{ item }}"
    mode: "0644"
  loop: [service, timer]
  become: true
  when: os_family == "linux"

- name: Enable + start nfs-keepalive.timer (Linux)
  ansible.builtin.systemd:
    name: nfs-keepalive.timer
    enabled: true
    state: started
    daemon_reload: true
  become: true
  when: os_family == "linux"

- name: Symlink legacy shared_mount path (macOS)
  ansible.builtin.include_tasks: "{{ role_path }}/../../tasks/legacy_mount_symlink.yml"
  vars:
    legacy_path: /opt/shared
    canonical_path: "{{ shared_mount }}"
  # legacy != canonical: with a stale overlay (shared_mount still the legacy
  # path) the transition task would unmount the live share and self-symlink.
  when: os_family == "darwin" and legacy_path != canonical_path

- name: Symlink legacy shared_mount path (Linux)
  ansible.builtin.include_tasks: "{{ role_path }}/../../tasks/legacy_mount_symlink.yml"
  vars:
    legacy_path: /shared
    canonical_path: "{{ shared_mount }}"
  when: os_family == "linux" and legacy_path != canonical_path
