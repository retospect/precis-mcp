---
# NFS client mount on all non-server nodes, at the uniform /mnt/cluster
# role-named path (shared_mount — cluster-mount-namespace spec, gr194012).
# Mount options:
#   hard    — retry indefinitely if server goes down (default, but explicit)
#   intr    — allow interrupt on hung operations
#   nosuid  — ignore setuid/setgid bits from remote content
#   nodev   — ignore device files from remote content
#   noatime — hot share, skip access-time updates
#   _netdev (Linux) — wait for network before mounting at boot

- name: Provision /mnt namespace root (macOS sealed root)
  ansible.builtin.include_tasks: "{{ role_path }}/../../tasks/darwin_synthetic_mnt.yml"
  when: os_family == "darwin" and shared_mount is match('^/mnt(/|$)')

- name: Ensure mount point exists
  ansible.builtin.file:
    path: "{{ shared_mount }}"
    state: directory
    mode: "0755"
  become: true

# macOS mount(8) does not consult /etc/fstab, so ansible.posix.mount's
# state=mounted fails there ("unknown special file or file system"). Static
# NFS mounts on darwin go through autofs: an fstab entry picked up by the
# default `/-  -static` auto_master map, applied with `automount -c` — the
# same idiom autofs_client uses for the NAS, and how /opt/shared was always
# actually mounted. Keyed on the src, so a shared_mount change rewrites the
# old entry instead of leaving a second, stale static mount.
- name: Add shared NFS entry to /etc/fstab (macOS)
  when: os_family == "darwin"
  ansible.builtin.lineinfile:
    path: /etc/fstab
    regexp: "^{{ hostvars[nfs_server]['lan_ip'] }}:{{ nfs_export_path }}/shared "
    line: "{{ hostvars[nfs_server]['lan_ip'] }}:{{ nfs_export_path }}/shared {{ shared_mount }} nfs hard,intr,nosuid,nodev,noatime 0 0"
    state: present
    create: true
    mode: "0644"
  become: true

- name: Apply autofs static map (macOS)
  ansible.builtin.command: /usr/sbin/automount -c
  become: true
  when: os_family == "darwin"
  changed_when: false

- name: Mount NFS share (Linux)
  when: os_family == "linux"
  ansible.posix.mount:
    path: "{{ shared_mount }}"
    src: "{{ hostvars[nfs_server]['lan_ip'] }}:{{ nfs_export_path }}/shared"
    fstype: nfs
    opts: hard,intr,nosuid,nodev,noatime,_netdev
    state: mounted
  become: true

- name: Verify NFS canary
  ansible.builtin.stat:
    path: "{{ shared_mount }}/.nfs-canary"
  register: nfs_canary

- name: Fail if NFS not working
  ansible.builtin.fail:
    msg: "NFS canary file not found at {{ shared_mount }}/.nfs-canary — NFS mount may have failed"
  when: not nfs_canary.stat.exists

- name: Symlink legacy shared_mount path (macOS)
  ansible.builtin.include_tasks: "{{ role_path }}/../../tasks/legacy_mount_symlink.yml"
  vars:
    legacy_path: /opt/shared
    canonical_path: "{{ shared_mount }}"
  # legacy != canonical: with a stale overlay (shared_mount still the legacy
  # path) the transition task would unmount the live share and self-symlink.
  when: os_family == "darwin" and legacy_path != canonical_path

- name: Symlink legacy shared_mount path (Linux)
  ansible.builtin.include_tasks: "{{ role_path }}/../../tasks/legacy_mount_symlink.yml"
  vars:
    legacy_path: /shared
    canonical_path: "{{ shared_mount }}"
  when: os_family == "linux" and legacy_path != canonical_path
