---
# node_exporter textfile collector (macOS, brew): drop-in *.prom files here
# are served on :9100. node_exporter runs as root, so the directory must be
# world-readable and writable by the producing user.
node_exporter_textfile_dir: /opt/homebrew/var/node_exporter/textfile
node_exporter_args_file: /opt/homebrew/etc/node_exporter.args

# colima Docker-VM disk metric. The VM's /var/lib/docker is a separate disk
# INSIDE the VM, invisible to host node_exporter (it hit 98% and ENOSPC'd every
# gate container). Installed only on a macOS host where this user owns a colima
# VM (the colima binary and ~user/.colima/<profile> both exist), so the role
# stays a no-op on nodes without one.
node_exporter_colima_disk_enabled: true
# User that owns the VM (colima is per-user) and which profile to probe.
node_exporter_colima_user: reto
node_exporter_colima_profile: default
node_exporter_colima_bin: /opt/homebrew/bin/colima
node_exporter_colima_timeout_s: 20

# Linux: Ubuntu's packaged mount-points-exclude hides /mnt, and /mnt/cluster
# is the NFS mount the NFSMount* rules watch — under the packaged default
# NFSMountAbsent fires on every Linux host and NFSMountHung /
# NFSMountFullOrEmpty can never fire (gr465126). The rendered list is the
# packaged default minus `mnt`.
node_exporter_fs_mount_exclude: "^/(dev|proc|run|sys|media|var/lib/docker/.+)($|/)"
# Extra flags joined into ARGS in /etc/default/prometheus-node-exporter ahead
# of the mount-points-exclude flag. Host-specific args belong here: they are
# appended, never replaced.
node_exporter_extra_args: []
