---
# precis_web — FastAPI tab UI for the corpus (ADR 0026).
# Runs on the gateway alongside asa-bot / dream / worker-agent.
# Exposed over the tailnet via ``tailscale serve --https=443``.

# uv binary path — same conditional shape the mcps role uses
# (role-local, not a global). Set here so we don't depend on a
# role earlier in the play setting it for us.
- name: Resolve uv binary path
  ansible.builtin.set_fact:
    uv_bin: "{{ '/opt/homebrew/bin/uv' if os_family == 'darwin' else '/root/.local/bin/uv' }}"

- name: Install precis-mcp[web,pcb] into shared MCP venv
  # Gated on the redeploy pre-flight (`precis_deploy_changed`, step 0b) so a
  # same-sha redeploy skips the uv resolve; undefined → install (fail-safe for
  # a standalone 38/14 run). `-e precis_force_install=true` overrides.
  # `--refresh-package precis-mcp` is dropped when the ref is a frozen 40-char
  # sha (redeploy step 0 pins every deploy) — uv's cached checkout/build of an
  # immutable sha is exactly right; the flag only earns its cost on a moving
  # branch ref (see precis_worker/tasks/provision.yml for the full rationale).
  when:
    - os_family == "darwin"
    - >-
      (precis_deploy_changed | default(true) | bool)
      or (precis_force_install | default(false) | bool)
  vars:
    _precis_web_ref_is_sha: "{{ (precis_web_git_ref | default('main')) is match('^[0-9a-f]{40}$') }}"
  # NOTE: docx (python-docx + latex2mathml), mermaid (mermaidx) and calc
  # (sympy + pint) are core deps now, not extras — the shared venv gets the
  # .docx OMML-math export route, /mermaid render/validate, and local
  # get(kind='calc') automatically. See pyproject's "Deterministic, pure-
  # code, no-API tool deps" note.
  #
  # The ``pcb`` extra (easyeda2kicad) backs the kind='pcb' Flow-B footprint
  # conversion (ADR 0042 §5) — the shared venv runs both precis-web and the
  # agent worker that drive PCB export/route. The Freerouting jar it routes
  # with is installed separately by the precis_eda role.
  #
  # The web/news fetch deps (trafilatura + feedparser + wolframalpha +
  # youtube-transcript-api + httpx) are core since the 2026-08-16 extras
  # promotion — the former ``external`` extra (whose absence broke the
  # dream cycle's web fetch, gr48611) is gone; every venv carries them.
  ansible.builtin.shell: |
    {{ uv_bin }} pip install --python {{ precis_web_venv }}/bin/python --upgrade \
      {{ '' if _precis_web_ref_is_sha | bool else '--refresh-package precis-mcp' }} \
      --constraints /opt/precis/constraints.txt \
      'precis-mcp[web,pcb] @ git+https://github.com/retospect/precis-mcp@{{ precis_web_git_ref }}'
  become: true
  register: precis_web_install
  # uv prints its "Installed/Updated N package(s)" summary to STDERR, so
  # a stdout-only match never fires on a real code-only refresh — the
  # files land on disk but `notify: restart precis-web` is skipped and
  # the daemon keeps serving stale code. Check both streams (cf. the
  # llamacpp role, which already does).
  changed_when: >-
    'Installed' in (precis_web_install.stdout + precis_web_install.stderr)
    or 'Updated' in (precis_web_install.stdout + precis_web_install.stderr)
  # Without this notify the daemon keeps running the *old* venv
  # contents — Jinja env, runtime, filters all cached in the live
  # process. After a code bump that registers a new filter (e.g.
  # linkify_refs) but doesn't change the plist, deploys would land
  # new files on disk while the live process kept rendering with
  # the old environment, producing 500s like "No filter named X".
  # Mirrors the precis_worker / precis_worker_agent roles, which
  # have always notified their reload handler on install changes.
  notify: restart precis-web

# autocatpath `pathway` kind surface (topology: autocatpath_plugin). The plugin
# glue + migration ship in-tree with precis-mcp (src/precis_pathway, ADR 0069);
# the `[catalyst]` extra pulls the LIGHT pure `autocatpath` engine (no ML backend
# — the gateway mints jobs, it doesn't compute) so `precis_pathway`'s handler
# imports and the `pathway` kind un-darks (else it InitErrors). Must run BEFORE
# the migrate task so the pure engine is present when the plugin migration
# (shipped via precis-mcp's own precis.migrations entry-point) creates the kind.
# The plist enables it + routes compute to the pinned node (see the template).
#
# Gated on the same step-0b preflight as the main install above: on a same-sha
# redeploy `--refresh-package autocatpath` re-installs the (unchanged) engine
# from cache, the changed_when fires on uv's "Installed" line, and the notify
# needlessly bounces com.precis.web — the single biggest line of a no-op deploy
# (10.9s + a live-service blip, measured 2026-08-16). Safe to gate: the
# autocatpath pin lives in uv.lock → the constraints file, so a pin bump always
# rides a new commit → new sha → preflight DIFF → this runs. Out-of-band engine
# work targets the inference-node GPU venv (playbook 44), not this venv.
# `-e precis_force_install=true` overrides.
# autocatpath's floor is >=0.18.0, not on PyPI yet (release-gated; PyPI tops
# out at 0.13.0) — land the controller-side private wheel into this host's
# wheelhouse BEFORE the install below so its --find-links can resolve it.
# See roles/autocatpath/tasks/wheelhouse_seed.yml.
- name: Seed the autocatpath wheelhouse before the catalyst install (autocatpath_plugin hosts only)
  when:
    - os_family == "darwin"
    - inventory_hostname in (precis_capabilities.autocatpath_plugin | default([]))
  ansible.builtin.include_role:
    name: autocatpath
    tasks_from: wheelhouse_seed

- name: Install precis-mcp[catalyst] into the MCP venv (pathway kind surface — pulls pure autocatpath)
  when:
    - os_family == "darwin"
    - inventory_hostname in (precis_capabilities.autocatpath_plugin | default([]))
    - >-
      (precis_deploy_changed | default(true) | bool)
      or (precis_force_install | default(false) | bool)
  ansible.builtin.shell: |
    {{ uv_bin }} pip install --python {{ precis_web_venv }}/bin/python --upgrade \
      --refresh-package autocatpath \
      --constraints /opt/precis/constraints.txt \
      --find-links {{ autocatpath_wheelhouse | default('/opt/precis/wheels') }} \
      'precis-mcp[catalyst] @ git+https://github.com/retospect/precis-mcp@{{ precis_web_git_ref }}'
  become: true
  register: precis_web_autocatpath
  changed_when: >-
    'Installed' in (precis_web_autocatpath.stdout + precis_web_autocatpath.stderr)
    or 'Updated' in (precis_web_autocatpath.stdout + precis_web_autocatpath.stderr)
  notify: restart precis-web

# TeX toolchain for the draft → PDF export. The sync ``GET
# /drafts/<id>/pdf`` route and the ``draft_export`` job both shell
# ``latexmk`` (+ biber / makeglossaries) over the draft's LaTeX
# project, whose preamble pulls biblatex+biber, glossaries-extra,
# cleveref, siunitx, listings — a full TeX Live, not a minimal one.
# ``mactex-no-gui`` is the headless cask (no GUI apps); it installs
# every package the preamble needs and symlinks the binaries into
# ``/Library/TeX/texbin`` (added to the daemon PATH in the plist).
# Homebrew runs as the connecting (deploy) user — never root — so
# ``become: false`` (cf. ssh_tunnels/redis). Idempotent: a no-op once
# present; the ~4 GB download only happens on the first converge.
- name: Install MacTeX (no GUI) for draft PDF export
  when: os_family == "darwin"
  community.general.homebrew_cask:
    name: mactex-no-gui
    state: present
  become: false

# Apply pending forward-only DB migrations before the daemon comes up
# on the new code. Without this the deploy ships routes/queries that
# reference tables a migration was supposed to create, and the live
# service 500s with UndefinedTable (e.g. 0027_clusterize / the
# /clusters grid, 2026-06). The gateway is a single host and reaches
# the DB over the same pgbouncer DSN the daemon uses; migrations are
# forward-only and idempotent (each is BEGIN/COMMIT, IF NOT EXISTS),
# so running this every deploy is safe and a no-op once caught up.
# Runs unconditionally — not gated on the install changing — so a
# previously-shipped-but-unmigrated DB (exactly the 0027 case) still
# gets caught up on the next deploy. The Migrator opens its own
# autocommit connection per migration with no session-level advisory
# locks, so it is safe through pgbouncer transaction pooling.
- name: Apply pending precis DB migrations
  when: os_family == "darwin"
  ansible.builtin.command:
    # `--dry-run` (set -e precis_migrate_dry_run=true) reports pending
    # migrations without applying — handy to preview a deploy.
    argv: "{{ ['' ~ precis_web_venv ~ '/bin/precis', 'migrate'] + (['--dry-run'] if precis_migrate_dry_run | bool else []) }}"
  # §L: the DSN is password-free — libpq needs ~deploy/.pgpass, so this must
  # run as deploy with HOME set (root has no pgpass; fe_sendauth otherwise).
  environment:
    PRECIS_DATABASE_URL: "{{ precis_web_dsn }}"
    HOME: "{{ '/Users/deploy' if os_family == 'darwin' else '/home/deploy' }}"
  become: true
  become_user: deploy
  register: precis_web_migrate
  changed_when: "'migrate: applied' in precis_web_migrate.stdout"
  tags: [precis-migrate]

- name: Ensure /var/log/precis-web.log writable by daemon user
  when: os_family == "darwin"
  ansible.builtin.file:
    path: /var/log/precis-web.log
    state: touch
    # Mode + owner must let the daemon's UserName write to stdout/stderr.
    # Same trap that bit precis_worker_agent — root:wheel 0644 makes
    # the daemon exit 78 (EX_CONFIG) before logging anything.
    mode: "0664"
    owner: deploy
    group: staff
    modification_time: preserve
    access_time: preserve
  become: true

- name: Ensure the private podcast feed dir (episodes live here)
  ansible.builtin.file:
    path: "{{ precis_web_podcast_dir }}"
    state: directory
    # The web daemon (deploy) reads it; producers (a TTS pass, the CLI)
    # write it. deploy-owned, group-readable.
    owner: deploy
    group: staff
    mode: "0755"
  become: true

- name: Ensure precis-web LaunchDaemon plist
  when: os_family == "darwin"
  ansible.builtin.template:
    src: precis-web.plist.j2
    dest: /Library/LaunchDaemons/com.precis.web.plist
    mode: "0644"
    owner: root
    group: wheel
  become: true
  notify: restart precis-web

- name: Load precis-web LaunchDaemon
  when: os_family == "darwin"
  ansible.builtin.command: >
    launchctl load -w /Library/LaunchDaemons/com.precis.web.plist
  become: true
  changed_when: false
  failed_when: false

- name: Expose precis-web over Tailscale (serve = tailnet, funnel = public)
  when: os_family == "darwin"
  # ``--bg`` writes config that persists across reboots. Re-running with
  # the same target is idempotent; Tailscale treats it as "set this
  # mapping" rather than "spawn another listener." ``changed_when:
  # false`` because the output is "serving" on the first run and every
  # one after.
  #
  # The verb has to be chosen, not hardcoded: ``serve`` on a port that is
  # currently funnelled REVERTS it to tailnet-only. This task used to run
  # ``serve`` unconditionally, so a funnel enabled by hand was silently
  # un-published by the next redeploy — and with ``failed_when: false``,
  # without a line in the play recap.
  #
  # Bounded with async/poll because the failure mode here is a *hang*,
  # not an error: when the node lacks the ``funnel`` nodeAttr the CLI
  # prints an enablement URL and blocks waiting for someone to click it.
  ansible.builtin.shell: |
    tailscale {{ 'funnel' if precis_web_funnel | bool else 'serve' }} \
      --bg --yes --https=443 http://127.0.0.1:{{ precis_web_port }}
  become: true
  async: 60
  poll: 5
  changed_when: false
  failed_when: false
  tags: [tailscale]

- name: Verify the Tailscale exposure matches precis_web_funnel
  when: os_family == "darwin"
  # Assert the end state rather than trusting the command above, which
  # keeps failed_when: false so a transient CLI hiccup doesn't abort a
  # deploy. "(tailnet only)" in the status output means this host is NOT
  # published publicly — so that substring must be present exactly when
  # precis_web_funnel is false. Equality of the two booleans is the
  # mismatch: same value => intent and reality disagree.
  ansible.builtin.command: tailscale funnel status
  become: true
  register: _precis_web_ts_status
  changed_when: false
  failed_when: >-
    (precis_web_funnel | bool)
    == ('(tailnet only)' in _precis_web_ts_status.stdout)
  tags: [tailscale]
