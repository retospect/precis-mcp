---
# Persistent daemon: reload via the shared safe launchd task (retry the
# transient load failure + assert the daemon has a pid before succeeding).
# gripe #48490 — previously a bare `load -wF` with no retry/assert, the
# exact gr48481 hazard that can leave the service down on a green deploy.
# ONE-restart deploy (spine slice 2): under redeploy-precis.yml the step-2
# bounce play reloads every com.precis.* daemon on the gateway (bootout+
# bootstrap), so this install-notify handler skips there — see the
# precis_worker handlers for the full `precis_deploy_changed` rationale.
- name: restart precis-web
  ansible.builtin.include_tasks: "{{ role_path }}/../../tasks/reload_launchd.yml"
  vars:
    reload_unit: com.precis.web
    reload_persistent: true
  when: >-
    os_family == "darwin"
    and (precis_deploy_changed is not defined
         or not (precis_deploy_changed | bool))

# The public MCP restarts HERE on every deploy, not in the step-2 bounce
# play (which excludes its plist): its install watchdog is off, so this is
# its one restart, taken once both venv installs have finished and the plist
# is rendered (public-mcp.yml flushes handlers). Waiting for the bounce would
# leave it serving a swapped venv through the drain wait (gr338977, gr660587).
- name: restart precis-mcp-public
  ansible.builtin.include_tasks: "{{ role_path }}/../../tasks/reload_launchd.yml"
  vars:
    reload_unit: com.precis.mcp-public
    reload_persistent: true
  when:
    - os_family == "darwin"
    - precis_mcp_public_enabled | default(false) | bool
