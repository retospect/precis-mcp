---
# precis_embedder — runs `precis serve-embeddings` as a daemon on every
# cluster node, on loopback. The precis_worker daemon on the same node
# embeds against it via PRECIS_EMBEDDER=remote. See ADR 0020/0021.
#
# Mirrors precis_worker's provisioning (uv + python.org python@3.12 on
# macOS) but installs the [embed] extra into a dedicated venv and runs
# the HTTP service instead of the queue worker.

# torch (via sentence-transformers) has no Python 3.14 wheels yet and the
# src build fails on the macOS 26 toolchain — pin to 3.12, same as the
# worker / watch roles.
- name: Ensure uv is installed (macOS)
  when: os_family == "darwin"
  community.general.homebrew:
    name: uv
    state: present
  become: false

- name: Resolve venv python interpreter (macOS — python.org python3.12)
  ansible.builtin.set_fact:
    precis_embedder_python: /Library/Frameworks/Python.framework/Versions/3.12/bin/python3.12
  when: os_family == "darwin"

- name: Resolve uv binary path
  ansible.builtin.set_fact:
    precis_embedder_uv_bin: "{{ '/opt/homebrew/bin/uv' if os_family == 'darwin' else '/root/.local/bin/uv' }}"

- name: Create venv parent dir
  ansible.builtin.file:
    path: /opt/precis
    state: directory
    mode: "0755"
  become: true

# TCC note: the venv python must be a *symlink* to python.org's framework
# python, not a copy — a symlink resolves to python.org's Developer-ID
# signature, which is what the Full Disk Access grant pins to (survives
# both Ansible re-runs AND a python upgrade within the series; no brew pin
# needed for this anymore). See roles/pythonorg.
#
# Detect whether the venv python resolves into the python.org framework
# (correct) or somewhere else (stale — brew-linked, copied, or a broken
# symlink chain; rebuild). `python3` in a venv is always a symlink (->
# python3.X) regardless of mode, so we must follow to the leaf.
- name: Detect precis embedder venv python mode (python.org symlink vs. stale)
  when: os_family == "darwin"
  ansible.builtin.shell: |
    set -u
    resolved=$(/usr/bin/readlink -f "{{ precis_embedder_venv }}/bin/python3" 2>/dev/null || true)
    case "$resolved" in
      "")                       echo missing ;;
      /Library/Frameworks/*)    echo ok ;;
      *)                        echo stale ;;    # brew-linked, copied, or broken — rebuild
    esac
  register: precis_embedder_venv_mode
  changed_when: false
  become: true

# `state: absent` on a nonexistent path is a no-op, so this also correctly
# handles a broken symlink chain (readlink resolves to "" -> mode=missing,
# but the venv DIR still exists on disk from a deleted brew keg) — that case
# needs the wipe too, since `creates:` on the venv-create task below would
# otherwise treat the existing-but-broken dir as "already built" and skip.
- name: Wipe precis embedder venv if not on python.org (force symlink rebuild)
  when:
    - os_family == "darwin"
    - precis_embedder_venv_mode.stdout | default('') | trim != "ok"
  ansible.builtin.file:
    path: "{{ precis_embedder_venv }}"
    state: absent
  become: true

- name: Create precis embedder venv (macOS — symlink to python.org python3.12)
  when: os_family == "darwin"
  ansible.builtin.command:
    cmd: "{{ precis_embedder_python }} -m venv --symlinks {{ precis_embedder_venv }}"
    creates: "{{ precis_embedder_venv }}/bin/python3"
  become: true

- name: Create precis embedder venv (Linux — uv)
  when: os_family == "linux"
  ansible.builtin.command:
    cmd: "{{ precis_embedder_uv_bin }} venv {{ precis_embedder_venv }}"
    creates: "{{ precis_embedder_venv }}/bin/python"
  become: true

- name: Install precis-mcp[embed] into embedder venv
  # [embed] = sentence-transformers + torch (the served model). Installed
  # from git so the wire schema + served model track the same ref as the
  # workers that call this service. A push to the ref redeploys on the
  # next ansible run.
  #
  # ``--refresh-package precis-mcp`` forces uv to ignore its cached
  # resolution of the branch — without it, a fresh push wouldn't
  # actually pull the new SHA until someone cleared the uv cache. Only
  # needed for a MOVING ref: dropped when the ref is already a frozen
  # 40-char sha (redeploy-precis.yml step 0 pins every deploy), where
  # uv's cache is exactly right (see precis_worker/tasks/provision.yml).
  #
  # Skipped when the step-0b pre-flight proved nothing moves on this
  # host (`precis_deploy_changed` false); undefined → install
  # (fail-safe). `-e precis_force_install=true` overrides, and
  # `precis_embedder_trace` also forces it — the gr172390 trace tasks
  # below report this task's rc/stdout, which a skip wouldn't have.
  vars:
    _precis_embedder_ref_is_sha: "{{ (precis_embedder_git_ref | default('main')) is match('^[0-9a-f]{40}$') }}"
  when: >-
    (precis_deploy_changed | default(true) | bool)
    or (precis_force_install | default(false) | bool)
    or (precis_embedder_trace | default(false) | bool)
  ansible.builtin.shell: |
    {{ precis_embedder_uv_bin }} pip install {{ '-v' if (precis_embedder_trace | default(false) | bool) else '' }} --python {{ precis_embedder_venv }}/bin/python --upgrade \
      {{ '' if _precis_embedder_ref_is_sha | bool else '--refresh-package precis-mcp' }} \
      --constraints /opt/precis/constraints.txt \
      'precis-mcp[embed] @ git+https://github.com/retospect/precis-mcp@{{ precis_embedder_git_ref }}'
  become: true
  register: precis_embedder_install
  # A git+https resolve/build can hiccup transiently (network, a slow
  # github fetch, a torch wheel download) on one host per run — retry so a
  # blip doesn't fail the whole redeploy (each host is independent; a real
  # persistent failure still surfaces after the retries).
  retries: 3
  delay: 10
  until: precis_embedder_install.rc == 0
  # uv prints its "Installed/Updated N package(s)" summary to STDERR, so
  # a stdout-only match misses a real code-only refresh and the reload
  # handler is skipped — the daemon keeps running stale in-memory code.
  # Check both streams (cf. the llamacpp role, which already does).
  changed_when: >-
    'Installed' in (precis_embedder_install.stdout + precis_embedder_install.stderr)
    or 'Updated' in (precis_embedder_install.stdout + precis_embedder_install.stderr)

# ── In-situ deploy trace (gr172390) — opt-in, dormant by default ──
# The embedder-venv assert fails "DID NOT CONVERGE" on the FIRST pass of every
# real redeploy, then self-heals on an immediate re-run. uv is exonerated
# (7 hypotheses eliminated in isolation — it lands a same-version/different-
# commit sha in one shot); the surviving lead is an ansible orchestration/
# timing artifact that ONLY manifests in the full multi-play sequence and so
# cannot be reproduced by an isolated probe. Capturing it needs the real pass.
# Run one deploy with `-e precis_embedder_trace=true` (the flag also flips the
# uv install above to `-v`) and read these two tasks' output: the ref this host
# actually received on pass 1 vs the frozen target, the install rc/changed/
# attempt-count, and the commit_id uv actually left in direct_url.json. Off by
# default → zero cost + zero noise on normal deploys; delete once root-caused.
- name: TRACE — embedder install ref + result (gr172390)
  when: precis_embedder_trace | default(false) | bool
  ansible.builtin.debug:
    msg:
      - "received precis_embedder_git_ref = {{ precis_embedder_git_ref }}"
      - "install rc={{ precis_embedder_install.rc }} changed={{ precis_embedder_install.changed }} attempts={{ precis_embedder_install.attempts | default('n/a') }}"
      - "stdout tail: {{ precis_embedder_install.stdout[-2000:] | default('') }}"
      - "stderr tail: {{ precis_embedder_install.stderr[-2000:] | default('') }}"

- name: TRACE — installed commit_id in direct_url.json (gr172390)
  when: precis_embedder_trace | default(false) | bool
  ansible.builtin.shell: |
    set -o pipefail
    f=$(ls {{ precis_embedder_venv }}/lib/python*/site-packages/precis_mcp-*.dist-info/direct_url.json 2>/dev/null | head -1)
    echo "direct_url path: ${f:-MISSING}"
    [ -n "$f" ] && cat "$f" || true
  become: true
  register: precis_embedder_trace_durl
  changed_when: false
  failed_when: false

- name: TRACE — show installed commit_id (gr172390)
  when: precis_embedder_trace | default(false) | bool
  ansible.builtin.debug:
    var: precis_embedder_trace_durl.stdout

- name: Ensure HF model cache dir
  ansible.builtin.file:
    path: "{{ precis_embedder_hf_home }}"
    state: directory
    owner: deploy
    mode: "0755"
  become: true

# ── Offline-first load warm-up (embedder-wedge-hardening.md §1) ──
# The daemon env sets HF_HUB_OFFLINE=1 / TRANSFORMERS_OFFLINE=1 (below) so
# `precis serve-embeddings` startup NEVER dials HuggingFace Hub — the
# 2026-08-08→10 embedder-node wedge was exactly that dial hanging indefinitely
# against a slow/rate-limited hub, even with weights already cached
# (SentenceTransformer still does a HEAD/GET revision check unless told
# not to). That means the cache has to be pre-seeded HERE, while online,
# at deploy time — gated on cache absence so a warm host's redeploy is a
# no-op stat check, not a re-download. Runs as the `deploy` user (matches
# the HF cache dir's ownership above, and the daemon's own UserName) so
# the files it writes are readable/writable by the daemon later.
- name: Check whether the bge-m3 HF cache is already warm
  ansible.builtin.stat:
    path: "{{ precis_embedder_hf_home }}/hub/models--BAAI--bge-m3"
  register: precis_embedder_hf_cache_stat

- name: Warm the bge-m3 HF cache (online, deploy-time only)
  when: not precis_embedder_hf_cache_stat.stat.exists
  environment:
    HF_HOME: "{{ precis_embedder_hf_home }}"
  ansible.builtin.command:
    cmd: >-
      {{ precis_embedder_venv }}/bin/huggingface-cli download BAAI/bge-m3
      {{ '--revision ' ~ precis_embedder_hf_revision if precis_embedder_hf_revision else '' }}
  become: true
  become_user: deploy
  register: precis_embedder_hf_warm
  # A cold ~2.3 GB pull can hiccup on a slow/flaky link — retry so a
  # transient blip doesn't fail the whole redeploy (mirrors the
  # precis-mcp[embed] install task's retry policy above).
  retries: 3
  delay: 10
  until: precis_embedder_hf_warm.rc == 0
  changed_when: true

# launchd hits EX_CONFIG (78) when StandardOutPath can't be created.
# /var/log on modern macOS only allows root writes — pre-create with
# deploy ownership so the daemon can append.
- name: Pre-create precis-embedder log file (macOS)
  when: os_family == "darwin"
  ansible.builtin.file:
    path: /var/log/precis-embedder.log
    state: touch
    owner: deploy
    group: wheel
    mode: "0644"
  become: true
  changed_when: false

# ── macOS: LaunchDaemon ──
- name: Render precis-embedder LaunchDaemon (macOS)
  when: os_family == "darwin"
  ansible.builtin.template:
    src: precis-embedder.plist.j2
    dest: /Library/LaunchDaemons/com.precis.embedder.plist
    mode: "0644"
  become: true
  notify: reload precis embedder (macos)

# §L (gr176337): this used to be an unconditional raw bootout→bootstrap
# pair (the exact racy pattern gr176223 fixed everywhere else), firing on
# EVERY run regardless of whether the plist actually changed. The plist
# template task above already `notify`s "reload precis embedder (macos)" —
# which routes through the shared poll-until-gone `tasks/reload_launchd.yml`
# (see handlers/main.yml) — so the real reload-with-new-env only needs to
# happen there. This step is now just the idempotent "load if not already
# loaded" no-op, mirroring the fixed precis_worker pattern (gripe #48481).
- name: Load precis-embedder LaunchDaemon (macOS — idempotent)
  when: os_family == "darwin"
  ansible.builtin.command: >
    launchctl load -w /Library/LaunchDaemons/com.precis.embedder.plist
  become: true
  changed_when: false
  failed_when: false

# ── Linux: systemd ──
- name: Render precis-embedder systemd unit (Linux)
  when: os_family == "linux"
  ansible.builtin.template:
    src: precis-embedder.service.j2
    dest: /etc/systemd/system/precis-embedder.service
    mode: "0644"
  become: true
  notify: reload precis embedder (linux)

- name: Enable + start precis-embedder (Linux)
  when: os_family == "linux"
  ansible.builtin.systemd:
    name: precis-embedder
    daemon_reload: true
    enabled: true
    state: started
  become: true

# ── Verification ──
# Give a fresh service a moment to bind, then probe /healthz. We do NOT
# wait for /readyz — even with the HF cache pre-warmed above, loading the
# weights into MPS/CUDA and JIT-compiling kernels can take a while, and
# /healthz proves the listener is up and the deploy succeeded. The worker
# tolerates a warming embedder (retries with backoff), so readiness is
# not a deploy gate.
- name: Probe precis-embedder /healthz
  ansible.builtin.uri:
    url: "http://{{ precis_embedder_host }}:{{ precis_embedder_port }}/healthz"
    return_content: true
  register: precis_embedder_health
  # 20×3s ≈ 1 min: enough for the listener to bind after a restart without
  # waiting on the (minutes-long) model warm, which /readyz — not /healthz —
  # covers and which the worker tolerates.
  retries: 20
  delay: 3
  until: precis_embedder_health.status == 200
  changed_when: false
  failed_when: false
