---
# Agent CLIs (claude, codex, devin, kimi): one door to report and update
# them (gr543827). Driven by scripts/agent-cli-update; files/agent_cli.py
# does the work on the host. Not part of site.yml / redeploy: a normal
# deploy never touches these CLIs, only an explicit update run does.
#
# Pins: one known-good version per CLI. Set it in the overlay's group_vars
# or host_vars (one edit), then run `scripts/agent-cli-update --apply`.
# Rollback is restoring the previous pin and running it again. Empty =
# unpinned: reported, never updated.
# For pinnable npm CLIs, "latest" resolves the current npm version at run
# time, then installs and smoke-checks that version with rollback on failure.
agent_cli_pin_claude: ""
agent_cli_pin_codex: ""
agent_cli_pin_devin: ""
agent_cli_pin_kimi: ""

# Vendor minimums: a host below one raises an ALERT in the report. Empty =
# no minimum known.
agent_cli_min_claude: ""
agent_cli_min_codex: ""
agent_cli_min_devin: ""
agent_cli_min_kimi: ""

# report (read-only, the default) | update (install pins, smoke, roll back).
agent_cli_mode: report
# Comma-separated subset ("claude,kimi"); empty = all four.
agent_cli_only: ""
# Smoke = `--version` names the pin; with this on, also one headless prompt
# per CLI. The prompt needs the CLI logged in for the user ansible runs as
# (each host logs in through the vendor's own flow; no auth is copied).
agent_cli_smoke_prompt: true
# report: exit non-zero (fail the run) when any ALERT is raised.
agent_cli_strict: false

# The account the slice lanes (and so the CLIs) run as. The whole report /
# update runs as this user (become_user): detection looks in its home
# (~/.local/bin/devin, ~/.kimi-code/bin/kimi: where the worker resolves
# them), and installs, --version and smoke are its own. Without it the play's
# global become would run the script as root and miss every user-local CLI.
# builder_hosts members follow precis_builder_user (group_vars), so a builder
# host that runs its lanes as a dedicated user needs no second setting.
agent_cli_user: "{{ (precis_builder_user | default('deploy')) if inventory_hostname in (groups['builder_hosts'] | default([])) else 'deploy' }}"

# The agent-start launcher (~/.local/bin/agent-start) is for hosts where
# people start agent sessions. A builder host runs slices through its
# worker, not agent-start, so builder_hosts members skip it by default:
# no launcher row, no "set agent_cli_launcher_checkout" ALERT. Override
# per host/group to manage it there anyway.
agent_cli_launcher_managed: "{{ inventory_hostname not in (groups['builder_hosts'] | default([])) }}"

# Stable shipped primary checkout on the TARGET host, never a task worktree.
# Empty discovers it from existing ~/.local/bin/{kimi-wt,devin-wt,agent-start}
# symlinks. Conflicting or absent hints require this explicit inventory value.
# Update installs/repairs ~/.local/bin/agent-start; report is read-only.
# Ignored where agent_cli_launcher_managed is false.
agent_cli_launcher_checkout: ""

# Vendor installers. {version} is the pin. devin's own updater cannot pick a
# version, so it is not pinnable: it installs the latest, the smoke check
# fails when that is not the pin, and there is no automatic rollback.
# Optional keys (files/agent_cli.py pick_install): fresh_install runs when the
# CLI is absent (`devin update` cannot install from nothing); script_install
# is the vendor install.sh, used for kimi when node >= 22.19 is missing or the
# kimi found lives under script_dir; script_latest prints its latest version;
# fallback_bins are where the user's worker finds the CLI off PATH
# (~ = agent_cli_user's home).
agent_cli_installers:
  claude:
    bin: claude
    install: "npm install -g @anthropic-ai/claude-code@{version}"
    pinnable: true
    smoke: ["-p", "Reply with the single word OK."]
  codex:
    bin: codex
    install: "npm install -g @openai/codex@{version}"
    pinnable: true
    smoke: ["exec", "--skip-git-repo-check", "Reply with the single word OK."]
  devin:
    bin: devin
    install: "devin update"
    fresh_install: "curl -fsSL https://cli.devin.ai/install.sh | bash"
    fallback_bins: ["~/.local/bin/devin"]
    pinnable: false
    smoke: ["-p", "Reply with the single word OK."]
  kimi:
    bin: kimi
    install: "npm install -g @moonshot-ai/kimi-code@{version}"
    script_install: "curl -fsSL https://code.kimi.com/kimi-code/install.sh | KIMI_NO_MODIFY_PATH=1 bash -s -- --version {version}"
    script_latest: "curl -fsSL https://code.kimi.com/kimi-code/latest"
    script_dir: "~/.kimi-code"
    fallback_bins: ["~/.kimi-code/bin/kimi"]
    pinnable: true
    smoke: ["-p", "Reply with the single word OK."]
