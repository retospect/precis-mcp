---
# Report or update the agent CLIs on this host via files/agent_cli.py.
# Runs as the ansible user (the same account that installs claude today).

- name: Refuse an update run without --limit (never the whole fleet by accident)
  when: agent_cli_mode == 'update' and ansible_limit is not defined
  ansible.builtin.fail:
    msg: >-
      agent_cli_mode=update needs --limit <host-or-group>; use
      scripts/agent-cli-update --host <name> --apply.

- name: Build the agent CLI config
  ansible.builtin.set_fact:
    agent_cli_config:
      only: "{{ agent_cli_only.split(',') | map('trim') | select | list }}"
      smoke_prompt: "{{ agent_cli_smoke_prompt | bool }}"
      clis:
        claude: "{{ agent_cli_installers.claude | combine({'pin': agent_cli_pin_claude, 'min': agent_cli_min_claude}) }}"
        codex: "{{ agent_cli_installers.codex | combine({'pin': agent_cli_pin_codex, 'min': agent_cli_min_codex}) }}"
        devin: "{{ agent_cli_installers.devin | combine({'pin': agent_cli_pin_devin, 'min': agent_cli_min_devin}) }}"
        kimi: "{{ agent_cli_installers.kimi | combine({'pin': agent_cli_pin_kimi, 'min': agent_cli_min_kimi}) }}"

# check_mode false: a report is read-only and must still run under --check.
- name: "Agent CLIs: {{ agent_cli_mode }}"
  ansible.builtin.script:
    cmd: >-
      agent_cli.py {{ agent_cli_mode }}
      {{ '--strict' if (agent_cli_strict | bool) else '' }}
      --config-json {{ agent_cli_config | to_json | quote }}
    executable: python3
  register: agent_cli_out
  check_mode: false
  changed_when: >-
    agent_cli_mode == 'update' and
    (agent_cli_out.stdout | default('')) is search('· (updated|rolled-back)')
  failed_when: false

- name: Show the agent CLI report
  ansible.builtin.debug:
    msg: "{{ agent_cli_out.stdout_lines | default([]) | reject('match', 'AGENT_CLI_JSON') | list }}"

- name: Fail the run on a failed update or a strict-report alert
  when: agent_cli_out.rc != 0
  ansible.builtin.fail:
    msg: >-
      agent_cli {{ agent_cli_mode }} exited {{ agent_cli_out.rc }}:
      {{ agent_cli_out.stdout_lines | default([]) | select('match', 'ALERT') | list }}
      {{ agent_cli_out.stderr | default('') }}
