---
# PostgreSQL + pgvector on the data node
#
# macOS Homebrew: runs as deploy user, data in /opt/homebrew/var/postgresql@17
# Linux: runs as postgres user (standard package)

- name: Set postgres runtime user
  ansible.builtin.set_fact:
    pg_user: "{{ 'deploy' if os_family == 'darwin' else 'postgres' }}"
    pg_bin: "{{ '/opt/homebrew/opt/postgresql@17/bin' if os_family == 'darwin' else '/usr/bin' }}"
  tags: [roles]

- name: Install PostgreSQL (macOS via Homebrew)
  when: os_family == "darwin"
  community.general.homebrew:
    name:
      - postgresql@17
      - pgvector
    state: present
  become: false

- name: Ensure PostgreSQL data directory
  ansible.builtin.file:
    path: "{{ postgres_data_dir }}"
    state: directory
    owner: "{{ pg_user }}"
    mode: "0700"
  become: true

- name: Ensure conf.d directory exists
  ansible.builtin.file:
    path: "{{ postgres_data_dir }}/conf.d"
    state: directory
    owner: "{{ pg_user }}"
    mode: "0700"
  become: true

- name: Include conf.d in postgresql.conf
  ansible.builtin.lineinfile:
    path: "{{ postgres_data_dir }}/postgresql.conf"
    line: "include_dir = 'conf.d'"
    regexp: "^include_dir"
    state: present
  become: true
  become_user: "{{ pg_user }}"

- name: Deploy pg_hba.conf
  ansible.builtin.template:
    src: pg_hba.conf.j2
    dest: "{{ postgres_data_dir }}/pg_hba.conf"
    owner: "{{ pg_user }}"
    mode: "0600"
  become: true
  notify: restart postgresql

- name: Deploy postgresql.conf overrides
  ansible.builtin.template:
    src: postgresql.conf.j2
    dest: "{{ postgres_data_dir }}/conf.d/cluster.conf"
    owner: "{{ pg_user }}"
    mode: "0600"
  become: true
  notify: restart postgresql

- name: Deploy PostgreSQL guarded launcher (macOS)
  # Clears a stale postmaster.pid on unclean shutdown so a reused PID after a
  # reboot can't wedge Postgres off forever (2026-07-05 outage). The plist
  # ProgramArguments points here instead of at postgres directly.
  when: os_family == "darwin"
  ansible.builtin.template:
    src: pg-guarded-start.sh.j2
    dest: /opt/homebrew/etc/pg-guarded-start.sh
    mode: "0755"
    owner: root
    group: wheel
  become: true
  notify: restart postgresql

- name: Deploy PostgreSQL launchd plist (macOS)
  when: os_family == "darwin"
  ansible.builtin.template:
    src: postgresql.plist.j2
    dest: /Library/LaunchDaemons/com.postgresql.plist
    mode: "0644"
  become: true
  notify: restart postgresql

- name: Ensure PostgreSQL is loaded (macOS)
  when: os_family == "darwin"
  ansible.builtin.shell: |
    launchctl list | grep -q com.postgresql || launchctl load -w /Library/LaunchDaemons/com.postgresql.plist
  become: true
  changed_when: false
  failed_when: false

- name: Start PostgreSQL (Linux — systemd)
  when: os_family == "linux"
  ansible.builtin.systemd:
    name: postgresql
    enabled: true
    state: started
  become: true

- name: Apply pending config changes before DB operations
  ansible.builtin.meta: flush_handlers

# The community.postgresql.* modules below need psycopg2 importable by the
# interpreter Ansible runs them under. auto_silent resolves to Homebrew's
# default python3 (currently 3.14), which has no psycopg2 — and nothing else
# on the data node provides it. Provision a small dedicated venv (python3.12,
# which has psycopg2-binary wheels) and point the DB-management tasks at it.
# Dedicated so a uv --refresh of the precis venvs can never wipe it.
- name: Resolve uv binary path
  ansible.builtin.set_fact:
    pg_uv_bin: "{{ '/opt/homebrew/bin/uv' if os_family == 'darwin' else '/root/.local/bin/uv' }}"
  tags: [roles]

- name: Create postgres-admin venv (macOS — python3.12 for psycopg2-binary wheels)
  when: os_family == "darwin"
  ansible.builtin.command:
    cmd: /opt/homebrew/bin/python3.12 -m venv --symlinks /opt/postgres-admin-venv
    creates: /opt/postgres-admin-venv/bin/python
  become: true
  tags: [roles]

- name: Install psycopg2-binary into postgres-admin venv (macOS)
  when: os_family == "darwin"
  ansible.builtin.shell: |
    {{ pg_uv_bin }} pip install --python /opt/postgres-admin-venv/bin/python psycopg2-binary
  become: true
  register: pg_admin_deps
  changed_when: "'Installed' in pg_admin_deps.stdout"
  tags: [roles]

- name: Use psycopg2-equipped interpreter for DB-management modules (macOS)
  when: os_family == "darwin"
  ansible.builtin.set_fact:
    ansible_python_interpreter: /opt/postgres-admin-venv/bin/python
  tags: [roles]

- name: Wait for PostgreSQL to accept connections on the /tmp socket
  # The restart handler above (launchctl kickstart -k / systemctl restart)
  # returns BEFORE the postmaster has re-created its /tmp socket and begun
  # accepting connections. The DB-management tasks below connect over that
  # socket via peer auth, so without this gate they race the restart and
  # fail "connection refused" on /tmp/.s.PGSQL.<port>. That race — not a
  # socket-dir drift — is the recurring RED in gripe 160582 (the pin in
  # postgresql.conf.j2 makes the socket path deterministic; this makes the
  # play wait for it). pg_isready ships with the server at pg_bin.
  ansible.builtin.command: "{{ pg_bin }}/pg_isready -h /tmp -p {{ postgres_port }}"
  become: true
  become_user: "{{ pg_user }}"
  register: pg_ready
  until: pg_ready.rc == 0
  retries: 30
  delay: 2
  changed_when: false
  tags: [roles]

- name: Create precis_prod database
  community.postgresql.postgresql_db:
    name: precis_prod
    state: present
    login_user: "{{ pg_user }}"
    login_unix_socket: /tmp
  become: true
  become_user: "{{ pg_user }}"

# gr583810: a vault_pg_*_pass minted with a trailing newline or a colon
# breaks differently per consumer — the userlist stores "<pw>\n" while
# pgpass clients send "<pw>" (r241's FATAL auth as precis_system). Fail
# loudly HERE, before any host writes the value. Peer/trust roles carry
# no password_var and are skipped explicitly.
- name: Assert db-role vault passwords have no newline, colon or outer whitespace
  ansible.builtin.assert:
    that:
      - "_pw | length > 0"
      - "_pw == (_pw | trim)"
      - "':' not in _pw"
      - "'\\n' not in _pw"
      - "'\\r' not in _pw"
    fail_msg: "vault_{{ item.password_var }} has trailing whitespace or a colon — re-mint with tr -d '\\n'"
  vars:
    _pw: "{{ lookup('vars', 'vault_' + item.password_var, default='') }}"
  loop: "{{ postgres_roles }}"
  loop_control:
    label: "{{ 'vault_' ~ item.password_var if item.password_var is defined else item.name }}"
  when: item.password_var is defined
  no_log: true
  tags: [roles]

- name: Create database roles
  community.postgresql.postgresql_user:
    name: "{{ item.name }}"
    password: "{{ lookup('vars', 'vault_' + item.password_var) }}"
    role_attr_flags: LOGIN
    state: present
    db: postgres
    login_user: "{{ pg_user }}"
    login_unix_socket: /tmp
  become: true
  become_user: "{{ pg_user }}"
  loop: "{{ postgres_roles }}"
  loop_control:
    label: "{{ item.name }}"
  no_log: true
  tags: [roles]

# precis_prod's extensions (vector, …) and schema are owned and migrated by
# precis-mcp itself (see precis_web's "Apply pending precis DB migrations").
# The former "Create extensions / Create schemas / agent_ro USAGE" tasks here
# targeted the retired monolithic `cluster` database (now `openclaw`, slated
# for retirement) and its research/memory/jobs/schedule/sortie/papers schemas
# — none of which exist in precis_prod — so they were removed.

# precis_system (multi-user S1): the service-principal role — workers,
# `precis migrate`, agent launchers. Member of agent_rw so it inherits every
# app privilege; the extra authority it gets is the vault's `infra` class
# (migration 0285: the connection role IS the gate). NOLOGIN is fine at creation
# — postgres_roles in the overlay gives it LOGIN + password.
- name: Grant precis_system membership of agent_rw
  community.postgresql.postgresql_query:
    db: precis_prod
    query: |
      DO $$
      BEGIN
        IF EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'precis_system')
           AND EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'agent_rw') THEN
          EXECUTE 'GRANT agent_rw TO precis_system';
        END IF;
      END $$;
    autocommit: true
    login_user: "{{ pg_user }}"
    login_unix_socket: /tmp
  become: true
  become_user: "{{ pg_user }}"
  changed_when: false
  check_mode: false
  tags: [roles]

# db-own (Fable findings 1+3): precis_owner owns every object and is the owner
# DSN (DDL, `precis migrate`; never a daemon's login); precis_ingress is the
# web daemon. scripts/db-own-cutover creates both and moves ownership — a
# superuser step Reto runs once; postgres_roles in the overlay gives them
# LOGIN + password; this keeps precis_ingress's membership true on every
# play. Guarded: a no-op until the cutover has created the role.
- name: Grant precis_ingress membership of agent_rw
  community.postgresql.postgresql_query:
    db: precis_prod
    query: |
      DO $$
      BEGIN
        IF to_regrole('precis_ingress') IS NOT NULL
           AND to_regrole('agent_rw') IS NOT NULL THEN
          EXECUTE 'GRANT agent_rw TO precis_ingress';
        END IF;
      END $$;
    autocommit: true
    login_user: "{{ pg_user }}"
    login_unix_socket: /tmp
  become: true
  become_user: "{{ pg_user }}"
  changed_when: false
  check_mode: false
  tags: [roles]

# Before the db-own cutover agent_rw is the migrating role and needs CREATE on
# public; after it (precis_owner owns _migrations) agent_rw never creates —
# new objects come from migrations on the owner DSN, and no CREATE also
# closes search_path hijacks of precis_owner's SECURITY DEFINER functions.
# Keyed on DB state, so a play before or after the cutover does the right one.
- name: Schema public privileges for agent_rw (CREATE only before db-own)
  community.postgresql.postgresql_query:
    db: precis_prod
    query: |
      DO $$
      BEGIN
        IF to_regrole('agent_rw') IS NULL THEN
          RETURN;
        END IF;
        GRANT USAGE ON SCHEMA public TO agent_rw;
        IF EXISTS (SELECT 1 FROM pg_class
                    WHERE oid = to_regclass('public._migrations')
                      AND relowner = to_regrole('precis_owner')) THEN
          REVOKE CREATE ON SCHEMA public FROM agent_rw;
        ELSE
          GRANT CREATE ON SCHEMA public TO agent_rw;
        END IF;
      END $$;
    autocommit: true
    login_user: "{{ pg_user }}"
    login_unix_socket: /tmp
  become: true
  become_user: "{{ pg_user }}"
  changed_when: false
  check_mode: false

# pg_stat_statements: cluster-wide query performance history. The library is
# loaded via shared_preload_libraries (postgresql.conf.j2); the flush_handlers
# restart above applies that before this runs, so CREATE EXTENSION succeeds.
- name: Enable pg_stat_statements extension in precis_prod
  community.postgresql.postgresql_ext:
    name: pg_stat_statements
    db: precis_prod
    state: present
    login_user: "{{ pg_user }}"
    login_unix_socket: /tmp
  become: true
  become_user: "{{ pg_user }}"

# pgcrypto: the secrets vault (precis ADR 0055 / migration 0059) encrypts
# values with pgp_sym_encrypt. Provision the extension here as superuser so
# it's present before `precis migrate` runs (the migration's own
# CREATE EXTENSION degrades to a NOTICE when it lacks privilege).
- name: Enable pgcrypto extension in precis_prod
  community.postgresql.postgresql_ext:
    name: pgcrypto
    db: precis_prod
    state: present
    login_user: "{{ pg_user }}"
    login_unix_socket: /tmp
  become: true
  become_user: "{{ pg_user }}"

# Defensive per-role timeouts on the application roles (2026-07-30 DB review).
# statement_timeout / idle_in_transaction_session_timeout / lock_timeout are all
# 0 (disabled) cluster-wide, so a runaway agent-built query or a wedged
# transaction can run unbounded and pin locks. Scope conservative limits to the
# APPLICATION roles only (agent_rw = MCP + workers + web, agent_ro = read-only
# dogfood) via ALTER ROLE, so they attach to every pooled server connection at
# login — the only mechanism that survives pgbouncer *transaction* pooling (a
# session SET would leak across tenants). Superuser/deploy sessions keep 0, so
# manual ops / REINDEX / pg_dump stay unbounded. Migrations also connect as
# agent_rw but neutralise these per apply-transaction with SET LOCAL
# (store/migrate.py), so a long backfill or lock-waiting DDL is never aborted.
#   statement_timeout   120s — ~26x the slowest legitimate query (4.6s).
#   idle_in_transaction 300s — reclaim an abandoned/wedged transaction while
#                              tolerating slow app-side work between queries.
#   lock_timeout          5s — fail fast instead of queueing behind a lock.
# Run as the DB superuser (peer auth) so it can alter both roles — a migration
# can't (agent_rw is a plain LOGIN role with no CREATEROLE, so ALTER ROLE
# agent_ro from a migration would raise permission-denied). Role-existence
# guarded, so it no-ops on a cluster that hasn't provisioned the roles.
- name: Set defensive statement timeouts on the application roles
  community.postgresql.postgresql_query:
    db: precis_prod
    query: |
      DO $$
      BEGIN
        IF EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'agent_rw') THEN
          EXECUTE 'ALTER ROLE agent_rw SET statement_timeout = ''120s''';
          EXECUTE 'ALTER ROLE agent_rw SET idle_in_transaction_session_timeout = ''300s''';
          EXECUTE 'ALTER ROLE agent_rw SET lock_timeout = ''5s''';
        END IF;
        IF EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'agent_ro') THEN
          EXECUTE 'ALTER ROLE agent_ro SET statement_timeout = ''120s''';
          EXECUTE 'ALTER ROLE agent_ro SET idle_in_transaction_session_timeout = ''300s''';
          EXECUTE 'ALTER ROLE agent_ro SET lock_timeout = ''5s''';
        END IF;
        IF EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'precis_system') THEN
          EXECUTE 'ALTER ROLE precis_system SET statement_timeout = ''120s''';
          EXECUTE 'ALTER ROLE precis_system SET idle_in_transaction_session_timeout = ''300s''';
          EXECUTE 'ALTER ROLE precis_system SET lock_timeout = ''5s''';
        END IF;
        IF EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'precis_ingress') THEN
          EXECUTE 'ALTER ROLE precis_ingress SET statement_timeout = ''120s''';
          EXECUTE 'ALTER ROLE precis_ingress SET idle_in_transaction_session_timeout = ''300s''';
          EXECUTE 'ALTER ROLE precis_ingress SET lock_timeout = ''5s''';
        END IF;
        -- The owner DSN runs long DDL on purpose; only reclaim a wedged
        -- transaction (it would hold ACCESS EXCLUSIVE locks).
        IF EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'precis_owner') THEN
          EXECUTE 'ALTER ROLE precis_owner SET idle_in_transaction_session_timeout = ''300s''';
        END IF;
      END $$;
    autocommit: true
    login_user: "{{ pg_user }}"
    login_unix_socket: /tmp
  become: true
  become_user: "{{ pg_user }}"
  changed_when: false
  check_mode: false  # autocommit is incompatible with check mode
  tags: [roles]

# Secrets-vault passphrase (precis ADR 0055): the pgcrypto pgp_sym key that
# vault.reveal/set use. Since migration 0239 (gr505334) it lives in the
# single-row vault._key table — reachable only by the owning role — because
# a GUC can't be ACL'd: ALTER SYSTEM exposed it to every role through
# current_setting(), and ALTER ROLE … SET would still leak through the
# world-readable pg_db_role_setting catalog. This task therefore writes the
# row (as superuser; named_args keeps the value out of the SQL text) and
# removes the legacy GUC so the key stops being cluster config at all. The
# to_regclass probe keeps the play correct on a cluster that hasn't applied
# 0239 yet: no table → keep provisioning the old GUC as before. A restored
# DB has an empty vault._key (the backup excludes its data), and this task
# is what re-arms it. Skipped until vault_pg_app_secret_key is defined in
# inventory/group_vars/all/vault.yml.
- name: Check for the vault._key table (migration 0239)
  when: vault_pg_app_secret_key is defined and (vault_pg_app_secret_key | length > 0)
  community.postgresql.postgresql_query:
    db: precis_prod
    query: "SELECT to_regclass('vault._key') IS NOT NULL AS present"
    login_user: "{{ pg_user }}"
    login_unix_socket: /tmp
  become: true
  become_user: "{{ pg_user }}"
  changed_when: false
  register: vault_key_table

- name: Provision the secrets-vault passphrase into vault._key
  when: >
    vault_pg_app_secret_key is defined
    and (vault_pg_app_secret_key | length > 0)
    and vault_key_table.query_result[0].present
  community.postgresql.postgresql_query:
    db: precis_prod
    query: >-
      INSERT INTO vault._key (one, k) VALUES (true, %(key)s)
      ON CONFLICT (one) DO UPDATE SET k = EXCLUDED.k
    named_args:
      key: "{{ vault_pg_app_secret_key }}"
    login_user: "{{ pg_user }}"
    login_unix_socket: /tmp
  become: true
  become_user: "{{ pg_user }}"
  changed_when: false
  no_log: true

- name: Remove the legacy app.secret_key GUC (key now lives in vault._key)
  when: >
    vault_pg_app_secret_key is defined
    and (vault_pg_app_secret_key | length > 0)
    and vault_key_table.query_result[0].present
  community.postgresql.postgresql_query:
    db: precis_prod
    query: "ALTER SYSTEM RESET app.secret_key"
    autocommit: true
    login_user: "{{ pg_user }}"
    login_unix_socket: /tmp
  become: true
  become_user: "{{ pg_user }}"
  changed_when: false
  check_mode: false  # autocommit (required for ALTER SYSTEM) is incompatible with check mode

- name: Set secrets-vault app.secret_key (legacy GUC path, pre-0239 only)
  when: >
    vault_pg_app_secret_key is defined
    and (vault_pg_app_secret_key | length > 0)
    and not vault_key_table.query_result[0].present
  community.postgresql.postgresql_query:
    db: precis_prod
    query: "ALTER SYSTEM SET app.secret_key = '{{ vault_pg_app_secret_key }}'"
    autocommit: true
    login_user: "{{ pg_user }}"
    login_unix_socket: /tmp
  become: true
  become_user: "{{ pg_user }}"
  changed_when: false
  no_log: true
  check_mode: false  # autocommit (required for ALTER SYSTEM) is incompatible with check mode

- name: Reload PostgreSQL config to apply the vault key change
  when: vault_pg_app_secret_key is defined and (vault_pg_app_secret_key | length > 0)
  community.postgresql.postgresql_query:
    db: precis_prod
    query: "SELECT pg_reload_conf()"
    login_user: "{{ pg_user }}"
    login_unix_socket: /tmp
  become: true
  become_user: "{{ pg_user }}"
  changed_when: false

# pg_cron has been fully removed (library dropped from shared_preload_libraries
# in postgresql.conf.j2, formula dropped from the install list above, template
# deleted): the extension was never CREATEd in precis_prod, its jobs targeted
# the retired `cluster`/`openclaw` DB, and maintenance is covered by autovacuum
# + the in-app sweeper. The channel_prompts table likewise targeted the retired
# `cluster` DB (an empty asa_bot table now in `openclaw`); if asa_bot still needs
# it, re-provision against precis_prod in a later pass.
# Orphaned template still present: channel_prompts.sql.j2.
