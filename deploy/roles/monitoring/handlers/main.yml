---
- name: restart prometheus
  when: os_family == "darwin"
  ansible.builtin.command: /opt/homebrew/bin/brew services restart prometheus
  become: true

# Linux: SIGHUP-style reload would also work, but a restart is the sure way to
# pick up a changed `alerting:` block, and the scrape gap is one interval.
- name: restart prometheus
  when: os_family == "linux"
  ansible.builtin.systemd:
    name: prometheus
    state: restarted
  become: true

- name: restart grafana
  when: os_family == "darwin"
  ansible.builtin.command: /opt/homebrew/bin/brew services restart grafana
  become: true

- name: restart alertmanager
  ansible.builtin.systemd:
    name: prometheus-alertmanager
    state: restarted
  become: true

- name: restart alertmanager receiver
  ansible.builtin.systemd:
    name: precis-alertmanager-receiver
    daemon_reload: true
    state: restarted
  become: true
