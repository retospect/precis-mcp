---
# tts — make the tts_render node (topology.yml) render the audio feed via the
# `precis-tts` container. The precis-mcp worker (roles/precis_worker) runs the
# `briefing_audio`/`cast_audio` passes, which — when PRECIS_TTS_IMAGE is set —
# shell out to `docker run precis-tts` per episode, staging segments.json in a
# local scratch dir and reading back out.m4a. Kokoro + misaki live in the IMAGE;
# the models are baked in.
#
# OS split (2026-08-29, the GPU node retired from cluster duty): on Linux
# compute nodes the
# runtime is system docker and the env reaches the worker via a systemd
# drop-in EnvironmentFile; on the macOS gateway the runtime is deploy's colima
# docker (mirrors roles/remarkable) and the env is rendered straight into the
# collapsed worker's plist by 20b-precis-worker-collapsed.yml's `_l_b_tts_env`
# (launchd has no EnvironmentFile) — this role then wires only dirs + image.
# See roles/tts/README.md + precis-mcp/docker/tts/README.md.

- name: Ensure the container runtime is present
  ansible.builtin.command: "{{ tts_container_cmd }} --version"
  register: tts_runtime
  changed_when: false
  failed_when: tts_runtime.rc != 0
  become: true
  become_user: "{{ 'root' if os_family == 'linux' else tts_worker_user }}"

- name: Allow the worker user to run docker without sudo (docker group — Linux only)
  ansible.builtin.user:
    name: "{{ tts_worker_user }}"
    groups: docker
    append: true
  become: true
  when: os_family == "linux"
  notify: restart precis-worker (tts)

- name: Ensure the local scratch dir (container in/out staging)
  ansible.builtin.file:
    path: "{{ tts_scratch_dir }}"
    state: directory
    owner: "{{ tts_worker_user }}"
    group: "{{ tts_worker_user }}"
    mode: "0755"
  become: true

# Existence only — ownership policy on the shared podcast dir belongs to
# roles/precis_web (deploy:staff). Setting owner/group here made the two
# roles flip the group on every alternating run, and the web role's chgrp
# back then failed over NFS (seen 2026-08-29 on the gateway rehome).
- name: Ensure the podcast dir exists (episodes land here)
  ansible.builtin.file:
    path: "{{ tts_podcast_dir }}"
    state: directory
  become: true

# ── (re)build the precis-tts image on the node ────────────────────────
# On darwin every step runs as the worker user (colima socket owner) — root's
# docker CLI can't reach the per-user VM (mirrors roles/remarkable).
- name: (Re)build the precis-tts image
  when: tts_build_image | bool
  become: true
  become_user: "{{ 'root' if os_family == 'linux' else tts_worker_user }}"
  block:
    - name: Ensure the build context dir on the node
      ansible.builtin.file:
        path: "{{ tts_build_dir }}"
        state: directory
        mode: "0755"

    - name: Copy the precis-tts build context to the node
      # copy (not synchronize) rides ansible's own ssh — the controller's
      # ssh-agent is flaky and synchronize spawns a fresh rsync ssh that fails
      # agent auth. The context is two small files (Dockerfile + shim).
      ansible.builtin.copy:
        src: "{{ tts_src_dir }}/"
        dest: "{{ tts_build_dir }}/"
        mode: preserve

    - name: Derive the base image from the Dockerfile (pre-pull stays in sync)
      # The FROM line is the single source of truth. A hardcoded var here
      # drifted once (still 3.11 after the Dockerfile's 3.12 bump): the
      # pre-pull warmed the wrong image and the build died at step 1 on the
      # flaky tts-host→Docker Hub TLS handshake, retry-less.
      ansible.builtin.command:
        cmd: awk '/^FROM /{print $2; exit}' {{ tts_build_dir }}/Dockerfile
      register: tts_base_from
      changed_when: false
      failed_when: tts_base_from.stdout | trim | length == 0

    - name: Ensure the base image is present (pull only if missing — registry is flaky)
      ansible.builtin.shell: >-
        {{ tts_container_cmd }} image inspect {{ tts_base_from.stdout | trim }} >/dev/null 2>&1
        || {{ tts_container_cmd }} pull {{ tts_base_from.stdout | trim }}
      register: tts_basepull
      retries: 8
      delay: 15
      until: tts_basepull.rc == 0
      changed_when: "'Pull complete' in tts_basepull.stdout"

    - name: Build the precis-tts image
      # The build pip-installs precis-mcp@{{ tts_precis_ref }} + misaki and curls
      # the ~330 MB Kokoro models + warms the misaki dicts — a few minutes, needs
      # PyPI + GitHub reachable (separate infra from the flaky Docker Hub HEAD).
      ansible.builtin.command:
        cmd: >-
          {{ tts_container_cmd }} build
          -t {{ tts_image }}
          --build-arg PRECIS_REF={{ tts_precis_ref }}
          .
        chdir: "{{ tts_build_dir }}"
      environment:
        DOCKER_BUILDKIT: "0"
      register: tts_build
      retries: 3
      delay: 5
      until: tts_build.rc == 0
      changed_when: >-
        'Successfully' in (tts_build.stdout + tts_build.stderr)
        or 'COMMIT' in (tts_build.stdout + tts_build.stderr)
        or 'Storing signatures' in (tts_build.stdout + tts_build.stderr)

- name: Assert the precis-tts image is present
  ansible.builtin.command: "{{ tts_container_cmd }} image inspect {{ tts_image }}"
  become: true
  become_user: "{{ 'root' if os_family == 'linux' else tts_worker_user }}"
  register: tts_img
  changed_when: false
  failed_when: tts_img.rc != 0
  # Fails when the image is absent: (re)build with -e tts_build_image=true.

# ── worker env — Linux only (systemd drop-in EnvironmentFile). On darwin the
# same vars ride the collapsed worker plist via 20b's `_l_b_tts_env` combine
# (gated on precis_capabilities.tts_render), so nothing to drop here. ──
- name: Ensure the precis env dir
  ansible.builtin.file:
    path: /etc/precis
    state: directory
    owner: root
    group: root
    mode: "0755"
  become: true
  when: os_family == "linux"

- name: Drop the worker tts env file
  ansible.builtin.template:
    src: tts.env.j2
    dest: /etc/precis/tts.env
    owner: root
    group: root
    mode: "0644"
  become: true
  when: os_family == "linux"
  notify: restart precis-worker (tts)

- name: Ensure the precis-worker systemd drop-in dir
  ansible.builtin.file:
    path: /etc/systemd/system/precis-worker.service.d
    state: directory
    owner: root
    group: root
    mode: "0755"
  become: true
  when: os_family == "linux"

- name: Drop the precis-worker tts env drop-in (EnvironmentFile)
  ansible.builtin.template:
    src: precis-worker-tts.conf.j2
    # 40- sorts after dft's 10-, autocatpath's 20-, aizynth's 30-.
    dest: /etc/systemd/system/precis-worker.service.d/40-tts.conf
    owner: root
    group: root
    mode: "0644"
  become: true
  when: os_family == "linux"
  notify: restart precis-worker (tts)
