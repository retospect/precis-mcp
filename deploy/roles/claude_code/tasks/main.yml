---
# Claude Code — Anthropic's official CLI for Claude.
#
# Installs the `claude` binary system-wide so any user on the host
# can run it. Credentials come from the vault, never a one-time
# `claude /login` (Reto 2026-10-11, gr260050): every precis path that
# spawns `claude` fills CLAUDE_CODE_OAUTH_TOKEN via
# precis.utils.claude_oauth.ensure_oauth_token, and a CLI one-shot with
# no bound store reveals it through the configured database
# (precis.secrets.reveal_unbound). This role writes no credentials.
#
# Install method: npm global via Homebrew. The official Anthropic
# install script (claude.ai/install.sh) is per-user — it lands in
# $HOME/.local/bin and when run as root puts the binary in
# /var/root/.local/bin where no daemon will find it. npm global
# instead lands the binary at $(npm prefix -g)/bin/claude — on
# Homebrew Apple Silicon that's /opt/homebrew/bin/claude, which
# IS on every user's default PATH including the hermes daemon's.
#
# Ad-hoc `claude` typed by an interactive ssh user (outside precis):
#
#   export CLAUDE_CODE_OAUTH_TOKEN="$(precis secret get CLAUDE_CODE_OAUTH_TOKEN)"
#
# Legacy, not the supported path:
#
#   # As the hermes daemon user (only if you intend to wire Asa
#   # through `claude -p` as a subprocess — see roles/hermes/README.md):
#   ssh the gateway
#   sudo -iu hermes
#   claude            # device flow → /Users/hermes/.claude/.credentials.json
#
# References:
#   - https://docs.claude.com/en/docs/claude-code/quickstart
#   - https://www.npmjs.com/package/@anthropic-ai/claude-code

- name: Ensure Node.js is installed (Homebrew on macOS)
  when: os_family == "darwin"
  community.general.homebrew:
    name: node
    state: present
  become: false

- name: Resolve npm global prefix
  ansible.builtin.command: /opt/homebrew/bin/npm prefix -g
  register: claude_npm_prefix
  changed_when: false

- name: Compute expected claude binary path
  ansible.builtin.set_fact:
    claude_bin: "{{ claude_npm_prefix.stdout | trim }}/bin/claude"

- name: Check whether the npm-installed claude is already present
  ansible.builtin.stat:
    path: "{{ claude_bin }}"
  register: claude_stat

# Earlier ansible runs (or any historical `sudo npm install`) seed
# /Users/deploy/.npm with root-owned cache files. The next npm
# invocation as the deploy user then fails with EACCES on
# .npm/_cacache. Fix the ownership tree before the install so the
# role is idempotent against the legacy state. The chown is a
# no-op when ownership is already clean.
- name: Reclaim ownership of the deploy user's npm cache (.npm)
  ansible.builtin.file:
    path: /Users/deploy/.npm
    state: directory
    owner: deploy
    group: staff
    recurse: true
  become: true

- name: Install / upgrade @anthropic-ai/claude-code globally via npm
  when: not claude_stat.stat.exists or (claude_code_force_reinstall | default(false) | bool)
  ansible.builtin.command: /opt/homebrew/bin/npm install -g @anthropic-ai/claude-code
  become: false
  register: claude_npm_install
  changed_when: "'added' in (claude_npm_install.stdout | default('')) or 'updated' in (claude_npm_install.stdout | default('')) or 'changed' in (claude_npm_install.stdout | default(''))"

- name: Verify the claude binary is now present
  ansible.builtin.stat:
    path: "{{ claude_bin }}"
  register: claude_post_stat
  failed_when: not claude_post_stat.stat.exists

- name: Report installed claude version
  ansible.builtin.command: "{{ claude_bin }} --version"
  register: claude_version
  changed_when: false

- name: Show claude install summary
  ansible.builtin.debug:
    msg: "claude at {{ claude_bin }} — {{ claude_version.stdout }}"

# The per-user installer from earlier role versions landed claude at
# /var/root/.local/bin/claude. It's harmless but invisible to every
# user shell. Surface it so the operator can rm it if they want a
# clean state — we don't auto-delete because it's not ours to
# trample.
- name: Detect stray per-user install from /var/root/.local/bin
  ansible.builtin.stat:
    path: /var/root/.local/bin/claude
  register: claude_stray
  become: true

- name: Note stray /var/root install (manual cleanup, not auto-removed)
  when: claude_stray.stat.exists
  ansible.builtin.debug:
    msg: |
      An older per-user claude install exists at /var/root/.local/bin/claude
      (left over from when this role used the official install.sh script as
      root). It is unused now that {{ claude_bin }} is on PATH. To remove:
        ssh the gateway 'sudo rm -rf /var/root/.local/bin/claude /var/root/.claude'

# Ensure ~/.claude exists for the hermes daemon user so a future
# `sudo -iu hermes claude` interactive login can drop its
# credentials there without permission gymnastics. Mode 0700
# matches what `claude` would create itself; we just front-load it
# so the directory perms are deterministic. Gateway-group only:
# hermes exists nowhere else (overlay only_groups), and play 29 also
# targets scheduler — the bare default would chown a nonexistent
# user's home there on every redeploy.
- name: Ensure hermes user's ~/.claude directory exists (gateway only)
  when:
    - "'gateway' in group_names"
    - claude_code_prep_hermes_home | default(true) | bool
  ansible.builtin.file:
    path: /Users/hermes/.claude
    state: directory
    owner: hermes
    group: staff
    mode: "0700"
  become: true

# ── Non-admin claude run user (macOS workers; Reto ruling 2026-10-26) ────
# Wrapper route, deliberately chosen over running the whole collapsed
# worker unit as the run user: that unit does far more than spawn claude —
# it reads ~deploy/.pgpass on every DB call, owns the HF cache and the
# venv's marker `static/` dir, and writes NFS/NAS paths as deploy.
# Re-homeing all of that onto a fresh account puts EVERY pass on the host
# (embed, summarize, chase, scheduler cadences) one missed permission away
# from a silent degrade. Pointing PRECIS_CLAUDE_BIN at a `sudo -n` re-exec
# wrapper confines the change to exactly what the ruling covers — the
# `claude` process drops to a dedicated non-admin user; everything else on
# the worker is untouched. The Cmnd-scoped env_keep in deploy's sudoers
# grant is the allowlist: nothing from the worker env crosses the sudo
# boundary unless named.

- name: "claude run user: macOS-only (Linux runs the container lane)"
  when:
    - claude_run_user | default('') | length > 0
    - os_family != "darwin"
  ansible.builtin.fail:
    msg: >-
      claude_run_user={{ claude_run_user }} is set on a non-darwin host —
      Linux nodes run the containerized job_claude_docker lane; host claude
      spawns only exist on macOS workers. Unset it for
      {{ inventory_hostname }}.

# The run user has no ~/.pgpass and no DB env, so a host whose worker
# binds PRECIS_MCP_CONFIG — the gateway group, where a stdio `precis
# serve` MCP child expands mcp.json passthroughs — would run that child
# as the run user and fail every call unauthenticated. Refuse the
# combination; the run-user lane is for workers with no bound MCP config.
- name: "claude run user: refuse a host whose worker binds PRECIS_MCP_CONFIG"
  when:
    - claude_run_user | default('') | length > 0
    - "'gateway' in group_names"
  ansible.builtin.fail:
    msg: >-
      claude_run_user={{ claude_run_user }} is set on a gateway-group
      host, whose collapsed-worker env binds PRECIS_MCP_CONFIG
      (20b-precis-worker-collapsed.yml). claude's stdio `precis serve`
      child would spawn as the run user — no ~/.pgpass, no DB env — and
      fail unauthenticated. Unset it for {{ inventory_hostname }}.

- name: "claude run user: uid must be pinned alongside the name"
  when:
    - claude_run_user | default('') | length > 0
    - (claude_run_uid | default('') | string | length) == 0
  ansible.builtin.fail:
    msg: >-
      claude_run_user={{ claude_run_user }} is set but claude_run_uid is
      empty — pin it in the host_vars too. Same pinned-id rule as
      roles/users: an auto-assigned uid must never differ across nodes
      (NFS carries numeric ids).

- name: Create + guard the non-admin claude run user (macOS)
  when:
    - os_family == "darwin"
    - claude_run_user | default('') | length > 0
  block:
    - name: "claude run user: probe existing account uid"
      ansible.builtin.command: dscl . -read "/Users/{{ claude_run_user }}" UniqueID
      register: _claude_run_uid_probe
      failed_when: false
      changed_when: false

    # Same no-renumber rule as roles/users: a name held at a different uid
    # is drift to remediate deliberately, never to usermod past.
    - name: "claude run user: refuse a name held at another uid"
      when:
        - _claude_run_uid_probe.rc == 0
        - _claude_run_uid_probe.stdout.split()[-1] | int != (claude_run_uid | int)
      ansible.builtin.fail:
        msg: >-
          account {{ claude_run_user }} already exists at uid
          {{ _claude_run_uid_probe.stdout.split()[-1] }}, not the pinned
          {{ claude_run_uid }} — usermod would orphan every file at the old
          id. Fix the pin or remediate by hand.

    - name: "claude run user: probe existing group gid"
      ansible.builtin.command: dscl . -read "/Groups/{{ claude_run_user }}" PrimaryGroupID
      register: _claude_run_gid_probe
      failed_when: false
      changed_when: false

    - name: "claude run user: create the pinned group"
      when: _claude_run_gid_probe.rc != 0
      ansible.builtin.command: >
        dseditgroup -o create -i {{ claude_run_gid | default(claude_run_uid, true) }}
        -r {{ claude_run_user }} {{ claude_run_user }}
      become: true

    # sysadminctl also creates /Users/<name> — the home the wrapper pins
    # as HOME and the one-time `claude login` writes into.
    - name: "claude run user: create the account"
      when: _claude_run_uid_probe.rc != 0
      ansible.builtin.command: >
        sysadminctl -addUser {{ claude_run_user }}
        -UID {{ claude_run_uid }}
        -GID {{ claude_run_gid | default(claude_run_uid, true) }}
        -shell {{ claude_run_shell }}
      become: true

    - name: "claude run user: ~/.claude exists for the one-time login"
      ansible.builtin.file:
        path: "{{ claude_run_home }}/.claude"
        state: directory
        owner: "{{ claude_run_user }}"
        group: staff
        mode: "0700"
      become: true

    - name: "claude run user: ensure the wrapper's parent dir"
      ansible.builtin.file:
        path: "{{ claude_run_wrapper | dirname }}"
        state: directory
        owner: root
        group: wheel
        mode: "0755"
      become: true

    - name: "claude run user: render the PRECIS_CLAUDE_BIN wrapper"
      ansible.builtin.template:
        src: claude-run-user.sh.j2
        dest: "{{ claude_run_wrapper }}"
        owner: root
        group: wheel
        mode: "0755"
      vars:
        # Resolved here (ansible's dirname filter) so the template stays
        # plain jinja — the render tests load it without ansible filters.
        claude_run_bin_dir: "{{ claude_bin | dirname }}"
      become: true

    # ── Deploy-time asserts — the ruling's hard edge, re-verified every run ──
    - name: "claude run user: FAIL if it is in the admin group"
      ansible.builtin.command: id -Gn {{ claude_run_user }}
      register: _claude_run_groups
      changed_when: false
      failed_when: "'admin' in (_claude_run_groups.stdout | default('')).split()"

    # `sudo -l -U` is the authoritative probe — it reads the whole
    # policy (main sudoers, sudoers.d, group rules). But the exit code
    # alone can't read the answer: sudo's display_privs prints "User X
    # is not allowed to run sudo on H." and STILL exits 0 when the count
    # is zero, so a grant-less user looks identical to a granted one.
    # Fail on a probe error (rc != 0) OR on rc == 0 without the denial
    # line — the ONE wrapper grant lives in /etc/sudoers.d/deploy
    # (deploy's file, granting deploy, not the run user). ONE expression:
    # a failed_when LIST is ANDed, which would pass a granted user on
    # the first item.
    - name: "claude run user: FAIL if it has any sudo grant"
      ansible.builtin.command: /usr/bin/sudo -l -U {{ claude_run_user }}
      become: true
      register: _claude_run_sudo
      changed_when: false
      failed_when: >-
        _claude_run_sudo.rc != 0
        or 'is not allowed to run sudo' not in
        ((_claude_run_sudo.stdout | default(''))
        ~ (_claude_run_sudo.stderr | default('')))

    # Belt to the -l probe's braces: grep sudoers.d for the user in
    # rule-subject position (first field of a grant line) — the ruling's
    # named case. grep rc 1 (no match) is the pass; 0 is a grant found,
    # ≥2 a probe error — both fail.
    - name: "claude run user: FAIL if any sudoers.d file names it as a subject"
      ansible.builtin.command: >
        /usr/bin/grep -rE '^[[:space:]]*{{ claude_run_user }}[[:space:]]'
        /etc/sudoers.d/
      become: true
      register: _claude_run_sudoersd
      changed_when: false
      failed_when: _claude_run_sudoersd.rc != 1

    - name: "claude run user: assert {{ claude_bin }} is executable by it"
      ansible.builtin.command: >
        /usr/bin/sudo -n -u {{ claude_run_user }}
        /usr/bin/test -x {{ claude_bin }}
      become: true
      changed_when: false

    # End-to-end smoke: the full chain — deploy → wrapper → sudo -n re-exec
    # → env_keep allowlist → claude — must work the day the unit flips
    # PRECIS_CLAUDE_BIN, not on the first real spawn.
    - name: "claude run user: wrapper smoke (claude --version as the run user)"
      ansible.builtin.command: "{{ claude_run_wrapper }} --version"
      changed_when: false
