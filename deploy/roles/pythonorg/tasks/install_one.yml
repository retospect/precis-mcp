---
# install_one.yml — one iteration of the pythonorg_versions loop (`item` is
# supplied by main.yml's include_tasks loop). Included, not a role default
# task list, so it can run its checked-install-check-download-install
# sequence per version without a second layer of looping in main.yml.

# (a) Is this series already at the target full version? `--version` prints
# to stdout on modern CPython; `failed_when: false` covers the fresh-host
# case where the interpreter doesn't exist at all yet (command fails, rc!=0,
# empty stdout — never matches below). Exact-match against the whole
# "Python X.Y.Z" line, not a substring test: a substring would false-positive
# when a target version is a prefix of the installed one (3.14.1 vs 3.14.17)
# and silently skip the install.
- name: "Check installed python.org {{ item.series }} version"
  ansible.builtin.command:
    cmd: "/Library/Frameworks/Python.framework/Versions/{{ item.series }}/bin/python{{ item.series }} --version"
  register: pythonorg_installed_check
  changed_when: false
  failed_when: false

- name: "Set python.org {{ item.series }} up-to-date fact"
  ansible.builtin.set_fact:
    pythonorg_up_to_date: "{{ (pythonorg_installed_check.stdout | default('') | trim) == 'Python ' ~ item.full }}"

# (b) Download the installer — only when this series isn't already on the
# target full version. python.org's CDN can stall (probes from the control
# machine have timed out on a cold fetch), and this task is now a hard
# prerequisite of every venv-building play — retry rather than abort the
# whole deploy on one slow response.
- name: "Download python.org {{ item.full }} installer"
  when: not pythonorg_up_to_date
  ansible.builtin.get_url:
    url: "https://www.python.org/ftp/python/{{ item.full }}/python-{{ item.full }}-macos11.pkg"
    dest: "/tmp/python-{{ item.full }}-macos11.pkg"
    mode: "0644"
    timeout: 120
  register: pythonorg_pkg_dl
  until: pythonorg_pkg_dl is succeeded
  retries: 3
  delay: 10

# (c) Run the Apple installer. `installer` always requires root.
- name: "Install python.org {{ item.full }} framework"
  when: not pythonorg_up_to_date
  become: true
  ansible.builtin.command:
    cmd: "installer -pkg /tmp/python-{{ item.full }}-macos11.pkg -target /"
  changed_when: true

# (d) Signature assertion — runs EVERY time, even when this series was
# already up to date, so a re-run also catches a host where the on-disk
# binary somehow lost its signature (a corrupted install, a hand-copied
# interpreter that isn't actually the python.org build). This is the
# guarantee the whole migration exists for: FDA grants only survive python
# upgrades when TCC pinned a Developer-ID *signature*, not an ad-hoc
# cdhash — see the head comment in tasks/main.yml and
# docs/runbooks/fda-grant-review.md.
- name: "Verify python.org {{ item.series }} is Developer-ID signed"
  ansible.builtin.command:
    cmd: "codesign -dv --verbose=2 /Library/Frameworks/Python.framework/Versions/{{ item.series }}/bin/python{{ item.series }}"
  register: pythonorg_codesign
  changed_when: false
  # codesign writes its -dv output to stderr, not stdout.
  failed_when: false

- name: "Assert python.org {{ item.series }} carries a Developer-ID TeamIdentifier"
  ansible.builtin.assert:
    that:
      - "'TeamIdentifier=' in pythonorg_codesign.stderr"
      - "'TeamIdentifier=not set' not in pythonorg_codesign.stderr"
    fail_msg: >-
      /Library/Frameworks/Python.framework/Versions/{{ item.series }}/bin/python{{ item.series }}
      is NOT Developer-ID signed (codesign output: {{ pythonorg_codesign.stderr }}). The entire
      point of the python.org migration is a signature-based FDA grant that survives python
      upgrades — an ad-hoc or unsigned binary here means the grant will break on the next
      upgrade exactly like the Homebrew builds it replaced. Refusing to proceed.
    success_msg: >-
      python.org {{ item.series }} is Developer-ID signed
      ({{ pythonorg_codesign.stderr | regex_search('TeamIdentifier=[^\n]*') }}).
    quiet: true

# (e) Populate the CA store — runs EVERY time, like the signature assertion.
# A python.org framework build ships with etc/openssl/ EMPTY: it neither uses
# the macOS keychain nor bundles a cert.pem, so ssl.create_default_context()
# has nothing to verify against and every https urlopen fails with
# CERTIFICATE_VERIFY_FAILED. The .pkg leaves the fix as a manual double-click
# ("Install Certificates.command"), which nobody runs on a headless host —
# this is exactly what took out 98% of small-tier LLM traffic for 2 days when
# the 2026-08-24 migration landed without it (gr255538). The command is
# idempotent (pip-upgrades certifi into the framework site-packages and
# symlinks etc/openssl/cert.pem at it), so run it whenever cert.pem is absent.
# NOTE: fixing the store does NOT heal already-running daemons — stdlib
# urllib builds its module-global opener's SSLContext once, at the process's
# FIRST https urlopen (urllib.request.HTTPSHandler.__init__), so a process
# that dialed out before the fix keeps its cert-less context until restarted.
- name: "Check python.org {{ item.series }} CA store"
  ansible.builtin.stat:
    path: "/Library/Frameworks/Python.framework/Versions/{{ item.series }}/etc/openssl/cert.pem"
  register: pythonorg_ca_store

- name: "Populate python.org {{ item.series }} CA store (Install Certificates.command)"
  when: not pythonorg_ca_store.stat.exists
  become: true
  ansible.builtin.command:
    cmd: "/Applications/Python {{ item.series }}/Install Certificates.command"
  changed_when: true

# Assert with a live handshake, not just the symlink's existence: a cert.pem
# pointing at a deleted certifi bundle would pass a stat and still fail every
# TLS connection. A raw ssl handshake (no HTTP layer) is exactly the check —
# it raises SSLCertVerificationError on an empty/broken CA store and nothing
# else. Endpoint is python.org itself — reachable from every host that just
# downloaded the installer from it.
- name: "Assert python.org {{ item.series }} can verify TLS"
  ansible.builtin.command:
    cmd: >-
      /Library/Frameworks/Python.framework/Versions/{{ item.series }}/bin/python{{ item.series }}
      -c "import ssl, socket;
      ssl.create_default_context().wrap_socket(socket.create_connection(('www.python.org', 443), timeout=30),
      server_hostname='www.python.org').close()"
  changed_when: false

# (f) Clean up the downloaded pkg — only meaningful when an install ran.
- name: "Remove downloaded python.org {{ item.full }} installer pkg"
  when: not pythonorg_up_to_date
  ansible.builtin.file:
    path: "/tmp/python-{{ item.full }}-macos11.pkg"
    state: absent
