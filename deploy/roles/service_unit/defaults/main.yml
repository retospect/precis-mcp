---
# service_unit — the missing multiplatform launch-unit abstraction (§15h,
# slice 10 of docs/design/factory-console-and-scheduling.md).
#
# Today platform-branching is a custom `os_family` var plus inline
# `when: os_family == …` guards, duplicated across six dual-template roles
# (llamacpp, mcps, precis_embedder, precis_heartbeat, precis_watch,
# precis_worker), each carrying its own launchd plist AND systemd unit. There
# is no single role that owns multiplatform. This is it: one abstract spec →
# a launchd LaunchDaemon (macOS) OR a systemd unit (Linux), selected by
# `os_family`. A capability role then delegates unit-rendering here instead of
# maintaining two templates — "one plist" is really "one service *definition*,
# two renderings" (§15h). Ships DARK: no playbook includes this role yet; the
# Phase-2 window rewires the daemon roles onto it.
#
# The canonical consumer is slice 10's single COLLAPSED worker — one
# DB-controlled `precis worker` daemon per host, loading every capability the
# host can do (capability × service_config.prio, so it carries NONE of the
# retired PRECIS_*_ENABLED env flags):
#
#   - role: service_unit
#     vars:
#       service_unit_name: worker
#       service_unit_exec: >-
#         {{ precis_worker_venv }}/bin/precis worker --profile system
#         --batch-size {{ precis_worker_batch_size }}
#         --idle-seconds {{ precis_worker_idle_seconds }}
#         --embedder {{ precis_worker_embedder }}
#         --embedder-url {{ precis_worker_embedder_url }}
#         --summarizer-model {{ precis_worker_summarizer }}
#       service_unit_env: "{{ precis_shared_env | combine(precis_worker_core_env) }}"
#       service_unit_schedule: {mode: keepalive}
#       service_unit_process_type: Interactive   # jetsam band (RAM-pressured host)

# ── required (the including role/playbook MUST set these) ──────────────────
#   service_unit_name:  logical short name, e.g. "worker" →
#                       launchd Label  com.precis.worker
#                       systemd unit   precis-worker.service
#   service_unit_exec:  the command line to run (a single string). On launchd
#                       it is wrapped `/bin/bash -c 'exec <cmd>'` so bash stays
#                       the TCC responsible process (FDA grant survives exec).

# ── optional ──────────────────────────────────────────────────────────────
service_unit_run_as: deploy
service_unit_working_dir: /tmp
service_unit_env: {} #  dict of KEY: value environment pairs
# EnvironmentFile paths sourced by the unit, in order, IN ADDITION to
# service_unit_env (Linux/systemd ONLY — launchd has no EnvironmentFile
# equivalent, so a non-empty list on darwin is a hard error, asserted in
# tasks/main.yml). Each renders as `EnvironmentFile=-<path>` — the `-`
# prefix makes the file optional so the unit still starts when it is
# absent. Lets a satellite unit reuse a capability role's already-rendered
# env drop-in (e.g. /etc/precis/autocatpath.env, /etc/precis/dft.env) as
# the single source of truth instead of duplicating PRECIS_NODE / the
# feature flags inline. Rendered AFTER the Environment= block, so a key in
# a file wins over the same key in service_unit_env.
service_unit_env_files: []
service_unit_description: "precis {{ service_unit_name }}"
service_unit_log: "/var/log/precis-{{ service_unit_name }}.log"

# schedule — exactly one shape:
#   {mode: keepalive}                       daemon: runs forever
#                                           (RunAtLoad+KeepAlive / Restart=always)
#   {mode: interval, seconds: 3600}         periodic one-shot every N seconds
#                                           (launchd only — post-collapse the
#                                            thin timers fold into the worker's
#                                            §15i scheduler, so systemd hosts
#                                            need no periodic units)
#   {mode: calendar, hour: 4, minute: 30}   daily at HH:MM (launchd only)
service_unit_schedule:
  mode: keepalive

service_unit_throttle_seconds: 30 #  crash-loop guard (keepalive only)
# "Interactive" raises the macOS jetsam band toward foreground so a
# RAM-pressured host culls this daemon last, not first. Empty = default band.
service_unit_process_type: ""

# ── systemd-only start-gate knobs (Linux) ───────────────────────────────
# A deploy can start a unit before its dependency (a venv install, a
# provisioning role) has actually landed — e.g. this unit's
# ExecStart references a venv another play refreshes concurrently. Rather
# than every capability role hand-rolling its own readiness wait, a caller
# can supply one or more ABSOLUTE-PATH commands here; each renders as its
# own `ExecStartPre=` line, run in order before ExecStart, and a non-zero
# exit blocks the start (systemd counts that toward the unit's restart
# limit like any other start failure — gr199339). Each entry must already
# be a fully-resolved command (no shell wrapping done here) since systemd's
# own Exec= tokenizer, not POSIX shell, parses these lines — nest a
# `/bin/sh -c '...'` yourself only if you also hand-verify the quoting
# survives systemd's tokenizer; a rendered script file (own template +
# `mode: "0755"`) sidesteps that entirely and is the recommended shape.
service_unit_exec_start_pre: [] # list[str] of absolute-path commands
# Raise past the default 90s when service_unit_exec_start_pre includes a
# bounded poll-wait — TimeoutStartSec covers ExecStartPre too, so a wait
# window that legitimately runs long fails the start on a timeout instead
# of letting the poll's own bound decide. Empty = systemd default (no
# TimeoutStartSec= line rendered).
service_unit_timeout_start_sec: ""
# StartLimitIntervalSec / StartLimitBurst — systemd's built-in restart-
# storm breaker: after `_burst` failed starts within `_interval_sec`, the
# unit is marked failed and Restart= no longer fires (a `systemctl reset-
# failed` + restart is needed to recover). Belt-and-braces alongside
# service_unit_throttle_seconds (RestartSec, the per-attempt delay): the
# two combine to bound both how FAST and how MANY times a wedged unit
# retries before systemd gives up and stops burning cycles. Empty (either)
# = systemd default (StartLimitIntervalSec=10s / StartLimitBurst=5), which
# is punishingly tight for a unit whose ExecStartPre legitimately polls for
# minutes — set both explicitly whenever service_unit_exec_start_pre does.
service_unit_start_limit_interval_sec: ""
service_unit_start_limit_burst: ""
# Stop-timeout — how long a SIGTERM'd daemon gets to drain before the
# SIGKILL that orphans its claims (self-healing-spine Layer 1, slice 2).
# Renders TimeoutStopSec= on systemd and <ExitTimeOut> on launchd (whose
# default is a tight 20s). Set on worker units to comfortably cover the
# graceful drain (streamed LLM calls abort between SSE chunks on SIGTERM,
# then finalize partial + release holds); empty = platform default
# (systemd 90s / launchd 20s), today's behaviour.
service_unit_timeout_stop_sec: ""
