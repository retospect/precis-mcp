---
# service_unit — render + (re)load one precis service, launchd or systemd,
# from the abstract service_unit_* spec (§15h). Included once per service.
#
# Reload is done INLINE, gated on the render's `changed`, referencing
# `service_unit_name` — a global named handler can't target the right unit
# when this role is included N times in a play. The reload mirrors the tuned
# precis_worker handler (bootout→bootstrap→kickstart with retry + a
# pid assertion) so a green run never leaves a daemon down.

- name: "service_unit[{{ service_unit_name }}]: require a name + exec"
  ansible.builtin.assert:
    that:
      - service_unit_name | length > 0
      - service_unit_exec | length > 0
    fail_msg: "service_unit needs service_unit_name and service_unit_exec"
    quiet: true

- name: "service_unit[{{ service_unit_name }}]: systemd renders daemons only"
  ansible.builtin.assert:
    that: service_unit_schedule.mode == 'keepalive'
    fail_msg: >-
      service_unit on Linux renders keepalive daemons only — post-collapse the
      periodic cadences fold into the worker's §15i scheduler. Requested mode:
      {{ service_unit_schedule.mode }}.
    quiet: true
  when: os_family == "linux"

# service_unit_env_files renders to EnvironmentFile=, which launchd has no
# equivalent for — silently dropping it on darwin is exactly the "feature
# absent in prod" bug class, so fail loudly instead. No darwin consumer
# sets it today (the default is []).
- name: "service_unit[{{ service_unit_name }}]: env_files is systemd-only"
  ansible.builtin.assert:
    that: (service_unit_env_files | length) == 0
    fail_msg: >-
      service_unit_env_files is Linux/systemd only (launchd has no
      EnvironmentFile) — inline the values into service_unit_env for a darwin
      unit instead. Requested: {{ service_unit_env_files }}.
    quiet: true
  when: os_family == "darwin"

# service_unit_exec_start_pre / _timeout_start_sec / _start_limit_* render
# to systemd Exec=/Unit= directives with no launchd equivalent (a launchd
# start-gate belongs in the wrapped ExecStart command itself, e.g. a `while`
# loop inside the `bash -c` launchd already wraps ExecStart in — see
# service_unit_exec's docstring above). Same silent-drop bug class as
# env_files above, so fail loudly instead. No darwin consumer sets these
# today (defaults are empty).
- name: "service_unit[{{ service_unit_name }}]: start-gate knobs are systemd-only"
  ansible.builtin.assert:
    that:
      - (service_unit_exec_start_pre | length) == 0
      - not service_unit_timeout_start_sec
      - not service_unit_start_limit_interval_sec
      - not service_unit_start_limit_burst
    fail_msg: >-
      service_unit_exec_start_pre / _timeout_start_sec /
      _start_limit_interval_sec / _start_limit_burst are Linux/systemd only
      (no launchd equivalent) — fold a darwin readiness wait into
      service_unit_exec's own `bash -c` wrapper instead.
    quiet: true
  when: os_family == "darwin"

# ── macOS: LaunchDaemon ──────────────────────────────────────────────────
# launchd hits EX_CONFIG (78) when StandardOutPath can't be created; /var/log
# is root-only on modern macOS, so pre-create the log deploy-owned.
- name: "service_unit[{{ service_unit_name }}]: pre-create log (macOS)"
  when: os_family == "darwin"
  ansible.builtin.file:
    path: "{{ service_unit_log }}"
    state: touch
    owner: "{{ service_unit_run_as }}"
    group: wheel
    mode: "0644"
  become: true
  changed_when: false

# 0640 root:<run_as>, NOT 0644. A launchd plist inlines its whole environment
# in <EnvironmentVariables>, and several of these carry live credentials
# (PRECIS_ANKI_PASSWORD on the worker; a DSN with a password on older hosts) —
# at 0644 every local account could read them. Owner stays root (launchd
# requires it); the group is the service account so precis-web's env inspector,
# which runs as that user and reads plists by label
# (precis_web/routes/env.py::_PLIST_DIR), keeps working. This role is the
# ONLY live renderer of these files — playbook 20b invokes precis_worker with
# `tasks_from: provision`, deliberately skipping its units.yml — so fixing the
# mode anywhere else is silently reverted by the next deploy (2026-08-23).
- name: "service_unit[{{ service_unit_name }}]: render LaunchDaemon (macOS)"
  when: os_family == "darwin"
  ansible.builtin.template:
    src: launchd.plist.j2
    dest: "/Library/LaunchDaemons/com.precis.{{ service_unit_name }}.plist"
    owner: root
    group: "{{ service_unit_run_as }}"
    mode: "0640"
  become: true
  register: _service_unit_plist

- name: "service_unit[{{ service_unit_name }}]: load LaunchDaemon (macOS — idempotent)"
  when: os_family == "darwin"
  ansible.builtin.command: >
    launchctl load -w /Library/LaunchDaemons/com.precis.{{ service_unit_name }}.plist
  become: true
  changed_when: false
  failed_when: false

- name: "service_unit[{{ service_unit_name }}]: reload on change (macOS)"
  when:
    - os_family == "darwin"
    - _service_unit_plist is changed
  # cmd: (not free-form) — ansible's free-form splitter quote-counts the whole
  # block including shell comments, so a stray apostrophe in a comment breaks
  # the play at load time; the cmd: key skips that splitter entirely.
  ansible.builtin.shell:
    cmd: |
      set -u
      unit=com.precis.{{ service_unit_name }}
      plist="/Library/LaunchDaemons/${unit}.plist"
      for attempt in 1 2 3 4 5; do
        launchctl bootout "system/${unit}" 2>/dev/null || true
        # bootout is ASYNC — poll until the label is actually gone before
        # bootstrapping, else a late teardown reaps the freshly-loaded daemon
        # (a fixed sleep raced it and left a daemon dead on a green deploy —
        # gr176223; mirrors the tasks/reload_launchd.yml + blanket-bounce fix).
        i=0
        while launchctl print "system/${unit}" >/dev/null 2>&1 && [ "$i" -lt 120 ]; do
          sleep 0.5; i=$((i + 1))
        done
        [ "$i" -ge 120 ] && echo "${unit}: still tearing down after 60s, bootstrapping anyway (attempt ${attempt})" >&2
        launchctl bootstrap system "${plist}" 2>/dev/null \
          || launchctl load -wF "${plist}" 2>/dev/null || true
        sleep 1
        launchctl kickstart "system/${unit}" 2>/dev/null || true
        sleep 1
        if launchctl print "system/${unit}" 2>/dev/null | grep -qE 'pid = [0-9]+'; then
          # settle re-assert: confirm it's STILL up after a window, catching a
          # residual late teardown before we call the reload a success (gr176223).
          sleep 8
          if launchctl print "system/${unit}" 2>/dev/null | grep -qE 'pid = [0-9]+'; then
            echo "${unit}: running (attempt ${attempt})"
            exit 0
          fi
        fi
        echo "${unit}: not running after attempt ${attempt}, retrying" >&2
        sleep 2
      done
      echo "${unit}: FAILED to come up after 5 attempts" >&2
      exit 1
  become: true
  changed_when: true

# ── Linux: systemd ───────────────────────────────────────────────────────
- name: "service_unit[{{ service_unit_name }}]: render systemd unit (Linux)"
  when: os_family == "linux"
  ansible.builtin.template:
    src: systemd.service.j2
    dest: "/etc/systemd/system/precis-{{ service_unit_name }}.service"
    mode: "0644"
  become: true
  register: _service_unit_systemd

- name: "service_unit[{{ service_unit_name }}]: enable + (re)start (Linux)"
  when: os_family == "linux"
  ansible.builtin.systemd:
    name: "precis-{{ service_unit_name }}"
    daemon_reload: true
    enabled: true
    state: "{{ 'restarted' if _service_unit_systemd is changed else 'started' }}"
  become: true
