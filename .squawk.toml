# Squawk (migration SQL lint) — run by scripts/ship on the NEW migration
# files a ship adds; sealed migrations are frozen and never re-linted.
# Rule docs: https://squawkhq.com/docs/rules
pg_version = "17.0"
excluded_rules = [
    # Migrations run in the deploy's single-writer window (the migrator
    # applies them while the daemons bounce), so lock-contention rules
    # are noise here:
    "require-concurrent-index-creation",
    "require-lock-timeout",
    "require-statement-timeout",
    # House style: serial PKs predate identity columns, and BIGINT is
    # already used where range matters — INT survives for small counters
    # (e.g. 0128's leaf_count/leaf_index).
    "prefer-identity",
    "prefer-bigint-over-int",
    # Vocabulary-compaction stages C/D/E (docs/backlog/vocab-compaction-
    # stages.md) rename persisted columns on purpose. Their own Deploy
    # protocol section is the mitigation squawk is warning about here: quiesce
    # the fleet, then migrate + deploy the renamed-column-aware code together
    # in one play, so no old binary ever reads the old name — the exact
    # "existing clients" hazard this rule flags, handled operationally.
    "renaming-column",
]
