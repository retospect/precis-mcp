# precis-geom — the workspace script's core wheel (structure-workspaces
# spec §Packaging). Built from this repo at the release sha:
#   `scripts/ws-promote geom` (or `uv build --wheel packaging/geom`).

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "precis-geom"
version = "0.1.0"
description = "The structure-workspace geometry core: hexfold, precis.cad/structsolve/structure, trace capture, precis_ws"
requires-python = ">=3.12"
license = "GPL-3.0-or-later"
# Core-side deps only: RDKit and ASE ride along (spec §Packaging); tblite
# stays a compute-node package. numba backs hexfold/structure kernels;
# pint backs precis.utils.units; manifold3d is the cad CSG kernel.
dependencies = [
    "numpy>=1.24",
    "numba>=0.67.0",
    "ase>=3.22",
    "rdkit>=2023.9",
    "pint>=0.23",
    "manifold3d>=2.5",
    "scipy>=1.14",
]

# ``precis-geom[pcb-kernel]`` (pcb-workspace-code slice 4): shapely is the
# one third-party the precis.pcb geometric kernel needs beyond the base
# deps (drc/gerber/ir/planes/realize/tiling import it at module level).
# The precis.pcb sources ship in EVERY wheel — the extra only adds the
# dep, so a base install can still import the pure half and gets a clean
# "install precis-geom[pcb-kernel]" only when a shapely path runs.
[project.optional-dependencies]
pcb-kernel = [
    "shapely>=2.0",
]

# Partial ``precis`` package on purpose: only what the shipped modules
# import. ``precis/structure/importers`` is excluded — its fetch paths
# (precis.store, safe_fetch) are dead under ``--network none`` and would
# break the import-graph allow-list (tests/test_geom_wheel_imports.py).
# ``precis_se`` is partial the same way: the pure scene generators only.
# The real ``precis_se/__init__.py`` imports ``SeHandler`` (the DB stack),
# so a stub ships in its place — packaging/geom/precis_se/__init__.py,
# which must never be installed next to the server wheel.
# ``precis/pcb`` ships minus its store/network/server-side modules —
# catalog (jlcparts/store), the datasheet/JLC network clients, easyeda,
# argue/review (llm router), check_run and the sanity workers (workers
# layer), snapshot (psycopg replay), and session_store (the load_snapshot
# half of the session split — everything else in session.py is pure).
[tool.hatch.build.targets.wheel.force-include]
"../../src/precis_geom" = "precis_geom"
"../../src/precis_ws" = "precis_ws"
"../../src/hexfold" = "hexfold"
"../../src/precis_chain" = "precis_chain"
"../../src/precis_flow" = "precis_flow"
"../../src/precis_surface" = "precis_surface"
"../../src/precis/cad" = "precis/cad"
"../../src/precis/structsolve" = "precis/structsolve"
"../../src/precis/structure" = "precis/structure"
"../../src/precis/pcb" = "precis/pcb"
"../../src/precis/format" = "precis/format"
"../../src/precis/__init__.py" = "precis/__init__.py"
"../../src/precis/errors.py" = "precis/errors.py"
"../../src/precis/component_series.py" = "precis/component_series.py"
"../../src/precis/finding_id.py" = "precis/finding_id.py"
"../../src/precis/py.typed" = "precis/py.typed"
"../../src/precis/utils/__init__.py" = "precis/utils/__init__.py"
"../../src/precis/utils/units.py" = "precis/utils/units.py"
"../../src/precis/utils/text.py" = "precis/utils/text.py"
"../../src/precis/utils/coerce.py" = "precis/utils/coerce.py"
"../../src/precis/data/component_series.json" = "precis/data/component_series.json"
"../../src/precis_se/atomic/__init__.py" = "precis_se/atomic/__init__.py"
"../../src/precis_se/atomic/surface_target.py" = "precis_se/atomic/surface_target.py"
"../../src/precis_se/atomic/generators" = "precis_se/atomic/generators"
"../../packaging/geom/precis_se/__init__.py" = "precis_se/__init__.py"

[tool.hatch.build.targets.wheel]
exclude = [
    "precis/structure/importers",
    "precis/pcb/_http.py",
    "precis/pcb/argue.py",
    "precis/pcb/catalog.py",
    "precis/pcb/check_run.py",
    "precis/pcb/datasheet_facts.py",
    "precis/pcb/datasheets.py",
    "precis/pcb/easyeda.py",
    "precis/pcb/jlc_api.py",
    "precis/pcb/jlc_library.py",
    "precis/pcb/jlc_order.py",
    "precis/pcb/review.py",
    "precis/pcb/sanity_board.py",
    "precis/pcb/sanity_power.py",
    "precis/pcb/session_store.py",
    "precis/pcb/snapshot.py",
]
