# version stays 1 — never applied, pre-Round-0 edits are free. 2026-07-25: added `unknown` (a paper that DOES study transport
# but whose abstract doesn't pin the geometry had nowhere to go but
# `n-a`, which means the opposite — "doesn't study transport"); and
# gated `applies_when.tags_any` on PROPERTY:electrical|multi so the pass
# skips the majority of property-tagged papers that would only answer
# n-a (prereq: [property] alone let every property run it). default_
# unknown flips n-a → unknown to match the new value.

id: transport
version: 1
question: "What is the geometry of the conduction / current path?"
values: [point-contact, few-atom, thin-film, bulk-3d, interfacial, unknown, n-a]
default_unknown: unknown
applies_when:
  domain_in: [physics, materials, eng]
  tags_any: ["PROPERTY:electrical", "PROPERTY:multi"]
prereq: [domain, property]
cost_tier: small
prompt: |
  When a paper studies electrical conduction, what is the geometry
  of the current path?

  Pick exactly ONE:

  - point-contact : single tip / single junction (STM, break-junction)
  - few-atom      : ballistic over ≤ ~10 atoms; quantum point contacts
  - thin-film     : planar 2D film; sheet conduction
  - bulk-3d       : 3D current path through a bulk sample
  - interfacial   : conduction localised at interface or grain boundary
  - unknown       : the paper studies transport but title + abstract
                    don't reveal the path geometry
  - n-a           : the paper does not measure or compute electrical
                    transport at all (e.g. a purely dielectric or
                    optical electrical property)

  Return JSON:
  {"value": "<one>", "confidence": <0..1>,
   "rationale": "<one sentence; required if confidence < 0.7>"}

  STM-IV curves on a single molecule are "point-contact". Hall
  measurements on a graphene sheet are "thin-film". A bulk MOF pellet
  is "bulk-3d". Reserve "unknown" for genuine transport studies whose
  geometry the abstract leaves open — not for non-transport papers,
  which are "n-a".
