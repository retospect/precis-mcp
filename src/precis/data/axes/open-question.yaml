# Cross-cutting experiment-planning axis (ADR 0047): "continue where
# the previous work left off". Deliberately orthogonal to role: —
# leads live in future-work AND limitation AND negative results AND
# "no study has yet addressed X" motivation chunks; a single-select
# rhetorical axis cannot retrieve that set.
#
# Gated on role3 (2026-07-25): only substantive prose is classified —
# ROLE3:own (this paper's methods/results/limitations/future-work) plus
# ROLE3:background (motivation chunks hold the "no study has addressed X"
# leads). ROLE3:furniture is skipped — no lead ever lives in a reference
# list or copyright block — which also prunes the pass to the chunks that
# can plausibly answer "yes", instead of running on every chunk.
#
# This axis is tuned for RECALL: a false-positive lead costs seconds
# of reading; a false negative is an invisible lost thread. The
# per-value eval recall floor is ~80% for `yes` (vs the default 60%),
# and tag rows for `yes` are written at a lower confidence threshold.

id: open-question
level: chunk
# For memory (dreams), classification is INTENDED to be ref-level: dream
# bodies live in refs.title (only chunk is the card_combined card), so a
# runner would read the ref and put the envelope in refs.meta->'tagging'.
# The dream corpus is dense in leads — nearly every dream ends in an
# untested implication ("a device class that does not currently exist"),
# which would make OPEN-QUESTION:yes + the speculative opt-in a queryable
# idea backlog.
#   NOT YET IMPLEMENTED: the generic axis runner (workers/axis_pass.py)
#   treats this as a plain level:chunk axis, so a `memory` ref (no ord>=0
#   paragraph chunk) never matches its claim predicate — memory is a no-op
#   for this axis today. Only `move` (level: ref) classifies dreams. The
#   ref-level path for chunk-declared axes is tracked in OPEN-ITEMS.
applies_to_kinds: [paper, cfp, memory]
version: 1
question: "Does this chunk name something specific that has not yet been done?"
select: one
values: ["yes", "no", unknown, n-a]   # yes/no quoted — YAML 1.1 bools
default_unknown: unknown
applies_when:
  # Skip furniture + unclassified chunks; keep own + background (see
  # header). Chunk-level tags_any → checked via v_chunk_tags_all, i.e.
  # the chunk's own ROLE3 tag, so the role3 cascade must sweep first.
  tags_any: ["ROLE3:own", "ROLE3:background"]
cost_tier: small
context: [section_path, position, title, ref_tags, neighbor_gists_1]
prompt: |
  Does this chunk name something *specific* that has not yet been
  done — material for planning a new experiment or continuing this
  line of work?

  Answer "yes" when the chunk contains any of:

  - a prescribed next step or future direction ("future studies
    should include explicit solvent")
  - a stated open question ("it remains unclear whether...")
  - an untried condition, system, or parameter range ("has not been
    tested above 400 K", "no study has yet addressed X")
  - an acknowledged failure, shortfall, or unmodeled effect ("our
    model does not capture...", "synthesis of the 2D analogue was
    unsuccessful")
  - a negative or null result that leaves the question open
  - an explicitly excluded scope ("beyond the scope of this study")

  Answer "no" when the chunk contains none of these — including
  chunks that only say variants of "further research is needed"
  with NO named question, condition, or direction. A platitude is
  not a lead: the test is whether a reader could start planning an
  experiment from what the chunk names.

  - unknown : the text is prose but you cannot tell.
  - n-a     : not classifiable prose (tables/data fragments,
              publisher boilerplate, equation blocks).

  If the chunk names a specific gap but you are unsure it qualifies,
  prefer "yes" — this axis is deliberately recall-biased.

  Return JSON:
  {"value": "<yes|no|unknown|n-a>", "confidence": <0..1>,
   "rationale": "<one sentence; required if confidence < 0.7>"}
# Few-shot exemplars (synthetic; NOT from the gold set). yes/no QUOTED to
# avoid the YAML 1.1 boolean trap.
examples:
  - text: "The stability of these catalysts above 400 C has not yet been investigated."
    value: "yes"
    why: "names a specific untested condition"
  - text: "Further research is needed to fully understand these systems."
    value: "no"
    why: "platitude with no named question or direction"
  - text: "Our model does not account for solvent effects, which may shift the predicted barriers."
    value: "yes"
    why: "an acknowledged shortfall a reader could act on"
  - text: "These measurements confirm the mechanism proposed in the previous section."
    value: "no"
    why: "closes a question rather than opening one"
