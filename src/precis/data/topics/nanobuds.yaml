slug: nanobuds
description: >
  Carbon nanobuds specifically — the covalent fusion of fullerenes onto a
  carbon-nanotube or graphene sidewall (the "budded" fullerene-on-tube
  hybrid), including their synthesis, electronic/field-emission properties,
  and composites. Deliberately narrow: NOT the wider family of carbon
  nanostructure hybrids (peapods, endohedral tubes, decorated graphene) —
  those belong to a `carbon-nanostructure-hybrids` superclass added later,
  not here.
keywords:
  - nanobud
  - carbon nanobud
sub_tags:
