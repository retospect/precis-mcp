slug: noxrr
description: >
  NOx reduction catalysis — catalytic reduction of nitrogen oxides (NO,
  NO2, N2O) to N2 or NH3, deNOx / SCR chemistry, and the design of
  catalysts (single-metal, alloy, MOF-supported, or otherwise) for
  nitrogen-oxide abatement. NOTE: making NH3 from N2 (nitrogen fixation /
  Haber-Bosch / electrocatalytic NRR) is the separate `nh3-synthesis`
  topic — this topic is only NOx→(N2|NH3). Feeds the existing
  catalyst-discovery quest passively; does not replace its own active
  literature-search tick.
keywords:
