# Eval cases for precis-protein-help (schema: precis.skill_eval.cases).
# MDCrow-family translations (gr608716): fold → put(kind='protein') —
# graded `subtasks:` depth feeds the executed runner's accuracy-by-depth.
# Write-target slugs carry `{run}` so repeated/parallel executed passes
# can't collide; expect/record match re:<slug>-\d+-\d+, fakes use -0-0.
skill: precis-protein-help
cases:
  - id: fold-and-read
    subtasks: 2
    prompt: |
      Fold the insulin A-chain sequence GIVEQCCTSICSLYQLENYCN with the
      stub engine under slug 'eval-insulin-a-{run}', then read it back
      and tell me the mean pLDDT.
    expect:
      calls:
        - verb: put
          kind: protein
          args:
            id: 're:eval-insulin-a-\d+-\d+'
            sequence: GIVEQCCTSICSLYQLENYCN
            engine: stub
        - {verb: get, kind: protein, args: {id: 're:eval-insulin-a-\d+-\d+'}}
      record: {kind: protein, id: 're:eval-insulin-a-\d+-\d+'}
    forbid:
      calls:
        - {verb: put, kind: job}      # put(kind='protein') mints the fold; no ad-hoc job
    fake:
      calls:
        - verb: put
          kind: protein
          args: {id: eval-insulin-a-0-0, sequence: GIVEQCCTSICSLYQLENYCN, engine: stub}
        - {verb: get, kind: protein, args: {id: eval-insulin-a-0-0}}
      record: {kind: protein, id: eval-insulin-a-0-0}
      answer: >
        put(kind='protein', id='eval-insulin-a-0-0', sequence=…,
        engine='stub') folded inline; get read it back — the stub
        reports a constant placeholder pLDDT.

  - id: fold-two-compare
    subtasks: 3
    prompt: |
      Fold two sequences with the stub engine — GIVEQCCTSICSLYQLENYCN as
      'eval-insulin-p-{run}' and FVNQHLCGSHLVEALYLVCG as
      'eval-insulin-q-{run}' — then compare their confidence scores and
      tell me which fold to trust.
    expect:
      calls:
        - {verb: put, kind: protein, args: {id: 're:eval-insulin-p-\d+-\d+', sequence: GIVEQCCTSICSLYQLENYCN}}
        - {verb: put, kind: protein, args: {id: 're:eval-insulin-q-\d+-\d+', sequence: FVNQHLCGSHLVEALYLVCG}}
        - {verb: get, kind: protein, args: {id: 're:eval-insulin-[pq]-\d+-\d+'}}
      record: {kind: protein, id: 're:eval-insulin-q-\d+-\d+'}
    fake:
      calls:
        - {verb: put, kind: protein, args: {id: eval-insulin-p-0-0, sequence: GIVEQCCTSICSLYQLENYCN, engine: stub}}
        - {verb: put, kind: protein, args: {id: eval-insulin-q-0-0, sequence: FVNQHLCGSHLVEALYLVCG, engine: stub}}
        - {verb: get, kind: protein, args: {id: eval-insulin-p-0-0}}
        - {verb: get, kind: protein, args: {id: eval-insulin-q-0-0}}
      record: {kind: protein, id: eval-insulin-q-0-0}
      answer: >
        Both folded; the stub reports the same constant pLDDT for both,
        so neither is to be trusted over the other — the stub is a
        substrate check, not a real predictor.

  - id: fold-pull-cif
    subtasks: 2
    prompt: |
      Fold GIVEQCCTSICSLYQLENYCN as 'eval-insulin-cif-{run}' (stub
      engine) and pull the raw mmCIF structure for it.
    expect:
      calls:
        - {verb: put, kind: protein, args: {id: 're:eval-insulin-cif-\d+-\d+'}}
        - {verb: get, kind: protein, args: {id: 're:eval-insulin-cif-\d+-\d+', view: cif}}
    fake:
      calls:
        - {verb: put, kind: protein, args: {id: eval-insulin-cif-0-0, sequence: GIVEQCCTSICSLYQLENYCN, engine: stub}}
        - {verb: get, kind: protein, args: {id: eval-insulin-cif-0-0, view: cif}}
      record: null
      answer: >
        view='cif' on the protein returns the predicted structure as
        mmCIF text, per-atom pLDDT in the B-factor column.

  - id: fold-project-viewer
    subtasks: 3
    prompt: |
      Fold GIVEQCCTSICSLYQLENYCN as 'eval-insulin-view-{run}' (stub
      engine), project the fold into the shared 3D structure viewer, and give me
      the structure handle it landed on.
    expect:
      calls:
        - {verb: put, kind: protein, args: {id: 're:eval-insulin-view-\d+-\d+'}}
        - {verb: get, kind: protein, args: {id: 're:eval-insulin-view-\d+-\d+', view: structure}}
    forbid:
      calls:
        - {verb: put, kind: structure}  # projection is a get view, not a hand-built design
    fake:
      calls:
        - {verb: put, kind: protein, args: {id: eval-insulin-view-0-0, sequence: GIVEQCCTSICSLYQLENYCN, engine: stub}}
        - {verb: get, kind: protein, args: {id: eval-insulin-view-0-0, view: structure}}
      record: null
      answer: >
        view='structure' projects the fold into a structure ref named
        eval-insulin-view-0-0-fold, linked back via has-fold-structure —
        idempotent on a second call.

  - id: fold-tag-find
    subtasks: 3
    prompt: |
      Fold GIVEQCCTSICSLYQLENYCN as 'eval-insulin-tag-{run}' (stub
      engine), tag it 'eval-fold' so the run is findable, then read the protein
      back to confirm the tag stuck.
    expect:
      calls:
        - {verb: put, kind: protein, args: {id: 're:eval-insulin-tag-\d+-\d+'}}
        - {verb: tag, kind: protein, args: {id: 're:eval-insulin-tag-\d+-\d+', add: 're:.*eval-fold.*'}}
        - {verb: get, kind: protein, args: {id: 're:eval-insulin-tag-\d+-\d+'}}
      record: {kind: protein, id: 're:eval-insulin-tag-\d+-\d+'}
    fake:
      calls:
        - {verb: put, kind: protein, args: {id: eval-insulin-tag-0-0, sequence: GIVEQCCTSICSLYQLENYCN, engine: stub}}
        - {verb: tag, kind: protein, args: {id: eval-insulin-tag-0-0, add: [eval-fold]}}
        - {verb: get, kind: protein, args: {id: eval-insulin-tag-0-0}}
      record: {kind: protein, id: eval-insulin-tag-0-0}
      answer: >
        Folded, tagged eval-fold, and read back — the tag is on the
        protein.
