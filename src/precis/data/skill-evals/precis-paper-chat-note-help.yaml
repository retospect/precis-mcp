# Eval cases for precis-paper-chat-note-help (schema: precis.skill_eval.cases).
skill: precis-paper-chat-note-help
cases:
  - id: one-author
    prompt: |
      Post a chat note for pa9001 to the reading channel — it's a
      single-author paper.
    expect:
      calls:
        - {verb: get, kind: paper, args: {id: "pa9001", view: chat}}
    forbid:
      calls:
        - {verb: search, kind: web}
      text: ["this paper", "et al"]
    fake:
      calls:
        - {verb: get, kind: paper, args: {id: "pa9001", view: chat}}
      record: null
      answer: >
        get(kind='paper', id='pa9001', view='chat') — one author renders
        as the bare name on line 2; write line 1 from the abstract it
        prints below the separator, keep the byline and the DOI URL
        verbatim.

  - id: two-authors
    prompt: |
      Share pa9002 into chat as a note — it has exactly two authors.
    expect:
      calls:
        - {verb: get, kind: paper, args: {id: "pa9002", view: chat}}
    forbid:
      calls:
        - {verb: search, kind: web}
      text: ["this paper", "et al"]
    fake:
      calls:
        - {verb: get, kind: paper, args: {id: "pa9002", view: chat}}
      record: null
      answer: >
        get(kind='paper', id='pa9002', view='chat') — two authors render
        as "A & B" on line 2; line 1 is the terse novelty summary
        written from the abstract under the separator.

  - id: many-authors
    prompt: |
      Drop bufformer23 into the channel as a chat note.
    expect:
      calls:
        - {verb: get, kind: paper, args: {id: "bufformer23", view: chat}}
    forbid:
      calls:
        - {verb: search, kind: web}
      text: ["this paper", "et al"]
    fake:
      calls:
        - {verb: get, kind: paper, args: {id: "bufformer23", view: chat}}
      record: null
      answer: >
        Generative ML builds the buffer tree and sizes/locates buffers in
        one pass — no Steiner-tree step, up to 160x faster on large nets
        Rongjian Liang … Haoxing Ren
        https://doi.org/10.1145/3566097.3567900
        (more than two authors: first … last on line 2, DOI as URL on
        line 3.)

  - id: arxiv-no-doi
    prompt: |
      Post a chat note for vaswani17 — I think it's arXiv-only, no DOI.
    expect:
      calls:
        - {verb: get, kind: paper, args: {id: "vaswani17", view: chat}}
    forbid:
      calls:
        - {verb: search, kind: web}
      text: ["this paper"]
    fake:
      calls:
        - {verb: get, kind: paper, args: {id: "vaswani17", view: chat}}
      record: null
      answer: >
        Attention alone does sequence transduction — the Transformer drops
        recurrence and convolution, trains faster, beats prior translation scores
        Ashish Vaswani … I. Polosukhin
        https://arxiv.org/abs/1706.03762
        (no DOI on file: the locator falls back to the arXiv abs URL —
        or the publisher URL, or the literal 'no DOI' when nothing else
        is stored.)

  - id: several-ids
    prompt: |
      Chat notes for vaswani17 and bufformer23, in that order — one
      post covering both.
    expect:
      calls:
        - verb: get
          kind: paper
          args: {id: ["vaswani17", "bufformer23"], view: chat}
    forbid:
      calls:
        - {verb: get, kind: paper, args: {id: "vaswani17"}}
        - {verb: search, kind: web}
      text: ["this paper"]
    fake:
      calls:
        - verb: get
          kind: paper
          args: {id: ["vaswani17", "bufformer23"], view: chat}
      record: null
      answer: >
        One call with id=[...] renders one block per id in the given
        order — write each line 1 from that block's abstract, keep one
        blank line between papers.
