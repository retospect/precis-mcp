# Eval cases for precis-structure-help (schema: precis.skill_eval.cases).
# MDCrow-family translations (gr608716): MD → put(kind='structure',
# mode='md'), RMSD → get(view='diff') — graded `subtasks:` depth feeds
# the executed runner's accuracy-by-depth. Write-target slugs carry
# `{run}` so repeated/parallel executed passes can't collide; expect and
# record match re:<slug>-\d+-\d+, fakes declare the dry-run -0-0 form.
skill: precis-structure-help
cases:
  - id: build-slab-read
    subtasks: 2
    prompt: |
      Build a structure 'eval-slab-{run}': a 2×2×2 Pt(111) slab with a
      10 Å vacuum gap using the slab op. Then read it back and tell me
      how many atoms it holds.
    expect:
      calls:
        - {verb: put, kind: structure, args: {id: 're:eval-slab-\d+-\d+', text: 're:.*slab.*'}}
        - {verb: get, kind: structure, args: {id: 're:eval-slab-\d+-\d+'}}
      record: {kind: structure, id: 're:eval-slab-\d+-\d+'}
    fake:
      calls:
        - verb: put
          kind: structure
          args:
            id: eval-slab-0-0
            text: '{"ops": [{"op": "slab", "element": "Pt", "size": [2, 2, 2], "vacuum": 10}]}'
        - {verb: get, kind: structure, args: {id: eval-slab-0-0}}
      record: {kind: structure, id: eval-slab-0-0}
      answer: >
        put(kind='structure', id='eval-slab-0-0', text=<cell+slab op
        JSON>) builds the slab and echoes the TOC — 8 Pt atoms.

  - id: md-run-poll
    subtasks: 3
    prompt: |
      Build structure 'eval-md-{run}' as a 2-layer 2×2 Pt(111) slab
      (slab op, 10 Å vacuum), then start a 200-step EMT NVT run at 300 K
      on it and show me the run's status.
    expect:
      calls:
        - {verb: put, kind: structure, args: {id: 're:eval-md-\d+-\d+', text: 're:.*slab.*'}}
        - verb: put
          kind: structure
          args:
            id: 're:eval-md-\d+-\d+'
            mode: md
            args: {fidelity: emt, steps: 200, temperature_k: 300}
        - {verb: get, kind: structure, args: {id: 're:eval-md-\d+-\d+', view: md}}
    forbid:
      calls:
        - {verb: edit, kind: structure, args: {mode: md}}  # an MD run is a put, never an edit
        - {verb: put, kind: job}
    fake:
      calls:
        - {verb: put, kind: structure, args: {id: eval-md-0-0, text: '{"ops": [{"op": "slab", "element": "Pt", "size": [2, 2, 2], "vacuum": 10}]}'}}
        - {verb: put, kind: structure, args: {id: eval-md-0-0, mode: md, args: {fidelity: emt, steps: 200, temperature_k: 300}}}
        - {verb: get, kind: structure, args: {id: eval-md-0-0, view: md}}
      record: null
      answer: >
        put(kind='structure', id='eval-md-0-0', mode='md',
        args={fidelity: 'emt', steps: 200, temperature_k: 300}) mints
        the struct_md_runs row + job and returns; get(view='md') polls
        it.

  - id: relax-then-diff
    subtasks: 4
    prompt: |
      Build the same 2×2×2 Pt(111) slab twice — 'eval-r0-{run}' and
      'eval-r1-{run}' (slab op, 10 Å vacuum). Relax 'eval-r1-{run}' at
      the clean fidelity, then diff 'eval-r1-{run}' against
      'eval-r0-{run}' and report the RMSD.
    expect:
      calls:
        - {verb: put, kind: structure, args: {id: 're:eval-r0-\d+-\d+'}}
        - {verb: put, kind: structure, args: {id: 're:eval-r1-\d+-\d+'}}
        - {verb: edit, kind: structure, args: {id: 're:eval-r1-\d+-\d+', ops: 're:.*relax.*'}}
        - {verb: get, kind: structure, args: {id: 're:eval-r1-\d+-\d+', view: diff, args: {other: 're:eval-r0-\d+-\d+'}}}
    forbid:
      calls:
        - {verb: edit, kind: structure, args: {id: 're:eval-r0-\d+-\d+'}}  # the reference stays unrelaxed
    fake:
      calls:
        - {verb: put, kind: structure, args: {id: eval-r0-0-0, text: '{"ops": [{"op": "slab", "element": "Pt", "size": [2, 2, 2], "vacuum": 10}]}'}}
        - {verb: put, kind: structure, args: {id: eval-r1-0-0, text: '{"ops": [{"op": "slab", "element": "Pt", "size": [2, 2, 2], "vacuum": 10}]}'}}
        - {verb: edit, kind: structure, args: {id: eval-r1-0-0, ops: [{op: relax, fidelity: clean}]}}
        - {verb: get, kind: structure, args: {id: eval-r1-0-0, view: diff, args: {other: eval-r0-0-0}}}
      record: null
      answer: >
        get(view='diff', args={other: 'eval-r0-0-0'}) reports RMSD,
        per-atom move and bonds broken/formed between the relaxed copy
        and the reference.

  - id: adsorbate-then-probe
    subtasks: 4
    prompt: |
      Build 'eval-ads-{run}' as a 2-layer 2×2 Pt(111) slab (10 Å
      vacuum), put an O adsorbate on a top site of the slab, relax it at
      the clean fidelity, then report the O atom's point-of-view
      neighbourhood.
    expect:
      calls:
        - {verb: put, kind: structure, args: {id: 're:eval-ads-\d+-\d+', text: 're:.*add_adsorbate.*'}}
        - {verb: edit, kind: structure, args: {id: 're:eval-ads-\d+-\d+', ops: 're:.*relax.*'}}
        - {verb: get, kind: structure, args: {id: 're:eval-ads-\d+-\d+', view: pov}}
      record: {kind: structure, id: 're:eval-ads-\d+-\d+'}
    fake:
      calls:
        - {verb: put, kind: structure, args: {id: eval-ads-0-0, text: '{"ops": [{"op": "slab", "element": "Pt", "size": [2, 2, 2], "vacuum": 10}, {"op": "add_adsorbate", "species": "O", "site": {"type": "top"}}]}'}}
        - {verb: edit, kind: structure, args: {id: eval-ads-0-0, ops: [{op: relax, fidelity: clean}]}}
        - {verb: get, kind: structure, args: {id: eval-ads-0-0, view: pov, args: {support: aO1, reach: 3.0}}}
      record: {kind: structure, id: eval-ads-0-0}
      answer: >
        view='pov' on the O label returns i_am / i_include / i_touch —
        the adsorbate's local neighbourhood, nearest-first.

  - id: export-poscar
    subtasks: 2
    prompt: |
      Build 'eval-export-{run}' as a 2×2×1 Cu(111) slab (slab op, 10 Å
      vacuum) and export it as a POSCAR.
    expect:
      calls:
        - {verb: put, kind: structure, args: {id: 're:eval-export-\d+-\d+'}}
        - {verb: get, kind: structure, args: {id: 're:eval-export-\d+-\d+', view: poscar}}
    forbid:
      text: ["VESTA", "pymatgen"]   # the export view writes it; no external tooling
    fake:
      calls:
        - {verb: put, kind: structure, args: {id: eval-export-0-0, text: '{"ops": [{"op": "slab", "element": "Cu", "size": [2, 2, 1], "vacuum": 10}]}'}}
        - {verb: get, kind: structure, args: {id: eval-export-0-0, view: poscar}}
      record: null
      answer: >
        get(kind='structure', id='eval-export-0-0', view='poscar')
        emits the VASP POSCAR text directly.

  - id: md-trajectory-read
    subtasks: 3
    prompt: |
      Start a 100-step EMT NVT run at 300 K on 'eval-md-{run}' (it
      exists: a Pt slab built earlier in this run), list the runs on
      it, then pull run 1's trajectory frames.
    expect:
      calls:
        - {verb: put, kind: structure, args: {id: 're:eval-md-\d+-\d+', mode: md}}
        - {verb: get, kind: structure, args: {id: 're:eval-md-\d+-\d+', view: md, args: {trajectory: true}}}
    fake:
      calls:
        - {verb: put, kind: structure, args: {id: eval-md-0-0, mode: md, args: {fidelity: emt, steps: 100, temperature_k: 300}}}
        - {verb: get, kind: structure, args: {id: eval-md-0-0, view: md}}
        - {verb: get, kind: structure, args: {id: eval-md-0-0, view: md, args: {run: 1, trajectory: true}}}
      record: null
      answer: >
        get(view='md', args={run: 1, trajectory: true}) returns the
        run's extXYZ frames.
