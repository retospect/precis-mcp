# Discovery eval task for the paper family (gr634773): phrased WITHOUT
# skill names — the discovery condition sees only the task and the tool
# surface. Two wording variants limit overfitting.
family: paper
skill: precis-paper-help
tasks:
  - id: abstract-by-doi
    variants:
      - |
        Fetch the abstract for DOI 10.1038/nature10352 from my paper
        store.
      - |
        What does the paper 10.1038/nature10352 say in its abstract? Pull
        it from precis.
    expect:
      calls:
        - verb: get
          kind: paper
          args: {id: '10.1038/nature10352', view: abstract}
    forbid:
      calls:
        - {verb: search, kind: web}                        # the paper is held
      text: ["SELECT "]
    fake:
      calls:
        - verb: get
          kind: paper
          args: {id: '10.1038/nature10352', view: abstract}
      record: null
      answer: >
        get(kind='paper', id='10.1038/nature10352', view='abstract') —
        a DOI resolves via metadata; no web detour.
