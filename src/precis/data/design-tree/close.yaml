        push-push-and-slide:
          id: close/latches/push-push-and-slide
          role: leaf
          coverage: deep
          implies:
            class: prismatic
          summary: Push-push touch latch retains only; a dovetail or plain rail guides and carries load and independent end
            stops define the positions. Printed rails need coupon-tuned clearance and wear strips.
          when:
          - handle-free short-travel lid, light loads, clean dry indoor use
          - rail carries service load, latch only retains
          - low quantity FDM prototype with PETG and a bought latch
          avoid_when:
          - 'structural shear, pressure, vibration, large cantilever moment: use draw latch'
          - lid must never detach without end stop or captive rail
          - grit, water, UV, heat, abrasive environment for printed dovetails
          - metrology-grade positioning without adjustable gib
          variants:
          - magnetic touch latch
          - non-magnetic mechanical touch latch
          - push-to-open ejector
          - push-to-close
          - ball or roller detent catch
          - over-centre draw latch (alternative)
          - plain rail
          - dovetail rail
          - adjustable-gib dovetail
          - ball or crossed-roller slide
          tradeoffs:
          - 'vs magnetic catch plus plain slide: more positive, but alignment-sensitive'
          - 'vs draw latch plus rails: touch opening but no clamp or seal force'
          - 'printed dovetail: cheap and custom but creeps, wears, scatters in size'
          howto:
          - Let the rail constrain motion, hard stops set open and closed, the latch only retains and releases.
          - Give the striker a lead-in and a floating or adjustable mount.
          - Specify clearance per flank; start dovetails at 0.15-0.20 mm per flank on FDM and tune on a coupon.
          - Reduce contact length, add relief grooves, clean-out slots and replaceable wear strips.
          - Constrain one rail accurately, relieve the other.
          - Mount the latch on a plate or heat-set inserts, not thin printed wall.
          - Use PETG not PLA; design for service temperature, not nozzle temperature.
          issues:
          - issue: latch used as stop
            fix: separate positive stops
            failure_mode: overload
          - issue: no lead-in at striker
            fix: chamfer plus adjustable striker
            failure_mode: assembly-error
          - issue: zero clearance in printed rail
            fix: coupon in real material and orientation, start 0.3 mm
            failure_mode: assembly-error
          - issue: total clearance mistaken for per-flank
            fix: state per flank
            failure_mode: assembly-error
          - issue: grit trapped in blind groove
            fix: clean-out slots and wipers
            failure_mode: wear-fretting
          - issue: over-constrained parallel rails
            fix: one located, one relieved or adjustable
            failure_mode: excess-deflection
          - issue: spring printed across layer weak plane
            fix: bend in filament plane or metal spring
            failure_mode: fatigue
          - issue: thin latch boss crushed by screw
            fix: backing plate or heat-set inserts
            failure_mode: creep-preload-loss
          axes:
            locking: 'relevant: touch latch is the lock; secondary retention for safety'
            captive: 'relevant: end stop or captive rail so lid cannot detach'
            corrosion: 'relevant: springs, rails, magnets in humid service'
            bearing-face: 'relevant: dovetail flanks wear; gib adjusts play'
            material-direction: 'relevant: FDM: spring and rail loads within layers'
