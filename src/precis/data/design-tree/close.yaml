        magnetic-catch:
          id: close/latches/magnetic-catch
          role: leaf
          coverage: shallow
          implies:
            class: rigid
            mechanism: magnet
          summary: Magnet plus steel strike gives quiet low-load closure, strongly gap- and direction-sensitive; add a mechanical
            datum and stop, capture the magnet mechanically, and do not rely on glue or catalog pull.
          when:
          - modest normal pull, quiet compact closure, frequent opening without handle
          - wood, plastic, glass or printed part where only a steel target is added
          - low volume where a printed pocket and glued magnet beat a moulded latch
          avoid_when:
          - safety-critical, overhead, strong vibration
          - dominant load is shear, peel or shock
          - strike is austenitic stainless or aluminium
          - tight release force or positional precision needed
          - temperature beyond magnet grade, corrosive moisture
          variants:
          - bare disc or block plus steel washer
          - pot or cup magnet
          - surface-mount cabinet catch
          - recessed magnet and strike
          - floating pinned catch
          - touch-to-open latch
          - catch with non-magnetic shim
          - magnet pair
          tradeoffs:
          - 'vs ball catch: quieter, but weak in shear and sensitive to gap'
          - 'vs draw latch: no clamp force or vibration resistance'
          - 'vs snap fit: no printed cantilever fatigue, but adds magnet and strike parts'
          howto:
          - Size from measured pull on the finished assembly at worst-case gap, with safety factor at least 2 (3-5 under vibration).
          - Capture the magnet in the pull direction with a lip, dovetail or cap; glue is not the only retainer.
          - Leave 0.2-0.4 mm pocket allowance and glue with two-part epoxy after degreasing.
          - Use low-carbon steel strike, around twice magnet width.
          - 'Keep the real gap small: skins, paint, tape count as air gap.'
          - Add a stop so the strike never hits the brittle magnet.
          - Add a shoulder or hook for shear loads.
          - Use PETG, ASA or PC, not PLA, in warm or outdoor service.
          issues:
          - issue: magnet sized from catalog pull alone
            fix: test finished assembly, apply safety factor
            failure_mode: overload
          - issue: nonmagnetic stainless or aluminium strike
            fix: low-carbon steel strike
            failure_mode: assembly-error
          - issue: printed wall or paint between magnet and strike
            fix: recess both, control the gap
            failure_mode: overload
          - issue: tight zero-clearance pocket
            fix: 0.2-0.4 mm allowance, lead-in chamfer
            failure_mode: brittle-fracture
          - issue: glue the only retention
            fix: lip, dovetail, cap or washer
