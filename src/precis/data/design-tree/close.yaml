        living-hinge:
          id: close/hinged/living-hinge
          role: leaf
          coverage: deep
          implies:
            class: compliant
            mechanism: integral
          summary: Integral thin web hinge, ideal in injection-moulded polypropylene at 0.25-0.35 mm; on desktop FDM it is
            a prototype or low-cycle feature (TPU strap, PETG short life), never a structural pivot.
          when:
          - injection-moulded PP or PE, high quantity, hinge and body one part
          - low load, slow motion, separability unimportant
          - desktop FDM prototype or low cycle count (PETG, PP with tuning, TPU strap)
          avoid_when:
          - radial, cantilever or impact load on the hinge
          - tight angular location or controlled holding torque
          - PLA, glass-filled or stiff engineering plastics flexed repeatedly
          - lid must be replaceable or service life must be predictable
          - severe UV, oxidising chemicals or hot wet service without tested PP grade
          variants:
          - integral thin-web
          - recessed or offset web
          - flat-land hinge
          - tapered or curved FDM flexure
          - TPU strap hinge
          - pin-and-leaf (alternative)
          - friction or detent hinge (alternative)
          tradeoffs:
          - 'vs pin hinge: no assembly and cheap at volume, but permanent, low load and low precision'
          - 'vs TPU strap: better defined motion, less creep, but needs PP and moulding'
          - 'vs snap fit: true rotation, but snap arms also fatigue'
          howto:
          - 'Keep the web thin and radiused into the body: 0.25-0.35 mm for high-cycle PP.'
          - Recess the web so the closed lid does not pinch the fold.
          - Gate so melt crosses the hinge perpendicular to its axis, no weld line at the web.
          - Flex the part 2-3 times right after moulding.
          - Add a broad hard stop and a latch; the hinge carries no load.
          - On FDM print the flexure flat so bending is in the layer plane, 0.4-0.6 mm, at least 2 layers.
          - Split hinges longer than 150 mm into sections.
          - Life-test at full angle, rate, temperature.
          issues:
          - issue: web too thick
            fix: reduce toward 0.25-0.35 mm for PP
            failure_mode: fatigue
          - issue: sharp transition into body
            fix: 0.8 mm blend radii or larger
            failure_mode: fatigue
          - issue: hinge pinched when closing
            fix: recess web, leave relief gap
            failure_mode: overload
          - issue: weld line or flow along hinge axis
            fix: gate so flow crosses the hinge
            failure_mode: brittle-fracture
          - issue: no stop, user over-opens
            fix: broad supported stop away from hinge line
            failure_mode: overload
          - issue: FDM flexure bends across layer bonds
            fix: print flat, bend within layers
            failure_mode: fatigue
          - issue: PETG treated as production PP
            fix: PETG for prototypes only, PP for production
            failure_mode: fatigue
          - issue: hinge carries sustained lid load hot
            fix: support lid elsewhere, test at max temperature
            failure_mode: creep-preload-loss
          axes:
            locking: 'n/a: latch is separate'
            captive: 'n/a: integral'
            corrosion: 'n/a: polymer; chemical attack and UV apply'
            bearing-face: 'n/a: no sliding face'
            material-direction: 'relevant: flow direction in moulding, layer plane in FDM'
          rules:
          - id: a1
            text: Gate so melt flows perpendicular to the hinge line; no weld line at the web
            value: perpendicular
            unit: null
