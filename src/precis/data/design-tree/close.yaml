        stay-detent-stop:
          id: close/hinged/stay-detent-stop
          role: leaf
          coverage: shallow
          summary: 'Keep the hinge off the stop load: a broad external hard stop or stay carries the over-travel, a friction,
            detent or spring element supplies feel, and a latch holds closed.'
          when:
          - 'heavy lid, shock load or defined maximum angle: separate stay or hard stop'
          - 'several repeatable angles: detent or cam'
          - 'arbitrary angles, light lid: friction or torque hinge'
          - 'heavy lid assist: torsion spring or gas strut'
          avoid_when:
          - friction alone holds a heavy, dirty, hot or safety-critical lid open
          - hinge pin, thin knuckle or printed layer interface is the impact stop
          - slender polymer stay under sustained load (creep)
          - gas strut where cold, leakage or compact packaging matter
          variants:
          - fixed-angle stay
          - folding over-centre stay
          - telescoping stay
          - removable stay
          - strap or cable stay
          - friction stay
          - ball or spring-plunger detent
          - cam-and-follower detent
          - integrated hinge stop
          - external hard stop
          - spring-assisted stay
          - damped stop
          tradeoffs:
          - 'friction hinge: continuous but torque drifts with wear and contamination, can spring lid back'
          - 'detent: tactile and repeatable but wears and rounds off'
          - 'hard stop: repeatable but impact and noise'
          - 'spring assist: less effort but fatigue and stored energy'
          howto:
          - Compute lid moment M = m*g*r*cos(theta) about the hinge axis.
          - Size friction or hold torque near 1.5-2 times static moment for a nudge, then measure.
          - Place the hard stop at large radius from the pivot, wide, on a rib or frame, not on the hinge barrel.
          - Add a damper or elastomer bumper if the lid arrives at speed.
          - Pair friction hinges with a positive latch or catch for closure.
          - Use a metal pin and sleeve for a long-life printed pivot, 0.3 mm initial clearance.
          - Fit a secondary stay or lock wherever a falling lid could injure.
          issues:
          - issue: hinge pin used as over-travel stop
            fix: separate stop or stay into broad housing ribs
            failure_mode: overload
          - issue: stop on thin rib or sharp corner
            fix: wider contact, radius, gussets, larger radius from pivot
            failure_mode: impact
          - issue: sized for static weight only
            fix: include acceleration, impact, wind, seal force, one-sided load
            failure_mode: overload
          - issue: friction treated as constant
            fix: specify min and max torque, temperature, cycle life
            failure_mode: wear-fretting
          - issue: friction used to keep lid closed
            fix: add latch, magnet or catch
            failure_mode: assembly-error
          - issue: several hinges over-constrain axis
            fix: one axial location, others float
            failure_mode: thermal-mismatch
          - issue: spring legs with sharp bends
            fix: generous bend radii, protect surface
            failure_mode: fatigue
          - issue: hold-open lost by rounded detent or leaking strut
            fix: positive secondary stay or lock
            failure_mode: wear-fretting
          axes:
            locking: 'relevant: stay lock or over-centre to hold open'
            captive: 'n/a: stay and stop hardware stays fixed to the lid'
            corrosion: 'relevant: seized pivots and spring cracks from moisture'
            bearing-face: 'relevant: stop contact width and radius'
            material-direction: 'relevant: FDM: stop and clevis loads in filament plane'
          rules:
          - id: c1
            text: Maximum lid moment about the hinge = lid mass x 9.80665 x distance from the hinge axis to the lid's centre
              of gravity (Sugatsune); the moment falls with the cosine of the lid angle from horizontal
            value: m*g*r
            unit: null
            source_url: https://www.sugatsune.com/content/site-assets/300_PDF/136.pdf
            source_quality: primary
            equipment: any
            confidence: handbook
            note: m*g*r is in the Sugatsune sheet; the cosine factor is plain geometry and not in the source
          - id: c2
            text: Friction hinge margin about 1.5-2 times static moment for a nudge
            value: 1.5-2
            unit: x static moment
            source_url: https://www.projects-house.com/articles/mechanical-engineering/hinge-and-folding-mechanism-design/
            source_quality: secondary
            equipment: any
            confidence: secondary
