    threaded-and-twist:
      id: close/threaded-and-twist
      role: method
      def: 'lids closed by turning: screw caps, bayonets, quarter-turn fasteners'
      children:
        screw-cap:
          id: close/threaded-and-twist/screw-cap
          role: leaf
          coverage: deep
          implies:
            class: rigid
          summary: Helical thread closure with repeatable seal and adjustable clamp. Container finishes (400/410/415, buttress,
            M-profile) set turns of engagement; on desktop FDM use coarse rounded threads, M6 or larger, or metal inserts.
          when:
          - repeated opening with liner or seal compression
          - moderate axial load and torque
          - tough PP or HDPE closures in volume
          - coarse printed threads on light-duty lids
          avoid_when:
          - instant, tamper-evident or snap opening
          - zero backlash or high stiffness under cyclic load
          - fine thread in desktop FDM or frequent removal of printed threads
          - brittle or creep-sensitive material with solvents or heat
          variants:
          - continuous single-start
          - multi-start
          - buttress / L-profile
          - modified buttress / M-profile
          - V-thread / ISO metric / Unified
          - lug or interrupted thread
          - tapered pipe thread
          - printed custom plastic thread
          tradeoffs:
          - 'vs snap: controlled compression, but slower'
          - 'vs bayonet: continuous sealing travel, more turns'
          - 'vs lug: higher pull-off resistance, slower'
          - 'vs press fit: controlled removal torque'
          - 'vs heat-set insert: printed thread cheaper, wears faster'
          howto:
          - 'Specify full thread: pitch, lead, hand, start count and profile on both parts; match container finish series,
            not only diameter.'
          - Treat the thread as retention and design the seal separately with a stop, liner or O-ring.
          - Check worst-case cap-high/neck-low stacks so the seal seats before the thread bottoms.
          - Round crests and roots, add entry chamfer, keep runout out of the engaged zone.
          - On FDM print the thread axis vertical, use coarse pitch, size at M6 or larger, and start with 0.20 to 0.25 mm
            clearance.
          - Use an insert or injection-moulded closure for high cycles, torque, pressure or heat.
          issues:
          - issue: same diameter but different finish, e.g. 28/400 vs 28/410
            fix: match series, pitch and profile
            failure_mode: assembly-error
          - issue: thread bottoms before liner seats
            fix: positive axial stop, check tolerance stack
            failure_mode: assembly-error
          - issue: sharp roots and crests
            fix: rounded crest, generous root radius, lead-in
            failure_mode: fatigue
          - issue: pitch too fine for process
            fix: coarser pitch, larger diameter, or metal insert
            failure_mode: overload
          - issue: overtightening to fix a weak seal
            fix: improve liner, land and stop
            failure_mode: overload
          - issue: fine thread printed horizontally
            fix: vertical thread axis, low layer height
            failure_mode: brittle-fracture
          - issue: frequent removal of printed threads
            fix: heat-set insert, captured nut or moulded reinforcement
            failure_mode: wear-fretting
          - issue: vibration loosening
            fix: liner, O-ring, detent, lock ring or thread locker
            failure_mode: loosening
          axes:
            locking: 'relevant: friction only self-locks if friction angle exceeds lead angle; add liner or detent'
            captive: 'n/a: cap is a loose part unless tethered'
            corrosion: 'relevant: metal threads and inserts: galvanic isolation'
            bearing-face: 'relevant: liner and sealing land seat on axial stop'
            material-direction: 'relevant: FDM thread axis vertical'
