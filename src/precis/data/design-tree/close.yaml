        friction-press-lid:
          id: close/snap-and-friction/friction-press-lid
          role: leaf
          coverage: deep
          implies:
            class: rigid
            mechanism: press
          summary: A lid held by radial interference or crush ribs. Fine as a low-load, hand-openable locating joint on tins
            and printed boxes; not a structural press fit and not a seal.
          when:
          - little or no load, only handling or vibration
          - stiff, dimensionally stable parts (tinplate, aluminium, formed lip, low-creep plastic)
          - fast tool-free opening
          - volume that justifies tolerance control
          avoid_when:
          - substantial axial load or torque
          - controlled opening force, child resistant or tamper evident needs
          - thin, brittle or creep-prone plastic rim kept highly stressed
          - pressure-tight or liquid seal without a gasket
          - wide temperature swings or swelling
          variants:
          - plain cylindrical lip
          - external-overlap sleeve
          - internal plug or rim
          - crush-rib fit
          - bead or rolled-rim fit
          - tapered fit
          - annular snap or detent assist
          - magnet-assisted friction lid
          tradeoffs:
          - 'vs slip fit: holds in vibration, but opening force varies'
          - 'vs snap: lower cost, but no positive retention'
          - 'vs thread: quick, but no preload or seal'
          - 'vs hinge plus latch: lid can be lost'
          - 'vs gasketed lid: no sealing'
          howto:
          - Use crush ribs or a short guided lip rather than interference around the whole circumference.
          - Add a lead-in chamfer and a short guide land.
          - Define minimum and maximum interference and check insertion force, pull-off force and wall stress; the fit class
            alone is not a load calculation.
          - Radius or relieve corners on rectangular lids.
          - For FDM start with a guided lip 4 to 8 mm deep, about 0.2 mm per side, and a 0.5 to 1 mm chamfer, then tune with
            a coupon.
          - Add a detent, latch or magnet where vibration, heat or sustained load can exceed friction.
          issues:
          - issue: nominal press fit with no worst-case tolerance analysis
            fix: define min and max interference and verify forces
            failure_mode: assembly-error
          - issue: full-circumference heavy interference
            fix: lighter fit or discrete crush ribs
            failure_mode: overload
          - issue: no lead-in
            fix: chamfer or radius at entry
            failure_mode: assembly-error
          - issue: long tight engagement jams
            fix: short guided engagement
            failure_mode: assembly-error
          - issue: thin unsupported skirt
            fix: skirt about wall thickness plus bead or backing flange
            failure_mode: excess-deflection
          - issue: interference relaxes in plastic over time or heat
            fix: ribs that flex locally, lower-creep material, positive detent
            failure_mode: creep-preload-loss
          - issue: friction fit assumed airtight
            fix: add gasket or compression seal
            failure_mode: environmental-degradation
          - issue: isotropic print assumption
            fix: orient critical skirt dimensions in stable direction, compensate elephant foot, use coupon
            failure_mode: assembly-error
