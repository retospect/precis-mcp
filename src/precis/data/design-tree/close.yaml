        bayonet:
          id: close/threaded-and-twist/bayonet
          role: leaf
          coverage: deep
          implies:
            class: rigid
          summary: Lugs slide axially into L-slots and turn a fraction of a turn into a detent; fast, positive, repeatable.
            Low to medium axial load; ramps give preload; seal must sit on a stationary land.
          when:
          - frequent tool-free access with positive end stop
          - low to medium axial load shared by several lugs
          - tough metal or reinforced plastic lugs
          - connector-style sealed closures
          avoid_when:
          - high tensile, pressure, bending or torque load
          - fine preload adjustment needed (threads better)
          - abrasive dirt, icing or large thermal swings without clearance
          - thin FDM lugs across weak layers
          variants:
          - plain L-slot
          - ramp or helical bayonet
          - detented L-slot
          - J-slot with reverse hook
          - spring-loaded bayonet
          - two, three or four lugs
          - child-resistant push-and-turn
          - ring bayonet for large closures
          tradeoffs:
          - 'vs thread: faster, positive stop, but lower load and preload control'
          - 'vs snap: positive retention, but needs rotation'
          - 'vs quarter-turn fastener: can be integral to the lid, no rated hardware'
          - 'vs clamp: compact, but less tolerant of large seals'
          howto:
          - Use symmetric lugs, two to four, with a lead-in chamfer and rounded slot corners.
          - Keep the entry clearance larger than the final seating clearance, and do not use detent clearance as running clearance.
          - Make a defined detent pocket with a controlled flank, not a shallow bump.
          - Make lugs short and thick; check shear, bearing, root bending, shell ligament and detent contact pressure.
          - Keep the O-ring or gasket on a stationary land, not in the sliding track.
          - On FDM use at least 0.3 mm moving clearance, split parts to avoid severe overhangs, and print a coupon.
          issues:
          - issue: slot too tight
            fix: running clearance, coupon test
            failure_mode: assembly-error
          - issue: slot too loose
            fix: ramp, spring or controlled detent
            failure_mode: wear-fretting
          - issue: detent too shallow
            fix: defined pocket and detent flank
            failure_mode: loosening
          - issue: sharp slot corner
            fix: radius at least 0.5 mm in small joints
            failure_mode: fatigue
          - issue: lug carries bending
            fix: short thick lug supported near root
            failure_mode: overload
          - issue: no positive stop
            fix: hard stop, lock mark or tactile detent
            failure_mode: assembly-error
          - issue: seal dragged in track
            fix: stationary sealing land
            failure_mode: environmental-degradation
          - issue: unsupported slot roof sags in FDM
            fix: reorient, split part or chamfer roof
            failure_mode: assembly-error
          - issue: lugs aligned across weak FDM layers
            fix: orient load in-plane, thicker fillets
            failure_mode: brittle-fracture
          axes:
            locking: 'relevant: detent, J-hook or spring preload resist back-out'
            captive: 'n/a: closure without captive hardware'
            corrosion: 'relevant: metal lug/track: galvanic isolation, coatings'
            bearing-face: 'relevant: lug bearing on slot wall and ramp'
            material-direction: 'relevant: FDM lugs'
          rules:
          - id: c1
