        annular-snap-cap:
          id: close/snap-and-friction/annular-snap-cap
          role: leaf
          coverage: deep
          implies:
            class: rigid
            mechanism: snap
            rank: 3
          summary: A continuous bead on a cap snaps into a groove around the whole circumference. Even retention for round
            lids, but the whole ring strains on assembly and the undercut complicates the mould.
          when:
          - round cap or lid, axial pull-off or light radial load
          - fast push-on assembly, occasional removal
          - tough thermoplastic (PP, PE, POM, PA) in volume
          - retention distributed around the circumference
          avoid_when:
          - high structural, pressure or shock load
          - permanent, tamper-evident or child-resistant unless release is designed
          - tight axial location or sealing preload without a seal or datum
          - brittle or highly reinforced plastic
          - simple two-plate mould with a true cross-parting undercut
          variants:
          - external bead into internal groove
          - internal bead onto external groove
          - continuous ring
          - split ring (axial gaps)
          - flexible skirt or bell-mouth cap
          - multiple beads
          - tamper-evident band
          - child-resistant indexed closure
          tradeoffs:
          - 'vs thread: faster but lower retention and no preload'
          - 'vs bayonet: no rotation needed, but less positive'
          - 'vs cantilever snap: even retention, but higher insertion force and harder to mould'
          - 'vs press fit: positive retention, but needs undercut'
          - 'vs adhesive or weld: serviceable but not sealed'
          howto:
          - Fix pull-off load, insertion and removal force, cycle count and environment first, then choose lead and return
            angles.
          - Round the bead and groove corners; keep the root fillet ratio R/t at least 0.5.
          - Size the undercut from allowable hoop strain of the material at service temperature; use an axisymmetric or nonlinear
            check for thick or thin rings.
          - Put the feature on the line of draw or choose flex ejection, split ring, lifter, slide or collapsible core.
          - Dimension bead, groove, ovality and wall thickness together and check worst-case parts.
          - For FDM, use a ductile filament, print a ring-and-groove coupon and tune the CAD clearance.
          issues:
          - issue: sharp bead or groove corners
            fix: radius bead and root, R/t at least 0.5
            failure_mode: fatigue
          - issue: too much radial interference
            fix: reduce undercut, lengthen or thin the skirt, add lead-in
            failure_mode: overload
          - issue: too little engagement
            fix: increase return-face engagement, add second bead, or use thread or bayonet
            failure_mode: loosening
          - issue: near-vertical return face on a service lid
            fix: use a shallower return angle
            failure_mode: assembly-error
          - issue: gate or weld line at the snap root
            fix: move the gate and avoid knit line at the root
            failure_mode: brittle-fracture
          - issue: zero-clearance FDM mating geometry
            fix: start at 0.3 mm clearance and test
            failure_mode: assembly-error
          - issue: nylon dimensions change with moisture
            fix: specify conditioned state or pick a less hygroscopic resin
            failure_mode: environmental-degradation
          - issue: FDM ring printed across weak layer interfaces
            fix: orient so strain follows filament paths; use PETG or nylon not brittle PLA
            failure_mode: brittle-fracture
          axes:
            locking: 'relevant: return angle sets removable vs positive lock'
            captive: 'n/a: closure retention, not a captive part question'
            corrosion: 'n/a: plastic ring; relevant only for metal parts'
            bearing-face: 'relevant: bead return face carries pull-off'
            material-direction: 'relevant: FDM ring strain vs layer direction'
          rules:
          - id: c1
            text: Repeated-use design stress often about 50 percent of the elastic limit
            value: '50'
            unit: percent
            source_url: https://www.plasticstoday.com/injection-molding/injection-molding-design-fundamentals-snap-fits-for-plastic-parts
            source_quality: secondary
            equipment: injection-mould
            confidence: excerpt-only
            note: confirmed only from a search excerpt, page not read
          - id: c2
            text: Annular snap engagement (lead-in) angle 20-30 deg from the axis (JBR guide)
            value: 20-30
