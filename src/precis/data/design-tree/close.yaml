        quarter-turn-fastener:
          id: close/threaded-and-twist/quarter-turn-fastener
          role: leaf
          coverage: deep
          implies:
            class: rigid
            mechanism: screw
            rank: 8
          summary: Quarter-turn cam fasteners (Dzus type, camlocks) and captive panel screws give fast tool-light access with
            no loose hardware. Pick the receptacle first, work out total material thickness, and use metal inserts in printed
            panels.
          when:
          - panels opened often and quickly, captive hardware
          - clamp and in-plane shear load on a stiff frame
          - covers, guards, enclosures, access doors in sheet metal
          - volume that justifies standard receptacles
          avoid_when:
          - primary structural or pressure-retaining joint, high preload
          - thin, soft or unsupported panel
          - precise permanent alignment
          - bare FDM polymer carrying repeated clamp load
          - no room behind panel for receptacle
          variants:
          - spade-cam (high cycle)
          - external spiral-cam (thickness tolerance)
          - internal spiral-cam (higher tensile)
          - push-to-close turn-to-open
          - wire-form receptacle
          - flat, saddle, angle, press-in, blind receptacles
          - captive panel screw
          - self-clinching captive screw
          - printed captive screw assembly
          tradeoffs:
          - 'vs machine screw: faster and captive, but less preload and sealing'
          - 'vs captive screw: faster, but less preload and gasket force'
          - 'vs rivet: serviceable, costlier'
          - 'vs latch: smaller, but lower opening-load capacity'
          - 'vs snap: more predictable clamp, more parts'
          howto:
          - Select the receptacle first, then compute total material thickness and pick the stud length.
          - Include outer panel, frame, gasket compression, coatings and tolerance in total material thickness; add ejector
            and wear washer thickness.
          - Check panel pull-through, bearing, tear-out and frame bending separately from the fastener rating.
          - Locate the panel with dowels, pilots or flanges; the fastener only clamps.
          - Follow the supplier hole and edge-distance drawing; press-in parts with the specified tool, not a hammer.
          - In printed panels move the load into a metal insert, washer or backed receptacle and add 0.3 mm clearance.
          issues:
          - issue: stud chosen before receptacle
            fix: receptacle first, then total material thickness
            failure_mode: assembly-error
          - issue: nominal panel thickness only
            fix: include all layers, ejector and wear washer
            failure_mode: assembly-error
          - issue: fastener rating treated as panel rating
            fix: check pull-through, tear-out, frame bending
            failure_mode: overload
          - issue: fastener used to locate the panel
            fix: dowels, pilots, flanges
            failure_mode: assembly-error
          - issue: thin sheet or unsupported plastic
            fix: doubler, flange, backing washer or self-clinching insert
            failure_mode: overload
          - issue: loaded printed receptacle
            fix: metal receptacle or heat-set insert; orient layers
            failure_mode: creep-preload-loss
          - issue: hammer installation
            fix: specified press and backup tool
            failure_mode: assembly-error
          - issue: no tool or hand clearance
            fix: model driver and hand path
            failure_mode: assembly-error
          axes:
            locking: 'relevant: cam detent holds; add secondary retention for safety-critical covers'
            captive: 'relevant: stud and retainer stay with the panel; verify retainer groove'
            corrosion: 'relevant: dissimilar metals, plating, salt'
            bearing-face: 'relevant: washer and receptacle bearing on panel'
            material-direction: 'relevant: FDM panels and receptacles'
