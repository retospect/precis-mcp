    seal-interface:
      id: close/seal-interface
      role: method
      def: the sealing element and its compression between lid and body
      children:
        o-ring-face-seal:
          id: close/seal-interface/o-ring-face-seal
          role: leaf
          coverage: deep
          summary: 'Static O-ring gland per Parker: pick face gland for a flat lid, radial for a concentric plug; hold squeeze
            15-30 percent, groove fill under 85 percent, and buy the O-ring while printing only the rigid gland.'
          when:
          - stationary lid or flange needing a reusable, compact seal
          - groove, flatness, compression and concentricity can be held (machined or well-finished)
          - standard AS568 or Parker sizes, compatible elastomer for fluid and temperature
          avoid_when:
          - flexible flange, wide bolt spacing, joint can breathe open
          - rotary speed above 1500 ft/min, reciprocating below 1 ft/min, stroke above 12 in without precautions
          - no elastomer compatible with fluid or cleaner
          - 'rough FDM sealing face with nonstandard large size: use gasket or machined insert'
          variants:
          - static face gland
          - static radial gland
          - dovetail or half-dovetail face gland
          - dynamic radial seal
          - backup-ring gland
          - crush or rectangular-groove seal
          - printed housing with purchased O-ring
          tradeoffs:
          - 'vs flat gasket: serviceable and lower bolt load, but needs a controlled groove'
          - 'vs formed-in-place sealant: easier service, but groove cost'
          - 'vs PTFE or metal seals: cheaper and more compliant, less chemical and temperature capability'
          howto:
          - Choose cross-section, then take groove depth, width and radius from the Parker chart for liquid or gas.
          - Compute squeeze = (d2 - h)/d2 with the real lid gap included; keep static squeeze at or below 30 percent and at
            least 0.2 mm.
          - Keep groove fill near 75 percent (60-85) with at least 10 percent void.
          - Locate the groove diameter from the pressure direction (mean OD for internal pressure, mean ID for external).
          - Radius groove corners, deburr, lubricate on assembly, limit stretch to 5 percent.
          - Keep sealing face finish at or below 32 microinch RMS (16 for gas or vacuum).
          - Add a compression stop and a stiff lid; reduce diametral clearance 50 percent for silicone.
          - On FDM print only the gland, machine or coat the sealing land, test with coupons.
          issues:
          - issue: squeeze too low
            fix: at least 0.2 mm and within chart range
            failure_mode: overload
          - issue: squeeze above 30 percent
            fix: reduce squeeze, validate compound
            failure_mode: creep-preload-loss
          - issue: groove overfilled
            fix: fill near 75 percent, 10 percent void
            failure_mode: overload
          - issue: extrusion gap too big under pressure
            fix: smaller clearance, harder compound, backup ring
            failure_mode: overload
          - issue: sharp groove corner cuts O-ring
            fix: Parker corner radii
            failure_mode: assembly-error
          - issue: flange opens under pressure
            fix: stiffen lid, more bolts, compression stop
            failure_mode: excess-deflection
          - issue: twisted or dry-installed O-ring
            fix: lubricate, no roll, stretch at most 5 percent
            failure_mode: assembly-error
          - issue: rough or seamed FDM sealing face
            fix: machine or coat the land, orient face flat
            failure_mode: assembly-error
          - issue: chosen on temperature alone
            fix: check fluid, cleaner, hardness, compression set, low-temperature flexibility
            failure_mode: environmental-degradation
          axes:
            locking: 'n/a: no threaded fastener in the seal itself; the lid screws are covered by the lid joint'
            captive: 'relevant: dovetail groove retains O-ring during lid removal'
            corrosion: 'n/a: elastomer chemistry applies'
            bearing-face: 'relevant: gland depth and sealing land finish'
            material-direction: 'relevant: FDM: layer gaps and seam across seal path'
          rules:
          - id: c1
            text: Rotary contact speed above 1500 ft/min is outside the handbook scope
            value: '1500'
            unit: ft/min
            source_url: https://wp.optics.arizona.edu/optomech/wp-content/uploads/sites/53/2016/08/Parker-O-ring-handbook.pdf
            source_quality: primary
            equipment: bought
            confidence: handbook
