    hinged:
      id: close/hinged
      role: method
      def: lids that stay attached on a hinge axis
      children:
        pin-hinge:
          id: close/hinged/pin-hinge
          role: leaf
          coverage: shallow
          implies:
            class: revolute
            mechanism: pin
          summary: Knuckle hinge with a separate pin carries lid load best; use metal pin and leaves for load and life, print-in-place
            only for light prototype lids. Size pin for bending, bearing and tear-out, not shear alone.
          when:
          - cyclic load, radial load or cantilever lid torque, metal pin and leaves
          - slow or intermittent opening, moderate play acceptable
          - lid must be removable (lift-off or loose pin) or tamper-resistant (peened pin)
          - print-in-place for one-offs, prototypes, light enclosures, quantity 1 to few
          avoid_when:
          - 'continuous or fast cycling, or tight angular precision: use bushing or ball-bearing hinge'
          - wet or salt environment with unprotected carbon steel
          - fully printed pin where load, temperature or moisture swing is significant
          variants:
          - loose-pin butt
          - fixed or peened pin
          - piano (continuous)
          - lift-off
          - friction hinge
          - free-fit plain
          - bushed
          - ball-bearing
          - printed leaves with metal pin
          - FDM print-in-place
          tradeoffs:
          - 'vs living hinge: replaceable and stronger, but more parts and assembly'
          - 'vs strap hinge: locates accurately but no compliance for misalignment'
          - 'vs snap fit: fixed axis and controlled angle, but needs hinge alignment'
          howto:
          - Put the hinge axis near the lid centre of gravity and use two hinges spaced wide apart.
          - Check pin bending, double shear, bearing pressure p = F/(d*L), leaf tear-out and leaf bending.
          - Keep the gap between supporting knuckles small to cut pin bending.
          - Add a separate positive lid stop; never use the pin or knuckle as the stop.
          - Retain the pin (head, peen, E-clip, boss) and keep threads out of the shear plane.
          - For FDM start at 0.3 mm clearance, print a coupon, and fillet the knuckle roots.
          - Print a separate pin horizontally or use a metal rod, not a thin vertical pin.
          issues:
          - issue: axis too far from lid load path
            fix: move axis near centre of gravity, two wide-spaced hinges
            failure_mode: overload
          - issue: pin sized on shear only
            fix: check bending, bearing, tear-out, increase pin or bearing length
            failure_mode: overload
          - issue: printed hinge with zero clearance fuses at first layer
            fix: 0.3 mm minimum, elephant-foot compensation, chamfer bed-side edges
            failure_mode: assembly-error
          - issue: friction fit in creeping polymer loses torque or seizes
            fix: free-fit metal pin, bushing, separate friction element
            failure_mode: creep-preload-loss
          - issue: pin walks out under vibration
            fix: headed, peened or clipped pin
            failure_mode: loosening
          - issue: sharp root at knuckle-to-leaf
            fix: generous fillet, orient layers so root is not pulled across layers
            failure_mode: fatigue
          - issue: polymer clearance lost to heat or moisture
            fix: size clearance for full temperature and moisture range
            failure_mode: thermal-mismatch
          - issue: dry sliding wear grows play
            fix: replaceable bushing, hardened or stainless pin, larger d*L
            failure_mode: wear-fretting
          axes:
            locking: 'relevant: pin retention against walk-out'
            captive: 'relevant: peened or captive pin vs removable pin'
            corrosion: 'relevant: stainless pin and leaves, isolate dissimilar metals'
            bearing-face: 'n/a: knuckle bore is the bearing, see bearing pressure'
            material-direction: 'relevant: FDM: layers across pin or root delaminate'
          rules:
          - id: c1
            text: Start movable printed parts at least 0.3 mm clearance, then tune on a coupon
            value: '>=0.3'
            unit: mm
            source_url: https://help.prusa3d.com/article/modeling-with-3d-printing-in-mind_164135
            source_quality: primary
            equipment: desktop-fdm
            confidence: handbook
