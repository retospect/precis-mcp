    latches:
      id: close/latches
      role: method
      def: devices that hold a lid closed and release it on demand
      children:
        draw-latch:
          id: close/latches/draw-latch
          role: leaf
          coverage: deep
          implies:
            class: rigid
            mechanism: clamp
          summary: Over-centre toggle or draw latches clamp a lid against a gasket quickly and tool-free; count latches from
            gasket compression force, let separate features locate the lid, and let a hard stop, not the latch, limit gasket
            crush.
          when:
          - frequent tool-free opening, coplanar panels pulled together
          - gasket needs controlled compression or rattle must stop
          - low to medium quantity, purchased hardware
          avoid_when:
          - tamper-resistant, flush or hidden closure needed
          - 'large perpendicular pull-in or long stroke: use compression or cam latch'
          - latch used as structural tie, lifting point or pressure closure without verified load path
          - high-precision repeatable preload or zero play
          variants:
          - fixed-bail over-centre
          - adjustable-bail or threaded hook
          - spring-loaded toggle
          - rotary draw
          - hook or wire-bail
          - compression over-centre
          - padlockable
          - single-point vs multi-point rod
          - concealed or flush
          - printed prototype latch
          tradeoffs:
          - 'vs cam or compression latch: more tolerant of misalignment, less controlled perpendicular compression'
          - 'vs screw fastener: much faster, lower preload and accuracy'
          - 'vs magnets or snap fits: holds gasket load and vibration, but needs deliberate actuation'
          howto:
          - Get the gasket force per length from the supplier curve, then count latches N = L*R/470.
          - Space latches evenly and stiffen the lid so the middle seals as well as the latch zones.
          - Adjust so the linkage passes over centre, no more.
          - Let dowels, shoulders or hinge locate the lid; the latch only clamps.
          - Make the gasket hard stop, not the latch, the compression limit.
          - Back thin sheet or printed bosses with plates, inserts or large washers.
          - Use a metal hook and pin on printed enclosures; 0.3 mm clearance for moving printed parts.
          issues:
          - issue: capacity read from nominal holding load
            fix: use the rating for the exact hook position and geometry
            failure_mode: overload
          - issue: lever stops short of over-centre
            fix: adjust bail to pass over centre
            failure_mode: loosening
          - issue: latch used to locate the lid
            fix: separate dowels, stops, hinge
            failure_mode: wear-fretting
          - issue: all gasket compression at one point
            fix: even multi-latch spacing or multi-point rod
            failure_mode: assembly-error
          - issue: gasket over-compressed
            fix: hard stop, gasket force curve
            failure_mode: creep-preload-loss
          - issue: unsupported thin sheet or printed boss pulls through
            fix: backing plate, inserts, ribs
            failure_mode: overload
          - issue: PLA latch holds preload warm
            fix: metal or tough polymer, spring or hard stop
            failure_mode: creep-preload-loss
          - issue: sharp hook root
            fix: generous fillet
            failure_mode: fatigue
          axes:
            locking: 'relevant: over-centre lock, padlock or safety catch'
            captive: 'n/a: the latch stays fixed to lid and body'
            corrosion: 'relevant: stainless or plated latch, isolate dissimilar metals'
            bearing-face: 'relevant: keeper edge strike vs rolling contact'
            material-direction: 'relevant: FDM: hooks loaded within layers'
          rules:
          - id: c1
            text: 'Southco M3 remote compression latches: number of latches N = L * R / 470, with L the gasket length in mm
              and R the gasket compression rate in N per mm; 470 N is that latch family''s capacity, so do not apply it to
              draw latches in general'
