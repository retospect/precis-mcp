design_tree_manifest: run2
status: run 2, verified drafts merged; for review, not yet linked or deduped
ai_use: 'Pre-filled with Perplexity (perplexity-reasoning) to find sources, then each rule was checked against its cited source
  by a separate agent. Prose and rule texts are our own wording; values trace to the listed source_url. Confidence levels:
  standard, handbook, secondary, excerpt-only, shop-rule (not DRC-enforceable), unverified. Principles checks are hand-written;
  their rules are verified claims.'
close:
  id: close
  role: goal
  scale: macro
  domain: mech
  coverage: deep
  def: open and re-close access to an enclosure or container, by hand or with a tool, optionally sealed
  asks:
  - open_frequency
  - tool_free
  - sealing{none,dust,splash,IP67}
  - user_force_N
  - child_or_tamper_resistant
  - process
  - hinged_or_removable
  - quantity
  children:
    snap-and-friction:
      id: close/snap-and-friction
      role: method
      def: lids held by moulded or printed elastic features or by interference
      children:
        cantilever-snap-lid:
          id: close/snap-and-friction/cantilever-snap-lid
          role: leaf
          coverage: deep
          implies:
            class: rigid
            mechanism: snap
            rank: 2
          summary: A flexed beam with a hook that springs into an undercut; tool-free, cheap, integral to the housing. Good
            for retention and light loads, poor where the hook carries sustained load, pressure or needs a preload.
          when:
          - tool-free repeated opening, light to moderate retention load
          - tough ductile thermoplastic, or FDM with beam bending in-plane of layers
          - integral feature preferred over extra parts
          avoid_when:
          - sustained, shock, pressure or prying load on the hook
          - brittle or heavily glass-filled material that must flex a lot
          - tight sealing or precise preload needed
          - high temperature, UV, solvent or long-term preload (creep, relaxation)
          variants:
          - straight cantilever
          - tapered cantilever (preferred general form)
          - L-shaped cantilever
          - U-shaped / double cantilever
          - torsional snap
          - annular snap (see sibling)
          tradeoffs:
          - 'vs screw: faster and no parts, but no clamp load and weaker long-term retention'
          - 'vs separate latch: cheaper and integral, but lower cycle life and release force less predictable'
          - 'vs magnet: positive retention against sliding, but the root flexes and fatigues'
          - 'vs living hinge: removable lid, but needs undercut and mould/print geometry'
          howto:
          - Size the beam from allowable strain of the actual material, not yield; use about 60 percent of the single-assembly
            strain for repeated opening.
          - Make the engaged position stress-free; the hook deflects only during closing and opening.
          - Taper thickness to about half at the hook (or width to a quarter) and radius the root generously.
          - Use a sloped lead-in face and a squarer return face; set the return angle by how hard it should be to open.
          - Provide separate locating ribs or pins; the snap only retains.
          - Leave a relief slot beside the flexing arm that covers process tolerance.
          - On FDM, orient the beam so bending stress runs along the printed layers, then print a fit coupon in the final
            material and orientation.
          issues:
          - issue: sharp beam-to-wall corner
            fix: root fillet, R/t at least 0.5
            failure_mode: fatigue
          - issue: constant-thickness beam strains the root
            fix: taper thickness to about half or width to a quarter
            failure_mode: fatigue
          - issue: undercut too large
            fix: reduce undercut, lengthen beam, use L or U path, share over several hooks
            failure_mode: overload
          - issue: hook left deflected after closing
            fix: design engaged state stress-free
            failure_mode: creep-preload-loss
          - issue: FDM beam bends across weak layer bonds
            fix: reorient so bending is in-plane of layers; raise print temperature if layers are weak
            failure_mode: brittle-fracture
          - issue: snap used as the locating feature
            fix: add ribs, pins or guides for location
            failure_mode: assembly-error
          - issue: molded dimensions copied to FDM
            fix: print a clearance coupon and tune
            failure_mode: assembly-error
          - issue: snap used as clamp or seal preload
            fix: use a compression stop plus screw or separate latch for sustained compression
            failure_mode: creep-preload-loss
          axes:
            locking: 'relevant: undercut and return angle set removable vs permanent; add secondary latch if accidental opening
              is unsafe'
            captive: 'n/a: lid is integral or removable, captivity is a separate hinge question'
            corrosion: 'n/a: plastic; only relevant for metal inserts or springs'
            bearing-face: 'relevant: return face of the hook carries retention'
            material-direction: 'relevant: FDM beam bending must follow layer direction'
          rules:
          - id: c1
            text: 'Repeated opening: use about 60 percent of the single-assembly allowable strain'
            value: '60'
            unit: percent
            source_url: https://solutions.covestro.com/-/media/covestro/solution-center/brands/downloads/imported/1556891135.pdf
            source_quality: primary
            equipment: injection-mould
            confidence: handbook
          - id: c2
            text: Snap-beam root fillet radius to thickness ratio R/t of at least 0.5 (BASF Snap-Fit Design Manual); Covestro
              instead gives R/h about 0.6 as an optimum and calls it a compromise
            value: '0.5'
            unit: R/t
            source_url: https://productdesignonline.com/wp-content/uploads/2019/08/Snap-Fit-Design-Manual.pdf
            source_quality: primary
            equipment: injection-mould
            confidence: handbook
          - id: c3
            text: Covestro cautions against an internal root radius below 0.015 in
            value: '0.015'
            unit: in
            source_url: https://solutions.covestro.com/-/media/covestro/solution-center/brands/downloads/imported/1556891135.pdf
            source_quality: primary
            equipment: injection-mould
            confidence: handbook
          - id: c4
            text: 'Taper thickness linearly to about half the root thickness at the hook: 0.5 ratio'
            value: '0.5'
            unit: ratio
            source_url: https://solutions.covestro.com/-/media/covestro/solution-center/brands/downloads/imported/1556891135.pdf
            source_quality: primary
            equipment: injection-mould
            confidence: handbook
          - id: c5
