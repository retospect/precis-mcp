        gasket-and-lip:
          id: close/seal-interface/gasket-and-lip
          role: leaf
          coverage: deep
          summary: Pick flat, foam, solid elastomer, printed TPU or tongue-and-groove by flange stiffness, reuse and process;
            specify compressed thickness with a hard stop. IP ratings belong to the tested enclosure, not the gasket.
          when:
          - 'flat gasket: broad rigid flange, frequent disassembly, uniform clamp'
          - 'closed-cell foam: irregular surfaces, low closure force'
          - 'solid elastomer: repeatedly opened static lid, moderate sealing'
          - 'printed TPU: prototype, one-off, noncritical static seal'
          - 'tongue-and-groove: positive location, concealed gasket, washdown'
          avoid_when:
          - warped or flexible lid, large unsupported span, poorly controlled bolt load
          - foam with high temperature, solvents, sharp edges or high pressure
          - printed TPU for safety-critical, pressure, high-temperature or high-volume seals unless qualified
          - tongue-and-groove where alignment or accuracy is poor
          - 'sliding or rotating interface: use a dynamic seal'
          variants:
          - flat sheet gasket
          - solid moulded gasket
          - closed-cell foam tape or profile
          - printed TPU gasket
          - O-ring in face groove
          - tongue-and-groove gasket
          - labyrinth lip
          - dual seal
          tradeoffs:
          - 'flat gasket: cheapest and most separable, needs distributed clamp load'
          - 'foam or TPU: forgiving, but compression set and dimensional drift'
          - 'tongue-and-groove: best repeatability and gasket protection, less tolerant of dirt and warp'
          howto:
          - Specify gasket material and hardness, free and compressed thickness, allowed compression range and a hard stop.
          - Use solid elastomer at about 15-25 percent, sponge 25-40, closed-cell foam 25-50 percent, then check the supplier
            curve.
          - Keep flat gaskets 8-10 mm or wider with thickness-to-width ratio not below 1:5.
          - Stiffen the lid, add fasteners or latches around the perimeter, keep the seal continuous with generous corner
            radii.
          - Retain the gasket in a shallow groove or tongue-and-groove.
          - Dry TPU before printing, print slowly (about 20 mm/s), use continuous perimeters, leak-test.
          - Test the complete enclosure to IEC 60529 for the claimed IP code.
          issues:
          - issue: design by free gasket thickness only
            fix: specify compressed thickness and a compression limiter
            failure_mode: creep-preload-loss
          - issue: IP rating claimed for the gasket
            fix: test the whole enclosure to IEC 60529
            failure_mode: assembly-error
          - issue: over-wide flat gasket
            fix: narrow the web, keep at least 8-10 mm, ratio 1:5
            failure_mode: overload
          - issue: too much compression
            fix: positive stop, lower squeeze, low-compression-set compound
            failure_mode: creep-preload-loss
          - issue: fasteners only at corners
            fix: stiffen lid, more fasteners, check mid-span
            failure_mode: excess-deflection
          - issue: gasket crosses screw holes or sharp corners
            fix: continuous seal, radii, holes outside the web
            failure_mode: assembly-error
          - issue: wet TPU printed
            fix: dry before printing
            failure_mode: assembly-error
          - issue: no dirt relief in tongue-and-groove
            fix: lead-in chamfers, drain paths not bypassing the seal
            failure_mode: assembly-error
          axes:
            locking: 'n/a: clamp comes from latches or fasteners'
            captive: 'relevant: gasket retention groove or tongue-and-groove capture'
            corrosion: 'relevant: water trap at flange, galvanic contact, bypass around gasket'
            bearing-face: 'relevant: flange flatness, finish and compression stop'
            material-direction: 'relevant: FDM TPU: seams and layer interfaces as leak paths'
