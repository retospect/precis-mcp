      - https://www.envalior.com/en-us/corrugations-ribs-and-gussets
    assembly-and-access:
      id: principles/assembly-and-access
      role: principle
      coverage: deep
      summary: For each part, check it can be picked, oriented, inserted along a clear path, secured, inspected, removed and
        reinstalled with the stated tools and order. Boothroyd-Dewhurst supplies the method (minimum parts, handling plus
        insertion time) but no fixed clearance number.
      applies: per-assembly
      checks:
      - Write the assembly order; each part and fastener has a straight insertion path at its turn.
      - Every screw head can be reached by its actual tool (hex key length, driver shaft, socket OD) at its turn.
      - Disassembly for service works in reverse without cutting or breaking parts that should survive.
      - Cables, seals and fingers are not pinched when closing.
      - 'Printed parts: support material can be removed, and a print-in-place gap is clear.'
      - Prefer fewer parts and fewer fastener types (Boothroyd-Dewhurst minimum part count).
      issues:
      - issue: Insertion path blocked by an installed feature
        fix: Define sequence, relocate rib, or give the part a straight removal path
        failure_mode: assembly-error
      - issue: Multi-axis or sideways insertion with tilting
        fix: Single-axis insertion, lead-in, split housing, change retention
        failure_mode: assembly-error
      - issue: Driver cannot align with screw
        fix: Access window, move screw to accessible face, captive side fastener, or snap
        failure_mode: assembly-error
      - issue: Tool cannot be withdrawn from a recessed screw
        fix: Coaxial tool corridor at least tool engagement plus stroke, shorter or right-angle tool
        failure_mode: assembly-error
      - issue: Service item fastened under a glued cover
        fix: Screws on service side, captive screws or clips, removable without destroying the cover
        failure_mode: assembly-error
      - issue: Nut must be held behind a closed panel
        fix: Captive nut, insert, weld nut, or install before closure
        failure_mode: assembly-error
      - issue: No lead-in; part jams if tilted
        fix: Chamfer, radius, pilot diameter, taper
        failure_mode: assembly-error
      - issue: Nearly symmetric part installed backwards
        fix: Key it, offset holes, exaggerate asymmetry, mark polarity
        failure_mode: assembly-error
      - issue: Permanent weld or glue joint in a service path
        fix: Screws, quarter-turn latches or clips unless sealing or structure requires permanence
        failure_mode: assembly-error
      - issue: Mixed screw heads and sizes
        fix: Standardise fastener family and size
        failure_mode: assembly-error
      literature:
