    load-path:
      id: principles/load-path
      role: principle
      coverage: deep
      summary: Draw the free-body diagram and follow every force and moment from where it enters to ground; inspect each transition
        on the way. Reject paths that go through threads in shear, thin cantilevered tabs, gaps or long flexible shells.
      applies: per-part and per-joint, per load case
      checks:
      - For each load case trace the force from where it enters to ground, part by part and joint by joint; no gaps.
      - Threads carry tension, not shear; shear goes through a shank, dowel, shoulder or nesting feature.
      - Thin features in bending, sharp internal corners and holes on the path get a fillet, rib or more section.
      - 'Printed parts: the main stress runs along the layers, not across them (links axis material-direction).'
      - 'Plastic under a screw head or in a clamp: check creep and preload loss (links axis bearing-face).'
      - Where friction carries the shear, check slip margin with the real preload.
      - Follow torque and moments through too, not only forces (a crank arm, a cantilevered shaft).
      issues:
      - issue: Lateral load carried by engaged threads in a tapped hole
        fix: Clearance hole with shank in shear plane, dowel, shoulder bolt or insert
        failure_mode: overload
      - issue: Bolt bending from a gap, gasket or long spacer
        fix: Remove gap, shorten grip, support the shear plane, or compute bolt moment
        failure_mode: fatigue
      - issue: Eccentric bracket with prying
        fix: Move support plane to load, deepen bracket, add web or gusset, design bolt group for force plus moment
        failure_mode: overload
      - issue: Thin tab used as beam
        fix: Return flange or gusset, two-sided clevis, check bearing, net section and tear-out
        failure_mode: excess-deflection
      - issue: Load introduced at a sharp corner or small boss
        fix: Bearing pad, fillet, flange, rib or taper to spread it
        failure_mode: fatigue
      - issue: Long indirect path through flexible cover and remote fasteners
        fix: Put the support directly over a stiff web or frame member
        failure_mode: excess-deflection
      - issue: Preload friction assumed to resist cyclic shear
        fix: Set minimum preload and slip margin, or add pin, shoulder or key
        failure_mode: loosening
      - issue: Equal load sharing assumed between redundant fasteners
        fix: Analyse stiffness, eccentricity and the most loaded fastener
        failure_mode: overload
      literature:
      - Shigley, Mechanical Engineering Design (bolted and riveted joints)
      - Roark, Formulas for Stress and Strain
      - Barrett, NASA RP-1228, Fastener Design Manual, March 1990 (NTRS 19900009424)
      - VDI 2230 Blatt 1 and Blatt 2 (single and multi-bolt joints)
      - NASA-STD-5020
      rules:
      - id: c1
        text: Preliminary edge distance for fasteners at least 1.5 times fastener diameter
        value: '1.5'
        unit: x d
        source_url: https://caeflow.com/fea/bolted-joints/
        source_quality: weak
        equipment: bought
        confidence: secondary
      - id: c2
        text: 'Preliminary thread engagement about one fastener diameter to guard against thread shear: 1 x d'
        value: '1'
        unit: x d
        source_url: https://mechanicalc.com/reference/bolted-joint-analysis
        source_quality: weak
        equipment: bought
        confidence: secondary
      - id: c3
        text: Keep the plain shank in the shear plane of a direct-shear bolt; otherwise use the reduced threaded-section capacity
        value: null
        unit: null
        source_url: https://www.roymech.co.uk/Useful_Tables/Screws/Bolted_Joint.html
        source_quality: weak
        equipment: bought
        confidence: secondary
      - id: c4
        text: 'Thin-plate flexural rigidity scales with thickness cubed: 3 exponent on t'
        value: '3'
        unit: exponent on t
        source_url: https://mechcodex.com/learn/strength-of-materials/plate-bending-roark
        source_quality: weak
        equipment: any
        confidence: secondary
      - id: c5
        text: Injection-moulded ribs about 50 to 60 percent of nominal wall thickness
        value: 50-60
        unit: '% of wall'
        source_url: https://www.envalior.com/en-us/corrugations-ribs-and-gussets
        source_quality: primary
        equipment: injection-mould
        confidence: handbook
      - id: c6
        text: Injection-moulded rib height no more than about 3 times wall thickness
        value: '3'
        unit: x t
        source_url: https://www.envalior.com/en-us/corrugations-ribs-and-gussets
        source_quality: primary
        equipment: injection-mould
        confidence: handbook
      - id: c7
        text: Bolt bending moment from transverse shear across a gap is M_b = F_s * a / 2
        value: F_s a / 2
        unit: N*mm
        source_url: https://mechanicalc.com/reference/bolted-joint-analysis
        source_quality: weak
        equipment: bought
        confidence: secondary
      - id: c8
        text: Orient stiffening ribs along the bending or load direction; across it they add little stiffness
        value: null
        unit: null
        source_url: https://www.envalior.com/en-us/corrugations-ribs-and-gussets
        source_quality: primary
        equipment: injection-mould
        confidence: handbook
      sources:
      - perplexity-reasoning:517434
      - https://caeflow.com/fea/bolted-joints/
      - https://mechanicalc.com/reference/bolted-joint-analysis
      - https://www.roymech.co.uk/Useful_Tables/Screws/Bolted_Joint.html
