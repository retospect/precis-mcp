design_tree_manifest: run2
status: run 2, verified drafts merged; for review, not yet linked or deduped
ai_use: 'Pre-filled with Perplexity (perplexity-reasoning) to find sources, then each rule was checked against its cited source
  by a separate agent. Prose and rule texts are our own wording; values trace to the listed source_url. Confidence levels:
  standard, handbook, secondary, excerpt-only, shop-rule (not DRC-enforceable), unverified. Principles checks are hand-written;
  their rules are verified claims.'
principles:
  id: principles
  role: goal
  scale: macro
  domain: mech
  coverage: deep
  def: universal per-part and per-assembly checks, run on every part whether or not a leaf points at them
  children:
    retention-all-dof:
      id: principles/retention-all-dof
      role: principle
      coverage: deep
      summary: 'Give each part a six-row degree-of-freedom table: every row is free by design or stopped in both directions
        by a named feature. Friction and gravity do not count as retention unless a preload or load calculation says so.'
      applies: per-part
      checks:
      - List the part's 6 DOF (3 translations, 3 rotations) and mark each intended motion or stopped; leave none unclassified.
      - For every stopped DOF name what stops the + direction and what stops the - direction (shoulder, pin, wall, clamp,
        latch).
      - Friction or gravity alone is not a stop when the object vibrates, is carried, or can be turned over; add a form stop
        or justify it with a load case.
      - 'An intended motion still needs limits: guide it, and stop its travel where it must end (axial retention for a turning
        shaft).'
      - Check every stop is itself retained (a circlip in a groove, a pin that cannot walk out).
      - Check every orientation of use and of transport, not only the drawn one.
      - 'Printed stops: check the stop load against creep and against the weak layer direction.'
      - There must be an assembly path that reaches the stops (links principles/assembly-and-access).
      issues:
      - issue: Part held down only by its own weight (battery, cover, tray)
        fix: Add a latch, captive screw, clip or positive cover stop that reacts lift and lateral motion
        failure_mode: lost-part
      - issue: Location by friction against a flat face
        fix: Add shoulder, dowel, key, vee or pocket, or a clamp with controlled preload
        failure_mode: wear-fretting
      - issue: Connector or terminal held only by mating friction
        fix: Add a housing latch and a secondary lock
        failure_mode: loosening
      - issue: Fastener preload treated as a permanent lock
        fix: Keep clamp load and add a lock suited to the loosening mode, or positive capture
        failure_mode: loosening
      - issue: Oversized bolt holes expected to locate parts under cyclic shear
        fix: Carry shear by preload friction, close-fit pins or dedicated shear features
        failure_mode: wear-fretting
      - issue: One-sided stop (blocks outward motion only)
        fix: Add opposing shoulder, groove plus ring, or captured pin
        failure_mode: lost-part
      - issue: Snap ring or clip can walk out of its seat
        fix: Positive groove and shoulder, installation check, secondary retention if release is hazardous
        failure_mode: loosening
      - issue: Several pads, pins and tight holes locate one plate
        fix: Use a kinematic pattern with only the independent contacts needed
        failure_mode: assembly-error
      literature:
      - 'Blanding, Exact Constraint: Machine Design Using Kinematic Principles, ASME Press 1999'
      - 'Slocum, Kinematic Couplings: A Review of Design Principles and Applications'
      - MIT 2.72 Elements of Mechanical Design, lecture 6 Exact Constraint
      - Hale, Practical Exact-Constraint Design (MIT thesis)
      - NASA-STD-5017 mechanisms; NASA-STD-5020B threaded fastening
      rules:
      - id: c1
        text: 'A rigid body has six independent degrees of freedom: three translations and three rotations: 6 DOF'
        value: '6'
        unit: DOF
        source_url: https://web.mae.ufl.edu/designlab/DFMA%20Tips/Fundamental_Design_Principles_KCraig.pdf
        source_quality: secondary
        equipment: any
        confidence: secondary
      - id: c2
        text: Constraints C plus remaining independent DOF R equals 6 (6 - C = R)
        value: 6 - C = R
        unit: null
        source_url: https://ocw.mit.edu/courses/2-72-elements-of-mechanical-design-spring-2009/22c0cb8444c787d92b49afe5ed97ff7b_MIT2_72s09_lec06.pdf
        source_quality: secondary
        equipment: any
        confidence: secondary
      - id: c3
        text: 'Exact constraint uses one independent constraint per DOF to be constrained, no more: 1 constraint per DOF'
        value: '1'
        unit: constraint per DOF
        source_url: https://ocw.mit.edu/courses/2-72-elements-of-mechanical-design-spring-2009/22c0cb8444c787d92b49afe5ed97ff7b_MIT2_72s09_lec06.pdf
        source_quality: secondary
        equipment: any
        confidence: secondary
      - id: c4
        text: 'NASA requires each structural fastener to have two verifiable locking features or be positively retained or
          captured: 2 locking features'
        value: '2'
        unit: locking features
        source_url: https://standards.nasa.gov/sites/default/files/standards/NASA/w/CHANGE-1/1/Historical/nasa-std-5017.pdf
        source_quality: primary
        equipment: bought
        confidence: standard
      - id: c5
        text: 'Quasi-kinematic averaging design uses ten or more compliant support points per DOF restrained (not an exact-constraint
          rule): >= 10 points per DOF'
        value: '>= 10'
        unit: points per DOF
        source_url: https://web.mae.ufl.edu/designlab/DFMA%20Tips/Fundamental_Design_Principles_KCraig.pdf
        source_quality: secondary
        equipment: any
        confidence: secondary
      - id: c6
        text: Preload around 70 percent of yield strength is usually but not always enough to prevent vibration loosening
          (aerospace observation)
        value: '70'
        unit: '% of yield'
        source_url: https://standards.nasa.gov/sites/default/files/standards/NASA/w/CHANGE-1/1/Historical/nasa-std-5017.pdf
        source_quality: primary
        equipment: bought
        confidence: standard
      - id: c7
        text: For cyclic or vibrating joints, shear should go through preload friction, close-fit or interference pins, or
          dedicated shear features rather than bolt clearance
        value: null
        unit: null
        source_url: https://standards.nasa.gov/sites/default/files/standards/NASA/B/0/2021-08-06-nasa-std-5020b_final.pdf
        source_quality: primary
        equipment: bought
        confidence: standard
      sources:
      - perplexity-reasoning:517419
      - https://web.mae.ufl.edu/designlab/DFMA%20Tips/Fundamental_Design_Principles_KCraig.pdf
      - https://ocw.mit.edu/courses/2-72-elements-of-mechanical-design-spring-2009/22c0cb8444c787d92b49afe5ed97ff7b_MIT2_72s09_lec06.pdf
      - https://standards.nasa.gov/sites/default/files/standards/NASA/w/CHANGE-1/1/Historical/nasa-std-5017.pdf
      - https://standards.nasa.gov/sites/default/files/standards/NASA/B/0/2021-08-06-nasa-std-5020b_final.pdf
    fail-safe-retention:
      id: principles/fail-safe-retention
      role: principle
      coverage: deep
      summary: Assume the primary retainer is already ineffective, then show what physically stops the part, what load that
        stop carries, and what happens next. A backup counts only if it is independent of the primary, sized for the released
        load, inspectable and cannot itself escape.
      applies: per-part, where losing the part hurts someone or wrecks the object
      checks:
      - 'Name the primary failure: nut backs off, screw breaks, ring leaves groove, latch opens, glue lets go.'
      - Say what the freed part then does (falls, flies, jams, drops its load) and whether that is acceptable.
      - If not acceptable, add a backup that does not share the primary's friction, preload, hole or groove (cotter pin through
        a castle nut, safety wire, lip, captive feature).
      - The backup takes the full load after the primary is gone.
      - The installed state can be seen or felt; a missing backup is obvious.
      - 'One line answer: with the primary retainer gone, what stops the part, at what load.'
      issues:
      - issue: Plain nut on a vibrating or rotating bolt
        fix: Castellated nut with cotter pin, safety wire or cable, or another positive mechanical lock
        failure_mode: loosening
      - issue: Prevailing-torque nut or threadlocker as the only retention in a critical joint
        fix: Add mechanical retention; treat friction or adhesive devices as supplemental
        failure_mode: loosening
      - issue: Serrated lock washer used as backup to a preload-critical joint
        fix: Use a positive stop such as cotter pin, lock plate, safety wire or captive hardware
        failure_mode: loosening
      - issue: Castle nut fitted without cotter pin
        fix: Fit a correctly sized new cotter pin through the drilled bolt
        failure_mode: loosening
      - issue: Over-tightening castle nut to line up the slot
        fix: Start at low end of torque range, advance only to next slot, never exceed maximum
        failure_mode: overload
      - issue: Slack safety wire
        fix: Install tight under light tension with consistent twists
        failure_mode: loosening
      - issue: Retaining ring in chamfered, worn or undersized groove
        fix: Proper ring and groove with a load-bearing wall
        failure_mode: loosening
      - issue: Lip or shoulder too thin or brittle for the abnormal load
        fix: Size and test for full released load, add second independent capture if hazardous
        failure_mode: brittle-fracture
      - issue: Locking quick-release pin treated as fail-safe
        fix: Add a positive keeper; avoid pins whose balls carry axial tension
        failure_mode: lost-part
      - issue: Two locks that share one hole, groove or wire anchor
        fix: Show separate load paths and separate failure mechanisms
        failure_mode: lost-part
      literature:
      - NASA-STD-5020B Requirements for Threaded Fastening Systems in Spaceflight
      - NASA RP-1228, Fastener Design Manual, R. T. Barrett, March 1990 (NTRS 19900009424)
      - FAA AC 43.13-1B and 43.13-2B
      - MS33540 safety wiring, cabling, cotter pinning
      - NASA-STD-5019 and NASA-HDBK-5010 fracture control
      - FAA AC 23-13A, AC 25.571-1B
      - Shigley, Mechanical Engineering Design
      rules:
      - id: c1
        text: 'Aircraft equipment installation guidance (AC 43.13-2B): each removable fastener needs two retaining devices
          so one can fail without loss'
        value: '2'
        unit: devices
        source_url: https://www.faa.gov/documentlibrary/media/advisory_circular/ac%2043.13-2b.pdf
        source_quality: primary
        equipment: bought
        confidence: standard
      - id: c2
        text: NASA-STD-5020B cites severe-vibration data showing about 30 percent preload loss when rotation is arrested by
          a mechanical lock (an example, not an allowance)
        value: '30'
        unit: '% preload'
        source_url: https://standards.nasa.gov/sites/default/files/standards/NASA/B/0/2021-08-06-nasa-std-5020b_final.pdf
        source_quality: primary
        equipment: bought
        confidence: standard
      - id: c3
        text: A good safety-wire job has roughly 6 to 8 twists per inch
        value: 6-8
        unit: twists/in
        source_url: https://www.faa.gov/sites/faa.gov/files/2022-01/Safety%20Wire.pdf
        source_quality: secondary
        equipment: bought
        confidence: secondary
      - id: c4
        text: 'NASA GSFC 540-PG-8072.1.2B: running-torque verification of locking fasteners covers the greater of 5 fasteners
          or 10 percent of the population (check the current revision)'
        value: 5 or 10
        unit: fasteners or %
        source_url: https://www.nasa.gov/wp-content/uploads/2025/06/mechanicalfastenertorqueguidelines.pdf?emrc=6ab8b7d41242d
        source_quality: primary
