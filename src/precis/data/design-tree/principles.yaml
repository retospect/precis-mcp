    thermal-expansion:
      id: principles/thermal-expansion
      role: principle
      coverage: deep
      summary: Compute free thermal movement of each joined part over the full temperature range, then give the joint a datum
        plus a sliding or flexing path for the difference. No universal clearance number exists; clearance is the calculated
        differential movement plus tolerance, deflection and margin.
      applies: per joint of dissimilar materials, and any part near heat
      checks:
      - Use the real minimum and maximum temperature of the part (sun, motor, enclosure), not room temperature.
      - Compute the differential movement (alpha1 - alpha2) * L * dT for each joined pair; check fits and clearances at both
        extremes.
      - Fix one datum and let the rest slide along the expansion direction (slots, floating joints).
      - 'Plastics: check the hot case against softening (PLA around 55 C) and the cold case against brittleness.'
      - Recheck bolt preload and seals at both extremes.
      issues:
      - issue: Aluminium panel bolted rigidly to steel frame in all directions
        fix: One fixed datum; slotted or oversized holes elsewhere with washers that keep clamp load
        failure_mode: thermal-mismatch
      - issue: Long cover with round tight holes onto steel pins
        fix: Fixed hole at one datum, slots along the expansion direction at the rest
        failure_mode: thermal-mismatch
      - issue: Long slotted shear connection assumed to give full slot length of travel
        fix: Use engineered sliding connection and calculate usable travel
        failure_mode: wear-fretting
      - issue: Steel pin pressed into aluminium bore
        fix: Sliding fit, closer CTE, or interference calculated at both temperature limits
        failure_mode: thermal-mismatch
      - issue: Steel insert or bushing moulded into plastic housing
        fix: Compliant geometry, floating insert, shorter constraint length or flexible interface
        failure_mode: thermal-mismatch
      - issue: Bolt and clamped material with different CTE
        fix: Match CTE where practical, compute preload over temperature, compliant washers
        failure_mode: creep-preload-loss
      - issue: Adhesive bond treated as rigid over a long bondline
        fix: Compliant adhesive, shorter bond, check temperature-dependent modulus and creep
        failure_mode: thermal-mismatch
      - issue: Seal clearance checked at room temperature only
        fix: Check groove fill, squeeze and extrusion gap at both extremes
        failure_mode: thermal-mismatch
      literature:
      - NASA-STD-5020B threaded fastening (thermo-elastic preload change)
      - NASA RP-1228, Fastener Design Manual, R. T. Barrett, March 1990 (NTRS 19900009424)
      - Roark, Formulas for Stress and Strain, 9th ed.
      - ASME B31.1 Power Piping (expansion and flexibility)
      - NASA TP-2226 Theoretical Basis for Design of Thermal-Stress-Free Fasteners
      rules:
      - id: c1
