    look-up-dont-assume:
      id: principles/look-up-dont-assume
      role: principle
      coverage: deep
      summary: Every non-geometric quantity or interface dimension is a requirement, a verified property from a specification
        or datasheet, or a recorded assumption to be replaced before release. Guessed yield strengths, nominal catalog sizes
        and unstated fit classes are the typical failures.
      applies: per number used in the design
      checks:
      - 'Bought parts: record maker, part number and datasheet; dimensions and ratings come from it, never from memory.'
      - 'Materials: name the grade and condition; strength, temperature limit and creep come from its datasheet.'
      - Fits and clearances come from a recognised system (ISO 286) or from a test print on this printer.
      - Record source, revision, unit and condition for each critical number; unsourced numbers are marked provisional and
        listed.
      - Typical values are not minimums; rules of thumb are for first sizing only.
      issues:
      - issue: 6061 aluminium with a guessed yield strength
        fix: Specify temper and product form (6061-T6 plate) and use the specification or MMPDS where applicable
        failure_mode: overload
      - issue: Average tensile strength used as allowable
        fix: Code or specification allowable, or statistically justified test data
        failure_mode: overload
      - issue: A 10 mm hole drawn for a bearing or shaft
        fix: Identify the part numbers, get datasheets, specify seat tolerance and fit
        failure_mode: assembly-error
      - issue: Bought motor or connector assumed to fit the CAD model
        fix: Freeze part number and revision, use supplier-controlled dimensions, check delivered part
        failure_mode: assembly-error
      - issue: Blanket plus-minus 0.1 mm tolerance
        fix: Assign tolerances from function, process capability and stack-up
        failure_mode: assembly-error
      - issue: Redundant incompatible dimensions on one part
        fix: Dimension from functional datums, drop redundant ones, GD&T basic dimensions
        failure_mode: assembly-error
      - issue: Standard bolt without the standard
        fix: 'Full designation: thread, length, grade or class, head, coating'
        failure_mode: assembly-error
      - issue: Only nominal clearance checked
        fix: Compute min and max clearance from limits and service conditions
        failure_mode: assembly-error
      - issue: Stainless or hardened with no grade or treatment
        fix: Name exact grade, condition, treatment and acceptance test
        failure_mode: environmental-degradation
      literature:
      - Budynas and Nisbett, Shigley's Mechanical Engineering Design
      - ASME Y14.5-2018 (R2024); ASME Y14.41
      - ISO 286 limits and fits; ISO 2768 general tolerances
      - MMPDS-2024 (supersedes MIL-HDBK-5)
      - ASTM material and product specifications; manufacturer catalogs
      rules:
      - id: c1
        text: A nominal 1 1/2 in pipe has a theoretical outside diameter of 1.900 in (nominal pipe size is not the real diameter)
        value: '1.900'
        unit: in
        source_url: https://www.rolledalloys.com/pipe-chart/
        source_quality: weak
        equipment: bought
        confidence: secondary
        corrected: true
      - id: c2
        text: A nominal 1/2 inch bolt may measure 0.492 in
        value: '0.492'
        unit: in
        source_url: https://studylib.net/doc/27732898/shigley%E2%80%99s-mechanical-engineering-design-eleventh-edition
        source_quality: weak
        equipment: bought
        confidence: unverified
        note: source could not be read; value kept for review
      - id: c3
        text: Bilateral tolerance 1.005 +/- 0.002 in gives limits 1.003 to 1.007 in
        value: 1.003-1.007
        unit: in
        source_url: https://studylib.net/doc/27732898/shigley%E2%80%99s-mechanical-engineering-design-eleventh-edition
        source_quality: weak
        equipment: any
        confidence: unverified
        note: source could not be read; value kept for review
      - id: c4
        text: MMPDS-2024 supersedes MIL-HDBK-5 and is an accepted source of aerospace metallic and fastener allowables
