    over-constraint:
      id: principles/over-constraint
      role: principle
      coverage: deep
      summary: Constrain exactly the degrees of freedom the function needs. Where two features try to fix the same direction,
        real tolerance, thermal and alignment error makes them fight; make one of them float, flex or have clearance unless
        the redundancy is analysed on purpose.
      applies: per-assembly
      checks:
      - For each joint list the DOF to stop and to leave free; count independent constraints, with no two fixing the same
        direction.
      - Constraints must not depend on perfect parallelism, coaxiality or flatness (two bearings in two separate housings;
        four feet on a flat face).
      - On a shaft with two bearings, one locates axially and the other floats (links rotate/seat-and-retain/locating-floating-arrangement).
      - 'Two screws through clearance holes: check the floating-fastener position tolerance; or use one pin plus one slot
        (links locate/dowel-pin-and-slot).'
      - Where redundancy is deliberate (stiffness), name the shim, slot or adjuster that absorbs the misfit.
      issues:
      - issue: Two bearings both fixed axially on one shaft
        fix: One locating and one non-locating bearing
        failure_mode: thermal-mismatch
      - issue: Two rails forced parallel by rigid mounting
        fix: One master guide and a floating or adjustable follower
        failure_mode: excess-deflection
      - issue: Four rigid feet on one frame
        fix: Three support points, or make one or more feet adjustable or compliant
        failure_mode: assembly-error
      - issue: Several rigid coaxial bearings on one shaft
        fix: Fewer locating constraints, self-aligning bearing, or floating bearing
        failure_mode: wear-fretting
      - issue: Cover located by tight dowels plus close perimeter walls
        fix: One feature set locates, the other gets clearance or compliance
        failure_mode: assembly-error
      - issue: Frame members of different expansion fixed at both ends
        fix: Slot, sliding support, flexure, or one fixed and one guided end
        failure_mode: thermal-mismatch
      - issue: Binding cured by stiffening parts
        fix: Remove or relax the redundant constraint instead
        failure_mode: overload
      literature:
      - 'Blanding, Exact Constraint: Machine Design Using Kinematic Principles, ASME Press 1999'
      - ASME Y14.5 and Y14.5.1 datum reference frames and degrees of freedom
      - SKF bearing arrangement guidance (locating, non-locating supports)
      rules:
      - id: c1
        text: 'An unconstrained rigid part has six DOF, three translational and three rotational: 6 DOF'
        value: '6'
        unit: DOF
        source_url: https://manufacturingeducation.wordpress.ncsu.edu/files/2019/05/ASME-Y14.5M-2009.pdf
        source_quality: primary
        equipment: any
        confidence: standard
      - id: c2
        text: Exact constraint means just enough constraints, no more and no fewer
        value: null
        unit: null
        source_url: https://web.mae.ufl.edu/designlab/DFMA%20Tips/Fundamental_Design_Principles_KCraig.pdf
        source_quality: secondary
        equipment: any
        confidence: secondary
      - id: c3
        text: Uniform thermal length change is dL = alpha * L * dT
        value: alpha L dT
        unit: null
        source_url: https://nvlpubs.nist.gov/nistpubs/jres/099/jresv99n1p31_a1b.pdf
        source_quality: primary
        equipment: any
        confidence: handbook
      - id: c4
        text: SKF CARB toroidal bearing permits relative axial displacement up to 10 percent of bearing width (product-specific)
        value: '10'
        unit: '% of bearing width'
        source_url: https://cdn.skfmediahub.skf.com/api/public/0901d1968089d1b4/pdf_preview_medium/0901d1968089d1b4_pdf_preview_medium.pdf
        source_quality: primary
        equipment: bought
        confidence: handbook
      - id: c5
        text: 'Three support points avoid rocking without needing four points to be coplanar: 3 points'
        value: '3'
        unit: points
        source_url: https://web.iitd.ac.in/~jpkhatait/docs/me-2009-sep2-exactconstraint.pdf
        source_quality: secondary
        equipment: any
        confidence: secondary
      - id: c6
        text: In a two-support shaft arrangement one support locates axially and the other absorbs thermal growth and tolerance
          accumulation
        value: null
        unit: null
        source_url: https://www.reliableplant.com/Articles/Print/27189
        source_quality: secondary
        equipment: bought
        confidence: secondary
      sources:
