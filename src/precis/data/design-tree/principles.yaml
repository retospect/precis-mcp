    tolerance-stack:
      id: principles/tolerance-stack
      role: principle
      coverage: deep
      summary: Start from a numeric assembly requirement (clearance, interference, endplay), trace the signed loop of contributors
        between the two functional features, and add them worst case or RSS. Pick datums from the real seating scheme and
        fits from ISO 286, not from dimensioning convenience.
      applies: per functional gap (fits, clearances, alignment)
      checks:
      - For each gap that must stay open or closed, list the dimensions in the loop and add worst case; use RSS only for many
        independent contributors.
      - Take each contributor's tolerance from the process (printer test coupon, machining class, bought-part datasheet),
        not from the drawing default.
      - Include temperature, moisture swell and coating thickness where they matter.
      - Dimension critical features from shared functional datums, not as a chain.
      - If the budget does not close, add an adjuster or a shim, or change the datum, before tightening everything.
      issues:
      - issue: RSS used to claim a guaranteed fit on a drifting process
        fix: Worst case for guarantees, or capable SPC with a documented statistical model
        failure_mode: assembly-error
      - issue: Tolerances added without signs
        fix: Signed loop, absolute values only after finding the worst direction
        failure_mode: assembly-error
      - issue: Chain dimensioning of hole to hole
        fix: Dimension from a common datum or a controlled pattern
        failure_mode: assembly-error
      - issue: Datum differs from assembly seating surface
        fix: Choose datums from the surfaces that actually locate the part
        failure_mode: assembly-error
      - issue: Two precision dowel patterns both treated as locators
        fix: One primary pattern; slot or clearance at the secondary
        failure_mode: assembly-error
      - issue: Every part tolerance tightened to meet a gap
        fix: Attack dominant contributors, shift nominal, GD&T on the functional relation, or adjustment
        failure_mode: assembly-error
      - issue: Only plus-minus sizes in the stack
        fix: Include position, orientation, form and datum mobility
        failure_mode: assembly-error
      - issue: Transition fit where function needs certainty
        fix: True clearance or interference fit with worst-case limits met
        failure_mode: assembly-error
      literature:
      - ASME Y14.5-2018 (R2024) Dimensioning and Tolerancing
      - ASME Y14.5.1-2019 Mathematical Definition
      - ISO 286-1:2010 and ISO 286-2 limits and fits
      - Meadows, Tolerance Stack-Up Analysis per the ASME Y14.5 Standard
      - 'Meadows, Geometric Dimensioning and Tolerancing: Applications, Analysis and Measurement'
      rules:
      - id: c1
        text: Worst-case stack T_WC is the arithmetic sum of absolute contributor tolerances
        value: sum |Ti|
        unit: null
        source_url: https://projectech.in/guides/tolerance-stackup-explained-guide/
        source_quality: weak
        equipment: any
        confidence: secondary
      - id: c2
        text: 'RSS stack T_RSS is the square root of the sum of squared contributor tolerances: sqrt(sum Ti^2)'
        value: sqrt(sum Ti^2)
        unit: null
        source_url: https://projectech.in/guides/tolerance-stackup-explained-guide/
        source_quality: weak
        equipment: any
        confidence: secondary
      - id: c3
        text: 'Worked example: contributors of 0.10, 0.10, 0.05, 0.05 mm give worst case 0.30 mm and RSS 0.158 mm'
        value: 0.30 / 0.158
        unit: mm
        source_url: https://projectech.in/guides/tolerance-stackup-explained-guide/
        source_quality: weak
        equipment: any
        confidence: shop-rule
        note: our own arithmetic (sum 0.30; square root of 0.0250 = 0.158); not from the cited page; not DRC-enforceable
