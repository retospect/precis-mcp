    mistake-proofing:
      id: principles/mistake-proofing
      role: principle
      coverage: deep
      summary: For each wrong part, orientation, omission, order or mating pair, either make it physically impossible or detect
        it where it happens. Make parts fully symmetric or unmistakably asymmetric; markings alone are a fallback.
      applies: per-assembly
      checks:
      - 'A part that fits only one way should only fit one way: make asymmetric parts visibly asymmetric, or key them.'
      - Mirror-image (left and right) parts are marked or keyed so they cannot be swapped.
      - 'Similar screws of different length in one assembly: a too-long screw must not damage anything; otherwise use one
        length.'
      - Connectors and polarised parts cannot be plugged reversed.
      - The keying is strong enough that it cannot be forced.
      issues:
      - issue: Cover fits both ways but only one is functional
        fix: Offset one hole, add asymmetric dowels or tab and slot
        failure_mode: assembly-error
      - issue: Slight asymmetry that is easy to overlook
        fix: 'Exaggerate: unequal pin spacing, large notch, different guide-pin diameters'
        failure_mode: assembly-error
      - issue: Left and right brackets look alike
        fix: One common part, or distinct hole spacing and geometry
        failure_mode: assembly-error
      - issue: Connector can be forced into wrong socket
        fix: Notch, asymmetric shell, offset pins, different families
        failure_mode: assembly-error
      - issue: Seal or gasket can be reversed
        fix: Locating shoulder or asymmetric section; if harmless, make truly symmetric
        failure_mode: assembly-error
      - issue: Flexible part folds into wrong route
        fix: Formed or keyed part, routing clips, distinct end fittings
        failure_mode: assembly-error
      - issue: Screw omitted or miscounted
        fix: Captive fasteners, counting driver, fixture exposing all holes
        failure_mode: assembly-error
      - issue: Part inserted before its prerequisite
        fix: Make the later part unavailable until the earlier one is present
        failure_mode: assembly-error
      - issue: Orientation only marked TOP, not blocked
        fix: Add blocking geometry; use marking as a fallback only
        failure_mode: assembly-error
      literature:
