            twist-lock:
              id: join/service/releasable-form-lock/twist-lock
              role: leaf
              coverage: deep
              principle: form
              directness: direct
              implies:
                class: rigid
              summary: Axial entry then short rotation locks lugs behind shoulders or a spiral cam. Catalogue quarter-turn
                fasteners for panels with known loads; custom bayonet for compact fast coupling. Needs detent against back-rotation.
              when:
              - separable=frequent or service, quick access without loose hardware
              - load_kind=clamping, pull-off, bearing-reacted shear, modest torsion
              - access=one-side or blind rear
              - process=sheet metal panels (catalogue fastener), moulded plastic (integral lugs, high quantity), machined/cast
                metal housings
              - quantity low-medium (catalogue), high (integral moulded)
              avoid_when:
              - separable=never or tamper-proof
              - large bending, axial tension, continuous torque, pressure vessel or fatigue load without engineered lugs and
                test
              - FDM final part for high-cycle, high temperature, pressure or safety-critical use
              - friction-only lock in vibration, ice, dirt or fluid
              - thin unsupported sheet edge bearing the lug
              - operator cannot see or feel locked position and there is no detent
              variants:
              - spiral-cam quarter-turn (internal or external cam)
              - bayonet lug-and-slot
              - bayonet with detent
              - cam-ramp clamping bayonet
              - snap-bayonet
              - panel quarter-turn fastener (clip-on, rivet-on, weld-on, press-in)
              - hand or tool operated head
              - single, two, three or multi-lug bayonet
              tradeoffs:
              - 'vs screw: far faster, no loose screw, lower preload and load capacity'
              - 'vs threaded union: faster, less sealing and load capacity'
              - 'vs snap-fit: positive lock and panel clamp, more complex'
              - 'vs adhesive or rivet: serviceable, not sealed or vibration-proof'
              - 'vs magnet: stronger retention, slower'
              howto:
              - For catalogue fasteners select the receptacle first, compute total material thickness, then pick stud length
                from the maker table.
              - Let the lug shoulder carry axial load; the detent only resists back-rotation.
              - Use symmetric multiple lugs, with calculated bearing stress, lug shear and torque capacity.
              - Give entry clearance larger than locking clearance; FDM start 0.15-0.25 mm tangential, 0.3-0.4 mm axial entry
                per side.
              - Make the entry leg longer than lug height, add lead-in chamfer, hard end stop and a visible mark or audible
                click.
              - Add a separate O-ring groove and compression stop for sealing; do not let lugs set compression.
              - Back thin sheet with clip, flange, backing plate or self-clinching receptacle.
              - For plastic snap-bayonet use 60% of one-time allowable strain for repeated use.
              issues:
              - issue: no positive stop or detent
                fix: end stop, detent, spring or over-centre feature
                failure_mode: loosening
              - issue: detent carries service load
                fix: lug shoulder carries axial load
                failure_mode: overload
              - issue: sharp lug roots and weld lines
                fix: fillets, taper, keep layer boundaries off root
                failure_mode: fatigue
              - issue: plastic cantilever too short or thick
                fix: longer and thinner, strain-based sizing
                failure_mode: fatigue
              - issue: unsupported thin sheet receptacle
                fix: backing plate or formed flange
                failure_mode: overload
              - issue: nylon dimensions drift with moisture
                fix: use conditioned material data
                failure_mode: environmental-degradation
              - issue: sustained load on plastic lug
                fix: metal receptacle or insert, more lugs
                failure_mode: creep-preload-loss
              - issue: crevice and galvanic corrosion in track
                fix: stainless or coated, isolate, drain
                failure_mode: galvanic-corrosion
              - issue: incomplete engagement
                fix: lead-in, indicator, tactile detent
                failure_mode: assembly-error
              - issue: abrasive wear of lug
                fix: bigger bearing area, hard insert, lubricant
                failure_mode: wear-fretting
              axes:
                locking: relevant - detent, spring or over-centre feature prevents back-rotation
                captive: relevant - catalogue stud retainers keep fastener with the panel
                corrosion: relevant - stainless for outdoor; galvanic pairs, crevice in tracks
                bearing-face: relevant - lug bearing area and thin sheet edge bearing
                material-direction: relevant for FDM and moulded lugs - layers, weld lines at root
              rules:
              - id: c1
