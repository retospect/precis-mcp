            shoulder-screw:
              id: join/service/threaded/shoulder-screw
              role: leaf
              coverage: deep
              principle: form
              directness: indirect
              implies:
                class: revolute
                mechanism: screw
              summary: ISO 7379 socket-head screw with a ground unthreaded shoulder (6.5 to 25 mm) smaller thread. The shoulder
                is the pivot, guide or locator; thread only retains. Moderate load, removable, needs a bushing for soft hole
                material.
              when:
              - separable=service
              - load_kind=static or low cyclic transverse
              - access=axial and socket tool
              - process=machined holes (not as-cast)
              - shoulder runs in a bushing or hard hole
              - quantity low-to-medium
              avoid_when:
              - high alternating bending or torsion (use pin or shaft)
              - permanent joint
              - bare steel in soft aluminium or unfilled plastic under load
              - as-cast journal holes
              - thin sheet without spacer
              - very high volume
              - no axial access
              variants:
              - black-oxide 12.9 steel
              - stainless 304 (303 supplier)
              - ground polished shoulder
              - knurled or plain head
              - various shoulder lengths
              - non-ISO sizes
              - hardened 33-38 HRC
              - with bushing/washer/spacer
              tradeoffs:
              - vs dowel - removable and axially retained, but threaded stress concentration and lower shear capacity
              - vs clevis pin - easier with tapped hole only, poorer axial control
              - vs bolt plus spacer - one part, controlled journal
              - vs machined shaft - cheaper and standard, weaker in bending and fatigue
              howto:
              - Size shoulder diameter and length for shear, bearing and bending from the shoulder, not the thread.
              - Keep threads out of the moving bearing hole; add a bushing or sleeve in soft parts.
              - Specify a fit (for example H7/g6) for the mating hole, with shoulder length plus running clearance.
              - Add counterbore or relief at the shoulder fillet so it seats.
              - Support the pivot at two lugs when bending matters.
              - Use maker torque, not a class 12.9 bolt table.
              - Add locking (threadlocker, prevailing-torque) if vibration.
              issues:
              - issue: threads lie in bearing hole
                fix: hole longer than shoulder only or add bushing
                failure_mode: wear-fretting
              - issue: shoulder length equals stack with no allowance
                fix: add running clearance
                failure_mode: assembly-error
              - issue: over-torque at small shoulder transition
                fix: maker torque
                failure_mode: overload
              - issue: soft plastic or Al hole as bearing
                fix: bushing
                failure_mode: wear-fretting
              - issue: stainless against aluminium wet
                fix: isolate and seal
                failure_mode: galvanic-corrosion
              - issue: cantilever long pivot
                fix: two lugs, larger dia
                failure_mode: fatigue
              axes:
                locking: relevant (shoulder sets clearance; locking and preload are separate functions)
                captive: relevant (screw retained by thread; consider retainer if axial access lost)
                corrosion: relevant (stainless vs black oxide, galvanic with aluminium)
                bearing-face: relevant (shoulder bearing pressure on lug and bushing)
                material-direction: relevant for FDM layers across shear
              rules:
              - id: c1
                text: ISO 7379 covers shoulder diameters 6.5 to 25 mm
                value: 6.5-25
                unit: mm
                equipment: bought
                source_url: https://cdn.standards.iteh.ai/samples/14078/66d6be2c979341abb895fa52330708be/ISO-7379-1983.pdf
                source_quality: primary
                confidence: standard
