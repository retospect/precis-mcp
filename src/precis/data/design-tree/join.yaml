  corrosion:
    id: axes/corrosion
    role: axis
    coverage: deep
    summary: Pick compatible metals first, then favourable area ratio (a small anode on a large cathode is the bad case; keep
      the anode large), then keep water out and drain it, then isolate, coat and seal holes and faying edges. Anodic-index
      limits and NASA couple criteria give numbers. One source prints a 10:1 area ratio the wrong way round; it is not used
      here.
    when:
    - always for metal/metal joints; stronger need outdoors, salt, humid, chemical, or hidden/uninspectable joints
    - 'dissimilar pair unavoidable: make fastener the cathodic (more noble) member, isolate or seal'
    - 'permanent or semi-permanent fasteners with access at assembly: wet installation with sealant or inhibiting compound'
    - 'water can collect in castings, enclosures, sheet folds: add low-point drains and vents'
    avoid_when:
    - small anodic fastener or washer on a large cathodic part
    - coating relied on at rubbing interfaces, high bearing pressure, scratched edges
    - isolating washers where preload creep or loss of electrical bonding matters
    - sealant that blocks the only drain or attacks polymers
    - cathodic protection for small dry mechanical joints
    variants:
    - same or compatible metal pair, plated fastener, corrosion-resistant insert
    - 'electrical isolation: gasket, isolating washer, sleeve, coating'
    - 'barrier compound or wet install: sealant, inhibiting paste, primer'
    - 'coating: anodize, conversion, plate, paint, powder coat'
    - faying-surface and edge sealing
    - drainage and ventilation
    - sacrificial anode or impressed current (large wet structures)
    tradeoffs:
    - 'compatible materials beat barriers: remove the driving force instead of blocking it'
    - isolation adds thickness, tolerance stack and creep risk
    - sealants block electrolyte but hide corrosion and hinder disassembly
    - drainage preferred over trapping liquid behind a seal
    howto:
    - 'order of preference: compatible materials, favourable area ratio, eliminate water, isolate or coat, seal holes and
      faying edges, drain, control preload'
    - check anodic-index difference against the environment limit
    - treat holes, cut edges, threads and countersinks, not just faces
    - wet-install fasteners; seal under heads on removable ones
    - design a positive drain and verify it stays open after sealing
    - keep electrical bonding separate from corrosion isolation
    - do not assume cast alloy is galvanically equal to its wrought counterpart
    - for critical joints use the governing compatibility standard, not generic charts
    issues:
    - issue: small anodic screw/washer on large noble part
      fix: same or more noble fastener, isolate, enlarge anodic area
      failure_mode: galvanic-corrosion
    - issue: bare dissimilar metals under bolt head or washer
      fix: compatible coating, insulating washer or sleeve, wet install
      failure_mode: galvanic-corrosion
    - issue: tight fitted joint with electrolyte trapped
      fix: seal interface or drain
      failure_mode: crevice-corrosion
    - issue: sealant or gasket blocks the drain
      fix: positive low-point drain, check after assembly
      failure_mode: crevice-corrosion
    - issue: hydrogen embrittlement of hard plated high-strength fastener in wet service
      fix: control plating and baking, qualify
      failure_mode: embrittlement
    - issue: isolator creeps and loses clamp load
      fix: metal load path or compression limiter
      failure_mode: creep-preload-loss
    - issue: corrosion product or sealant breaks electrical bond
      fix: qualified bonding washers, separate bond path
      failure_mode: assembly-error
    axes:
      locking: 'relevant: threadlocker is not a corrosion barrier; check chemistry vs plating'
      captive: 'n/a: no direct link beyond material selection'
      corrosion: this axis
      bearing-face: 'relevant: coating breaks down under high bearing pressure and fretting'
      material-direction: 'relevant: FDM parts are porous and anisotropic, seal them'
