        pinned-retained:
          id: join/service/pinned-retained
          role: method
          children:
            pin-and-clip:
              id: join/service/pinned-retained/pin-and-clip
              role: leaf
              coverage: deep
              principle: form
              directness: indirect
              implies:
                class: revolute
                mechanism: pin
              summary: Detachable transverse-load pivot or link; the pin carries shear and bearing, the clip only stops axial
                escape. Not a preload joint.
              when:
              - separable=service and load_kind=static or low-cycle, load transverse to pin axis
              - double-shear clevis geometry possible
              - access=one-side (hairpin, ball-lock, ring) or both-sides (cotter)
              - quantity low to medium, catalogue pins available
              - material_pair steel pin in steel, bronze or bushed lug
              avoid_when:
              - separable=never, sealing needed, or preload required
              - significant axial tension, prying, bending, impact, torsion on the pin
              - load_kind=cyclic or shock and safety-critical, unless calculated and tested
              - process=FDM or moulded polymer lug bearing directly on pin under high load
              - access=none, clip cannot be inspected or replaced
              - vibration, salt or chemical environment without tether, coating and inspection plan
              - very high quantity where an integral snap, rivet or clinch is cheaper
              variants:
              - clevis pin plus cotter (split) pin
              - clevis pin plus hairpin or R-clip
              - clevis pin plus retaining ring or E-clip
              - quick-release ball-lock or pip pin
              - slotted spring pin
              - coiled spring pin
              - tethered quick-release pin
              tradeoffs:
              - 'vs bolt and nut: faster removal, but no preload and weaker against vibration and fatigue'
              - 'vs shoulder screw: cheaper and quicker, less accurate bearing diameter'
              - 'vs dowel: removable, but locates less precisely'
              - 'vs rivet or weld: serviceable, but larger and clip can be lost'
              - 'vs snap-fit or living hinge: stronger and tolerant of load, more parts'
              howto:
              - Put the pin in double shear in a symmetric clevis and keep the gap between lugs minimal.
              - Check every load path, not just pin shear - pin bending, lug bearing, edge tear-out, net-section tension,
                clip groove.
              - Make the clip a retainer only; shoulder or head carries the load.
              - Use hardened pin and bushing, or a metal insert, where the lug is plastic, thin aluminium or cast.
              - For spring pins pick duty and diameter from applied force and host material using the manufacturer shear table.
              - Add a tether or secondary capture where loss of the pin is hazardous or creates foreign objects.
              - Print FDM lugs as thick bosses with layers around the load path and use a metal pin.
              issues:
              - issue: single shear on a substantial load
                fix: use symmetric double-shear clevis
                failure_mode: excess-deflection
              - issue: gap between centre lug and clevis arms makes pin a beam
                fix: close gap with spacers or washers and centre the load
                failure_mode: overload
              - issue: loose hole on a pivot
                fix: ream aligned holes, replaceable bushing, controlled clearance and lubrication
                failure_mode: wear-fretting
              - issue: excessive countersink or large hole in thin shaft or boss
                fix: small burr-break chamfer only, limit hole to a fraction of shaft diameter
                failure_mode: fatigue
              - issue: clip carries structural load or is lost
                fix: tether, positive lock, secondary capture
                failure_mode: lost-part
              - issue: dissimilar metals in wet service
                fix: isolate, coat, drain, anti-seize
                failure_mode: galvanic-corrosion
              - issue: polymer lug bears on pin
                fix: metal bushing or insert, thicker boss
                failure_mode: creep-preload-loss
              - issue: quick-release pin relied on to take axial tension or backs out under vibration
                fix: positive lock with load path not through the balls
                failure_mode: loosening
              axes:
                locking: relevant - clip, hairpin, ball-lock or tether is the retention; vibration can back clips out
                captive: relevant - tether or captive pin prevents loss
                corrosion: relevant - steel pins and clips in wet or salt service, galvanic pairs with stainless or copper
                bearing-face: relevant - lug bearing, hole elongation, bushing needed for soft or polymer lugs
                material-direction: relevant for FDM and cast lugs - do not split lug across layers
              rules:
              - id: c1
