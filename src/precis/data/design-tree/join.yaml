    permanent:
      id: join/permanent
      role: method
      when: separable=never
      children:
        material-bond:
          id: join/permanent/material-bond
          role: method
          children:
            weld:
              id: join/permanent/material-bond/weld
              role: leaf
              coverage: deep
              principle: material-bond
              directness: direct
              implies:
                class: rigid
                mechanism: fuse
              summary: Fuse the parts permanently, by fusion or resistance welding for metals, or ultrasonic, hot-plate, vibration
                and similar for thermoplastics. Joint strength is governed by weld detail and workmanship, not parent metal.
              when:
              - separable=never and the joint must carry load, seal or resist vibration without fasteners
              - metals with compatible alloys and a qualified procedure (sheet, frames, tanks, pressure equipment)
              - thermoplastic pair of the same or compatible polymer; moulded parts at high volume (ultrasonic)
              - access to torch, electrode or horn and room for inspection
              - FDM prototypes in the same filament, with a tongue-and-groove for alignment
              avoid_when:
              - service, recycling by material or adjustment is needed
              - cyclic load without using a code fatigue detail; peel or eccentric load
              - hardened or heat-treated metals that cannot lose properties, or crack-prone alloys
              - thermosets or unrelated polymer pairs
              - closed cavities, blind roots or no line of sight
              - corrosive service with intermittent welds or sealed lap crevices
              - very large or poorly toleranced parts for ultrasonic welding
              variants:
              - fusion welding (stick, MIG/MAG, TIG, flux-core, submerged arc, laser, electron beam)
              - resistance spot/seam/projection
              - solid-state (friction, friction-stir, ultrasonic metal, diffusion)
              - ultrasonic energy-director and shear joints
              - hot-plate
              - spin
              - vibration
              - laser/infrared
              - hot-gas and extrusion welding
              tradeoffs:
              - '{''versus bolts'': ''no parts, holes or loosening, but not removable''}'
              - '{''versus rivets'': ''continuous seal, but heat distortion and HAZ''}'
              - '{''versus adhesive'': ''higher temperature and load, but needs heat and similar materials''}'
              - '{''versus braze/solder'': ''stronger joint but higher heat input and distortion''}'
              - ultrasonic is fast and clean for moulded plastics but needs horn access, tooling and controlled tolerances
              howto:
              - Size the weld from calculated throat, load direction and eccentricity, not parent strength alone.
              - Pick the code detail category and size the weld to the load plus the code minimum, not oversized.
              - Use smooth run-outs and keep starts, stops and ends away from peak stress.
              - Prefer full-penetration or continuously sealed joints where crevices matter.
              - Plan weld sequence, balance and fixturing against distortion; machine datums after welding.
              - Specify WPS/PQR, welder qualification and inspection method.
              - For ultrasonic, mould an energy director plus alignment feature and flash trap.
              - Round corners near ultrasonic welds and support the part under the horn.
              issues:
              - issue: weld designed from nominal parent strength
                fix: compute throat, HAZ limits and code fatigue detail
                failure_mode: overload
              - issue: oversized weld
                fix: size to calculated load and code minimum
                failure_mode: thermal-mismatch
              - issue: short fillet weld
                fix: effective length at least 4x size
                failure_mode: overload
              - issue: weld ends at corners or abrupt geometry
                fix: smooth run-outs, stagger starts and stops
                failure_mode: fatigue
              - issue: sealed lap joint creates crevice
                fix: butt detail or continuous seal, drain and coat
                failure_mode: crevice-corrosion
              - issue: ultrasonic weld on broad flat contact
                fix: add uniform energy director
                failure_mode: assembly-error
              - issue: wrong energy-director shape for the polymer
                fix: right-angle triangle for amorphous, 60 deg equilateral for semi-crystalline; Dukane uses the 60 deg shape
                  for polycarbonate and acrylic too
                failure_mode: assembly-error
              - issue: sharp corners cause plastic weld cracking
                fix: radii of 0.2-0.5 mm and support under the horn
                failure_mode: brittle-fracture
              - issue: FDM weld ignores layer anisotropy
                fix: same filament, orient interface, thicken wall, add interlock
                failure_mode: overload
              - issue: highly restrained assembly cracks or distorts
                fix: weld sequencing, balanced welds, preheat control
                failure_mode: brittle-fracture
              axes:
                locking: 'n/a: permanent fusion, nothing to loosen'
                captive: 'n/a: no loose part'
                corrosion: 'relevant: crevices, trapped flux, sensitised HAZ and dissimilar couples; avoid intermittent welds
                  in corrosive service'
                bearing-face: 'n/a: no clamped faces'
                material-direction: 'relevant: FDM layer anisotropy at the weld; fibre orientation in filled plastics'
