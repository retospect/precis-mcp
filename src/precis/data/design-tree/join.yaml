            permanent-snap:
              id: join/permanent/permanent-mechanical/permanent-snap
              role: leaf
              coverage: deep
              principle: form
              directness: direct
              implies:
                class: rigid
                mechanism: snap
                rank: 4
              summary: Moulded cantilever or annular hook assembled by elastic deflection and retained by a steep (90 degree)
                return face. Cheapest one-time plastic assembly; strain-limited, creep and root-fatigue sensitive, not for
                primary structural load.
              when:
              - separable=never or destructive
              - far_material=thermoplastic, tough grade (POM, PA, PP, PC, PC/ABS, ABS, PBT) against a stiff catch
              - process=moulded, medium to high quantity, snap aligned with mould opening or with relief hole
              - load is axial pull-off, shear, vibration restraint, enclosure retention; hard stop carries service load
              - FDM only for prototypes with beam in the strong plane
              avoid_when:
              - parts must be opened for service, repair, recycling or inspection
              - snap is the primary structural carrier for bending, impact, pressure, torque
              - 'brittle: brittle thermoplastic, ceramic, glass, cast metal'
              - hot, solvent, UV or sustained strain without creep data
              - very short thick hooks (high strain)
              - FDM production, tight tolerance, high cycle
              - metal-on-metal snap without spring design
              variants:
              - straight cantilever
              - tapered cantilever
              - L- or U-shaped cantilever
              - multiple cantilevers
              - annular (ring) snap
              - segmented annular snap
              - torsional snap
              tradeoffs:
              - vs releasable snap - higher retention, no service
              - vs screw - fewer parts and cost, no inspection or high temperature
              - vs rivet/clinch - no separate operation, plastic only
              - vs adhesive/welding - no cure or equipment, but shape-dependent
              - vs press fit - positive axial retention, but needs undercut
              - vs metal latch - cheaper, worse fatigue, creep and heat
              - vs dovetail/keyed joint - blind snap assembly possible, but dovetail carries shear and torque better
              - vs ultrasonic/thermal welding - no horn, energy director or compatible-resin need, but weld is sealed and
                stronger
              howto:
              - Choose the resin by allowable strain, modulus, creep, fatigue, temperature and moisture of the exact grade,
                not tensile strength.
              - Cantilever root strain approx 1.5 t Y / L^2; correct with short-beam factor Q if beam is stubby.
              - Add a root fillet with R/t of at least 0.5 (BASF Snap-Fit Design Manual; Covestro gives R/h about 0.6 as an
                optimum). Taper the beam to even out stress.
              - Use a shallow lead face and a 90 degree return face with a long enough land to load it in tension.
              - Leave the snap stress-free after assembly and add a hard stop so service loads bypass the arm.
              - Check worst-case tolerances, shrinkage and print scale.
              - For annular snaps segment the ring and round slot ends if insertion force is high.
              - For FDM orient the beam to bend in the layer plane and enlarge the root radius.
              issues:
              - issue: sharp beam root
                fix: generous root fillet (R/t at least 0.5, BASF Snap-Fit Design Manual)
                failure_mode: fatigue
              - issue: beam short or thick
                fix: lengthen, taper, U/L shape, torsional or annular, use Q factor
                failure_mode: overload
              - issue: hook left bent after assembly
                fix: stress-free installed state
                failure_mode: creep-preload-loss
              - issue: angled return cams open
                fix: 90 degree return or secondary stop
                failure_mode: loosening
              - issue: insertion force too high
                fix: smaller undercut, shallower lead, longer beam, segmented ring
                failure_mode: assembly-error
              - issue: no tolerance allowance
                fix: dimension worst case and test extremes
                failure_mode: assembly-error
              - issue: snap carries operating bending
                fix: hard stop
                failure_mode: fatigue
              - issue: FDM layers peel at root
                fix: reorient, bigger root radius
                failure_mode: brittle-fracture
              - issue: mould undercut ignored
                fix: align with pull, relief hole, side action or shut-off
                failure_mode: assembly-error
              - issue: weld lines or sink at root
                fix: move root away from weld lines, control filling
                failure_mode: brittle-fracture
              - issue: annular ring too stiff
                fix: slots, lower lip height, longer compliant wall, segmented fingers
                failure_mode: overload
              - issue: insufficient retention
                fix: more land length, more hooks, steeper return face or a separate structural stop
                failure_mode: loosening
              - issue: resin picked by tensile strength alone
                fix: pick by allowable strain, modulus, creep, fatigue, temperature, moisture
                failure_mode: environmental-degradation
              axes:
                locking: relevant - 90 degree return face is the lock; shallow angles cam open
                captive: n/a - snap retains one part; no loose-fastener issue
                corrosion: relevant - only for metal catches; polymers see hydrolysis, solvent, UV instead
                bearing-face: relevant - return-face land length and contact area
                material-direction: relevant - FDM layers, fibre orientation, weld lines at the root
              rules:
              - id: c1
                text: use about 60 percent of single-assembly allowable strain for repeated assembly
                value: '60'
                unit: percent
                equipment: injection-mould
                source_url: https://solutions.covestro.com/-/media/covestro/solution-center/brands/downloads/imported/1556891135.pdf
                source_quality: primary
                confidence: handbook
              - id: c2
                text: Covestro short-term strain at 23 C - high-heat PC 4, PC/ABS 2.5, PC blends 3.5, PC 4, 10 pct GF PC 2.2,
                  20 pct GF PC 2.0
                value: 2.0-4
                unit: percent
                equipment: injection-mould
                source_url: https://solutions.covestro.com/-/media/covestro/solution-center/brands/downloads/imported/1556891135.pdf
                source_quality: primary
                confidence: handbook
              - id: c3
                text: DuPont allowable strain - Delrin 100 8 pct once and 2-4 pct frequent; Delrin 500 6 and 2-3; Zytel 101
                  dry 4 and 2; GR Zytel dry 0.8-1.2 and 0.5-0.7; Rynite PET-GR 1 and 0.5
                value: 0.5-8
                unit: percent
                equipment: injection-mould
                source_url: https://manuals.plus/m/0792029a9d640e7de3548cee7b703e1ab6b225f151a63197f6994641f998aebe
                source_quality: primary
                confidence: unverified
                note: source could not be read; value kept for review
              - id: c4
                text: Snap-beam root fillet radius to thickness ratio R/t of at least 0.5 (BASF Snap-Fit Design Manual)
