  material-direction:
    id: axes/material-direction
    role: axis
    coverage: deep
    summary: 'Carry the dominant joint load in the strong continuous direction: FDM load in the XY plane not across Z layers,
      sheet bends across the rolling direction, wood fasteners in side grain not end grain, composite bolt zones with balanced
      0/+-45/90 plies and large edge distance.'
    when:
    - 'process=FDM: tension and bending in the XY plane, bolt axis not across layer interfaces'
    - 'process=sheet: critical bend lines perpendicular to rolling direction'
    - 'far_material=wood: screws and bolts into side grain, allow moisture movement'
    - 'far_material=composite: fibres aligned with main load plus balanced off-axis plies at fasteners'
    avoid_when:
    - bolt axis across weak FDM layer interface or wood end grain
    - bend parallel to grain at minimum radius in hard tempers
    - all-zero-degree fibres around a composite bolt hole
    - hole through a high-value zero-degree load path without doublers
    - wood trapped rigidly across its grain
    variants:
    - FDM / layer-built orientation
    - rolled sheet bend direction (across grain, or 45 degrees as fallback)
    - wood side-grain vs end-grain fastening
    - composite ply layup around fasteners, bonded fittings
    tradeoffs:
    - bending across grain costs nesting efficiency; parallel bend needs bigger radius or softer temper
    - metal insert in FDM adds a step but gives wear resistance and preload retention
    - composite bolted joint needs snug fit and edge distance; bonded fitting avoids holes
    howto:
    - put material axes and allowable directions on the drawing
    - 'FDM: print holes undersize, drill or ream critical ones, fit metal inserts for repeated tightening'
    - 'FDM: use radii and chamfers at bosses and ribs; avoid long-term high stress (creep)'
    - 'sheet: pick inside radius from the supplier alloy-and-temper table; relieve bends; keep holes away from bends'
    - if a bend must run with the grain, raise radius, change temper, move bend or split the part
    - 'wood: side grain for screws and lag screws; allow seasonal movement with slotted holes or floating clips'
    - 'composite: ream holes, snug fit, washers, check bearing, net tension, shear-out, pull-through, delamination'
    - use ISO 286 named fits for fitted joints, not just close fit
    issues:
    - issue: isotropic metal rules applied to FDM, wood or composite
      fix: specify axes and test by orientation
      failure_mode: overload
    - issue: Z-direction tension or peel in FDM
      fix: reorient, load in XY, ribs, fillets, through-bolt or insert
      failure_mode: brittle-fracture
    - issue: sheet bent parallel to grain at tight radius cracks
      fix: bend across grain, raise radius, change temper
      failure_mode: brittle-fracture
    - issue: screw driven into wood end grain splits
      fix: side grain, through-bolt, cross dowel or connector
      failure_mode: overload
    - issue: wood swells and shrinks across a rigid joint
      fix: slotted holes, floating clips
      failure_mode: loosening
    - issue: only zero-degree fibres around composite bolt
      fix: add balanced +-45 and 90 plies, more edge distance
      failure_mode: overload
    - issue: sustained stress on FDM thermoplastic relaxes preload
      fix: metal insert, through-bolt, compression limiter
      failure_mode: creep-preload-loss
    axes:
      locking: 'n/a: orientation rule, locking handled separately'
      captive: 'n/a: no direct link'
      corrosion: 'n/a: not governed by direction (galvanic effects with carbon fibre are a separate pairing issue)'
      bearing-face: 'relevant: bearing and pull-through check in anisotropic laminates, wood and FDM; use washers'
      material-direction: this axis
