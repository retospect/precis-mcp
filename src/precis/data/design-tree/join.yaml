        permanent-mechanical:
          id: join/permanent/permanent-mechanical
          role: method
          children:
            rivet:
              id: join/permanent/permanent-mechanical/rivet
              role: leaf
              coverage: deep
              principle: form
              directness: indirect
              implies:
                class: rigid
                mechanism: rivet
              summary: Permanent, shear-loaded joint of thin sheet; solid rivet if both sides reachable, blind rivet if one
                side only. Weak for clamp load, sealing, creep-prone plastic, and anything needing disassembly.
              when:
              - separable=never
              - load_kind in {static, cyclic} and load is mainly in-plane shear or bearing, spread over several rivets
              - process=sheet, or thin moulded/FDM part with a broad head plus washer
              - access=both-sides (solid) or access=one-side (blind)
              - quantity medium to high (fast, automatable)
              avoid_when:
              - separable in {service, frequent}
              - high tensile clamp load, peel, or prying
              - far_material=composite with solid rivets (hole overstress, delamination)
              - sealing required, unless closed-end rivet plus validated seal
              - brittle (cast iron, porous casting, thin cast wall)
              - environment=salt/outdoor with unprotected dissimilar metals
              - sustained load on thermoplastic or FDM (creep)
              variants:
              - solid rivet, protruding or countersunk head (two-sided)
              - blind open-end break-mandrel
              - blind closed-end / sealed
              - structural blind rivet with locking mandrel
              - multi-grip / self-plugging
              - tubular, semi-tubular, split rivet
              - plastic rivet
              tradeoffs:
              - vs screw/bolt - fewer parts and cheaper, but no disassembly or preload
              - vs weld - no heat-affected zone, joins dissimilar materials, but not sealed or continuous
              - vs adhesive - immediate handling strength, but concentrated load at holes
              - vs clinch/self-pierce rivet - more flexible and repairable, but needs pre-drilled holes
              - vs threaded insert - no insert install, but no reusable thread
              - vs snap-fit - tolerates thinner parts and depends less on moulded flexure geometry, but is not tool-free or
                reversible
              howto:
              - Measure the actual stack thickness and pick a rivet whose grip range contains it; never select by length alone.
              - Drill/ream to the maker's hole range and deburr.
              - Keep edge distance at least 1.5D, preferably 2D, and pitch at least 3D.
              - In plastic or FDM use a head about 3 times the shank diameter plus a washer under the formed end; no countersunk
                heads.
              - Orient FDM parts so rivet load is in the layer plane.
              - Check rivet shear, sheet bearing, net-section, tear-out, pull-through and fatigue separately.
              - Use a closed-end or locked-mandrel rivet where the mandrel must be retained or the joint sealed.
              - Isolate dissimilar metals with coating, sealant or washers.
              issues:
              - issue: rivet length chosen without measuring stack
                fix: pick by grip range of measured stack
                failure_mode: assembly-error
              - issue: oversized or oval hole
                fix: drill/ream to maker range and deburr
                failure_mode: overload
              - issue: rivet too near edge or neighbour
                fix: 1.5D-2D edge, 3D-4D pitch
                failure_mode: overload
              - issue: countersunk head in thin sheet or plastic
                fix: protruding head, dimple, or washer
                failure_mode: overload
              - issue: unsupported plastic or FDM skin crushed
                fix: wide head plus washer, backing plate, rib, or insert
                failure_mode: creep-preload-loss
              - issue: solid rivet in composite
                fix: blind rivet or bolted/inserted joint
                failure_mode: brittle-fracture
              - issue: aluminium on steel without isolation
                fix: match materials or coat/seal/isolate
                failure_mode: galvanic-corrosion
              - issue: FDM load across layers
                fix: reorient to XY plane, ribs, or sleeve
                failure_mode: brittle-fracture
              - issue: ordinary open blind rivet in highly stressed joint
                fix: structural blind or solid rivet
                failure_mode: loosening
              - issue: micro-slip between sheets under vibration
                fix: stiffer joint, more clamp distribution, surface treatment
                failure_mode: wear-fretting
              - issue: open blind rivet used where joint must seal
                fix: closed-end or sealed rivet or qualified sealant process
                failure_mode: environmental-degradation
              - issue: mandrel not retained, loose mandrel rattles or becomes debris
                fix: locked-mandrel or closed-end rivet
                failure_mode: lost-part
              - issue: blind-side clearance or tool access ignored
                fix: model tool access and maker's minimum blind clearance
                failure_mode: assembly-error
              axes:
                locking: relevant - solid rivets lock better than ordinary blind; use locking-mandrel structural blind rivets
                  under vibration
                captive: n/a - rivet is a permanent fastener, nothing to lose
                corrosion: relevant - dissimilar-metal pairs and trapped moisture under heads
                bearing-face: relevant - broad head or washer needed on plastic and thin sheet
                material-direction: relevant - FDM layer orientation and composite lay-up
