            retaining-ring:
              id: join/service/pinned-retained/retaining-ring
              role: leaf
              coverage: deep
              principle: form
              directness: indirect
              implies:
                class: rigid
              summary: Groove-seated spring ring giving axial retention that can be removed. Groove material, not the ring,
                is often the limit.
              when:
              - separable=service, axial thrust retention of a part on a shaft or in a bore
              - load_kind=static or low-cycle thrust within manufacturer rating
              - process=machined metal groove, turned groove; stamped ring at high quantity
              - access=both-sides or shaft end reachable for pliers (axial rings); radial side access only (E-clip, C-clip)
              - material_pair groove in steel or hardened metal; aluminium or plastic needs deeper support
              avoid_when:
              - separable=never or tamper-proof required
              - high thrust, shock, eccentric or fatigue load without calculation - use nut, shoulder, bolted plate
              - groove in unreinforced polymer, FDM print, or thin soft casting under sustained load
              - high rotation speed on external ring without checking centrifugal cling loss
              - carbon steel ring in salt, water or chemicals
              - E-clip for more than light thrust
              variants:
              - DIN 471 external circlip
              - DIN 472 internal circlip
              - constant-section snap ring
              - heavy-duty circlip
              - E-clip DIN 6799 (radial)
              - C-clip or bowed E-ring
              - spiral wound ring (no lugs)
              - wire snap ring
              - wave or preload ring
              tradeoffs:
              - 'vs press-fit shoulder: serviceable, but needs a groove that weakens the shaft'
              - 'vs nut on thread: cheaper and shorter, lower capacity and no adjustable preload'
              - 'vs bolted end plate: fewer parts, lower load'
              - 'vs radial E-clip: axial ring has more thrust capacity, needs end access'
              - 'vs spiral ring: spiral gives continuous contact, harder to remove and automate'
              howto:
              - Pick the exact ring part number and material first, then copy its groove diameter, width, tolerance and corner
                limits.
              - Check both ring shear and groove deformation and use the lower capacity, with a safety factor.
              - Keep the load-bearing groove corner sharp and the retained part square with a small chamfer only.
              - Keep edge margin from the shaft or bore end at about three groove depths minimum.
              - Orient the ring so thrust loads it against the supported groove wall; put smooth stamped side toward the load.
              - Use stainless or alloy rings for wet, salt, chemical or food service.
              - Never reuse a ring that took permanent set; use correct pliers and installation limits.
              - For endplay control use a bowed or wave ring, not the plain ring.
              issues:
              - issue: groove yields or flares in soft host
                fix: stronger material, more wall, heavy-duty or spiral ring, shoulder or bolted retainer
                failure_mode: overload
              - issue: ring rolls out from rounded groove corner or tilted part
                fix: sharp supported corners, square seating face, full seating
                failure_mode: assembly-error
              - issue: groove too close to end
                fix: increase edge margin or use shoulder
                failure_mode: overload
              - issue: ring over-expanded at install
                fix: correct pliers and limits, replace yielded rings
                failure_mode: assembly-error
              - issue: cyclic thrust and notch fatigue
                fix: reduce stress concentration, full groove support, verify by test
                failure_mode: fatigue
              - issue: carbon steel in wet service
                fix: stainless, isolate galvanic pairs
                failure_mode: galvanic-corrosion
              - issue: hydrogen or low-temperature embrittlement of hardened ring
                fix: specified temper and plating process, no nicks
                failure_mode: embrittlement
              - issue: external ring lifts off groove at speed
                fix: check rated speed, use high-speed ring or other retention
                failure_mode: loosening
              - issue: micromotion ring/groove under vibration
                fix: control endplay, preload ring, harder surfaces
                failure_mode: wear-fretting
              axes:
                locking: relevant - ring is the axial retention; bowed ring removes endplay; plain ring can roll out
                captive: n/a - ring is a retainer, loss is mostly covered by groove seating
                corrosion: relevant - spring steel rusts, specify stainless, galvanic pair with housing
                bearing-face: relevant - retained part needs square bearing face and sharp groove wall
                material-direction: relevant for FDM or cast groove - layers across groove wall weaken it
              rules:
              - id: c1
                text: DIN 471 is external shaft rings, DIN 472 internal bore rings with grooves; both transfer axial force
                value: null
                unit: scope
                equipment: bought
                source_url: https://www.dinmedia.de/en/standard/din-472/272887139
                source_quality: primary
                confidence: standard
              - id: c4
