            solvent-weld:
              id: join/permanent/material-bond/solvent-weld
              role: leaf
              coverage: deep
              principle: material-bond
              directness: direct
              implies:
                class: rigid
                mechanism: fuse
              summary: Soften both mating faces with a solvent or solvent cement so the polymer chains interdiffuse and fuse
                as the solvent leaves. Only for plastics the same solvent dissolves (ABS, PMMA, PVC, PS, SAN, some PC), with
                a close fit and a broad overlap.
              when:
              - separable=never and plastic-to-plastic of the same or compatible grade
              - load mainly shear or compression over a well-fitting interface
              - moulded or extruded parts, pipe sockets, housings, sheet plastic with broad overlap
              - FDM ABS, ASA or compatible filament with a consolidated, clean, fitted surface
              - prototypes and low-to-medium volume with simple dispensing and a fixture
              - access to wet both faces, clamp at once and vent the vapour
              avoid_when:
              - service, repair or disassembly needed
              - peel, cleavage, bending or impact load; cyclic prying
              - PE, PP, PTFE, acetal and other inert or low-surface-energy plastics
              - PLA, PETG, nylon, TPU or filled FDM filaments unless the exact grade is shown to dissolve
              - metals and thermosets
              - airtight, enclosed or poorly vented joints that trap solvent
              - exposure to solvents, fuels or plasticisers plus stress (cracking)
              - very high volume, where ultrasonic or hot-plate welding removes solvent handling
              variants:
              - water-thin solvent for capillary joints
              - solvent cement with dissolved polymer (PVC D2564, ABS D2235, ABS-PVC D3138)
              - solvent-resin gap-filling paste
              - primer plus cement
              - solvent-assisted thermal or pressure welding
              - reactive acrylic cement (really an adhesive)
              tradeoffs:
              - '{''versus screws and rivets'': ''no holes or loosening but not reversible''}'
              - '{''versus structural adhesive'': ''no separate layer, but cannot join dissimilar materials or fill larger
                gaps''}'
              - '{''versus ultrasonic or hot-plate welding'': ''simple tooling, but solvent handling, cure time and residue''}'
              - no universal allowable strength; depends on grade, solvent, fit and cure
              howto:
              - Identify the exact resin and confirm the solvent attacks both faces; run a lap-shear test on production material.
              - Make the parts mate first; cement does not fix a large gap or warpage.
              - Design an overlap, sleeve, scarf, tongue-and-groove or flange so the joint works in shear.
              - Clean and dry both faces; remove release agent, dust, grease and coolant.
              - Use the least solvent, wetting one face where specified.
              - Fixture the joint under the supplier's pressure and time without distorting the parts.
              - Cure ventilated, never in an airtight cavity, and hold off service load for the stated cure time.
              - Round internal corners and relax stressed PMMA to avoid crazing.
              issues:
              - issue: choosing by 'it is plastic' rather than resin grade
                fix: identify the polymer and additives, test the solvent on both faces
                failure_mode: assembly-error
              - issue: butt joint loaded in bending or peel
                fix: overlap, sleeve, scarf, flange
                failure_mode: overload
              - issue: cement used to fill a large gap
                fix: improve the fit or use a gap-filling cement or adhesive
                failure_mode: assembly-error
              - issue: excess solvent bubbles and weakens the joint
                fix: apply minimum, wet one face
                failure_mode: brittle-fracture
              - issue: no fixture during evaporation
                fix: self-locating geometry and a clamp at the supplier's pressure
                failure_mode: assembly-error
              - issue: vapour trapped beside stressed plastic
                fix: vent and cure ventilated
                failure_mode: embrittlement
              - issue: sharp corners and residual stress with solvent
                fix: generous radii, relax PMMA, test after ageing
                failure_mode: environmental-stress-cracking
              - issue: sustained load opens the seam
                fix: larger overlap and mechanical support
                failure_mode: creep-preload-loss
              - issue: peel at one edge of a flat lap
                fix: return flange, wrap sleeve, fillet overlap
                failure_mode: fatigue
              - issue: FDM overlap loaded across layers
                fix: orient the overlap so layers are not separated, test printed coupons
                failure_mode: overload
              - issue: slip or fretting at an incompletely wetted seam
                fix: structural overlap, sleeve or mechanical locator; never use as a sliding bearing
                failure_mode: wear-fretting
              axes:
                locking: 'n/a: permanent chemical weld, nothing to loosen'
                captive: 'n/a: no loose part'
                corrosion: 'n/a: plastics do not corrode; solvent or chemical attack and crazing are the equivalent, see environmental-stress-cracking'
                bearing-face: 'n/a: no clamped faces'
                material-direction: 'relevant: FDM layer anisotropy across the overlap'
