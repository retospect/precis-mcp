            self-clinching-fastener:
              id: join/permanent/permanent-mechanical/self-clinching-fastener
              role: leaf
              coverage: deep
              principle: form
              directness: indirect
              implies:
                class: rigid
                mechanism: screw
                rank: 10
              summary: Press a nut, stud or standoff into a punched hole in ductile sheet so it cold-flows into the panel
                and stays. Gives a permanent thread or post in thin metal.
              when:
              - separable=never for the fastener-to-panel joint (the mating screw stays serviceable)
              - far_material=metal sheet, ductile, host hardness below the fastener's limit
              - process=sheet, medium to high quantity
              - access=both-sides (press from one side, anvil on the other)
              - a strong thread is needed in sheet too thin to tap
              avoid_when:
              - brittle, very hard, or very thin panels below the part's minimum sheet thickness
              - plastic, composite or soft panels (use a large-flange or other insert type)
              - hole position too close to an edge or another feature
              - one-side-only access (use a rivet nut)
              - low quantity where tooling and press are not justified
              variants:
              - self-clinching nut (round or hex)
              - self-clinching stud
              - self-clinching standoff
              - captive panel screw receptacle
              - flush-head and countersunk versions
              tradeoffs:
              - vs tapping the sheet - far stronger thread, but needs a press and a specific hole
              - vs weld nut - no heat or distortion, no coating burn-off
              - vs rivet nut - needs two-sided access, but gives higher push-out and torque-out capacity
              - vs loose nut and bolt - no second wrench, captive in the panel
              - performance data is per part number; a lookalike is not a substitute
              howto:
              - Take hole size and tolerance, minimum sheet thickness, edge distance and host hardness from the maker's drawing
                for the exact part number.
              - Size the hole for the coated state if the sheet is plated or painted before assembly.
              - Install with a parallel squeezing force in a press, not by hammering or by pulling with a screw.
              - Control hole burrs; the burr side faces the fastener flange.
              - Pick a serrated or hex-shank type where the torque is high.
              - Test push-out and torque-out in the real panel when the rated sheet is not what you use.
              issues:
              - issue: nominal hole used instead of the specified tolerance
                fix: use the maker's hole spec; control burrs and coating
                failure_mode: loosening
              - issue: part hammered in or pulled in by its own screw
                fix: parallel press force with an anvil
                failure_mode: assembly-error
              - issue: panel too hard or too thin
                fix: check host hardness and minimum sheet thickness before choosing the part
                failure_mode: overload
              - issue: too close to an edge or a neighbouring feature
                fix: use the specified edge distance and spacing
                failure_mode: overload
              - issue: standard part used in soft, brittle or composite panel
                fix: large-flange, slotted or composite-specific insert
                failure_mode: overload
              - issue: stainless fastener in aluminium or steel sheet in a wet place
                fix: match metals or isolate and seal the crevice
                failure_mode: galvanic-corrosion
              axes:
                locking: 'relevant: serrations or hex shank stop spin in the panel; the mating screw still needs its own locking'
                captive: 'relevant: the fastener is captive in the panel'
                corrosion: 'relevant: stainless insert in aluminium or steel needs isolation; crevice at the flange'
                bearing-face: 'relevant: flange size sets push-out and pull-through in soft sheet'
                material-direction: 'n/a: sheet grain is not the governing factor; hardness of the host is'
              rules:
              - id: c9
                text: example PEM stainless self-clinching nut - min sheet 0.125 in, hole 0.500 in +0.003/-0, edge 0.44 in,
                  host hardness at most HRB 70
                value: '0.125'
                unit: in
                equipment: sheet
                source_url: https://americas.bossard.com/products/cls-0624-2-by-penn-engineering.html
                source_quality: secondary
                confidence: secondary
              - id: c10
                text: example thinner-panel PEM nut - min sheet 0.091 in, hole 0.344 in +0.003/-0, edge 0.34 in
                value: '0.091'
                unit: in
                equipment: sheet
                source_url: https://americas.bossard.com/products/cls-0420-2-by-penn-engineering.html
                source_quality: secondary
