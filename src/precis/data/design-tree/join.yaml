  captive:
    id: axes/captive
    role: axis
    coverage: deep
    summary: Captive screws, washers, nuts and tethers prevent loss after release; they add no strength and do not hold preload.
      Best for small-to-medium panel fasteners (about M3-M6) in sheet metal that is serviced often; the numbers below are
      PEM catalogue values and are product-specific, not general rules.
    when:
    - separable=service, panel or guard removed repeatedly, dropped hardware causes damage or delay
    - 'sheet metal or thin panel: self-clinching, flare-mounted or floating captive screws'
    - 'plastic or FDM: through-bolt, nut pocket, metal insert, separate tether'
    - 'large or loaded bolts: conventional bolt plus separate tether, captive nut, wire or retention plate'
    avoid_when:
    - removal only at overhaul or dismantling
    - captive retention feature would be the main load path (structural, pressure, lifting, high-cycle fatigue)
    - sheet too hard, too thin, cold-worked or near a bend for clinching
    - polymer retainers or thin printed snap rings under heat, creep, UV or chemicals
    - one-off design where a standard screw plus tether is cheaper
    variants:
    - captive screw with threaded washer or retaining flange
    - self-clinching, flare-mounted, floating, spring-loaded, flush captive screws
    - captive washer (flat, flanged, snap-in, swaged)
    - tether (wire, cable, strip, chain, moulded web)
    - captive nut or receptacle
    - captive plunger or locating pin, surface-mount captive screw
    tradeoffs:
    - 'vs plain screw+nut: captive costs more, needs special hole, but gives one-sided access and no dropped screw'
    - 'vs clinch/rivet nut: nut stays but screw may not; stronger thread in thin sheet'
    - 'vs quarter-turn/Dzus: captive screws clamp harder but are slower'
    - 'vs snap fit: no fatigue/creep problem, but more parts'
    howto:
    - treat captivity as loss prevention; design preload, shear and fatigue separately
    - use the supplier torque for reduced-shank captive screws, not full-size thread torque
    - hold the manufacturer hole size, edge distance, sheet hardness and install side; do not deburr clinch holes
    - use floating retainers or slots to absorb panel misalignment
    - add spring, nylon patch or friction washer to stop rattle after release
    - choose metal tether or cable in safety-critical retention; give bend radius and strain relief
    - test pull-out and torque on production samples
    - for guards, ISO 14120 still requires risk assessment; captive screws alone do not make a guard safe
    issues:
    - issue: captive treated as load-rated
      fix: separate design of screw, panel bearing, retainer, tether; use supplier push-out data
      failure_mode: overload
    - issue: full-size screw torque on reduced-shank captive screw
      fix: use captive-product torque or test
      failure_mode: overload
    - issue: clinch part close to edge or bend or in hard sheet
      fix: min edge distance, flare-mount or softer sheet
      failure_mode: assembly-error
    - issue: retaining feature assumed to stop loosening
      fix: add preload, prevailing torque, adhesive or lockwire
      failure_mode: loosening
    - issue: stainless threads gall
      fix: dissimilar materials, anti-seize, controlled torque
      failure_mode: wear-fretting
    - issue: plastic tether or retainer under tension long-term
      fix: metal cable, spring or insert
      failure_mode: creep-preload-loss
    - issue: tether snags or bends sharply
      fix: bend radius, strain relief, end stops
      failure_mode: fatigue
    - issue: galvanic pair or crevice under washer
      fix: match materials or isolate, coat, drain
      failure_mode: galvanic-corrosion
    axes:
      locking: 'relevant: captivity does not maintain preload; add a real lock'
      captive: this axis
      corrosion: 'relevant: 400-series stainless fasteners are not for corrosion-critical use; galvanic pair and crevice at
        washer'
      bearing-face: 'relevant: captive washer spreads bearing load on thin panel; push-out and tear-out'
      material-direction: 'relevant: FDM layers should not be peeled by retention load'
