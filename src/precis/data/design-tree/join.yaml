        releasable-form-lock:
          id: join/service/releasable-form-lock
          role: method
          children:
            releasable-snap:
              id: join/service/releasable-form-lock/releasable-snap
              role: leaf
              coverage: deep
              principle: form
              directness: direct
              implies:
                class: rigid
                mechanism: snap
                rank: 1
              summary: Cantilever hook on a flexible arm with a shallow return face, loaded mostly at assembly; retention
                and location only, not a structural load path.
              when:
              - separable=service or frequent, opened for battery, cleaning, rework
              - process=injection moulded plastic (best), FDM for prototypes and light duty, machined polymer
              - far_material tough thermoplastic arm (PP, PE, POM, PA, PC, ABS, PC/ABS)
              - load_kind=static retention, service load carried by a hard stop or wall
              - quantity high (no hardware, fast assembly)
              - access=release face reachable by finger or tool
              avoid_when:
              - large continuous tension, bending, impact or prying load on the arm
              - brittle, highly filled or notch-sensitive arm material
              - FDM arm bending across layers, many cycles or safety-critical
              - high temperature, long-term deflection, solvents, UV, moist nylon without testing
              - separable=never (use steeper face or weld) or release must be impossible by accident
              - sheet metal root treated like a plastic cantilever; use metal spring tab instead
              variants:
              - straight cantilever
              - tapered cantilever
              - U-shaped or return-arm snap
              - multiple-arm snap
              - push-button or externally released snap
              - annular or bead snap
              - torsional snap
              - metal spring-tab snap
              tradeoffs:
              - 'vs screw: no hardware and fast, but low clamp load'
              - 'vs permanent snap: serviceable, lower pull-out force'
              - 'vs living hinge: retention versus motion, different jobs'
              - 'vs separate metal latch: fewer parts, but worse fatigue, temperature and sustained-load performance'
              - 'vs adhesive or staking: serviceable, not sealed'
              howto:
              - Compute root strain eps = 1.5 h delta / L^2 and compare with allowable strain at actual temperature and moisture.
              - Use about 60% of the one-time allowable strain for repeated assembly.
              - Use a 30-45 deg return face for detachable, 15-30 deg lead angle for assembly.
              - Put a generous radius at the arm root and taper thickness to about 50% (or width to 25%) of root toward the
                tip.
              - Lengthen or thin the arm rather than widening it to cut strain; width raises force not strain.
              - Add a hard stop so service load does not sit in the arm and the arm is unloaded when locked.
              - Estimate mating or release force from F = F_deflect (mu + tan a)/(1 - mu tan a).
              - Provide a release path (finger pad, tool slot) and lead-in chamfer on the catch.
              - Orient FDM arms so bending is in strong layers and calibrate clearance with a test coupon (the 0.35 mm start
                value in c9 is NOT verified for cantilever side clearance).
              issues:
              - issue: sharp root corner
                fix: blended radius and taper
                failure_mode: fatigue
              - issue: nearly vertical retention face when release needed
                fix: 30-45 deg face
                failure_mode: assembly-error
              - issue: arm held deflected after assembly
                fix: geometry leaves arm unloaded, hard stop
                failure_mode: creep-preload-loss
              - issue: snap used as primary load path
                fix: shoulders, walls or separate fastener carry load
                failure_mode: overload
              - issue: FDM arm printed across layers
                fix: reorient, more clearance, test
                failure_mode: brittle-fracture
              - issue: allowable strain taken from room temperature dry data
                fix: supplier data at actual condition
                failure_mode: environmental-degradation
              - issue: no tolerance stack-up
                fix: worst-case analysis and test
                failure_mode: assembly-error
              - issue: wear at hook edge
                fix: smooth hard catch, lead-in, lower contact pressure
                failure_mode: wear-fretting
              - issue: cold or glass-filled brittle arm
                fix: tougher resin, larger radius, orient fibres along arm
                failure_mode: brittle-fracture
              - issue: allowable strain looked up from a friction-coefficient table (friction coefficients are not strains)
                fix: take strain limits only from the supplier's strain table or yield-strain rule (amorphous about 70% of
                  yield strain, semicrystalline up to yield, glass-filled about half elongation at break)
                failure_mode: overload
              axes:
                locking: relevant - the snap is the lock; secondary stop or lock if accidental release is hazardous
                captive: n/a - no loose hardware
                corrosion: n/a for polymer arm; relevant only for metal spring-tab variant
                bearing-face: relevant - hook and catch land contact area and wear
                material-direction: relevant - FDM layers, fibre orientation, weld lines at root
              rules:
              - id: c1
                text: Detachable return/retaining angle 30-45 deg
                value: 30-45
                unit: deg
                equipment: injection-mould
                source_url: https://studylib.net/doc/18095701/snap-fits-for-assembly-and-disassembly
                source_quality: weak
                confidence: secondary
              - id: c2
                text: Typical assembly (lead) angle 15-30 deg
                value: 15-30
                unit: deg
                equipment: injection-mould
                source_url: https://studylib.net/doc/18095701/snap-fits-for-assembly-and-disassembly
                source_quality: weak
                confidence: secondary
              - id: c3
                text: Cantilever root strain eps = 1.5 h delta / L^2
                value: '1.5'
                unit: coefficient
                equipment: injection-mould
                source_url: https://solutions.covestro.com/-/media/covestro/solution-center/brands/downloads/imported/1557218421.pdf?rev=f36ba0f40394490e9026a2d752c3e05a
