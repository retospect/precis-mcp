    service:
      id: join/service
      role: method
      when: separable=service
      children:
        threaded:
          id: join/service/threaded
          role: method
          children:
            clearance-tapped:
              id: join/service/threaded/clearance-tapped
              role: leaf
              coverage: deep
              principle: force
              directness: indirect
              implies:
                class: rigid
                mechanism: screw
                rank: 1
              summary: Screw passes freely through the near part (ISO 273 hole, optional counterbore for ISO 4762 head) and
                clamps into a tapped hole in the far part. Default detachable joint when one side is accessible and the far
                part is metal or inserted.
              when:
              - separable=service
              - access=one-side
              - far_material=metal
              - load_kind in {static, cyclic with preload}
              - process in {machined, cast, sheet with enough thickness}
              - quantity low-to-medium
              avoid_when:
              - far_material=thermoplastic or soft Al/Mg without insert
              - thin sheet below engagement length
              - access=both-sides and load high or cyclic (use through-bolt)
              - separable=never
              - high quantity where clinch/weld nut is cheaper
              - large transverse cyclic load with no dowel
              variants:
              - plain clearance hole
              - counterbored hole
              - countersunk screw
              - blind vs through-tapped hole
              - tapped insert (wire/solid/heat-set)
              - nutplate/clinch/weld/rivet nut for thin sheet
              - locking variants (patch, adhesive, wedge washer)
              tradeoffs:
              - one-sided access and clean exterior, but thread stripping and creep sensitivity vs through-bolt
              - removable and inspectable vs rivet, weld, adhesive; adds holes, weight, loosening path
              - screw clamps, dowel or shoulder locates; do not use clearance hole as locator
              howto:
              - Size clearance hole from ISO 273 series (medium by default), tap-drill the far part only.
              - Set engagement by far material (steel about 1d, cast iron/brass 1.5d, Al 2d, plastic 3d) and count only full
                threads.
              - Add drill-point, chamfer and runout depth to blind holes; leave unused depth so the screw cannot bottom.
              - Keep threads out of the shear plane; add dowels or shoulders for transverse load.
              - Specify torque with lubricant/coating condition, or use controlled tightening.
              - Use an insert for soft or plastic far parts or repeated service.
              issues:
              - issue: tap-drill diameter used as clearance diameter
                fix: clearance hole in near part, tap drill only in far part
                failure_mode: assembly-error
              - issue: tapped thread strips in soft parent material
                fix: longer engagement, larger screw, boss or insert
                failure_mode: overload
              - issue: screw bottoms in blind hole
                fix: allow unused depth
                failure_mode: assembly-error
              - issue: split lockwasher relied on to lock
                fix: preload plus prevailing-torque, adhesive or wedge locking
                failure_mode: loosening
              - issue: dissimilar metals without isolation
                fix: isolate, coat, seal
                failure_mode: galvanic-corrosion
              - issue: threads in shear plane or clearance hole as locator
                fix: shank or dowel carries shear
                failure_mode: fatigue
              - issue: polymer thread used for repeated service
                fix: metal insert
                failure_mode: wear-fretting
              axes:
                locking: relevant (split washer ineffective; use preload plus locking feature)
                captive: n/a (screw is separate; captive only via retaining washer)
                corrosion: relevant (dissimilar metals, plating, hydrogen embrittlement)
                bearing-face: relevant (head bearing on soft near part; washer or counterbore)
                material-direction: relevant for FDM or composite far part thread
