            adhesive:
              id: join/permanent/material-bond/adhesive
              role: leaf
              coverage: deep
              principle: material-bond
              directness: indirect
              implies:
                class: rigid
                mechanism: adhesive
              summary: Bond with epoxy, acrylic, cyanoacrylate or PSA tape. Design so the adhesive sees shear or compression,
                never peel or cleavage, with a controlled bondline and prepared surfaces.
              when:
              - separable=never and a sealed, insulating, vibration-damping or cosmetically clean joint is wanted
              - load mainly shear or compression, distributed over a wide stable area
              - dissimilar materials, thin sheet, or one-side access with no fastener holes
              - metals, glass, composites, wood, and plastics after surface preparation
              - FDM or moulded parts with designed-in overlap, flange, dovetail or stop
              - PSA tape for covers, trim and low-to-moderate distributed loads; CA for small close-fitting parts
              avoid_when:
              - routine disassembly or internal inspection
              - dominant edge peel, cleavage, prying, impact, or a straight butt joint in tension
              - sustained dead load at high temperature (creep), especially with PSA tape
              - contaminated, oily, wet or low-energy surfaces (PP, PE, TPO) without primer or treatment
              - cyanoacrylate for gap filling or on stressed polycarbonate, acrylic or polysulfone
              - high-volume takt time with long hand-mixed cure and no metering
              variants:
              - epoxy one-part heat cure or two-part
              - cyanoacrylate
              - two-part acrylic structural
              - PSA tape (single/double coated, foam, transfer)
              - hybrid adhesive plus mechanical retainer
              tradeoffs:
              - '{''versus screws'': ''no holes or stress concentration, seals and damps, but not serviceable and no clamp
                preload''}'
              - '{''versus rivets'': ''better fatigue spread, no galvanic contact, but needs cure and surface prep''}'
              - '{''versus welding'': ''joins dissimilar materials without heat, but lower temperature limit''}'
              - '{''versus snap fits'': ''seals and stiffens, but no repeat opening''}'
              howto:
              - Shape the joint as lap, scarf, stepped lap, wrap or tongue-and-groove so the load is shear.
              - Increase bond width before overlap length; end stresses dominate long laps.
              - Control the bondline with spacers, beads, shims or a recess; do not squeeze to zero.
              - Define cleaning, abrasion or primer, open time, cure and fixturing in the work instruction.
              - Add a return flange, taper or mechanical stop where peel could start at a free edge.
              - Pick a toughened or flexible grade when thermal expansion mismatch is large.
              - Seal edges against water and isolate dissimilar metals.
              - Qualify a representative joint, not just a coupon, in service temperature and humidity.
              issues:
              - issue: butt or T joint peels the adhesive
                fix: lap, scarf, wrap or flange, or bond plus fasten
                failure_mode: overload
              - issue: overlap lengthened endlessly
                fix: widen the bond, taper adherends, add fillet
                failure_mode: overload
              - issue: peel at free edge
                fix: return flange, taper, doubler, flexible adhesive or mechanical retention
                failure_mode: fatigue
              - issue: bondline squeezed to zero or uncontrolled
                fix: spacers, beads, hard stops
                failure_mode: assembly-error
              - issue: dirty, oily or release-contaminated surface
                fix: clean, abrade or prime, control handling
                failure_mode: environmental-degradation
              - issue: cyanoacrylate on stressed polycarbonate, acrylic or polysulfone
                fix: screen for cracking, use a compatible grade or acrylic or epoxy
                failure_mode: environmental-stress-cracking
              - issue: rigid epoxy across large CTE mismatch
                fix: toughened or flexible adhesive, thin bondline, compliant layer
                failure_mode: thermal-mismatch
              - issue: PSA used as bolt replacement under dead load
                fix: more area, mechanical support, shear loading, creep test
                failure_mode: creep-preload-loss
              - issue: water ingress at bond edge
                fix: seal edges, drain, isolate metals
                failure_mode: galvanic-corrosion
              - issue: rigid structural adhesive across substrate flex or impact
                fix: toughened grade, radius and taper the bond ends, carry impact on stops or fasteners
                failure_mode: brittle-fracture
              axes:
                locking: 'n/a: nothing to loosen; do not rely on adhesive to hold bolt preload in hybrid joints'
                captive: 'n/a: bonded parts are fixed'
                corrosion: 'relevant: adhesive isolates dissimilar metals, but edge water ingress causes corrosion under the
                  bond; seal edges'
                bearing-face: 'n/a: no clamped faces; spread load with flange or doubler'
                material-direction: 'relevant: orient FDM layers so adhesive load does not split interlayer or raster interfaces'
              rules:
              - id: c1
