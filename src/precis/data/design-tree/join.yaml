locate:
  role: goal
  domain: mech
  scale: macro
  def: put one part in a repeatable position relative to another, and stop the remaining degrees of freedom
  id: locate
  children:
    dowel-pin-and-slot:
      id: locate/dowel-pin-and-slot
      role: leaf
      coverage: deep
      implies:
        class: rigid
        mechanism: pin
      summary: Locate a part with one round dowel (position) plus a diamond pin or slot (clocking), so hole-spacing error
        does not bind. Pins locate; bolts clamp and carry load.
      when:
      - need repeatable position after repeated separate/reassemble (separable=service)
      - machined, sheet metal or cast parts where holes can be reamed or bushed
      - load_kind static or light cyclic, with bolts/faces carrying clamp and structural load
      avoid_when:
      - pin would be the sole structural fastener or carry tensile preload, peeling or impact
      - process=FDM and accuracy matters, unless holes are drilled/reamed or metal bushings are fitted
      - hard pin pressed directly into a thin, soft, brittle or creep-prone housing (aluminium, zinc, plastic, moulded boss)
      - blind hole with no vent and no removal access
      variants:
      - two round pins (overconstrained unless tolerances are tight)
      - round pin plus diamond pin (preferred two-hole layout)
      - round pin plus slot (good for sheet metal and moulded parts)
      - plain press-fit dowel
      - shouldered pin
      - renewable pin in liner bushing with lockscrew
      - bullet-nose or tapered lead-in locator
      tradeoffs:
      - 'vs bolts alone: dowels give location, bolts give clamping; use both'
      - 'vs shoulders/steps: shoulders carry more load but need more machining'
      - 'vs keys: keys transmit torque in one direction, do not give 2D datum'
      - 'vs taper pins: tapers self-centre but are harder to make and remove'
      - 'vs spring pins: cheaper and tolerant but less precise, can fret'
      - 'vs bushings: bushings protect soft housings but add parts'
      howto:
      - ream the holes from established datums; do not rely on drilled holes
      - press-fit the pin in the permanent reference part, slip or transition fit in the removable part
      - make the second locator a diamond pin or slot, with its free direction along the expected hole-spacing error
      - orient the diamond flats across the direction in which rotation must be stopped
      - vent blind holes with an axial relief flat and chamfer the lead-in
      - add a shoulder, puller thread or liner bushing where the pin must be replaced
      - let bolts carry clamp load; check pin shear, bearing, tear-out and edge distance
      - use a metal bushing in aluminium, plastic or printed parts
      issues:
      - issue: two round pins bind when hole spacing varies
        fix: use round plus diamond pin or slot
        failure_mode: assembly-error
      - issue: tight fit in aluminium, plastic or thin boss splits or enlarges the hole
        fix: reduce interference or add a bushing and wall
        failure_mode: brittle-fracture
      - issue: blind press fit traps air
        fix: relief flat or vent
        failure_mode: assembly-error
      - issue: frequent re-seating wears a soft hole
        fix: hardened replaceable pins with liner bushings
        failure_mode: wear-fretting
      - issue: polymer or zinc relaxes under interference
        fix: lower interference, metal insert, clamp by bolt
        failure_mode: creep-preload-loss
      - issue: dissimilar metals trap moisture around pin
        fix: compatible or coated pin, seal or drain
        failure_mode: galvanic-corrosion
      - issue: pin taking prying or clamp load shears or fatigues
        fix: route load through faces or bolts
        failure_mode: fatigue
      axes:
        locking: 'relevant: press fit can relax under vibration; shoulder, retaining screw or staking'
        captive: 'n/a: pins are fixed in the reference part'
        corrosion: 'relevant: steel pin in aluminium or wet housing; coat, seal, drain'
        bearing-face: 'n/a: loaded in hole bearing, not under a head'
        material-direction: 'relevant: FDM boss layers should not be loaded across layer interfaces'
      rules:
      - id: a1
        text: 'ISO 8734 types: A through-hardened steel, B case-hardened steel, C martensitic stainless, all ground to m6'
        value: 8734A/B/C
        unit: null
        equipment: any
        source_url: https://www.intafast.com/wp-content/uploads/2019/09/Dowel_-pin_-specifications.pdf
        source_quality: primary
        confidence: handbook
      - id: a2
        text: Renewable locating pins are mounted in liner bushings with lockscrews, intended for long production runs or
          heavy wear
        value: null
        unit: null
        equipment: any
        source_url: https://www.carrlane.com/engineering-resources/technical-information/manual-workholding/locating-devices/locating-pins
        source_quality: primary
        confidence: handbook
      - id: a3
        text: A dowel pressed into a blind hole needs air relief along its length or the trapped air can eject the pin or
          burst the part
        value: null
        unit: null
        equipment: any
        source_url: https://www.intafast.com/wp-content/uploads/2019/09/Dowel_-pin_-specifications.pdf
        source_quality: primary
        confidence: handbook
      - id: c1
        text: ISO 8734 parallel dowels cover nominal diameters 1 to 20 mm
        value: 1-20
