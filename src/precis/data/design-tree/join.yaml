    second-fastener:
      id: locate/second-fastener
      role: leaf
      coverage: deep
      implies:
        class: rigid
        mechanism: screw
        rank: 6
      summary: 'A second screw stops rotation by forming a couple: for in-plane moment M and screw spacing p, each screw carries
        about M/p of shear. Space the screws widely, check bearing, tear-out and slip, and do not treat two clearance-hole
        screws as precision locators; pair one screw with a close-fit dowel or shoulder for a repeatable location. Preload
        friction alone only counts if the joint is designed as slip-resistant.'
      when:
      - a part must not rotate about one screw and the moment can be reacted by a second fastener at spacing p (separable=service)
      - load_kind static or moderate, preload can be controlled and retained, faying surfaces clean and uncoated
      - enough material for edge distance and bearing at both holes
      avoid_when:
      - cyclic or vibratory shear carried only by preload friction (use a dowel, shoulder or key)
      - faying surfaces oily, painted, coated, soft or settling, or holes oversized or slotted
      - both screws in slots (clamp friction becomes the only locator)
      - thin sheet or plastic without edge distance or bushing (tear-out, buckling between screws)
      variants:
      - two screws in clearance holes, friction-resisted (slip-critical)
      - one screw plus one close-fit dowel, shoulder or shear pin
      - one round hole plus one slot, with the slot oriented to remove only the needed freedom
      - fixed-fastener pattern (screws threaded into one part) vs floating-fastener pattern (clearance holes in both)
      tradeoffs:
      - wider spacing lowers screw shear linearly but raises plate bending, prying, tear-out and tolerance sensitivity
      - slip-critical friction joint needs controlled preload and clean surfaces; a dowel is more dependable under vibration
      - tight positional tolerance on two fixed screws is hard to assemble; one screw plus one dowel avoids it
      howto:
      - compute the shear per screw as V = M r / J_p for the pattern (M/p for two equal screws) and add direct shear vectorially
      - check screw shear, hole bearing, edge tear-out, plate bending, slip and fatigue, not only screw shear
      - set spacing from the required moment, then confirm it against the edge-distance and spacing rules
      - for slip-critical use take friction coefficients no higher than 0.2 (clean, uncoated metal) or 0.1 (other surfaces)
        unless tested
      - tolerance the hole pattern with positional tolerances and a fixed- or floating-fastener formula from ASME Y14.5
      - use one round feature plus at most one slot
      - where vibration or cyclic load acts add a close-fit dowel or other dedicated shear-transfer device
      issues:
      - issue: screws too close together
        fix: increase spacing so M/p and bearing/tear-out are acceptable
        failure_mode: overload
      - issue: two clearance-hole screws used as precision locators
        fix: positional tolerancing plus one dowel or slot
        failure_mode: assembly-error
      - issue: preload assumed to prevent slip
        fix: slip-critical calculation with verified friction coefficient, or add a dowel/shoulder/key
        failure_mode: loosening
      - issue: both screws in slots
        fix: one round hole or dowel, one slot
        failure_mode: assembly-error
      - issue: single screw under vibration, part pivots
        fix: second fastener or dedicated locator; locking nut only prevents loss
        failure_mode: loosening
      - issue: thin material buckles between widely spaced screws
        fix: stiffen, reduce spacing or add intermediate support
        failure_mode: excess-deflection
      axes:
        locking: 'relevant: friction-carried shear fails once preload is lost; a lock device keeps the screw but not the clamp
          load'
        captive: 'n/a: not assessed in the pilot'
        corrosion: 'relevant: coated or lubricated faying surfaces cut the usable friction coefficient (0.1 versus 0.2 in
          NASA-STD-5020)'
        bearing-face: 'relevant: hole bearing and tear-out around each screw in thin sheet or plastic'
        material-direction: 'n/a: not assessed in the pilot'
      rules:
      - id: n1
        text: Two identical screws a distance p apart resist an in-plane moment M by a couple, each carrying shear M/p; the
          general group method gives V_i = M r_i / J_p with J_p = sum of r_i squared about the pattern centroid
        value: V = M/p; V_i = M r_i / J_p
        unit: null
        equipment: any
        source_url: https://ntrs.nasa.gov/api/citations/19900009424/downloads/19900009424.pdf
        source_quality: primary
        confidence: handbook
      - id: n2
        text: NASA nominal distance between fasteners is 4 diameters (thickness of the joined material can change it)
        value: 4
