axes:
  locking:
    id: axes/locking
    role: axis
    coverage: deep
    summary: Design preload and joint stiffness first; a lock does not restore clamp load. Then pick threadlocker, prevailing-torque
      nut, wedge-lock washer pair, double nut or safety wire by vibration severity, reuse, temperature and access. Split washers
      only for low-strength fasteners.
    when:
    - 'transverse vibration or cyclic shear: wedge-lock pair, suitable threadlocker or safety wire after raising preload and
      stiffness'
    - 'serviceable metal thread, moderate quantity: anaerobic threadlocker (medium for maintenance, high for semi-permanent)'
    - 'high volume, assembly speed: prevailing-torque nut or pre-applied patch'
    - 'preload cannot be guaranteed or loss of fastener is hazardous: safety wire, cable, cotter pin'
    - 'static axial load with good preload and no vibration: usually no secondary lock'
    avoid_when:
    - threadlocker on oily, wet, large-gap or non-metal threads
    - wedge-lock pair on paint, soft plastic, thin or settling surfaces
    - prevailing-torque nut as sole defence against severe transverse vibration
    - split washer under 8.8/grade 5 or stronger bolts, or in critical joints
    - double nuts where one wrench only or preload is critical
    - metal-fastener torque on thin polymer threads
    variants:
    - 'threadlocker: low/medium/high strength, wicking, pre-applied patch, activator grades'
    - 'prevailing-torque: nylon insert, all-metal distorted thread (ISO 7042, DIN 980/982/985)'
    - wedge-lock washer pairs (cam angle exceeds thread helix angle)
    - double or jam nut, castellated nut with cotter pin
    - safety wire (NASM 33540), safety cable (SAE AS4536), tab washers
    - split, serrated and conical spring washers
    tradeoffs:
    - 'threadlocker: cheap, seals, but cure time and contamination sensitive'
    - 'prevailing-torque: fast and clean, torque varies with reuse and temperature, keeps nut but may lose preload'
    - 'wedge-lock: best vibration resistance and reusable, costs more and needs hard flat seat'
    - 'safety wire: most positive retention, slow, needs drilled parts and access'
    howto:
    - size preload, joint stiffness and slip resistance first; select the lock second
    - for vibration-critical joints validate with a Junker transverse test per DIN 65151
    - degrease and dry threads for threadlocker; use activator on passive metals; respect fixture and full cure times
    - provide a hard flat bearing land for wedge washers
    - use the torque table for the actual lubricant and coating, torque T = K d F
    - use inserts or through-bolts with compression limiters in plastic
    - on frequent disassembly use medium/low threadlocker or reusable all-metal hardware
    - wire bolt and nut in the approved direction and geometry
    issues:
    - issue: lock selected without preload and slip check
      fix: design preload retention first
      failure_mode: loosening
    - issue: split washer under high-strength bolt flattens
      fix: hardened plain washer plus preload, wedge pair or threadlocker
      failure_mode: loosening
    - issue: prevailing-torque nut treated as vibration-proof
      fix: wedge lock, adhesive, wire, or prevent slip
      failure_mode: loosening
    - issue: threadlocker on oil or plating residue cures poorly
      fix: degrease, activator
      failure_mode: loosening
    - issue: soft polymer thread under sustained clamp
      fix: insert or through-bolt with compression limiter
      failure_mode: creep-preload-loss
    - issue: embedment in paint, casting skin or soft sheet
      fix: machined flat land, hardened washer
      failure_mode: creep-preload-loss
    - issue: dissimilar metals under washer
      fix: compatible coating, isolate, drain
      failure_mode: galvanic-corrosion
    axes:
      locking: this axis
      captive: 'relevant: captive nuts/inserts help blind and automated assembly'
      corrosion: 'relevant: threadlocker chemistry must suit plating; moisture under washers'
      bearing-face: 'relevant: wedge washers need hard flat land; embedment causes preload loss'
      material-direction: 'relevant: FDM threads printed horizontally have weak anisotropic flanks'
