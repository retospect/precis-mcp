            dovetail-slide:
              id: join/service/releasable-form-lock/dovetail-slide
              role: leaf
              coverage: deep
              principle: form
              directness: direct
              implies:
                class: prismatic
              summary: Captured sliding joint entered axially from the open end; low-speed, moderate-precision guide that
                resists pull-off normal to the slide. Clearance and end stop are the design.
              when:
              - separable=service, removable along one direction only
              - load_kind=static or intermittent, compressive or transverse to slide
              - process=machined (with adjustable gib), FDM as separate parts, moulded only with side action, casting then
                machine flanks
              - access=end access for assembly and a stop can retain it
              - quantity one-off to modest
              avoid_when:
              - high speed or high cycle count, impact, large overturning moment
              - precision load path in FDM under heat, sustained load or abrasive dust
              - no end access; use snap, fastener or radial bayonet
              - very high volume where moulded snap or standard linear bearing is cheaper
              - long thin flexible rail without second rail or adjustment
              - abrasive dust, chips or salt without wipers and lubrication
              variants:
              - straight linear dovetail
              - tapered dovetail
              - adjustable-gib dovetail
              - captured dovetail with end stop
              - open dovetail
              - round or circular dovetail
              - segmented round dovetail
              - printed interlocking dovetail
              tradeoffs:
              - 'vs rolling linear rail: simpler, shock tolerant, cheaper at low quantity, but more friction and wear'
              - 'vs T-slot: captive guidance and gib adjustment, harder to machine'
              - 'vs tongue-and-groove: resists pull-off without retainer'
              - 'vs snap-fit: reusable and adjustable, needs end access'
              - 'vs bolts: no tools along slide axis, lower static strength'
              howto:
              - Choose one datum flank pair and one load side; give clearance on the other flanks and bottom.
              - Relieve the inside corner of the female groove so flanks seat before corners bind.
              - Add an entry chamfer or lead-in and an end stop or retaining screw.
              - Use a stepped clearance test coupon on the actual printer; start per-flank clearance 0.15-0.20 mm (FDM).
              - Make the carriage long, or use two rails, so overturning moment is carried by separated contact.
              - Use a tapered gib to remove wear; adjust preload incrementally.
              - Mould with draft or side action; cast oversize and machine flanks.
              - Add relief grooves, wipers and lubrication for debris and stick-slip.
              issues:
              - issue: zero clearance in CAD seizes
                fix: process-specific clearance and test coupon
                failure_mode: assembly-error
              - issue: equal clearance on every face rocks
                fix: choose datum flanks and clear others
                failure_mode: excess-deflection
              - issue: excessive preload
                fix: adjust gib incrementally
                failure_mode: wear-fretting
              - issue: load at one end cocks carriage
                fix: longer carriage, second guide
                failure_mode: overload
              - issue: printing across weak layer boundaries
                fix: orient rail so load in XY, more perimeters
                failure_mode: brittle-fracture
              - issue: long printed rail warps
                fix: split rail, first-layer compensation
                failure_mode: assembly-error
              - issue: no debris escape
                fix: relief grooves and wipers
                failure_mode: wear-fretting
              - issue: polymer flank under sustained pressure
                fix: larger area, metal insert, end stop
                failure_mode: creep-preload-loss
              - issue: gib screw vibration loosening
                fix: locking screw and tapered gib
                failure_mode: loosening
              - issue: dissimilar metals and trapped water
                fix: isolate, drain, coat
                failure_mode: galvanic-corrosion
              axes:
                locking: relevant - end stop, retaining screw or gib screw lock; no inherent lock
                captive: relevant - end stop keeps carriage from falling out
                corrosion: relevant for metal ways - dissimilar metals, trapped water, salt
                bearing-face: relevant - flank bearing pressure p = F/A, hardened or lined ways
                material-direction: relevant for FDM - layers across flank cause delamination
              rules:
              - id: c1
                text: FDM dovetail flank angle from base 30-60 deg
                value: 30-60
                unit: deg
                equipment: desktop-fdm
                source_url: https://kapycad.com/en/academy/machines/sliding-dovetail
                source_quality: secondary
                confidence: secondary
              - id: c2
                text: Machined dovetail flank angles of 55 and 60 deg are both in use and no single standard exists (60 deg
                  more common on small machine tools)
                value: 55; 60
                unit: deg
                equipment: cnc-mill
                source_url: https://www.model-engineer.co.uk/?p=24691
                source_quality: weak
                confidence: secondary
              - id: c3
                text: FDM sliding clearance per flank 0.15-0.20 mm
                value: 0.15-0.20
                unit: mm
                equipment: desktop-fdm
                source_url: https://kapycad.com/en/academy/machines/sliding-dovetail
                source_quality: secondary
                confidence: secondary
              - id: c4
                text: FDM dovetail clearance per face 0.2-0.3 mm
                value: 0.2-0.3
                unit: mm
                equipment: desktop-fdm
                source_url: https://impression.timelapse-3d.com/en/guide/tolerances-ajustements-impression-3d/
                source_quality: secondary
                confidence: secondary
              - id: c5
                text: Just-sliding fit total clearance about 0.2 mm (0.4 mm nozzle), free fit 0.3-0.4 mm total
                value: 0.2 / 0.3-0.4
