            value: '3'
            unit: x rib thickness
            equipment: injection-mould
            source_url: https://www.stratasys.com/siteassets/sdm/resources/design-guidelines/injection-molding/injection_molding_design_guidelines_2017.pdf?v=499c06
            source_quality: primary
            confidence: handbook
          - id: c10
            text: Rib draft 0.25-0.5 deg per side
            value: 0.25-0.5
            unit: deg
            equipment: injection-mould
            source_url: https://www.stratasys.com/siteassets/sdm/resources/design-guidelines/injection-molding/injection_molding_design_guidelines_2017.pdf?v=499c06
            source_quality: primary
            confidence: handbook
          - id: c11
            text: Rib spacing at least 4x rib thickness
            value: '4'
            unit: x rib thickness
            equipment: any
            source_url: https://cdn.thomasnet.com/kc/5289/doc/Injection_Molding_the_Definitive_Engineering_Guide.pdf
            source_quality: secondary
            confidence: secondary
          - id: c12
            text: 'Rib root radius over 1/4 rib thickness: 0.25 x rib thickness'
            value: '0.25'
            unit: x rib thickness
            equipment: any
            source_url: https://cdn.thomasnet.com/kc/5289/doc/Injection_Molding_the_Definitive_Engineering_Guide.pdf
            source_quality: secondary
