          - id: c13
            text: Cantilever root radius at least half base thickness and not under 0.38 mm
            value: '0.38'
            unit: mm
            equipment: any
            source_url: https://xometry.pro/wp-content/uploads/2025/03/EN-eBook_-Injection-Molding-Design-Guide.pdf
