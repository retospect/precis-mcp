            press-shrink-fit:
              id: join/permanent/permanent-mechanical/press-shrink-fit
              role: leaf
              coverage: deep
              principle: force
              directness: direct
              implies:
                class: rigid
                mechanism: press
              summary: Friction joint from diametral interference, assembled by press or by thermal change. Predictable for
                steel-on-steel machined cylinders; unreliable in FDM, moulded or creeping plastics unless calibrated. Best
                paired with a key, shoulder or ring for overload.
              when:
              - separable in {never, service-rare}; permanent or occasionally serviced
              - process=machined, metal-on-metal, round, stiff, uniform wall
              - load is mainly concentric torque and axial force
              - minimum interference can be guaranteed over tolerance, temperature and friction spread
              - high volume with force/displacement-monitored press, or validated thermal assembly
              avoid_when:
              - separable=frequent
              - large bending, shock, reversing or peel loads on the joint
              - thin, slotted or interrupted hubs; very large diameters
              - 'brittle: cast iron, ceramics, glass-filled plastic'
              - FDM or moulded parts treated like steel; creep
              - as-cast or rough drilled seats, thin sheet
              - temperature cycling, water, salt, fretting without analysis
              variants:
              - light press H7/p6
              - medium-heavy drive H7/r6, H7/s6
              - force fit (u6 class)
              - cold press fit
              - shrink fit (heat hub, cool shaft, or both)
              - differential thermal fit
              - crush-rib compliant plastic fit
              - tapered interference (Morse, taper-lock)
              - interference plus key/spline/pin/shoulder
              tradeoffs:
              - vs bolts - no hardware, but not removable or tolerant of temperature swings
              - vs key/spline - concentric and no stress concentration, but friction-limited
              - vs adhesive - needs no cure, but tight tolerance and tooling
              - vs weld - no heat, but sensitive to tolerance
              - vs taper-lock - compact, but not adjustable
              - vs snap-fit - no undercut, but high insertion force, creep loosening, less positive axial retention
              howto:
              - Specify an ISO 286 fit by designation, surface finish, roundness, cylindricity and inspection method.
              - Compute interface pressure at both minimum and maximum interference from the full tolerance stack.
              - 'Compute torque and axial capacity at minimum pressure with the lowest credible friction (calculator-site
                values: dry steel 0.10-0.15, oiled 0.05-0.08; weak source, confirm with a textbook table or trials).'
              - Check hub and shaft stress against yield, fatigue and fracture limits at maximum interference.
              - Use diametral interference consistently; radial vs diametral confusion gives a factor-two error.
              - Add lead-in chamfer, deburr, guide the press, press only through the ring being fitted.
              - Check interference at full operating temperature using both expansion coefficients.
              - Provide extraction features if the part will ever be removed.
              - In plastics use crush ribs or a metal insert; calibrate FDM bores with test coupons.
              issues:
              - issue: specified only as press fit
                fix: ISO 286 classes plus finish and form limits
                failure_mode: assembly-error
              - issue: nominal sizes used
                fix: worst-case min and max interference
                failure_mode: loosening
              - issue: radial vs diametral interference confused
                fix: state delta as diametral
                failure_mode: overload
              - issue: fit chosen from torque alone
                fix: Lame stress check, add key or spline
                failure_mode: overload
              - issue: friction overestimated
                fix: conservative service mu, press trials
                failure_mode: loosening
              - issue: wrong race or unsupported part pressed
                fix: force through fitted ring only
                failure_mode: assembly-error
              - issue: no lead-in or burrs
                fix: chamfer, deburr, lubricant
                failure_mode: wear-fretting
              - issue: plastic treated like steel
                fix: ribs, metal insert, retention, creep test
                failure_mode: creep-preload-loss
              - issue: thermal expansion ignored
                fix: check across operating range
                failure_mode: thermal-mismatch
              - issue: no removal provision
                fix: extraction holes, puller grooves, oil injection, or choose taper-lock
                failure_mode: assembly-error
              - issue: long misaligned press-through
                fix: guided fixture, short lead-in, force/displacement limits; shrink-assemble long or high-interference fits
                failure_mode: wear-fretting
              - issue: moulded bore with no draft or shrink allowance
                fix: draft plus crush ribs, uniform walls, no knit lines at loaded bosses
                failure_mode: assembly-error
              - issue: excessive interference yields hub or shaft
                fix: check Lame stresses at maximum interference, lower fit class or thicker hub
                failure_mode: overload
              axes:
                locking: relevant - friction is the lock; add key, shoulder, ring or adhesive when slip is serious
                captive: n/a - interference holds in place, no loose part concept
                corrosion: relevant - fretting corrosion and rust jacking at the interface
                bearing-face: relevant - shoulders and contact length; pressure peaks at steps and edges
                material-direction: relevant - FDM anisotropy and moulded draft/shrinkage; metals not applicable
              rules:
