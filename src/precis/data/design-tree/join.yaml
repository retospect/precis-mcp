        clamp:
          id: join/service/clamp
          role: method
          children:
            split-boss-pinch:
              id: join/service/clamp/split-boss-pinch
              role: leaf
              coverage: deep
              principle: force
              directness: indirect
              implies:
                class: rigid
                mechanism: clamp
              summary: Slotted hub or collar closed by a pinch screw; friction grip on a round shaft or tube, adjustable and
                non-marring, capacity set by clamp force times friction.
              when:
              - separable=service with repositioning or adjustment, no keyway wanted
              - load_kind=static, axial location, moderate torque, low-to-moderate bending
              - far_material shaft metal, or polymer shaft with broad low-pressure clamp
              - access=screw head reachable with tool radially
              - process=machined, cast (then machine bore), sheet-metal band, moulded with insert
              avoid_when:
              - high reversing torque, shock, safety-critical torque without a key, pin or spline
              - thin hollow or soft tube that ovalises - use sleeve or mandrel
              - elevated temperature or long-term preload in polymer (creep) - use metal collar or insert
              - severe vibration without a locking plan
              - dissimilar wet metals without isolation
              - FDM as final process for high torque or high-cycle vibration
              variants:
              - single-split one-piece collar
              - two-piece double-split collar
              - split hub (pulley, gear, arm)
              - split hub plus separate clamp ring
              - semi-split collar
              - threaded split collar
              - wedge or multi-screw collar
              - keyed or spline-assisted clamp hub
              tradeoffs:
              - 'vs set screw: uniform grip, no shaft damage, but larger and needs a split'
              - 'vs key: no keyway or stress concentration, but friction only and no positive torque'
              - 'vs taper-lock or QD bushing: cheaper and smaller, lower and less repeatable capacity'
              - 'vs cross-pin: no notch in shaft, adjustable, but friction can slip'
              - 'vs press fit: removable'
              - 'two-piece vs one-piece: installs on captive shaft, more parts and cost'
              howto:
              - Size by T = mu x normal force x mean radius and axial force = mu x normal force, with a safety factor, and
                verify by slip test.
              - Take seating torque from the collar manufacturer, not a guess.
              - Keep bore clearance small (supplier value) and clean, deburr bore and slot.
              - Put fillets at slot ends and screw bosses; avoid sharp corners.
              - Check screw tension, thread strip, boss bending and collar yield (VDI 2230 approach); use through bolt and
                nut or metal insert in plastic.
              - Add a key, pin or spline where slip is unacceptable.
              - Machine bore and face in one setup so face stays square.
              - In moulded parts core the boss, keep uniform wall, add draft.
              - Print FDM with wall at least four layer thicknesses and use heat-set insert or through bolt.
              issues:
              - issue: slot closes completely so collar runs out of travel
                fix: reduce bore or increase elastic range
                failure_mode: creep-preload-loss
              - issue: tightening torque guessed
                fix: use maker seating torque and verify slip capacity
                failure_mode: overload
              - issue: screw strips or boss fails
                fix: through bolt and nut, steel insert, bigger boss
                failure_mode: overload
              - issue: sharp slot or boss corners
                fix: generous fillets
                failure_mode: fatigue
              - issue: thin tube crushed
                fix: wider contact, internal sleeve or mandrel
                failure_mode: excess-deflection
              - issue: plastic boss treated like metal
                fix: use creep data at temperature, metal inserts, broad washers
                failure_mode: creep-preload-loss
              - issue: screw loosens in vibration
                fix: design for retained preload, then prevailing-torque nut or threadlocker
                failure_mode: loosening
              - issue: dissimilar metals outdoors
                fix: isolate, seal, plate, drain
                failure_mode: galvanic-corrosion
              - issue: crevice in slot and shaft interface
                fix: seal or drain, inspect under collar
                failure_mode: crevice-corrosion
              - issue: FDM slot printed across weak layers
                fix: reorient, more walls, insert
                failure_mode: brittle-fracture
              - issue: micromotion fretting and galling
                fix: more clamp capacity or positive drive, finish and lubrication on threads
                failure_mode: wear-fretting
              axes:
                locking: relevant - pinch screw preload must survive vibration and creep
                captive: n/a - collar stays on shaft by friction, screw captive in boss
                corrosion: relevant - crevice in slot and shaft interface, galvanic couples
                bearing-face: relevant - collar face squareness for axial thrust, local pressure on thin tube
                material-direction: relevant for FDM and cast - slot and screw ears on weak layers or porous cast sections
