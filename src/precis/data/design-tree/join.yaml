        cast-as-one:
          id: join/integrate/cast-as-one
          role: leaf
          coverage: deep
          implies:
            class: rigid
            mechanism: integral
          summary: Cast the whole assembly as one body so the joint never exists. Works when one castable alloy meets every
            function and the quantity repays pattern or die tooling; design it as a foundry part (feeding, cores, uniform
            sections, machined datums), not as a machined solid with the joint deleted.
          when:
          - separable=never and a sealed, leak-tight or inaccessible one-piece body is wanted
          - process=cast with an alloy castable in the chosen process (Al, Zn, Mg, bronze, iron, steel)
          - quantity one-off to short run (sand), medium (permanent mould) or high (die casting, investment for intricate
            small parts)
          - geometry has many intersecting walls, ribs, bosses, ports or internal cavities that would otherwise need machining,
            welding or many fasteners
          - functional interfaces can be machined after casting, or the as-cast ISO 8062-3 grade is enough
          - load_kind=static or smooth, with radiused transitions, a sound load path and inspection
          avoid_when:
          - wear parts, seals, bearings or sensors must be replaceable, or a weld/bolt is wanted as a fuse, adjustment, repair
            or inspection joint
          - quantity too low for permanent-mould or die tooling, or the design changes often
          - many interfaces need tight alignment, flatness, concentricity or finish (machine them instead of trusting the
            raw casting)
          - trapped cores, severe isolated masses, abrupt wall changes or deep undercuts
          - cyclic, impact or fracture-critical use without casting-specific fatigue and defect data (porosity, grey-iron
            brittleness)
          - functions need different materials, electrical isolation or galvanic isolation
          - part is extremely large, thin, long or inaccessible for filling, feeding, shakeout or inspection
          variants:
          - green or no-bake sand casting
          - investment (lost-wax) casting
          - gravity permanent-mould casting
          - high-pressure die casting
          - cored casting with integral bosses and ports
          - insert casting around a separate part
          - hybrid casting with machined datums and replaceable wear parts
          tradeoffs:
          - removes fasteners, weld metal, leak paths and assembly steps, but also removes disassembly and independent replacement;
            a failure scraps the whole casting
          - needs gating, risers, cores, draft and shrinkage allowance, and defect inspection (porosity, inclusions, hot tears)
          - properties vary locally with cooling rate, porosity and as-cast surface; fatigue needs actual casting-quality
            data
          - '{''versus welding'': ''no HAZ or weld distortion, but high tooling cost; a welded part can be cut and repaired''}'
          - '{''versus bolting'': ''no preload loss or fretting under bolts, but no dissimilar materials, adjustment or field
            replacement''}'
          - '{''process choice trades volume, size, finish and tolerance'': ''sand is cheapest to tool and coarsest, investment
            finest, die casting needs the highest volume''}'
          howto:
          - Choose the casting process from quantity, size, alloy and tolerance before detailing.
          - Keep section thickness uniform; transition gradually with tapers instead of steps.
          - Core out bosses and heavy junctions; do not feed a boss only through a thin wall.
          - Use the smallest fillet that removes the sharp corner, so the fillet does not become a hot spot.
          - Add draft, shrinkage allowance and machining stock using process-specific values agreed with the foundry.
          - Specify casting tolerance as an ISO 8062-3 DCTG grade, with wall thickness one grade coarser.
          - Machine datums, bearing seats, seals and bolting faces; do not rely on as-cast surfaces for function.
          - Arrange sections for directional solidification (thin to thick, risers at the last-to-freeze region).
          - Provide drain, vent, core-print and shakeout routes; keep cores simple and well supported.
          - Qualify with production-process castings, not nominal alloy data.
          issues:
          - issue: isolated thick boss or pad forms a hot spot
            fix: core or hollow the boss, taper it into the wall, feed it directly with a riser or chill
            failure_mode: brittle-fracture
          - issue: abrupt wall-thickness change
            fix: uniform walls with gradual tapers or intermediate sections to avoid hot tears and distortion
            failure_mode: excess-deflection
          - issue: sharp internal corner
            fix: add an internal fillet and external radius
            failure_mode: fatigue
          - issue: oversized fillet creates a new heavy junction
            fix: smallest radius that satisfies stress; use ribs or a cored transition
            failure_mode: brittle-fracture
          - issue: thin core surrounded by heavy metal
            fix: fewer, simpler, better-vented and supported cores with more uniform surrounding metal
            failure_mode: assembly-error
          - issue: trapped core or inaccessible core print
            fix: provide draw direction, vent routes and shakeout access, or redesign as an open feature
            failure_mode: assembly-error
          - issue: no directional solidification path
            fix: sections thin to thick, risers beside last-to-freeze areas, chills
            failure_mode: brittle-fracture
          - issue: no allowance for draft, shrinkage or machining stock
            fix: add process-specific scale, draft and stock; agree the ISO 8062-3 grade with the foundry
            failure_mode: assembly-error
          - issue: critical function placed on an as-cast surface
            fix: machine datums, seats, seals and faces; specify inspection and finish separately
            failure_mode: fatigue
          - issue: grey iron used for fracture-critical, shock or cold service
            fix: use ductile iron or steel, remove porosity and notches, specify impact or fracture-toughness tests
            failure_mode: brittle-fracture
          - issue: water traps and dissimilar metals in the casting
            fix: drain, seal, coat, isolate fasteners and inserts, machine and seal porous faces
            failure_mode: galvanic-corrosion
          axes:
            locking: 'n/a: no fastener; cast-in or tapped threads and inserts still need positive retention'
            captive: 'n/a: single body; inserts cast in are retained by geometry, check separately'
            corrosion: 'relevant: encapsulated dissimilar metals, water traps and unvented pockets; drain, coat, isolate,
              seal porous surfaces'
            bearing-face: 'n/a: no clamped faces; machine any bolting face or bearing seat that remains'
            material-direction: 'relevant: grain, porosity and cooling-rate gradients vary through the casting; orient critical
              sections and test production castings'
