                equipment: bought
                source_url: https://www.mcmaster.com/products/din-retaining-rings/
                source_quality: secondary
                confidence: secondary
                standard: DIN 472
                corrected: true
              - id: c6
                text: Minimum edge margin about 3 x groove depth
                value: '3'
