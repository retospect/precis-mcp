            braze-solder:
              id: join/permanent/material-bond/braze-solder
              role: leaf
              coverage: deep
              principle: material-bond
              directness: indirect
              implies:
                class: rigid
                mechanism: fuse
              summary: Join metals with a filler that melts below the base metal, drawn into a controlled gap by capillary
                action. Brazing is above 450 C filler liquidus, soldering below. Design as a shear or lap joint with a set
                gap.
              when:
              - separable=never and the joint should be sealed or electrically conductive
              - load mainly shear or compression with a large lap or socket area
              - brazeable metals (copper, steels, stainless, aluminium, nickel alloys) that wet with the filler
              - sheet, tube, machined spigot and socket joints; metal inserts
              - torch for prototypes, induction or furnace for production
              avoid_when:
              - routine disassembly needed
              - direct tension, peel, bending, impact or severe cyclic load through a small area
              - plain PLA, ABS, PETG, nylon or resin prints (melt); polymers in general
              - surfaces that cannot be cleaned or wetted; filler forms brittle intermetallics
              - blind cavities with no capillary path or flux drainage
              - low-melting solder in hot service
              variants:
              - soldering
              - torch brazing
              - induction
              - furnace/vacuum/controlled atmosphere
              - dip
              - resistance/infrared/laser
              - diffusion or wide-gap brazing
              - filler families Ag Cu Cu-P Cu-Zn Al-Si Ni Au Co
              tradeoffs:
              - '{''versus bolts'': ''sealed and load-spreading but permanent and harder to inspect''}'
              - '{''versus adhesive'': ''higher service temperature but needs metal and a heat cycle''}'
              - '{''versus welding'': ''less distortion and joins dissimilar thin metals, but filler is weaker''}'
              - '{''versus press fit'': ''seals better but needs a heat cycle''}'
              howto:
              - Make it a lap, socket or scarf joint so the filler is in shear, not a butt joint.
              - Specify the gap at brazing temperature, from the filler supplier, allowing for expansion.
              - Start overlap at about 3x the thinner wall and verify critical joints per AWS C3.2.
              - Clean and prepare surfaces; use compatible flux or atmosphere.
              - Provide a filler inlet, vent and exit path; preplace preforms at the joint entrance.
              - Heat the parts, not the filler, and let them draw it in.
              - Drain or vent flux and add inspection access or witness features.
              - Qualify the procedure (AWS B2.2) for critical joints.
              issues:
              - issue: butt joint for high load
                fix: lap, socket, scarf or interlock so the filler is in shear
                failure_mode: overload
              - issue: gap too large or too small
                fix: specify gap at brazing temperature per filler supplier (torch about 0.05-0.127 mm)
                failure_mode: overload
              - issue: no controlled overlap
                fix: start at 3x thinner wall, test per AWS C3.2
                failure_mode: overload
              - issue: dirty or oxidised surfaces
                fix: degrease, abrade, flux or atmosphere
                failure_mode: environmental-degradation
              - issue: flux trapped in sealed cavity
                fix: vent, controlled atmosphere or flux-free filler
                failure_mode: crevice-corrosion
              - issue: CTE mismatch used as structural clamp
                fix: compliant leads, flexures, independent support
                failure_mode: thermal-mismatch
              - issue: sharp corners at joint ends
                fix: fillets, relief grooves
                failure_mode: fatigue
              - issue: low-melting solder under sustained load
                fix: brazing or mechanical load path
                failure_mode: creep-preload-loss
              - issue: heat cycle anneals or melts base metal
                fix: lower-temperature filler, local induction, heat sinks
                failure_mode: softening
              axes:
                locking: 'n/a: permanent filler does not loosen by thread motion; add stops against peel loads'
                captive: 'n/a: no loose part'
                corrosion: 'relevant: flux residue, galvanic couples with filler, crevices; clean and neutralise flux'
                bearing-face: 'n/a: no clamped faces'
                material-direction: 'n/a: metals; only load direction matters (shear rather than peel)'
              rules:
              - id: c1
                text: Brazing filler liquidus is above 450 C (840 F) and below the base solidus
                value: '450'
                unit: C
                equipment: any
                source_url: https://pubs.aws.org/Download_PDFS/BHB-Vol3-Final-Web_PV.pdf
                source_quality: primary
                confidence: standard
              - id: c2
                text: Typical torch-braze joint clearance is 0.002-0.005 in (0.05-0.127 mm)
                value: 0.05-0.127
                unit: mm
                equipment: any
                source_url: https://ch-delivery.lincolnelectric.com/api/public/content/c220242c84414ea489477851d858e543?v=d13aaa9e&download=true
                source_quality: primary
                confidence: handbook
              - id: c3
                text: Vacuum brazing clearance for max strength up to about 0.08 mm
                value: '0.08'
