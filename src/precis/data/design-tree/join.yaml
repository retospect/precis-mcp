            heat-set-insert:
              id: join/service/threaded/heat-set-insert
              role: leaf
              coverage: deep
              principle: force
              directness: indirect
              implies:
                class: rigid
                mechanism: screw
                rank: 3
              summary: Brass or steel threaded insert melted or pressed into a hole in a thermoplastic part, giving a reusable
                metal thread. Good for one-sided access, repeated service, FDM and moulded thermoplastics; weak under bending,
                impact, high cyclic load or sustained hot preload.
              when:
              - separable=service
              - far_material=thermoplastic
              - process in {FDM, moulded, machined plastic}
              - access=one-side
              - load_kind=static or low cyclic
              - quantity low-to-moderate (manual) or controlled thermal/ultrasonic install
              avoid_when:
              - far_material in {thermoset, ceramic, metal, cured composite}
              - separable=never
              - boss too thin
              - bending or prying or impact dominated load
              - sustained hot preload (creep)
              - safety-critical without testing
              - sheet metal (use clinch/weld/cage nut)
              variants:
              - heat-set straight-hole
              - heat-set tapered-hole
              - ultrasonic
              - flanged/headed
              - long vs short
              - cold press-in knurled
              - self-tapping insert
              - moulded-in insert
              - brass vs stainless
              tradeoffs:
              - vs tapped plastic - much better wear and repeated assembly, adds a part and an operation
              - vs press-in - better pull-out and torque-out, needs heat control
              - vs moulded-in - post-install avoids loading mould but less repeatable
              - vs through-bolt - one-sided access, lower fatigue strength
              howto:
              - Use the insert maker's hole diameter and tolerance; hole depth insert length plus 2 pitches (1.2x length if
                self-tapping).
              - Make boss or surrounding wall 2 to 3 insert diameters.
              - Heat about 28 C above polymer softening (about 83 C for filled), press at low pressure, stop flush.
              - Use a guided tip or fixture so the insert goes in square; allow at most 0.13 mm projection.
              - Leave screw overrun so the screw cannot bottom.
              - Section sample parts to confirm polymer flow into knurls.
              - Test pull-out and torque-out on the actual plastic; catalogue values are comparative only.
              issues:
              - issue: insert chosen from screw size alone
                fix: choose from pull-out, torque-out, temperature, test on real plastic
                failure_mode: overload
              - issue: hole wrong size or too shallow
                fix: use maker's hole and depth rule
                failure_mode: assembly-error
              - issue: thin boss splits
                fix: boss 2-3x insert dia, ribs, fillets
                failure_mode: brittle-fracture
              - issue: overheating or high force
                fix: controlled temperature and pressure
                failure_mode: softening
              - issue: sustained clamp load on hot plastic
                fix: compression limiter, larger bearing, through-bolt
                failure_mode: creep-preload-loss
              - issue: voids around knurls
                fix: sectioned inspection, correct process
                failure_mode: overload
              axes:
                locking: relevant (screw back-out; prevailing-torque or threadlocker compatible with polymer)
                captive: n/a (insert is permanently retained; screw is separate)
                corrosion: relevant (brass/steel screw galvanic; stainless insert for chemicals)
                bearing-face: relevant (plastic under clamped part creeps; washer or limiter)
                material-direction: relevant (FDM layer orientation and boss layer boundaries)
