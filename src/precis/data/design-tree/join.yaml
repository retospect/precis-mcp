            clinch:
              id: join/permanent/permanent-mechanical/clinch
              role: leaf
              coverage: deep
              principle: form
              directness: direct
              implies:
                class: rigid
              summary: Join two or more ductile metal sheets by pressing a local button interlock with a punch and die. No
                added part, no heat, no consumable.
              when:
              - separable=never
              - far_material=metal, ductile and formable (sheet, including coated or dissimilar pairs)
              - process=sheet, medium to high quantity
              - access=both-sides (punch one side, die the other)
              - load_kind=static or modest cyclic, loaded in shear; total stack up to about 12 mm
              avoid_when:
              - 'brittle or low-ductility material: cast iron, hardened steel, cold-worked sheet, porous casting'
              - peel, cleavage or severe impact loads (button pulls out)
              - sealing required (a clinch point is not a seal)
              - access=one-side or none
              - low quantity where punch, die and inspection dominate cost
              - separable in {service, frequent}
              variants:
              - round clinch point with fixed die (non-cutting)
              - round clinch point with expanding or split die
              - rectangular or cutting clinch point
              - flat-bottom clinch (no protruding button)
              tradeoffs:
              - vs spot weld - no heat, no distortion, works on coated and dissimilar sheets, but lower strength and no seal
              - vs rivet - no consumable and no pre-drilled hole, but needs formable material and two-sided access
              - vs adhesive - no cure time and no surface prep, but load is carried at points, not distributed
              - vs screw or bolt - faster and cheaper per joint, not reversible
              - button protrudes on the die side and may need clearance or a flat-bottom variant
              howto:
              - 'Screen the sheet for ductility: fracture elongation and yield-to-tensile ratio decide whether a clinch point
                will form without cracking.'
              - Put the thicker (and stronger) sheet on the punch side, pressed into the thinner one; keep the thicker sheet
                within twice the thinner.
              - Keep clinch points away from the sheet edge and from each other by the multiples listed in the rules.
              - Place several points and orient them so the real load is shear, not peel.
              - Qualify the joint by pull and shear tests on the actual stack, coating and tool set; capacity depends on all
                three.
              - Check button height against nearby parts before releasing the drawing.
              issues:
              - issue: sheet order inverted (thin sheet on the punch side)
                fix: thicker, stronger sheet on the punch side, thicker at most twice the thinner
                failure_mode: assembly-error
              - issue: point too close to edge or to a neighbour
                fix: use the edge and pitch multiples of punch and button diameter
                failure_mode: overload
              - issue: brittle or work-hardened sheet cracks in the button
                fix: check ductility first; change material or temper, or use a rivet
                failure_mode: brittle-fracture
              - issue: real load is peel, not shear
                fix: add more points, add a flange, or add a weld or bolt at the peel end
                failure_mode: overload
              - issue: dissimilar metals in a wet environment
                fix: match the pair, or coat and seal the crevice around each point
                failure_mode: galvanic-corrosion
              axes:
                locking: 'n/a: no thread; the interlock is mechanical and does not loosen'
                captive: 'n/a: no loose part'
                corrosion: 'relevant: dissimilar sheets and the crevice at the button need isolation or sealing'
                bearing-face: 'n/a: no clamped faces'
                material-direction: 'relevant: sheet grain and ductility affect button cracking; check on the real sheet'
              rules:
              - id: c1
                text: 'clinch material screen fracture elongation A80 at least: 12 percent'
                value: '12'
                unit: percent
                equipment: sheet
                source_url: https://european-aluminium.eu/wp-content/uploads/2022/11/8-mechanical-joining_2015.pdf
                source_quality: secondary
                confidence: secondary
              - id: c2
                text: 'clinch material screen Rp0.2/Rm at most: 0.7 ratio'
                value: '0.7'
                unit: ratio
                equipment: sheet
                source_url: https://european-aluminium.eu/wp-content/uploads/2022/11/8-mechanical-joining_2015.pdf
                source_quality: secondary
                confidence: secondary
              - id: c3
                text: 'industrial clinching sheet thickness from 0.1 mm up to total stack: 12 mm'
                value: '12'
                unit: mm
                equipment: sheet
                source_url: https://european-aluminium.eu/wp-content/uploads/2022/11/8-mechanical-joining_2015.pdf
                source_quality: secondary
                confidence: secondary
              - id: c4
                text: 'clinch material tensile strength upper range: 800 MPa (N/mm2)'
                value: '800'
                unit: MPa (N/mm2)
                equipment: sheet
                source_url: https://european-aluminium.eu/wp-content/uploads/2022/11/8-mechanical-joining_2015.pdf
