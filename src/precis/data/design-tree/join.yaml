            tube-swage-crimp:
              id: join/permanent/permanent-mechanical/tube-swage-crimp
              role: leaf
              coverage: deep
              principle: force
              directness: direct
              implies:
                class: rigid
              summary: Join a tube to a fitting by plastically deforming the tube or fitting with a swage, roller or crimp
                tool. Used for qualified fluid-system joints; capacity depends on the whole fitting system.
              when:
              - separable=never for the tube-to-fitting joint
              - far_material=metal tube, ductile, with the fitting system's specified wall and hardness
              - process=bought fitting system plus tooling, medium to high quantity or field assembly
              - load is internal pressure and vibration within the fitting maker's qualified rating
              avoid_when:
              - mixing ferrules, sleeves or fittings from different makers
              - tube outside diameter, wall or hardness outside the maker's range
              - pressure or vibration duty not covered by the system's qualification
              - low quantity where tooling and inspection dominate
              variants:
              - internal roller swage (elastic or three-groove)
              - external swage or orbital swage
              - hydraulic crimp sleeve
              - twin-ferrule compression fittings (related, reversible once)
              tradeoffs:
              - vs brazing or welding - no heat, no filler, faster and inspectable by tool settings
              - vs flare or compression fitting - lighter and more compact, but not reversible
              - tooling and qualification cost is high; value comes at volume or in the field
              - validated only as a complete system, so parts are not interchangeable between makers
              howto:
              - 'Use one maker''s matched system: tube, fitting, sleeve and tooling.'
              - Hold tube outside diameter, wall, hardness and insertion depth to the maker's data; deburr the tube end.
              - Validate with vibration and leak tests, not a pressure test alone.
              - Record tool settings and gauge checks on every joint.
              - Check the maker's rated operating pressure against the qualification standard named in the data sheet.
              issues:
              - issue: ferrules or fittings from different makers intermixed
                fix: use one matched system; do not rely on a passing pressure test
                failure_mode: fatigue
              - issue: tube surface, wall or hardness outside range
                fix: hold the maker's tube data; deburr and inspect
                failure_mode: assembly-error
              - issue: insertion depth wrong or not verified
                fix: mark and gauge insertion depth before swaging
                failure_mode: assembly-error
              - issue: swage treated as a seal without leak and vibration qualification
                fix: qualify with leak and vibration tests on the real assembly
                failure_mode: fatigue
              axes:
                locking: 'n/a: deformation joint, no thread'
                captive: 'n/a: no loose part'
                corrosion: 'relevant: dissimilar tube and fitting metals, crevices at the sleeve'
                bearing-face: 'n/a: no clamped faces'
                material-direction: 'n/a: tube material properties govern, not grain direction'
