            heat-stake:
              id: join/permanent/permanent-mechanical/heat-stake
              role: leaf
              coverage: deep
              principle: form
              directness: direct
              implies:
                class: rigid
              summary: A moulded thermoplastic post goes through a hole in the second part and is reformed into a head with
                heat or ultrasonic energy. Cheap permanent retention in volume; weak as sole carrier of high or cyclic load.
              when:
              - separable=never (hollow stake allows screw rework)
              - one part is a thermoplastic with an integral post; other part may be metal or different plastic
              - process=moulded (high volume) or machined/FDM thermoplastic for low quantity
              - load is clamping, pull-through, light shear, moderate vibration, shared across several stakes
              - 'access: forming tip or horn reaches the post roughly normal to the surface and anvil can support beneath'
              avoid_when:
              - separable in {service, frequent}
              - neither part is thermoplastic
              - one small post carries large, cyclic or safety-critical load
              - high sustained temperature or creep, chemical, UV, large thermal cycling without testing
              - post hidden, deep, or angled
              - FDM with layers across the load path
              - one-off quantity where tooling costs more than a screw
              variants:
              - dome high or low profile
              - rosette / conical (high and low profile)
              - hollow / tubular
              - knurled / ribbed
              - flush / countersunk
              - ultrasonic staking (pointed, dome, standard, flush horn profiles)
              tradeoffs:
              - vs screw/insert - cheaper and faster, not serviceable
              - vs snap-fit - more tamper resistant, not tool-free
              - vs adhesive - no cure, plastic-to-metal capture is easy, but not a seal
              - vs ultrasonic weld - joins plastic to metal or unlike plastic, no weld compatibility needed
              - heat stake vs ultrasonic stake - heat tolerates abrasive fillers and varied heads, slower; ultrasonic faster
                but sensitive to alignment and support
              - vs rivet/clinch - no separate fastener and easy to integrate into a moulded part, but rivet or clinch carries
                higher metal loads
              howto:
              - Size the post and head from the staking-equipment maker's volume relations; match protruding volume to head
                volume.
              - Round the post base and add ribs or gussets around the boss.
              - Make the hole in the captured part a close fit so melt does not escape into the gap.
              - Support the captured part on a hard anvil directly under each stake.
              - Locate tip or horn with XY adjustment; alignment is critical.
              - Use hollow stakes for large posts to cut melt volume and sink.
              - Design from actual moulded dimensions, not CAD nominal.
              - Use several stakes or a shoulder when the load is more than light; derate for creep and qualify at maximum
                temperature.
              issues:
              - issue: post too tall or short
                fix: use volume relations from the maker's guide
                failure_mode: assembly-error
              - issue: thin boss wall
                fix: larger boss, ribs, base radius
                failure_mode: brittle-fracture
              - issue: sharp post-to-part corner
                fix: rounded base
                failure_mode: fatigue
              - issue: loose hole
                fix: close fit with tolerance stack checked
                failure_mode: assembly-error
              - issue: no support under captured part
                fix: anvil or fixture under every stake
                failure_mode: assembly-error
              - issue: tip or horn misaligned
                fix: locating features and XY adjustment
                failure_mode: assembly-error
              - issue: one small post carries high load
                fix: multiple stakes, shoulder, or screw as primary carrier
                failure_mode: overload
              - issue: sized for room temperature only
                fix: derate with creep data and test hot
                failure_mode: creep-preload-loss
              - issue: FDM layers loaded in interlayer direction
                fix: reorient, ribs, validate
                failure_mode: brittle-fracture
              - issue: hole too tight
                fix: just enough clearance for insertion plus support under captured part
                failure_mode: assembly-error
              - issue: stake too close to an edge or another stake
                fix: more spacing, local reinforcement, smaller head
                failure_mode: brittle-fracture
              - issue: one head profile used for every resin
                fix: pick profile by resin, filler, size, appearance and access
                failure_mode: softening
              - issue: heat or force too high or cooling uncontrolled
                fix: control tip temperature, force, dwell and cooling; dry the resin
                failure_mode: embrittlement
              axes:
                locking: relevant - knurled or rosette heads and multiple stakes resist rotation and rattle
                captive: relevant - the formed head captures the second part; no loose parts
                corrosion: n/a - plastic post; only metal captured part or conductive filler at a crevice
                bearing-face: relevant - head diameter and bearing area against the captured part govern pull-through and
                  creep
                material-direction: relevant - FDM layer direction and glass-fibre orientation at the post
              rules:
              - id: c1
                text: 'high dome stake finished diameter: 2 x boss dia X'
                value: '2'
                unit: x boss dia X
                equipment: any
                source_url: https://www.emerson.com/is/content/emerson/it/corporate/branson/documents/thermal-staking-design-guide-pgs.pdf
                source_quality: primary
