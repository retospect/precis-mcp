            rivet-nut:
              id: join/permanent/permanent-mechanical/rivet-nut
              role: leaf
              coverage: deep
              principle: form
              directness: indirect
              also_under:
              - join/service/threaded
              implies:
                class: rigid
                mechanism: screw
                rank: 9
              summary: A threaded tubular insert set from one side of a panel or tube by pulling and upsetting its body. Gives
                a captive thread where only one side is reachable.
              when:
              - separable=service (the screw comes out; the nut stays)
              - access=one-side
              - far_material=metal sheet or tube, or hard plastic panel with a suitable body
              - process=sheet or extruded profile, any quantity (hand or powered setting tool)
              - thin or hollow section where tapping is not possible
              avoid_when:
              - thick, very soft or brittle panels without a matched body style
              - high torque-out or push-out loads beyond the maker's rating
              - two-sided access is available and high strength is needed (self-clinching is stronger)
              - sealed enclosures unless a closed-end version is used
              variants:
              - open-end and closed-end bodies
              - round, half-hex and full-hex bodies
              - flat, countersunk and small-flange heads
              - knurled or splined bodies for torque
              - aluminium, steel and stainless materials
              tradeoffs:
              - vs self-clinching nut - works from one side, but lower push-out and torque-out
              - vs blind rivet - gives a reusable thread, not just a fixing
              - vs tapping thin sheet - much stronger and reusable
              - vs heat-set or moulded insert - for sheet and tube, not for plastic bosses
              - hex or half-hex bodies resist spin better than round bodies in the same hole
              howto:
              - 'Pick the body style for the panel: round for general use, hex or splined where the screw torque would spin
                the nut.'
              - Match the grip range to the panel thickness; too short a grip leaves the nut loose.
              - Drill or punch the hole to the maker's size and set with the matched mandrel.
              - Choose body and screw materials with galvanic compatibility in mind, including the panel.
              - Qualify torque-out and push-out in the actual panel material.
              issues:
              - issue: round body spins in the hole under screw torque
                fix: hex, half-hex or splined body; hole shaped to match
                failure_mode: loosening
              - issue: grip range does not match panel thickness
                fix: select the nut from the grip table for the real thickness
                failure_mode: assembly-error
              - issue: soft or brittle panel crushes or cracks
                fix: large-flange or slotted body; test in the real panel
                failure_mode: overload
              - issue: galvanic couple between nut and panel
                fix: match metals, or isolate and seal
                failure_mode: galvanic-corrosion
              axes:
                locking: 'relevant: body shape stops spin in the hole; screw locking is separate'
                captive: 'relevant: the nut is captive in the panel'
                corrosion: 'relevant: nut body versus panel metal, crevice under the flange'
                bearing-face: 'relevant: flange size controls pull-through in thin sheet'
                material-direction: 'n/a: not governed by sheet grain'
              rules:
