join_manifest: v3
status: 'pilot, verified drafts merged; for review, not yet linked or deduped; run 2: equipment scope added to every rule,
  permanent-snap c4 upgraded to handbook'
ai_use: 'Pre-filled with Perplexity (perplexity-reasoning) to find sources, then each rule was checked against its cited source
  by a separate agent. Prose and rule texts are our own wording; values trace to the listed source_url. Confidence levels:
  standard, handbook, secondary, excerpt-only, shop-rule (not DRC-enforceable), unverified.'
join:
  role: goal
  domain: mech
  scale: macro
  def: fix two parts with no relative motion, permanent or detachable
  asks:
  - separable
  - load_kind
  - load_N
  - material_pair
  - process
  - access
  - quantity
  - environment
  - temp_range_C
  id: join
  children:
    integrate:
      id: join/integrate
      role: method
      when: 'DFA test: no relative motion, no different material needed, no separation for assembly/service'
      children:
        one-body-print-mould:
          id: join/integrate/one-body-print-mould
          role: leaf
          coverage: deep
          principle: none
          directness: direct
          implies:
            class: rigid
            mechanism: integral
          summary: Make both functions one continuous printed or moulded body (integral hinges, snaps, print-in-place) so
            no joint exists. Fits permanent, low-load-at-interface assemblies of one material.
          when:
          - separable=never and no service, inspection or replacement of either half
          - load_kind=static or light, with the load path continuous through the material
          - one material is acceptable for both functions
          - process=FDM at low quantity, or moulded at medium/high quantity
          - captive moving parts or integral hinge/snap wanted
          avoid_when:
          - parts are wear items or need different service lives
          - high cyclic, impact, peel or torque load at the interface
          - FDM where the critical load opens the layer interfaces
          - one function needs a different material (bearing, spring, conductor)
          - enclosed cavities cannot be drained or cleaned
          - quantity too low for mould tooling or too high for serial FDM
          variants:
          - monolithic solid
          - integral compliant mechanism / living hinge
          - print-in-place captive mechanism
          - moulded integral snap/hinge
          - overmould or insert
          - one-piece cast or machined
          - one-blank sheet metal
          tradeoffs:
          - fewer parts, no fastener loosening, no tolerance stack-up
          - a local defect or worn feature scraps the whole body
          - transmits vibration and thermal strain instead of isolating it
          - FDM anisotropy and support residue can make it weaker than two oriented parts
          - moulding adds tooling, draft, parting lines and weld lines
          - enclosed voids can trap powder, resin, water or mould gas, and make inspection and cleaning harder
          howto:
          - Settle process, orientation and tooling direction before drawing the continuous body.
          - Orient FDM layers so bending stress lies in the layer plane.
          - Give print-in-place gaps at least 0.3 mm and test a coupon in the real material.
          - Keep moulded walls uniform; core out thick regions and use ribs.
          - Add draft, and fillets at hinge, rib and cantilever roots.
          - Keep gates, weld lines and support scars out of the primary load path.
          - Add drain or powder-escape holes to enclosed print-in-place cavities.
          issues:
          - issue: zero-clearance print-in-place parts fuse
            fix: process-specific running gap of at least 0.3 mm, tested on a coupon
            failure_mode: assembly-error
          - issue: hinge or snap bent across FDM layers
            fix: reorient so bending is in the layer plane, enlarge root radius, or use a separate pin or spring
            failure_mode: fatigue
          - issue: thick moulded section next to thin wall
            fix: core out and transition gradually
            failure_mode: excess-deflection
          - issue: weld line or gate in the load path
            fix: move gate, rotate print, add rib, or split at an inspectable joint
            failure_mode: brittle-fracture
          - issue: sharp root on hinge, rib or cantilever
            fix: generous fillet and taper
            failure_mode: fatigue
          - issue: moulded polymer under chemical plus residual stress
            fix: pick polymer for the exposure, remove notches and residual stress
            failure_mode: environmental-stress-cracking
          - issue: sustained load on snap beam or printed pivot
            fix: lower strain and temperature, add stops, or use a metal spring or pin
            failure_mode: creep-preload-loss
          - issue: same-material sliders and gears wear
            fix: dissimilar bearing insert or replaceable bushing
            failure_mode: wear-fretting
          - issue: textured moulded face given only the plain 1-2 deg draft
            fix: add about 1.5 deg per 0.025 mm of texture depth
            failure_mode: assembly-error
          axes:
            locking: 'n/a: no fastener to loosen; captive mechanisms may gain clearance from creep or wear, use positive stops'
            captive: 'relevant: print-in-place gives captive parts without a retainer'
            corrosion: n/a for a single polymer; relevant only for integral metal combinations (isolate, ASTM G82 / MIL-STD-889D)
            bearing-face: 'n/a: no clamped faces; reduce contact pressure on integral sliders'
            material-direction: 'relevant: FDM interlayer bond is the weakest direction, orient layers with the load'
          rules:
          - id: c1
            text: Initial clearance for printed moving parts is at least 0.3 mm; no universal value, test it
            value: '0.3'
            unit: mm
            equipment: desktop-fdm
            source_url: https://help.prusa3d.com/article/modeling-with-3d-printing-in-mind_164135
            source_quality: primary
            confidence: handbook
          - id: c2
            text: 0.4 mm nozzle gives about 0.45 mm extrusion width
            value: '0.45'
            unit: mm
            equipment: desktop-fdm
            source_url: https://help.prusa3d.com/article/modeling-with-3d-printing-in-mind_164135
            source_quality: primary
            confidence: handbook
          - id: c3
            text: FDM walls of 1/2/3/4 perimeters are about 0.45/0.9/1.35/1.8 mm
            value: 0.45-1.8
            unit: mm
            equipment: desktop-fdm
            source_url: https://help.prusa3d.com/article/modeling-with-3d-printing-in-mind_164135
            source_quality: primary
            confidence: handbook
          - id: c4a
            text: Minimum FDM wall about 4x layer thickness (1.016 mm at 0.254 mm layers)
            value: '4'
            unit: x layer thickness
            source_url: https://www.stratasys.com/siteassets/sdm/content---website-storage/design-guides/dg_sdm_fdm_0725a.pdf?v=490918
            source_quality: primary
            equipment: industrial-fdm
            confidence: handbook
            note: Stratasys 4x layer rule kept for Fortus-class machines; not re-verified against the PDF (not in this slice
              scope)
          - id: c4b
            text: Minimum printable FDM wall on a 0.4 mm nozzle is one perimeter, about 0.45 mm; two perimeters give about
              0.9 mm
            value: '0.45'
            unit: mm
            source_url: https://help.prusa3d.com/article/modeling-with-3d-printing-in-mind_164135
            source_quality: primary
            equipment: desktop-fdm
            confidence: handbook
            corrected: true
            machine_specific: true
            table_ref: fdm/*.min_wall
          - id: c5
            text: Injection-moulded nominal wall commonly 1-3 mm
            value: 1-3
            unit: mm
            equipment: injection-mould
            source_url: https://cdn.thomasnet.com/kc/5289/doc/Injection_Molding_the_Definitive_Engineering_Guide.pdf
            source_quality: secondary
            confidence: secondary
          - id: c6
            text: Moulding draft is commonly 1-2 deg; about 0.5 deg is an absolute floor for most resins, and textured faces
