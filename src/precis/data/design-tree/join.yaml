            value: '1.5'
            unit: deg per 0.025 mm texture depth
            equipment: injection-mould
            source_url: https://www.stratasys.com/siteassets/sdm/resources/design-guidelines/injection-molding/injection_molding_design_guidelines_2017.pdf?v=499c06
