    key-flat-spline:
      id: locate/key-flat-spline
      role: leaf
      coverage: deep
      implies:
        class: rigid
        mechanism: key
        rank: 2
      summary: Stop rotation on a shaft with a DIN 6885 parallel key (detachable, moderate torque), a D-flat or polygon (low-load
        moulded/FDM), or an ISO 4156 involute spline (high torque, concentricity, sliding). None of them locates axially;
        add a shoulder, ring or clamp.
      when:
      - 'DIN key: detachable steel shaft-hub, moderate torque, machined, low-medium quantity, separable=service'
      - 'D-flat or polygon: small low-load assemblies, moulded or FDM parts, set screw or clamp hub'
      - 'involute spline: high torque density, concentricity, repeated assembly or axial sliding, volume justifies tooling
        and gauges'
      avoid_when:
      - 'key: reversing or fatigue-critical shafts, very high torque for the diameter, severe shock, thin hubs, precise concentricity
        needed'
      - 'D-flat: high or reversing torque, impact, soft polymer hub, precise centring'
      - 'spline: FDM, ordinary moulded polymer, thin sheet, very low quantity, no inspection capability'
      - 'sheet metal: use tabs, slots, formed polygon or an inserted hub instead of a keyway'
      variants:
      - DIN 6885 Form A (round ends), B (square ends), AB (one each)
      - feather key, taper key, Woodruff key
      - single D-flat, double flat, hex/square/polygon shaft, serration
      - straight-sided spline, involute spline (ISO 4156), side/major/minor-diameter fit
      - interference, taper or clamp fit as keyless alternative
      tradeoffs:
      - 'key: cheap and standard but keyway is a stress raiser and load sharing is eccentric'
      - 'spline: strongest and most concentric but costly and tolerance-sensitive'
      - 'flat: cheapest, torque stop only, not a locating datum'
      - 'interference/clamp: no backlash, hard to disassemble'
      howto:
      - take key width, height and keyway depth from the DIN 6885 table by shaft diameter, do not invent sizes
      - fit the key on its flanks and leave clearance on top
      - locate the hub radially with a pilot diameter or shoulder, not the key; retain axially separately
      - check key shear, flank bearing, shaft fatigue at keyway, hub bursting, and peak torque
      - use the shortest key that passes checks; use bigger shaft or spline if not enough
      - end keyways with a radius and generous shoulder fillet
      - for plastic, use coarse polygon or metal insert and print a fit coupon
      - 'specify splines fully: standard, module, teeth, pressure angle, fit class, datum, inspection'
      issues:
      - issue: key used to locate hub radially
        fix: pilot diameter or shoulder, key only for torque
        failure_mode: wear-fretting
      - issue: sharp keyway end at a shaft shoulder
        fix: end radius and fillet, or clamp/interference fit
        failure_mode: fatigue
      - issue: set screw as sole anti-rotation
        fix: key, flat or spline plus clamp hub
        failure_mode: loosening
      - issue: D-flat under reversing torque crushes
        fix: key, polygon or spline
        failure_mode: fatigue
      - issue: fine spline printed in FDM
        fix: coarse polygon or metal insert
        failure_mode: creep-preload-loss
      - issue: steel shaft in aluminium hub fretting and galvanic attack
        fix: anodize, coat, grease, isolate
        failure_mode: galvanic-corrosion
      - issue: thin hub splits at keyway
        fix: thicker wall, smaller keyway, retaining shoulder
        failure_mode: brittle-fracture
      axes:
        locking: 'relevant: set screws loosen; key needs axial retention; thread locking on clamp screws'
        captive: 'n/a: torque feature, axial retention is separate'
        corrosion: 'relevant: steel shaft in aluminium hub, crevices around keyway/spline; coat, grease, drain'
        bearing-face: 'relevant: flank bearing stress in softer member governs; keyway flank length'
        material-direction: 'relevant: filled polymers and FDM layers are anisotropic, orient layers for torque'
      rules:
      - id: a1
        text: DIN 6885 Form A is the round-ended key without drilling
        value: Form A
