            nut-trap:
              id: join/service/threaded/nut-trap
              role: leaf
              coverage: deep
              principle: force
              directness: indirect
              implies:
                class: rigid
                mechanism: screw
                rank: 4
              summary: Hex pocket in a plastic part captures a standard nut so a screw clamps without a spanner on the far
                side. Cheap and FDM-friendly; weak walls, creep and nut-spin limit load and cycle life.
              when:
              - separable=service
              - process in {FDM, moulded with side entry}
              - far_material=thermoplastic
              - access=one-side to the screw
              - load_kind=static or moderate axial
              - quantity low
              - environment=indoor-dry
              avoid_when:
              - high preload or sustained load on thin wall
              - impact or prying
              - high cycle count (use insert)
              - high volume (moulded-in insert)
              - closed pocket with no install path
              - corrosive or high-temperature creep environment
              - simple closed hex void in moulding (undercut)
              variants:
              - closed drop-in trap with pause-in-print
              - side-entry slide-in
              - bottom-entry or cover-retained
              - snap-retained
              - nut-plus-washer pocket
              - moulded-in nut
              tradeoffs:
              - vs heat-set insert - no tooling or heat, but nut can spin and wear the pocket
              - vs through-bolt - one-sided, but wall carries torque and load
              - vs self-tapping - metal thread, reusable, but needs pocket and install step
              howto:
              - Take across-flats and thickness from the actual nut, then add 0.1 to 0.2 mm per side for FDM.
              - Pocket depth is nut thickness plus 0.2 to 0.3 mm.
              - Overlap hex pocket and screw hole, check in section.
              - Give 4 to 5 perimeter walls and two solid roof layers for FDM high-torque traps.
              - Use side entry or a pause in print; keep bridges short or chamfered.
              - Add a washer or plate under the head and relief under the screw tip.
              - Corner relief at least 0.4 mm radius.
              issues:
              - issue: pocket sized to nominal nut
                fix: size from measured nut plus printer allowance
                failure_mode: assembly-error
              - issue: nut spins
                fix: tight true hex, supported flats
                failure_mode: wear-fretting
              - issue: thin wall splits
                fix: thicker wall, ribs, washer, insert
                failure_mode: brittle-fracture
              - issue: closed pocket with no install route
                fix: pause print, side entry
                failure_mode: assembly-error
              - issue: clamp onto soft plastic
                fix: steel washer
                failure_mode: creep-preload-loss
              - issue: vibration backs screw out
                fix: prevailing-torque nut or threadlocker
                failure_mode: loosening
              axes:
                locking: relevant (loose-fit pocket is not a lock; prevailing-torque nut)
                captive: relevant (this is the captive feature; nut held against rotation and loss)
                corrosion: relevant (steel nut in polymer moisture path)
                bearing-face: relevant (washer under head, nut face on plastic floor)
                material-direction: relevant (FDM layer interface under pocket roof and walls)
              rules:
              - id: c1
                text: ISO 4032 M3 nut 5.5 mm across flats, 2.4 mm max thick
                value: 5.5 / 2.4
                unit: mm
                equipment: bought
                source_url: https://www.mfsupply.com/v/vspfiles/assets/31-NHM6ISO4032SS-0-Nut-Hex.pdf
                source_quality: secondary
                confidence: secondary
                standard: ISO 4032
              - id: c2
                text: ISO 4032 across flats / thickness M4 7.0/3.2, M5 8.0/4.7, M6 10.0/5.2, M8 13.0/6.8, M10 16.0/8.4 mm
                value: 7/3.2; 8/4.7; 10/5.2; 13/6.8; 16/8.4
                unit: mm
                equipment: bought
                source_url: https://www.mfsupply.com/v/vspfiles/assets/31-NHM6ISO4032SS-0-Nut-Hex.pdf
