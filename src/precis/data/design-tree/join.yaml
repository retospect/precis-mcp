            thread-forming:
              id: join/service/threaded/thread-forming
              role: leaf
              coverage: deep
              principle: force
              directness: indirect
              implies:
                class: rigid
                mechanism: screw
                rank: 5
              summary: Plastic-specific thread-forming screw (low-angle flank, e.g. EJOT DELTA PT) driven into a cored boss
                in a ductile thermoplastic. Cheapest one-sided joint for a few openings and moderate loads; poor for frequent
                service, hot or filled plastics without testing.
              when:
              - separable=service (few cycles)
              - far_material=thermoplastic ductile (ABS, PP, PA, PS)
              - process=moulded (best) or machined or FDM prototype
              - access=one-side
              - load_kind=static light-to-moderate clamp
              - quantity high
              avoid_when:
              - frequent opening
              - high sustained tension
              - shock
              - safety-critical pull-out
              - hot environment
              - glass-filled/hard plastic untested
              - sheet metal
              - vibration-critical
              variants:
              - thread-forming low-angle (20/30 deg) plastic screw
              - thread-cutting screw
              - trilobular forming screw (DIN 7500 type)
              - plastic screw (PPA-GF50)
              - machine screw in insert
              - moulded or machined thread
              - captive nut or through-bolt
              tradeoffs:
              - vs insert - cheaper, no extra part, but wears and relaxes with reuse
              - vs through-bolt - one-sided, but lower pull-out and fatigue
              - vs machine-tapped plastic - stronger thread, no removal of material
              - vs snap-fit - sustains load better, costs a screw
              howto:
              - Pilot hole about 0.8 d (0.7 to 0.8 d by material), boss OD 2 d, engagement 2 d.
              - Add boss edge relief d + 0.2 mm lead-in.
              - Keep boss wall under 60 percent of nominal wall and attach it with ribs, base fillet at least 0.25 of base
                thickness.
              - Leave hole depth at least 0.8 mm beyond the engaged screw.
              - Drive with torque or torque-angle control at 300 to 800 rpm.
              - Use minimum torque and a wide head or washer; keep forming torque well below strip and break torque.
              - Test the whole joint on the real plastic and temperature.
              issues:
              - issue: pilot hole too small
                fix: use supplier hole, validate by torque test
                failure_mode: brittle-fracture
              - issue: pilot hole too large
                fix: reduce within supplier range
                failure_mode: overload
              - issue: ordinary 60 degree machine screw
                fix: plastic-specific low-angle screw or insert
                failure_mode: brittle-fracture
              - issue: no lead-in
                fix: edge relief
                failure_mode: assembly-error
              - issue: over-torque
                fix: torque control, minimum clamp
                failure_mode: creep-preload-loss
              - issue: aggressive chemicals under stress
                fix: lower preload, test
                failure_mode: environmental-stress-cracking
              - issue: boss merged into thick wall
                fix: core boss, ribs
                failure_mode: assembly-error
              axes:
                locking: relevant (low-angle thread helps vibration; no separate lock)
                captive: n/a (screw is separate)
                corrosion: relevant (stainless or coated screw, ESC of polymer)
                bearing-face: relevant (washer or large head on soft plastic)
                material-direction: relevant (FDM boss layers split; filled plastics)
              rules:
              - id: c1
                text: Pilot hole about 0.8 d for conventional thermoplastics (Bossard DELTA PT)
                value: '0.8'
