  bearing-face:
    id: axes/bearing-face
    role: axis
    coverage: deep
    summary: Check bearing pressure p = F / annular area against an allowable for the actual material, temperature and time
      (VDI 2230); use thick hardened washers, flange heads, load plates or metal compression limiters on aluminium and plastics.
      No universal allowable exists; the numbers are source-specific, and several of them in this node could not be traced
      to their cited sources.
    when:
    - plain head or nut only on hard, flat, machined steel surfaces with static load
    - washer or flange head on aluminium, sheet metal, paint or polymer to spread load
    - compression limiter or metal sleeve in plastic, FDM or composite where preload must last years or temperature is elevated
    - wedge-lock washers only on hard supporting substrates
    avoid_when:
    - high-strength screw head directly on aluminium, plastic, thin sheet or rough casting
    - thin or soft washer under high preload (dishes, yields, embeds)
    - countersunk head in plastic, thin sheet or narrow edge margins (radial bursting)
    - serrated washers or flanges on plastics, thin aluminium, coated or sealing faces, reusable joints
    - washer or limiter that does not actually bear on the limiter or hard surface
    variants:
    - plain, large-series (fender), thick hardened washers and load-spreading plates
    - flange-head screw, washer-head screw, flange nut
    - serrated, wedge-lock, spring and Belleville washers
    - sealing, bonded, captive and shoulder washers
    - compression limiter (moulded-in, press-fit, split-seam, headed), threaded insert plus limiter
    - machined bearing pad or cast boss
    tradeoffs:
    - 'washer: lower pressure but one more interface and embedment'
    - 'flange head: fewer parts and faster, less flexible, may still be too small'
    - 'thick washer vs larger screw: usually cheaper, adds height, check washer bending'
    - 'limiter: stops polymer creep consuming preload, adds part and boss design'
    - 'through-bolt vs plastic thread: robust but needs both-side access'
    howto:
    - compute p on the annular area (D_o^2 - D_h^2) pi/4 using hole diameter including chamfer
    - check pressure after tightening and in service against allowable for the actual material and temperature
    - check washer bending and yield, not only substrate pressure
    - use a metal limiter in plastic; limiter length equal to or slightly under host thickness, proof load at least equal
      to bolt proof load
    - keep boss diameter about 2x limiter diameter (2-3x for inserts)
    - machine a flat square pad on castings; do not seat on rough sloping surfaces
    - minimise number of interfaces and surface roughness to cut embedment
    - avoid spring or lock washers in highly preloaded high-strength joints
    - do not use generic metal torque tables on printed parts
    issues:
    - issue: high-strength bolt directly on aluminium or plastic
      fix: larger or thicker washer, plate, limiter; recompute p
      failure_mode: creep-preload-loss
    - issue: washer assumed beneficial but dishes or embeds
      fix: check thickness, hardness, bending
      failure_mode: creep-preload-loss
    - issue: countersunk screw in plastic or thin sheet
      fix: flat head plus washer, or flange head
      failure_mode: brittle-fracture
    - issue: embedment at head, nut, threads and interfaces ignored
      fix: include embedding loss per VDI 2230
      failure_mode: creep-preload-loss
    - issue: bolt hole near edge or layer seam
      fix: more edge distance, boss, plate, insert, favourable print orientation
      failure_mode: brittle-fracture
    - issue: washer bridges curved or rough cast surface
      fix: machine pad or use shaped washer
      failure_mode: excess-deflection
    - issue: water trapped under washer on dissimilar metals
      fix: compatible coating, isolate, drain
      failure_mode: crevice-corrosion
    axes:
      locking: 'relevant: wedge-lock, serrated and spring washers are bearing-face choices; spring washers embed'
      captive: 'relevant: captive and bonded washers'
      corrosion: 'relevant: water traps under washers, serrations destroy coatings'
      bearing-face: this axis
      material-direction: 'relevant: FDM and fibre-filled plastic allowable pressure depends on layer and fibre direction'
