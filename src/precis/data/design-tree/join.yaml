    nest-pocket-step:
      id: locate/nest-pocket-step
      role: leaf
      coverage: deep
      implies:
        class: rigid
      summary: Locate by a pocket, shoulder, step or edge datum that takes compression and shear; a separate screw, clamp
        or snap holds the part down. Add one asymmetric feature or pin to stop rotation.
      when:
      - separable=service and load is mainly compressive or transverse into the shoulder
      - process=moulded, machined, cast or sheet where the step can be drafted, filleted or formed
      - process=FDM, low quantity, light load, with generous clearance and a fit coupon
      - large or flexible part supported by several distributed nests or a perimeter ledge
      avoid_when:
      - load is peel, tension normal to the nest, torsion or impact and the pocket is the only retention
      - joint must be permanently sealed or tamper-proof
      - large flexible part rests on one small pocket
      - deep narrow blind pocket with no cutter access, vent or cleaning path
      - soft, creep-prone or thermally mismatched pair with a rigid tight pocket
      variants:
      - flat step or shoulder
      - open edge nest (two perpendicular edges)
      - blind pocket capturing a boss
      - through pocket or window
      - perimeter ledge or tray
      - tongue-and-groove or rabbet
      - asymmetric or stepped key for poka-yoke
      - compliant nest with pads or spring fingers
      - nest plus fastener
      tradeoffs:
      - 'vs dowels: fewer parts and holes, but less repeatable than reamed pins'
      - 'vs fasteners alone: fasteners alone shift and fret; nest takes the shear'
      - 'vs press fit: easier separation, less cracking risk in plastic'
      - 'vs snap fit: stronger and less fatigue-prone, needs a separate retainer'
      - 'vs adhesive: serviceable but no sealing'
      howto:
      - use a broad accessible step or tray as the primary compression datum
      - add one secondary locator, asymmetric or relieved, to stop rotation; do not over-constrain all six degrees of freedom
        (3-2-1 scheme)
      - keep a separate retainer for tension and vibration
      - add chamfer or lead-in, internal radii, vent or drain in blind pockets
      - core out thick moulded bosses and use ribs; add draft in pull direction
      - print a fit coupon in the real material and orientation for FDM
      - separate the locating datum from the seal land
      - dimension datums per ASME Y14.5; use process-specific bilateral clearance for rectangular pockets
      issues:
      - issue: pocket is the sole retention
        fix: add screw, clamp, snap or hook
        failure_mode: loosening
      - issue: two rigid pockets or pins with no relief bind
        fix: one primary nest plus relieved or diamond locator
        failure_mode: assembly-error
      - issue: sharp internal corner cracks or cannot be cut
