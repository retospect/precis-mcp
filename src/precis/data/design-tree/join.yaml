                equipment: any
                source_url: https://f.hubspotusercontent30.net/hubfs/5229633/NicrobrazNews%20-%20Design%20&%20Strength%20of%20Brazed%20Joints%20-%20Feb11-SP.pdf
                source_quality: primary
                confidence: handbook
              - id: c4
                text: Manual flux-brazing wide gap up to about 0.5 mm
                value: '0.5'
