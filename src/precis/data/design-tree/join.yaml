        machine-from-solid:
          id: join/integrate/machine-from-solid
          role: leaf
          coverage: deep
          implies:
            class: rigid
            mechanism: integral
          summary: Cut both features from one billet, plate or near-net blank so the joint disappears. Pays off when the joint's
            risk and cost exceed the material removed.
          when:
          - separable=never and a joint would add leakage, alignment error or fastener loosening
          - load_kind=cyclic or shock, pressure-containing, or alignment-critical
          - process=machined, with material readily machinable and a near-net blank available
          - access=all critical surfaces reachable from few rigid tool directions
          - quantity low to medium, or design changes often
          - environment vacuum, corrosive, dirty or sterilised where crevices are unwanted
          avoid_when:
          - part must be replaced, adjusted, cleaned or repaired as separate pieces
          - very large part where billet cost, machine envelope or removal volume dominates
          - features hidden behind each other, needing long-reach tools or many setups
          - very high quantity where moulding, casting or stamping amortises tooling
          - shape is fundamentally a shell or bracket (use sheet metal)
          variants:
          - true monolith from billet or bar
          - plate monolith with pockets
          - near-net casting/forging/extrusion with finish machining
          - multi-axis monolith
          - hybrid monolith with installed bearings or inserts
          - additive preform with machined datums
          - integral sheet-metal form
          tradeoffs:
          - no loosening, preload loss, crevice or stack-up versus a bolted joint
          - no weld HAZ or distortion versus welding, but more scrap
          - no bondline ageing versus adhesive, but no dissimilar material or compliant isolation
          - no tooling cost versus moulding, but much higher unit cost at volume
          - repair may mean replacing the whole part
          howto:
          - Choose a blank close to the final envelope to cut removal volume.
          - Plan datums and fixturing first; machine datum faces early and reuse them.
          - Design for standard tools and the fewest setups.
          - Show tool, holder and probe envelopes in design review.
          - Radius internal corners to a standard cutter size.
          - Tolerance only functional interfaces, using GD&T per ASME Y14.5.
          - Rough-machine symmetrically, stress-relieve, then finish critical faces.
          - Fit replaceable bushings or wear plates where the monolith would wear.
          issues:
          - issue: deep narrow pockets chatter and deflect the tool
            fix: keep depth to about 3-4x tool diameter or open the pocket, add relief, or use a preform
            failure_mode: excess-deflection
          - issue: sharp internal corners need EDM and concentrate stress
            fix: add a radius matching a standard cutter
            failure_mode: fatigue
          - issue: thin tall walls vibrate and distort
            fix: thicken, add ribs, machine from both sides, keep a support web until finishing
            failure_mode: excess-deflection
          - issue: blind tapped holes run to full depth
            fix: conical bottom and specified usable thread depth with chip room
            failure_mode: assembly-error
          - issue: burrs and tool marks on tensile surfaces
            fix: specify edge breaks and deburring
            failure_mode: fatigue
          - issue: distortion after roughing or heat treatment
            fix: rough, stress-relieve, then finish critical features
            failure_mode: thermal-mismatch
          - issue: whole monolith used as wear surface
            fix: replaceable bushing or wear plate
            failure_mode: wear-fretting
          - issue: liquid traps and inaccessible bare pockets
            fix: drain and vent paths, compatible coating, isolate dissimilar metals
            failure_mode: crevice-corrosion
          axes:
            locking: 'n/a: no joint; installed bearings, inserts and covers still need positive retention'
            captive: 'n/a: single part'
            corrosion: 'relevant: removes joint crevices but traps and inaccessible pockets remain; isolate dissimilar installed
              parts'
            bearing-face: 'n/a: no clamped faces'
            material-direction: 'relevant: grain direction and billet versus forging affect fatigue in thin webs'
          rules:
          - id: c1
            text: Pocket depth to cutter diameter preferably no more than 3-4
            value: 3-4
            unit: ratio
            equipment: cnc-mill
            source_url: https://eng.libretexts.org/Courses/Northeast_Wisconsin_Technical_College/Design_for_Various_Manufacturing_Methods/02:_DFM_Guidelines_for_Specific_Manufacturing_Processes
            source_quality: secondary
            confidence: secondary
          - id: c2
            text: 'Minimum internal pocket radius about one third of feature depth: 0.33 x depth'
            value: '0.33'
            unit: x depth
            equipment: cnc-mill
            source_url: https://eng.libretexts.org/Courses/Northeast_Wisconsin_Technical_College/Design_for_Various_Manufacturing_Methods/02:_DFM_Guidelines_for_Specific_Manufacturing_Processes
            source_quality: secondary
            confidence: secondary
          - id: c3
            text: Thin metal-wall screening values are about 0.5 mm for aluminium and 1 mm for steel (vendor screening values,
              not limits)
            value: 0.5-1.0
            unit: mm
            equipment: cnc-mill
            source_url: https://www.hongke-cnc.com/blog/cnc-machining-design-guidelines-practical-engineering-guide.html
            source_quality: weak
            confidence: secondary
          - id: c4
            text: Burrs over about 0.4 mm need machining rather than tumbling or blasting
            value: '0.4'
