            through-bolt-nut:
              id: join/service/threaded/through-bolt-nut
              role: leaf
              coverage: deep
              principle: force
              directness: indirect
              implies:
                class: rigid
                mechanism: screw
                rank: 2
              summary: Bolt through clearance holes in both parts, nut and washers on the far side. Strongest, most inspectable
                detachable joint when both sides are reachable and parts can be drilled through.
              when:
              - separable=service
              - access=both-sides
              - load_kind in {static, cyclic, shock} with preload
              - load_N moderate to high
              - material_pair any with washer/sleeve for soft parts
              avoid_when:
              - access=one-side
              - separable=never
              - very high volume with one-sided automatic joining
              - FDM/moulded polymer alone under sustained preload or temperature
              - hole at thin edge or casting corner
              - flush surface required
              variants:
              - hex bolt with flat washers
              - flange bolt/nut
              - socket-head cap screw with nut
              - countersunk bolt
              - shoulder bolt
              - precision-fit bolt
              - prevailing-torque or castellated nut
              - Belleville washer
              - oversize/slotted hole
              - sleeved bolt
              - insulated bolt
              tradeoffs:
              - vs tapped screw - needs two-sided access and a nut, but no thread-stripping limit in the part and better for
                weak materials
              - vs rivet/weld/adhesive - removable, but more parts and loosening risk
              - vs insert/rivnut - no installation operation or pull-out mode
              howto:
              - Use ISO 273 normal clearance holes and a flat washer under every turned bearing face.
              - Preload to keep the joint closed so the clamped members carry cyclic load, not the bolt.
              - Check slip, separation, bearing, tear-out, pull-through, thread stripping and fatigue, not only bolt tension.
              - Keep edge distance at least 1.5 d to hole centre as a preliminary rule.
              - Use a large washer, plate, sleeve or compression limiter for soft, printed or composite parts.
              - Put dowels, shoulders or fitted bolts in where transverse load must not slip.
              - Specify lubricant, torque and tightening method together.
              issues:
              - issue: sizing for bolt tensile strength only
                fix: check separation, slip, bearing, tear-out, fatigue
                failure_mode: overload
              - issue: shear carried by bolt in loose clearance hole
                fix: friction preload or fitted bolt/dowel
                failure_mode: wear-fretting
              - issue: joint separates under service load
                fix: more preload, stiffer joint, less eccentricity
                failure_mode: fatigue
              - issue: locknut used to cover inadequate preload
                fix: get preload first then lock
                failure_mode: loosening
              - issue: small washer on soft or printed part
                fix: large washer, plate, sleeve
                failure_mode: creep-preload-loss
              - issue: stainless/carbon steel/aluminium mixed without isolation
                fix: isolate, seal, make fastener cathodic
                failure_mode: galvanic-corrosion
              axes:
                locking: relevant (nut locking; prevailing-torque, wedge, threadlocker; preload first)
                captive: relevant (nut and washer loose; add captive nut or retained washer if inaccessible after assembly)
                corrosion: relevant (galvanic, crevice under washers)
                bearing-face: relevant (washer size and hardness on soft or slotted-hole parts)
                material-direction: relevant for FDM layers and composites under clamp
              rules:
              - id: c1
