            turned-threads:
              id: process/cutting/lathe/turned-threads
              role: leaf
              domain: mech
              scale: macro
              coverage: deep
              summary: Single-point turned threads work best as standard ISO or UNC/UNF forms, modelled as pre-thread diameter,
                with a lead-in chamfer and a 2-3 pitch run-out or relief where the thread meets a shoulder. Engagement length
                is a strength and cost choice (about 1-2D), not a thread-standard value.
              when:
              - 'Prototype, low volume, hard material, large or non-standard threads: single-point cutting'
              - 'Ductile production parts: thread rolling where geometry and grain flow permit'
              avoid_when:
              - 'Weak parent material under repeated assembly: use an insert or through-bolt instead of a cut thread'
              howto:
              - Model an internal thread as its minor (drill) diameter and an external thread as its major diameter; give
                the thread callout separately with standard, class, depth and through/blind.
              - Use a standard metric or UNC/UNF pitch; special pitches add tooling, gauging and inspection.
              - Leave a relief groove 2-3 pitches wide at a shoulder, or stop the thread short of it.
              - Add about 45 degrees x 1 pitch lead-in chamfer at thread starts, internal and external.
              - Prefer through holes; in blind holes leave unthreaded space below the useful thread.
              - Keep engagement near 1-1.5D, up to 2D, and use an insert or through-bolt rather than going deeper in weak
                material.
              - Use a single-point cut for prototypes, hard material, large or odd sizes; consider thread rolling for ductile
                production parts.
              issues:
              - issue: Full helical internal thread modelled in CAD
                fix: Model pilot/minor diameter and give thread callout
                failure_mode: assembly-error
              - issue: Thread runs into a shoulder
                fix: Relief groove, at least 2P run-out, or stop short of the shoulder
                failure_mode: assembly-error
              - issue: No entry chamfer
                fix: About 45 deg x 1P chamfer
                failure_mode: burr
              - issue: Thread depth equal to blind-hole depth
                fix: Only required engagement, leave bottom clearance
                failure_mode: dimensional-error
              - issue: Deep or long slender threaded part chatters
                fix: Shorter reach, centre or steady rest, lower L/D
                failure_mode: dimensional-error
              - issue: Stripped thread in soft parent material
                fix: More engagement only as needed, steel or helical insert, or through-bolt
                failure_mode: overload
              - issue: Fatigue at thread root and abrupt undercut corners
                fix: Standard profile, root radius, relief only as large as needed
                failure_mode: notch
              - issue: Burrs at thread start and end
                fix: Lead-in chamfer, relief, deburr or edge-break note
                failure_mode: burr
              - issue: Residual stress release distorts thin-wall threaded parts
                fix: Rough then finish, support thin sections
                failure_mode: residual-stress
              rules:
