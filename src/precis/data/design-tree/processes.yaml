            bores-and-internal:
              id: process/cutting/lathe/bores-and-internal
              role: leaf
              domain: mech
              scale: macro
              coverage: deep
              summary: 'Internal features are limited by boring-bar overhang, not by the drawing: keep bores near 4x diameter
                or less, use through bores, copy centre holes from DIN 332, and expect a drill point at a blind bottom. Internal
                grooves are often not offered by service bureaus.'
              when:
              - 'Bearing-grade bore finish or roundness: rough bore then ream, hone or grind'
              - 'Non-axisymmetric internal profile: milling, broaching, wire or sink EDM'
              avoid_when:
              - 'Thin-walled tube with most material bored out: consider drawn tube, extrusion or fabrication'
              howto:
              - Prefer through or open-ended bores; if blind, say whether the bottom must be flat rather than a 118 or 135
                degree drill cone.
              - Keep bore depth near 4x diameter; beyond 10x use gun drilling, reaming or honing instead of boring.
              - Size the boring bar as large as bore and chip clearance allow; steel bar reach about 3x bar diameter, carbide
                up to about 8x.
              - Use an internal corner radius that matches a stock insert nose radius (0.4, 0.8 or 1.2 mm), never a sharp
                corner.
              - Replace narrow deep internal grooves with a standard relief, or widen them.
              - Call out DIN 332 centre-hole form and size on long shafts and preserve it through later operations.
              - Distinguish drill, bore, ream and hone on the drawing; add chamfer or radius at bore entry and exit.
              issues:
              - issue: Deep small bore causes bar deflection, taper and bell-mouth
                fix: Larger bore, shorter depth, open one end, bigger or damped bar, or ream/hone/gun-drill
                failure_mode: excess-deflection
              - issue: Blind bore without chip escape
                fix: Through path, chip pocket, through-tool coolant or flat-bottom callout
                failure_mode: dimensional-error
              - issue: Sharp internal shoulder
                fix: Radius compatible with insert or relief groove
                failure_mode: notch
              - issue: Narrow deep internal groove vibrates and packs chips
                fix: Widen, reduce depth, dedicated tool, or standard relief
                failure_mode: dimensional-error
              - issue: Bore treated like a drilled hole
                fix: State drill, bore, ream or hone separately
                failure_mode: dimensional-error
              - issue: Burrs at bore entry, exit and interrupted cuts
                fix: Chamfer or radius, controlled exit, deburr note
                failure_mode: burr
              - issue: Chatter from long flexible bar
                fix: Larger bar, shorter overhang, longer clamp, positive geometry, damped bar
                failure_mode: dimensional-error
              - issue: Missing DIN 332 centre on long shaft
                fix: Specify centre type and size, keep it through later operations
                failure_mode: assembly-error
              - issue: Cutting leaves residual stress in surface layer
                fix: Stress-relieved stock, balanced removal, final light pass
                failure_mode: residual-stress
              - issue: Boring exposes porosity inherited from cast or powder stock
                fix: Wrought stock for sealing parts, porosity limits, machining allowance
                failure_mode: porosity
              rules:
              - id: c1
                text: Protolabs turned envelope approximately 100.33 mm dia x 228.6 mm long; minimum nominal 4.07 mm dia x
