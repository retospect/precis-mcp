            tolerances-and-finish:
              id: process/cutting/cnc-mill/tolerances-and-finish
              role: leaf
              domain: mech
              scale: macro
              coverage: deep
              summary: Default to ISO 2768-m for untoleranced dimensions, give ISO 286 fits (for example H7/g6) only to bores
                and shafts that need them, and call out Ra only on functional faces. Tight tolerance and fine finish are the
                main CNC cost levers; below about Ra 0.8 um move to grinding, honing or lapping.
              when:
              - 'grinding, honing, lapping or EDM: required finish below about Ra 0.8 um, or geometry and tolerance cannot
                be held by milling'
              - 'turning then grinding: cylindrical surfaces with very high finish'
              avoid_when:
              - 'ISO 2768 alone: a bearing bore or any functional fit'
              howto:
              - Write ISO 2768-m in the title block for general tolerances; reserve individual tolerances for interfaces,
                bores, datums and locations.
              - Give functional bores and shafts an ISO 286 fit such as H7/g6, not a general tolerance.
              - Define functional datums A, B, C from the surfaces that locate the part in the assembly, and add a datum scheme
                whenever a tolerance is tight.
              - Use position for hole and pin location, flatness for a single surface, perpendicularity or parallelism to
                a datum, cylindricity for a bore or shaft, profile for contours.
              - State Ra separately (ISO 2768 does not cover roughness) and only on functional surfaces; accept as-machined
                elsewhere.
              - Put critical features in as few setups as possible and give flat clamping surfaces.
              - Use standard metric or UNC/UNF threads.
              issues:
              - issue: One tight tolerance applied to the whole part
                fix: ISO 2768-m for noncritical dimensions; tolerance interfaces individually
                failure_mode: dimensional-error
              - issue: ISO 2768 used for a bearing bore
                fix: Specify an ISO 286 fit such as H7/g6 with datum and finish
                failure_mode: assembly-error
              - issue: Dimensional tolerance without a datum scheme
                fix: Define how the part is located and inspected
                failure_mode: assembly-error
              - issue: Tolerance spanning several setups
                fix: Consolidate features on accessible faces; set tolerance by what the setups can hold
                failure_mode: dimensional-error
              - issue: All faces called cosmetic
                fix: Mark only visible or functional surfaces for blasting, polishing or controlled Ra
                failure_mode: dimensional-error
              - issue: Burrs at tool exits and sharp edges
                fix: Edge breaks, favourable exits, deburring spec; protect sealing edges from uncontrolled manual deburring
                failure_mode: burr
              - issue: Chatter and deflection on slender tools or thin walls
                fix: Bigger cutter, shorter stick-out, stiffer fixture, light finish cuts
                failure_mode: excess-deflection
              - issue: Stock stress and warpage after unclamping
                fix: Stress-relieved stock, rough-relax-finish, balanced removal, inspect after unclamping
                failure_mode: residual-stress
              - issue: Thermal growth, tool wear and fixture movement lose accuracy
                fix: Define inspection temperature, use probing and tool-life control, avoid needless tight limits
                failure_mode: dimensional-error
              - issue: Sharp inside corners and tool marks across a fatigue load path
                fix: Generous fillets, smooth transitions, orient marks away from peak tension
                failure_mode: notch
              - issue: Cast or sintered stock exposes pores when machined
                fix: Use billet for pressure- or fatigue-critical parts, keep seal faces off cast skin
                failure_mode: porosity
              rules:
              - id: c1
                text: 'ISO 2768-1 class m sets general linear tolerances for untoleranced machined dimensions;
                  the deviation table is iso_2768_1.json'
                source_url: https://www.eurotools.eu/sub/eurotools.eu/images/downloads/General_Tolerance_Standard_ISO-2768-1pdf.pdf?17247513
                source_quality: primary
