        extrusion-profile:
          id: process/forming/extrusion-profile
          role: process
          domain: mech
          scale: macro
          coverage: shallow
          equipment: bought
          summary: Constant-section aluminium profiles pushed through a die. Walls from about 1.0 to 1.5 mm, adjacent walls
            within about 3:1, recesses no deeper than about 3x their opening, radii of at least 0.4 to 0.5 mm. Tolerances
            come from EN 755-9 by circumscribing circle, not ISO 2768. Standard catalogue profile first, custom die when it
            removes parts.
          when:
          - long constant cross-section with integrated channels, T-slots or hollows
          - a catalogue profile can meet the envelope, load and interfaces (no die cost)
          - custom die pays back by replacing several machined or assembled parts at volume
          avoid_when:
          - 'geometry changes along the length or needs 3D pockets: machine, cast or print'
          - 'very low quantity needing custom section: die cost and minimum order (about 300 to 1000 kg) dominate'
          - 'tight tolerance over the whole section: machine the functional faces'
          variants:
          - solid die
          - semi-hollow die (tongue ratio matters)
          - hollow porthole or bridge die with weld seams
          - standard catalogue profile versus custom
          tradeoffs:
          - Die cost roughly 400 to 2000 USD or more, hollow dies about 4000 USD or more; supplier quotes vary widely.
          - Complex hollows slow the press and add weld-seam risk.
          - Secondary machining adds cost but is the route to tight datums.
          howto:
          - Start thin walls at 1.0 to 1.5 mm and increase for larger circumscribing circle, hard alloys and hollows.
          - Keep wall ratio at or below about 3:1 and blend thick to thin with radii.
          - Limit recess depth to about 3x opening width; avoid high tongue ratios.
          - Use internal radii of 0.5 to 1.0 mm and external radii of at least 0.38 mm.
          - Make the section symmetric about the centroid; use ribs instead of bulk bosses.
          - Take tolerances from EN 755-9 tables by H and circumscribing circle, and name edition, alloy, temper and wall
            category A, B or C.
          - Extrude the constant envelope and drill, saw or machine features afterwards.
          issues:
          - issue: Deep narrow tongue deflects or breaks the die and does not fill
            fix: Open the gap, reduce depth to about 3:1, add a web or use a hollow bridge die
            failure_mode: overload
          - issue: Asymmetric or thick-thin section twists and bows
            fix: Balance masses and walls, graded transitions
            failure_mode: warpage
          - issue: Sharp corners concentrate stress and wear the die
            fix: Radius at least 0.5 mm internal
            failure_mode: notch
          - issue: Residual stress from quench distorts on cutting or machining
            fix: Equal walls, controlled cooling, straighten or stress-relieve
            failure_mode: residual-stress
          - issue: Properties differ along and across the extrusion direction
            fix: Align extrusion axis with main load, specify alloy, temper and test direction
            failure_mode: anisotropy
          - issue: Porthole die weld seams and charge welds are weaker
            fix: Avoid multi-void sections, keep charge weld out of critical cuts, inspect critical welds
            failure_mode: porosity
          - issue: Blisters or trapped gas from billet contamination
            fix: Clean homogenised billet, control temperature and speed
            failure_mode: porosity
          - issue: Heavy local pads cause depressions and distortion
            fix: Replace bulk with ribs or hollow the pad
            failure_mode: sink
          - issue: Over-tight tolerance everywhere raises die correction and scrap
            fix: Apply EN 755-9 by default and machine functional datums
            failure_mode: dimensional-error
