      children:
        heat-treatment:
          id: process/property-change/heat-treatment
          role: process
          domain: mech
          scale: macro
          coverage: shallow
          equipment: any
          summary: Heat treatment sets hardness, toughness and residual stress, and moves dimensions. The drawing must state
            the condition, hardness with test location, case depth with its criterion, protected areas, and whether dimensions
            apply before or after treatment and grinding.
          when:
          - steel part needs strength (quench and temper), a hard wear surface over a tough core (carburise, induction), or
            a thin hard low-distortion skin (nitride)
          - aluminium 6xxx or 7xxx part needs T6 strength; plate or thick bar for precision machining needs T651
          avoid_when:
          - tight final tolerance with no grinding stock on a quenched or carburised part
          - sharp internal corners or abrupt thickness changes on a quenched part
          variants:
          - Through harden and temper (about 30-50 HRC)
          - Carburise, quench, temper (case 58-64 HRC)
          - Gas or plasma nitriding (spec in HV or HK)
          - Induction hardening (selective, 48-60 HRC)
          - Aluminium T6 and stress-relieved T651
          tradeoffs:
          - Nitriding distorts least (no quench) but is thin; carburising and induction give deeper case but need grinding
            stock
          - 'Through hardening is limited by hardenability: plain carbon steel only to a few mm, alloy steel to tens of mm'
          - T651 costs more than T6 but cuts machining warp
          howto:
          - 'Specify condition and acceptance numbers, not just ''hardened'': hardness range, test location and method'
          - For case hardening give effective case depth with its limiting hardness (for example 550 HV), surface and core
            hardness
          - Spec nitrided hardness in HV or HK, with total depth and compound-layer limit
          - 'Sequence: rough machine, stress relieve, semi-finish, heat treat, grind to size; state which dimensions apply
            when'
          - Show masked or untreated areas (threads, datum bores, seal lands) with a clear boundary, per ISO 15787 conventions
          - Fillet inside corners, smooth thickness changes, uniform stock; ask the heat treater for the mildest quenchant
          - Call out the full spec (AMS 2759 sub-part for steel, AMS 2770 for wrought aluminium) and the temper, using T651
            for plate
          issues:
          - issue: Quench cracking at sharp corners, thin-to-thick transitions, holes near edges
            fix: Generous fillets, even sections, relief grooves, milder quench, temper immediately
            failure_mode: brittle-fracture
          - issue: Size change and distortion with no grinding stock
            fix: Leave stock and grind after treatment; capability study on coupons
            failure_mode: dimensional-error
          - issue: Decarburised skin in air-atmosphere hardening
            fix: Vacuum or controlled atmosphere, or leave stock to remove it
            failure_mode: dimensional-error
          - issue: Hardness given as HRC on thin nitrided layer
            fix: Specify HV or HK with test load
            failure_mode: assembly-error
          - issue: Grinding past the effective case
            fix: Limit stock; check case depth after grinding
            failure_mode: wear-fretting
          - issue: Grinding heat tempers or cracks the hardened surface
            fix: Gentle grinding practice and inspection
            failure_mode: residual-stress
          - issue: Aluminium T6 plate warps when one side is machined away
            fix: Order T651, rough machine, let it relax, balance stock, finish
            failure_mode: warpage
          - issue: Core softened by nitriding at a temperature above the earlier tempering
            fix: Temper the core above the nitriding temperature
            failure_mode: softening
