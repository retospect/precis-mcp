            cross-features:
              id: process/cutting/lathe/cross-features
              role: leaf
              domain: mech
              scale: macro
              coverage: deep
              summary: 'Design turned parts round-first: put axial and radial holes, flats and DIN 82 knurls where the driven
                tool can reach them, use standard knurl pitches, and call out edge break and burr limits wherever a cross
                hole meets a bore. Live tooling saves a setup but is not automatically cheaper than a second operation on
                a mill.'
              when:
              - 'Mostly rotational part with a few flats, slots, keyways or radial holes and a critical datum: live tooling
                or mill-turn in one chucking'
              - 'Broad pockets, 3D contours or long slender part needing a milling fixture: turn, then mill in a second operation'
              avoid_when:
              - 'High-volume simple bar-fed parts: screw machine; prismatic parts: machining centre'
              howto:
              - Keep cross holes parallel or perpendicular to the turning axis unless the supplier confirms angled access.
              - 'Make holes large and shallow enough for the driven tool: axial hole at least 1 mm and to about 6x diameter,
                radial hole at least 2 mm.'
              - Leave at least 0.5 mm wall around cross holes and slots.
              - Specify knurls by DIN 82 pattern, pitch and finished major diameter; the pre-knurl diameter must be smaller.
              - At a cross hole into a bore, state the allowed edge break or no hanging burr, and give deburr access.
              - Dimension a chamfer on a cylindrical surface by angle and minor diameter, not as a flat countersink.
              - Keep wide or deep flats and pockets for a mill; use mill-turn only for a few flats, slots or holes.
              issues:
              - issue: Sharp internal corner at a flat or slot
                fix: Largest practical fillet or corner relief
                failure_mode: notch
              - issue: Cross hole too small or deep for driven tool
                fix: Increase diameter, reduce depth, short drill, or axial/radial approach
                failure_mode: dimensional-error
              - issue: Cross hole near edge, thin wall or small diameter
                fix: Increase wall, move hole, add boss or flat
                failure_mode: overload
              - issue: Hanging burr where a radial hole meets a bore
                fix: No-burr or edge-break requirement, back-chamfer, brush or orbital deburring, inspect the intersection
                failure_mode: burr
              - issue: Knurl pitch given without pattern or finished OD
                fix: DIN 82 pattern, pitch, finished major diameter and tolerance
                failure_mode: dimensional-error
              - issue: Knurling cracks brittle or hardened material or swells thin walls
                fix: Ductile condition, suitable pitch, relief or run-out, check finished OD
                failure_mode: brittle-fracture
              - issue: Wide or deep flats too large for turret tool
                fix: Narrow the flat, split the operation, or move it to a mill
                failure_mode: dimensional-error
              - issue: Angled hole on a basic live-tool lathe
                fix: Make it axial or radial, or add Y-axis or a milling setup
                failure_mode: assembly-error
              - issue: Cross holes and flats act as fatigue initiators
                fix: Radii, chamfers, relief grooves, generous ligament; avoid holes at shoulders or groove roots
                failure_mode: fatigue
              - issue: Cutting leaves residual stress in thin or heat-treated sections
                fix: Balanced removal, support thin walls, finish critical geometry after treatment
                failure_mode: residual-stress
              - issue: Bar stock directionality weakens a small section at a cross hole
                fix: Align the critical load with stock direction
                failure_mode: anisotropy
              - issue: Cross hole exposes porosity or inclusions in cast or powder stock
                fix: Certified wrought bar for pressure or fatigue parts, NDT or pressure test
                failure_mode: porosity
