        lathe:
          id: process/cutting/lathe
          role: process
          domain: mech
          scale: macro
          coverage: deep
          equipment: lathe
          def: turning on a manual or CNC lathe, including live-tooling cross features
          children:
            diameters-and-tolerances:
              id: process/cutting/lathe/diameters-and-tolerances
              role: leaf
              domain: mech
              scale: macro
              coverage: deep
              summary: Turned diameters hold roughly +-0.05 to +-0.13 mm as a service-bureau default; true fit-class work
                (h6, g6, k6) needs finish turning in one setup or grinding. Size tolerance says nothing about roundness or
                concentricity, so those need their own ISO 1101 callouts.
              howto:
              - Toleranced only the few functional diameters; leave everything else to ISO 2768 and name the class on the
                drawing.
              - Write fit-critical pairs as a full ISO 286 pair (for example 20 H7/g6), not as a plus/minus value.
              - Machine mating diameters and their datum in one setup (soft jaws or collet); add roundness, cylindricity and
                coaxiality callouts per ISO 1101.
              - Reserve grinding, honing or superfinish for bearing, seal and long-shaft seats; rough-turn before heat treatment
                and leave grind stock.
              - Call out Ra only on sealing, sliding or cosmetic surfaces; ordinary turned finish is Ra 0.8-3.2 um.
              - Use a 45 degree chamfer on outside edges and a radius matching the insert nose on inside corners.
              issues:
              - issue: Tight tolerance or h6 applied to every diameter
                fix: Tolerance only functional features; ISO 2768 for the rest, grinding only on the few critical seats
                failure_mode: dimensional-error
              - issue: Diameter tolerance assumed to guarantee roundness or concentricity
                fix: Add ISO 1101 roundness, cylindricity and datum-based coaxiality; machine coaxial surfaces in one setup
                failure_mode: dimensional-error
              - issue: Tight fit split across several chuckings
                fix: One setup, soft jaws or collet, one datum axis
                failure_mode: dimensional-error
              - issue: Sharp internal shoulder the insert cannot form
                fix: Radius equal to insert nose radius or a relief groove
                failure_mode: notch
              - issue: Long thin shaft deflects and goes tapered or barrel-shaped
                fix: Shorten overhang, enlarge diameter, add tailstock or steady rest
                failure_mode: dimensional-error
              - issue: Chuck distortion and clamping stress give poor roundness
                fix: Collet or soft jaws, lower clamp force, finish pass in one setup
                failure_mode: residual-stress
              - issue: Burrs at grooves, cross holes and shoulders
                fix: Edge-break note, deburring access, keep burrs off seals and bearing seats
                failure_mode: burr
              - issue: Wrought bar is directional and turning does not remove that
                fix: Specify bar condition and align the principal load; avoid assuming equal radial and axial properties
                  in fatigue
                failure_mode: anisotropy
              - issue: Heat treatment distorts finished fit surfaces
                fix: Rough-machine first, leave grind stock, finish fits after hardening
                failure_mode: residual-stress
