            warping-and-first-layer:
              id: process/additive/desktop-fdm/warping-and-first-layer
              role: leaf
              domain: mech
              scale: macro
              coverage: deep
              summary: 'Warping and corner lift come from thermal contraction in constrained layers; ABS, ASA and nylon are
                the worst, PLA and PETG mild. Design out with rounded plan corners, small flat footprints, ribs instead of
                mass, a bed-edge chamfer, a brim, and an enclosure for high-shrink materials. Note: the answer drifted into
                general FDM DFM (walls, holes, overhangs) and says little numeric about shrinkage percentages.'
              when:
              - 'enclosure: material is ABS, ASA, nylon or PC (stable warm ambient needed)'
              - 'open frame is fine: material is PLA or PETG, which want strong part cooling'
              avoid_when:
              - 'large flat uniform plate in ABS/ASA/nylon with no ribs or split: warps even with good bed adhesion'
              - tight-fit base that must mate a pocket with no first-layer compensation
              howto:
              - Round the plan-view corners of large footprints and chamfer the bottom edge instead of leaving a sharp edge
                on the bed.
              - Prefer ribs and hollowed sections to thick solid masses; change wall thickness gradually.
              - Keep a small footprint under tall parts only with a brim or tabs; split very large flat parts into panels.
              - For ABS, ASA and nylon use an enclosure, no drafts, brim or draft shield; place large flats near bed centre.
              - 'Fix a big elephant foot at its cause first: lower nozzle temperature 5-10 C and level the bed, then add slicer
                compensation.'
              - Dry nylon and PETG before printing and measure nylon parts after conditioning.
              issues:
              - issue: Large sharp rectangular footprint lifts at the corners
                fix: Add plan-view radii, chamfer the lower edge, reduce footprint or split the part, add a brim
                failure_mode: warpage
              - issue: Large uniform flat plate in ABS/ASA/nylon warps despite good adhesion
                fix: Ribs, relieved underside, thinner section, split into panels, enclosure, or change process
                failure_mode: warpage
              - issue: Brim used to mask poor bed adhesion tears away
                fix: Clean and level the bed, control temperature and drafts, then brim of at least 3 mm if geometry still
                  needs it
                failure_mode: warpage
              - issue: Elephant foot makes the base too big for a mating pocket
                fix: Correct first-layer squish, lower temperature 5-10 C, then compensate about 0.2 mm on a 0.4 mm nozzle;
                  chamfer the bottom edge
                failure_mode: dimensional-error
              - issue: Abrupt thick-to-thin transitions cool unevenly and sink
                fix: Rib instead of solid mass, hollow thick regions, gradual transitions
                failure_mode: sink
              - issue: Residual stress in high-shrink materials
                fix: Stable enclosure, rounded corners, ribs, uniform walls, avoid drafts
                failure_mode: residual-stress
              - issue: Wet nylon or PETG prints with weak layers and dimensional drift
                fix: Dry and store filament; dimension nylon parts after conditioning
                failure_mode: environmental-degradation
              - issue: Sharp internal corners concentrate stress
                fix: Add internal fillets
                failure_mode: notch
              - issue: Weak Z direction
                fix: Orient principal load along XY, more perimeters, larger fillets, fasteners instead of Z-tension features
                failure_mode: anisotropy
