            strength-and-infill:
              id: process/additive/desktop-fdm/strength-and-infill
              role: leaf
              domain: mech
              scale: macro
              coverage: deep
              summary: 'Strength comes from perimeters and print orientation, not infill percentage: use 3-4 perimeters, 10-15%
                infill (rarely over 30%), keep the main load in the XY plane, add fillets and ribs, and consider annealing
                only where dimension change is acceptable. The answer gives no universal top/bottom layer count.'
              when:
              - 'tensile, bending, impact load: raise perimeters, orient load along roads'
              - 'compression or top-skin support: raise infill'
              - 'anneal: PLA, ABS, ASA and PA-type parts where shrinkage and warp are acceptable'
              avoid_when:
              - annealing large thin parts or PETG and PC (generally not recommended, warp risk)
              - 'safety- or fatigue-critical load across Z layers: use machining, moulding, SLS/MJF'
              - 0% infill except where geometry closes gradually
              howto:
              - Choose print orientation first so the main load runs in XY along continuous perimeters.
              - Use 3-4 perimeters for functional or watertight walls; add perimeters before infill.
              - Start at 10-15% infill; rarely exceed 30%.
              - For bending put material far from the neutral axis (deeper section, ribs, box section) rather than raising
                infill.
              - Use large bosses, fillets, washers or inserts for fasteners; keep holes 1.5-2 x wall thickness from edges.
              - Keep layer height at most about 60-65% of nozzle width; 0.15 mm for durability, 0.20 mm general.
              - Print test coupons in the intended orientation for critical strength.
              - If annealing, use staged heating, fixture the part and compensate for shrinkage.
              issues:
              - issue: Raising infill while leaving one or two weak perimeters
                fix: Add perimeters, orient shell into load path, then tune infill
                failure_mode: overload
              - issue: Load across Z layer interfaces
                fix: Reorient, split and fasten, or change process or material
                failure_mode: anisotropy
              - issue: Hole beside an edge or inside thin boss tears
                fix: Thicker boss and edge, fillet, move hole inward, washer or metal insert
                failure_mode: overload
              - issue: Sharp internal corners crack
                fix: Generous fillets and curved transitions
                failure_mode: notch
              - issue: Gaps between roads and incomplete fusion
                fix: Dry filament, tune extrusion and temperature, more shell and overlap
                failure_mode: porosity
              - issue: Uneven cooling and contraction
                fix: Chamber or bed temperature control, round corners, brim, avoid abrupt sections, anneal if acceptable
                failure_mode: residual-stress
              - issue: Large flat footprints warp
                fix: Radiused corners, ribs, brim, enclosure, different orientation
                failure_mode: warpage
              - issue: Sagging roof over sparse infill
                fix: More top layers, local infill, ribs, shorter span, arched roof
                failure_mode: sink
              - issue: Elephant foot, burrs, support scars
                fix: Chamfer bed edge, calibrate first-layer flow, orient cosmetic faces away from supports
                failure_mode: burr
              - issue: Annealing distorts large thin parts
                fix: Staged heating, fixtures, symmetric geometry, dimensional compensation
                failure_mode: dimensional-error
              - issue: Dimensional drift from shrinkage and calibration
                fix: Calibration coupon, oversize holes, assembly clearance
                failure_mode: dimensional-error
              - issue: Brittle PLA used for impact or fatigue
                fix: PETG, nylon, ASA or suitable PC; round transitions
                failure_mode: brittle-fracture
              rules:
              - id: c1
                text: With a 0.4 mm nozzle walls are about 0.45, 0.90, 1.35, 1.80 mm for 1-4 perimeters; use at least two
                  nozzle widths for reliable walls
                value: 0.45; 0.90; 1.35; 1.80
                unit: mm
                source_url: https://help.prusa3d.com/article/modeling-with-3d-printing-in-mind_164135
                source_quality: primary
                equipment: desktop-fdm
                confidence: handbook
              - id: c2
                text: Robust structural walls about 1.2-1.5 mm or more
                value: 1.2-1.5
                unit: mm
                source_url: https://www.xometry.com/resources/3d-printing/mini-guide-fdm-3d-printing/
                source_quality: primary
                equipment: industrial-fdm
                confidence: handbook
