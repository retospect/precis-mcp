        grinding:
          id: process/cutting/grinding
          role: process
          domain: mech
          scale: macro
          coverage: shallow
          equipment: any
          summary: 'Abrasive finishing for hardened or precision surfaces: cylindrical, internal and surface grinding hold
            about IT5 to IT7 and Ra 0.1 to 0.8 um where turning or reaming cannot. It costs setup, stock and cycle time, so
            use it only on the functional fit surfaces.'
          when:
          - material is hardened above about 58 HRC and a fit surface must be sized after heat treatment
          - bearing seats at IT5 to IT6, or housing bores H6 to H7, with roundness and finish requirements
          - Ra of about 0.8 um or finer on a shaft or seal seat
          avoid_when:
          - 'ordinary H7 bore in soft steel or aluminium: reaming, boring or finish turning is cheaper'
          - 'Ra finer than about 0.4 um is needed: hone, lap or superfinish instead'
          - deep small bore with poor coolant access
          - thin, flexible or asymmetric parts that distort on a magnetic chuck
          variants:
          - cylindrical OD grinding between centres or chucked
          - internal (ID) grinding
          - surface grinding on a magnetic chuck
          - centreless grinding for high-quantity rotational parts
          tradeoffs:
          - Tighter IT grade and lower Ra mean more passes, spark-out, dressing and inspection.
          - Hard turning or EDM can replace grinding on moderate geometry or awkward hardened features.
          - Grinding sits after heat treatment, so it needs stock and a relief at every ground shoulder.
          howto:
          - Specify the fit with ISO 286 designations (for example H7/h6) and add roundness, cylindricity and runout against
            datums.
          - Rough machine, heat treat, then grind only the critical diameters; leave 0.05 to 0.30 mm per side as an opening
            stock for hardened steel.
          - Add a grinding relief at every ground shoulder (DIN 509 form E or F) and a radius the wheel can reach.
          - Provide 60 degree centre holes (DIN 332) for between-centres grinding.
          - Ask for the finest Ra the function needs, not the finest available; 0.4 to 0.8 um is the economical band.
          - Keep slender shafts supported and avoid plates thinner than about 3 mm on a magnetic chuck.
          - Call out lay direction and measurement method for seal surfaces, and say whether coating is applied before or
            after grinding.
          issues:
          - issue: Grinding burn re-hardens or softens the surface and leaves tensile stress and cracks
            fix: Sharp dressed wheel, coolant into the gap, light infeed, enough stock
            failure_mode: residual-stress
          - issue: Thin plate springs back after magnetic-chuck grinding
            fix: Symmetric roughing, stress relief, balanced light passes, inspect free state
            failure_mode: warpage
          - issue: No relief at a shoulder so the wheel runs into the corner
            fix: DIN 509 undercut sized to the wheel
            failure_mode: notch
          - issue: Size tolerance given but no roundness or runout
            fix: Add geometric tolerances against functional datums
            failure_mode: dimensional-error
          - issue: Chatter, lobing and taper on slender shafts
            fix: Centres, steady rest, shorter span, dressed wheel
            failure_mode: dimensional-error
          - issue: Grinding before heat treatment, so distortion undoes the size
            fix: Grind after heat treat and stabilisation
            failure_mode: dimensional-error
          - issue: Burr or sharp edge at shoulder exits and sharp grinding scratches cut fatigue life
            fix: Edge break, accessible radii, lay oriented to load
            failure_mode: fatigue
