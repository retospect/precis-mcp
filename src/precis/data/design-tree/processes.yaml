            walls-and-min-features:
              id: process/additive/desktop-fdm/walls-and-min-features
              role: leaf
              domain: mech
              scale: macro
              coverage: deep
              summary: 'Wall thickness on a 0.4 mm nozzle is built from whole perimeters of about 0.45 mm: one is the printable
                floor, 0.8 to 1.0 mm is the practical minimum, 1.2 to 1.5 mm for load. Small pins, text and gaps have their
                own minimums; perimeters buy more strength than infill.'
              howto:
              - 'Build walls from whole perimeters: about 0.45 mm per perimeter on a 0.4 mm nozzle, 2 to 3 perimeters (0.8
                to 1.0 mm) for ordinary walls.'
              - Match CAD wall thickness to the slicer's actual perimeter width and overlap rather than an arbitrary round
                number.
              - Make load-bearing pins at least 5 mm, or use a printed hole with a separate metal pin and add a base fillet.
              - Keep text strokes and relief at 1 mm or more, bold, on the XY plane.
              - For watertight shells use 3 to 4 perimeters, not infill.
              - Raise perimeters first, then infill; use ribs and gussets instead of solid blocks.
              - Fillet internal corners and boss bases; chamfer bed-facing edges instead.
              issues:
              - issue: Wall thinner than one extrusion width
                fix: At least one perimeter; 0.8-1.0 mm for a robust wall
                failure_mode: dimensional-error
              - issue: Pins under 5 mm are perimeter-only and break in bending
                fix: Pin at least 5 mm, base fillet, or separate metal pin
                failure_mode: overload
              - issue: Zero-clearance mating parts
                fix: About 0.3 mm for moving fits, tuned by coupon
                failure_mode: assembly-error
              - issue: Tiny condensed text
                fix: Bold, wide lettering, strokes about 1 mm or more, text in XY
                failure_mode: dimensional-error
              - issue: Thick solid block where shell and ribs would do
                fix: More perimeters locally, ribs, less infill
                failure_mode: sink
              - issue: Sharp internal corners and boss bases
                fix: Fillets or gussets; chamfer on bed-facing overhangs
                failure_mode: notch
              - issue: Large thin unsupported walls warp
                fix: Ribs, corner radii, edge supports or reorientation
                failure_mode: warpage
              - issue: Load across layers delaminates
                fix: Put load path in XY, more perimeters
                failure_mode: anisotropy
              - issue: Leaks through walls
                fix: Calibrated extrusion, 3-4 perimeters, flow +5-10 percent only after calibration
                failure_mode: porosity
              rules:
              - id: c1
                text: Common desktop nozzle is 0.4 mm
                value: '0.4'
                unit: mm
                source_url: https://help.prusa3d.com/article/modeling-with-3d-printing-in-mind_164135
                source_quality: primary
                equipment: desktop-fdm
                confidence: handbook
