            text: External draft usually 3 to 7 degrees finished, 7 to 10 degrees for blockers; ferrous hammer forging needs
              5 degrees or more
            value: 3-7; 7-10; 5
            unit: deg
            source_url: https://www.forging.org/Common/Uploaded%20files/Design%20Engineering%20Center/Product%20Design%20Guide%20for%20Forging.pdf
