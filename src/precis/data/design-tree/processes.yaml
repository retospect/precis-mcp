            holes-and-threads:
              id: process/cutting/cnc-mill/holes-and-threads
              role: leaf
              domain: mech
              scale: macro
              coverage: deep
              summary: Drill standard sizes to about 4 diameters deep, thread no deeper than 3 diameters with engagement of
                1.5 to 2 diameters, and leave room for the drill point and tap lead in blind holes. Choose tapping for speed,
                thread milling for large, blind or scrap-sensitive holes.
              when:
              - 'tapping: moderate-size common threads, tap-friendly material, speed matters'
              - 'thread milling: large, blind or hard-to-tap holes, or when scrapping the part is expensive'
              - 'end-mill interpolation: nonstandard diameters, shallow holes, flat bottoms'
              avoid_when:
              - 'tapping: blind hole in an expensive part (a broken tap can scrap it)'
              - 'drilling: a flat-bottom hole is needed'
              variants:
              - drilled hole
              - interpolated hole
              - tapped thread
              - thread-milled thread
              - counterbore
              howto:
              - Use standard drill diameters; for nonstandard holes step 0.1 mm up to 10 mm and 0.5 mm above.
              - Keep hole depth near 4 diameters; past about 6 diameters plan for access from both sides or a deep-hole process.
              - In blind holes leave room for the conical drill point, or specify an end-milled flat bottom.
              - Thread engagement 1.5 to 2 times nominal diameter; do not exceed about 3 times.
              - Leave an unthreaded relief below the thread for tap lead, thread-mill runout and chips.
              - Prefer standard coarse metric threads, M6 or larger where space allows.
              - Show internal threads as cosmetic annotation and give designation, class and depth on the drawing.
              - For counterbores give diameter, depth, pilot diameter and pilot or thread depth.
              - Add a 45 degree chamfer on outside edges rather than a cosmetic radius.
              issues:
              - issue: Blind hole depth ignores the drill point
                fix: Add point relief, make it a through hole, or specify an end-milled flat bottom
                failure_mode: assembly-error
              - issue: Excessively deep holes
                fix: Stay near 4 diameters; two-sided access, larger diameter or deep-hole drilling
                failure_mode: dimensional-error
              - issue: Thread deeper than needed
                fix: 1.5 to 2 diameters engagement, at most about 3
                failure_mode: overload
              - issue: Full thread to the bottom of a blind hole
                fix: Add unthreaded relief
                failure_mode: assembly-error
              - issue: Tap breakage or torn threads in small or blind holes
                fix: Standard coarse thread, shorter depth, relief, lubricant, thread milling or a threaded insert
                failure_mode: assembly-error
              - issue: Helical threads modelled in CAD
                fix: Cosmetic thread plus drawing callout
                failure_mode: assembly-error
              - issue: Counterbore called out without all dimensions
                fix: Give diameter, depth, pilot diameter, pilot depth
                failure_mode: assembly-error
              - issue: Hole exits leave burrs
                fix: Edge-break requirement, deburring operation, orient exits away from critical faces
                failure_mode: burr
              - issue: Sharp inside corners and abrupt geometry raise stress
                fix: Fillets, corner relief, smooth transitions
                failure_mode: notch
              - issue: Thin tall walls near holes flex
                fix: Thicken, shorten, add ribs, machine in several operations
                failure_mode: warpage
              - issue: Stock stress release distorts thin walls or deep pockets
                fix: Stress-relieved stock, symmetric roughing, finish pass
                failure_mode: residual-stress
