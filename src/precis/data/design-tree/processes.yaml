        die-casting:
          id: process/primary-shaping/die-casting
          role: process
          domain: mech
          scale: macro
          coverage: shallow
          equipment: cast
          summary: Molten aluminium (cold chamber) or zinc (hot chamber) is injected at high pressure into a steel die. Gives
            thin, repeatable, near-net parts at high volume; the price is die cost, gas and shrinkage porosity, and as-cast
            tolerances that need ISO 8062 or NADCA grades rather than ISO 2768.
          when:
          - high volume thin-walled metal parts where the die cost is amortised
          - zinc for the thinnest walls, finest detail and fastest cycles
          - aluminium for light, stiffer housings and heat sinks
          avoid_when:
          - one-off or low volume (CNC machining, gravity or sand casting)
          - pressure-tight or heat-treatable structural parts without extra measures (low-pressure or gravity casting)
          - thick sections above about 6 mm or heavy machining that would expose porosity
          - wrought-alloy properties such as 6061-T6 are required
          variants:
          - cold-chamber aluminium vs hot-chamber zinc
          - vacuum-assisted high-pressure die casting for lower porosity
          - low-pressure and gravity die casting as alternatives for thicker or heat-treatable parts
          tradeoffs:
          - zinc fills thinner walls with less draft than aluminium
          - ejector pins, slides and undercuts add tool cost and maintenance
          - secondary machining, impregnation, plating and leak testing can exceed the casting cost
          - gas porosity can block conventional solution heat treatment of HPDC aluminium
          howto:
          - design thin, uniform walls (aluminium commonly 1.5-4 mm, zinc 1.0-2.5 mm) and core out heavy sections
          - keep wall variation within about +-10% and transitions gradual
          - draft outside faces 1-2 deg (zinc down to 0.5-1 deg), cores about 2 deg up to 5 deg when deep
          - ribs 0.5-0.7 times wall, height up to about 3 times wall, 1-3 deg draft per side
          - fillet internal corners at least 0.5 mm and tee roots about 1-1.25 times the thin wall
          - allow 0.25-0.5 mm machining stock only where needed so the dense skin is kept
          - reserve flat ejector pads and keep sealing faces off the parting line
          - toleranced per ISO 8062 or NADCA; machine critical datums, bores and sealing faces
          issues:
          - issue: heavy sections and thick bosses give shrinkage porosity and sink
            fix: core out, use uniform walls and ribs, keep isolated sections under about 6 mm
            failure_mode: porosity
          - issue: rib as thick as the wall causes sink
            fix: rib thickness 0.5-0.7 times wall with root fillet
            failure_mode: sink
          - issue: entrained air and turbulence give gas porosity and blisters on heat treatment
            fix: smooth flow paths, overflows, vacuum or venting; keep pressure-critical zones away from final fill
            failure_mode: porosity
          - issue: uneven cooling and asymmetric walls warp the casting
            fix: balance wall layout, symmetric ribs, avoid one-sided heavy bosses
            failure_mode: warpage
          - issue: sharp internal corners and abrupt section changes start cracks
            fix: radius about 1-1.25 times the thin wall at tee junctions, gradual transitions
            failure_mode: notch
          - issue: flash and burrs at the parting line, slides and gates
            fix: keep sealing and bearing surfaces away from the parting line, define trim zones
            failure_mode: burr
          - issue: machining too deep exposes porous material below the skin
            fix: smallest practical stock or move the datum
            failure_mode: porosity
          - issue: directional filling and porosity make properties flow-direction dependent
            fix: align gates and ribs with principal loads and test fatigue and impact in the real orientation
            failure_mode: anisotropy
          - issue: unequal cooling and ejection leave residual stress
            fix: uniform sections, balanced geometry, controlled die cooling
            failure_mode: residual-stress
          - issue: ISO 2768 applied to raw cast surfaces gives unachievable tolerances
            fix: specify ISO 8062 grades or NADCA tolerances and machine functional features
            failure_mode: dimensional-error
          rules:
          - id: c1
            text: NADCA broad die-casting wall range 1.016-5.08 mm depending on alloy, size and application
            value: 1.016-5.08
            unit: mm
            source_url: https://caldiecast.com/wp-content/uploads/2021/07/NADCA-Engineering-and-Design-Information_IN-2722.pdf
            source_quality: primary
            equipment: cast
            confidence: standard
          - id: c2
            text: zinc wall 0.5 mm small areas, 1.0-1.5 mm medium, 1.5-2.0 mm large
            value: 0.5 / 1.0-1.5 / 1.5-2.0
