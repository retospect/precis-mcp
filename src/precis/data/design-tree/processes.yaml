        laser-cutting:
          id: process/cutting/laser-cutting
          role: process
          domain: mech
          scale: macro
          coverage: shallow
          equipment: sheet
          summary: Laser cutting profiles sheet metal, acrylic and plywood quickly with no tooling. Feature minimums scale
            with sheet thickness (hole, slot and web about one thickness), kerf must be compensated on mating tabs and slots,
            and the cut edge carries heat-affected zone, dross and some residual stress.
          when:
          - flat sheet profiles in small to medium quantity, no tooling cost
          - tab and slot assemblies in plywood or acrylic
          - thin to medium metal sheet, 0.5-10 mm, before bending
          avoid_when:
          - many repeated round holes at high volume (punching cheaper)
          - heat-sensitive or distortion-critical thin parts (waterjet)
          - precision bores or bearing seats (drill and ream)
          - 3D pockets (milling) or very high volume (stamping)
          variants:
          - fiber laser for metal; CO2 or diode desktop machines for wood, acrylic, paper and thin plastics
          - assist gas oxygen (more energy, oxidised edge) versus nitrogen or air (cleaner edge)
          tradeoffs:
          - 'vs waterjet: faster and finer, but has HAZ and thickness limits'
          - 'vs punching: no tooling, but pierce count drives time and tolerance is looser than drilled holes'
          - 'vs CNC routing: finer detail and no tool radius, but charring on thick wood'
          howto:
          - Make holes and slots at least one sheet thickness (production minimum about 0.5 times) and webs at least one thickness.
          - Offset mating tabs and slots by half the measured kerf per side; cut a fit coupon per material batch.
          - Keep holes 1.5-2 thicknesses from edges and well spaced; use internal radii of at least thickness for loaded corners.
          - Convert strokes and text to closed outlines; put lead-ins and pierces in scrap.
          - Undersize critical holes by about 0.005 in and post-drill.
          - Hold large thin outlines with micro-tabs and cut interior features first.
          issues:
          - issue: hole smaller than sheet thickness
            fix: enlarge to the thickness rule or drill and ream after cutting
            failure_mode: dimensional-error
          - issue: web or tab narrower than kerf burns away
            fix: widen web, reduce adjacent cuts, add a bridge
            failure_mode: overload
          - issue: no kerf compensation on mating parts
            fix: measure kerf on a coupon and offset half on each side
            failure_mode: assembly-error
          - issue: heat from dense holes or long strips distorts flat parts
            fix: wider webs, balanced cutouts, micro-joints, centre-out sequence
            failure_mode: warpage
          - issue: residual stress near the cut edge
            fix: symmetric layouts, stress relief or machining where structural
            failure_mode: residual-stress
          - issue: dross and burr on exit edge
            fix: specify edge quality and deburring; adjust focus, gas and speed
            failure_mode: burr
          - issue: sharp re-entrant corners crack or retain dross
            fix: radius or relief, rounded slot ends
            failure_mode: notch
          - issue: HAZ brittle and microcracks at highly loaded edge
            fix: keep fatigue-critical holes away from cut edge or post-machine
            failure_mode: fatigue
          - issue: plywood grain, glue lines and voids change kerf and strength
            fix: test per sheet batch, orient loaded webs and tabs with strong direction
            failure_mode: anisotropy
          - issue: unsupported fine acrylic bridges crack
            fix: use cast acrylic and thicker details
            failure_mode: brittle-fracture
          rules:
          - id: c1
            text: Metal hole diameter at least material thickness (Hubs rule)
            source_url: https://www.hubs.com/nl/gidsen/metaalbewerking-van-plaatwerk/
            source_quality: primary
            equipment: sheet
            confidence: handbook
            machine_specific: true
