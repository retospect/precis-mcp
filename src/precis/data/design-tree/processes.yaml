            dimensional-accuracy:
              id: process/additive/desktop-fdm/dimensional-accuracy
              role: leaf
              domain: mech
              scale: macro
              coverage: deep
              summary: Plan on about +-0.2 mm on a tuned desktop printer, +-0.5% or 0.5 mm (larger) for big parts, and 0.3
                mm total clearance for moving fits; none of the ISO tolerance standards give desktop FDM capability, so calibrate
                with a printed clearance coupon in the final material and orientation. Z accuracy is limited by layer height
                and first-layer squish.
              when:
              - 'printed drawing note: state printer, material, orientation, and demand a fit coupon for functional fits'
              - post-machine or drill/ream critical holes and datums needing sub-0.1 mm
              avoid_when:
              - 'repeatable sub-0.1 mm control, bearing seats or datums as printed: machine instead'
              - 'fine surface detail dominates: SLA; many support-free complex parts: SLS/MJF; volume: injection moulding'
              howto:
              - Never model mating parts at nominal size; start sliding fits near 0.3 mm total clearance and test.
              - Calibrate first layer, then extrusion multiplier (0.45 / average measured wall), before judging dimensions.
              - Print a coupon with several clearances (e.g. 0.20, 0.30, 0.40, 0.50 mm) in the same material, nozzle, orientation,
                layer height and cooling as the part.
              - Orient critical holes, tabs and sliding faces so their profile forms in XY; enlarge CAD holes or drill after.
              - Put a 45 deg chamfer on edges touching the bed; use a chamfer rather than a fillet on downward faces.
              - Put the seam on a hidden, low-load face and consider 3 wall loops.
              - Reprint the fit at actual part size; do not scale coupon error linearly.
              issues:
              - issue: Mating parts modelled at exact nominal size interfere
                fix: Add clearance, begin near 0.3 mm total for moving parts, validate with coupon
                failure_mode: dimensional-error
              - issue: One tolerance used for all materials and orientations
                fix: Calibrate per material; allow 0.2-1% shrinkage
                failure_mode: dimensional-error
              - issue: Holes print undersize or non-circular
                fix: Enlarge CAD hole, orient axis in XY, drill or ream afterwards
                failure_mode: dimensional-error
              - issue: Sharp flat bottom edge gives elephant foot
                fix: 45 deg chamfer plus compensation near 0.2 mm, check first layer
                failure_mode: dimensional-error
              - issue: Downward-facing fillet becomes steep overhang
                fix: Use a chamfer where bed-facing quality matters
                failure_mode: dimensional-error
              - issue: Seam leaves bump or notch
                fix: Hide or align seam, more wall loops, slow outer wall
                failure_mode: notch
              - issue: Stair-stepping on curved faces at coarse layers
                fix: Smaller layer height, rotate the face, machine or coat
                failure_mode: dimensional-error
              - issue: Load-bearing tab across layer interfaces delaminates
                fix: Orient so load runs along roads and perimeters
                failure_mode: anisotropy
              - issue: Large flat plates warp and drift
                fix: Ribs, rounded transitions, brim, enclosure, low-shrink material
                failure_mode: warpage
              - issue: Supported faces rough and inaccurate
                fix: Put critical faces on bed or free space, split, or machine
                failure_mode: dimensional-error
              - issue: Corner bulge and over-extrusion
                fix: Calibrate extrusion multiplier (typically 0.9-1.1), deburr only non-functional edges
                failure_mode: burr
              rules:
              - id: c1
                text: Well-calibrated Original Prusa accuracy about +-0.2 mm
                source_url: https://help.prusa3d.com/article/modeling-with-3d-printing-in-mind_164135
