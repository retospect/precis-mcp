            draft-and-texture:
              id: process/primary-shaping/injection-mould/draft-and-texture
              role: leaf
              domain: mech
              scale: macro
              coverage: deep
              summary: 'Draft is counted per side from the mould-opening direction: about 1 to 2 degrees on smooth faces,
                0.5 degrees at the very least, plus an allowance for texture that scales with the real etched depth rather
                than the SPI, VDI or Mold-Tech label. Every face parallel to the draw, including ribs, bosses and holes, needs
                it.'
              howto:
              - Give every face parallel to the draw direction draft, including inner and outer walls of ribs and bosses.
              - Start at 1 to 2 degrees per side on smooth walls, or 1 degree per 25 mm of draw depth for deep parts.
              - Name the texture and its etched depth early, then add roughly 1 to 1.5 degrees per 0.025 mm of depth to the
                base draft.
              - Use at least 3 degrees for light texture and 5 degrees or more for heavy texture; ask the mouldmaker for the
                texture supplier's release figure.
              - Keep the part on the ejector side after shrinkage; provide enough ejector pin, sleeve or stripper area, and
                avoid ejecting on thin ribs.
              - Increase draft for deep draws, filled resins, tall bosses and walls that flex.
              issues:
              - issue: Zero or too little draft
                fix: Add draft per side and raise it for texture and deep draws
                failure_mode: assembly-error
              - issue: Drafting only the outside of a rib or boss
                fix: Draft inner and outer faces, at least 0.5 degrees per side
                failure_mode: residual-stress
              - issue: Texture applied after draft was fixed
                fix: Specify texture depth at the start and add the texture allowance to base draft
                failure_mode: assembly-error
              - issue: Thick solid bosses and abrupt wall changes
                fix: Core out, use 40 to 60 percent boss and rib walls and gradual ramps
                failure_mode: sink
              - issue: Uneven walls and unbalanced cooling
                fix: Balance walls and cooling, ribs for large panels, gate layout that limits orientation imbalance
                failure_mode: warpage
              - issue: Flow aligns chains and fibre in one direction
                fix: Orient gates and flow with the principal load; keep weld lines out of loaded zones
                failure_mode: anisotropy
              - issue: Sharp corners, unfilleted rib bases and abrupt steps
                fix: Add radii, ramps and rib-base fillets
                failure_mode: notch
              - issue: Knife edges and difficult shut-offs at the parting line
                fix: Robust parting surfaces and steel shut-off land; review every slide and insert boundary
                failure_mode: burr
              - issue: Uneven filling, high pack pressure and forced ejection
                fix: Uniform walls, smooth transitions, balanced gates and cooling, no forced ejection
                failure_mode: residual-stress
              - issue: Thick sections leave internal voids
                fix: Core out mass, improve packing and venting, gate thick to thin
                failure_mode: porosity
