            radii-and-corners:
              id: process/primary-shaping/injection-mould/radii-and-corners
              role: leaf
              domain: mech
              scale: macro
              coverage: deep
              summary: Inside corner radius of 0.5 T as a baseline (0.25 T absolute floor, 0.6 to 0.75 T for maximum strength),
                with outside radius equal to inside radius plus T so the wall stays constant. Sharp internal corners concentrate
                stress, hinder flow and are hard to machine in the tool.
              howto:
              - Round every internal corner at 0.5 T or larger; go to 0.6 to 0.75 T where the corner carries load and space
                allows.
              - Set the outside radius to inside radius plus T so wall thickness stays constant round the bend.
              - Fillet rib bases at 0.25 to 0.5 T.
              - Move radii off the parting line and confirm the toolmaker's minimum cutter radius before releasing the design.
              - Taper wall changes over about 3 times the thickness difference or keep them within 40 to 60 percent.
              - Allow more draft and bigger radii for glass or mineral filled resins.
              - Place gates and weld lines away from highly stressed corners; use ISO 20457 for tolerance, not ISO 2768 or
                ISO 286.
              issues:
              - issue: Sharp internal corners
                fix: Internal fillet around 0.5 T; outside radius equal to inside plus T
                failure_mode: notch
              - issue: Thick solid bosses or pads at corners
                fix: Core out the mass; ribs at 40 to 60 percent of the wall
                failure_mode: sink
              - issue: Abrupt wall changes at a corner
                fix: Gradual transition of about 3 times the difference
                failure_mode: warpage
              - issue: Constricted flow, mould restraint and differential cooling
                fix: Uniform walls, gradual transitions, generous radii, suitable gate placement, balanced cooling
                failure_mode: residual-stress
              - issue: Flow alignment of molecules and fibre
                fix: Align main flow with principal load, use mould-flow analysis, specify fibre direction where structural
                failure_mode: anisotropy
              - issue: Internal shrinkage not compensated by packing in thick sections
                fix: Core out, keep packing pressure during cooling, gate appropriately
                failure_mode: porosity
              - issue: Overly thin parting-line features and damaged shut-offs
                fix: Better shut-offs, draft, tool maintenance, controlled clamp and pressure
                failure_mode: burr
              - issue: Designing to nominal CAD corners
                fix: Confirm the toolmaker's minimum cutter radius and gate limits before tool release
                failure_mode: dimensional-error
              - issue: Tight tolerances applied everywhere
                fix: ISO 20457 by function; tight direct tolerances only for datums, fits and seals
                failure_mode: dimensional-error
              - issue: Cracking from residual stress, sharp corners and weak weld lines
                fix: Bigger radii, fewer abrupt thickness changes, moderate packing and cooling, relocate weld lines
                failure_mode: brittle-fracture
