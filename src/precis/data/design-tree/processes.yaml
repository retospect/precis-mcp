            shrinkage-and-tolerances:
              id: process/primary-shaping/injection-mould/shrinkage-and-tolerances
              role: leaf
              domain: mech
              scale: macro
              coverage: deep
              summary: Pick the resin grade first and get its shrinkage data, scale the tool for it, and tolerance only the
                functional dimensions directly. ISO 20457 and DIN 16742 are the plastics-specific tolerance frameworks; ISO
                2768 and ISO 286 should not be applied mechanically to moulded parts.
              howto:
              - Select the actual resin grade before designing the tool; take its flow and cross-flow shrinkage from the supplier
                datasheet.
              - Scale the mould by 1/(1-s), with s the linear shrinkage, then validate with mould-flow and a first-shot measurement.
              - Split dimensions into critical (fits, seals, snap engagement, datum-to-datum) and non-critical; give critical
                ones direct tolerances, datums and a conditioning state.
              - Apply an agreed ISO 20457 or DIN 16742 general class to the non-critical rest instead of tight blanket tolerances.
              - Distinguish tool-bound dimensions from those across a parting line, slide or lifter, which carry wider tolerance.
              - Datum functional surfaces, not cosmetic or flexible ones.
              - Dimensions under 1 mm or over 1000 mm need direct agreement with the moulder.
              - For nylon, specify the conditioned state and measure after a defined ageing interval.
              issues:
              - issue: Tight tolerance applied to every dimension
                fix: Classify critical versus non-critical; direct tolerance only on functional features.
                failure_mode: dimensional-error
              - issue: Tool designed before resin chosen
                fix: Select grade, obtain shrinkage data, scale tool, validate with mould-flow.
                failure_mode: dimensional-error
              - issue: ISO 2768 or ISO 286 used as the moulded-part tolerance
                fix: Use ISO 20457 or DIN 16742 and agree classes with the moulder.
                failure_mode: dimensional-error
              - issue: Nylon dimensions drift with moisture
                fix: Dry and condition consistently and design for the in-use moisture state.
                failure_mode: dimensional-error
              - issue: Fibre-filled resin shrinks differently along and across flow
                fix: Allow directional tolerances; orient gate and fibres deliberately.
                failure_mode: anisotropy
              - issue: Differential cooling and non-uniform wall mass
                fix: Equalise wall thickness and cooling; balance gates; warpage simulation.
                failure_mode: warpage
              - issue: Large tight dimension attempted by moulding alone
                fix: Machine the functional datum after moulding or relax the tolerance.
                failure_mode: dimensional-error
              - issue: Frozen-in orientation and forced ejection
                fix: Add radii and draft; tune melt and mould temperature, fill speed and packing.
                failure_mode: residual-stress
