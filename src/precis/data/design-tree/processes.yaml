        sand-investment-casting:
          id: process/primary-shaping/sand-investment-casting
          role: process
          domain: mech
          scale: macro
          coverage: shallow
          equipment: cast
          summary: Sand casting (cheap pattern, large heavy parts, rough surface, CT10-CT14) and investment casting (wax pattern
            and ceramic shell, small intricate parts, thinner walls, CT5-CT7). Both need machining allowances and machined
            datums for functional surfaces; ISO 8062 sets the raw-casting tolerance.
          when:
          - sand casting for large, heavy, thick-walled parts at low to medium quantity with low tooling budget
          - investment casting for small to medium intricate parts, thin sections, undercuts and hard-to-machine alloys
          avoid_when:
          - very high volume thin-walled parts (die casting)
          - fatigue-critical parts needing grain flow and low porosity (forging)
          - low quantity accessible geometry with tight tolerance (CNC machining)
          - tight as-cast tolerance or fine finish from sand casting
          variants:
          - green sand, chemically bonded, no-bake, shell moulding
          - investment casting with ceramic or soluble cores
          - permanent-mould casting as a middle option
          tradeoffs:
          - investment tooling costs more than sand but can remove machining, cores and assembly
          - sand needs more draft and larger machining allowance than investment
          - cores add cost and risk in both processes
          howto:
          - choose process and alloy with the foundry first; treat published minimums as quotation starting points
          - keep walls uniform and core out heavy masses; ribs 50-70% of wall
          - sand internal radii about 1-1.25 times wall; investment at least about 0.79 mm
          - sand draft 1-5 deg (2 deg default); investment often minimal but ask the foundry
          - add pattern shrink allowance from the foundry's alloy data, not a single generic percentage
          - add 1.5-3 mm machining allowance per machined face in sand
          - dimension critical features from machined datums, not across the parting line or from cores
          - call out ISO 8062 CT grade and machining allowance grade on the drawing
          issues:
          - issue: uniform thick sections and rib/boss intersections form hot spots
            fix: core out, hollow bosses, ribs at 50-70% wall, generous blends
            failure_mode: porosity
          - issue: sharp internal corners crack and damage shells or moulds
            fix: fillet at 1-1.25 times wall for sand
            failure_mode: notch
          - issue: zero draft on sand patterns drags and damages the mould
            fix: 1-5 deg depending on depth, core difficult internals
            failure_mode: dimensional-error
          - issue: directional solidification structure gives anisotropic properties
            fix: orient load path deliberately; use forging where isotropic fatigue is critical
            failure_mode: anisotropy
          - issue: uneven cooling and restrained contraction leave residual stress
            fix: uniform walls, large fillets, controlled risering, specified stress relief
            failure_mode: residual-stress
          - issue: gas from binder decomposition, moisture or poor venting
            fix: venting, permeable cores, degassing, avoid blind pockets
            failure_mode: porosity
          - issue: thick local sections give sink and warpage
            fix: core out and keep walls uniform
            failure_mode: sink
          - issue: parting line or core shift breaks tolerance across the line
            fix: put critical features in one mould half, use machined datums
            failure_mode: dimensional-error
          - issue: flash at parting line and gate scars
            fix: keep flash away from sealing and fatigue surfaces, allow trim
            failure_mode: burr
          rules:
          - id: c1
            text: sand casting minimum wall about 3 mm light alloys, 5-6 mm steel and ferrous
            source_url: https://www.manufacturingnetwork.com/knowledgebase/view/30
            source_quality: secondary
            equipment: cast
            confidence: secondary
            machine_specific: true
            table_ref: dtree/process/primary-shaping/sand-investment-casting#c1
            measured_on: foundry-dependent; alloy-class only
