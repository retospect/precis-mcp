            edges-text-deburr:
              id: process/cutting/cnc-mill/edges-text-deburr
              role: leaf
              domain: mech
              scale: macro
              coverage: deep
              summary: 'Milling leaves burrs and cannot make sharp internal corners, so specify edges deliberately: a defined
                chamfer or radius where it matters, an ISO 13715 limit where the edge is only ''no burr, no sharp edge''.
                Engraved text should be recessed, simple sans-serif and above a minimum stroke width and depth, otherwise
                mark it another way.'
              when:
              - defined chamfer such as 0.3 x 45 deg for edges that need a known size
              - ISO 13715 notation for edges whose exact form can stay undefined (burr or undercut limits)
              - recessed engraving for identification that must survive handling
              - laser marking, etching, printing or stamping for non-functional identification
              - wire EDM, broaching or corner relief for a truly sharp internal corner
              avoid_when:
              - avoid raised lettering (needs surrounding material removed)
              - avoid external radii everywhere when a chamfer is acceptable (radius costs more)
              - avoid 'break all edges' with no limit
              howto:
              - Break external edges by default with a note giving the permitted edge deviation per ISO 13715.
              - Call out keep-sharp, sealing, datum and mating edges individually.
              - Use direct callouts such as 0.3 x 45 deg or R0.3 when the geometry is defined; ISO 13715 only for undefined
                edges.
              - Give internal corners a radius above the cutter radius, or a relief where a square mating part must seat.
              - Use recessed sans-serif text at or above the minimum stroke width and depth; prefer rounded fonts.
              - Plan cutter exit direction so burrs fall on non-critical edges; give access for deburring.
              - Tolerance only functional features; ISO 2768-m elsewhere, ISO 286 for fits.
              issues:
              - issue: every edge drawn sharp while the cutter leaves burrs
                fix: specify deburr with a measurable ISO 13715 limit or a defined chamfer
                failure_mode: burr
              - issue: '''break all edges'' without a limit'
                fix: state edge condition and limit; separate keep-sharp edges
                failure_mode: burr
              - issue: tiny internal radius needs small fragile cutters
                fix: enlarge radius, use corner relief, or EDM/broach a true sharp corner
                failure_mode: notch
              - issue: narrow or deep engraved text forces tiny tools
                fix: meet minimum stroke width and depth, or laser-mark
                failure_mode: dimensional-error
              - issue: sharp internal corners or burr-removal gouges start fatigue cracks on loaded edges
                fix: fillets, reliefs, smooth transitions, finish specified on critical edges
                failure_mode: fatigue
              - issue: asymmetric removal releases residual stress
                fix: stress-relieved stock, balanced roughing, finish critical faces last
                failure_mode: residual-stress
              - issue: heat melts or smears plastics
                fix: sharp tools, coolant or air, chip clearance, shallow finishing cuts
                failure_mode: warpage
              - issue: large parts drift from small-part capability
                fix: datums, several inspection points, realistic tolerances
                failure_mode: dimensional-error
              - issue: directional stock properties
                fix: specify grain or fibre orientation where strength matters
                failure_mode: anisotropy
              - issue: voids exposed in cast or sintered stock
                fix: wrought or certified stock for pressure or sealing parts
                failure_mode: porosity
