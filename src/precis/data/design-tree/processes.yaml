        corrugated-board:
          id: process/forming/corrugated-board
          role: process
          domain: mech
          scale: macro
          coverage: shallow
          equipment: any
          summary: Corrugated boxes and folding cartons are cut and creased flat from board, then folded. Design is driven
            by board caliper, flute and grain direction, FEFCO style and the converter's die-cut and crease tolerances, which
            are loose compared with machined parts.
          when:
          - lightweight packaging, inserts and shipping boxes at any volume from prototype to millions
          - cheap disposable structure where stacking strength comes from flute geometry
          - flat-packed shipping and storage
          avoid_when:
          - tolerances tighter than about 1 mm (corrugated) or 0.3 mm (carton) are needed
          - moisture-exposed or load-bearing structural parts
          - high stiffness or precise 3D geometry (use moulded pulp or thermoformed trays)
          variants:
          - corrugated FEFCO 02-series slotted (0201 RSC), 04-series folder, 07-series ready-glued/auto-bottom
          - single-wall (E, B, C flute) vs double-wall (BC) board
          - folding carton from SBS/FBB paperboard
          - flatbed vs rotary die-cutting
          tradeoffs:
          - flatbed die-cutting is flexible and accurate; rotary is cheaper at high volume but less flexible
          - higher caliper and double wall raise stacking strength and material cost
          - custom dies and special creasing add setup cost; a standard RSC blank is cheapest
          - manual gluing dominates low-volume labour; crash-lock or auto-bottom suits automation
          howto:
          - pick a standard FEFCO style first and state whether dimensions are inside, outside or score-to-score
          - apply the board-caliper correction (RSC inside size L+t, B+t, H+2t) instead of using nominal panel sizes
          - put flute direction on the dieline; it runs parallel to the slots unless agreed otherwise
          - specify construction, flute, liner grades, caliper and ECT/BCT, not gsm alone
          - match crease rule and matrix to measured caliper and grain; trial the fold
          - keep print and critical graphics away from scores, cuts and glue flaps; add at least 3 mm bleed
          - use FEFCO tolerances for corrugated and reserve tight carton tolerances for controlled die and print processes
          issues:
          - issue: nominal panel sizes without caliper correction give a box that is too tight or out of square
            fix: declare the dimension system and apply the FEFCO or fold allowance
            failure_mode: dimensional-error
          - issue: folding across grain cracks coating and fibres at the crease
            fix: orient grain along main creases, trial cross-grain folds
            failure_mode: notch
          - issue: flute direction unspecified gives weak stacking edges and crushed scores
            fix: mark flute on the dieline and orient it along the load path
            failure_mode: anisotropy
          - issue: creasing leaves springback and fold memory
            fix: correct matrix width and depth, fold allowance, trial at production moisture
            failure_mode: residual-stress
          - issue: large unsupported panels bow and oil-can
            fix: add creases, partitions or heavier board
            failure_mode: warpage
          - issue: dull or overpressured rules crush flute and leave fuzzy edges
            fix: maintain the die, reduce pressure, inspect cuts in both flute directions
            failure_mode: burr
          - issue: small bridges (nicks) tear out or leave visible nubs
            fix: size nicks for the board and run stripping trials
            failure_mode: notch
          - issue: moisture imbalance causes warp and out-of-square erection
            fix: balance coatings and artwork, control board moisture, validate erected box
            failure_mode: warpage
