        sla:
          id: process/additive/sla
          role: process
          domain: mech
          scale: macro
          coverage: shallow
          equipment: sla
          summary: Resin vat printing (SLA, MSLA, DLP) gives fine detail and smooth surfaces in small parts, but standard
            resins are brittle and every limit moves with resin, exposure, orientation and post-cure. Treat published minimums
            as starting points and prove critical features on a coupon.
          when:
          - fine detail, smooth cosmetic surface, small to medium prototype, casting or dental/jewelry pattern
          - quantity low, geometry too intricate for FDM surface quality
          avoid_when:
          - impact, repeated flexing or outdoor UV exposure with standard resin
          - precision bores or datum faces needing machined tolerance
          - large parts where FDM or SLS is cheaper
          variants:
          - laser SLA, MSLA (LCD mask) and DLP differ in spot or pixel size, optical bleed and peel mechanics
          - standard, tough, durable, flexible, high-temperature and filled resins have different minimum walls and shrinkage
          tradeoffs:
          - 'vs FDM: better detail and finish, more brittle, cost rises with resin volume and support work'
          - 'vs SLS/MJF: finer detail but needs supports and is less tough and less isotropic'
          - 'vs CNC: cheaper for complex shapes, far weaker on tolerance and durability'
          - 'vs injection moulding: moulding becomes cheaper above roughly 100 parts'
          howto:
          - Start with 1 mm walls, 1 mm holes, 2 mm hollow shells, 4 mm drains and 0.2 mm assembly clearance.
          - Hollow thick bodies and give every cavity a low drain and a high vent, at least two openings.
          - Orient the part so peel force is low, supports land on non-functional faces and loads lie in the layer plane.
          - Add fillets at wall roots and avoid abrupt section changes to limit stress and warpage.
          - Print a fit coupon from the actual resin before fixing clearances; wash, dry and post-cure to the resin schedule
            before measuring.
          - Keep finished parts out of sunlight; use tough or durable resin where the part flexes or takes impact.
          issues:
          - issue: thin cosmetic walls at the machine limit break or curl
            fix: 0.6 mm minimum for unsupported walls, about 1 mm for repeatable production, add ribs and base fillets
            failure_mode: warpage
          - issue: hollow part without drain holes traps liquid resin that later leaks
            fix: add drain and vent holes of 3.5 mm or more, at least one opening per cavity, ideally two
            failure_mode: porosity
          - issue: long tiny holes and channels close up by cure bleed
            fix: enlarge to 0.5-0.75 mm minimum, preferably 1 mm or more, shorten and orient for washing
            failure_mode: dimensional-error
          - issue: standard resin used where the part flexes or is hit
            fix: use tough or durable resin, add generous radii, load bending in the layer plane
            failure_mode: brittle-fracture
          - issue: finished part left in sunlight or over-cured becomes brittle and discolours
            fix: follow the resin cure schedule and protect from UV afterwards
            failure_mode: environmental-degradation
          - issue: load across layer interfaces is weakest in Z
            fix: orient principal loads in the layer plane, thicken Z-loaded walls
            failure_mode: anisotropy
          - issue: supports leave scars, burrs and nubs
            fix: put supports on sacrificial faces and allow finishing stock; avoid supports on sealing or datum faces
            failure_mode: burr
          - issue: thick sections and large flat faces cure unevenly and distort
            fix: hollow, keep walls near uniform, rib instead of bulk, tilt large faces
            failure_mode: sink
          - issue: designing a press fit straight from nominal CAD size
            fix: print a coupon; start 0.1 mm snug, 0.2 mm assembly, 0.5 mm moving
            failure_mode: assembly-error
          rules:
          - id: c1
            text: Minimum wall attached on two or more sides
            source_url: https://www.hubs.com/knowledge-base/how-design-parts-sla-3d-printing/
