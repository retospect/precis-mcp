            internal-corners:
              id: process/cutting/cnc-mill/internal-corners
              role: leaf
              domain: mech
              scale: macro
              coverage: deep
              summary: A round end mill cannot cut a sharp inside corner; the corner radius is at least half the cutter diameter.
                Pick the largest radius the design tolerates, keep it uniform, and use dogbone or T-bone reliefs where a square
                part must seat in a milled pocket.
              when:
              - 'dogbone: the mating square part must reach the pocket corner and the relief is hidden or not cosmetic'
              - 'T-bone: one wall must stay visually straight, or the slot is close to the cutter diameter'
              avoid_when:
              - 'dogbone or T-bone: the joint must be sealed or the relief shows on a cosmetic face'
              howto:
              - Draw every vertical inside corner with a radius; never a sharp 90 degree corner.
              - Set the radius to about 1.3 times the radius of the nearest standard cutter, and make it larger when pocket
                depth allows.
              - Keep radius to pocket depth near 1:4 and pocket depth within 5 times cutter diameter (10 times only with supplier
                approval).
              - Use one radius value across the part so one cutter does the job without tool changes.
              - For a square tab in a milled pocket, add a dogbone (diagonal overcut) or T-bone (relief along one wall) sized
                for the real finishing cutter.
              - Use wire EDM or broaching only when a true sharp inside corner is functionally required.
              issues:
              - issue: Sharp 90 degree inside corner drawn in CAD
                fix: Add a radius, widen the pocket, or add a dogbone or T-bone relief
                failure_mode: dimensional-error
              - issue: Very small radius specified only to keep a square mating interface
                fix: Use a larger standard cutter plus a local relief; small cutters need more passes and tool changes and
                  break more often
                failure_mode: assembly-error
              - issue: Every inside radius is different
                fix: Standardise radii so one cutter machines many features
                failure_mode: dimensional-error
              - issue: Deep narrow pocket
                fix: Widen it, cut depth, split the part, open it from another side, or change process
                failure_mode: excess-deflection
              - issue: Sharp inside corner concentrates stress
                fix: Use the largest practical radius; about 3 mm is a common start for brittle materials
                failure_mode: notch
              - issue: Burrs at edges and hole exits
                fix: Add chamfers or radii, specify edge break, budget deburring
                failure_mode: burr
              - issue: Thin or tall walls chatter and distort when cut
                fix: Thicken, shorten, add ribs, rough then finish with light cuts, support the part
                failure_mode: warpage
              - issue: Stock stress released by asymmetric material removal bows the part
                fix: Use stress-relieved stock and balanced roughing
                failure_mode: residual-stress
