        powder-coat-paint:
          id: process/coating/powder-coat-paint
          role: process
          domain: mech
          scale: macro
          coverage: shallow
          equipment: any
          summary: 'Powder coating and wet paint are finishes, not precision processes: the film is a dimensional layer of
            roughly 50-100 um per coat. Mask or leave bare every thread, fit, datum and earth point, radius external edges,
            and give hollow parts drain and rack features.'
          when:
          - metal part needs colour and corrosion protection at low cost, on accessible external surfaces
          - high-silicon castings or alloys that anodise badly
          - powder for durable single-colour runs; wet paint for multicolour, low volume, touch-up, thin films or heat-sensitive
            assemblies
          avoid_when:
          - precision fits unmasked tighter than about +/-0.1 mm
          - deep recesses, narrow slots and closed internal channels (Faraday cage effect)
          - assemblies or inserts that cannot take the oven cure cycle, unless wet paint or low-temperature powder is used
          - surfaces that must conduct (earth, EMI) unless masked or left bare
          variants:
          - single-coat powder
          - primer plus topcoat powder system
          - wet paint, liquid or e-coat
          - tribo vs corona powder application
          tradeoffs:
          - Powder gives thicker, tougher film but needs an oven and changes colour slowly; wet paint suits low volume and
            thin films.
          - Masking adds labour; coating first and machining after risks edge damage.
          - Two-coat systems add handling and cure cost, only justified for corrosion or substrate reasons.
          - If most surfaces are precision, consider plating, anodising, e-coat or machining after coating.
          howto:
          - Dimension features in the coated state or leave them bare, and say which on the drawing.
          - Mask threads, bores, press fits, sealing lands, datums and earth pads; put mask boundaries on hidden faces.
          - Radius outside edges at least 0.5 mm (0.75-1.5 mm for demanding corrosion) and deburr cut edges.
          - Hole sizes of 6 mm or more coat reliably; avoid coating holes below about 3 mm; allow 3-5 mm drain and vent holes
            in hollow parts.
          - Provide a bare rack or earth point and show the permitted rack mark.
          - Specify minimum and maximum dry film thickness and the measurement locations.
          - Open recesses so depth does not exceed opening width.
          issues:
          - issue: Coating threads, dowel holes, bearing bores or press fits
            fix: Mask with plugs or caps, or leave bare and machine after
            failure_mode: assembly-error
          - issue: Tolerance applied after coating without a coated-state call-out
            fix: Define tolerance in the coated state or leave the feature bare
            failure_mode: dimensional-error
          - issue: Sharp external edges pull thin and corrode first
            fix: Radius at least 0.5 mm
            failure_mode: environmental-degradation
          - issue: Deep pockets and closed channels starved by Faraday cage effect
            fix: Open the cavity, reduce depth, use tribo or liquid paint
            failure_mode: environmental-degradation
          - issue: 'No drain or vent holes: pretreatment liquid and air trapped, outgassing'
            fix: Add holes and orient for drainage
            failure_mode: porosity
          - issue: No intentional earth or rack point
            fix: Add a sacrificial tab or bare pad
            failure_mode: assembly-error
          - issue: Porous castings and welds outgas in the oven
            fix: Seal or pre-bake castings, clean welds
            failure_mode: porosity
          - issue: Thin sheet and asymmetric bends warp in the cure oven
            fix: Add flanges or ribs, balance sections, fixture during cure
            failure_mode: warpage
          - issue: Burrs from laser, punching or drilling thin the film at the edge
            fix: Deburr and break edges before pretreatment
            failure_mode: burr
          - issue: Sharp cut-outs concentrate stress and coat poorly
            fix: Add radii and reliefs
            failure_mode: notch
