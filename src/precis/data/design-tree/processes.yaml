        annealing-printed-parts:
          id: process/property-change/annealing-printed-parts
          role: process
          domain: mech
          scale: macro
          coverage: shallow
          equipment: desktop-fdm
          summary: 'Annealing a printed PLA, PETG or nylon part raises crystallinity, stiffness and heat resistance but shifts
            dimensions and can warp it. There is no universal allowance: print a coupon of the real geometry, anneal it, measure
            X, Y and Z, and compensate the CAD.'
          when:
          - small to medium PLA or nylon part needs more stiffness or heat resistance than as-printed
          - geometry is compact and can be supported flat in a uniform-temperature oven
          avoid_when:
          - large thin plates, long unsupported walls or abrupt thickness changes (warp)
          - precision mating features that were not validated on a coupon
          - PETG products where the maker says annealing is not recommended
          - parts needing toughness or elongation, since crystallinity can cost ductility
          variants:
          - PLA at 50-60 C for 6-12 h (Bambu starting schedule)
          - PETG at 60-70 C for 4-8 h (Bambu), material dependent
          - nylon, material-specific cycle (one study 150 C, 91 min)
          - 'experimental optima: PLA 90 C/60 min or 100 C/90 min; PETG 60 C/90 min or 70 C/90 min'
          tradeoffs:
          - Gains in tensile strength reported in studies were modest (6.28 percent PLA, 8.08 percent PETG) and filament specific.
          - Annealing adds oven time, fixturing and a coupon trial to every new geometry.
          - Injection moulding, machining or powder bed can be better when tolerance, isotropy or volume demand it.
          howto:
          - Print a coupon with the real holes, bosses, walls and fits, same orientation, infill and walls.
          - Anneal it with the planned cycle, measure before and after in X, Y and Z, and compute scale factor = annealed
            / pre-anneal.
          - Apply the inverse factor in CAD, then add functional clearance; repeat for a small and a large part.
          - Use a calibrated oven with uniform temperature, support the part on a flat fixture, heat and cool gradually.
          - Design walls as whole multiples of extrusion width (0.45, 0.90, 1.35, 1.80 mm for a 0.4 mm nozzle) and prefer
            2-3 perimeters.
          - Start movable-fit clearance at 0.30 mm and do not assume better than +/-0.20 mm without calibration.
          - 'Dry filament before printing (Prusa: PETG 55 C 6 h, PLA 45 C 6 h).'
          - Print threads coarse and chase or tap after annealing; machine critical bores afterwards.
          issues:
          - issue: Designing to unannealed CAD size
            fix: Directional compensation from a geometry-matched coupon
            failure_mode: dimensional-error
          - issue: Large thin plate warps during annealing
            fix: Fixture, ribs, split the part, slow heating and cooling
            failure_mode: warpage
          - issue: Thick bosses beside thin walls shrink unevenly (sink-like distortion)
            fix: Core out bosses, add ribs and fillets, keep walls uniform
            failure_mode: sink
          - issue: Sharp internal corners concentrate stress
            fix: Generous fillets and gussets
            failure_mode: notch
          - issue: Layer-direction weakness remains after annealing
            fix: Orient loads in XY, add perimeters, test the real orientation
            failure_mode: anisotropy
          - issue: Cooling gradients leave residual stress
            fix: Gradual cooling, avoid massive-to-thin transitions
            failure_mode: residual-stress
          - issue: Wet filament leaves voids and weak layer bonds
            fix: Dry filament, enough overlap and perimeters
            failure_mode: porosity
          - issue: Higher crystallinity cuts toughness
            fix: Lowest effective temperature; test impact and elongation
            failure_mode: brittle-fracture
          - issue: PETG treated with a PLA recipe softens
            fix: Low-temperature coupon study
            failure_mode: softening
          - issue: Elephant-foot edges and softened edges
            fix: Bottom chamfer, first-layer compensation
            failure_mode: burr
          - issue: Holes go undersize or oval after annealing
            fix: Oversize from coupon data or undersize and ream
            failure_mode: dimensional-error
