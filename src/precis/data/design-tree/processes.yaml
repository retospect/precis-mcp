            material-selection:
              id: process/additive/desktop-fdm/material-selection
              role: leaf
              domain: mech
              scale: macro
              coverage: deep
              summary: PLA is easy but creeps and softens near 55-60 C; PETG is tougher to about 70 C; ABS and ASA go to roughly
                90-100 C but need an enclosure; nylon, PC and TPU need strict drying; CF and GF fills add stiffness but need
                a hardened nozzle. Many numbers in this answer come from GitHub design-rule compilations and blogs rather
                than makers, so Stage 2 should treat them cautiously.
              when:
              - 'PLA: prototypes, jigs, room-temperature stiff parts'
              - 'PETG: tough general functional parts, chemical resistance, to about 70 C'
              - 'ASA: outdoor parts needing UV and weather resistance'
              - 'ABS: tough, moderately heat-resistant parts on an enclosed printer'
              - 'nylon (PA): gears, bushes, hinges, wear and fatigue parts, if filament can be dried'
              - 'TPU: flexible, sealing or vibration-damping parts'
              - 'CF/GF-filled: stiff brackets and tooling, with hardened nozzle'
              avoid_when:
              - PLA or PETG under sustained load near their heat deflection temperature (creep)
              - ABS, ASA, PC, nylon on an open-frame printer for large parts
              - TPU for precision rigid features
              - 'fine detail below about 0.5 mm or holes below 1-2 mm: use resin, machining or moulding'
              variants:
              - PLA
              - PETG
              - ABS
              - ASA
              - PA/nylon
              - PC
              - TPU
              - CF-filled
              - GF-filled
              tradeoffs:
              - 'PLA: easiest and dimensionally stable but poor creep and heat.'
              - 'ABS vs ASA: ASA has far better UV resistance; both warp and need an enclosure.'
              - 'Nylon: tough and fatigue resistant but hygroscopic, dimensions change with moisture.'
              - 'CF fill: stiffer and lower thermal expansion, but more brittle and anisotropic, abrasive to nozzles.'
              howto:
              - Pick the material by service temperature and load duration first, then check the printer can hold it (enclosure,
                hardened nozzle).
              - Dry filament at the material schedule and print from a dry box (nylon, TPU, PC, PETG).
              - Start walls at 2 x nozzle diameter (0.8 mm for 0.4 mm), structural 1.2-1.5 mm.
              - Use teardrop or keyhole shapes for horizontal holes; drill or ream critical holes.
              - Start sliding clearance at 0.3-0.5 mm per side and validate with a coupon.
              - Core out thick bosses and use ribs; make thickness transitions gradual.
              - Use a hardened-steel nozzle for CF and GF filaments.
              issues:
              - issue: PLA or PETG part creeps under sustained load near HDT
                fix: Keep sustained stress low, bigger section, CF fill or higher-temperature polymer, metal inserts, or machine
                  metal
                failure_mode: creep-preload-loss
              - issue: PLA softens in hot environments (about 55-60 C HDT)
                fix: Use PETG, ABS, ASA, PC or CF-filled grade
                failure_mode: softening
              - issue: Large ABS/ASA/PC/PA part on open frame warps and cracks
                fix: Enclosure, warm stable ambient, brim, slower print, controlled cooling
                failure_mode: warpage
              - issue: Wet nylon, TPU, PC or PETG gives bubbles, stringing, weak bonds
                fix: Dry at material temperature and print from dry box
                failure_mode: environmental-degradation
              - issue: Brass or stainless nozzle wears out on CF/GF
                fix: Hardened steel nozzle
                failure_mode: dimensional-error
              - issue: Loading across layer lines delaminates
                fix: Orient principal tensile load in XY, add perimeters, ribs, fillets
                failure_mode: anisotropy
              - issue: High infill used instead of stronger walls
                fix: Raise perimeter count and wall thickness first
                failure_mode: overload
              - issue: Sharp internal corners, small holes near edges concentrate stress
                fix: Fillets, hole-edge spacing 1.5-2 x wall thickness, thicker tabs
                failure_mode: notch
              - issue: Thick solid bosses sink or void
                fix: Core out, ribs/gussets, gradual transitions
                failure_mode: sink
              - issue: Porosity from wet or badly tuned filament
                fix: Dry, calibrate flow, adequate overlap, multiple perimeters
                failure_mode: porosity
              - issue: Residual stress in high-temperature materials
                fix: Reduce gradients, enclosure, moderate cooling, avoid abrupt sections
                failure_mode: residual-stress
              - issue: Elephant foot and stringing
                fix: 0.4 mm bottom chamfer, tune first layer, dry PETG/TPU, tune retraction
                failure_mode: burr
              - issue: Printed holes undersize
                fix: Print undersize and drill or ream critical holes
                failure_mode: dimensional-error
              - issue: Nylon dimensions change with absorbed moisture
                fix: Design moisture-conditioned dimensions into fits
                failure_mode: environmental-degradation
