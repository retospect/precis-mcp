            undercuts-and-actions:
              id: process/primary-shaping/injection-mould/undercuts-and-actions
              role: leaf
              domain: mech
              scale: macro
              coverage: deep
              summary: First try to make the part open and eject in the mould-opening direction. Where a feature blocks straight
                pull, choose among moving the parting line, a shut-off or pass-through core, a bump-off, a lifter, a side
                action or a hand-loaded insert, in roughly that order of cost.
              when:
              - 'feature can be formed by two mould halves closing on each other: use a shut-off or pass-through core (no
                moving parts)'
              - 'small, shallow, flexible snap feature in an unfilled resin: bump-off (stripping undercut)'
              - 'side-facing hole, slot or hook that cannot be reached by the pull direction: side action (slide, cam)'
              - 'small internal undercut that must clear during ejection: lifter'
              - 'very low volume or one-off internal feature: loose insert or pick-out, accepting hand handling'
              avoid_when:
              - bump-off in glass- or mineral-filled resin (too little flex) unless proven by flow and ejection trials
              - bump-off next to a rib, corner or other stiffener
              - a slide where re-orienting the part or moving the parting line would remove the undercut
              howto:
              - Fix the pull direction and parting line first, then list every feature that blocks straight pull.
              - 'Try, in order: delete the feature, move the parting line, form it by shut-off or pass-through coring, then
                bump-off, lifter, slide, pick-out.'
              - Give sliding shut-off faces at least 3 degrees of draft so steel does not drag on steel.
              - Give a bump-off a 30 to 45 degree lead angle on a flexible, unsupported wall, away from ribs and corners.
              - Keep side-action travel perpendicular to mould opening and leave physical room for the slide and its retraction.
              - Draw pull direction, parting line, slides, lifters, shut-off faces and draft arrows on the DFM drawing; let
                the toolmaker confirm the numbers for the chosen resin.
              issues:
              - issue: Undercut designed before the opening direction is known
                fix: Set pull direction and parting line first; then remove the undercut, rotate the part, move the parting
                  line or pick a slide, lifter or pick-out.
                failure_mode: assembly-error
              - issue: Side action used where a shut-off or pass-through core would do
                fix: Re-orient the feature so the two mould halves form it and give the shut-off faces at least 3 degrees
                  of draft.
                failure_mode: dimensional-error
              - issue: Bump-off placed beside a rib or corner or in filled resin
                fix: Move it to a flexible unsupported wall with a 30 to 45 degree lead angle, or use a lifter or slide instead.
                failure_mode: brittle-fracture
              - issue: No draft on ribs, bosses, lifter faces or textured walls
                fix: Start at 1 to 2 degrees and add more for depth or texture.
                failure_mode: dimensional-error
              - issue: Flash at weak shut-offs and parting lines
                fix: Use at least 3 degrees of shut-off draft, keep the tool aligned, and keep the parting line off sealing
                  edges.
                failure_mode: burr
              - issue: Weld line forms behind a post, slide core or hole
                fix: Move or enlarge the gate, rebalance flow, add venting, or redesign or machine the hole afterwards so
                  the weld avoids loaded areas.
                failure_mode: overload
              - issue: Sharp internal corners at lifter or slide-formed features
                fix: Add radii and smooth transitions so there is no notch at the base.
                failure_mode: notch
