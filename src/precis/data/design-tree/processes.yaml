design_tree_manifest: run3
status: run 3 (S6), verified drafts merged; for review, not yet linked or deduped
ai_use: 'Pre-filled with Perplexity (perplexity-reasoning) to find sources, then each rule was checked against its cited source
  by a separate agent. Prose and rule texts are our own wording; values trace to the listed source_url. Confidence levels:
  standard, handbook, secondary, excerpt-only, shop-rule (not DRC-enforceable), unverified. Rules marked machine_specific
  hold a number that depends on the machine, tool or material; S1 moves them to se_capabilities.json rows via table_ref.'
process:
  id: process
  role: goal
  domain: mech
  scale: macro
  coverage: shallow
  def: how a part is made, and the limits that process puts on its geometry, tolerance, material and cost
  asks:
  - quantity
  - material
  - size_mm
  - tolerance_mm
  - surface_Ra
  - equipment_available
  - lead_time
  - cost_weight
  children:
    additive:
      id: process/additive
      role: method
      def: build the part up layer by layer (DIN 8580 group 1, primary shaping, additive)
      children:
        desktop-fdm:
          id: process/additive/desktop-fdm
          role: process
          domain: mech
          scale: macro
          coverage: deep
          equipment: desktop-fdm
          def: fused filament fabrication on desktop printers (Prusa, Bambu Lab class), 0.4 mm nozzle default
          children:
            holes-and-clearances:
              id: process/additive/desktop-fdm/holes-and-clearances
              role: leaf
              domain: mech
              scale: macro
              coverage: deep
              summary: Desktop FDM holes print undersize and horizontal holes sag, so size holes from a printed coupon, not
                from nominal CAD. Clearances between printed parts run 0.15 to 0.30 mm per side depending on fit; true press
                fits should be avoided in favour of ribs, inserts or reaming.
              howto:
              - Print a hole-and-pin coupon in the same material, nozzle, layer height and orientation as the part, and measure
                it before fixing any compensation.
              - Start from +0.2 mm on hole diameter and about -0.2 mm on mating external dimensions, then replace with measured
                values.
              - State every clearance as radial or diametral; 0.30 mm radial is 0.60 mm diametral.
              - Give movable printed joints at least 0.3 mm initial clearance.
              - Orient precision holes with the axis vertical; for horizontal holes use a teardrop or chamfered top, or support.
              - Print critical holes undersize and drill or ream them after printing.
              - For a metal pin use a clearance hole with retaining ribs, a split clamp or an insert, not a solid interference
                fit.
              - Do not put an unqualified ISO 2768 tolerance on a desktop FDM drawing; give a functional limit backed by the
                coupon.
              issues:
              - issue: Mating parts modelled at the same nominal size
                fix: Add functional clearance (0.15 mm radial static, 0.30 mm radial moving) and coupon-test
                failure_mode: assembly-error
              - issue: Radial and diametral clearance confused
                fix: Write both explicitly
                failure_mode: assembly-error
              - issue: Solid interference fit around a metal pin splits layers
                fix: Clearance hole with ribs, split clamp, heat-set insert or post-machining
                failure_mode: anisotropy
              - issue: Horizontal hole roof sags or goes D-shaped
                fix: Vertical axis, teardrop or chamfered top, support, or drill afterward
                failure_mode: dimensional-error
              - issue: Holes print undersize
                fix: Measured CAD compensation, not one constant offset
                failure_mode: dimensional-error
              - issue: Elephant foot on bed-contact edge interferes with assembly
                fix: 45 degree chamfer or radius on the bed-contact edge plus slicer compensation
                failure_mode: dimensional-error
              - issue: Zero-clearance captive assembly fuses
                fix: Leave clearance for support residue and thermal variation, or print apart
                failure_mode: assembly-error
              - issue: Main load through Z layers
                fix: Reorient so the principal tensile load lies in XY
                failure_mode: anisotropy
              - issue: Sliding fit on soft printed plastic wears
                fix: Metal shaft or washer as the wear surface; lubricate if compatible
                failure_mode: wear-fretting
              - issue: Support scars and trapped support in holes
                fix: Teardrop or chamfer so the hole is self-supporting; reserve removal clearance
                failure_mode: dimensional-error
              rules:
              - id: c1
                text: Design around about plus or minus 0.2 mm accuracy for a well-calibrated Original Prusa; verify on other
                  machines
                source_url: https://help.prusa3d.com/article/modeling-with-3d-printing-in-mind_164135
                source_quality: primary
                equipment: desktop-fdm
                confidence: handbook
                machine_specific: true
                table_ref: dtree/process/additive/desktop-fdm/holes-and-clearances#c1
                measured_on: Original Prusa (model and material not stated)
              - id: c2
                text: Holes should be larger than 1 mm diameter to stay open and round
                value: '1'
                unit: mm
                source_url: https://www.xometry.com/resources/3d-printing/mini-guide-fdm-3d-printing/
                source_quality: secondary
                equipment: industrial-fdm
                confidence: secondary
              - id: c3
                text: Avoid holes below 1-2 mm unless post-machined or tested
                value: 1-2
                unit: mm
                source_url: https://www.hubs.com/knowledge-base/dfm-tips-for-3d-printed-parts-with-thin-walls/
                source_quality: secondary
                equipment: industrial-fdm
                confidence: secondary
              - id: c4
                text: For a nominal 5 mm rod model the hole about 5.2 mm
                source_url: https://web.archive.org/web/2024/https://www.secs.oakland.edu/~latcha/ME4999/3Dprinting.html
                source_quality: secondary
                equipment: desktop-fdm
                confidence: secondary
                machine_specific: true
                table_ref: dtree/process/additive/desktop-fdm/holes-and-clearances#c4
                measured_on: print shop own machines, not named
