            materials-machinability:
              id: process/cutting/cnc-mill/materials-machinability
              role: leaf
              domain: mech
              scale: macro
              coverage: deep
              summary: 'Material sets how forgiving thin walls, burrs and tolerances are: 6061 and brass mill easily, 303
                beats 304/316, and plastics melt, relax or absorb moisture. Pick the most machinable material the function
                allows and apply minimum wall, depth and tolerance rules conservatively.'
              when:
              - '6061 aluminium: default for brackets, housings, fixtures, prototypes'
              - '7075 aluminium: strength-to-weight matters more than cost or weldability'
              - 'free-machining steel: economical steel parts where corrosion resistance is secondary'
              - '303 stainless: stainless needed and machining ease matters, moderate environment'
              - '316 stainless: chloride, marine, chemical or medical service'
              - 'brass: fittings, electrical parts, small precision hardware'
              - 'POM: low-friction gears, bushings, precision plastic parts'
              - 'PEEK: only when temperature, chemical, wear or biocompatibility require it'
              - 'nylon: tough low-load wear parts where humidity is controlled or compensated'
              avoid_when:
              - avoid 304/316 for thin rubbing finishing cuts or where tool dwell is likely (work-hardening)
              - avoid nylon for tight tolerances unless moisture state is controlled
              - avoid PEEK for cost-driven parts
              - avoid 7075 for thin unbalanced parts prone to stress distortion
              variants:
              - 'aluminium: 6061, 7075'
              - 'steel and stainless: free-machining steel, 303, 304, 316'
              - 'copper alloy: brass'
              - 'plastics: POM, nylon, PEEK'
              tradeoffs:
              - 303 machines easily but has lower corrosion resistance and weldability than 304/316
              - 316 resists chlorides better but is slower and more demanding to mill than 303
              - 7075 is stronger than 6061 but costs more and distorts or burrs more readily
              - PEEK has top heat and chemical performance but is expensive and heat/stress sensitive; POM is more stable
                and cheaper
              howto:
              - Default to 6061 or brass for ease of machining; move to 7075/PEEK/316 only for a stated need.
              - Use ISO 2768-m for untoleranced dimensions and ISO 286 fits for functional bores, tolerancing only functional
                features.
              - Start from stress-relieved stock and rough symmetrically for thin aluminium and plastic parts.
              - In 304/316 use sharp tools, constant chip load, rigid workholding and avoid dwell.
              - For plastics clamp with broad soft jaws at low force, and condition nylon before final inspection.
              - Call out edge breaks and deburring on critical edges; avoid thin webs between holes.
              - Treat capability-level minimums (0.5 mm wall, 0.75 mm slot, 0.5 mm hole) as limits and go larger for production.
              issues:
              - issue: thin tall walls chatter, deflect and lose tolerance
                fix: thicken, shorten, add ribs, rough while stock is thick, finish lightly
                failure_mode: dimensional-error
              - issue: asymmetric stock removal distorts aluminium and plastics
                fix: stress-relieved stock, symmetric roughing, finish both sides in stages
                failure_mode: residual-stress
              - issue: 304/316 work-harden when the tool rubs or dwells
                fix: sharp tooling, adequate chip load, coolant, uninterrupted cuts
                failure_mode: dimensional-error
              - issue: plastic melts, smears or crushes in the clamp
                fix: sharp polished tools, air or coolant, low-force broad workholding
                failure_mode: warpage
              - issue: nylon dimensions drift with moisture
                fix: condition before inspection, compensate or choose POM
                failure_mode: dimensional-error
              - issue: burrs on thin edges and cross holes, tenacious in stainless
                fix: edge breaks, cutter exit planning, specified deburring
                failure_mode: burr
              - issue: sharp internal corners initiate fatigue cracks
                fix: fillets and corner reliefs
                failure_mode: notch
              - issue: voids or inclusions exposed in cast or composite stock
                fix: certified wrought stock for critical parts; inspect
                failure_mode: porosity
              - issue: directional properties of rolled or extruded stock
                fix: specify stock condition and grain direction
                failure_mode: anisotropy
              - issue: blind tapped holes threaded to the bottom damage taps
                fix: leave unthreaded relief and drill-point allowance
                failure_mode: assembly-error
