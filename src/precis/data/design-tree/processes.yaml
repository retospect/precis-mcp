        edm-wire:
          id: process/cutting/edm-wire
          role: process
          domain: mech
          scale: macro
          coverage: shallow
          equipment: any
          summary: Wire EDM cuts conductive material through its full thickness with a thin travelling wire, hardened or not,
            to a few hundredths of a millimetre in one pass and about 0.005-0.010 mm with skim cuts. Closed profiles need
            a start hole, inside corners can never be sharp, and the cut surface carries a recast layer.
          when:
          - hardened tool steel, carbide or other conductive stock needing a precise through profile
          - dies, punches, gears, fine slots and tapered die clearance
          - tight profile tolerance where little cutting force is needed
          avoid_when:
          - nonconductive material (plastic, glass, most ceramics)
          - blind pockets or 3D cavities (use milling or sinker EDM)
          - cheap open geometry or aluminium that milling makes faster
          - fatigue-critical surface that will keep the recast layer
          variants:
          - rough single pass versus multi-pass skim cutting for accuracy and finish
          - straight cut versus tapered cut with machine guides
          - standard 0.25 mm wire versus fine 0.10 mm wire for small radii
          tradeoffs:
          - 'vs milling: no cutting force and works on hardened stock, but through-cut only and slower'
          - 'vs sinker EDM: no shaped electrode needed, but cannot make blind cavities or true sharp inside corners'
          - 'vs laser/waterjet: far tighter tolerance, only conductive stock and slower'
          - 'vs grinding: good for profile, grinding still better for flatness and final size'
          howto:
          - Add one start hole (about 0.5 mm standard) in the scrap of every closed internal profile.
          - Draw inside corners with a radius of at least wire radius plus spark gap, for example R0.15 mm with 0.25 mm wire.
          - Make slots at least wire diameter plus two spark gaps wide.
          - State taper angle, reference datum and height; give both profiles if top and bottom differ.
          - Tolerance only functional profiles; specify skim pass count or Ra where it matters.
          - State edge, recast-layer removal and inspection requirements for fatigue or sealing surfaces.
          issues:
          - issue: sharp inside corner specified
            fix: specify a radius from the wire size, add a relief, or use sinker EDM
            failure_mode: notch
          - issue: closed window drawn with no start hole
            fix: add a start hole in the scrap or allow the supplier to drill one
            failure_mode: assembly-error
          - issue: slot narrower than wire plus gaps
            fix: widen to wire diameter plus two spark gaps or use a finer wire at higher cost
            failure_mode: dimensional-error
          - issue: tight precision tolerance on every edge
            fix: tolerance only functional profiles and use a general tolerance of about 0.05 mm elsewhere
            failure_mode: dimensional-error
          - issue: taper requested without datum or height
            fix: state angle, reference face, direction and height
            failure_mode: dimensional-error
          - issue: recast layer with microcracks on a fatigue surface
            fix: finishing passes, then polish, grind or lap the layer away
            failure_mode: fatigue
          - issue: residual tensile stress on the cut surface
            fix: low-energy skim passes and stress relief where compatible
            failure_mode: residual-stress
          - issue: stock stress or heat moves the part
            fix: rough symmetrically, stress-relieve, balance fixturing, leave finishing allowance
            failure_mode: warpage
          - issue: tall parts cut barrelled or tapered by wire deflection
            fix: more finishing passes, better flushing, specify straightness over actual height
            failure_mode: dimensional-error
          - issue: burrs and flakes at entry and exit edges
            fix: specify deburr or chamfer and inspect both faces
            failure_mode: burr
          - issue: pores in the recast layer act as crack starters
            fix: reduce pulse energy, add finishing passes, remove or qualify the layer
            failure_mode: porosity
          rules:
          - id: c1
            text: Provide at least one start hole per closed internal profile; representative standard hole
            source_url: https://firmfg.com/cnc-machining/wire-edm
            source_quality: primary
            equipment: any
            confidence: handbook
            machine_specific: true
