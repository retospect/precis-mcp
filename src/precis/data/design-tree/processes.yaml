            setups-and-undercuts:
              id: process/cutting/cnc-mill/setups-and-undercuts
              role: leaf
              domain: mech
              scale: macro
              coverage: deep
              summary: Every extra setup or face orientation costs fixturing time and adds datum error, so feature layout,
                tool access and undercut tooling decide most milling cost. Design so features face one or two directions,
                use standard undercut cutter sizes, and leave clamping lands or sacrificial tabs.
              when:
              - '3-axis: prismatic parts with features reachable along the six principal directions'
              - '3+2 indexing: angled planar faces and holes that each need only a fixed tool orientation'
              - 'simultaneous 5-axis: compound surfaces, deep obstructed features, or many faces tied to one datum'
              - 'T-slot, dovetail, Woodruff or lollipop cutter: an undercut that cannot be redesigned away'
              avoid_when:
              - avoid undercuts of nonstandard width (custom cutter) or deeper than 2x their width
              - avoid features scattered over many faces when a datum relationship matters
              howto:
              - Aim for 1-2 setups; orient features to share two opposing directions and one set of datums.
              - Put critical features that must relate to each other in the same setup, or use 3+2/5-axis.
              - Use whole-millimetre or standard inch undercut widths so an existing cutter fits.
              - Keep undercut depth to at most 2x width and leave side clearance of about 4x depth for the arbor.
              - Where possible replace an undercut by an open slot, chamfer, split part or standard dovetail.
              - Add flat parallel clamping lands (about 3-5 mm) and a stop face, or a sacrificial tab/gripper stub for parts
                with no clampable surface.
              - Place tabs on non-functional surfaces, wide and short, and leave a finishing allowance for tab removal.
              - Use soft jaws, vacuum or a fixture plate rather than clamping on thin or finished surfaces.
              issues:
              - issue: features on many faces force many setups and stack datum errors
                fix: reorient so features face one or two directions; consolidate datums; or use 3+2/5-axis
                failure_mode: dimensional-error
              - issue: undercut with nonstandard width or insufficient arbor clearance
                fix: use standard cutter widths, add clearance, expose the feature from another direction
                failure_mode: assembly-error
              - issue: no place to clamp the part
                fix: add tabs, dovetail/gripper stub or clamping lands; or design a soft-jaw interface
                failure_mode: dimensional-error
              - issue: clamping force distorts thin or partly machined parts
                fix: soft jaws or vacuum, support near the cut, keep stock until late, finish the flexible features last
                failure_mode: warpage
              - issue: unsupported thin walls and long tools chatter
                fix: shorten stickout, bigger cutter, add ribs or tabs, light finishing cuts
                failure_mode: dimensional-error
              - issue: one-sided stock removal releases residual stress
                fix: stress-relieved stock, symmetric roughing, finish critical faces last
                failure_mode: residual-stress
              - issue: burrs at exit edges and hole intersections
                fix: edge breaks, provide deburr access, avoid critical edges as exit edges
                failure_mode: burr
              - issue: sharp internal corners concentrate stress and need tiny cutters
                fix: add radii larger than the minimum cutter radius, reliefs or chamfers
                failure_mode: notch
              rules:
              - id: c1
                text: design for one to two setups; six or fewer is common but each extra setup adds fixturing and re-referencing
                  cost
                value: 1-2
                unit: setups
                source_url: https://www.fictiv.com/help/getting-started/optimizing-part-design-for-cnc-machining
                source_quality: secondary
                equipment: cnc-mill
                confidence: shop-rule
                note: no primary source found or source weak; guidance only, not DRC-enforceable
