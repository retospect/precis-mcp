        powder-bed:
          id: process/additive/powder-bed
          role: process
          domain: mech
          scale: macro
          coverage: shallow
          equipment: industrial-fdm
          summary: Polymer powder bed fusion (SLS, MJF, mostly PA12) needs no supports because powder holds the part, so it
            suits complex tough nylon parts, but walls, gaps, powder escape and warpage still set the rules. Numbers vary
            by machine and bureau; first-article the critical fits.
          when:
          - complex or nested geometry in tough nylon, no support structures wanted
          - functional prototypes and low-volume production, more isotropic than FDM
          avoid_when:
          - precision bores, sealing faces or bearing seats as printed (machine them)
          - large thin flat panels prone to warp
          - very high volume where moulding wins
          - very fine cosmetic detail where SLA is better
          variants:
          - SLS (laser, about 0.10 mm layer) versus MJF (about 0.08 mm layer, smaller minimum wall and feature)
          - PA12, PA11, glass-filled and carbon-filled PA12, TPU
          tradeoffs:
          - 'vs SLA: tougher and no supports, rougher surface and larger minimum features'
          - 'vs FDM: more isotropic and support-free, higher cost per part for single pieces, cheaper when nested'
          - 'vs CNC: free internal geometry but machine critical interfaces afterwards'
          howto:
          - Use 0.8-1.0 mm walls for plain PA12 and 2 mm or more where the wall carries load.
          - Hollow thick masses to 2-5 mm walls and add at least two powder escape holes of 5 mm (3.5 mm minimum) connected
            to every cavity.
          - Leave 1.0 mm between separate features and 0.3-0.5 mm clearance in printed-in-place moving joints.
          - Rib or curve large flat panels and keep thickness uniform to limit warpage.
          - Print bores with machining allowance and ream critical holes; tolerance only functional features.
          - Confirm shrinkage compensation and tolerance with the bureau and qualify a first article.
          issues:
          - issue: large flat thin panels warp from uneven cooling
            fix: add ribs, beads, curvature or a frame, shorten unsupported spans, let the bureau choose orientation
            failure_mode: warpage
          - issue: thick solid blocks retain heat and sink or distort
            fix: hollow to 2-4 mm (MJF) or 3-5 mm (SLS) walls and add ribs instead of mass
            failure_mode: sink
          - issue: enclosed cavity traps unsintered powder
            fix: at least one 3.5 mm escape hole, preferably two or more 5 mm, with a clear path to each volume
            failure_mode: assembly-error
          - issue: walls designed at the absolute machine minimum
            fix: 0.8-1.0 mm for plain PA12, 2 mm or more if structural
            failure_mode: overload
          - issue: moving parts designed with zero clearance fuse together
            fix: start at 0.3-0.5 mm clearance and tune on a coupon
            failure_mode: assembly-error
          - issue: bore expected to be precision as printed
            fix: print undersize with allowance and drill or ream
            failure_mode: dimensional-error
          - issue: sharp internal corners and abrupt thickness changes
            fix: fillets, gussets and gradual transitions
            failure_mode: notch
          - issue: strength and accuracy differ by build direction
            fix: orient major loads favourably and avoid thin Z-oriented walls
            failure_mode: anisotropy
          - issue: marginal walls and thin isolated features fuse incompletely
            fix: use robust wall thickness; do not assume pressure tightness without sealing
            failure_mode: porosity
          - issue: powdery rough edges and adhered powder
            fix: specify blasting, tumbling or machining; keep features at least 0.762 mm (SLS) or 0.508 mm (MJF)
            failure_mode: burr
