            pockets-and-thin-walls:
              id: process/cutting/cnc-mill/pockets-and-thin-walls
              role: leaf
              domain: mech
              scale: macro
              coverage: deep
              summary: 'Pocket depth, wall thickness and floor thickness are limited by cutter stiffness and part stiffness,
                not by a fixed physical number. Starting rules: pocket depth up to 5 times tool diameter, metal walls from
                0.5 mm, plastic walls from 1.0 mm, wall height within 2 times thickness.'
              howto:
              - Keep pocket depth within 5 times the cutter diameter; go to 10 times only after the supplier agrees, and deeper
                in plastic (15) than in steel (5).
              - Keep pocket width to depth at least 1:6 and prefer a wider pocket or a bigger radius so a stiffer cutter fits.
              - Start metal walls at 0.5 mm or more and plastic walls at 1.0 mm or more, and thicken as wall height grows.
              - Keep wall height to about 2 times thickness (or width to height 3:1, whichever is stricter); add 1 to 3 degrees
                of draft on tall walls.
              - Keep the pocket floor thicker than the minimum wall rule and check floors by stiffness, not by a catalogue
                minimum.
              - Rough while the wall is still thick, leave stock, then finish with light cuts; remove material symmetrically.
              - Call out edge breaks explicitly so the supplier does not guess.
              issues:
              - issue: Deep narrow pocket
                fix: Widen, reduce depth, enlarge radius, split the part or machine from the other side
                failure_mode: excess-deflection
              - issue: Wall drawn at the quoted absolute minimum
                fix: Use 0.5 mm metal and 1.0 mm plastic as practical starts, then add thickness with height
                failure_mode: warpage
              - issue: Thin wall machined after all surrounding support is gone
                fix: Rough first, leave stock, finish with light controlled cuts
                failure_mode: excess-deflection
              - issue: Opening a deep pocket or one-sided removal releases stock stress
                fix: Use stress-relieved stock, balance removal, rough both sides, add ribs
                failure_mode: residual-stress
              - issue: Long tool stick-out causes chatter and ripples
                fix: Shorten the tool, enlarge cutter, lower wall height, split rough and finish passes
                failure_mode: dimensional-error
              - issue: Exit edges and interrupted cuts leave burrs
                fix: Specify chamfers and the deburring process only where needed
                failure_mode: burr
              - issue: Sharp inside corners and abrupt thickness steps
                fix: Generous fillets and gradual transitions; size structural fillets for fatigue separately from the cutter
                  radius
                failure_mode: notch
              - issue: Plastic treated like aluminium melts, smears or creeps
                fix: Sharp tools, low heat, support thin sections, allow for shrinkage and creep
                failure_mode: warpage
              - issue: Large pocket cut from a thick billet wastes time and stock
                fix: Use thinner stock or a near-net blank
                failure_mode: dimensional-error
              rules:
              - id: c1
                text: Prefer pocket depth at most 5 times tool diameter; 10 times is extended reach at higher cost and breakage
                  risk
                value: 5; 10
                unit: x D
                source_url: https://www.fictiv.com/help/getting-started/optimizing-part-design-for-cnc-machining
                source_quality: primary
                equipment: cnc-mill
                confidence: handbook
              - id: c2
                text: 'Practical pocket depth limits by material: steel 5 times, aluminium 10 times, plastics 15 times tool
