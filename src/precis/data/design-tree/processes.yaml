            overhangs-bridges-supports:
              id: process/additive/desktop-fdm/overhangs-bridges-supports
              role: leaf
              domain: mech
              scale: macro
              coverage: deep
              summary: Design self-supporting faces to 45 degrees from vertical, keep bridges to about 5 mm unless the machine
                has passed a bridge test, and swap downward fillets for 45 degree chamfers. Horizontal round holes need a
                teardrop, a diamond or a drill-out.
              when:
              - 'teardrop or diamond hole: bore need not be truly circular and printing without support matters'
              - 'drill or ream after printing: a true circular fit or bearing bore is required'
              avoid_when:
              - teardrop for a precision bearing bore (not cylindrical)
              howto:
              - State the angle reference (from vertical or from the plate) in every overhang rule.
              - Keep faces within 45 degrees of vertical; replace flat undersides and T shelves with 45 degree chamfers.
              - Use a chamfer, not a fillet, on downward-facing edges.
              - Keep bridges to about 5 mm; run a bridge test on the machine before going longer.
              - Orient precision round holes with the axis vertical; otherwise use a teardrop with a 45 degree apex or a diamond
                profile.
              - Leave about 5 mm of access where support must be pulled by hand; put supports on hidden faces.
              - Add vents or openings so support is never trapped in a closed cavity.
              issues:
              - issue: Flat underside or T-shaped shelf sags and curls
                fix: 45 degree chamfer, rib, rotate or support
                failure_mode: dimensional-error
              - issue: 45 degrees assumed universal
                fix: Run an overhang test per material, nozzle and cooling
                failure_mode: dimensional-error
              - issue: Bridge treated as overhang droops
                fix: Shorten, add rib, split, slow, cool or support
                failure_mode: dimensional-error
              - issue: Horizontal circular hole droops
                fix: Vertical axis, teardrop, diamond, support or drill
                failure_mode: dimensional-error
              - issue: Support hidden in closed cavity
                fix: Removal openings, split, soluble or tree support
                failure_mode: assembly-error
              - issue: Support on cosmetic or datum face
                fix: Move to hidden face, split, support interface
                failure_mode: dimensional-error
              - issue: Downward fillet becomes steep overhang
                fix: 45 degree chamfer
                failure_mode: dimensional-error
              - issue: Diamond hole corners concentrate stress
                fix: Fillet the corners
                failure_mode: notch
              - issue: Large flat ABS or nylon part lifts
                fix: Enclosure, brim, rounded corners, ribs, low-shrink material
                failure_mode: warpage
              - issue: Load across layers
                fix: Principal tensile load within layers
                failure_mode: anisotropy
