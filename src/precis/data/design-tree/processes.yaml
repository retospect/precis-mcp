    forming:
      id: process/forming
      role: method
      def: change shape without removing material (DIN 8580 group 2 and 4, forming)
      children:
        sheet-metal-bending:
          id: process/forming/sheet-metal-bending
          role: process
          domain: mech
          scale: macro
          coverage: shallow
          equipment: sheet
          summary: 'Press-brake bending of flat blanks into brackets and enclosures. Design rules scale with thickness T:
            inside radius from about 1T, flanges from about 4T, holes 2.5T+R from a bend, with relief at bend ends. Angle
            tolerance is about +-1 degree, so dimension across bends loosely.'
          when:
          - straight-bend brackets, covers and enclosures in prototype to medium quantity
          - laser-cut blank plus standard tooling avoids any die cost
          - constant-thickness sheet part with a few bends in the same direction
          avoid_when:
          - 'thousands of identical complex formed parts: progressive stamping amortises the die'
          - 'long constant profiles: roll forming; hollow deep shapes: deep drawing'
          - tolerances of machined-part class across many bends
          variants:
          - air bending (springback, K-factor depends on setup)
          - bottoming and coining (tighter angle, more tonnage)
          - hems and returns for stiffness
          tradeoffs:
          - Fewer bends, one standard radius and same-direction bends cut setup cost.
          - Tighter angle or position tolerance than standard raises price.
          - Stamping or machining beat bending only at volume or where tolerance stack-up over several bends is too large.
          howto:
          - Start with an inside radius R of at least 1T; raise it for hard stainless, high-strength steel and bends along
            the rolling direction.
          - Standardise on one radius, for instance 0.76, 1.52, 2.29 or 3.05 mm, so the shop does not change punches.
          - Make flanges at least 4T (3T absolute); use the thickness-specific nT+R table for short flanges.
          - Keep holes at least 2.5T+R from a bend and slots at least R+4T.
          - Add relief at bend ends at least T wide and about 1.5T deep, running past the bend line.
          - Dimension from formed datums and accept the larger tolerance across several bends.
          - Take the K-factor from the shop's own tooling; use DIN 6935 only with the right material and grain table.
          issues:
          - issue: Radius below 1T with unchecked alloy cracks or creases the outside of the bend
            fix: R of at least 1T, larger for hard temper; bend across the grain
            failure_mode: brittle-fracture
          - issue: Flange shorter than the tool support limit rolls or marks
            fix: Flange of 4T or the nT+R table value
            failure_mode: assembly-error
          - issue: Hole or slot near a bend ovalises or tears
            fix: 2.5T+R for holes, R+4T for slots, or cut after forming
            failure_mode: dimensional-error
          - issue: No relief where flanges meet bulges and tears
            fix: Relief at least T wide, about 1.5T deep
            failure_mode: notch
          - issue: Springback and rolling-direction anisotropy shift the final angle
            fix: Calibrate overbend, fix K-factor per setup, state grain direction
            failure_mode: anisotropy
          - issue: Laser or punched edges leave burrs and a heat-affected zone
            fix: State edge break and deburr; keep fatigue-critical edges away from cut burrs
            failure_mode: burr
          - issue: Tolerance stack-up across several bends
            fix: Datum on a formed face, allow +-0.76 mm across 3+ bends
            failure_mode: dimensional-error
          - issue: Multi-bend parts twist or warp
            fix: Symmetric geometry, balanced sequence, add hems or beads to flexible panels
            failure_mode: warpage
          rules:
          - id: c1
            text: General minimum inside bend radius R >= 1T
            value: '1'
            unit: x thickness
            source_url: https://f.hubspotusercontent00.net/hubfs/340051/Xometry%20Sheet%20Metal%20Design%20Guide%202020.pdf
            source_quality: primary
            equipment: sheet
            confidence: handbook
