        industrial-fdm:
          id: process/additive/industrial-fdm
          role: process
          domain: mech
          scale: macro
          coverage: shallow
          equipment: industrial-fdm
          summary: 'Industrial FDM (Stratasys class, heated chamber, ULTEM, PC, soluble support) differs from desktop FDM
            mainly in repeatability, engineering materials and support options, not in basic geometry rules: walls are about
            4 layer heights, overhangs about 45 degrees, holes print undersize. Still anisotropic, still not a machining substitute.'
          when:
          - high-temperature or engineering thermoplastic (ULTEM 9085, PC, ASA) functional part
          - enclosed cavities or channels that need soluble support
          - jigs, fixtures, tooling, low-volume end-use parts larger than SLA/SLS envelopes
          avoid_when:
          - tight datums, bearing seats or sealing faces without post-machining
          - load across the layer direction or sustained high stress (creep)
          - production volumes that justify moulding
          variants:
          - breakaway support (ULTEM 9085 in the cited system) versus soluble support (PC and others)
          - service-bureau industrial FDM versus bureau prototyping FDM with larger envelope and looser accuracy
          tradeoffs:
          - 'vs desktop FDM: heated chamber, better repeatability and materials, much higher machine and material cost'
          - 'vs SLS/MJF: cheaper for large simple parts, more anisotropic with visible layers'
          - 'vs CNC: cheaper for complex shapes, far looser tolerance'
          howto:
          - Choose machine and material first; set wall thickness near 4 times layer height (about 1.0 mm at 0.254 mm layers).
          - Keep slopes within about 45 degrees from vertical or chamfer; define the angle datum on the drawing.
          - Model holes oversize or leave stock and drill or ream critical holes.
          - Put principal tensile, bending and peel loads in the XY plane.
          - Add radii, ribs and uniform walls on large flats; avoid sharp internal corners.
          - For sealed cavities add drain access or use soluble support, and plan washing and drying.
          issues:
          - issue: load across layers fails at the weak Z bond
            fix: rotate part so loads lie in XY, add ribs and fillets, use fasteners
            failure_mode: anisotropy
          - issue: large flat bases and uneven cooling warp
            fix: heated chamber, corner radii, ribs, uniform wall, smaller flats
            failure_mode: warpage
          - issue: holes print undersize and oblong
            fix: oversize after a coupon, teardrop horizontal holes, or drill and ream
            failure_mode: dimensional-error
          - issue: sharp internal corners initiate cracks
            fix: fillets, chamfers, gussets, gradual section change
            failure_mode: notch
          - issue: support trapped in sealed cavity
            fix: drain openings, split the part, or soluble support with access for solution flow
            failure_mode: assembly-error
          - issue: gaps between rasters and sparse infill leave pores that act as stress raisers
            fix: qualified material profile, enough walls, dry filament, solid region around load paths
            failure_mode: porosity
          - issue: sustained stress on thermoplastic creeps
            fix: lower stress, larger section, metal inserts, higher-temperature material
            failure_mode: creep-preload-loss
          - issue: thin unsupported walls
            fix: multiple perimeters, ribs or box section
            failure_mode: overload
          - issue: elephant foot and support scars roughen edges
            fix: bed-edge chamfers, elephant-foot compensation, cosmetic faces away from supports
            failure_mode: burr
