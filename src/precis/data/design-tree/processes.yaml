            threads-and-inserts:
              id: process/additive/desktop-fdm/threads-and-inserts
              role: leaf
              domain: mech
              scale: macro
              coverage: deep
              summary: Heat-set inserts are the default for repeated assembly; captive nuts and through-bolts for high or
                cyclic load; self-tapping screws for one-off assembly; printed threads only for large, lightly loaded parts.
                Size every hole from the insert or screw maker's datasheet, then validate with a coupon.
              when:
              - 'heat-set insert: repeated assembly, small threads, tight tolerance'
              - 'captive nut or through-bolt: high or cyclic load, plastic mostly in compression'
              - 'self-tapping screw: one-time or low-cycle assembly'
              - 'printed thread: large, lightly loaded closure or adjustment'
              avoid_when:
              - printed thread for repeated high-torque assembly
              - PLA with heat-set inserts in warm environments
              howto:
              - Take the hole size from the insert maker's datasheet; do not derive it from the screw diameter.
              - Make the blind hole deeper than the insert, insert length plus about 1 mm, as escape volume for displaced
                plastic.
              - Give the insert boss at least 1.5 mm wall, ideally about one insert diameter, with a base fillet and ribs.
              - Install inserts square with a guided tip, press or drill-press quill at controlled temperature.
              - Size self-tapper pilot holes from the screw maker's plastic table; boss at least 2 times screw diameter.
              - Make captive nut pockets 0.2-0.4 mm over across-flats and deeper than nut thickness by the same.
              - Use at least 3 solid top layers over sparse infill.
              issues:
              - issue: Insert hole sized from screw diameter
                fix: Use the insert maker's hole spec and a coupon
                failure_mode: assembly-error
              - issue: Boss too thin cracks or ovalises
                fix: 1.5 mm wall minimum, ribs and fillet
                failure_mode: brittle-fracture
              - issue: Insert installed at an angle
                fix: Guided tip or press
                failure_mode: assembly-error
              - issue: Self-tapper pilot hole too small splits boss
                fix: Enlarge toward maker table and boss
                failure_mode: overload
              - issue: Self-tapper pilot hole too large
                fix: Reduce so threads form
                failure_mode: loosening
              - issue: Printed thread worn by repeated torque
                fix: Insert, captive nut or through-bolt
                failure_mode: wear-fretting
              - issue: Sustained clamp load on plastic threads creeps
                fix: Captive nut or through-bolt, washer, bigger boss
                failure_mode: creep-preload-loss
              - issue: Nut pocket modelled at nominal size
                fix: Add 0.2-0.4 mm over across-flats
                failure_mode: assembly-error
              - issue: No escape volume under insert
                fix: Deeper hole or through-hole
                failure_mode: assembly-error
              - issue: Fastener hole near edge tears out
                fix: 1.5-2 times wall to edge, larger boss
                failure_mode: overload
              - issue: Sharp boss-to-wall corner
                fix: Fillet, gusset or rib
                failure_mode: notch
              - issue: Too few top layers sag over infill
                fix: At least 3 solid top layers
                failure_mode: sink
              - issue: Horizontal small hole undersized or oval
                fix: Reorient, teardrop, oversize or drill
                failure_mode: dimensional-error
