        edm-sinker:
          id: process/cutting/edm-sinker
          role: process
          domain: mech
          scale: macro
          coverage: shallow
          equipment: any
          summary: Sinker (ram) EDM burns a graphite or copper electrode into conductive stock to make blind 3D cavities,
            deep ribs and tight corners that milling cannot reach, at the price of electrode cost, slow burns and a recast
            layer. The answer mixes in injection-mould rib rules; only the EDM rules apply to the process.
          when:
          - mould and die cavities in hardened steel, deep narrow ribs, blind features
          - small internal radii or textured surface finish not millable
          avoid_when:
          - geometry millable cheaply (rounded ribs instead of knife edges)
          - through profiles (wire EDM) or nonconductive stock
          - 'mirror finish needed in production: fine EDM finishing reaches Ra 0.1-0.2 um but is slow; polishing is usual'
          variants:
          - roughing, semi-finishing and finishing burns with separate electrodes
          - graphite (complex, low mass) versus copper (fine detail, smooth finish) electrodes
          - orbiting and stepped pulses to control taper in deep slots
          tradeoffs:
          - 'vs milling: reaches sharp corners and hardened steel, but needs electrodes and is slower'
          - 'vs wire EDM: makes blind cavities, but needs a shaped electrode and wears it'
          - 'vs polishing: EDM is quick for texture, fine cosmetic finish still needs polishing'
          howto:
          - Model the electrode as the cavity negative including spark gap and wear compensation.
          - Specify R0.10-R0.20 mm instead of sharp corners; budget a finishing electrode below about R0.20 mm.
          - Keep rib depth to roughly 10-15 times rib width and add flushing holes of 2-4 mm in deep cavities.
          - Call out Ra or VDI only on functional surfaces; leave other areas at rough burn texture.
          - State maximum recast layer or 'recast removed', and leave 0.025-0.050 mm per side where it must be ground off.
          - Give electrode access and withdrawal direction for every feature.
          issues:
          - issue: sharp corners with no radius or process sequence
            fix: give a functional radius, R0.10-R0.20 mm, and budget a finishing electrode for smaller
            failure_mode: notch
          - issue: deep narrow rib with no flushing
            fix: widen, shorten, split the insert, add flushing or use stepped or orbital burning
            failure_mode: dimensional-error
          - issue: recast layer and microcracks reduce fatigue or corrosion performance
            fix: low-energy finishing then polish, stone or grind the critical surface
            failure_mode: fatigue
          - issue: tensile residual stress in the thermally altered layer
            fix: low-energy finishing passes and removal of the layer
            failure_mode: residual-stress
          - issue: electrode wear and poor flushing taper deep walls and enlarge corners
            fix: wear-compensated electrodes, staged burning, shorter electrodes
            failure_mode: dimensional-error
          - issue: debris trapped in sealed deep pockets causes unstable discharge and pits
            fix: flushing, venting and access
            failure_mode: porosity
          - issue: fine finish demanded over a whole large cavity
            fix: limit fine Ra or VDI to sealing, cosmetic or mating faces
            failure_mode: dimensional-error
          - issue: damaged edges and adhered debris after burning
            fix: inspect edges, remove debris and damaged lips
            failure_mode: burr
          - issue: mould-part sink, warpage and anisotropy are moulding defects, not EDM defects
            fix: apply rib, wall and cooling rules to the plastic part, EDM rules to the mould cavity
            failure_mode: sink
          rules:
          - id: c1
            text: 'Sinker EDM tolerance: about +-0.025 mm standard (Noramark); +-0.004 mm is a best case (Xometry)'
            source_url: https://www.xometry.com/capabilities/sinker-edm/
