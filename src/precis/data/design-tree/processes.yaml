                source_quality: primary
                equipment: desktop-fdm
                confidence: handbook
              - id: c3
                text: Absolute minimum wall is one extrusion width, about 0.45 mm
                value: '0.45'
                unit: mm
                source_url: https://help.prusa3d.com/article/modeling-with-3d-printing-in-mind_164135
                source_quality: primary
                equipment: desktop-fdm
                confidence: handbook
              - id: c4
                text: Practical wall for useful parts 0.8-1.0 mm (2-3 nozzle diameters)
                value: 0.8-1.0
                unit: mm
                source_url: https://www.hubs.com/knowledge-base/what-is-fdm-3d-printing/
                source_quality: secondary
                equipment: desktop-fdm
                confidence: secondary
              - id: c5
