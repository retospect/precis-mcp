            orientation-and-anisotropy:
              id: process/additive/desktop-fdm/orientation-and-anisotropy
              role: leaf
              domain: mech
              scale: macro
              coverage: deep
              summary: Put tensile, bending and snap-fit loads in the layer plane (XY), never across layers. Quoted XY-to-Z
                strength ratios run from 15-40 percent loss up to 4-5 times, so the ratio is material and machine specific;
                split parts so each piece prints in its best direction.
              when:
              - 'split the part: one orientation cannot put every critical load in XY, avoid support and fit the build volume'
              avoid_when:
              - split at the point of highest bending moment
              howto:
              - Run the tensile force along deposited roads; keep the load path and thin tabs or hooks parallel to the plate.
              - For bending, put the tensile face and long axis in XY and add ribs on the non-cosmetic side.
              - Print hooks, tabs and snap arms flat or sideways so they do not peel along Z.
              - Raise perimeters, not infill, to strengthen a part; align them with the load.
              - Split a housing or long beam so each half has its strongest direction on its local load; join with dovetails,
                pins, screws or adhesive.
              - Orient precision holes through XY; drill, ream or insert for critical fits.
              - Replace every generic number with a measured coupon before releasing a load-bearing part.
              issues:
              - issue: Loading a part across Z layers
                fix: Reorient, more perimeters, ribs, or split and reassemble
                failure_mode: anisotropy
              - issue: Solid infill used to fix a poor load path
                fix: Increase perimeters and align with load
                failure_mode: anisotropy
              - issue: Sharp internal corners and notches
                fix: Fillets or ribs; chamfer where a fillet would overhang
                failure_mode: notch
              - issue: Large flat beds and long thin walls warp
                fix: Round corners, ribs, brim or enclosure
                failure_mode: warpage
              - issue: Precision fit with zero clearance
                fix: About 0.2 mm per side, then coupon
                failure_mode: assembly-error
              - issue: Supports on cosmetic or datum faces
                fix: Reorient or move supports to sacrificial faces
                failure_mode: dimensional-error
              - issue: Elephant foot ruins base dimensions
                fix: Bottom chamfer or slicer compensation
                failure_mode: dimensional-error
              - issue: Porosity and air gaps between roads
                fix: Calibrate flow and temperature, more perimeters, solid near load entry
                failure_mode: porosity
              - issue: Layer valleys act as notches
                fix: Fillets, avoid abrupt sections, keep interfaces off peak stress
                failure_mode: notch
              - issue: Large single-piece print fails
                fix: Split into smaller pieces and bond or fasten
                failure_mode: warpage
              rules:
              - id: c1
