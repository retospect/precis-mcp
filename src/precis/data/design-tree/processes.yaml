            gates-weld-lines-warpage:
              id: process/primary-shaping/injection-mould/gates-weld-lines-warpage
              role: leaf
              domain: mech
              scale: macro
              coverage: deep
              summary: Put the gate in the thickest practical section, away from cosmetic faces and load paths, so melt flows
                thick to thin and packs. Weld lines, sink, warpage and trapped air are all consequences of where the gate
                sits and how uniform walls and cooling are; vent the last-to-fill areas.
              howto:
              - Gate into the thick section and let melt flow from thick to thin so packing reaches the heavy parts before
                the gate freezes.
              - Keep gates off cosmetic faces and out of high-load paths; start edge or tab gates at 50 to 80 percent of the
                wall at the gate.
              - Predict where flow fronts meet around holes, posts and ribs, and keep those weld lines out of tensile, impact
                or pressure paths.
              - On long or large parts add gates or a hot runner and balance fill, then confirm with flow simulation and short
                shots.
              - Keep walls uniform, core out bosses and pads, and keep ribs and boss walls at about 40 to 60 percent of the
                wall to limit sink and warpage.
              - Vent the last-to-fill regions, rib and boss tips, runner ends and weld locations; keep vent depth below the
                resin's flash threshold.
              - 'Treat fibre orientation as a design variable for filled resins: align flow with the load path and check cross-flow
                shrinkage.'
              issues:
              - issue: Solid thick pads, bosses or intersections
                fix: Core them out, use ribs or gussets, hold secondary walls near 40 to 60 percent of the main wall.
                failure_mode: sink
              - issue: Abrupt thick-to-thin transition
                fix: Ramp or core the change; keep transitions near a 3:1 maximum.
                failure_mode: warpage
              - issue: Gate on a cosmetic or structural area
                fix: Gate on a non-cosmetic low-stress region, use a tab or fan gate, or move into a thick section.
                failure_mode: overload
              - issue: Single gate on a large or long part
                fix: Add gates, enlarge runners, use a hot runner or redesign; verify by flow analysis.
                failure_mode: warpage
              - issue: Weld line crosses a boss, snap-fit or load path
                fix: Move the gate or feature, change gate count, or choose a stronger design or resin.
                failure_mode: overload
              - issue: No vents at end of fill
                fix: Add vents at last-fill zones, air traps, deep ribs and weld locations; validate with short shots.
                failure_mode: porosity
              - issue: Vents too deep
                fix: Reduce depth below the resin flash threshold.
                failure_mode: burr
              - issue: Unbalanced cooling or asymmetric ribs
                fix: Make wall mass and cooling symmetrical; rebalance channels; run warpage simulation.
                failure_mode: warpage
              - issue: Glass-filled resin with flow direction ignored
                fix: Orient gate and fibres deliberately; keep critical dimensions off strong fibre gradients.
                failure_mode: anisotropy
              - issue: Sharp internal corners and rib roots
                fix: Add fillets and blend ribs into walls.
                failure_mode: notch
              - issue: Shear, rapid skin freeze and uneven packing lock in stress
                fix: Larger smoother gates, uniform walls, draft, radii, controlled mould temperature.
                failure_mode: residual-stress
