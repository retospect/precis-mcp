            resin-selection:
              id: process/primary-shaping/injection-mould/resin-selection
              role: leaf
              domain: mech
              scale: macro
              coverage: deep
              summary: 'Choose the resin against the full load case: continuous and peak temperature, impact, sustained load
                (creep), chemicals, moisture and shrinkage, not tensile strength alone. PP is the cheap chemical-resistant
                hinge resin, ABS the general housing resin, PC the tough heat-resistant one, nylon and POM the wear and mechanism
                resins.'
              when:
              - 'low cost, chemical contact, living hinge or clip: PP'
              - 'general housing where toughness, appearance and cost matter: ABS'
              - 'high impact, transparency or higher temperature: PC, or PC/ABS as a compromise'
              - 'gears, bearings, latches and low-friction mechanisms: POM'
              - 'wear, toughness and oil resistance: PA6; stiff, creep-resistant, load-bearing parts: glass-filled PA66'
              - 'seals, grips, gaskets and soft-touch overmoulds: TPE'
              avoid_when:
              - PC where solvents are present (crazing, stress cracking)
              - unfilled nylon where tight dimensions are needed in changing humidity
              - PP or TPE for sustained load or high temperature (creep)
              - glass-filled nylon where isotropic shrinkage or low tool wear matters
              howto:
              - List continuous and peak temperature, impact, sustained stress, chemicals, moisture, UV and tolerance before
                choosing a resin.
              - Read the actual grade datasheet for HDT, moisture and shrinkage; catalogue numbers here are starting points.
              - Dry hygroscopic resins (nylon, PC) to the grade's moisture window and specify the conditioned dimension state.
              - For glass-filled grades align flow with the main load and design for the worse of flow and cross-flow.
              - Use PP for living hinges, POM or reinforced nylon for repeated snap or mechanism loads, and test at temperature.
              - Apply the wall, rib, boss and draft rules of the geometry nodes, adjusting for the resin's viscosity and shrinkage.
              issues:
              - issue: PC exposed to solvent or chemical
                fix: Use PP, POM or a compatible grade; lower moulded-in stress; test the real chemical.
                failure_mode: environmental-stress-cracking
              - issue: Nylon moulded undried
                fix: Dry and process within the grade moisture window; seal after drying.
                failure_mode: porosity
              - issue: Nylon dimensions change with absorbed moisture
                fix: Specify conditioned dimensions and measure at defined time and humidity.
                failure_mode: dimensional-error
              - issue: Snap-fit from a high-creep resin
                fix: Use PP hinge, POM or reinforced nylon and validate at temperature.
                failure_mode: creep-preload-loss
              - issue: Glass-filled nylon fibre direction ignored
                fix: Align flow with load; use multiple gates cautiously; design to worst direction.
                failure_mode: anisotropy
              - issue: Thick bosses, ribs or abrupt steps
                fix: Core out, use 40 to 60 percent walls, ramp transitions.
                failure_mode: sink
              - issue: Residual stress and sharp corners with PC or PC/ABS
                fix: Add radii, reduce ejection and packing stress, anneal where suitable.
                failure_mode: residual-stress
              - issue: Weld line or gate at a stressed feature
                fix: Move gate, add overflow, validate with flow analysis.
                failure_mode: overload
              - issue: Hot, loaded parts in low-HDT resin
                fix: Choose a higher-HDT or reinforced grade from the datasheet.
                failure_mode: softening
