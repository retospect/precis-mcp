                  factory; 10:1 is Xometry''s cost threshold for ordinary walls; 20:1 to 50:1 is what Protolabs says is possible
                  when wall thickness is near 1 mm and the wall is supported. Pick by wall thickness and support: use 2-3:1
                  for walls near the 0.5-0.8 mm minimum, 10:1 as a cost ceiling, higher only with a quote.'
