            slenderness-and-workholding:
              id: process/cutting/lathe/slenderness-and-workholding
              role: leaf
              domain: mech
              scale: macro
              coverage: deep
              summary: 'No universal limit: what counts is unsupported length over diameter. Rules of thumb run about 3x (chuck
                only), 4:1 (general), 8:1 (with tailstock), 10-20:1 (steady rest), with Swiss turning for small high-ratio
                parts. Plan bar size, parting and chuck grip into the design.'
              when:
              - 'High L/D with small diameter: Swiss turning with guide bushing'
              - 'Large, short or irregular part: chuck-turn from billet'
              - 'Straightness-critical long shaft: rough turn then grind between centres'
              avoid_when:
              - 'Mostly thin-walled, distortion-sensitive parts cut from solid bar: use tube, drawn, formed or near-net stock'
              howto:
              - Measure L/D from the last effective support to the cut, using the smallest effective diameter.
              - Add a centre hole (DIN 332) or a turned journal for a steady rest on any part past roughly 5-8 L/D.
              - Rough-turn a concentric journal before applying a steady rest; never rest on out-of-round stock.
              - Size the largest finished diameter to a standard bar and stay inside the bar-feeder and spindle-bore limit.
              - Keep critical front and back features in one setup or use a sub-spindle.
              - Leave 2-4 mm for the parting kerf and 0.5-2 mm facing allowance when working out bar length.
              - Support long or slender work before parting off; keep the parting setup short and rigid.
              issues:
              - issue: Support problem judged on total length instead of unsupported span
                fix: Review span from chuck, centre or rest to the cut
                failure_mode: buckling
              - issue: Long shaft held in chuck only
                fix: Shorter stick-out, live centre, steady or follow rest, or Swiss turning
                failure_mode: excess-deflection
              - issue: No centre feature for tailstock
                fix: Add centre-drill location or steady-rest journal
                failure_mode: assembly-error
              - issue: Steady rest on rough stock pushes part off-centre
                fix: Rough-turn a concentric journal first, use rollers or lubricated fingers
                failure_mode: dimensional-error
              - issue: Excess tailstock pressure bows the part
                fix: Controlled live-centre pressure and verified alignment
                failure_mode: buckling
              - issue: Parting without support
                fix: Rigid short parting setup, support or catch the part, deburr the parted face
                failure_mode: burr
              - issue: Taper and barrel shape on slender work
                fix: Lower L/D, add support, reduce cutting force
                failure_mode: excess-deflection
              - issue: Runout after rechucking
                fix: Finish concentric features in one setup, collet or soft jaws, or sub-spindle
                failure_mode: dimensional-error
              - issue: Residual stress in drawn or rolled bar moves the part
                fix: Stress-relieved stock, rough then finish, balanced removal
                failure_mode: residual-stress
              - issue: Thin walls spring or warp under chuck force
                fix: Thicker wall, soft jaws, less clamp force, symmetric removal
                failure_mode: warpage
              - issue: Sharp shoulders and grooves start fatigue cracks
                fix: Tool-compatible fillets, relief grooves, chamfers
                failure_mode: notch
              - issue: Wrought bar anisotropy not removed by turning
                fix: Specify bar condition and grain direction where strength matters
                failure_mode: anisotropy
