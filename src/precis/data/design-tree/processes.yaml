        plating-and-passivation:
          id: process/coating/plating-and-passivation
          role: process
          domain: mech
          scale: macro
          coverage: shallow
          equipment: any
          summary: Electroplated zinc, zinc-nickel and nickel add a metal layer that is thicker on edges and thinner in recesses;
            ISO 4042 governs thread allowance on steel fasteners. High-hardness steel needs hydrogen-embrittlement baking.
            Stainless passivation (ASTM A967) removes free iron and adds no thickness.
          when:
          - steel part or fastener needs sacrificial corrosion protection (zinc, zinc-nickel)
          - wear, chemical resistance or appearance on steel needs nickel; electroless nickel when internal surfaces need
            even coverage
          - stainless part has free iron, machining contamination or heat tint (passivation)
          avoid_when:
          - fatigue-critical steel above about 390 HV unless a validated bake and hydrogen test are specified
          - deep blind holes and narrow slots with electrolytic plating (recess width-to-depth under 3:1)
          - tight threads or fits that cannot absorb the coating and cannot be masked
          - expecting passivation to fix pits, burrs, weld scale or rough machining
          variants:
          - electrolytic zinc (ASTM B633) with conversion coat or sealer
          - zinc-nickel for higher corrosion and temperature performance
          - electrolytic nickel and engineering/electroless nickel (ASTM B689)
          - rack vs barrel plating
          - citric or nitric passivation of stainless (ASTM A967)
          tradeoffs:
          - Barrel plating is cheap for small robust fasteners; rack plating suits large, delicate or dimension-critical parts.
          - Electroless nickel coats recesses evenly but costs more and high-phosphorus deposits may be brittle under heavy
            stress.
          - Thicker coating improves corrosion life but eats thread allowance and raises edge build-up.
          - Passivation is cheaper than plating when stainless only needs free iron removed; use a coating if galling is the
            issue.
          howto:
          - 'Specify the finished state: substrate and hardness, coating standard, local and average thickness, conversion
            coat or sealer, test, and hydrogen treatment.'
          - For threads, choose the pre-plate tolerance position so the ISO 4042 coating stays inside the fundamental deviation
            (nominal coating at most a quarter of it).
          - Where the coating will not fit, plate before threading, mask, tap oversize, or change the thread tolerance.
          - Radius external edges (0.4 mm minimum, 0.8 mm preferred) and keep recess width over 3x depth.
          - Add a rack contact lug or hanging hole on a non-functional face, plus drain and vent holes in cavities.
          - For hardened fasteners, bake promptly after plating at a validated temperature below the tempering temperature.
          - Deburr and descale before passivation; call out ASTM A967 method, bath and test.
          issues:
          - issue: Plated 6H tapped hole or 6g bolt with no allowance
            fix: Use ISO 4042 allowance, plate before tapping, mask, or tap oversize
            failure_mode: assembly-error
          - issue: Zinc plated with no thickness, finish or test requirement
            fix: Specify coating system, local and average thickness, sealer, adhesion and corrosion tests
            failure_mode: environmental-degradation
          - issue: High-strength fastener or thread root takes up hydrogen during plating
            fix: Bake per ISO 4042 for hardness over 390 HV; verify 360-390 HV; remove notches and residual stress
            failure_mode: embrittlement
          - issue: Current crowding builds up on edges and starves recesses
            fix: Edge radius at least 0.4 mm, recess ratio over 3:1, auxiliary anode or electroless nickel
            failure_mode: dimensional-error
          - issue: Rack contact on a sealing, bearing or cosmetic face
            fix: Provide a sacrificial lug or hidden pad
            failure_mode: assembly-error
          - issue: Blind holes trap air and chemistry
            fix: Add drain and vent holes or larger openings
            failure_mode: porosity
          - issue: Over-baking changes temper, dimensions or coating adhesion
            fix: Validate the bake and stay below the original tempering temperature
            failure_mode: residual-stress
          - issue: Stainless passivation treated as a coating
            fix: Clean, descale, deburr first; specify ASTM A967 test
            failure_mode: environmental-degradation
          - issue: Burrs trap chemistry and over-plate
            fix: Deburr before plating
            failure_mode: burr
          - issue: Thick or poorly prepared deposits are porous and rough
            fix: Control thickness, prepare substrate, specify porosity test
            failure_mode: porosity
