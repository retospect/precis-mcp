        waterjet:
          id: process/cutting/waterjet
          role: process
          domain: mech
          scale: macro
          coverage: shallow
          equipment: sheet
          summary: Cold abrasive-jet cutting of almost any flat material, including glass, stone, composites and thick metal,
            with no heat-affected zone but with a tapered, striated kerf of about 1 mm. Accuracy is a few tenths of a millimetre
            on a standard head; good enough for blanks, not for fits.
          when:
          - material is thick (above about 6 mm) or reflective or heat-sensitive, so laser is a poor fit
          - material is glass, stone, ceramic, composite or laminate that must not be heated
          - any 2D profile in low to medium quantity, no tooling cost
          - no heat-affected zone, hardening or recast layer is acceptable
          avoid_when:
          - 'tolerance is tighter than about +-0.05 to 0.08 mm, or a square finished face is needed: waterjet oversize and
            finish-machine'
          - 'thin flat sheet in volume: laser is faster and cheaper'
          - 'only a few small round holes: drilling is cheaper and more accurate'
          - porous or soft material where garnet embedding is unacceptable
          variants:
          - conventional fixed head (taper 1 to 3 degrees, tolerance about +-0.13 to 0.25 mm)
          - dynamic or tilting head with taper compensation (about +-0.03 to 0.08 mm)
          - abrasive-first or low-pressure staged piercing for brittle material
          tradeoffs:
          - Slower than laser or plasma; speed falls sharply with thickness and with edge-quality setting.
          - Garnet abrasive and consumables dominate running cost.
          - Taper and striations mean the exit side of thick cuts is the worse side.
          - Each internal cutout needs its own pierce, so cost grows with feature count.
          howto:
          - Keep holes at least as large as the plate thickness and at least 1.5 times the kerf; about 1.5 mm is the practical
            floor.
          - Give slots 1.5 to 2 times the kerf and webs and tabs at least one plate thickness wide.
          - Put an internal corner radius of about one kerf width, or a relief where a narrow slot meets a corner.
          - State on the drawing whether a critical dimension applies at the entry or the exit face.
          - Pierce in scrap, from an edge or with an outside lead-in, never on the finished contour.
          - For glass, stone and laminates ask for low-pressure or abrasive-first piercing and a sacrificial backing.
          - Cut critical edges oversize and finish-machine them; keep tight tolerance to the functional features only.
          issues:
          - issue: Cut faces taper, wider at entry, and are not square
            fix: Specify the controlled face, use a dynamic head or finish-machine mating edges
            failure_mode: dimensional-error
          - issue: Full-pressure pierce cracks glass, stone or ceramic around the hole
            fix: Staged low-pressure or abrasive-first pierce, edge start, pierce in scrap
            failure_mode: brittle-fracture
          - issue: Layered composites delaminate and pull fibres at pierce and exit
            fix: Back the part, slow the cut, avoid piercing in finished regions
            failure_mode: impact
          - issue: Thin webs and isolated islands move or break during cutting
            fix: Widen webs, add temporary tabs, keep the part attached until late in the program
            failure_mode: dimensional-error
          - issue: Exit-side burrs on ductile metal and rounded entry edge
            fix: Finer cut setting, smaller standoff, deburr or machine functional edges
            failure_mode: burr
          - issue: Sharp internal corners wash out and notch the part
            fix: Radius about one kerf, lollipop relief
            failure_mode: notch
          - issue: Garnet embeds in porous or soft material
            fix: Mask or back the surface and clean, or choose a non-abrasive process
            failure_mode: environmental-degradation
          - issue: Thin sheet released from clamps or plate stress moves after cutting
            fix: Leave holding tabs, release symmetrically, stress-relieve critical flat parts
            failure_mode: residual-stress
