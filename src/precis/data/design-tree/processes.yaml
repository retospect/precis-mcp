            grooves-and-reliefs:
              id: process/cutting/lathe/grooves-and-reliefs
              role: leaf
              domain: mech
              scale: macro
              coverage: deep
              summary: 'Thread run-outs, grinding reliefs and retaining-ring grooves are standard-table features: pick the
                form (DIN 76-1, DIN 509, DIN 471/472), copy its dimensions, and size plain grooves to a stock insert width.
                DIN 76 and DIN 509 are not interchangeable.'
              when:
              - 'Many identical grooves or very high volume: form tool, gang tooling, rolling, stamping or cold forming beat
                single-point grooving'
              - 'Hardened finished shaft: rough-turn, heat-treat, grind, with DIN 509 reliefs for wheel run-out'
              avoid_when:
              - 'Internal groove with no tool access: use broaching, slotting, wire EDM or redesign'
              howto:
              - Choose the thread, grinding shoulder or retaining ring first, then copy the standard geometry onto the drawing.
              - Use DIN 76-1 for the run-out at a thread end and DIN 509 for a general shoulder or grinding relief; name form
                and size, for example E 0.6 x 0.3.
              - For a retaining ring take groove diameter, width and edge distance from the DIN 471 (shaft) or DIN 472 (bore)
                table, never from ring thickness plus a guess.
              - Make plain grooves a stock insert width; allow a roughing and finishing pass if narrower.
              - Keep groove corners sharp enough for ring seating but free of burrs; avoid a sharp-bottomed groove at a high-bending
                location.
              - Put internal grooves where the tool can reach, or open the bore; some services do not offer ID grooves.
              issues:
              - issue: Sharp shoulder where tool or wheel cannot reach
                fix: DIN 76 thread undercut or DIN 509 relief, form and size named
                failure_mode: assembly-error
              - issue: DIN 509 used for a thread run-out
                fix: DIN 76-1 for threads, DIN 509 only for shoulder or grinding relief
                failure_mode: assembly-error
              - issue: Retaining-ring groove too wide or with rounded load corners
                fix: Hold standard width, smallest practical corner radius; excess width lets ring tilt, rounded corners let
                  it dish or pop out
                failure_mode: lost-part
              - issue: Groove narrower than any stock insert
                fix: Pick the stock insert width first or allow rough plus finish pass
                failure_mode: dimensional-error
              - issue: Sharp-bottom groove at high bending or fatigue location
                fix: Standard ring geometry, controlled radius, or move groove away from maximum moment
                failure_mode: notch
              - issue: Burr at groove exit reduces ring seating width
                fix: Chamfer or deburr note; orient the cut so the burr forms off the functional edge
                failure_mode: burr
              - issue: Chatter in deep narrow grooves
                fix: Shorter overhang, support the work, less radial engagement, avoid very deep narrow grooves
                failure_mode: dimensional-error
              - issue: Residual stress from uneven stock removal
                fix: Symmetric removal, rough then finish critical groove diameters
                failure_mode: residual-stress
