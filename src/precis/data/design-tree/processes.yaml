        forging:
          id: process/forming/forging
          role: process
          domain: mech
          scale: macro
          coverage: shallow
          equipment: any
          summary: 'Closed-die (impression) forging gives dense parts with grain flow along the load path. Rules: draft 3
            to 7 degrees external and 7 to 10 internal, generous radii (6 to 13 mm fillets on a 25 mm rib), parting line at
            the largest section, 1.25 to 2.5 mm finish stock per surface. Numbers come mostly from the FIA Product Design
            Guide and vary by alloy and forge.'
          when:
          - fatigue- or impact-critical part where grain flow along the load path matters
          - medium to high quantity so the die cost amortises
          - rings and very large or very low quantities go to ring rolling or open-die forging instead
          avoid_when:
          - 'very low quantity: CNC hog-out, weldment or open-die'
          - 'sheet-like uniform thickness: stamping'
          - complex hollow or undercut geometry that would need side piercing or cores
          variants:
          - blocker, finished, near-net and net-shape forging
          - hammer versus press (press with knock-outs allows less draft)
          - open-die, ring rolling and cold forging as alternatives
          tradeoffs:
          - Tooling cost grows with impressions, preforms, small or non-uniform radii and tight tolerance.
          - Near-net and net shape cut machining but raise die cost.
          - Too much stock wastes material and machining; too little leaves scale or mismatch in the finished surface.
          howto:
          - Use draft of at least 3 to 5 degrees external and 7 to 10 internal; ferrous hammer forging needs 5 degrees or
            more.
          - Make fillets and corners as large as function allows, uniform, and scaled to rib height and alloy.
          - Put the parting line at the largest cross-section in one plane; avoid undercuts and transverse holes.
          - Keep close-tolerance features and datums in one die half.
          - Add 1.25 to 2.5 mm finish stock per surface plus draft; steel blockers about 5 mm per 300 mm.
          - Orient grain flow with the principal tensile and fatigue load and keep machining from cutting through it.
          - Specify properties in every relevant direction and add straightening allowance after heat treatment.
          issues:
          - issue: Sharp corners and abrupt sections cause laps, cold shuts and underfill
            fix: Larger uniform radii, tangent blends, better preform
            failure_mode: notch
          - issue: Properties differ along and across grain flow
            fix: Align flow with load; specify directional properties
            failure_mode: anisotropy
          - issue: Residual stress and heat-treatment distortion
            fix: Balanced sections, controlled quench, straighten or size after treatment
            failure_mode: residual-stress
          - issue: Suck-in opposite a filled projection
            fix: Balance opposing projections and volume distribution
            failure_mode: sink
          - issue: Uneven cooling, trimming and handling bend or twist the part
            fix: Fixtures, straightening and sizing step
            failure_mode: warpage
          - issue: Flash left at the parting line as a burr
            fix: Accessible trim line, specify flash removal
            failure_mode: burr
          - issue: Billet defects or poor consolidation leave internal porosity or inclusions
            fix: Sound billet, enough reduction, inspect critical parts
            failure_mode: porosity
          - issue: Too little draft or die-closure and mismatch ignored
            fix: Raise draft, add stock for closure and mismatch
            failure_mode: dimensional-error
