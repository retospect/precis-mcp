        urethane-casting:
          id: process/primary-shaping/urethane-casting
          role: process
          domain: mech
          scale: macro
          coverage: shallow
          equipment: any
          summary: Polyurethane resin cast (usually under vacuum) into room-temperature silicone moulds taken from a printed
            or machined master. Good for 10-100 production-like prototypes with thin walls and undercuts; accuracy is limited
            by the master, resin shrinkage and mould wear.
          when:
          - about 10-100 parts (up to about 200) with injection-moulded look or material simulation
          - parts with moderate undercuts and fine detail copied from a master
          avoid_when:
          - 1-5 parts (print directly)
          - hundreds to thousands (injection moulding)
          - tight stable tolerances or certified structural end-use parts
          - thick solid sections above about 13-25 mm without coring
          variants:
          - vacuum casting vs gravity pouring
          - rigid vs flexible polyurethane resins
          - FDM, SLA/DLP, SLS or machined masters
          - one-piece vs split silicone mould
          tradeoffs:
          - silicone moulds are consumable, about 20-25 castings each (10-50 range)
          - vacuum gives thinner walls and fewer bubbles than gravity
          - silicone flexibility allows near-zero draft and moderate undercuts without slides
          - the cast part cannot be more accurate than the master and the mould
          howto:
          - walls at least 1.0 mm (vacuum 1.0-1.5, gravity 1.5-2.0), nominal 1.5-4 mm
          - keep solid sections under about 13 mm unless reviewed; core out or rib thicker masses
          - make ribs 50-60% of the adjoining wall and transitions gradual (about 1:3)
          - draft 0.5-1 deg typical, 1-3 deg for release or mould life, 1 deg extra per 0.001 in texture
          - radius re-entrant undercut edges at least 1 mm and review each undercut's stripping path
          - plan for +-0.25 mm or +-0.5% of master dimension, whichever is greater; machine critical interfaces afterwards
          - for FDM masters use at least 0.8-1.0 mm walls on a 0.4 mm nozzle and seal and sand the surface
          - put the parting line on a noncritical surface with alignment features
          issues:
          - issue: thick bosses and solid masses give exotherm voids and sink
            fix: core out, ribs below 60% of wall, keep sections under about 13 mm
            failure_mode: sink
          - issue: abrupt wall changes cause differential shrinkage and warpage
            fix: uniform walls, gradual 1:3 transitions, full cure before demoulding
            failure_mode: warpage
          - issue: bubbles from entrapped air, moisture or poor venting
            fix: degas, dry materials, vent high points, use vacuum casting
            failure_mode: porosity
          - issue: deep or textured faces with zero draft raise strip force and tear the mould
            fix: add 0.5-1 deg or more, soften undercuts, split the mould
            failure_mode: dimensional-error
          - issue: sharp corners and knife edges concentrate stress and tear silicone
            fix: fillets, at least 1 mm at re-entrant undercut edges
            failure_mode: notch
          - issue: FDM master layer lines transfer to the casting and master anisotropy affects accuracy
            fix: orient the master for finish, seal and sand it, do not treat the print as the dimensional authority
            failure_mode: anisotropy
          - issue: differential cure and constrained demoulding leave residual stress
            fix: uniform walls, radiused corners, post-cure in a fixture
            failure_mode: residual-stress
          - issue: mould halves misregister and leave flash
            fix: planar noncritical parting line, alignment features, budget trimming
            failure_mode: burr
          - issue: silicone relaxation and mould wear drift dimensions
            fix: new mould for critical dimensions, inspect at start and end of mould life, machine critical bores
            failure_mode: dimensional-error
          rules:
          - id: c1
            text: minimum wall 1.0 mm general (0.5 mm on small supported features); vacuum 1.0-1.5 mm, gravity 1.5-2.0 mm
            source_url: https://www.fictiv.com/wp-content/uploads/2024/08/urethane-casting-design-guide.pdf
