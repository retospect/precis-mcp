        thermoforming:
          id: process/forming/thermoforming
          role: process
          domain: mech
          scale: macro
          coverage: shallow
          equipment: any
          summary: 'Heat a plastic sheet and pull it onto a one-sided tool with vacuum (or air pressure). Cheap tooling for
            large thin-walled shells at low volume, but wall thickness is not controlled: the sheet stretches and thins in
            deep draws.'
          when:
          - large, relatively thin-walled open shell (trays, covers, enclosures, packaging)
          - low to medium volume where an injection mould is not justified
          - one-sided detail is enough; the controlled surface can be the mould side
          avoid_when:
          - uniform wall thickness is required
          - small parts at high volume with bosses, ribs and tight tolerances (use injection moulding)
          - very large hollow seamless parts (rotational moulding)
          - very low quantity thick solid parts (CNC machining)
          variants:
          - vacuum forming (about 1 bar differential)
          - pressure forming (adds compressed air, better detail)
          - male (positive) tool vs female (negative) tool
          - plug-assist and billow/pre-stretch for deeper draws
          - thin-gauge vs heavy-gauge sheet; printed or machined prototype tools
          tradeoffs:
          - male tools thin the sheet at the bottom and outer corners; female tools control the visible outer surface but
            need draft and venting
          - plug assist, pre-stretch and pressure forming improve material distribution and detail but add tooling and cycle
            cost
          - amorphous sheet (ABS, HIPS, PETG, PC) forms over a wide window; semicrystalline (PP, HDPE) shrinks more and needs
            more draft
          - tool cost is low (wood, epoxy, printed, aluminium) but secondary CNC trimming and drilling can exceed the forming
            cost
          howto:
          - dimension from the controlled (mould) side and state material, starting gauge and the minimum finished wall at
            critical places
          - start with depth-to-opening near 1:1 and keep areal draw ratio at or below about 3:1
          - 'add draft: 3-5 deg on male tools, 1.5-3 deg on smooth female tools, more for texture or deep walls'
          - use inside radii of at least 1-2 times sheet thickness, 2-4 times for deep draws
          - pick starting gauge from required finished gauge times the draw ratio and check the thinnest spot
          - vent pockets and last-contact corners with small holes (0.5-1 mm for thin sheet)
          - form first, then drill or CNC-trim in a fixture; keep holes about 2 hole diameters from edges
          - add beads, ribs or return flanges to large flat panels
          issues:
          - issue: deep narrow cavity thins the bottom and corners
            fix: reduce depth, enlarge the opening, increase starting gauge or add plug assist
            failure_mode: dimensional-error
          - issue: sharp inside corners tear or thin locally
            fix: radius at least 1-2 times sheet thickness, more at the deepest draw
            failure_mode: notch
          - issue: insufficient draft causes drag marks and sticking
            fix: 3-5 deg male, 1.5-3 deg female, more for texture
            failure_mode: assembly-error
          - issue: large flat unsupported panels bow or oil-can
            fix: add ribs, beads, corrugations or return flanges
            failure_mode: warpage
          - issue: trapped air leaves incomplete detail
            fix: vents or porous tooling at cavity bottoms and last-contact points
            failure_mode: porosity
          - issue: stretching leaves frozen-in stress and orientation
            fix: shallow draws, generous radii, uniform heating and cooling, anneal where allowed
            failure_mode: residual-stress
          - issue: dull or unsupported trim leaves burrs and ragged edges
            fix: trim in a supported fixture with sharp tooling and a trim flange
            failure_mode: burr
          - issue: tight tolerance on the whole formed shell
            fix: tolerance only the mould-side features; put tight features on CNC post-formed datums
            failure_mode: dimensional-error
          rules:
          - id: c1
            text: target depth-to-opening about 1:1; general maximum draw ratio about 3:1
            value: 1:1 target, 3:1 max
            unit: ratio
            source_url: https://rapidmade.com/thermoforming-design-for-manufacturing/
            source_quality: secondary
