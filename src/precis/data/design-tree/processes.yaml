        punching-stamping:
          id: process/forming/punching-stamping
          role: process
          domain: mech
          scale: macro
          coverage: shallow
          equipment: sheet
          summary: 'Shearing and forming sheet in a punch and die. Features scale with thickness T: holes at least 1.0 to
            1.2T (2T in stainless), webs and edge distances 1.5 to 2T, corner radii at least 0.5T, burr on the die-exit side.
            Pays back only with dedicated tooling at volume.'
          when:
          - medium to high quantities where a progressive or compound die amortises
          - many holes, embosses or louvres that a turret or die forms in one hit
          avoid_when:
          - 'low quantity or changing geometry: laser or waterjet plus brake'
          - 'very small holes, very thick sheet or burr-free straight walls: laser, drilling, fine blanking'
          - 'deep three-dimensional shapes: deep drawing or hydroforming'
          variants:
          - turret punching (standard and cluster tools)
          - progressive, compound and transfer dies
          - fine blanking for straight, burr-free walls
          tradeoffs:
          - Tooling cost is fixed; unit cost drops with volume.
          - Conventional punched walls are tapered and burred on one side.
          - Hard tempers and stainless need larger holes, radii and clearances.
          howto:
          - Make hole or slot width at least 1.2T (about 2T in stainless or high-tensile material).
          - Keep web between holes and hole-to-edge at least 1.5T, 2T where bulging matters; long slots get 4T.
          - Move holes at least 2T+R (small) or 2.5T+R from a bend.
          - Give blank outside corners a radius of at least 0.5T and avoid narrow tabs below 1.5T.
          - State the burr side on the drawing; plan for a burr of about 0.1T.
          - Keep V-bead depth to about 3T (2T in less formable tempers).
          - Use ISO 2768-m for general tolerances and tolerance only functional holes individually; confirm louvre dimensions
            with the die maker.
          issues:
          - issue: Hole smaller than stock thickness breaks punches and pulls slugs
            fix: At least 1T to 1.2T, 2T in stainless, or laser/drill
            failure_mode: overload
          - issue: Hole too close to edge or bend bulges or tears
            fix: 1.5 to 2T from edge, 2T/2.5T+R from bend
            failure_mode: dimensional-error
          - issue: Burr on the wrong or hand-touched side
            fix: Specify burr direction, deburr method or fine blanking
            failure_mode: burr
          - issue: Sharp internal blank corners chip the punch and start cracks
            fix: Radius at least 0.5T or overlapping round cuts
            failure_mode: notch
          - issue: Deep emboss or louvre thins and splits
            fix: Reduce depth, bigger radii, softer temper, multiple stages
            failure_mode: brittle-fracture
          - issue: Springback, residual stress and twist after forming or cut-off
            fix: Symmetric strip layout, die springback compensation, flatness spec
            failure_mode: warpage
          - issue: Rolling-direction anisotropy and earing in drawn parts
            fix: Choose low-anisotropy material, set grain orientation, trim ears
            failure_mode: anisotropy
          - issue: Hole pitch dimensioned centre-to-centre leaves a thin web
            fix: Dimension the web edge to edge or check pitch minus half diameters
            failure_mode: assembly-error
          rules:
          - id: c1
