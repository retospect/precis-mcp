            ribs-and-bosses:
              id: process/primary-shaping/injection-mould/ribs-and-bosses
              role: leaf
              domain: mech
              scale: macro
              coverage: deep
              summary: Ribs and boss walls run at 40 to 60 percent of the wall they join so the thick junction does not sink;
                ribs stay at or below about 2.5 T tall with at least 0.5 degrees of draft and a root radius of 0.25 to 0.5
                T. Bosses are about twice the screw or insert diameter outside, with the hole sized from the fastener maker's
                chart.
              when:
              - Use a moulded boss with a self-tapping screw when the joint is opened rarely and the resin can carry the thread.
              - Use a boss sized for a heat-set or moulded-in insert when the joint is serviced often, with the hole diameter
                taken from the insert supplier.
              avoid_when:
              - Do not merge a boss directly into a sidewall; join it with thin ribs or core out the junction.
              - Do not mould an internal thread as ordinary geometry; it is an undercut. Use self-tapping screws, inserts,
                unscrewing tooling or machine it.
              howto:
              - Set rib and boss-wall thickness to 40 to 60 percent of the parent wall, and for a cosmetic reverse side stay
                near the low end.
              - Keep ribs at or under 2.5 T tall (3 T at most); use two short ribs instead of one tall one.
              - Draft ribs and bosses at 0.5 degrees per side or more and radius the root at 0.25 to 0.5 T.
              - Size boss outside diameter at about 2 times the screw or insert nominal diameter and boss hole at the screw
                core diameter or the insert maker's value.
              - Extend the boss hole or core down to the base-wall level so no thick plastic sits under the hole.
              - Add a lead-in chamfer at the hole entry and 1 to 4 gusset ribs where load needs them, each following the rib
                rule.
              - Vent boss rims and rib tips and keep weld lines away from boss load paths.
              issues:
              - issue: Ribs or boss walls as thick as the main wall
                fix: Use the 40 to 60 percent ratios; add more ribs or gussets instead of mass
                failure_mode: sink
              - issue: Tall ribs
                fix: Cut to about 2.5 T, use two shorter ribs, add draft and root radius
                failure_mode: sink
              - issue: Sharp rib or boss roots
                fix: Root radius 0.25 to 0.5 T
                failure_mode: notch
              - issue: Boss merged into a sidewall
                fix: Detach it and tie with thin ribs, or core out the junction
                failure_mode: sink
              - issue: Blind shallow boss hole leaves thick plastic below it
                fix: Extend the core to base-wall level
                failure_mode: porosity
              - issue: Nominal screw diameter used as the pilot hole
                fix: Take the pilot size from the screw or insert maker chart
                failure_mode: overload
              - issue: Boss splits or screw pulls out
                fix: Use maker pilot data, enlarge OD only as needed, add gussets, or use an insert
                failure_mode: overload
              - issue: Uneven cooling and fibre orientation around ribs
                fix: Symmetric ribs, balanced gates, controlled mould temperature
                failure_mode: warpage
              - issue: Flow orientation makes strength and shrinkage direction dependent
                fix: Align flow with load, check with mould-flow analysis
                failure_mode: anisotropy
              - issue: Over-packing, restricted ejection and sharp corners
                fix: Generous radii, uniform walls, adequate draft, balanced packing
                failure_mode: residual-stress
              - issue: Weld lines at a boss
                fix: Move the gate, add venting or overflow, keep the line out of the load path
                failure_mode: notch
              - issue: Thin features and worn shut-offs flash
                fix: Keep critical edges off the parting line, give shut-off land, reduce pressure
                failure_mode: burr
              - issue: Tight tolerances on every feature
                fix: Use functional datums and ISO 20457 general tolerances; tighten only fits
                failure_mode: dimensional-error
