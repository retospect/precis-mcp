            tooling-cost-quantity:
              id: process/primary-shaping/injection-mould/tooling-cost-quantity
              role: leaf
              domain: mech
              scale: macro
              coverage: deep
              summary: Aluminium tools suit prototypes, bridge runs and up to roughly 10,000 parts; hardened steel suits repeated
                production and abrasive or glass-filled resin. Below about 100 parts 3D printing or urethane casting usually
                wins; break-even is tool cost difference over per-part saving, with no universal quantity.
              when:
              - '1 to 10 parts or changing geometry: FDM, SLA, SLS or CNC'
              - 'roughly 1 to 100 parts without production-grade resin need: 3D printing or urethane casting'
              - 'roughly 100 to 10,000 parts in production resin: aluminium injection tool'
              - 'thousands to millions of identical parts, abrasive resin or long programme: hardened multi-cavity steel'
              avoid_when:
              - injection moulding for one-offs or while geometry is still moving
              - aluminium tool for abrasive glass-filled resin at high volume
              - choosing cavity count from annual quantity alone
              variants:
              - aluminium or rapid tool
              - hardened steel production tool
              - 3D-printed low-run mould
              - single-cavity versus multi-cavity or family tool; hot versus cold runner
              howto:
              - Compute break-even as (tool cost A minus tool cost B) divided by (part cost B minus part cost A) using real
                quotes.
              - Pick tool material from volume, resin abrasiveness and redesign risk, not from the lowest quote alone.
              - Choose cavity count from tool amortisation, cycle time, machine capacity, balance and demand variability.
              - Remove undercuts, tight blanket tolerances and cosmetic over-specification before quoting; each adds slides,
                polish or inspection.
              - 'Rebuild a 3D-printed design for moulding: uniform walls, ribs, draft, core and cavity split, opening direction.'
              - Tolerance only functional features per ISO 20457 and agree shrinkage and acceptance with the moulder.
              issues:
              - issue: Undercuts added without a tool strategy
                fix: Redesign for straight pull, split the part, or budget slides and lifters explicitly.
                failure_mode: assembly-error
              - issue: Tight tolerances everywhere
                fix: Tolerance functional features only; use ISO 20457 and agreed shrinkage.
                failure_mode: dimensional-error
              - issue: Part designed like an FDM part
                fix: Use uniform walls, ribs, draft and core-cavity separation.
                failure_mode: sink
              - issue: Thick solid sections and bosses
                fix: Core out, ribs and gussets at 40 to 60 percent of wall.
                failure_mode: sink
              - issue: Sharp internal corners
                fix: Internal radius at least 0.5 times wall.
                failure_mode: notch
              - issue: Gate, weld line or ejector on a cosmetic or functional face
                fix: Move gate and ejectors; use flow simulation; specify acceptable witness marks.
                failure_mode: overload
              - issue: Differential shrinkage and fibre orientation
                fix: Uniform walls, balanced fill, symmetrical ribs, avoid large unsupported panels.
                failure_mode: warpage
              - issue: Flow aligns molecules and fibres; weld lines weaker
                fix: Gate so main load follows flow; keep loads off weld lines; flow-check filled parts.
                failure_mode: anisotropy
              - issue: Parting-line mismatch or worn tool
                fix: Robust shut-offs, no knife edges, suitable steel, controlled clamp and pressure.
                failure_mode: burr
