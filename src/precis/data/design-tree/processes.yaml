    coating:
      id: process/coating
      role: method
      def: put a layer on the part (DIN 8580 group 5)
      children:
        anodising:
          id: process/coating/anodising
          role: process
          domain: mech
          scale: macro
          coverage: shallow
          equipment: any
          summary: Anodising grows an insulating aluminium-oxide layer, about half outward and half into the metal. The drawing
            must give standard, type, class, thickness, colour, masks, rack location and whether dimensions apply before or
            after coating.
          when:
          - aluminium part needs corrosion protection, wear surface (Type III), electrical insulation or dyed colour
          - wrought 6061 is the easy case; 7075 and 2024 workable with more risk
          avoid_when:
          - part must conduct (grounding, bonding) unless those areas are masked or machined bare
          - die-cast A380 where a uniform cosmetic or hardcoat finish is needed
          - fatigue-critical surfaces carrying thick hardcoat without test data
          - knife edges or sharp sealing edges under hardcoat
          variants:
          - Type II sulfuric, Class 1 undyed or Class 2 dyed (MIL-PRF-8625, ISO 7599 classes AA5 to AA25)
          - Type III hard anodise, Class 1 or 2 (MIL-PRF-8625, ISO 10074)
          tradeoffs:
          - Thick hardcoat gives wear and insulation but costs dimensional growth, fatigue strength and edge integrity
          - Dyed organic colours fade in UV; hot-water seal or inorganic colour lasts longer
          howto:
          - Call out the current spec designation, type, class, colour and a thickness or thickness range; never just 'anodise'
            or 'Type III'
          - State whether each dimension applies before or after anodising; machine external diameters undersize and bores
            oversize by the build
          - Mask or oversize threads, bearing seats, press fits, grounding pads and show mask boundaries on the drawing
          - Name alloy and temper; keep one alloy and lot across cosmetic assemblies
          - Add radii of at least 10 times coating thickness on edges
          - Mark an allowed rack-contact area on a hidden, non-functional surface
          - For fatigue-critical hardcoat reduce thickness, seal, consider shot peening, and test coated coupons
          issues:
          - issue: Dimensional growth consumes tolerance on fits
            fix: Specify post-anodise dimensions, machine pre-coat allowance, or mask and finish after coating
            failure_mode: dimensional-error
          - issue: Thread clearance lost or pitch diameter grows
            fix: Mask, tap oversize before coating, or chase after coating; gauge after
            failure_mode: assembly-error
          - issue: Brittle oxide cracks or spalls in a press fit
            fix: Mask the fit or finish-machine after coating
            failure_mode: brittle-fracture
          - issue: Sharp edges burn or crack under high current density
            fix: Radius edges to at least 10 times coating thickness
            failure_mode: notch
          - issue: Hardcoat lowers fatigue strength
            fix: Thinner coating, sealing, shot peen first, validate on coupons
            failure_mode: fatigue
          - issue: Oxide is insulating so bonding or grounding fails
            fix: Mask or machine bare pad, define continuity requirement
            failure_mode: assembly-error
          - issue: Organic dye fades in UV and colour varies by alloy or lot
            fix: Use hot-water seal or lightfast dye, approved master sample, one alloy and lot
            failure_mode: environmental-degradation
          - issue: Bare masked area left unprotected
            fix: Specify conversion coating on masked zones; galvanic risk beside anodised metal
            failure_mode: galvanic-corrosion
