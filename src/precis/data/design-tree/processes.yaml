    primary-shaping:
      id: process/primary-shaping
      role: method
      def: make the shape from liquid or powder in a mould (DIN 8580 group 1, primary shaping)
      children:
        injection-mould:
          id: process/primary-shaping/injection-mould
          role: process
          domain: mech
          scale: macro
          coverage: deep
          equipment: injection-mould
          def: thermoplastic injection moulding in a steel or aluminium tool
          children:
            wall-thickness:
              id: process/primary-shaping/injection-mould/wall-thickness
              role: leaf
              domain: mech
              scale: macro
              coverage: deep
              summary: Pick one nominal wall for the resin (roughly 1 to 4 mm for common thermoplastics, 5 mm as a general
                ceiling) and keep every section close to it; thick sections cool late and cause sink, voids and warpage. The
                published ranges are maker starting points, not process limits, and ISO 20457 does not set a wall thickness.
              howto:
              - Choose the resin first, then take its nominal wall range from the maker guide and start in the middle of the
                range, not at the thin end.
              - Check flow length divided by wall against the resin's flow ratio; if it is too high, thicken the wall, move
                or add gates, or pick a higher-flow grade.
              - Hold neighbouring sections within 40 to 60 percent of each other; avoid steps.
              - Where thickness must change, taper over at least 3 times the thickness difference and blend with a radius.
              - Core out thick pads, bosses and handles to leave a nominal-wall shell; add ribs or gussets for stiffness instead
                of thickness.
              - Use internal radius of at least 0.5 T (1 T for stressed corners) and external radius of internal plus T so
                the wall stays constant.
              - Gate toward the thick region so it can be packed before the thin region freezes; confirm with a fill and pack
                simulation on critical parts.
              issues:
              - issue: Designing to the thinnest published limit for the resin
                fix: Raise the wall, shorten the flow path, add or move gates, or use a higher-flow grade; simulate filling
                failure_mode: dimensional-error
              - issue: Thick cosmetic pads or solid bosses
                fix: Core them out and use thin boss walls with ribs and gussets
                failure_mode: sink
              - issue: Abrupt thick-to-thin step
                fix: Taper at least 3:1 length to thickness change and blend with a radius
                failure_mode: residual-stress
              - issue: Ribs as thick as the wall
                fix: Make ribs 40 to 60 percent of the wall and fillet the base
                failure_mode: sink
              - issue: Sharp internal corners
                fix: Internal radius at least 0.5 T, preferably 1 T where stressed
                failure_mode: notch
              - issue: Uneven walls and asymmetric cooling
                fix: Uniform walls, symmetrical cooling, balanced gates, fewer unsupported spans
                failure_mode: warpage
              - issue: Thick sections shrink after the skin has frozen
                fix: Core out mass, pack the thick region, add vents
                failure_mode: porosity
              - issue: Glass or fibre flow aligns with load unpredictably
                fix: Place gates and flow along the principal load; account for fibre direction in tolerancing
                failure_mode: anisotropy
              - issue: Thin restrictions and weak shut-offs at the parting line
                fix: Improve shut-offs, add draft, control clamp force and pressure
                failure_mode: burr
              - issue: Tolerancing every dimension tightly
                fix: Tolerance only functional datums; use ISO 20457 classes or a direct tolerance agreed with the moulder
                failure_mode: dimensional-error
