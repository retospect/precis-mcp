status: run 2, verified drafts merged; for review, not yet linked or deduped
ai_use: 'Pre-filled with Perplexity (perplexity-reasoning) to find sources, then each rule was checked against its cited source
  by a separate agent. Prose and rule texts are our own wording; values trace to the listed source_url. Confidence levels:
  standard, handbook, secondary, excerpt-only, shop-rule (not DRC-enforceable), unverified. Principles checks are hand-written;
  their rules are verified claims.'
rotate:
  id: rotate
  role: goal
  scale: macro
  domain: mech
  coverage: deep
  def: let one part turn relative to another about an axis, continuously or through a limited angle, with controlled play
    and friction
  asks:
  - motion{continuous,oscillating,limited-angle}
  - speed_rpm
  - load_radial_N
  - load_axial_N
  - play_mm
  - duty
  - environment
  - process
  - quantity
  children:
    plain-bearing:
      id: rotate/plain-bearing
      role: method
      def: the turning surfaces slide on each other, directly or through a sleeve
      children:
        pin-in-hole:
          id: rotate/plain-bearing/pin-in-hole
          role: leaf
          coverage: deep
          implies:
            class: revolute
          summary: A pin turning directly in a drilled, reamed or printed hole. Cheapest pivot; the housing is the wear part,
            so it suits low load, low speed, oscillating or hand-operated motion. Past that, put a replaceable bushing or
            rolling bearing in the hole.
          when:
          - load_kind=static or low cyclic, load_N low to moderate
          - motion oscillating or intermittent, speed low (hand-operated hinge, linkage)
          - play of a few hundredths of a mm is acceptable
          - separable=service (shoulder screw, clevis pin, dowel)
          - quantity small; hole can be drilled, reamed or printed
          - 'material_pair dissimilar: hard smooth pin in aluminium, bronze, acetal or printed polymer'
          avoid_when:
          - continuous duty, high rpm, shock load or high positional accuracy
          - pin and hole both soft, especially unfilled polymer on polymer
          - hole in a creep-prone or anisotropic printed part that cannot be reinforced
          - dirt, water, abrasive or corrosion products can reach the interface
          - play growth from wear or thermal expansion is unacceptable
          - safety-critical with no inspection or positive pin retention
          variants:
          - metal pin in machined or reamed hole
          - pin in replaceable bronze, polymer or composite bushing
          - shoulder screw pivot
          - clevis pin with washers and clip (double shear)
          - ground dowel pin
          - printed pin in printed hole (prototype only)
          - printed body with metal pin or heat-set insert
          - spherical plain bearing when axes misalign
          tradeoffs:
          - 'vs ball bearing: cheaper, quieter, dirt-tolerant, compact; higher friction and wear, low PV ceiling'
          - 'vs bushing: fewer parts, but the housing wears and cannot be swapped'
          - 'vs press-fit pin: separable and serviceable, but less rigid and needs retention'
          - 'vs compliant printed hinge: no backlash from a flexure, but flexure has limited strain life'
          howto:
          - Check bearing pressure p = W/(L*d) and PV against the manufacturer's allowable for the material pair before committing.
          - Specify hole and pin as limits (for example H8/f7), never nominal size alone.
          - Drill undersize and ream a machined hole, or put a bushing in it.
          - Make the pin harder and smoother than the hole; never soft on soft.
          - Retain the pin axially with a head, shoulder, clip, cotter or captive washer; friction does not retain.
          - Support the pin on both sides (double shear) and keep the bearing length short enough to tolerate misalignment.
          - For desktop FDM, print a coupon, apply hole-specific XY compensation, use a metal pin, and specify the measured
            assembled clearance.
          - Add seals, shields or drain paths where debris can enter.
          issues:
          - issue: hole made exactly pin size
            fix: specify positive running clearance
            failure_mode: thermal-mismatch
          - issue: soft pin in soft hole
            fix: hard smooth pin, dissimilar bearing material or bushing
            failure_mode: wear-fretting
          - issue: pin held only by friction
            fix: add shoulder, clip, cotter or captive geometry
            failure_mode: loosening
          - issue: cantilevered long pivot
            fix: double shear, support both sides
            failure_mode: excess-deflection
          - issue: printed hole undersize and faceted
            fix: calibration coupon plus hole-only compensation, not global XY scaling
            failure_mode: assembly-error
          - issue: printed pin carries sustained load
            fix: metal pin and reinforced printed eye
            failure_mode: creep-preload-loss
          - issue: printed eye loaded across layers
            fix: orient load across perimeters, add walls or ribs or an insert
            failure_mode: brittle-fracture
          - issue: dirt or corrosion product in joint
            fix: seal or shield, give debris an escape path
            failure_mode: wear-fretting
          axes:
            locking: 'relevant: pin needs positive axial retention'
            captive: 'relevant: head, shoulder or clip keeps pin captive'
            corrosion: 'relevant: pin/hole metal pair, isolate dissimilar metals'
            bearing-face: 'relevant: pin shoulder or washer face against the lug'
            material-direction: 'relevant: printed holes: load across perimeters, not layer interfaces'
          rules:
          - id: c1
            text: 'ISO 286 is a hole-basis system: uppercase zone for the hole, lowercase for the shaft; clearance is the
              gap between actual limits.'
            value: null
