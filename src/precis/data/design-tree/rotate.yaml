        cross-pin:
          id: rotate/shaft-hub/cross-pin
          role: leaf
          coverage: deep
          implies:
            class: rigid
            mechanism: key
            rank: 4
          summary: 'Transverse pin (solid, taper, dowel, spring, coiled) through hub and shaft: cheap, compact positive drive
            and axial retention for light to moderate torque, or a deliberate shear fuse. The cross hole is the main fatigue
            risk.'
          when:
          - modest torque or axial load, little space, cheap compact positive drive
          - occasionally removable; steel or ductile hub and shaft; hole can be drilled and reamed
          - low-volume, prototype, or sacrificial shear-pin overload protection
          avoid_when:
          - high torque, shock, reversing torque or severe fatigue
          - high speed rotors (imbalance, stress raiser)
          - frequent disassembly that wears the hole, or precision repeatability needed
          - brittle, soft, thin-walled or creep-prone hosts (use light-duty spring pin if unavoidable)
          - pin location at a shoulder, keyway, ring groove or bearing seat
          variants:
          - solid straight pin, taper pin, dowel pin
          - slotted spring (roll) pin, coiled spring pin, grooved pin
          - shear pin with specified breakaway load
          - threaded or headed pin
          tradeoffs:
          - 'vs key: both weaken the shaft; the cited text rates the cross hole as worse'
          - 'vs spline or interference or clamp hub: no hole and better concentricity, but higher cost or harder assembly'
          - 'vs set screw: higher torque capacity, positive axial retention'
          - taper pin gives seating and serviceability but needs accurate hole work
          howto:
          - Start with pin diameter about 0.2-0.3 of shaft diameter, then check pin shear, bending, bearing, shaft net-section
            fatigue and hub splitting
          - Drill both holes through the centreline together, match hole diameters within 0.05 mm, no countersinks
          - Hub wall at least 1.5 pin diameters; shaft hole at most d/3 (coiled) or d/4 (slotted)
          - Keep hub-to-shaft shear-plane offset within 0.13-0.15 mm
          - Use standard-duty spring pins in mild or nonferrous shafts, heavy-duty only in hardened material
          - Place the pin in a uniform, radiused shaft section away from other stress raisers
          issues:
          - issue: Sized from pin shear alone
            fix: also check pin bending, bearing, shaft net section and hub splitting
            failure_mode: fatigue
          - issue: Hole too large for the shaft
            fix: limit to d/3 coiled, d/4 slotted
            failure_mode: fatigue
          - issue: Heavy-duty pin in soft shaft
            fix: standard-duty pin
            failure_mode: wear-fretting
          - issue: Gap or offset between hub and shaft shear planes
            fix: match holes, keep offset to 0.13-0.15 mm, no countersink
            failure_mode: fatigue
          - issue: Thin hub wall splits
            fix: at least 1.5 pin diameters
            failure_mode: overload
          - issue: Slotted pin migrates or relaxes
            fix: adequate engagement (60% of length), coiled pin, secondary retention
            failure_mode: loosening
          - issue: Printed cross pin or hole at CAD size, load across layers
            fix: coupon, 0.3 mm start clearance, orient load in-plane, more perimeters, metal pin
            failure_mode: creep-preload-loss
          axes:
            locking: 'relevant: spring pins hold by interference only; add a retaining feature if the pin can walk out'
            captive: 'relevant: the pin must not fall out when the hub is removed'
            corrosion: 'relevant: pin material against shaft and hub'
            bearing-face: 'relevant: pin bearing on the hub and shaft hole walls'
            material-direction: 'relevant: a printed hub hole loaded across layers cracks; use a metal sleeve or insert'
          rules:
          - id: c1
            text: Cross-pin diameter about 0.2-0.3 x shaft diameter (preliminary proportion)
            value: 0.2-0.3
            unit: x shaft d
            source_url: https://www.mitcalc.com/doc/pins/help/en/pins.htm
            source_quality: secondary
            equipment: any
            confidence: secondary
          - id: c2
            text: Hub outside diameter about 1.5-2 x shaft diameter for steel
            value: 1.5-2
            unit: x shaft d
            source_url: https://www.mitcalc.com/doc/pins/help/en/pins.htm
            source_quality: secondary
            equipment: any
            confidence: secondary
