    rolling-bearing:
      id: rotate/rolling-bearing
      role: method
      def: balls or rollers carry the turning, for lower friction and higher speed
      children:
        deep-groove-ball:
          id: rotate/rolling-bearing/deep-groove-ball
          role: leaf
          coverage: deep
          implies:
            class: revolute
            mechanism: bearing
            rank: 1
          summary: 'The default bearing for ordinary shafts: radial load plus moderate axial load either way, high speed,
            low noise, cheap and standard. Pick size by L10 life and static capacity, closure by contamination vs speed, and
            fits by which ring rotates relative to the load. Not separable, weak on shock, moment and heavy thrust.'
          when:
          - load_N mainly radial, moderate axial in either direction
          - speed high, low friction and noise wanted
          - quantity large or catalog sourcing; standard ISO 15 sizes
          - general shafts, motors, fans, wheels, 3D-printer axes
          avoid_when:
          - very high radial load (cylindrical roller)
          - mainly axial load (angular contact or thrust ball)
          - high moment load or large shaft deflection (tapered or spherical roller)
          - bearing must be separable or frequently replaced
          - shock or static overload (brinelling risk)
          - extreme contamination or washdown without external sealing
          - current must not pass through the bearing
          variants:
          - open
          - shielded (Z, ZZ), non-contact
          - contact sealed (RS, 2RS, 2RSH)
          - single shield or seal
          - stainless steel
          - hybrid ceramic (silicon-nitride balls)
          - filling-slot and double-row
          - precision classes P6 and P5
          tradeoffs:
          - 'vs angular contact: simpler and cheaper; less axial capacity and stiffness'
          - 'vs cylindrical roller: lower friction; much lower radial capacity'
          - 'vs tapered roller: lower friction and simpler mounting; lower combined and moment load'
          - 'vs plain bushing: much lower starting friction; more sensitive to dirt and shock'
          - 'shield vs seal: shield gives lower friction and speed penalty; contact seal gives better water and fine-dust
            exclusion with more heat'
          howto:
          - Compute equivalent load P = X*Fr + Y*Fa with the maker's factors, then L10 = (C/P)^3 in million revs, or L10h
            = 10^6/(60*n)*(C/P)^3 hours.
          - Do not design at P = C; use the modified life method for contamination and film.
          - Check static safety factor and minimum load (about 0.01*C for ball bearings as a rule of thumb).
          - 'Pick shaft and housing classes from ring rotation vs load direction: rotating ring gets interference, floating
            ring a loose fit.'
          - Support the ring over its full circumference and width with a shoulder at or below the abutment diameter, fillet
            no more than ra.
          - Press only on the ring being fitted; never through the balls.
          - Use CN clearance normally and C3 when interference or temperature difference would remove clearance.
          - In an FDM housing, print a coupon, tune hole compensation, use a slip fit with shoulder and cover, or a metal
            insert for real load.
          issues:
          - issue: choosing by bore alone
            fix: calculate P, L10h, static safety, speed, temperature, contamination
            failure_mode: fatigue
          - issue: catalog limiting speed treated as guaranteed
            fix: check exact seal, grease, load and temperature
            failure_mode: softening
          - issue: both rings tightly fitted
            fix: fix one bearing axially, float the other
            failure_mode: thermal-mismatch
          - issue: rotating ring loose
            fix: interference fit and shoulder support
            failure_mode: wear-fretting
          - issue: pressing through the balls
            fix: force only on the fitted ring
            failure_mode: impact
          - issue: fillet larger than catalog maximum
            fix: keep fillet at or below ra (0.3 mm for 608)
            failure_mode: assembly-error
          - issue: open bearing in dust or water
            fix: contact seals plus external barrier
            failure_mode: environmental-degradation
          - issue: printed structural raceway or bore uncalibrated
            fix: metal bearing in a metal insert, replaceable sleeve, coupon
            failure_mode: creep-preload-loss
          axes:
            locking: 'relevant: shoulder plus circlip or cover on both faces'
            captive: 'relevant: locating vs floating arrangement'
            corrosion: 'relevant: seals, stainless or coated bearing, grease'
            bearing-face: 'relevant: shoulder abutment diameter and fillet limit'
            material-direction: 'relevant: printed housings'
