        key-and-keyway:
          id: rotate/shaft-hub/key-and-keyway
          role: leaf
          coverage: deep
          implies:
            class: rigid
            mechanism: key
            rank: 1
          summary: 'Parallel key on its flanks in a shaft keyseat and hub keyway: the default removable torque connection
            for metal hubs. The keyway is a fatigue notch and the joint has some backlash.'
          when:
          - hub must be removable, cheap, easy to machine (milling, broaching, slotting)
          - moderate torque and speed, occasional assembly, metal shaft and hub
          - gear, pulley, sprocket, coupling or handwheel on a shaft
          avoid_when:
          - backlash-free, very stiff or precise drive under reversing torque (shrink fit, spline, polygon, clamp hub)
          - high cyclic torque or shock where shaft fatigue governs
          - soft cast iron, aluminium, plastic or thin hubs unless bearing pressure is checked
          - very high quantity (integrated spline or moulded drive)
          - water, salt or fretting-prone oscillation without protection
          variants:
          - parallel sunk key, square or rectangular (DIN 6885 / ISO 773)
          - feather key for an axially sliding hub
          - tapered or gib-head key (ISO 774), Woodruff key
          - two keys (load sharing is imperfect)
          - spline or serration as the escalation
          tradeoffs:
          - 'vs shrink fit: no notch and no backlash but hard to separate'
          - 'vs clamp hub: no keyway, adjustable angle, but depends on bolt preload'
          - 'vs spline: spline shares load over many flanks, costs more tooling and inspection'
          - 'vs polygon: no loose key, specialised manufacture'
          - 'vs cross pin: key is better for fatigue; cross-drilling weakens the shaft more'
          howto:
          - Pick the standard key section from shaft diameter, then length from shear and flank-bearing checks
          - Use N9 shaft keyway with JS9 hub keyway for a normal fixed hub; P9/P9 for reversing torque
          - Keep top-face clearance so torque goes through the flanks
          - Retain the hub axially with a shoulder, nut, ring or end fastener; the key does not do it
          - Check shaft fatigue at the keyway with a fatigue notch factor, not just key shear
          - For FDM hubs use coupons, a metal insert or key, and orient flank shear within layers
          issues:
          - issue: Key sized from torque alone
            fix: select section from shaft diameter, then check length
            failure_mode: overload
          - issue: Only key shear checked
            fix: also check flank bearing, shaft fatigue, hub wall and bore distortion
            failure_mode: fatigue
          - issue: Keyseat runs into a shoulder fillet
            fix: keep the keyseat end at least d/10 from the fillet, use rounded cutter ends
            failure_mode: fatigue
          - issue: Two keys assumed to carry double
            fix: apply a load-sharing allowance or design one key for the load
            failure_mode: overload
          - issue: Soft hub crushes under flank pressure
            fix: lengthen hub, steel insert, or use spline or clamp
            failure_mode: wear-fretting
          - issue: Printed keyway at zero clearance
            fix: coupon test and compensate; start at 0.3 mm clearance for moving parts
            failure_mode: assembly-error
          - issue: Hub drifts axially
            fix: axial retention by shoulder, nut, ring or clamp
            failure_mode: loosening
          axes:
            locking: 'relevant: the key and hub need an axial stop (set screw, ring or shoulder) so neither walks along the
              shaft'
            captive: 'n/a: the key is a loose part only during assembly'
            corrosion: 'relevant: fretting and galvanic pairs between key, shaft and hub'
            bearing-face: 'relevant: the key side faces carry the torque; check bearing stress on the weaker keyway wall'
            material-direction: 'relevant: a printed hub keyway wall can split across layers'
          rules:
          - id: c1
            text: Key torque is carried on the two flanks; the top face should have clearance
            value: top clearance
            unit: null
            source_url: https://www.woodstockindustrial.com/specs/din-6885
