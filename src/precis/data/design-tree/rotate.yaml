        paired-preloaded:
          id: rotate/rolling-bearing/paired-preloaded
          role: leaf
          coverage: deep
          implies:
            class: revolute
            mechanism: bearing
            rank: 5
          summary: Two angular-contact ball or tapered-roller bearings set against each other (DB, DF, tandem) with a defined
            preload for axial location in both directions, stiffness, low backlash and moment capacity. Preload is product-specific,
            raises heat and cuts speed, and is destroyed by thermal growth and polymer creep, so it needs a steel shaft and
            rigid housing.
          when:
          - axial load in both directions, or overturning moment, axial runout or backlash to be controlled
          - stiffness and accurate positioning (spindles, tool positioning)
          - DB when maximum moment stiffness is needed; DF when misalignment tolerance matters
          - 'quantity repeatable: buy universal or factory-matched pairs with specified preload'
          - steel shaft, rigid steel or cast-iron housing, controlled temperature
          - tapered rollers for combined and shock load at moderate speed; angular-contact balls for speed
          avoid_when:
          - load mainly radial, or a locating/floating arrangement is enough
          - high speed with heavy preload (heat, seizure)
          - large or poorly controlled thermal growth
          - significant misalignment (use DF) or frequent disassembly
          - printed polymer, soft aluminium or thin-walled housing without a metal insert
          - abrasive, wet or corrosive environment without seals and compatible grease
          variants:
          - 'DB back-to-back (indirect): diverging load lines, highest moment stiffness'
          - 'DF face-to-face (direct): converging load lines, tolerates misalignment, less stiff'
          - 'DT tandem: more axial capacity one way only'
          - DBB, DBD and similar 3- and 4-bearing sets
          - angular-contact ball pair vs tapered-roller pair
          - fixed preload (spacers, offsets) vs spring preload (Belleville or coil)
          - light, medium, heavy preload classes (SKF GA, GB, GC)
          tradeoffs:
          - 'vs single deep-groove: bidirectional location, stiffness, moment capacity; more cost, heat and assembly care'
          - 'vs locating plus floating: stiffer but cannot absorb thermal shaft growth'
          - 'ball vs tapered: balls win on speed and friction; tapered win on combined, shock and adjustability'
          - 'rigid vs spring preload: rigid is stiffer and repeatable; spring tolerates thermal growth and holds contact at
            speed'
          howto:
          - 'Specify the pair as a full assembly: type, arrangement, preload class or force, contact angle, precision class,
            grease, fits, spacers, locking method, temperature and speed.'
          - Use the lightest preload that meets stiffness and runout; check mounted and operating preload with fit-induced
            clearance loss.
          - Buy universal or matched pairs and follow the orientation marks; do not tighten a nut until it feels right.
          - Choose spring preload when speed or temperature swing is large.
          - Support seats continuously, avoid grooves and holes, press on the fitted ring only.
          - Lock the nut with locknut, tab washer or ground spacer and recheck endplay after thermal cycling.
          - If a printed housing is unavoidable, press a metal insert or use a clamped cartridge; print only non-precision
            structure.
          issues:
          - issue: one bearing reversed or both same orientation
            fix: use matched or universal bearings with orientation marks
            failure_mode: assembly-error
          - issue: unmatched bearings tightened by feel
            fix: matched pair, measured preload or defined spacer
            failure_mode: assembly-error
          - issue: heavy preload at high speed
            fix: lightest adequate preload; spring preload
            failure_mode: softening
          - issue: interference fits on both rings remove clearance
            fix: compute fit-induced loss before choosing preload
            failure_mode: thermal-mismatch
          - issue: both bearings fixed while shaft expands
            fix: locating/floating or spring preload
            failure_mode: thermal-mismatch
          - issue: pressing through balls or rollers
            fix: force on the fitted ring only
            failure_mode: impact
          - issue: printed bearing seat in PLA or PETG
            fix: metal insert or clamping cartridge
            failure_mode: creep-preload-loss
          - issue: nut relaxes, spacer settles
            fix: locknut, tab washer, ground spacer, spring preload
            failure_mode: loosening
          axes:
            locking: 'relevant: locknut or tab washer holds preload'
            captive: 'relevant: pair captures shaft axially both ways'
            corrosion: 'relevant: seals, grease compatibility, galvanic contact'
            bearing-face: 'relevant: spacer and shoulder faces set preload'
            material-direction: 'relevant: printed housings only'
