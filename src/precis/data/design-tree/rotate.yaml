        polymer-bushing:
          id: rotate/plain-bearing/polymer-bushing
          role: leaf
          coverage: deep
          implies:
            class: revolute
            mechanism: bearing
            rank: 3
          summary: Press-fit solid polymer sleeve (igus iglidur class) running dry on a hard ground shaft. Good for dirt,
            vibration, corrosion and low-to-moderate speed at moderate-to-high pressure; poor for precision, near-limit PV,
            or frequent removal. The installed bore only reaches size after pressing into an H7 bore.
          when:
          - dry or maintenance-free running wanted; speed low to moderate
          - load moderate to high pressure on projected area
          - separable=never (press-fit, permanent); quantity low to medium using catalog sleeves
          - environment dirty, vibrating, corrosive or needs electrical isolation
          - shaft can be chosen as part of the system (hardened, ground)
          avoid_when:
          - high precision, preload or near-zero runout needed
          - load-speed product near catalog PV limit
          - bearing must be removed often
          - 'temperature or pressure beyond the grade limits (grade J: 90 C long term, 35 MPa)'
          - shaft soft, rough, corroded or axially scored
          - tight accuracy needed from an as-printed FDM housing
          variants:
          - cylindrical sleeve
          - flanged sleeve (adds axial location and thrust)
          - thrust washer
          - split or clamp bushing (serviceable, less stiff)
          - clearance-free preloaded bushing
          - metal-backed composite
          - high-temperature or high-pressure grades (H1, XPF)
          tradeoffs:
          - 'vs ball bearing: tolerates dirt, shock and corrosion, needs no raceway hardness; higher friction, lower speed,
            less precise'
          - 'vs oil-impregnated bronze: no oil, lower weight and insulation; less thermal conduction and stiffness'
          - 'vs metal-backed PTFE: simpler, but less dimensionally stable'
          - 'vs printed bushing: qualified wear data (PV) exists only for the molded grade'
          howto:
          - Compute p = W/(d*L), v = pi*d*n/60 and PV, and check each of p, v and PV against the grade's own limits, with
            a derate.
          - Bore the housing to H7, round, rigid, chamfered, and press the sleeve in square with an even axial force; do not
            hammer or use a calibration pin.
          - Size the shaft to the installed bore, never the free bore; verify clearance after pressing.
          - 'Pick the shaft: h-tolerance (h9 for J2), ground or drawn, Ra about 0.2 to 0.8 um, hardness at least 200 HB; avoid
            mirror finish and axial grind marks.'
          - Chamfer shaft ends and deburr keyways and shoulders in the sliding zone.
          - Add a flange, shoulder or circlip where axial location is needed; add a metal insert in plastic housings.
          - Replace the grade's data with the exact catalog values before release.
          issues:
          - issue: selecting by pressure alone
            fix: calculate p, v and PV; derate for temperature and duty
            failure_mode: softening
          - issue: measuring the free bore
            fix: qualify clearance after pressing into the H7 bore
            failure_mode: assembly-error
          - issue: soft or rusty shaft
            fix: harden, plate or replace the shaft
            failure_mode: wear-fretting
          - issue: mirror-polished shaft
            fix: use the grade's recommended roughness
            failure_mode: wear-fretting
          - issue: zero clearance for precision
            fix: specify functional clearance or choose a rolling bearing
            failure_mode: thermal-mismatch
          - issue: sleeve migrates under thrust
            fix: flange, shoulder or retaining ring
            failure_mode: loosening
          - issue: press fit relaxes in a plastic housing
            fix: metallic housing or insert, mechanical retention
            failure_mode: creep-preload-loss
          - issue: printed bushing used as final precision part
            fix: print oversize and ream or machine; use a coupon
            failure_mode: excess-deflection
          axes:
            locking: 'relevant: flange, shoulder or circlip for axial location'
            captive: 'n/a: sleeve is pressed, not captured'
            corrosion: 'relevant: polymer survives, shaft and housing corrode'
            bearing-face: 'relevant: flange face carries thrust'
            material-direction: 'relevant: printed housings: layers vs hoop stress'
          rules:
          - id: c1
            text: Standard iglidur sleeves are press-fit into an H7 housing bore with no separate retainer; the bore reaches
              its size only after installation.
            value: H7
