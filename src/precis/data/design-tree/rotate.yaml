    flexure-pivot:
      id: rotate/flexure-pivot
      role: method
      def: rotation through elastic bending of a thin member, with no sliding surfaces and no play
      children:
        cross-spring-and-notch:
          id: rotate/flexure-pivot/cross-spring-and-notch
          role: leaf
          coverage: deep
          implies:
            class: compliant
            mechanism: integral
          summary: Cross-spring pivots give a backlash-free, stiff axis with large elastic angle but need aligned matched
            leaves; notch hinges are monolithic, compact and cheap but shift their centre and carry little transverse load.
            Size from allowable stress first, then check fatigue and buckling.
          when:
          - 'cross-spring: axis must stay defined under radial and tilting load, no backlash, repeatable return'
          - 'notch hinge: monolithic compact joint, mostly moment load, small angle, cut from one part'
          avoid_when:
          - 'cross-spring: must be separable or serviceable, or compression can buckle a leaf'
          - 'notch hinge: large transverse force, large angle, or fixed centre of rotation under load'
          - printed polymer hinge in hot, humid, chemical or permanently loaded service
          variants:
          - 'cross-spring: two crossed leaves, double-crossed, preloaded, gimbal or parallelogram combinations'
          - 'notch: rectangular, circular, semicircular, corner-filleted, elliptical, parabolic, bi-quadratic, U-shaped, tapered'
          - 'related: leaf-spring, cartwheel, diaphragm, wire, living hinge'
          tradeoffs:
          - 'vs ball or roller bearing: flexure has no backlash or friction but lower load capacity and limited angle'
          - 'vs plain bushing: flexure needs no lubrication, bushing tolerates shock and is replaceable'
          - 'vs living hinge: notch hinge in metal has far better fatigue life'
          - cross-spring wins on centre-of-rotation stability, notch wins on cost and simplicity
          howto:
          - set the allowable stress from the required cycle life before sizing thickness and length
          - use a circular or elliptical notch contour, never a sharp corner
          - check Euler buckling of each leaf under compression, add lateral guidance if needed
          - keep the hinge monolithic where possible, otherwise dowel and preload
          - add hard stops outside the stress-critical root so overtravel bypasses the flexure
          - for FDM orient the bending in the road direction, large root radii, print a coupon in the real orientation
          - use PETG rather than PLA for repeated flexing, test creep at operating temperature
          - use machined spring metal for precision, high-cycle or temperature-critical products
          issues:
          - issue: treating the flexure as an ideal revolute joint
            fix: include force and moment load cases, compute axis shift, nonlinear FEA
            failure_mode: excess-deflection
          - issue: sharp notch corner
            fix: circular, elliptical or filleted contour, polish tensile surface
            failure_mode: fatigue
          - issue: sizing from angle alone
            fix: choose allowable stress first then thickness and length
            failure_mode: fatigue
          - issue: axial compression buckles a cross-spring leaf
            fix: check Euler buckling, shorten, thicken or guide the leaf
            failure_mode: buckling
          - issue: transverse load on a notch hinge
            fix: load through the axis, symmetric contour, or cross-spring
            failure_mode: excess-deflection
          - issue: hinge too thin
            fix: thicker, longer or larger root radius, or split rotation over several flexures
            failure_mode: fatigue
          - issue: printed in the wrong orientation
            fix: bend along filament roads, large radii, coupon test
            failure_mode: brittle-fracture
          - issue: zero-clearance printed assembly
            fix: 0.3 mm clearance for moving parts then tune
            failure_mode: assembly-error
          - issue: PLA for permanent hot or loaded hinge
            fix: PETG, or PC or ASA; test creep
            failure_mode: creep-preload-loss
          axes:
            locking: 'n/a: flexure has no moving fastener; non-monolithic clamps need preload and dowels'
            captive: 'n/a: monolithic, leaves cannot fall out'
            corrosion: 'relevant: stress corrosion at the highly stressed root, use stainless, titanium or protected spring
              steel'
            bearing-face: 'n/a: no bolted bearing face in the flexure itself'
            material-direction: 'relevant: FDM anisotropy, bend in road direction, never peel layers'
          rules:
          - id: c1
            text: cross-spring leaf second moment I = b h^3 / 12
            value: b h^3/12
            unit: mm^4
            source_url: https://www.eucass.eu/component/docindexer/?task=download&id=7127
