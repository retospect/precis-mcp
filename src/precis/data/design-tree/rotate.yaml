            unit: um per degC per mm
            source_url: https://www.skf.com/lv/products/rolling-bearings/principles-of-rolling-bearing-selection/bearing-selection-process/bearing-execution/selecting-internal-clearance-or-preload/initial-internal-clearance/reduction-temp-difference
            source_quality: primary
