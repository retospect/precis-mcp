    shaft-basics:
      id: rotate/shaft-basics
      role: method
      def: shaft geometry limits (shoulders, fillets, deflection) that every rotating leaf inherits
      children:
        shaft-shoulders-fillets:
          id: rotate/shaft-basics/shaft-shoulders-fillets
          role: leaf
          coverage: deep
          summary: 'Shaft steps, fillets and relief grooves are fatigue notches: use the largest bearing-compatible tangent
            fillet away from peak bending, treat grooves and ring seats as notches, and check deflection and slope at bearings
            and gears on the complete shaft.'
          when:
          - a bearing, gear, pulley, spacer or seal needs positive axial location or a thrust face
          - tangent-radius fillet where the mating part has chamfer clearance
          - relief or undercut groove when the bearing corner forces a small fillet at a highly stressed step
          avoid_when:
          - steps, keyways, threads or grooves in a high-bending-moment region
          - sharp or small radius at a fatigue-critical shoulder
          - groove placed at peak bending, in corrosive or debris-prone service
          - printed shaft or bearing seat for high speed, high fatigue, precision or heat; use a metal shaft or insert
          variants:
          - square shoulder with small fillet; tangent-radius shoulder; chamfer-compatible shoulder
          - large-radius undercut; back relief groove; small-diameter relief groove
          - integral collar or flange; threaded shoulder with nut and washer
          - retaining-ring groove; printed shoulder with metal insert
          tradeoffs:
          - larger fillet lowers Kt but needs axial space and bearing chamfer clearance
          - relief groove keeps a small seat corner but adds a second notch
          - 'shoulder vs retaining ring: robust repeatable thrust face vs compact but weaker section'
          - 'key vs interference fit: separable and cheap vs notch-free but needs controlled assembly'
          - 'hollow vs solid shaft: stiffness-to-mass vs simplicity'
          howto:
          - Take shoulder diameter and corner radius from the bearing or hub catalogue; use D/d about 1.2-1.5 and r/d about
            0.02-0.06 only as a first pass
          - Look up Kt and Kts for the actual D/d and r/d, then apply notch sensitivity to get Kf
          - Include every keyway, thread, cross hole and ring groove in the fatigue check
          - Compute bending deflection and slope at bearings, gears, seals and the highest-moment shoulder on the full shaft
          - Use the component maker's allowable misalignment; use traditional limits only as defaults
          - Keep first critical speed well above running speed
          issues:
          - issue: Sharp shoulder at maximum bending moment
            fix: larger fillet, move the shoulder, bigger shaft or relief undercut
            failure_mode: fatigue
          - issue: Fillet larger than bearing chamfer allows
            fix: check catalogue radius or use a relief groove
            failure_mode: assembly-error
          - issue: Only nominal stress checked
            fix: apply Kt then Kf, combine alternating and mean stress
            failure_mode: fatigue
          - issue: Relief groove assumed beneficial
            fix: radius the root, keep it out of peak moment, compute its Kt
            failure_mode: fatigue
          - issue: Deflection judged from one local diameter
            fix: complete geometry first, then deflection and slope
            failure_mode: excess-deflection
          - issue: Printed shaft seat under a bearing
            fix: metal shaft or insert, replaceable sleeve, coupon-tuned clearance
            failure_mode: creep-preload-loss
          - issue: No thermal plan for axial location
            fix: one locating and one floating bearing
            failure_mode: thermal-mismatch
          axes:
            locking: 'n/a: shaft geometry only; retention of parts against a shoulder is the axial-retention leaf'
            captive: 'n/a: no fastener'
            corrosion: 'relevant: corrosion and fretting at a fillet cut the fatigue strength'
            bearing-face: 'relevant: the shoulder face is where a bearing or hub abuts; keep its height above the fillet'
            material-direction: 'relevant: a printed shaft fails across layers; use a metal shaft'
          rules:
          - id: c1
            text: First-pass shoulder diameter ratio D/d of 1.2 to 1.5 (replace with catalogue value)
            value: 1.2-1.5
            unit: D/d
            source_url: https://highered.mheducation.com/sites/dl/free/0070668612/365766/chapter07.pdf
            source_quality: primary
            equipment: any
            confidence: handbook
          - id: c2
            text: First-pass fillet ratio r/d about 0.02 to 0.06
            value: 0.02-0.06
            unit: r/d
            source_url: https://highered.mheducation.com/sites/dl/free/0070668612/365766/chapter07.pdf
            source_quality: primary
            equipment: any
            confidence: handbook
          - id: c3
            text: 'At D/d = 1.5 and r/d = 0.02: Kt about 2.7 bending, Kts about 2.2 torsion, axial Kt about 3.0'
            value: 2.7 / 2.2 / 3.0
            unit: Kt
            source_url: https://highered.mheducation.com/sites/dl/free/0070668612/365766/chapter07.pdf
            source_quality: primary
            equipment: any
            confidence: handbook
          - id: c4
            text: Fatigue notch factor Kf = 1 + q (Kt - 1), q = 1 / (1 + a/r)
            value: null
            unit: null
            source_url: https://mechcodex.com/learn/machine-design/shaft-design
            source_quality: weak
            equipment: any
            confidence: secondary
          - id: c5
            text: General machinery shaft deflection about 0.001 in/ft (0.075 mm/m) between bearings
            value: '0.075'
            unit: mm/m
            source_url: https://studylib.net/doc/9271625/lecture-%23-23---kfupm-open-courseware
            source_quality: weak
