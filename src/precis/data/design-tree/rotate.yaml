        sintered-bronze-bushing:
          id: rotate/plain-bearing/sintered-bronze-bushing
          role: leaf
          coverage: deep
          implies:
            class: revolute
            mechanism: bearing
            rank: 4
          summary: Oil-impregnated porous bronze sleeve (ASTM B438) pressed into a rigid housing. Quiet, cheap, no maintenance
            for steady rotation at moderate load and speed. Bore closes in after pressing, so size the shaft to the installed
            bore; poor for oscillation, shock, dirt or removal.
          when:
          - continuous rotation, moderate load and speed, quiet running
          - separable=never; medium or high quantity of standard sizes
          - rigid metallic housing, bore can be checked after pressing
          - shaft hard and smooth; oil and temperature compatible
          avoid_when:
          - mainly oscillating, very slow or start-stop motion (oil not drawn to the film; squeak, stick-slip)
          - shock, edge loading, misalignment or demanding fatigue life
          - very high precision or predictable friction over wide temperature
          - bearing must be replaced or removed
          - abrasive dust, solvents, water or chemicals that remove the oil
          - temperature beyond the oil range (about -20 to 100 C mineral oil)
          - soft or printed housing without a metal carrier
          variants:
          - cylindrical sleeve, flanged sleeve, thrust washer, spherical (ASTM B438)
          - low-density (more oil) vs high-density (stronger) grades
          - bronze-graphite grades (0 to 5 percent graphite by ASTM grade)
          - standard mineral oil vs special oil or solid lubricant
          tradeoffs:
          - 'vs rolling bearing: quiet, damping, compact, cheap, dirt-tolerant; more friction, lower speed, less precise'
          - 'vs solid bronze: self-lubricating, but weaker under shock and heat'
          - 'vs PTFE composite: better for continuous rotation; worse for oscillation and dry start'
          - 'vs polymer bushing: stiffer and conducts heat, but needs an oil-compatible environment'
          - 'vs sintered iron: corrosion resistance; iron is cheaper and stronger'
          howto:
          - Check p = W/(L*d), v and PV against the supplier's curve; keep continuous no-relubrication PV well below the 50,000
            psi*fpm maximum.
          - Specify housing, bushing OD and installed clearance separately; compute interference I = OD minus bore.
          - Estimate bore close-in from the supplier's data, then verify the pressed bore with a gauge.
          - Use the smallest interference that retains the bushing, in a rigid round metallic housing.
          - Press with a stepped, squared mandrel supported on the bearing face with a lead-in; never ream afterwards without
            re-impregnating.
          - Size the shaft to the installed bore (often H7 housing, f7 shaft for a standard part) and use a hard ground smooth
            shaft.
          - Keep solvents, cleaners and oil-absorbing packaging away from the bushing.
          issues:
          - issue: using the catalog ID as installed ID
            fix: calculate or measure the post-press bore
            failure_mode: assembly-error
          - issue: excess housing interference
            fix: smallest retaining interference; lead-in and stepped mandrel
            failure_mode: brittle-fracture
          - issue: reaming after impregnation
            fix: finish housing accurately; clean and re-impregnate if machined
            failure_mode: wear-fretting
          - issue: oscillation or dry starts with oil bushing
            fix: PTFE composite, grease-fed bronze or solid-lubricant bearing
            failure_mode: wear-fretting
          - issue: oil incompatible with environment
            fix: check solvents, process fluids and seals vs the oil
            failure_mode: environmental-degradation
          - issue: pressing into an uncalibrated printed housing
            fix: metal insert or printed carrier with metallic bore
            failure_mode: creep-preload-loss
          - issue: hot or soft housing relaxes interference
            fix: metallic housing, positive axial retention
            failure_mode: loosening
