        clamp-hub:
          id: rotate/shaft-hub/clamp-hub
          role: leaf
          coverage: deep
          implies:
            class: rigid
            mechanism: clamp
          summary: 'Friction-locked shaft-hub joints: split clamp hubs, taper-lock bushes, Ringfeder-type keyless locking
            assemblies and shrink discs. No keyway or backlash, but capacity depends on preload, surface condition, hub stiffness
            and clean dry interfaces.'
          when:
          - 'split hub: low to medium torque, frequent removal, moderate precision, small quantities, existing shaft'
          - 'taper-lock: standard pulleys, sprockets, fan hubs, field replacement'
          - 'locking assembly or shrink disc: high torque, reversing or cyclic loads, backlash-free, concentricity'
          - 'printed clamp: prototypes and low-load fixtures only'
          avoid_when:
          - very high torque, severe shock or thin, weak hub (split hub); hub cannot be made thick enough (locking assembly)
          - minimum radial size or zero axial movement is essential (taper-lock)
          - interfaces cannot be kept clean and dry (shrink disc)
          - printed polymer in the torque path under sustained load, heat or fatigue
          variants:
          - 'split clamp hubs: one-piece slit, two-piece split, double clamp, with keyway or flange'
          - taper-lock bushes, QD or flanged bushes, keyed or keyless
          - 'keyless locking assemblies: two-piece single taper, three-piece self-centring, internal, flanged'
          - 'shrink discs: single or double taper, light or heavy duty'
          tradeoffs:
          - friction transfer avoids keyway notch and backlash but needs preload control and clean surfaces
          - split hub cheapest for small quantities, lowest torque density
          - locking assemblies and shrink discs give highest torque and best concentricity at higher component cost and need
            hub wall
          - key is cheaper in components but notches shaft and hub and can develop backlash
          howto:
          - Size from the maker table using peak and cyclic torque with the service factor, plus combined axial and radial
            load
          - Machine shaft and bore to the maker finish and fit (Ringfeder h8/H8, Ra up to 1.6 um)
          - Degrease shaft and bore of shrink discs and locking assemblies; lubricate only specified threads
          - Tighten with a calibrated torque wrench in the specified sequence
          - Check hub hoop stress and minimum hub OD against hub yield strength
          - Keep clamp elements away from shoulders; locate hubs axially by shoulder, collar or nut, not by a key
          issues:
          - issue: Catalogue torque used without service factor
            fix: derate for shock and reversal per maker
            failure_mode: overload
          - issue: Lubricated shrink-disc interface
            fix: degrease and dry bore and shaft
            failure_mode: overload
          - issue: Uneven tightening or impact wrench
            fix: calibrated torque wrench, specified sequence
            failure_mode: loosening
          - issue: Hub wall too thin for contact pressure
            fix: check hoop stress and minimum OD per maker
