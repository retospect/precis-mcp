        locating-floating-arrangement:
          id: rotate/seat-and-retain/locating-floating-arrangement
          role: leaf
          coverage: deep
          summary: Give a two-bearing shaft one locating bearing that sets the axial datum and takes thrust, and one floating
            bearing that takes radial load and lets thermal growth and tolerance stack-up through. Fixing both ends rigidly
            gives thermal preload and binding.
          when:
          - shaft on two separated supports with temperature change or tolerance stack-up between them
          - substantial radial load and one bearing can carry the thrust
          - dissimilar shaft and housing materials, castings, welded frames or printed housings
          avoid_when:
          - shaft must be clamped or preloaded axially in both directions (use adjusted angular-contact or tapered pair)
          - axial motion would damage a seal, gear mesh, encoder or coupling
          - floating seat cannot stay clean, straight and free to slide
          variants:
          - locating bearing plus loose-fit floating bearing (sliding outer ring)
          - locating bearing plus internally floating bearing (NU/N cylindrical roller, needle, CARB)
          - matched angular-contact or tapered pair locating, cylindrical roller floating
          - cross-located
          - tandem, back-to-back, face-to-face pairs
          - compliant floating support for small displacement
          tradeoffs:
          - cross-located is compact and stiff but over-constraint and thermal preload risk is higher
          - NU/N/CARB floating bearing allows interference on both rings and avoids housing wear but costs more
          - preloaded back-to-back pair gives stiffness and precision but is thermally sensitive
          - plain sleeve bearing slides axially for free but is less precise
          howto:
          - pick exactly one axial datum bearing
          - compute shaft growth dL = alpha L dT plus tolerance stack-up and provide travel beyond it
          - put the sliding interface on the ring with stationary load, usually the outer ring
          - if the sliding seat will wear or fret, use an internally floating bearing and fit both rings tight
          - set required initial clearance from operating clearance plus fit and temperature reductions
          - in a printed housing use a metal sleeve or bearing carrier, not a printed press fit
          issues:
          - issue: both outer rings clamped in rigid housings
            fix: release one outer ring axially or use NU/N/CARB
            failure_mode: thermal-mismatch
          - issue: floating ring has no axial space
            fix: calculate growth and stack-up, leave clearance beyond maximum
            failure_mode: thermal-mismatch
          - issue: loose fit on a ring under rotating load
            fix: interference or transition fit; loose ring creeps and frets
            failure_mode: wear-fretting
          - issue: floating housing fit too tight, becomes interference in transients
            fix: looser fit or internally floating bearing
            failure_mode: thermal-mismatch
          - issue: clearance class taken from catalogue default
            fix: estimate operating clearance first, then pick C2/CN/C3/C4
            failure_mode: thermal-mismatch
          - issue: printed bearing seat treated as machined
            fix: replaceable bushing or carrier, test coupon, no untested press fit
            failure_mode: creep-preload-loss
          - issue: PLA housing on a warm loaded machine
            fix: metal seat or temperature-resistant material, validate creep
            failure_mode: creep-preload-loss
          axes:
            locking: 'relevant: locating bearing needs positive axial retention both ways, interference alone is not enough'
            captive: 'n/a: no loose fastener; the bearings stay seated'
            corrosion: 'relevant: sliding floating seat fretting and water traps'
            bearing-face: 'relevant: shoulder and fillet must match catalogue abutment dimensions'
            material-direction: 'relevant: printed housing creep and layer orientation'
          rules:
          - id: c1
            text: 'only one bearing on the shaft should be the fixed-end bearing: 1 bearing'
            value: '1'
            unit: bearing
            source_url: https://bearing.co.il/wp-content/uploads/2024/11/NSK_CAT_E1102m_A20-23.pdf
            source_quality: primary
            equipment: any
            confidence: handbook
          - id: c2
            text: 'thermal clearance reduction for steel shaft and steel or cast-iron housing: dr_temp = 0.012 dT dm micrometres,
              dT in deg C, dm = (d+D)/2 in mm'
