        axial-retention:
          id: rotate/seat-and-retain/axial-retention
          role: leaf
          coverage: deep
          summary: Locating bearings need both rings held in both axial directions; non-locating ones must let one ring move.
            Choose shoulder, circlip, collar, locknut, end cap or spacer by thrust, shock, precision and access; shoulder
            dimensions come from the bearing catalogue, not a ratio.
          when:
          - 'shoulder: high thrust, shock, speed, precision, fatigue-critical'
          - 'circlip DIN 471/472: compact separable retention of moderate thrust where a groove can be cut'
          - 'clamp collar: adjustable low-to-moderate load, prototypes and repair'
          - 'locknut: precision, preload, paired angular-contact, tapered bore'
          - 'end cap or cover: outer ring retention, sealed gearboxes, split housings'
          avoid_when:
          - circlip for high shock, cyclic thrust, high speed, soft substrate or as a preload device
          - set-screw collar on precision, reversing or high-thrust duty
          - locknut in thin weak shafts or when locking access is missing
          - printed groove or thread as the thrust path
          variants:
          - shaft and housing shoulders, plain fillet or undercut
          - external DIN 471 and internal DIN 472 circlips, heavy-duty versions
          - set-screw, clamp, two-piece and threaded collars
          - bolted end plate, housing cover, snap-ring cover
          - precision locknut, slotted nut with washer, prevailing-torque nut
          - spacer sleeve between components
          tradeoffs:
          - shoulder is stiffest and best load distribution but needs turning and extraction access
          - circlip is cheapest but weakens the section, concentrates stress and does not preload
          - clamp collar adds no groove but can slip with heat, oil or shock
          - locknut gives preload control but costs machining and must be positively locked
          howto:
          - decide first which bearing locates and which floats
          - design the locating bearing so both rings are held both ways
          - take shoulder diameters and fillet limits from the bearing catalogue (ra max, da min/max, Da max)
          - keep shoulder fillet no larger than the bearing chamfer, add an undercut if needed
          - pick the ring first, then copy the DIN or maker groove dimensions and tolerances
          - preload with locknut, spacer stack or clamped end plate, not a circlip
          - add a lead-in chamfer on the shaft or bore for assembly
          - in desktop FDM use a metal sleeve, insert, collar or nut for the thrust interface
          issues:
          - issue: only one axial direction retained
            fix: size for worst-case axial load both ways, shoulder plus opposite circlip, nut or cover
            failure_mode: lost-part
          - issue: circlip used as preload device
            fix: locknut, spacer stack or clamped end plate
            failure_mode: assembly-error
          - issue: groove too close to shaft end
            fix: check edge distance and groove wall capacity, move groove or use shoulder or nut
            failure_mode: overload
          - issue: sharp or oversized shoulder fillet
            fix: fillet below chamfer limit, relief undercut
            failure_mode: assembly-error
          - issue: load applied through thin circlip
            fix: hardened thrust washer or full-face shoulder
            failure_mode: wear-fretting
          - issue: locknut over-tightened
            fix: calculate clamp force and torque, verify clearance after seating
            failure_mode: fatigue
          - issue: locknut not positively locked
            fix: lock washer, locking plate or locking screw
            failure_mode: loosening
          - issue: collar torque assumed universal
            fix: use maker data for exact collar and shaft, validate with oil and temperature
            failure_mode: loosening
          - issue: printed circlip groove under thrust
            fix: reinforced insert or metal sleeve, metal shoulder, collar or nut
            failure_mode: creep-preload-loss
          axes:
            locking: 'relevant: locknut loosening, collar slip, circlip walk-out; positive locking and secondary stop'
            captive: 'relevant: circlips and covers hold the bearing captive on the shaft or in the bore'
            corrosion: 'relevant: spring-steel rings in wet or salt, stainless or protected rings'
            bearing-face: 'relevant: abutment must support the ring face, fillet below chamfer'
            material-direction: 'relevant: printed groove delamination, orient layers away from thrust splitting'
          rules:
          - id: c1
            text: a locating bearing has both rings secured in both axial directions; a non-locating bearing must let one
              ring move
            value: null
            unit: null
            source_url: https://bearing.co.il/wp-content/uploads/2024/11/NSK_CAT_E1102m_A20-23.pdf
            source_quality: primary
            equipment: any
            confidence: handbook
