    seat-and-retain:
      id: rotate/seat-and-retain
      role: method
      def: how a bearing is seated on its shaft and housing and held axially
      children:
        housing-and-shaft-fits:
          id: rotate/seat-and-retain/housing-and-shaft-fits
          role: leaf
          coverage: deep
          summary: 'Pick shaft and housing ISO 286 classes from which ring turns relative to the load: the ring rotating relative
            to load gets interference, the stationary ring a loose or transition fit. Read resultant fits from the bearing
            maker tables, do not treat class names as fixed micrometres.'
          when:
          - 'inner ring rotates with the load, outer stationary: shaft j6 (light) or k6 (normal), housing H7'
          - 'outer ring rotates relative to load: housing J7/K7/M7, shaft loose (h6)'
          - 'load direction indeterminate or vibration or high speed: interference or transition on both rings'
          avoid_when:
          - loose fit on the ring that carries the rotating load (creep, fretting)
          - both bearing seats tight with no axial float (thermal preload)
          - tight housing fit in a split or printed housing (distortion)
          - printed hole used as an ISO H7 seat without reaming
          variants:
          - clearance fit (h6/H7)
          - transition fit (j6/J7)
          - interference fit (k6/m6, K7/M7)
          - tapered bore with sleeve
          - separable bearing where both seats must be tight
          tradeoffs:
          - interference stops creep and raises stiffness but costs press force, brinelling risk and bearing clearance
          - loose fit eases assembly and axial float but allows creep under rotating load
          howto:
          - decide per ring whether the load rotates relative to it, stationary, or is indeterminate
          - start with k6 shaft / H7 housing for rotating inner ring at moderate load
          - move to m6 or tighter with shock, vibration, speed or flexible shaft
          - look up resultant interference in the bearing maker table for the actual size
          - pick the internal clearance class (CN, C3) together with the fit and operating temperature
          - hold shaft seats to IT6 and housing seats to IT7 at minimum, check runout
          - in a printed housing use a metal sleeve or ream the print after printing
          issues:
          - issue: fit chosen from shaft rotation alone instead of ring rotation relative to load
            fix: classify each ring as rotating, stationary or indeterminate load and fit accordingly
            failure_mode: wear-fretting
          - issue: H7 used for every housing
            fix: use the maker housing table, tighten if the outer ring carries rotating load
            failure_mode: wear-fretting
          - issue: both seats tight
            fix: make one bearing locating and the other floating
            failure_mode: thermal-mismatch
          - issue: interference eats the internal clearance
            fix: choose clearance class with the fit and temperature
