    spherical:
      id: rotate/spherical
      role: method
      def: multi-axis rotation that tolerates misalignment
      children:
        rod-end-ball-joint:
          id: rotate/spherical/rod-end-ball-joint
          role: leaf
          coverage: deep
          implies:
            class: ball
            mechanism: bearing
          summary: Rod ends and spherical plain bearings give misalignment and multi-axis rotation for radial, oscillating
            or slow loads; check shank, thread, pin and clevis, not only the bearing rating, and keep printed polymer out
            of safety-critical load paths. Dimensions follow ISO 12240-4.
          when:
          - dominant load radial, static, oscillating or slow slewing, with misalignment to absorb
          - adjustable linkage needing threaded shank, left/right-hand thread pairs
          - lubricated steel/steel for larger oscillation, PTFE composite where lubrication is not possible
          avoid_when:
          - substantial axial load, shock or bending without checking shank, thread, pin and clevis
          - continuous high-speed rotation (use rolling bearing)
          - zero backlash, high stiffness or accurate angular location needed
          - frequent replacement of the bearing (use separate spherical bearing with retaining rings)
          - desktop-FDM printed joint as safety-critical, high-load, long-life bearing
          variants:
          - lubricated steel/steel
          - maintenance-free PTFE composite
          - stainless or coated
          - male thread, female thread, welding shank
          - right-/left-hand pair for adjustment
          - high-misalignment rod end
          - ball-bearing rod end
          - studded ball joint
          - separate spherical plain bearing in a housing
          tradeoffs:
          - 'vs clevis and pin: rod end absorbs misalignment, clevis is cheaper, inspectable and replaceable'
          - 'vs elastomer bushing: rod end has less damping, bushing has limited angle'
          - 'vs flexure: rod end has travel and overload tolerance, flexure has zero backlash and no lubrication'
          - 'vs printed ball socket: metal ball or liner lasts, printed socket creeps and wears'
          howto:
          - determine full load spectrum and motion, then select radial and axial ratings and life
          - model installed tilt including washers, spacers, clevis walls and bolt heads
          - keep the principal force through the bearing centre and the shank axis
          - check shank bending, thread stripping, pin bending and clevis spreading
          - add a jam nut on threaded shanks and use the maker thread engagement
          - add a mechanical stop before the catalogue maximum tilt
          - install through the correct ring, never through the spherical form
          - use a calibration coupon and a replaceable liner or metal ball in any printed socket
          issues:
          - issue: only the catalogue radial rating is checked
            fix: check radial, axial, shock, shank bending, thread, pin, clevis and bolt preload
            failure_mode: overload
          - issue: catalogue tilt angle used as installed angle
            fix: model full travel including hardware and deflection
            failure_mode: excess-deflection
          - issue: bolt or housing rubs instead of the race
            fix: spacers and through-bolt arrangement that keeps clearance
            failure_mode: wear-fretting
          - issue: inner ring creeps on pin or outer ring in housing
            fix: use specified fits, ensure motion occurs inside the bearing
            failure_mode: wear-fretting
          - issue: side-loaded threaded shank
            fix: larger rod end, double-shear clevis, stronger shank or separate bearing
            failure_mode: fatigue
          - issue: no jam nut or insufficient thread engagement
            fix: maker engagement plus jam nut or approved locking
            failure_mode: loosening
          - issue: PTFE joint in abrasive or impact service
            fix: sealed lubricated steel/steel joint
            failure_mode: wear-fretting
          - issue: no angular stop
            fix: mechanical stop before the catalogue angle
            failure_mode: overload
          - issue: zero-clearance printed socket
            fix: calibration coupon, replaceable liner, metal ball
            failure_mode: creep-preload-loss
          axes:
            locking: 'relevant: threaded shank needs jam nut or approved locking'
            captive: 'relevant: separate spherical bearing needs retaining rings or split housing'
            corrosion: 'relevant: stainless or coated races, isolate galvanic couples, seal'
            bearing-face: 'relevant: pin and washer faces must not rub the race, spacers keep clearance'
            material-direction: 'relevant: printed layers loaded in-plane, not across layers'
          rules:
          - id: c1
            text: rod-end dimensions, tolerances and radial internal clearances are standardised by ISO 12240-4
