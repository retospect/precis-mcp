    shaft-hub:
      id: rotate/shaft-hub
      role: method
      def: carry torque between a shaft and a hub, gear, pulley or arm
      children:
        set-screw-on-flat:
          id: rotate/shaft-hub/set-screw-on-flat
          role: leaf
          coverage: deep
          implies:
            class: rigid
            mechanism: screw
            rank: 7
          summary: 'One or two radial set screws biting on a machined shaft flat: cheap, compact, light-duty hub fixing. The
            cup point is ISO 4029 (DIN 916); ISO 4026 is the flat point.'
          when:
          - torque light to moderate, speed low to moderate, positioning accuracy noncritical
          - shaft flat can be milled and the hub drilled and tapped; prototype, repair or low volume
          - clean dry service with screw access; steel screw harder than steel shaft
          avoid_when:
          - torque high, reversing, shock or safety-critical (use key, spline, clamp hub, taper-lock, shrink disc)
          - hub repeatedly removed and refitted with accurate registration (cup point burrs the shaft)
          - hub is soft aluminium, brass or printed polymer without a steel insert
          - vibration, thermal cycling or corrosion dominate and no locking method
          - high volume (a keyway, moulded feature or dedicated clamp hub assembles more repeatably)
          variants:
          - cup point ISO 4029 / DIN 916 (bites, marks shaft)
          - flat point ISO 4026 (gentle, for resetting, needs a flat to resist torque)
          - cone point into a drilled dimple, dog point into a drilled hole or groove, oval point
          - soft-tip nylon or brass point for finished shafts, light holding only
          - one screw, two at 90 degrees, two at 180 degrees
          - screw plus key (key carries torque, screw does axial retention)
          tradeoffs:
          - 'vs single screw: two at 90 degrees load more evenly and hold better; costs a second hole and tightening sequence'
          - 'vs key: key has higher positive torque capacity but adds a keyway notch, backlash and machining'
          - 'vs clamp hub or taper-lock: no point damage and better fatigue, but needs more hub space and fastener access'
          - 'vs interference fit: clean and concentric but hard to assemble and remove'
          - 'vs printed integral flat or polygon: no screw indentation but creep, anisotropy and dimensional variation limit
            torque'
          howto:
          - Mill a flat broad enough that the cup sits on the plane, with a small radius or chamfer at the flat ends
          - Place two screws at 90 degrees, tighten the first, then the second, then recheck the first
          - Use manufacturer seating torque for the exact screw and hub material, then validate with a torque-retention test
          - Pick a screw length that fills the hole without protruding into the bore
          - In printed hubs use a heat-set or threaded metal insert and a steel shaft flat
          - Add a threadlocker or prevailing-torque screw where vibration is present, or move torque to a key or clamp and
            use screws for axial retention only
          issues:
          - issue: Cup point specified as ISO 4026, which is the flat point
            fix: specify ISO 4029 / DIN 916 for cup point, ISO 4026 for flat point
            failure_mode: assembly-error
          - issue: Screw tightened on a round shaft
            fix: machine a flat, keyway or drilled dimple; round shaft only for very low torque
            failure_mode: loosening
          - issue: Two screws assumed to share load equally
            fix: stage tightening and recheck the first screw
            failure_mode: loosening
          - issue: Screw too large for hub wall
            fix: check thread shear, wall thickness and hoop stress against hub material
            failure_mode: overload
          - issue: Vibration with no locking method
            fix: prevailing-torque screw, threadlocker, jam screw, or a positive key or clamp
            failure_mode: loosening
          - issue: Printed hub with zero-clearance bore or weak layer orientation
            fix: print a coupon, compensate the bore, orient so circumferential load runs along perimeters
            failure_mode: brittle-fracture
          - issue: PLA hub in a warm or outdoor application
            fix: use PETG, ASA or PC or a metal hub; creep drops preload
            failure_mode: creep-preload-loss
          axes:
            locking: 'relevant: set screws walk out under vibration; use a second screw at 90 degrees, thread-lock, or a cup
              point on a flat'
            captive: 'n/a: the screw lives in the hub and is not removed in normal use'
            corrosion: 'relevant: steel screw in an aluminium hub, or stainless screw on a steel shaft'
            bearing-face: 'relevant: the screw tip bearing on the shaft flat, and thread length in the hub wall'
            material-direction: 'relevant: a printed hub should carry the screw in a metal insert, not in layer-bonded plastic'
          rules:
          - id: c1
            text: ISO 4026 covers flat-point hexagon socket set screws in metric coarse thread from M1.6 to M24 (2003/2004
              edition); the 2026 revision extends steel to M30 and keeps stainless at M24
            value: M1.6-M24
            unit: thread size
            source_url: https://www.evs.ee/en/evs-en-iso-4026-2004
            source_quality: primary
            equipment: bought
            confidence: standard
            corrected: true
          - id: c2
            text: Cup-point hexagon socket set screws are ISO 4029 (formerly DIN 916); flat-point ones are ISO 4026
            value: ISO 4029
            unit: null
            source_url: https://brassland.com/products/standard-parts/set-screws/
            source_quality: secondary
            equipment: bought
            confidence: secondary
            standard: ISO 4029
          - id: c3
            text: 'Rule of thumb: set screw diameter about half the shaft diameter: 0.5 x shaft diameter'
            value: '0.5'
            unit: x shaft diameter
            source_url: https://img.machinedesign.com/files/base/ebm/machinedesign/document/2019/03/machinedesign_3441_setscrews.pdf?dl=machinedesign_3441_setscrews.pdf
            source_quality: secondary
            equipment: any
            confidence: secondary
