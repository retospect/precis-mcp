          - 'separable=service: shoulder plus cover, circlip, clamp ring or split housing'
          - cool, dry environment; moderate vibration (add positive clamp)
          - metal insert when load, wear or heat matter
          avoid_when:
          - printed press fit alone for high radial or shock load, high speed, precision runout
          - hot motor surroundings or frequent temperature cycling (thermoplastic creep)
          - safety-critical service
          - adhesive with oily surfaces or plastics that stress-crack (many anaerobics on ABS)
          - thin printed wall carrying hoop stress alone
          variants:
          - bore-only printed press fit
          - bore plus shoulder
          - shoulder plus removable cap (preferred)
          - split or pinch clamp
          - printed bore with metal sleeve
          - slip fit with retaining adhesive
          - O-ring retention
          - printed undersize bore reamed or machined
          tradeoffs:
          - 'lowest cost: printed slip fit with clamp'
          - 'highest separability: clamp, cap, split housing, circlip'
          - 'lowest runout and creep: metal sleeve or machined housing'
          - adhesive adds tolerance insurance but kills disassembly
          howto:
          - Print a coupon with the same material, orientation, layer height, perimeters and cooling; measure the printed
            bore at several angles and depths.
          - Tune hole compensation, then target a slip or light transition fit rather than a validated-by-guess interference.
          - Give the outer ring a full-circumference round seat, a shoulder, and a cover spigot touching the ring face (not
            the seal).
          - Tighten covers only enough to remove axial play; excess force deforms the raceway.
          - Press only on the ring being fitted; never through the balls.
          - Orient the bore axis so hoop and axial loads do not split layers; add perimeters rather than infill, ribs and
            fillets.
          - Keep the bearing away from motors and heaters, or use a higher-HDT filament or metal sleeve.
          - 'With adhesive: degrease, test a filament coupon, keep the diametral gap small, and keep a mechanical backup.'
          issues:
          - issue: CAD bore exactly equal to bearing OD
            fix: coupon-calibrated slip fit plus clamp or adhesive
            failure_mode: assembly-error
          - issue: hard press fit in thin printed wall
            fix: thicker wall, ribs, clamp or metal sleeve
            failure_mode: creep-preload-loss
          - issue: no axial shoulder or cover
            fix: add shoulder and cover or circlip
            failure_mode: loosening
          - issue: clamping too hard
            fix: cover spigot on outer ring face, tighten to remove play only
            failure_mode: overload
          - issue: seat across weak layer interfaces
            fix: orient and add perimeters
            failure_mode: fatigue
          - issue: elephant foot in the first layer of the bore
            fix: chamfer or elephant-foot compensation
            failure_mode: assembly-error
          - issue: retaining compound on ABS or oily bore
            fix: degrease, coupon test, compatible adhesive
            failure_mode: environmental-stress-cracking
          - issue: both bearings fixed while shaft expands
            fix: one locating, one floating bearing
            failure_mode: thermal-mismatch
          axes:
            locking: 'relevant: cover, circlip or clamp ring'
            captive: 'relevant: shoulder plus cover captures the bearing'
            corrosion: 'relevant: sealed bearings, drainage'
            bearing-face: 'relevant: cover spigot on outer ring face'
            material-direction: 'relevant: bore axis and layer lines vs hoop load'
