        spline-and-polygon:
          id: rotate/shaft-hub/spline-and-polygon
          role: leaf
          coverage: deep
          implies:
            class: rigid
            mechanism: key
            rank: 3
          summary: 'Multi-flank shaft-hub profiles: DIN 5480 involute splines, DIN 32711/32712 polygons, and the cheap hex
            or D bore for printed hubs. Metal splines and polygons beat keys for compact, reversing, fatigue duty; printed
            hex or D bores are prototype-grade only.'
          when:
          - high or reversing torque in a compact diameter; accurate concentricity; repeated disassembly or axial sliding
            (spline)
          - fixed, fatigue-sensitive metal joint (P3G polygon); sliding under torque (P4C polygon)
          - low-duty or prototype printed hub, knob, fan hub (hex or D bore)
          avoid_when:
          - one-off low-load plastic parts or rough additive manufacture for splines
          - P3G polygon where the hub must slide while loaded (wedges)
          - P4C where the internal profile cannot be broached or formed
          - hex or D bore for high-cycle, high-speed, precision or reversing duty
          - printed hub in safety-critical, hot, wet or long-life service without testing
          variants:
          - 'involute spline: flank-, major- or minor-diameter-centred; clearance, sliding, transition or interference fit'
          - polygon P3G (DIN 32711, three lobes) and P4C (DIN 32712, four lobes)
          - 'printed bores: hex, rounded hex, D, double-D, keyed round, metal heat-set insert, sacrificial sleeve'
          tradeoffs:
          - 'vs key: spline or polygon shares load across many surfaces and keeps more shaft section, at higher tooling and
            inspection cost'
          - polygon is self-centring with low notch sensitivity but less common tooling
          - hex or D bore is cheapest to print but has few load surfaces and wears and creeps
          - clamp or taper-lock hub with printed parts removes backlash but needs fasteners and stiffness
          - metal insert separates the torque interface from weak polymer, adds parts and adhesive limits
          howto:
          - For DIN 5480 specify module, tooth count, reference diameter, centring, tooth deviations, fit, effective length,
            material, lubrication and inspection
          - Use the standard calculation for flank pressure, hub hoop stress and load distribution; do not assume equal tooth
            sharing
          - Choose P3G for fixed joints, P4C when sliding under torque
          - Round internal corners of printed hex and D bores, use at least 3-4 perimeters and orient load along perimeters
          - Print a fit coupon and compensate the bore; add chamfer lead-in and an axial stop
          - Put a metal sleeve, insert or clamp in the torque path for printed hubs under real torque
          issues:
          - issue: Spline specified only as DIN 5480
            fix: give full geometry, fit, centring and inspection data
            failure_mode: assembly-error
          - issue: P3G polygon used for sliding under torque
            fix: use P4C or a sliding spline
            failure_mode: wear-fretting
          - issue: Thin polygon hub ovalises or crushes
            fix: check contact pressure and hoop stress; larger OD, longer engagement or steel
            failure_mode: overload
          - issue: Sharp printed hex or D corner
            fix: internal radii, more perimeters, metal insert for serious torque
            failure_mode: brittle-fracture
          - issue: Printed press fit relied on indefinitely
            fix: clamp, insert or positive retainer
            failure_mode: creep-preload-loss
          - issue: Fretting in a vibrating spline
            fix: eliminate micro-motion, lubricate, seal, compatible coatings
            failure_mode: wear-fretting
          axes:
            locking: 'relevant: the hub needs a separate axial stop on the spline or polygon'
            captive: 'n/a: no loose fastener in the torque path'
            corrosion: 'relevant: fretting on the flanks and galvanic pairs between shaft and hub'
            bearing-face: 'relevant: flank contact area carries the torque'
            material-direction: 'relevant: printed hex or D bores wear and creep; orient layers to put the load in the layer
              plane'
