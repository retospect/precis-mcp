id: reaction:oer_4step_alkaline
name: "OER, 4-step PCET, single-site, alkaline"

species:
  - {id: H2O,    formula: "H2O",   phase: gas,  charge:  0, adsorbed: false}
  - {id: O2,     formula: "O2",    phase: gas,  charge:  0, adsorbed: false}
  - {id: OHm,    formula: "OH-",   phase: aq,   charge: -1, adsorbed: false}
  - {id: e,      formula: "e-",    phase: el,   charge: -1, adsorbed: false}
  - {id: "*",    formula: "site",  phase: surf, charge:  0, adsorbed: false}
  - {id: "*OH",  formula: "OH",    phase: surf, charge:  0, adsorbed: true}
  - {id: "*O",   formula: "O",     phase: surf, charge:  0, adsorbed: true}
  - {id: "*OOH", formula: "OOH",   phase: surf, charge:  0, adsorbed: true}

# Same intermediates as acid OER; what differs is the electron-
# coupled species (OH- replaces H+). Under ideal CHE the step ΔGs
# match the acid version at the same SHE; in practice non-Nernstian
# behaviour breaks this — see references.

steps:
  - {id: 1, reactants: {"*": 1, OHm: 1},     products: {"*OH": 1, e: 1},
     n_e: 1, n_H: 1, pH_dep: true, U_dep: true}
  - {id: 2, reactants: {"*OH": 1, OHm: 1},   products: {"*O": 1, H2O: 1, e: 1},
     n_e: 1, n_H: 1, pH_dep: true, U_dep: true}
  - {id: 3, reactants: {"*O": 1, OHm: 1},    products: {"*OOH": 1, e: 1},
     n_e: 1, n_H: 1, pH_dep: true, U_dep: true}
  - {id: 4, reactants: {"*OOH": 1, OHm: 1},  products: {"*": 1, O2: 1, H2O: 1, e: 1},
     n_e: 1, n_H: 1, pH_dep: true, U_dep: true}

references:
  - "10.1021/jp047349j"
  - "10.1039/C7CS00759K"  # alkaline OER review

competing_her: false
branch_selectivity: null
