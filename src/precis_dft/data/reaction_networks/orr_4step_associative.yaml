id: reaction:orr_4step_associative
name: "ORR, 4-step associative (acid)"

# Microscopic reverse of OER 4-step acid. Same intermediates; ΔGs run
# in the opposite direction at U > 1.23 V_RHE.

species:
  - {id: H2O,   formula: "H2O",   phase: gas,  charge:  0, adsorbed: false}
  - {id: O2,    formula: "O2",    phase: gas,  charge:  0, adsorbed: false}
  - {id: Hp,    formula: "H+",    phase: aq,   charge:  1, adsorbed: false}
  - {id: e,     formula: "e-",    phase: el,   charge: -1, adsorbed: false}
  - {id: "*",   formula: "site",  phase: surf, charge:  0, adsorbed: false}
  - {id: "*OH", formula: "OH",    phase: surf, charge:  0, adsorbed: true}
  - {id: "*O",  formula: "O",     phase: surf, charge:  0, adsorbed: true}
  - {id: "*OOH",formula: "OOH",   phase: surf, charge:  0, adsorbed: true}

steps:
  - {id: 1, reactants: {O2: 1, "*": 1, Hp: 1, e: 1}, products: {"*OOH": 1},
     n_e: 1, n_H: 1, pH_dep: true, U_dep: true}
  - {id: 2, reactants: {"*OOH": 1, Hp: 1, e: 1},     products: {"*O": 1, H2O: 1},
     n_e: 1, n_H: 1, pH_dep: true, U_dep: true}
  - {id: 3, reactants: {"*O": 1, Hp: 1, e: 1},       products: {"*OH": 1},
     n_e: 1, n_H: 1, pH_dep: true, U_dep: true}
  - {id: 4, reactants: {"*OH": 1, Hp: 1, e: 1},      products: {"*": 1, H2O: 1},
     n_e: 1, n_H: 1, pH_dep: true, U_dep: true}

references:
  - "10.1021/jp047349j"
  - "10.1149/1.2204957"

competing_her: false
branch_selectivity:
  alternative: reaction:orr_4step_dissociative
  governed_by: "O2_binding_mode_end-on_vs_side-on"
