id: reaction:nrr_alternating
name: "NRR alternating (Yandulov–Schrock-like)"

# Each N atom alternately receives a proton-electron. Six PCET steps
# from *N2 to *NH3. The competing distal pathway is the other v1
# network.

species:
  - {id: N2,    formula: "N2",    phase: gas,  charge:  0, adsorbed: false}
  - {id: NH3,   formula: "NH3",   phase: gas,  charge:  0, adsorbed: false}
  - {id: Hp,    formula: "H+",    phase: aq,   charge:  1, adsorbed: false}
  - {id: e,     formula: "e-",    phase: el,   charge: -1, adsorbed: false}
  - {id: "*",   formula: "site",  phase: surf, charge:  0, adsorbed: false}
  - {id: "*N2", formula: "N2",    phase: surf, charge:  0, adsorbed: true}
  - {id: "*NNH",formula: "NNH",   phase: surf, charge:  0, adsorbed: true}
  - {id: "*NHNH",formula: "NHNH", phase: surf, charge:  0, adsorbed: true}
  - {id: "*NHNH2",formula:"NHNH2",phase: surf, charge:  0, adsorbed: true}
  - {id: "*NH2NH2",formula:"NH2NH2",phase: surf, charge: 0, adsorbed: true}
  - {id: "*NH2",  formula: "NH2", phase: surf, charge:  0, adsorbed: true}

steps:
  - {id: 1, reactants: {N2: 1, "*": 1},      products: {"*N2": 1}, n_e: 0, n_H: 0}
  - {id: 2, reactants: {"*N2": 1, Hp: 1, e: 1}, products: {"*NNH": 1},
     n_e: 1, n_H: 1, pH_dep: true, U_dep: true}
  - {id: 3, reactants: {"*NNH": 1, Hp: 1, e: 1}, products: {"*NHNH": 1},
     n_e: 1, n_H: 1, pH_dep: true, U_dep: true}
  - {id: 4, reactants: {"*NHNH": 1, Hp: 1, e: 1}, products: {"*NHNH2": 1},
     n_e: 1, n_H: 1, pH_dep: true, U_dep: true}
  - {id: 5, reactants: {"*NHNH2": 1, Hp: 1, e: 1}, products: {"*NH2NH2": 1},
     n_e: 1, n_H: 1, pH_dep: true, U_dep: true}
  - {id: 6, reactants: {"*NH2NH2": 1, Hp: 1, e: 1}, products: {"*NH2": 1, NH3: 1},
     n_e: 1, n_H: 1, pH_dep: true, U_dep: true}
  - {id: 7, reactants: {"*NH2": 1, Hp: 1, e: 1}, products: {"*": 1, NH3: 1},
     n_e: 1, n_H: 1, pH_dep: true, U_dep: true}

references:
  - "10.1126/science.1085594"  # Yandulov–Schrock catalysts
  - "10.1021/ja402761r"        # NRR computational

competing_her: true
branch_selectivity:
  alternative: reaction:nrr_distal
  governed_by: "first_PCET_N-N_vs_N-end"
