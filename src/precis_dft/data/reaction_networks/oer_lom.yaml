id: reaction:oer_lom
name: "OER, lattice-oxygen mechanism (LOM)"

# Relevant for Ni/Co oxides at high U where lattice O2- participates
# directly in the O-O bond formation. The mechanism differs from
# acid/alkaline associative OER in that the rate-determining step
# involves a lattice oxygen vacancy formation rather than *OOH coupling.

species:
  - {id: H2O,   formula: "H2O",    phase: gas,  charge:  0, adsorbed: false}
  - {id: O2,    formula: "O2",     phase: gas,  charge:  0, adsorbed: false}
  - {id: Hp,    formula: "H+",     phase: aq,   charge:  1, adsorbed: false}
  - {id: e,     formula: "e-",     phase: el,   charge: -1, adsorbed: false}
  - {id: "*",   formula: "site",   phase: surf, charge:  0, adsorbed: false}
  - {id: "*OH", formula: "OH",     phase: surf, charge:  0, adsorbed: true}
  - {id: "Olat",formula: "O_lat",  phase: surf, charge:  0, adsorbed: false}
  - {id: "*OO", formula: "OO",     phase: surf, charge:  0, adsorbed: true}
  - {id: "VO",  formula: "vacancy",phase: surf, charge:  0, adsorbed: false}

steps:
  - {id: 1, reactants: {H2O: 1, "*": 1}, products: {"*OH": 1, Hp: 1, e: 1},
     n_e: 1, n_H: 1, pH_dep: true, U_dep: true}
  - {id: 2, reactants: {"*OH": 1},        products: {"*OO": 1, Hp: 1, e: 1},
     n_e: 1, n_H: 1, pH_dep: true, U_dep: true,
     notes: "lattice O participates in O-O bond formation"}
  - {id: 3, reactants: {"*OO": 1},        products: {O2: 1, "VO": 1, "*": 1},
     n_e: 0, n_H: 0, pH_dep: false, U_dep: false}
  - {id: 4, reactants: {H2O: 1, "VO": 1}, products: {Olat: 1, "*": 1, 2: {Hp: 1, e: 1}},
     n_e: 2, n_H: 2, pH_dep: true, U_dep: true,
     notes: "vacancy heals via two PCET steps"}

references:
  - "10.1038/nchem.2557"   # Grimaud et al. LOM
  - "10.1021/jacs.8b09732" # LOM on NiOOH

competing_her: false
branch_selectivity: null
