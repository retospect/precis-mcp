name: check

on:
  push:
    # ci/** are scripts/ship --remote's pre-merge gate refs: ship pushes the
    # synced branch there, polls this workflow to conclusion, and only a
    # green run reaches main (via ship's CAS squash-push — the
    # force-with-lease rejection is the "did anything land meanwhile" check,
    # which re-syncs and re-runs this gate). A ship retry force-pushes the
    # same ref, so the per-ref concurrency group below auto-cancels the
    # superseded run. The main trigger stays: it covers the /qland + /go
    # direct-push escape hatches, which bypass the pre-merge gate.
    branches: [main, 'ci/**']
  pull_request:
  # Nightly FULL matrix (both Pythons + macOS + Windows) on main. The ship
  # gate below runs only the 3.13 Linux legs; the platform/3.12 legs are
  # scheduled so a break there surfaces the next morning, not weeks later.
  #
  # 05:23 UTC is this fleet's quietest hour: over the 14 days to 2026-09-18,
  # main took 6 squash-merges in the 05:00 hour and 5 in the 06:00 hour,
  # against 27 in the busiest (19:00). The full shape is 18 of the account's
  # 20 concurrent job slots, so a ship gate starting inside the nightly
  # queues behind it (~40 min) — the concurrency note below explains why
  # that is now a wait instead of the nightly being cancelled. Keep the
  # minute off :00: GitHub drops scheduled events under load, and the top of
  # the hour is where that load is.
  schedule:
    - cron: '23 5 * * *'
  # Manual lever for the check-asynchronously model: re-run on the current
  # ref without an empty commit — needed in practice because a push event
  # dropped during a GitHub incident is never replayed (scripts/ship uses it
  # bare, which yields the gate shape). `full: true` = the nightly shape.
  workflow_dispatch:
    inputs:
      full:
        description: run the full matrix (3.12 + macOS + Windows), not the ship-gate shape
        type: boolean
        default: false

permissions:
  contents: read

# `main` advances by squash-merge bursts (scripts/ship): only the newest
# commit's verdict matters, so a superseded push's test matrix is
# cancelled instead of queueing behind the runner quota. PR runs get
# the same per-ref collapsing for free.
#
# Job budget: the ship-gate shape is 8 jobs (plan + lint + 6 shards of one
# Linux leg); the nightly full shape is 18. The account's standard-runner
# concurrency cap is 20 (GitHub Free), so TWO concurrent ships fan out
# fully; a third queues behind them rather than failing. Adding shards or
# legs to the gate shape past ~10 jobs costs that second slot — reshape,
# don't grow.
#
# The group key carries the run's SHAPE, not just the ref, so the nightly
# gets its own lane on main. Keying on the ref alone put the 18-job full
# matrix and every main push in one group, and a push cancels in progress —
# so one sibling ship landing during the nightly silently wiped that day's
# entire 3.12/macOS/Windows coverage, which is the exact failure the
# schedule above exists to prevent (gr346455; latent, never observed —
# ships cluster hours earlier). `workflow_dispatch` with full=true rides the
# same lane, so a deliberately-dispatched full run is likewise un-cancellable
# by a push. Cost of the split: the two shapes now coexist and 18 + 8 > 20,
# so a gate starting inside the nightly waits rather than pre-empting it
# (~40 min, well inside ship's 150 min CI timeout, and a CAS race lost while
# queued re-runs CI per gr343941).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ (github.event_name == 'schedule' || inputs.full) && 'full' || 'gate' }}
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

jobs:
  # Decides the run's shape from the event and the diff:
  #   full      — nightly schedule or `workflow_dispatch` with full=true:
  #               every leg below runs.
  #   docs_only — every changed path is under docs/ or a root *.md, so the
  #               shard matrix is replaced by one job of the fast set (the
  #               documented gate for a change that can't touch a DB path,
  #               docs/conventions/testing.md); lint + mypy still run.
  #               `src/precis/data/skills/**`, `scripts/**` and `.claude/**`
  #               are deliberately NOT docs here — skills are served and
  #               tested at runtime, scripts are executed by tests, and the
  #               .claude hooks are shell that tests exercise.
  # Anything else is the ship-gate shape: lint + 6 shards of 3.13 Linux.
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      full: ${{ steps.shape.outputs.full }}
      docs_only: ${{ steps.shape.outputs.docs_only }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: shape
        env:
          EVENT: ${{ github.event_name }}
          FULL_INPUT: ${{ inputs.full }}
          BEFORE: ${{ github.event.before }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          full=false
          docs_only=false
          case "$EVENT" in
            schedule) full=true ;;
            workflow_dispatch) if [[ "$FULL_INPUT" == "true" ]]; then full=true; fi ;;
          esac
          range=""
          if [[ "$full" == false ]]; then
            case "$EVENT" in
              pull_request) range="origin/${BASE_REF}...HEAD" ;;
              push)
                # main: the squash-merge's own delta (`before` is the
                # previous main; all-zeros = ref creation, keep the gate).
                # ci/<branch>: the branch is already merged with origin/main
                # by ship, so the three-dot diff is the branch's own change.
                if [[ "$GITHUB_REF" == refs/heads/main ]]; then
                  [[ "$BEFORE" =~ ^0+$ ]] || range="${BEFORE}..HEAD"
                else
                  range="origin/main...HEAD"
                fi ;;
            esac
          fi
          if [[ -n "$range" ]]; then
            changed="$(git diff --name-only $range 2>/dev/null || true)"
            if [[ -n "$changed" ]] && ! grep -qvE '^(docs/|[^/]+\.md$)' <<<"$changed"; then
              docs_only=true
            fi
          fi
          echo "shape: event=$EVENT full=$full docs_only=$docs_only range=${range:-none}"
          echo "full=$full" >> "$GITHUB_OUTPUT"
          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      # `--all-extras`, not the bare env: mypy needs every optional dep
      # importable or it reports `import-not-found` for fastapi/markupsafe
      # (the [web] extra) and flips the `type: ignore`s guarding the asa
      # bridge to `unused-ignore`. This matches the ship gate, whose dev
      # image installs `uv sync --all-extras` — note `--extra all` is NOT
      # the same set (`asa` is deliberately outside `[all]`).
      # `catalyst`/`catalyst-gpu` are subtracted: their `autocatpath` is a
      # private-repo git source ([tool.uv.sources]; auth exists only in the
      # local keychain and the image build's gh_token secret), so an
      # unauthenticated runner can't fetch it. mypy stays sound without it
      # via the `autocatpath.*` ignore_missing_imports override; real-type
      # coverage still happens in the ship gate's dev image.
      - run: uv run --all-extras --no-extra catalyst --no-extra catalyst-gpu mypy src tests

  # Linux legs run the FULL suite against a real PostgreSQL + pgvector,
  # so the db-tagged tests (~41% of the suite) actually gate the release
  # instead of auto-skipping. GHA service containers are Linux-only,
  # hence the split from `test-other`.
  #
  # Sharded: the whole suite is ~43 min of pytest on one 4-vCPU runner
  # (CPU-bound; the same suite is ~10 min on a dev Mac), and that single
  # job set the wall-clock of every ship gate. `--shard K/N`
  # (tests/conftest.py) hashes each test id into one of N buckets, so the
  # N shard jobs partition the suite exactly and run in parallel on
  # separate runners, each with its own postgres service. Wall-clock is
  # one shard's worth (~8 min + setup). The shard count is spelled twice
  # below (matrix list + `/6`) — keep them equal.
  #
  # Gate shape runs 3.13 only; the nightly adds 3.12 (see `plan`).
  test-linux:
    needs: plan
    if: needs.plan.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    # ~10 min steady-state per shard; the cap is for hangs (a wedged test
    # would otherwise hold the runner for GitHub's 6 h default while nobody
    # is watching — this workflow is checked asynchronously).
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ needs.plan.outputs.full == 'true' && fromJSON('["3.12", "3.13"]') || fromJSON('["3.13"]') }}
        shard: [1, 2, 3, 4, 5, 6]
    services:
      postgres:
        # pgvector image so the `vector` extension is present; the
        # migration bootstrap CREATE EXTENSIONs it (plus pg_trgm,
        # btree_gist) on first apply. Pinned to pg17 to match the dev /
        # prod server major: the baseline snapshot is dumped by a pg17
        # pg_dump and emits `SET transaction_timeout = 0` (a pg17-only
        # GUC), which pg16 rejects with "unrecognized configuration
        # parameter".
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: precis_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: ${{ matrix.python-version }}
      # The runner image ships pg_dump 16, but the service is pg17 and
      # pg_dump refuses to dump a server newer than itself (aborting
      # `test_schema_convergence`). Install the matching pg17 client from
      # the PGDG repo and put it ahead on PATH so `pg_dump` resolves to
      # v17. The repo used to come preconfigured on GitHub's Ubuntu
      # images, but the noble runners no longer ship it (apt then can't
      # locate postgresql-client-17), so add it explicitly via the
      # official signed-by keyring method.
      - name: Install PostgreSQL 17 client to match the pg17 server
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"
      # Connect as the `postgres` superuser: the migration bootstrap
      # issues CREATE EXTENSION on the untrusted `vector` / `btree_gist`
      # extensions, which only a superuser may install. The conftest
      # session fixture drops + re-applies the schema, so an empty
      # `precis_test` database is all that's required here.
      #
      # Same extras set as the mypy step above (and the ship gate's dev
      # image): `--extra all` is only embed+paper+web, which leaves rdkit
      # ([chem]) out — and two tests genuinely depend on it
      # (test_nm_sugars' rdkit-primary-path assertion, and test_rxn's
      # q='CCO' search, which only matches the rdkit-CANONICALISED
      # ethanol; the raw fixture SMILES spells it OCC).
      - run: uv run --all-extras --no-extra catalyst --no-extra catalyst-gpu pytest --shard ${{ matrix.shard }}/6
        env:
          PRECIS_TEST_PG_URL: postgresql://postgres:postgres@localhost:5432/precis_test

  # Docs-only lane: replaces the shard matrix when `plan` saw nothing but
  # docs/ + root *.md. Runs the fast set (`not db and not slow`, no
  # Postgres) — that is the documented gate for a change that can't reach
  # a DB path, and it contains the doc-reading tests (doc pointers, the
  # secrets sweep, backlog front-matter). The nightly full run and the next
  # code ship cover the db-bound remainder.
  test-docs:
    needs: plan
    if: needs.plan.outputs.docs_only == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: '3.13'
      - run: uv run --all-extras --no-extra catalyst --no-extra catalyst-gpu pytest -m 'not db and not slow'

  # macOS / Windows: no service-container support, so postgres is absent
  # and the db-tagged tests auto-skip via the conftest probe. These legs
  # cover the db-less suite + platform-specific paths. Nightly only (or
  # `workflow_dispatch` with full=true) — off the ship gate since
  # 2026-09-16 so two ships fit the runner cap; `tests/test_posix_only_guards.py`
  # is the compile-time stand-in for the Windows leg.
  test-other:
    needs: plan
    if: needs.plan.outputs.full == 'true'
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, windows-latest]
        python-version: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: ${{ matrix.python-version }}
      # Same extras rationale as test-linux; every subtracted-set package
      # ships win_amd64 + macosx_arm64 wheels (checked against uv.lock),
      # and the platform-gated ones (marker-pdf, tblite) carry their own
      # environment markers.
      - run: uv run --all-extras --no-extra catalyst --no-extra catalyst-gpu pytest

  publish:
    needs: [lint, test-linux, test-other]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      # Release gate: the committed baseline snapshot must bake in every
      # migration, so a fresh install of this tagged version applies
      # schema.sql with zero tail. Regenerate with `scripts/bump` (which
      # runs `precis db dump-schema`) if this fails. See ADR 0031.
      - run: uv run python -c "from precis.store.schema_dump import assert_baseline_at_head as a; a()"
      - run: uv build
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
