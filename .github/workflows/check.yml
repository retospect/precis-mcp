name: check

on:
  push:
    # ci/** are scripts/ship --remote's pre-merge gate refs: ship pushes the
    # synced branch there, polls this workflow to conclusion, and only a
    # green run reaches main (via ship's CAS squash-push — the
    # force-with-lease rejection is the "did anything land meanwhile" check,
    # which re-syncs and re-runs this gate). A ship retry force-pushes the
    # same ref, so the per-ref concurrency group below auto-cancels the
    # superseded run.
    #
    # release/** is the round's release branch (`scripts/round cut`): every
    # push runs the full gate shape — plan never delta-scopes it — and its
    # verdict is the one the round deploys. See the concurrency note below.
    #
    # main runs the SLIM lane, not the gate: plan + lint, plus the docs lane
    # when the delta is docs-only. The shard matrix is reserved for ci/**,
    # release/**, the nightly and `full` dispatches (gr495187, Reto
    # 2026-10-23: "qland all, then one release ... only release branch gets
    # ci"). A main push's own matrix burned ~32% of all job-minutes only to
    # be displaced by the next qland push — the starvation measured in the
    # gripe. A main sha's shard verdict now comes from the release cut made
    # on it (a cut sha is a main sha, so the release gate's check-runs land
    # on it), the nightly, or a full dispatch; the qland drift guard
    # (scripts/last-gated-main-sha) counts those. The push lint still
    # catches what a sibling's ungated qland actually breaks — ruff/mypy
    # drift is the recurring red-main cause — inside minutes.
    branches: [main, 'ci/**', 'release/**']
  pull_request:
  # Nightly FULL matrix (both Pythons + macOS) on main. The ship
  # gate below runs only the 3.13 Linux legs; the platform/3.12 legs are
  # scheduled so a break there surfaces the next morning, not weeks later.
  # (The Windows leg was dropped 2026-10-17 per Reto — "nothing but
  # trouble"; the win32 skipif guards remain until a separate cleanup.)
  #
  # 05:23 UTC is this fleet's quietest hour: over the 14 days to 2026-09-18,
  # main took 6 squash-merges in the 05:00 hour and 5 in the 06:00 hour,
  # against 27 in the busiest (19:00); re-measured 2026-10-14..21 — the 05Z
  # hour held a mean 2.0 in-flight jobs and was never at the 40-job cap
  # (gr495187). The full shape is 25 jobs of the
  # account's 40 slots, so a ship gate (12) starting inside the nightly
  # still fits — the concurrency note below has the arithmetic and why the
  # nightly is never cancelled. Keep the
  # minute off :00: GitHub drops scheduled events under load, and the top of
  # the hour is where that load is.
  schedule:
    - cron: '23 5 * * *'
  # Manual lever for the check-asynchronously model: re-run on the current
  # ref without an empty commit — needed in practice because a push event
  # dropped during a GitHub incident is never replayed (scripts/ship uses it
  # bare, which yields the gate shape). `full: true` = the nightly shape.
  workflow_dispatch:
    inputs:
      full:
        description: run the full matrix (3.12 + macOS), not the ship-gate shape
        type: boolean
        default: false
      shards:
        description: force a shard count for measuring another width (floor 10; the gate is fixed 10)
        type: string
        default: ''

permissions:
  contents: read

# A RUNNING main run is never cancelled. The rule predates the slim lane —
# when a main push ran the full gate, the round deployed the newest main sha
# with a green verdict and the qland drift guard read its age; cancelling
# running main runs left 0 of 52 main commits with a verdict over
# 2026-10-03 00:00–12:00Z and hid a red ratchet for 12 h
# (backlog/release-candidate-verdicts.md). It stays because a started lint
# run is cheap and its verdict is the post-merge signal
# scripts/main-ci-status watches. `ci/**` and PR refs still cancel:
# a ship retry force-pushes the same `ci/` ref and the superseded run is
# worthless.
#
# Main pushes share ONE group with `cancel-in-progress: false`. A group admits
# one running and one pending run; a newer push replaces the pending one, so
# main is SAMPLED: every run that starts finishes, and a lint verdict lands
# about once per run on the newest sha at that moment. A displaced pending
# run's CANCELLED check-runs do not disqualify the sha either —
# scripts/last-gated-main-sha drops them, so a release gate or nightly
# verdict that lands on the same sha still counts (gr495187).
#
# Why not a run per push (the sha in the key, 2026-10-03 12:16–16:00Z): at
# fleet rate (~33 pushes/h) × 8 jobs × ~100 runner-min against the then 20-job cap
# (~12 full pushes/h), main queued 18 runs with 10–18 min queue delay, and a
# `ship --remote` gate waited behind them. Reto ruled for the shared group
# (review-queue ship-gate-ci-1, 2026-10-03); the slim lane (gr495187,
# 2026-10-23) later cut a main push to ~2 jobs, which made that queueing
# arithmetic moot — the group stays because the sampling is still right.
#
# `release/**` shares ONE group per branch with cancel-in-progress (release
# train §3): only the newest head can deploy — `round deploy` pins the green
# head and its journal refuses a `ship --release` landing mid-deploy — so a
# superseded push's run is dead weight and the fix push cancels it. A red
# verdict the newest push already replaced would only be re-derived by the
# next `plan` failed-first lookup anyway.
#
# Job budget: the account is GitHub Pro, standard-runner concurrency cap 40.
# Concurrent ci/* gates are additionally capped client-side: scripts/ship
# holds its ci/<branch> push until fewer than PRECIS_REMOTE_GATE_SLOTS (2)
# gate runs are queued or in flight (gr495187) — a group-level cap is not
# expressible here (a concurrency group keeps ONE pending run and cancels
# the rest, which a ship would read as a red gate). Every shard run is
# FIXED at 10 (Reto 2026-10-23: "10 is fine, we don't need 40. But no
# fewer" — scripts/ci-shard-plan emits it; the load-based 12 of gr492653
# is gone). A gate is 12 jobs (plan + lint + 10 shards), so three fan out
# at once and a fourth queues: a release run (12) + two harness gates (24)
# + a main-push lint run (2) = 38 <= 40. The nightly full shape is 25 jobs
# (plan + lint + coverage-db + 2 test-other + 2 Pythons x 10 shards), so
# nightly + one gate is 37 <= 40. Why not 6 or 8: measured shards
# (2026-10-16) ran 32-40 min with 6 and 32-36 min with 8 against the 40 min
# timeout-minutes (a timeout reads as 'cancelled'); identical shards differ by
# ~30% with runner speed alone, so headroom has to be bought with shards. Why
# not 12 always: 14 jobs per gate (two fit, not three) and every shard
# repeats its setup, so job-minutes per landing rise ~35% and queue throughput
# falls while the fleet saturates the cap (e94cfe674, reverted 94df07003).
# A release run is that shape plus one `failed-first` job when a prior red
# qualified.
# Balance each count by time (tests/shard_weights.json, one table per count,
# see conftest.shard_index); adding counts, shards or legs past this budget
# costs concurrent gates — re-do the arithmetic here and in
# tests/test_ci_shards.py first.
#
# The group key carries the run's SHAPE, not just the ref, so the nightly
# gets its own lane on main. Keying on the ref alone put the 18-job full
# matrix and every main push in one group, and a push cancels in progress —
# so one sibling ship landing during the nightly silently wiped that day's
# entire 3.12/macOS coverage (the Windows leg rode the same lane until it
# was dropped 2026-10-17), which is the exact failure the schedule above
# exists to prevent (gr346455; latent, never observed — ships cluster hours
# earlier). `workflow_dispatch` with full=true rides the
# same lane, so a deliberately-dispatched full run is likewise un-cancellable
# by a push. Cost of the split: the two shapes now coexist (25 + 12 per gate, one
# gate fits beside the nightly), and a gate beyond that waits rather than
# pre-empting anything (well inside ship's 150 min CI timeout, and a CAS race
# lost while queued re-runs CI per gr343941).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ (github.event_name == 'schedule' || inputs.full) && 'full' || 'gate' }}
  cancel-in-progress: ${{ github.event_name != 'schedule' && github.ref != 'refs/heads/main' }}

jobs:
  # Decides the run's shape from the event and the diff:
  #   full      — nightly schedule or `workflow_dispatch` with full=true:
  #               every leg below runs.
  #   docs_only — every changed path is under docs/ or a root *.md, so the
  #               shard matrix is replaced by one job of the fast set (the
  #               documented gate for a change that can't touch a DB path,
  #               docs/conventions/testing.md); lint + mypy still run.
  #               `src/precis/data/skills/**`, `scripts/**` and `.claude/**`
  #               are deliberately NOT docs here — skills are served and
  #               tested at runtime, scripts are executed by tests, and the
  #               .claude hooks are shell that tests exercise.
  #   lint_only — a push to main (gr495187): the shard matrix does not run.
  #               A docs-only delta still takes the docs lane.
  # Anything else is the ship-gate shape: lint + 10 shards
  # of 3.13 Linux (the `shards` step below).
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # checks: read for scripts/last-gated-main-sha's GraphQL checkSuites walk.
    # Job-level permissions replace the workflow's, so contents is restated.
    permissions:
      contents: read
      checks: read
    outputs:
      full: ${{ steps.shape.outputs.full }}
      docs_only: ${{ steps.shape.outputs.docs_only }}
      lint_only: ${{ steps.shape.outputs.lint_only }}
      shards: ${{ steps.shards.outputs.n }}
      shard_list: ${{ steps.shards.outputs.list }}
      failed_ids: ${{ steps.failed.outputs.failed_ids }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: shape
        env:
          EVENT: ${{ github.event_name }}
          FULL_INPUT: ${{ inputs.full }}
          BEFORE: ${{ github.event.before }}
          BASE_REF: ${{ github.base_ref }}
          # `scripts/last-gated-main-sha` reads check-runs per sha.
          GH_TOKEN: ${{ github.token }}
        run: |
          full=false
          docs_only=false
          lint_only=false
          case "$EVENT" in
            schedule) full=true ;;
            workflow_dispatch) if [[ "$FULL_INPUT" == "true" ]]; then full=true; fi ;;
            # The slim lane (gr495187): a main push skips the shard matrix —
            # see the `on.push` note. The range below still runs, for the
            # docs lane alone.
            push) if [[ "$GITHUB_REF" == refs/heads/main ]]; then lint_only=true; fi ;;
          esac
          range=""
          if [[ "$full" == false ]]; then
            case "$EVENT" in
              pull_request) range="origin/${BASE_REF}...HEAD" ;;
              push)
                # main: the delta since the last sha that actually got a
                # shard verdict — NOT `before`. A main run still in flight (or
                # one that went red) leaves its push with no verdict yet, and
                # main runs were cancelled outright until 2026-10-03; scoping
                # to `before` then lets
                # a docs-only push take the docs lane while main carries
                # ungated src (scripts/last-gated-main-sha closes that). Falling back to
                # `before` would re-open that hole, so an unanswerable lookup
                # means no range and no docs lane (the slim lint lane still
                # runs — under gr495187 the matrix is gone either way).
                # all-zeros `before` = ref creation, likewise keep the gate.
                # ci/<branch>: the branch is already merged with origin/main
                # by ship, so the three-dot diff is the branch's own change.
                if [[ "$GITHUB_REF" == refs/heads/main ]]; then
                  if [[ ! "$BEFORE" =~ ^0+$ ]]; then
                    # Exit 2 = walked the window, nothing green; exit 0 + empty
                    # = could not look. Both gate fully here; `|| gated=""`
                    # keeps exit 2 from failing the step under bash -e.
                    gated="$(scripts/last-gated-main-sha --start "$BEFORE")" || gated=""
                    echo "last gated main sha: ${gated:-none (full gate)}"
                    # Spelled as an `if`, not `[[ … ]] && range=…`: the step
                    # runs under `bash -e`, where a false test as the whole
                    # statement is a step failure.
                    if [[ -n "$gated" ]]; then
                      range="${gated}..HEAD"
                    fi
                  fi
                elif [[ "$GITHUB_REF" == refs/heads/release/* ]]; then
                  # The release gate is always the full shape: no range, so
                  # never docs-only. (Deferred: skip the matrix when this exact
                  # sha already has a green check.yml run — the cut sha carries
                  # main's verdict. Not worth the extra moving part yet.)
                  range=""
                else
                  range="origin/main...HEAD"
                fi ;;
            esac
          fi
          if [[ -n "$range" ]]; then
            changed="$(git diff --name-only $range 2>/dev/null || true)"
            if [[ -n "$changed" ]] && ! grep -qvE '^(docs/|[^/]+\.md$)' <<<"$changed"; then
              docs_only=true
            fi
          fi
          echo "shape: event=$EVENT full=$full docs_only=$docs_only lint_only=$lint_only range=${range:-none}"
          echo "full=$full" >> "$GITHUB_OUTPUT"
          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"
          echo "lint_only=$lint_only" >> "$GITHUB_OUTPUT"
      # Shard count: fixed 10 (see the job-budget note above);
      # FORCE_SHARDS overrides only for measuring another width, floor 10.
      - id: shards
        env:
          FORCE_SHARDS: ${{ inputs.shards }}
        run: python3 scripts/ci-shard-plan >> "$GITHUB_OUTPUT"
      # Failures first (docs/backlog/release-train.md §3): on release/**
      # pushes, the newest completed red check.yml run on this branch whose
      # shards all uploaded their junit artifact donates its failed+errored
      # node ids to `failed-first` below — a fix that does not fix then
      # costs one job (~4-6 min), not a matrix. Empty on any hole (no prior
      # red, a shard that timed out before uploading, over the cap, gh/API
      # unreadable) = straight to the full matrix.
      - id: failed
        if: startsWith(github.ref, 'refs/heads/release/')
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
        run: python3 scripts/ci-failed-first >> "$GITHUB_OUTPUT"

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      # `--all-extras`, not the bare env: mypy needs every optional dep
      # importable or it reports `import-not-found` for fastapi/markupsafe
      # (the [web] extra) and flips the `type: ignore`s guarding the asa
      # bridge to `unused-ignore`. This matches the ship gate, whose dev
      # image installs `uv sync --all-extras` — note `--extra all` is NOT
      # the same set (`asa` is deliberately outside `[all]`).
      # `catalyst`/`catalyst-gpu` are subtracted: their `autocatpath` is a
      # private-repo git source ([tool.uv.sources]; auth exists only in the
      # local keychain and the image build's gh_token secret), so an
      # unauthenticated runner can't fetch it. mypy stays sound without it
      # via the `autocatpath.*` ignore_missing_imports override; real-type
      # coverage still happens in the ship gate's dev image.
      - run: uv run --all-extras --no-extra catalyst --no-extra catalyst-gpu mypy src tests

  # Failures first (release-train §3): on release/** pushes where `plan`
  # recovered the prior red run's node ids, re-run exactly those — same legs
  # as test-linux minus the shard fan-out — before the matrix commits 10
  # runners. Its red IS the run's red: `test-linux` needs it and stays
  # skipped, and scripts/release ci_red() / scripts/round _red_above() read
  # this job's check-run. No junit upload: it is not a shard, and its
  # timings would poison tests/shard_weights.json.
  failed-first:
    needs: plan
    if: needs.plan.outputs.failed_ids != ''
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: precis_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: '3.13'
      - name: Install PostgreSQL 17 client to match the pg17 server
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"
      # Node ids can carry spaces (parametrize ids); the JSON list is split
      # by jq, never by the shell. A stale id — renamed or deleted since the
      # red run — must not red this job: a --collect-only miss or pytest's
      # exit 4/5 means "no verdict here", so the matrix decides. Real
      # failures keep exit 1.
      - run: |
          mapfile -t ids < <(jq -r '.[]' <<<"$FAILED_IDS")
          printf 'failed-first: %s\n' "${ids[@]}"
          P=(uv run --all-extras --no-extra catalyst --no-extra catalyst-gpu pytest)
          if ! "${P[@]}" --collect-only -q "${ids[@]}" >/dev/null 2>&1; then
            echo "failed-first: ids no longer collect — deferring to the matrix"
            exit 0
          fi
          rc=0
          "${P[@]}" "${ids[@]}" || rc=$?
          if [[ $rc -eq 4 || $rc -eq 5 ]]; then
            echo "failed-first: nothing to run (pytest exit $rc) — deferring to the matrix"
            rc=0
          fi
          exit "$rc"
        env:
          PRECIS_TEST_PG_URL: postgresql://postgres:postgres@localhost:5432/precis_test
          FAILED_IDS: ${{ needs.plan.outputs.failed_ids }}

  # Linux legs run the FULL suite against a real PostgreSQL + pgvector,
  # so the db-tagged tests (~41% of the suite) actually gate the release
  # instead of auto-skipping. GHA service containers are Linux-only,
  # hence the split from `test-other`.
  #
  # Sharded: the whole suite is ~43 min of pytest on one 4-vCPU runner
  # (CPU-bound; the same suite is ~10 min on a dev Mac), and that single
  # job set the wall-clock of every ship gate. `--shard K/N`
  # (tests/conftest.py) hashes each test id into one of N buckets, so the
  # N shard jobs partition the suite exactly and run in parallel on
  # separate runners, each with its own postgres service. Wall-clock is
  # one shard's worth (~8 min + setup). The count comes from the `plan`
  # job's outputs (matrix list + the `--shard K/N` denominator below).
  #
  # Gate shape runs 3.13 only; the nightly adds 3.12 (see `plan`).
  #
  # `failed-first` is a gate, not just an ordering: it must succeed (or be
  # skipped because there was nothing to re-run) before the matrix runs.
  # A status-check function in the `if` disables the implicit needs-success
  # skip — `!cancelled()`, not `always()`: always() would still start 10
  # shards after cancel-in-progress superseded the run.
  test-linux:
    needs: [plan, failed-first]
    if: >-
      !cancelled() && needs.plan.result == 'success'
      && needs.plan.outputs.docs_only != 'true'
      && needs.plan.outputs.lint_only != 'true'
      && (needs.failed-first.result == 'success'
          || needs.failed-first.result == 'skipped')
    runs-on: ubuntu-latest
    # ~10 min steady-state per shard; the cap is for hangs (a wedged test
    # would otherwise hold the runner for GitHub's 6 h default while nobody
    # is watching — this workflow is checked asynchronously).
    timeout-minutes: 40
    strategy:
      fail-fast: false
      # Nightly: cap test-linux so nightly + one gate stays <= 40 (budget above).
      max-parallel: ${{ needs.plan.outputs.full == 'true' && 20 || 10 }}
      matrix:
        python-version: ${{ needs.plan.outputs.full == 'true' && fromJSON('["3.12", "3.13"]') || fromJSON('["3.13"]') }}
        shard: ${{ fromJSON(needs.plan.outputs.shard_list) }}
    services:
      postgres:
        # pgvector image so the `vector` extension is present; the
        # migration bootstrap CREATE EXTENSIONs it (plus pg_trgm,
        # btree_gist) on first apply. Pinned to pg17 to match the dev /
        # prod server major: the baseline snapshot is dumped by a pg17
        # pg_dump and emits `SET transaction_timeout = 0` (a pg17-only
        # GUC), which pg16 rejects with "unrecognized configuration
        # parameter".
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: precis_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # JS-under-pytest tests (SE view state, topology cloud, CAD
      # parity, pathway detail) need node; with CI=true a missing node fails
      # them (tests/_node.py). 24 = current LTS; no repo file pins a major.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: ${{ matrix.python-version }}
      # The runner image ships pg_dump 16, but the service is pg17 and
      # pg_dump refuses to dump a server newer than itself (aborting
      # `test_schema_convergence`). Install the matching pg17 client from
      # the PGDG repo and put it ahead on PATH so `pg_dump` resolves to
      # v17. The repo used to come preconfigured on GitHub's Ubuntu
      # images, but the noble runners no longer ship it (apt then can't
      # locate postgresql-client-17), so add it explicitly via the
      # official signed-by keyring method.
      - name: Install PostgreSQL 17 client to match the pg17 server
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"
      # Connect as the `postgres` superuser: the migration bootstrap
      # issues CREATE EXTENSION on the untrusted `vector` / `btree_gist`
      # extensions, which only a superuser may install. The conftest
      # session fixture drops + re-applies the schema, so an empty
      # `precis_test` database is all that's required here.
      #
      # Same extras set as the mypy step above (and the ship gate's dev
      # image): `--extra all` is only embed+paper+web, which leaves rdkit
      # ([chem]) out — and two tests genuinely depend on it
      # (test_nm_sugars' rdkit-primary-path assertion, and test_rxn's
      # q='CCO' search, which only matches the rdkit-CANONICALISED
      # ethanol; the raw fixture SMILES spells it OCC).
      - run: uv run --all-extras --no-extra catalyst --no-extra catalyst-gpu pytest --shard ${{ matrix.shard }}/${{ needs.plan.outputs.shards }} --junitxml=junit.xml
        env:
          PRECIS_TEST_PG_URL: postgresql://postgres:postgres@localhost:5432/precis_test
      # Per-test timings for scripts/shard-weights (a finished shard only; a
      # timed-out one writes nothing). Short retention: it is a rebalancing input.
      - if: always() && matrix.python-version == '3.13'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: junit-${{ needs.plan.outputs.shards }}-${{ matrix.shard }}
          path: junit.xml
          retention-days: 7
          if-no-files-found: ignore

  # Docs-only lane: replaces the shard matrix when `plan` saw nothing but
  # docs/ + root *.md. Runs the fast set (`not db and not slow`, no
  # Postgres) — that is the documented gate for a change that can't reach
  # a DB path, and it contains the doc-reading tests (doc pointers, the
  # secrets sweep, backlog front-matter). The nightly full run and the next
  # code ship cover the db-bound remainder.
  test-docs:
    needs: plan
    if: needs.plan.outputs.docs_only == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      # gr496666: `-n auto` was NEVER missing — addopts already carries it,
      # and the cancelled runs (39143473087, 39147024961) show "2/2 workers"
      # on the 2-vCPU runner doing 24,622 items to ~90% in 30 min. So the
      # real deficit is one job's worth of cores, not xdist — split the fast
      # set the same way test-linux does, over `--shard K/N` (tests/conftest.py
      # crc32 partitions exactly; shard_weights has no table for n=4, which
      # only means the slow-test rebalance doesn't apply here — the fast set
      # deselects `slow` anyway). The count is spelled twice, keep them equal.
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # JS-under-pytest tests (SE view state, topology cloud, CAD
      # parity, pathway detail) need node; with CI=true a missing node fails
      # them (tests/_node.py). 24 = current LTS; no repo file pins a major.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: '3.13'
      - run: uv run --all-extras --no-extra catalyst --no-extra catalyst-gpu pytest --shard ${{ matrix.shard }}/4 -m 'not db and not slow'

  # Nightly per-test coverage DB — the measured tier for
  # scripts/impacted-tests (ship --checked / test --selected today; a
  # future release lane once the selector has a track record). The whole
  # suite runs once, unsharded, with `--cov-context=test` so coverage
  # records which test touched which line; scripts/lib/coverage_manifest.py
  # then hashes every measured file into .coverage.precis.json (freshness +
  # base-blob verification), and both files go up as the
  # `precis-coverage-db` artifact that the selector's --fetch-db downloads.
  # ~suite wall-clock on one runner is fine at 05:23 — not on the gate path.
  coverage-db:
    if: github.event_name == 'schedule' || inputs.full == true
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: precis_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # JS-under-pytest tests (SE view state, topology cloud, CAD
      # parity, pathway detail) need node; with CI=true a missing node fails
      # them (tests/_node.py). 24 = current LTS; no repo file pins a major.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: '3.13'
      - name: Install PostgreSQL 17 client to match the pg17 server
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"
      - run: >-
          uv run --all-extras --no-extra catalyst --no-extra catalyst-gpu
          pytest -n 6 --cov=src --cov-context=test --cov-report=
        env:
          PRECIS_TEST_PG_URL: postgresql://postgres:postgres@localhost:5432/precis_test
      - run: uv run python scripts/lib/coverage_manifest.py .coverage
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: precis-coverage-db
          path: |
            .coverage
            .coverage.precis.json
          retention-days: 3

  # macOS: no service-container support, so postgres is absent and the
  # db-tagged tests auto-skip via the conftest probe. This leg covers the
  # db-less suite + platform-specific paths. Nightly only (or
  # `workflow_dispatch` with full=true) — off the ship gate since
  # 2026-09-16 so two ships fit the runner cap (then 20 slots; now 40, Pro).
  # The Windows leg was dropped 2026-10-17 per Reto ("nothing but trouble");
  # tests/test_posix_only_guards.py still walks the win32 skipif guards,
  # which remain until a separate cleanup removes them.
  test-other:
    needs: plan
    if: needs.plan.outputs.full == 'true'
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest]
        python-version: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # JS-under-pytest tests (SE view state, topology cloud, CAD
      # parity, pathway detail) need node; with CI=true a missing node fails
      # them (tests/_node.py). 24 = current LTS; no repo file pins a major.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: ${{ matrix.python-version }}
      # Same extras rationale as test-linux; every subtracted-set package
      # ships macosx_arm64 wheels (checked against uv.lock),
      # and the platform-gated ones (marker-pdf, tblite) carry their own
      # environment markers.
      - run: uv run --all-extras --no-extra catalyst --no-extra catalyst-gpu pytest

  publish:
    needs: [lint, test-linux, test-other]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      # Release gate: the committed baseline snapshot must bake in every
      # migration, so a fresh install of this tagged version applies
      # schema.sql with zero tail. Regenerate with `scripts/bump` (which
      # runs `precis db dump-schema`) if this fails. See ADR 0031.
      - run: uv run python -c "from precis.store.schema_dump import assert_baseline_at_head as a; a()"
      - run: uv build
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
