# precis-mcp dev/test stack — the local dev-loop compose file.
#
# Checked into the repo so a fresh clone needs no external `~/work`
# layout. The dev-loop scripts default to this file (resolved relative to
# their own location); override with $PRECIS_COMPOSE if you run a
# different / shared stack. It defines just the two services the loop
# needs:
#
#   scripts/test   → `compose --profile dev up -d --wait precis-test-db`
#                    then `compose run --rm --no-deps -v <wt>:/app precis-dev …`
#   scripts/ship   → same test-db, then the gate. It first tries a warm
#                    `precis-gate` service (undefined here → it prints a
#                    WARNING and falls back to the per-run `precis-dev`
#                    bind-mount, which is fine).
#   scripts/build-image precis-dev → `docker compose build precis-dev`
#
# Prod is remote (caspar, over SSH); nothing here touches it.
services:
  # pgvector test DB, reached by service name over the compose network as
  # postgresql://postgres@precis-test-db:5432/precis_test.
  #
  # pgdata lives on the container overlay (158GB), NOT a tmpfs. An unsized
  # tmpfs caps at 50% of host RAM = ~3.9GB on the 8GB colima VM, and CONCURRENT
  # -n6 ship gates across sibling worktrees clone the template DB per worker
  # and overflow it → `DiskFull` / postgres crash / "recovery mode" (gr176231).
  # Sizing the tmpfs bigger than RAM would just move the failure to an OOM, so
  # we back it with unbounded disk instead. fsync / full_page_writes /
  # synchronous_commit are off so a throwaway test DB stays near memory-speed
  # despite being disk-backed — crash-safety is irrelevant for a DB that's
  # rebuilt from migrations on every run.
  precis-test-db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: precis_test
      POSTGRES_HOST_AUTH_METHOD: trust
    command:
      - postgres
      - -c
      - fsync=off
      - -c
      - full_page_writes=off
      - -c
      - synchronous_commit=off
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d precis_test"]
      interval: 2s
      timeout: 3s
      retries: 40
    # No published host port — the gate reaches it over the compose network.

  # The dev image (torch + all extras + Marker/bge-m3 model cache baked).
  # Built from the repo Dockerfile's `dev` stage. scripts bind-mount the
  # current worktree at /app at run time, overriding the baked source.
  # USER precis is uid 501 / gid 20 (Dockerfile ARG defaults) = the host
  # macOS user, so bind-mount writes (ruff --fix, .testmondata) map cleanly.
  #
  # Build context is `../..` — the repo root relative to this file — so the
  # image builds from whichever worktree/checkout holds this compose file,
  # with no absolute host path baked in.
  precis-dev:
    image: precis-dev
    build:
      context: ../..
      dockerfile: docker/Dockerfile
      target: dev
    working_dir: /app
