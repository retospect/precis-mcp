# precis-mcp dev/test stack — the local dev-loop compose file.
#
# Checked into the repo so a fresh clone needs no external `~/work`
# layout. The dev-loop scripts default to this file (resolved relative to
# their own location); override with $PRECIS_COMPOSE if you run a
# different / shared stack. It defines just the two services the loop
# needs:
#
#   scripts/test   → `compose --profile dev up -d --wait precis-test-db`
#                    then `compose run --rm --no-deps -v <wt>:/app precis-dev …`
#   scripts/ship   → same test-db, then the warm `precis-gate` service
#                    below. If it can't come up healthy, ship prints a
#                    WARNING and falls back to the per-run `precis-dev`
#                    bind-mount, which is slower but correct.
#   scripts/build-image precis-dev → `docker compose build precis-dev`
#
# Prod is remote (caspar, over SSH); nothing here touches it.
services:
  # pgvector test DB, reached by service name over the compose network as
  # postgresql://postgres@precis-test-db:5432/precis_test.
  #
  # pgdata lives on the container overlay (158GB), NOT a tmpfs. An unsized
  # tmpfs caps at 50% of host RAM = ~3.9GB on the 8GB colima VM, and CONCURRENT
  # -n6 ship gates across sibling worktrees clone the template DB per worker
  # and overflow it → `DiskFull` / postgres crash / "recovery mode" (gr176231).
  # Sizing the tmpfs bigger than RAM would just move the failure to an OOM, so
  # we back it with unbounded disk instead. fsync / full_page_writes /
  # synchronous_commit are off so a throwaway test DB stays near memory-speed
  # despite being disk-backed — crash-safety is irrelevant for a DB that's
  # rebuilt from migrations on every run.
  # init: true — without it postgres runs as PID 1 and REAPS ORPHANS. A
  # healthcheck that hits its timeout under -n6 suite load gets its shell
  # killed; the orphaned pg_isready reparents to the postmaster and exits 2
  # ("no response"), which the postmaster reads as a crashed backend →
  # kills every connection → the rest of the suite errors out in recovery
  # mode (the 2026-08-04 all-red gates; same family as gr176231). tini as
  # PID 1 absorbs strays. The exec-form healthcheck (no CMD-SHELL) removes
  # the orphaning intermediary too, and the 10s timeout stops the check
  # from being killed mid-flight just because the DB is busy.
  precis-test-db:
    image: pgvector/pgvector:pg17
    init: true
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: precis_test
      POSTGRES_HOST_AUTH_METHOD: trust
    command:
      - postgres
      - -c
      - fsync=off
      - -c
      - full_page_writes=off
      - -c
      - synchronous_commit=off
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "precis_test"]
      interval: 2s
      timeout: 10s
      retries: 40
    # No published host port — the gate reaches it over the compose network.

  # The dev image (torch + all extras + Marker/bge-m3 model cache baked).
  # Built from the repo Dockerfile's `dev` stage. scripts bind-mount the
  # current worktree at /app at run time, overriding the baked source.
  # USER precis is uid 501 / gid 20 (Dockerfile ARG defaults) = the host
  # macOS user, so bind-mount writes (ruff --fix, .testmondata) map cleanly.
  #
  # Build context is `../..` — the repo root relative to this file — so the
  # image builds from whichever worktree/checkout holds this compose file,
  # with no absolute host path baked in.
  precis-dev:
    image: precis-dev
    build:
      context: ../..
      dockerfile: docker/Dockerfile
      target: dev
      # Seed the models stage from the local :premodels tag so a dep bump
      # doesn't cascade into a ~3.8 GB model re-bake (models sits downstream
      # of deps). scripts/build-image guarantees the tag exists before
      # building; without this the Dockerfile's `FROM scratch AS premodels`
      # placeholder wins and bake-models.py refetches everything.
      additional_contexts:
        premodels: docker-image://precis-mcp:premodels
      # GitHub token for the autocatpath layer — the catpath repo is
      # private, so an unauthenticated `git fetch` inside the build fails.
      # scripts/build-image exports GH_TOKEN (from `gh auth token`); a
      # BuildKit secret never lands in an image layer. Empty is fine when
      # the repo is reachable anonymously.
      secrets:
        - gh_token
    working_dir: /app

  # Warm gate container (scripts/ship). Long-lived across ships, and
  # DELIBERATELY has no /app bind mount: ship tar-syncs `git archive HEAD`
  # into this container's native overlay FS, so imports and collection run at
  # native speed. Over the virtiofs bind mount 6+ xdist workers each re-read
  # the whole tree and self-serialise to ~2x parallelism (the ~73s ceiling).
  # Same image as precis-dev, so this costs no extra build. The image
  # ENTRYPOINT is already tini, so `sleep infinity` runs as its child and
  # signals are handled — no `init: true` needed.
  #
  # Caches live on a named volume under the image's own $HOME/.cache. That
  # path EXISTS in the image owned by `precis`, so a fresh volume inherits
  # that ownership; a volume mounted on a path absent from the image would be
  # root-owned and unwritable by the exec user. They are deliberately NOT
  # under /app, which sync_to_container wipes on every ship — keeping them
  # outside is what makes mypy incremental across ships.
  #
  # PRECIS_TEST_PG_URL is set HERE because ship's warm path execs without
  # passing TEST_DB_ENV (only the bind fallback passes it). Without this the
  # warm gate would quietly gate against the host DB instead of the
  # co-located RAM one. depends_on keeps that honest: if the test DB isn't
  # healthy this service never becomes healthy, `up --wait` fails, and ship
  # falls back to the bind gate rather than gating against a DB that moved.
  #
  # The healthcheck asserts what ship actually needs — /app and the cache dir
  # WRITABLE by the exec user — so a container that starts but cannot be
  # written to fails `--wait` and degrades to the bind gate, instead of
  # stranding the ship in a half-usable warm container.
  precis-gate:
    image: precis-dev
    working_dir: /app
    command: ["sleep", "infinity"]
    depends_on:
      precis-test-db:
        condition: service_healthy
    environment:
      PRECIS_TEST_PG_URL: postgresql://postgres@precis-test-db:5432/precis_test
      MYPY_CACHE_DIR: /home/precis/.cache/mypy
      RUFF_CACHE_DIR: /home/precis/.cache/ruff
    volumes:
      - gate-cache:/home/precis/.cache
    healthcheck:
      test:
        - CMD
        - sh
        - -c
        - >-
          test -w /app && mkdir -p "$$MYPY_CACHE_DIR" "$$RUFF_CACHE_DIR"
          && test -w "$$MYPY_CACHE_DIR"
      interval: 2s
      timeout: 10s
      retries: 20

volumes:
  # Compose namespaces this by project name, and scripts/ship derives the
  # project from the worktree — so sibling worktrees get their own gate cache
  # and can never corrupt each other's mypy state.
  gate-cache:

secrets:
  gh_token:
    environment: GH_TOKEN
